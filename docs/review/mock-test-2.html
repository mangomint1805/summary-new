<script>window.MT={"n":2,"part":5,"partName":"Part 5","sub":"Incomplete Sentences · Hoàn thành câu · 30 câu (101–130)","intro":"Trang này chữa <b>Mock Test 2 (Part 5)<\/b>. Mỗi câu có một chỗ trống, chọn từ đúng để điền. <b>Cách học:<\/b> tự chọn đáp án trước → đọc giải thích → ghi lại dạng câu (🔑) vào vở. Câu nào sai thì làm lại sau vài ngày.","stepsTitle":"Cách làm Part 5: 3 bước","steps":["<b>Nhìn 4 đáp án trước.<\/b> Nếu cùng gốc từ khác đuôi (safe, safety, safely…) là câu <b>từ loại<\/b>: không cần dịch cả câu. Nếu là đại từ (he, him, his, himself) thì xem vị trí. Nếu 4 từ khác nghĩa là câu <b>từ vựng<\/b>: phải hiểu nghĩa.","<b>Nhìn từ đứng trước và sau chỗ trống.<\/b> Trước danh từ → tính từ. Sau giới từ, sau the/a/his → danh từ. Trước động từ → chủ ngữ (he, we). Câu đã đủ → trạng từ -ly.","<b>Kiểm tra số ít / số nhiều và nghĩa.<\/b> every + số ít, all + số nhiều; động từ is/are phải khớp. Hai đáp án cùng là danh từ thì chọn theo nghĩa câu (thang cuốn hay sự leo thang?)."],"hideOpts":false,"qviAfter":true,"groups":[{"title":"Câu 101–105","tag":"Đại từ · Lượng từ · Từ loại","qs":[{"n":101,"q":"You and Jane use the same accounting programs, but _______ is a newer version.","qvi":"Anh và Jane dùng cùng các chương trình kế toán, nhưng (của cô ấy) là phiên bản mới hơn.","opts":[{"t":"her","vi":"của cô ấy (cần danh từ đi sau)"},{"t":"hers","vi":"cái của cô ấy (đại từ sở hữu)"},{"t":"she","vi":"cô ấy (chủ ngữ)"},{"t":"she’s","vi":"cô ấy là (she is)"}],"ans":["B"],"key":"Không có danh từ phía sau → đại từ sở hữu: hers = her program","ex":"Chỗ trống làm chủ ngữ cho <b>is<\/b> và phía sau không có danh từ, nên cần đại từ sở hữu <b>hers<\/b> (= her program: chương trình của cô ấy). (A) <b>her<\/b> phải đi kèm danh từ (her program). (C) <b>she<\/b> thì sai nghĩa: \"cô ấy là một phiên bản mới hơn\". (D) <b>she's<\/b> = she is, ghép vào thành \"she is is\" nên sai."},{"n":102,"q":"For reasons of _______, anyone entering the construction area must wear a hard hat.","qvi":"Vì lý do (an toàn), bất kỳ ai vào khu vực công trường đều phải đội mũ bảo hộ.","opts":[{"t":"safety","vi":"sự an toàn (danh từ)"},{"t":"safe","vi":"an toàn (tính từ)"},{"t":"safely","vi":"một cách an toàn (trạng từ)"},{"t":"safer","vi":"an toàn hơn (so sánh hơn)"}],"ans":["A"],"key":"Sau giới từ (of) cần danh từ · for reasons of safety = vì lý do an toàn","ex":"Chỗ trống đứng sau giới từ <b>of<\/b> nên cần danh từ: <b>safety<\/b> (sự an toàn). (B) safe và (D) safer là tính từ, (C) safely là trạng từ: không đứng một mình sau giới từ được. Cụm <b>for reasons of safety / for safety reasons<\/b> rất hay gặp."},{"n":103,"q":"All of _______ are available online more cheaply than here at this store.","qvi":"Tất cả (những món này) đều có bán trên mạng rẻ hơn ở cửa hàng này.","opts":[{"t":"that","vi":"cái đó (số ít)"},{"t":"they","vi":"chúng (chủ ngữ)"},{"t":"these","vi":"những cái này (số nhiều)"},{"t":"none","vi":"không cái nào"}],"ans":["C"],"key":"All of + these/them (số nhiều) · sau of không dùng đại từ chủ ngữ","ex":"Sau giới từ <b>of<\/b> không dùng đại từ chủ ngữ, nên loại (B) <b>they<\/b> (phải là them). Động từ là <b>are<\/b> (số nhiều) nên loại (A) <b>that<\/b> (số ít). (D) \"all of none\" vô nghĩa. Chỉ còn <b>these<\/b>: những món này."},{"n":104,"q":"The company was expecting many complaints from customers about the mistake, but there were _______.","qvi":"Công ty đã chờ đợi nhiều lời phàn nàn từ khách hàng về lỗi đó, nhưng (không có lời nào cả).","opts":[{"t":"no","vi":"không (phải có danh từ sau)"},{"t":"another","vi":"một cái khác"},{"t":"one","vi":"một cái"},{"t":"none","vi":"không cái nào"}],"ans":["D"],"key":"Cuối câu, không có danh từ sau → none (= no + danh từ)","ex":"Chỗ trống ở cuối câu, phía sau không có danh từ, nên cần <b>none<\/b> (= no complaints: không có lời phàn nàn nào). (A) <b>no<\/b> phải đi với danh từ (no complaints). (B) another và (C) one là số ít, không hợp với <b>were<\/b>, và sai ý \"nhưng\" (đối lập với \"nhiều\")."},{"n":105,"q":"_______ who are interested in joining the planning committee should talk to Jane in personnel.","qvi":"(Những ai) quan tâm đến việc tham gia ban kế hoạch nên nói chuyện với Jane ở phòng nhân sự.","opts":[{"t":"This","vi":"cái này / người này"},{"t":"That","vi":"cái kia / người kia"},{"t":"Those","vi":"những người (Those who)"},{"t":"These","vi":"những cái này"}],"ans":["C"],"key":"Those who + động từ = những người mà…","ex":"<b>Those who<\/b> là cụm cố định nghĩa là \"những người mà\". Động từ phía sau là <b>are<\/b> (số nhiều) nên loại (A) This và (B) That (số ít). (D) These không đi với who để chỉ người chung chung như vậy, nên (C) <b>Those<\/b> là đúng."}]},{"title":"Câu 106–110","tag":"Đại từ · Trạng từ · Mạo từ","qs":[{"n":106,"q":"Here at LifeLine Insurance, _______ ensure that our customers pay the best rates for the most comprehensive services.","qvi":"Tại Bảo hiểm LifeLine, (chúng tôi) đảm bảo khách hàng của mình trả mức phí tốt nhất cho dịch vụ toàn diện nhất.","opts":[{"t":"we","vi":"chúng tôi (chủ ngữ)"},{"t":"us","vi":"chúng tôi (tân ngữ)"},{"t":"our","vi":"của chúng tôi (cần danh từ sau)"},{"t":"ours","vi":"cái của chúng tôi"}],"ans":["A"],"key":"Trước động từ (ensure) cần đại từ chủ ngữ: we","ex":"Chỗ trống đứng ngay trước động từ <b>ensure<\/b> nên cần chủ ngữ: <b>we<\/b>. (B) us là tân ngữ, chỉ đứng sau động từ / giới từ. (C) our phải có danh từ đi sau. (D) ours là đại từ sở hữu, sai nghĩa (\"cái của chúng tôi đảm bảo\")."},{"n":107,"q":"The manager _______ called the supplier to ask why the shipment was running late.","qvi":"Chính bà quản lý (tự mình) đã gọi cho nhà cung cấp để hỏi vì sao lô hàng bị trễ.","opts":[{"t":"her","vi":"bà ấy (tân ngữ / sở hữu)"},{"t":"hers","vi":"cái của bà ấy"},{"t":"she","vi":"bà ấy (chủ ngữ)"},{"t":"herself","vi":"chính bà ấy, tự bà ấy"}],"ans":["D"],"key":"Danh từ + himself/herself = chính người đó (nhấn mạnh)","ex":"Câu đã có chủ ngữ <b>The manager<\/b> và động từ <b>called<\/b>, nên chỗ trống chỉ để nhấn mạnh: <b>herself<\/b> = chính bà ấy (tự gọi, không nhờ ai). (C) <b>she<\/b> làm câu có hai chủ ngữ liền nhau. (A) her và (B) hers không đứng ở vị trí này."},{"n":108,"q":"As the owner, _______ is ultimately responsible for the success or failure of his company.","qvi":"Là chủ sở hữu, (ông ấy) chịu trách nhiệm cuối cùng cho sự thành công hay thất bại của công ty mình.","opts":[{"t":"he","vi":"anh ấy, ông ấy"},{"t":"she","vi":"cô ấy, bà ấy"},{"t":"it","vi":"nó"},{"t":"we","vi":"chúng tôi"}],"ans":["A"],"key":"Đại từ phải khớp với his (nam, số ít) → he","ex":"Cuối câu có <b>his company<\/b> (công ty của ông ấy), nên chủ ngữ phải là nam, số ít: <b>he<\/b>. (B) she là nữ, không khớp với his. (C) it dùng cho vật, không phải người chủ. (D) we là số nhiều, không đi với <b>is<\/b>."},{"n":109,"q":"Maria designed the new company brochures _______.","qvi":"Maria đã thiết kế các tờ giới thiệu mới của công ty (một cách nhanh chóng).","opts":[{"t":"quickly","vi":"một cách nhanh chóng (trạng từ)"},{"t":"quickness","vi":"sự nhanh nhẹn (danh từ)"},{"t":"quicken","vi":"làm nhanh hơn (động từ)"},{"t":"quickening","vi":"đang làm nhanh hơn (V-ing)"}],"ans":["A"],"key":"Câu đã đủ (chủ ngữ + động từ + tân ngữ) → thêm trạng từ -ly","ex":"Câu đã đủ thành phần: <b>Maria<\/b> (chủ ngữ) + <b>designed<\/b> (động từ) + <b>the new company brochures<\/b> (tân ngữ). Chỗ trống ở cuối chỉ thêm ý \"làm như thế nào\", nên cần trạng từ <b>quickly<\/b>. (B) danh từ, (C) và (D) là động từ: không đặt ở đây được."},{"n":110,"q":"Market research, performed before you even ask for a bank loan, is _______ part of establishing a successful business.","qvi":"Nghiên cứu thị trường, được thực hiện trước cả khi bạn xin vay ngân hàng, là (một phần thiết yếu) của việc xây dựng một doanh nghiệp thành công.","opts":[{"t":"essential","vi":"thiết yếu (thiếu mạo từ)"},{"t":"that essential","vi":"phần thiết yếu đó"},{"t":"an essential","vi":"một phần thiết yếu"},{"t":"this essential","vi":"phần thiết yếu này"}],"ans":["C"],"key":"Danh từ đếm được số ít (part) cần a/an · an + nguyên âm (essential)","ex":"<b>part<\/b> là danh từ đếm được số ít nên phải có mạo từ đứng trước: loại (A). Câu đang giới thiệu một ý chung, chưa nhắc trước đó, nên dùng <b>an<\/b> (essential bắt đầu bằng nguyên âm e). (B) that và (D) this dùng khi chỉ một thứ cụ thể đã nói tới, ở đây không hợp nghĩa."}]},{"title":"Câu 111–115","tag":"Lượng từ · Đại từ · Từ vựng","qs":[{"n":111,"q":"It is our company’s wish that _______ employee perform at least 4 hours of community service per year.","qvi":"Công ty chúng tôi mong muốn (mỗi) nhân viên thực hiện ít nhất 4 giờ phục vụ cộng đồng mỗi năm.","opts":[{"t":"all","vi":"tất cả (+ danh từ số nhiều)"},{"t":"very","vi":"rất (trạng từ)"},{"t":"most","vi":"hầu hết (+ danh từ số nhiều)"},{"t":"every","vi":"mỗi, mọi (+ danh từ số ít)"}],"ans":["D"],"key":"every + danh từ số ít (every employee) · all/most + số nhiều","ex":"Danh từ sau chỗ trống là <b>employee<\/b> (số ít, không có -s). Chỉ <b>every<\/b> đi với danh từ số ít. (A) all và (C) most phải đi với số nhiều (all employees). (B) very là trạng từ \"rất\", đi với tính từ, không đi với danh từ."},{"n":112,"q":"The _______ information available on the mysterious offshore company frustrated investigators looking into the fraud.","qvi":"(Rất ít) thông tin có được về công ty nước ngoài bí ẩn đó đã khiến các điều tra viên đang tìm hiểu vụ lừa đảo bực bội.","opts":[{"t":"little","vi":"ít (không đếm được)"},{"t":"a little","vi":"một ít (không đứng sau the)"},{"t":"few","vi":"ít (đếm được)"},{"t":"many","vi":"nhiều (đếm được)"}],"ans":["A"],"key":"information không đếm được → little · the little = ít ỏi","ex":"<b>information<\/b> là danh từ không đếm được, nên loại (C) few và (D) many (dùng cho danh từ đếm được). (B) <b>a little<\/b> không đứng sau <b>The<\/b> được. Còn (A) <b>little<\/b>: thông tin ít ỏi, nên điều tra viên mới bực bội. Ý nghĩa cũng khớp."},{"n":113,"q":"The company had the _______ support of the board when deciding to merge with their rival company.","qvi":"Công ty có được sự ủng hộ (hoàn toàn) của hội đồng quản trị khi quyết định sáp nhập với công ty đối thủ.","opts":[{"t":"completely","vi":"một cách hoàn toàn (trạng từ)"},{"t":"complete","vi":"hoàn toàn, trọn vẹn (tính từ)"},{"t":"completed","vi":"đã hoàn thành (V3)"},{"t":"completes","vi":"hoàn thành (động từ)"}],"ans":["B"],"key":"the + ___ + danh từ → tính từ","ex":"Chỗ trống đứng giữa <b>the<\/b> và danh từ <b>support<\/b> nên cần tính từ: <b>complete<\/b> (trọn vẹn, hoàn toàn). (A) completely là trạng từ. (D) completes là động từ. (C) completed nghĩa là \"đã được làm xong\", không hợp với \"sự ủng hộ\"."},{"n":114,"q":"The company scarcely had enough money to remain solvent and could not pay _______ employees.","qvi":"Công ty hầu như không đủ tiền để duy trì khả năng thanh toán và không thể trả lương cho nhân viên (của mình).","opts":[{"t":"them","vi":"họ (tân ngữ)"},{"t":"his","vi":"của anh ấy"},{"t":"its","vi":"của nó (công ty)"},{"t":"it","vi":"nó"}],"ans":["C"],"key":"Trước danh từ cần tính từ sở hữu · company → its","ex":"Chỗ trống đứng trước danh từ <b>employees<\/b> nên cần tính từ sở hữu. Người chủ là <b>The company<\/b> (vật, số ít) nên dùng <b>its<\/b>. (B) his dùng cho người nam. (A) them và (D) it là tân ngữ, không đứng trước danh từ."},{"n":115,"q":"Money is _______ from that account to our business accounts the 10th of every month.","qvi":"Tiền được (chuyển) từ tài khoản đó sang các tài khoản kinh doanh của chúng tôi vào ngày 10 hằng tháng.","opts":[{"t":"remitted","vi":"được chuyển (tiền)"},{"t":"turned back","vi":"quay lại, trả lại"},{"t":"put","vi":"đặt, để"},{"t":"handed in","vi":"nộp (bài, đơn)"}],"ans":["A"],"key":"remit money = chuyển tiền (từ vựng)","ex":"Câu nói về tiền đi <b>from<\/b> tài khoản này <b>to<\/b> tài khoản kia, nên cần nghĩa \"chuyển tiền\": <b>remitted<\/b>. (B) turned back = quay lại. (C) put = đặt, để (không đi với from…to như vậy). (D) handed in = nộp bài, nộp đơn. Đây là câu từ vựng: 4 đáp án khác nghĩa nên phải hiểu nghĩa."}]},{"title":"Câu 116–120","tag":"Đại từ · Từ loại","qs":[{"n":116,"q":"The president, Naoki Mitsumi, asked that _______ be the one to announce the new product.","qvi":"Chủ tịch Naoki Mitsumi yêu cầu rằng (ông ấy) là người công bố sản phẩm mới.","opts":[{"t":"his","vi":"của ông ấy"},{"t":"him","vi":"ông ấy (tân ngữ)"},{"t":"he","vi":"ông ấy (chủ ngữ)"},{"t":"himself","vi":"chính ông ấy"}],"ans":["C"],"key":"Sau that là mệnh đề mới → cần chủ ngữ: he (asked that he be…)","ex":"Sau <b>asked that<\/b> là một mệnh đề mới, chỗ trống đứng trước động từ <b>be<\/b> nên cần đại từ chủ ngữ: <b>he<\/b>. (B) him và (D) himself không làm chủ ngữ được, (A) his phải có danh từ sau. Lưu ý: sau ask/suggest/recommend that, động từ để nguyên mẫu (be), không chia is."},{"n":117,"q":"She loves him because of his _______.","qvi":"Cô ấy yêu anh ấy vì sự (tốt bụng) của anh ấy.","opts":[{"t":"kindness","vi":"sự tốt bụng (danh từ)"},{"t":"kindly","vi":"một cách tử tế (trạng từ)"},{"t":"kind","vi":"tốt bụng (tính từ)"},{"t":"kinds","vi":"các loại (số nhiều của kind = loại)"}],"ans":["A"],"key":"Sau tính từ sở hữu (his) cần danh từ · đuôi -ness = danh từ","ex":"Sau <b>his<\/b> cần danh từ: <b>kindness<\/b> (sự tốt bụng, đuôi -ness là danh từ). (B) kindly là trạng từ, (C) kind là tính từ. (D) kinds cũng là danh từ nhưng nghĩa là \"các loại\", không hợp nghĩa: đây là bẫy."},{"n":118,"q":"Employees have to use the stairway because the _______ is being repaired.","qvi":"Nhân viên phải đi cầu thang bộ vì (thang cuốn) đang được sửa.","opts":[{"t":"escalate","vi":"leo thang, tăng lên (động từ)"},{"t":"escalator","vi":"thang cuốn (danh từ chỉ vật)"},{"t":"escalation","vi":"sự leo thang, sự tăng mạnh (danh từ)"},{"t":"escalating","vi":"đang leo thang (V-ing)"}],"ans":["B"],"key":"the + ___ + is → danh từ · chọn đúng nghĩa: escalator = thang cuốn","ex":"Sau <b>the<\/b> và trước <b>is<\/b> cần danh từ: còn (B) escalator và (C) escalation. Thứ \"đang được sửa\" khiến nhân viên phải đi <b>cầu thang bộ<\/b> là <b>thang cuốn<\/b>: escalator. Escalation là \"sự leo thang\" (căng thẳng, giá cả), không sửa được."},{"n":119,"q":"Interviews at the _______ company don’t come very often.","qvi":"Các cuộc phỏng vấn ở công ty (quốc gia) không thường xuyên diễn ra.","opts":[{"t":"nation","vi":"quốc gia, đất nước (danh từ)"},{"t":"nationality","vi":"quốc tịch (danh từ)"},{"t":"nationally","vi":"trên toàn quốc (trạng từ)"},{"t":"national","vi":"thuộc quốc gia (tính từ)"}],"ans":["D"],"key":"the + ___ + danh từ → tính từ · đuôi -al = tính từ","ex":"Chỗ trống đứng giữa <b>the<\/b> và danh từ <b>company<\/b> nên cần tính từ: <b>national<\/b> (đuôi -al). (A) nation và (B) nationality là danh từ, (C) nationally là trạng từ."},{"n":120,"q":"We didn’t _______ understand the teacher’s instructions.","qvi":"Chúng tôi đã không hiểu (hoàn toàn) hướng dẫn của giáo viên.","opts":[{"t":"complete","vi":"hoàn thành / đầy đủ"},{"t":"more complete","vi":"đầy đủ hơn"},{"t":"completely","vi":"một cách hoàn toàn (trạng từ)"},{"t":"more completely","vi":"một cách hoàn toàn hơn"}],"ans":["C"],"key":"Bổ nghĩa cho động từ (understand) → trạng từ -ly","ex":"Chỗ trống đứng giữa <b>didn't<\/b> và động từ <b>understand<\/b>, bổ nghĩa cho động từ nên cần trạng từ <b>completely<\/b>. (A) và (B) không phải trạng từ. (D) more completely là so sánh hơn, nhưng câu không so sánh với gì (không có than)."}]},{"title":"Câu 121–125","tag":"Từ loại · Cụm cố định","qs":[{"n":121,"q":"Tom Peterson, the CEO, is an _______ person who is well-known for taking care of his employees.","qvi":"Tom Peterson, giám đốc điều hành, là một người (đáng ngưỡng mộ), nổi tiếng vì quan tâm chăm sóc nhân viên.","opts":[{"t":"admire","vi":"ngưỡng mộ (động từ)"},{"t":"admirable","vi":"đáng ngưỡng mộ (tính từ)"},{"t":"admiration","vi":"sự ngưỡng mộ (danh từ)"},{"t":"admirably","vi":"một cách đáng ngưỡng mộ (trạng từ)"}],"ans":["B"],"key":"an + ___ + danh từ (person) → tính từ · đuôi -able = tính từ","ex":"Chỗ trống đứng giữa <b>an<\/b> và danh từ <b>person<\/b> nên cần tính từ: <b>admirable<\/b> (đuôi -able). (A) admire là động từ, (C) admiration là danh từ, (D) admirably là trạng từ."},{"n":122,"q":"Prethart Tool Company has created a more _______ drill than its previous models.","qvi":"Công ty Dụng cụ Prethart đã tạo ra một chiếc máy khoan (mạnh) hơn các mẫu trước.","opts":[{"t":"powerful","vi":"mạnh mẽ (tính từ)"},{"t":"powers","vi":"năng lượng, quyền lực (danh từ số nhiều)"},{"t":"powerfully","vi":"một cách mạnh mẽ (trạng từ)"},{"t":"power","vi":"năng lượng, sức mạnh (danh từ)"}],"ans":["A"],"key":"more + tính từ + danh từ (so sánh hơn) · đuôi -ful = tính từ","ex":"Chỗ trống đứng sau <b>more<\/b> và trước danh từ <b>drill<\/b> (máy khoan), nên cần tính từ: <b>powerful<\/b> (đuôi -ful). (C) powerfully là trạng từ, không đứng trước danh từ. (B) powers và (D) power là danh từ."},{"n":123,"q":"The _______ of the new main office was inconvenient for employees who didn’t have a car.","qvi":"(Vị trí) của văn phòng chính mới gây bất tiện cho những nhân viên không có ô tô.","opts":[{"t":"locate","vi":"đặt, xác định vị trí (động từ)"},{"t":"to locate","vi":"để đặt (to + V)"},{"t":"located","vi":"được đặt ở (V3)"},{"t":"location","vi":"vị trí, địa điểm (danh từ)"}],"ans":["D"],"key":"The + ___ + of → danh từ · đuôi -tion = danh từ","ex":"Chỗ trống đứng giữa <b>The<\/b> và <b>of<\/b>, làm chủ ngữ cho <b>was<\/b>, nên cần danh từ: <b>location<\/b> (đuôi -tion). Ba đáp án còn lại đều là dạng của động từ locate, không đứng sau The được."},{"n":124,"q":"After ten years in _______, Ravensdale Fiduciary Firm is expanding its to Shanghai, Hong Kong, Tokyo, Seoul and Singapore.","qvi":"Sau mười năm (hoạt động), Công ty Ủy thác Ravensdale đang mở rộng hoạt động sang Thượng Hải, Hồng Kông, Tokyo, Seoul và Singapore.","opts":[{"t":"operate","vi":"hoạt động, vận hành (động từ)"},{"t":"operation","vi":"sự hoạt động (danh từ)"},{"t":"operated","vi":"đã vận hành (V3)"},{"t":"operational","vi":"thuộc về hoạt động (tính từ)"}],"ans":["B"],"key":"Sau giới từ (in) cần danh từ · in operation = đang hoạt động","ex":"Chỗ trống đứng sau giới từ <b>in<\/b> nên cần danh từ: <b>operation<\/b>. Cụm <b>in operation<\/b> = đang hoạt động. (A) operate và (C) operated là động từ, (D) operational là tính từ. (Câu trong đề bị thiếu một chữ sau <i>its<\/i>, đúng ra là <i>expanding its operations to…<\/i>, không ảnh hưởng đáp án.)"},{"n":125,"q":"After twenty-three years of _______, Jeffrey Bartlett is retiring from his position as CEO.","qvi":"Sau hai mươi ba năm (công tác), Jeffrey Bartlett sắp nghỉ hưu khỏi vị trí giám đốc điều hành.","opts":[{"t":"service","vi":"sự phục vụ, thời gian công tác (danh từ)"},{"t":"serving","vi":"đang phục vụ (V-ing)"},{"t":"server","vi":"người phục vụ, máy chủ (danh từ chỉ người/vật)"},{"t":"serves","vi":"phục vụ (động từ chia số ít)"}],"ans":["A"],"key":"years of service = số năm công tác (cụm cố định)","ex":"Sau giới từ <b>of<\/b> cần danh từ. <b>years of service<\/b> là cụm cố định: số năm làm việc, công tác. (C) server cũng là danh từ nhưng nghĩa là người phục vụ / máy chủ, không hợp. (D) serves là động từ. (B) serving thường phải có tân ngữ đi sau (serving customers), nên không tự nhiên bằng service."}]},{"title":"Câu 126–130","tag":"Danh từ · Từ loại","qs":[{"n":126,"q":"Mr. Lloyd has approved a _______ for the construction of a new research facility.","qvi":"Ông Lloyd đã phê duyệt một (đề xuất) xây dựng cơ sở nghiên cứu mới.","opts":[{"t":"proposal","vi":"đề xuất, bản đề xuất (danh từ)"},{"t":"proposed","vi":"được đề xuất (V3)"},{"t":"propose","vi":"đề xuất (động từ)"},{"t":"proposing","vi":"đang đề xuất (V-ing)"}],"ans":["A"],"key":"a + ___ + for → danh từ · đuôi -al có thể là danh từ (proposal, removal)","ex":"Chỗ trống đứng sau <b>a<\/b> và sau động từ <b>approved<\/b> (tân ngữ), nên cần danh từ: <b>proposal<\/b> (bản đề xuất). (B), (C), (D) đều là dạng động từ. Chú ý: đuôi <b>-al<\/b> thường là tính từ (national), nhưng proposal, removal, approval lại là danh từ."},{"n":127,"q":"The government sends teams of _______ to check the quality of the tap water in both urban and rural countries.","qvi":"Chính phủ cử các đội (thanh tra viên) đi kiểm tra chất lượng nước máy ở cả vùng thành thị lẫn nông thôn.","opts":[{"t":"inspected","vi":"đã được kiểm tra (V3)"},{"t":"inspectors","vi":"thanh tra viên (danh từ chỉ người, số nhiều)"},{"t":"inspections","vi":"các cuộc kiểm tra (danh từ chỉ việc)"},{"t":"inspect","vi":"kiểm tra (động từ)"}],"ans":["B"],"key":"teams of + danh từ chỉ người · đuôi -or/-er = người","ex":"Sau giới từ <b>of<\/b> cần danh từ: còn (B) inspectors và (C) inspections. Một <b>đội<\/b> đi kiểm tra nước thì gồm <b>người<\/b>, nên chọn <b>inspectors<\/b> (thanh tra viên, đuôi -or chỉ người). Inspections là \"các cuộc kiểm tra\", không thể \"đi kiểm tra\" được. (Đề in <i>rural countries<\/i>, ý là vùng nông thôn.)"},{"n":128,"q":"Empty boxes should be placed in the stockroom for _______.","qvi":"Thùng rỗng nên được đặt trong kho để (mang đi bỏ).","opts":[{"t":"removable","vi":"có thể tháo/gỡ ra (tính từ)"},{"t":"remover","vi":"chất tẩy, người dọn (danh từ)"},{"t":"removed","vi":"đã bị dời đi (V3)"},{"t":"removal","vi":"việc dọn đi, mang đi (danh từ)"}],"ans":["D"],"key":"Sau giới từ (for) cần danh từ · for removal = để dọn đi","ex":"Chỗ trống đứng sau giới từ <b>for<\/b> nên cần danh từ: (B) remover hoặc (D) removal. Thùng rỗng để vào kho là chờ <b>được dọn đi<\/b>: <b>removal<\/b>. Remover là chất tẩy (nail polish remover) hoặc người dọn, không hợp nghĩa. (A) là tính từ, (C) là V3."},{"n":129,"q":"For the past two years, _______ of the new product lines has been running ahead of schedule.","qvi":"Trong hai năm qua, việc (phát triển) các dòng sản phẩm mới đã luôn chạy trước tiến độ.","opts":[{"t":"develop","vi":"phát triển (động từ)"},{"t":"development","vi":"sự phát triển (danh từ)"},{"t":"developing","vi":"đang phát triển (V-ing)"},{"t":"developer","vi":"nhà phát triển (danh từ chỉ người)"}],"ans":["B"],"key":"Làm chủ ngữ (trước has been) → danh từ · ___ of → danh từ","ex":"Chỗ trống làm chủ ngữ cho <b>has been running<\/b> và đứng trước <b>of<\/b>, nên cần danh từ: <b>development<\/b> (đuôi -ment). (D) developer là danh từ chỉ người, số ít thì phải có a/the đi trước, và \"người phát triển chạy trước tiến độ\" không hợp nghĩa. (A) là động từ, (C) V-ing không đi với of như vậy."},{"n":130,"q":"Many tourists have been attracted by the _______ of Ha Long Bay.","qvi":"Nhiều du khách đã bị thu hút bởi vẻ (đẹp) của Vịnh Hạ Long.","opts":[{"t":"beauty","vi":"vẻ đẹp (danh từ)"},{"t":"beautiful","vi":"đẹp (tính từ)"},{"t":"beautify","vi":"làm đẹp (động từ)"},{"t":"beautifully","vi":"một cách đẹp đẽ (trạng từ)"}],"ans":["A"],"key":"the + ___ + of → danh từ","ex":"Chỗ trống đứng giữa <b>the<\/b> và <b>of<\/b> nên cần danh từ: <b>beauty<\/b> (vẻ đẹp). (B) beautiful là tính từ, (C) beautify là động từ (đuôi -ify), (D) beautifully là trạng từ."}]}],"recap":"<h2>Ghi nhớ: nhìn vị trí chỗ trống<\/h2><table><tbody>\n<tr><td><b>Vị trí chỗ trống<\/b><\/td><td><b>Cần từ loại<\/b><\/td><td><b>Câu<\/b><\/td><\/tr>\n<tr><td>the/a/an + ___ + danh từ<\/td><td>tính từ (complete, national, admirable, powerful)<\/td><td>113, 119, 121, 122<\/td><\/tr>\n<tr><td>Sau giới từ (of, in, for)<\/td><td>danh từ (safety, operation, service, inspectors, removal)<\/td><td>102, 124, 125, 127, 128<\/td><\/tr>\n<tr><td>the + ___ + of / làm chủ ngữ<\/td><td>danh từ (location, development, beauty)<\/td><td>123, 129, 130<\/td><\/tr>\n<tr><td>Sau his/her/its<\/td><td>danh từ (kindness)<\/td><td>117<\/td><\/tr>\n<tr><td>Bổ nghĩa cho động từ, câu đã đủ<\/td><td>trạng từ -ly (quickly, completely)<\/td><td>109, 120<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Đại từ: chọn theo vị trí<\/h2><table><tbody>\n<tr><td>Trước động từ (chủ ngữ)<\/td><td>I, you, he, she, we, they<\/td><td>106, 108, 116<\/td><\/tr>\n<tr><td>Sau động từ / giới từ<\/td><td>me, him, her, us, them<\/td><td>(103: all of these)<\/td><\/tr>\n<tr><td>Trước danh từ<\/td><td>my, his, her, its, our<\/td><td>114 (its employees)<\/td><\/tr>\n<tr><td>Không có danh từ sau<\/td><td>mine, hers, ours, theirs<\/td><td>101 (hers)<\/td><\/tr>\n<tr><td>Nhấn mạnh \"chính người đó\"<\/td><td>himself, herself<\/td><td>107<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Lượng từ và cụm cần thuộc<\/h2><p><b>every<\/b> + số ít (111) · <b>little<\/b> + không đếm được (112) · <b>none<\/b> = không cái nào, đứng một mình (104) · <b>Those who<\/b> = những người mà (105) · <b>an essential part<\/b> (110) · <b>remit money<\/b> = chuyển tiền (115) · <b>in operation<\/b> (124) · <b>years of service<\/b> (125) · <b>for safety reasons<\/b> (102)<\/p>\n<p><b>Đuôi từ giúp đoán từ loại:<\/b> danh từ: -tion, -ment, -ness, -ty, -or/-er (người); tính từ: -al, -ful, -able; trạng từ: -ly. Ngoại lệ: proposal, removal là danh từ.<\/p>\n<p><b>Bẫy hay gặp:<\/b> hai danh từ cùng gốc nhưng khác nghĩa (escalator / escalation 118, inspectors / inspections 127, removal / remover 128): phải đọc nghĩa câu; đại từ không khớp giống / số (108, 114).<\/p>\n<p><b>Bài tập về nhà gợi ý:<\/b> với mỗi câu sai, chép lại cả câu đã điền đúng, gạch chân từ đứng trước và sau chỗ trống, ghi tên dạng câu (từ loại / đại từ / lượng từ / từ vựng) bên cạnh.<\/p>","exam":"TOEIC-PRE-MOCK2","examSrc":"/pretoeicnew-mocktest/"};</script>
