<script>window.MT={"n":6,"part":7,"partName":"Part 7","sub":"Reading Comprehension · Đọc hiểu · 29 câu (147–175)","intro":"Trang này chữa <b>Mock Test 6 (Part 7)<\/b>. Mỗi văn bản có hình đề gốc (bấm vào để phóng to), các câu hỏi kèm dịch, và phần dịch ý chính. <b>Cách học:<\/b> đọc câu hỏi → tìm câu trong bài chứa đáp án → tự chọn → đọc giải thích → mở phần dịch xem câu nào chứa đáp án (số câu đánh dấu ở đầu dòng).","stepsTitle":"Cách làm Part 7: 3 bước","steps":["<b>Đọc câu hỏi trước, gạch từ khóa.<\/b> Tên người, giờ, con số (Mr. Tarnowski, 8:54, 9:44…) giúp tìm nhanh chỗ cần đọc trong bài.","<b>Câu hỏi mục đích / chủ đề:<\/b> đọc tiêu đề và câu đầu. <b>Câu hỏi chi tiết:<\/b> dò đúng chỗ có từ khóa rồi đọc kỹ câu đó và câu bên cạnh.","<b>Chọn đáp án nói lại ý (paraphrase).<\/b> Đáp án đúng thường dùng từ khác: <i>original receipt → proof of purchase<\/i>. Đáp án lặp đúng chữ trong bài nhưng sai ý (gift, closet, Canada, Blackwood…) thường là <b>bẫy<\/b>."],"hideOpts":false,"groups":[{"title":"Câu 147–148 · Bảng quy định","tag":"1 văn bản","imgs":["img/mk6/p1.webp"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"REGULATIONS. Per state law, all employees at this facility are required to wear long pants, long sleeves, socks, and steel-toe shoes.","vi":"QUY ĐỊNH. Theo luật của bang, mọi nhân viên ở cơ sở này phải mặc quần dài, áo dài tay, đi tất và giày mũi thép."},{"sp":"","t":"(147) Employees who **work with chemicals** are also required to wear **masks and safety gloves**.","vi":"Nhân viên làm việc với hóa chất còn phải đeo khẩu trang và găng tay bảo hộ."},{"sp":"","t":"(148) Eating and drinking are prohibited except in the cafeteria.","vi":"Cấm ăn uống, trừ khi ở nhà ăn. (Cả bài là quy định về trang phục bảo hộ = an toàn lao động.)"}],"qs":[{"n":147,"q":"Where would the notice likely appear?","qvi":"Thông báo này có thể được dán ở đâu?","opts":[{"t":"In a laboratory","vi":"Trong phòng thí nghiệm"},{"t":"In a restaurant","vi":"Trong nhà hàng"},{"t":"In a clothing store","vi":"Trong cửa hàng quần áo"},{"t":"In a law office","vi":"Trong văn phòng luật"}],"ans":["A"],"key":"work with chemicals, masks, safety gloves → laboratory","ex":"Bài nói nhân viên làm việc với **hóa chất** (chemicals) phải đeo khẩu trang và găng tay bảo hộ, phải mang giày mũi thép. Nơi làm việc với hóa chất là phòng thí nghiệm. (B) là bẫy: bài có nhắc cafeteria (nhà ăn) nhưng chỉ là nơi được phép ăn uống, không phải nơi dán thông báo."},{"n":148,"q":"What issue does the notice discuss?","qvi":"Thông báo nói về vấn đề gì?","opts":[{"t":"Workplace cleanliness","vi":"Vệ sinh nơi làm việc"},{"t":"Lunch breaks","vi":"Giờ nghỉ trưa"},{"t":"Weekly schedules","vi":"Lịch làm việc hằng tuần"},{"t":"Workplace safety","vi":"An toàn lao động"}],"ans":["D"],"key":"long sleeves, steel-toe shoes, masks, safety gloves = workplace safety","ex":"Cả thông báo là quy định về trang phục bảo hộ (quần dài, áo dài tay, giày mũi thép, khẩu trang, găng tay): mục đích là **an toàn** khi làm việc. Bài có câu cấm ăn uống ngoài nhà ăn, nhưng không nói giờ nghỉ trưa nên (B) sai."}]},{"title":"Câu 149–150 · Email sửa máy giặt","tag":"1 văn bản","imgs":["img/mk6/p2.webp"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"Subject: (149) **Repair request** #2989231","vi":"Tiêu đề: Yêu cầu sửa chữa số 2989231"},{"sp":"","t":"We are sorry to hear you are having trouble with the washing machine you purchased at an Electrimax store. Your repair request has been received.","vi":"Rất tiếc khi biết máy giặt ông mua ở cửa hàng Electrimax gặp trục trặc. Chúng tôi đã nhận yêu cầu sửa chữa của ông."},{"sp":"","t":"(149) Within the next 24 hours, we will call you to **set up a service appointment** in your home.","vi":"Trong 24 giờ tới, chúng tôi sẽ gọi để hẹn lịch đến sửa tại nhà ông."},{"sp":"","t":"(150) Our technician will ask to see the **original receipt** given to you when you purchased the machine. Please have it available.","vi":"Kỹ thuật viên sẽ xin xem hóa đơn gốc khi ông mua máy. Xin chuẩn bị sẵn."},{"sp":"","t":"Thank you for using our online communication form.","vi":"Cảm ơn ông đã dùng mẫu liên hệ trực tuyến của chúng tôi."}],"qs":[{"n":149,"q":"Why did Mr. Tarnowski use the online form?","qvi":"Vì sao ông Tarnowski dùng mẫu đơn trực tuyến?","opts":[{"t":"To ask for a product replacement","vi":"Để xin đổi sản phẩm mới"},{"t":"To inquire about delivery options","vi":"Để hỏi về cách giao hàng"},{"t":"To request a service appointment","vi":"Để đặt lịch hẹn sửa chữa"},{"t":"To post a customer review","vi":"Để đăng đánh giá của khách hàng"}],"ans":["C"],"key":"repair request / set up a service appointment = request a service appointment","ex":"Tiêu đề là **Repair request** (yêu cầu sửa chữa), và email nói: \"Your repair request has been received… we will call you to set up a **service appointment** in your home.\" Vậy ông gửi đơn để được hẹn thợ đến sửa máy giặt. Ông muốn sửa, không đòi đổi máy mới nên (A) sai."},{"n":150,"q":"What is Mr. Tarnowski asked to do?","qvi":"Ông Tarnowski được yêu cầu làm gì?","opts":[{"t":"Register a product","vi":"Đăng ký sản phẩm"},{"t":"Provide his home address","vi":"Cung cấp địa chỉ nhà"},{"t":"Present proof of his purchase","vi":"Đưa ra bằng chứng đã mua hàng"},{"t":"Visit an Electrimax store","vi":"Đến một cửa hàng Electrimax"}],"ans":["C"],"key":"original receipt = proof of his purchase","ex":"Email viết: kỹ thuật viên sẽ xin xem **hóa đơn gốc** (original receipt) lúc mua máy, \"Please have it available\" (hãy chuẩn bị sẵn). Hóa đơn = bằng chứng đã mua: receipt = proof of purchase. (D) sai vì thợ đến sửa tại nhà, ông không cần đến cửa hàng."}]},{"title":"Câu 151–152 · Chính sách họp từ xa","tag":"1 văn bản","imgs":["img/mk6/p3.webp"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"(151) New Policy for **Remote Participation**. On Monday, the board of directors of Heart & Health Charity adopted a remote participation policy for committees, boards, and working groups.","vi":"Chính sách mới về tham gia từ xa. Thứ Hai vừa rồi, ban giám đốc tổ chức từ thiện Heart & Health đã thông qua chính sách tham gia từ xa cho các ủy ban, hội đồng và nhóm làm việc."},{"sp":"","t":"(151) The chairperson may permit a member to **participate by telephone or videoconference** when the member **cannot physically attend the meeting**.","vi":"Chủ tịch ủy ban được phép cho thành viên tham gia qua điện thoại hoặc gọi video khi người đó không thể đến họp trực tiếp."},{"sp":"","t":"(152) There are forms to fill out and procedures to follow, so **check the Web site** for details.","vi":"Có mẫu đơn cần điền và thủ tục cần làm, vì vậy hãy xem trang web để biết chi tiết."}],"qs":[{"n":151,"q":"What is the information primarily about?","qvi":"Thông tin này chủ yếu nói về điều gì?","opts":[{"t":"The charity’s multiple offices","vi":"Nhiều văn phòng của tổ chức từ thiện"},{"t":"Attendance at meetings","vi":"Việc tham dự các cuộc họp"},{"t":"Technological improvements","vi":"Cải tiến về công nghệ"},{"t":"A meeting schedule","vi":"Lịch họp"}],"ans":["B"],"key":"participate by telephone or videoconference when cannot attend = attendance at meetings","ex":"Tiêu đề: **chính sách tham gia từ xa** (Remote Participation). Nội dung: thành viên không đến họp trực tiếp được thì có thể tham gia qua điện thoại hoặc gọi video. Vậy bài nói về cách **tham dự cuộc họp**. (C) là bẫy: điện thoại, video là công nghệ nhưng bài không nói cải tiến công nghệ. (D) sai vì không có ngày giờ họp."},{"n":152,"q":"According to the information, how can people find out more?","qvi":"Theo thông tin, mọi người có thể tìm hiểu thêm bằng cách nào?","opts":[{"t":"By going online","vi":"Lên mạng (vào trang web)"},{"t":"By speaking with a chairperson","vi":"Nói chuyện với chủ tịch ủy ban"},{"t":"By joining a videoconference","vi":"Tham gia một cuộc gọi video"},{"t":"By reading a manual","vi":"Đọc sách hướng dẫn"}],"ans":["A"],"key":"check the Web site for details = going online","ex":"Câu cuối: \"**check the Web site** for details\" (xem trang web để biết chi tiết). Xem trang web = going online. (B), (C) là bẫy lặp từ: chairperson và videoconference có trong bài nhưng nói về việc khác (chủ tịch cho phép họp từ xa, họp qua video)."}]},{"title":"Câu 153–154 · Tin nhắn về hộp quà","tag":"câu hỏi ý định","imgs":["img/mk6/p4.webp"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"Fabien Vahle (8:43): Sita, are you still at the warehouse? / Sita Singh (8:46): Yes. Do you need something?","vi":"Fabien: Sita, cô còn ở kho không? / Sita: Còn. Anh cần gì à?"},{"sp":"","t":"(154) Fabien Vahle (8:47): Could you **bring over** some medium-sized cardboard gift boxes? You can put them **in the closet on the second floor**.","vi":"Fabien: Cô mang qua giúp vài hộp quà bằng bìa cứng cỡ vừa được không? Cô để vào tủ ở tầng hai nhé."},{"sp":"","t":"Sita Singh (8:48): How many? / Fabien Vahle (8:49): A dozen or so.","vi":"Sita: Bao nhiêu hộp? / Fabien: Khoảng một tá (12 cái)."},{"sp":"","t":"(153) Sita Singh (8:52): That's about **how many are left** here.","vi":"Sita: Ở đây cũng chỉ còn khoảng chừng đó thôi."},{"sp":"","t":"(153) Fabien Vahle (8:54): I guess it's time to **replenish the inventory**. I'll send out an e-mail.","vi":"Fabien: Chắc đến lúc phải bổ sung hàng trong kho rồi. Tôi sẽ gửi email (để đặt thêm)."}],"qs":[{"n":153,"q":"At 8:54 A.M., what does Mr. Vahle mean when he writes, \"I’ll send out an e-mail\"?","qvi":"Lúc 8:54 sáng, ông Vahle có ý gì khi viết \"I’ll send out an e-mail\" (Tôi sẽ gửi email)?","opts":[{"t":"He will ask warehouse staff to help Ms. Singh.","vi":"Ông sẽ nhờ nhân viên kho giúp cô Singh."},{"t":"He will place an order for more boxes.","vi":"Ông sẽ đặt mua thêm hộp."},{"t":"He will inform a colleague about a new policy.","vi":"Ông sẽ báo cho đồng nghiệp về một quy định mới."},{"t":"He will thank Ms. Singh for a job well done.","vi":"Ông sẽ cảm ơn cô Singh vì đã làm tốt."}],"ans":["B"],"key":"time to replenish the inventory = order more boxes","ex":"Cô Singh nói số hộp còn lại ở kho chỉ khoảng một tá (đúng bằng số ông cần). Ông trả lời: \"Đến lúc phải **bổ sung hàng trong kho** rồi (replenish the inventory). Tôi sẽ gửi email.\" Vậy email là để **đặt thêm hộp**. Mẹo câu hỏi ý định: đọc câu ngay trước câu được trích. (A) sai vì cô Singh không cần ai giúp."},{"n":154,"q":"What will Ms. Singh probably do next?","qvi":"Cô Singh có lẽ sẽ làm gì tiếp theo?","opts":[{"t":"Take an inventory of boxes","vi":"Kiểm kê số hộp"},{"t":"Prepare a gift for Mr. Vahle","vi":"Chuẩn bị quà cho ông Vahle"},{"t":"Organize a messy closet","vi":"Dọn một tủ đồ bừa bộn"},{"t":"Bring boxes to the second floor","vi":"Mang hộp lên tầng hai"}],"ans":["D"],"key":"bring over gift boxes … closet on the second floor","ex":"Lúc 8:47 ông Vahle nhờ: \"mang qua vài hộp quà bằng bìa cứng cỡ vừa… để vào **tủ ở tầng hai**.\" Cô hỏi số lượng, tức là sẽ làm. (B) là bẫy lặp từ gift: \"gift boxes\" là hộp đựng quà, không phải chuẩn bị quà. (C) bẫy closet: chỉ là chỗ để hộp, không nói tủ bừa bộn. (A) bẫy inventory: ông Vahle mới là người lo bổ sung hàng."}]},{"title":"Câu 155–157 · Thông báo sự cố máy chủ","tag":"điền câu","imgs":["img/mk6/p5.webp"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"(155) At 7:30 A.M. today, the main server facility **lost power** during regular security testing. — [1] —","vi":"7:30 sáng nay, phòng máy chủ chính bị mất điện trong lúc kiểm tra bảo mật định kỳ."},{"sp":"","t":"Power was restored less than one hour later, and the company Web site is now fully functional. — [2] —","vi":"Chưa đầy một giờ sau đã có điện lại, và trang web công ty đã hoạt động bình thường."},{"sp":"","t":"(155) However, many services are **still down**. Among these are the main database and all desktop phone services, including voice mail.","vi":"Tuy nhiên, nhiều dịch vụ vẫn chưa hoạt động, gồm cơ sở dữ liệu chính và toàn bộ điện thoại bàn, kể cả hộp thư thoại."},{"sp":"","t":"(156) At this time, you can **access e-mail from mobile devices** but not from your office computers. — [3] —","vi":"Hiện giờ bạn đọc email được trên thiết bị di động nhưng không được trên máy tính văn phòng."},{"sp":"","t":"(157) Our technicians are working to bring all systems back online. However, it may take **until this afternoon** for everything to resume working normally. — [4] — ⟶ We humbly ask for your patience **until that time**.","vi":"Kỹ thuật viên đang khắc phục. Tuy nhiên có thể đến chiều nay mọi thứ mới bình thường lại. ⟶ (Câu điền vào [4]) Chúng tôi kính mong các bạn kiên nhẫn chờ đến lúc đó."}],"qs":[{"n":155,"q":"What is the purpose of the notice?","qvi":"Mục đích của thông báo là gì?","opts":[{"t":"To explain how to access a Web site","vi":"Giải thích cách vào một trang web"},{"t":"To provide instructions for using voicemail","vi":"Hướng dẫn cách dùng hộp thư thoại"},{"t":"To inform employees of a technology issue","vi":"Báo cho nhân viên về một sự cố kỹ thuật"},{"t":"To advise employees of revisions to a database","vi":"Báo cho nhân viên về việc sửa đổi cơ sở dữ liệu"}],"ans":["C"],"key":"lost power, services are still down = a technology issue","ex":"Câu đầu: phòng máy chủ chính bị **mất điện**; sau đó nhiều dịch vụ vẫn **chưa hoạt động** (still down): cơ sở dữ liệu, điện thoại, hộp thư thoại. Đây là sự cố kỹ thuật. (B), (D) là bẫy lặp từ: voice mail và database có trong bài nhưng là thứ đang bị hỏng, không có hướng dẫn hay sửa đổi gì."},{"n":156,"q":"What is indicated about the company e-mail?","qvi":"Điều gì được nói về email của công ty?","opts":[{"t":"It is only available on office computers.","vi":"Chỉ dùng được trên máy tính văn phòng."},{"t":"It is accessible on mobile devices.","vi":"Có thể dùng trên thiết bị di động."},{"t":"Only office technicians can use it currently.","vi":"Hiện chỉ kỹ thuật viên dùng được."},{"t":"It has been updated to provide more security.","vi":"Đã được nâng cấp để bảo mật hơn."}],"ans":["B"],"key":"access e-mail from mobile devices = accessible on mobile devices","ex":"Bài viết: \"you can **access e-mail from mobile devices** but not from your office computers\" (đọc email được trên điện thoại, không được trên máy tính văn phòng). (A) là bẫy ngược ý: bài nói đúng điều ngược lại. (D) bẫy security: chỉ có security testing (kiểm tra bảo mật) lúc mất điện."},{"n":157,"q":"In which of the positions marked [1], [2], [3] and [4] does the following sentence best belong? \"We humbly ask for your patience until that time.\"","qvi":"Câu sau hợp nhất ở vị trí nào trong [1], [2], [3], [4]? \"Chúng tôi kính mong các bạn kiên nhẫn chờ đến lúc đó.\"","opts":[{"t":"[1]","vi":"[1]"},{"t":"[2]","vi":"[2]"},{"t":"[3]","vi":"[3]"},{"t":"[4]","vi":"[4]"}],"ans":["D"],"key":"until that time = until this afternoon","ex":"Câu cần điền có \"**until that time**\" (cho đến lúc đó), nên câu trước phải nói một thời điểm. Ngay trước [4]: \"có thể phải **đến chiều nay** mọi thứ mới hoạt động lại bình thường.\" \"that time\" = this afternoon, và \"kiên nhẫn chờ\" hợp với việc phải đợi sửa. Các vị trí khác không có mốc thời gian để chờ."}]},{"title":"Câu 158–160 · Thư công ty sơn","tag":"câu hỏi NOT","imgs":["img/mk6/p6.webp"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"Peake Painting Ltd. … Nuruddin Abdullahi, Owner → Ms. Priti Parekh, Manager, Eagle Point Apartments","vi":"Người gửi: ông Abdullahi, chủ công ty sơn Peake Painting. Người nhận: cô Parekh, quản lý khu căn hộ Eagle Point."},{"sp":"","t":"(158) As I mentioned, we have been successfully **serving many apartment complexes** in the Toronto area **for the past fifteen years**. I would be happy to supply references.","vi":"Như tôi đã nói, công ty chúng tôi đã phục vụ thành công nhiều khu căn hộ ở Toronto suốt 15 năm qua. Tôi sẵn lòng cung cấp thư giới thiệu (người có thể xác nhận)."},{"sp":"","t":"(159) The benefits of our service agreement include priority scheduling, **preventive maintenance**, **service discounts**, and **advice from our expert painters**.","vi":"Lợi ích của hợp đồng dịch vụ gồm: được ưu tiên xếp lịch, bảo trì phòng ngừa, giảm giá dịch vụ và lời khuyên từ thợ sơn giỏi."},{"sp":"","t":"It also covers the repainting of apartments vacated by tenants and a one-year guarantee on paint and labour.","vi":"Hợp đồng còn bao gồm sơn lại căn hộ khi người thuê dọn đi, và bảo hành một năm cho sơn và công thợ."},{"sp":"","t":"(160) **Enclosed is** a copy of our **standard contract**, which can be adjusted to your specific needs.","vi":"Kèm theo thư là bản hợp đồng tiêu chuẩn của chúng tôi, có thể điều chỉnh theo nhu cầu của cô."}],"qs":[{"n":158,"q":"Why did Mr. Abdullahi send the letter to Ms. Parekh?","qvi":"Vì sao ông Abdullahi gửi thư cho cô Parekh?","opts":[{"t":"To give some details about his business","vi":"Để cho biết một số thông tin về công ty của ông"},{"t":"To describe some available apartments","vi":"Để giới thiệu một số căn hộ còn trống"},{"t":"To inquire about a service provided","vi":"Để hỏi về một dịch vụ được cung cấp"},{"t":"To ask for a reference","vi":"Để xin thư giới thiệu"}],"ans":["A"],"key":"serving apartment complexes for 15 years, benefits of our service agreement = details about his business","ex":"Ông là chủ công ty sơn Peake Painting. Thư kể công ty đã phục vụ nhiều khu căn hộ 15 năm, nêu các lợi ích của hợp đồng dịch vụ và gửi kèm hợp đồng mẫu: tức là **giới thiệu công ty mình** để mời hợp tác. (D) là bẫy lặp từ reference: ông nói sẵn sàng **cung cấp** thư giới thiệu, không phải xin. (B) sai: cô Parekh mới là người quản lý căn hộ."},{"n":159,"q":"What is NOT mentioned as a feature covered by the service agreement?","qvi":"Điều gì KHÔNG được nhắc đến là một quyền lợi trong hợp đồng dịch vụ?","opts":[{"t":"Price reductions","vi":"Giảm giá"},{"t":"Annual evaluations","vi":"Đánh giá hằng năm"},{"t":"Recommendations by specialists","vi":"Lời khuyên của chuyên gia"},{"t":"Periodically performed maintenance","vi":"Bảo trì định kỳ"}],"ans":["B"],"key":"câu NOT: dò từng đáp án, loại cái có trong bài","ex":"Đoạn 2 liệt kê: priority scheduling, **preventive maintenance** (bảo trì phòng ngừa = (D)), **service discounts** (giảm giá dịch vụ = (A)), **advice from our expert painters** (lời khuyên của thợ sơn giỏi = (C)). Không có \"đánh giá hằng năm\" nên chọn (B). Cẩn thận: \"one-year guarantee\" là bảo hành một năm, không phải đánh giá hằng năm."},{"n":160,"q":"What did Mr. Abdullahi send with the letter?","qvi":"Ông Abdullahi gửi kèm gì theo thư?","opts":[{"t":"Information for tenants","vi":"Thông tin cho người thuê nhà"},{"t":"A bill for services","vi":"Hóa đơn dịch vụ"},{"t":"A sample contract","vi":"Một hợp đồng mẫu"},{"t":"An estimate of costs","vi":"Bảng ước tính chi phí"}],"ans":["C"],"key":"Enclosed is a copy of our standard contract = a sample contract","ex":"Đoạn 3: \"**Enclosed is** a copy of our **standard contract**\" (gửi kèm bản hợp đồng tiêu chuẩn, có thể chỉnh theo nhu cầu). Hợp đồng tiêu chuẩn để tham khảo = hợp đồng mẫu. Chữ \"Enclosure\" cuối thư cũng báo có tài liệu đính kèm. (A) bẫy tenants: người thuê nhà chỉ được nhắc khi nói sơn lại căn hộ trống."}]},{"title":"Câu 161–163 · Báo cáo lượt truy cập web","tag":"1 văn bản","imgs":["img/mk6/p7.webp"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"(161) Based on the results, we advise you to **boost your social media presence**. Your Web site traffic from social media sites is approximately 20 percent lower than that of similar Web sites.","vi":"Dựa trên kết quả, chúng tôi khuyên bạn tăng sự hiện diện trên mạng xã hội. Lượt truy cập từ mạng xã hội của bạn thấp hơn các web tương tự khoảng 20%."},{"sp":"","t":"Direct Traffic: 17%: visitors who typed in your Web address or had it bookmarked.","vi":"Truy cập trực tiếp 17%: khách tự gõ địa chỉ web hoặc đã lưu sẵn."},{"sp":"","t":"(163) Redirected Traffic: 53%: visitors who followed a link from **an advertisement found on another company's Web site**.","vi":"Truy cập chuyển hướng 53%: khách bấm vào link trong quảng cáo đặt trên web của công ty khác."},{"sp":"","t":"(162) Search Engine Traffic: 22%. Popular search terms: **chair, lamp, table, bookshelf, desk**.","vi":"Từ công cụ tìm kiếm 22%. Từ khóa hay tìm: ghế, đèn, bàn, giá sách, bàn làm việc (đều là đồ nội thất)."},{"sp":"","t":"Social Media Traffic: 8%. From home page to sale: 32% never left the home page, 48% visited product pages without purchasing, 20% purchased an item.","vi":"Từ mạng xã hội 8%. Từ trang chủ đến mua hàng: 32% không rời trang chủ, 48% xem sản phẩm nhưng không mua, 20% có mua."}],"qs":[{"n":161,"q":"What Web site traffic source does Takani Analytics recommend increasing?","qvi":"Takani Analytics khuyên nên tăng nguồn truy cập nào?","opts":[{"t":"Direct traffic","vi":"Truy cập trực tiếp"},{"t":"Redirected traffic","vi":"Truy cập qua quảng cáo ở web khác"},{"t":"Search engine traffic","vi":"Truy cập từ công cụ tìm kiếm"},{"t":"Social media traffic","vi":"Truy cập từ mạng xã hội"}],"ans":["D"],"key":"boost your social media presence = increase social media traffic","ex":"Đoạn đầu: \"we advise you to **boost your social media presence**\" (chúng tôi khuyên bạn tăng sự hiện diện trên mạng xã hội), vì lượt truy cập từ mạng xã hội thấp hơn các web tương tự khoảng 20%. boost = increase. Mẹo: câu hỏi \"recommend\" thì tìm chữ advise / suggest / recommend trong bài."},{"n":162,"q":"What type of products does www.hejmo.com most likely sell?","qvi":"Trang www.hejmo.com có lẽ bán loại sản phẩm gì?","opts":[{"t":"Books","vi":"Sách"},{"t":"Furniture","vi":"Đồ nội thất"},{"t":"Advertisements","vi":"Quảng cáo"},{"t":"Gardening equipment","vi":"Dụng cụ làm vườn"}],"ans":["B"],"key":"chair, lamp, table, bookshelf, desk = furniture","ex":"Các từ khách hay tìm: **chair, lamp, table, bookshelf, desk** (ghế, đèn, bàn, giá sách, bàn làm việc): đều là đồ nội thất. Web giới thiệu khách cũng là modernhousehold.com (đồ gia dụng hiện đại). (A) bẫy bookshelf: là giá để sách, không phải sách. (D) bẫy gardensandhomes.com: chỉ là web giới thiệu khách."},{"n":163,"q":"What is indicated about www.hejmo.com?","qvi":"Điều gì được nói về www.hejmo.com?","opts":[{"t":"It advertises on other Web sites.","vi":"Trang này đăng quảng cáo trên các web khác."},{"t":"It gets more direct traffic than similar Web sites do.","vi":"Trang này có nhiều truy cập trực tiếp hơn các web tương tự."},{"t":"It has redesigned its home page.","vi":"Trang này đã thiết kế lại trang chủ."},{"t":"It has increased its Internet sales.","vi":"Trang này đã tăng doanh số bán hàng trên mạng."}],"ans":["A"],"key":"followed a link from an advertisement found on another company's Web site = advertises on other Web sites","ex":"Mục Redirected Traffic (53%): khách đến từ **đường link trong quảng cáo đặt trên web của công ty khác**. Vậy hejmo có đăng quảng cáo trên web khác. (B) sai: bài chỉ so sánh truy cập mạng xã hội (thấp hơn), không so sánh truy cập trực tiếp. (C), (D): có nhắc home page và mua hàng nhưng không nói thiết kế lại hay doanh số tăng."}]},{"title":"Câu 164–167 · Bài báo bổ nhiệm","tag":"điền câu","imgs":["img/mk6/p8.webp"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"(164) The Cape Town Museum of Art has **announced the appointment** of Ms. Simphiwe Nyambi as **head of the museum's Digital Media Department**, effective on 1 June. — [1] — ⟶ (167) She replaces Mr. Arthur Maseko, who resigned in March.","vi":"Bảo tàng Nghệ thuật Cape Town thông báo bổ nhiệm cô Nyambi làm trưởng phòng Truyền thông số, có hiệu lực từ 1/6. ⟶ (Câu điền vào [1]) Cô thay thế ông Maseko, người đã nghỉ việc vào tháng Ba."},{"sp":"","t":"The department is responsible for managing digital content for the documentation and interpretation of the museum's collection.","vi":"Phòng này quản lý nội dung số để lưu trữ và giới thiệu bộ sưu tập của bảo tàng."},{"sp":"","t":"(165) Ms. Nyambi **studied** journalism in South Africa and **Scotland**. — [2] —","vi":"Cô Nyambi học ngành báo chí ở Nam Phi và Scotland."},{"sp":"","t":"Until recently she lived in Nairobi, Kenya, where she was the digital editor for African Arts & Culture Quarterly. — [3] — Before that, she taught journalism at colleges in the United States and Canada.","vi":"Gần đây cô sống ở Nairobi (Kenya), làm biên tập viên số cho tạp chí African Arts & Culture Quarterly. Trước đó cô dạy báo chí ở các trường cao đẳng tại Mỹ và Canada."},{"sp":"","t":"“I am delighted to be back in my hometown.” — [4] —","vi":"\"Tôi rất vui được trở về quê nhà (Cape Town).\""},{"sp":"","t":"(166) “As of two weeks ago, I have **a clear view of the building from my apartment**.”","vi":"\"Từ hai tuần trước, tôi nhìn rõ tòa nhà bảo tàng từ căn hộ của mình.\""}],"qs":[{"n":164,"q":"What is the purpose of the article?","qvi":"Mục đích của bài báo là gì?","opts":[{"t":"To introduce a new publication","vi":"Giới thiệu một ấn phẩm mới"},{"t":"To describe partnerships between museums and universities","vi":"Mô tả sự hợp tác giữa bảo tàng và trường đại học"},{"t":"To discuss new methods of documentation","vi":"Bàn về phương pháp lưu trữ tài liệu mới"},{"t":"To announce the hiring of a media specialist","vi":"Thông báo việc tuyển một chuyên gia truyền thông số"}],"ans":["D"],"key":"announced the appointment … as head of the Digital Media Department = hiring of a media specialist","ex":"Câu đầu: bảo tàng \"**announced the appointment** of Ms. Nyambi as head of the museum's **Digital Media** Department\" (thông báo bổ nhiệm cô Nyambi làm trưởng phòng Truyền thông số). Cả bài nói về cô. (A) bẫy: tạp chí African Arts & Culture Quarterly là nơi cô từng làm, không phải ấn phẩm mới. (C) bẫy documentation: chỉ là việc của phòng ban."},{"n":165,"q":"According to the article, where is one place Ms. Nyambi studied?","qvi":"Theo bài báo, cô Nyambi từng học ở một nơi nào?","opts":[{"t":"Canada","vi":"Canada"},{"t":"Kenya","vi":"Kenya"},{"t":"Scotland","vi":"Scotland"},{"t":"The United States","vi":"Mỹ"}],"ans":["C"],"key":"studied journalism in South Africa and Scotland","ex":"Đoạn 2: \"Ms. Nyambi **studied** journalism in South Africa and **Scotland**.\" (A), (D) là bẫy: Mỹ và Canada là nơi cô **dạy** (taught), không phải nơi học. (B) bẫy: Kenya (Nairobi) là nơi cô **sống và làm việc**. Đọc kỹ động từ: studied / taught / lived."},{"n":166,"q":"What is true about Ms. Nyambi?","qvi":"Điều gì đúng về cô Nyambi?","opts":[{"t":"She can see the museum from her home.","vi":"Cô có thể nhìn thấy bảo tàng từ nhà mình."},{"t":"She grew up near Nairobi.","vi":"Cô lớn lên gần Nairobi."},{"t":"She earned a degree in computer science.","vi":"Cô có bằng khoa học máy tính."},{"t":"She owns a large collection of art.","vi":"Cô sở hữu một bộ sưu tập nghệ thuật lớn."}],"ans":["A"],"key":"a clear view of the building from my apartment = see the museum from her home","ex":"Cuối bài cô nói: \"I have **a clear view of the building from my apartment**\" (từ căn hộ tôi nhìn rõ tòa nhà bảo tàng). apartment = home. (B) sai: cô nói \"trở về **quê nhà**\" là Cape Town; Nairobi chỉ là nơi cô sống gần đây. (D) bẫy collection: bộ sưu tập là của bảo tàng."},{"n":167,"q":"In which of the positions marked [1], [2], [3] and [4] does the following sentence best belong? \"She replaces Mr. Arthur Maseko, who resigned in March.\"","qvi":"Câu sau hợp nhất ở vị trí nào trong [1], [2], [3], [4]? \"Cô thay thế ông Arthur Maseko, người đã nghỉ việc vào tháng Ba.\"","opts":[{"t":"[1]","vi":"[1]"},{"t":"[2]","vi":"[2]"},{"t":"[3]","vi":"[3]"},{"t":"[4]","vi":"[4]"}],"ans":["A"],"key":"She replaces … → ngay sau câu bổ nhiệm cô vào chức vụ","ex":"Câu cần điền nói cô **thay thế** người cũ, nên phải đứng ngay sau câu nói cô nhận chức vụ gì. Câu trước [1]: cô được bổ nhiệm làm trưởng phòng Truyền thông số, có hiệu lực từ 1/6. Thay người nghỉ việc tháng 3 rồi bắt đầu tháng 6: hợp lý. [2], [3] đang kể chuyện học và làm việc trước đây, [4] nằm giữa lời phỏng vấn của cô."}]},{"title":"Câu 168–171 · Trò chuyện trực tuyến","tag":"câu hỏi ý định","imgs":["img/mk6/p9.webp"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"(168) Sara Davis (9:40): Don't forget that our **brainstorming meeting** today is at 1:30 in room 143. Please **bring your suggestions** for the Alder presentation.","vi":"Sara: Đừng quên buổi họp động não (cùng nghĩ ý tưởng) hôm nay lúc 1:30 ở phòng 143. Hãy mang theo góp ý cho bài thuyết trình Alder."},{"sp":"","t":"Ron Chou (9:41): Will you be available after the meeting to discuss the facilities work request? / Sara Davis: Absolutely.","vi":"Ron: Sau cuộc họp chị có rảnh để bàn về yêu cầu sửa chữa cơ sở vật chất không? / Sara: Chắc chắn rồi."},{"sp":"","t":"(170) Tania Watson (9:42): Can you **include Patrick Martin** in the meeting? He has some good ideas for communicating with the new clients.","vi":"Tania: Chị mời thêm Patrick Martin vào cuộc họp được không? Anh ấy có ý tưởng hay về cách liên lạc với khách hàng mới."},{"sp":"","t":"(169) Aidan Reynolds (9:43): I have some **advertising and promotional concepts** that I've drafted. I'll bring them.","vi":"Aidan: Tôi có vài ý tưởng quảng cáo và khuyến mãi đã soạn. Tôi sẽ mang đến."},{"sp":"","t":"(170) Sara Davis (9:44): **Done.** Good idea, Tania.","vi":"Sara: Xong rồi (đã mời anh Martin). Ý hay đó, Tania."},{"sp":"","t":"(171) Tania Watson (9:46): How long do you think the meeting will last? I'm supposed to **brief Scott Kennedy** at 2:30 on the results of the Blackwood presentation.","vi":"Tania: Chị nghĩ họp bao lâu? Tôi phải báo cáo cho Scott Kennedy lúc 2:30 về kết quả bài thuyết trình Blackwood."},{"sp":"","t":"Sara Davis (9:47): We're scheduled for an hour and a half, but feel free to leave whenever you need to.","vi":"Sara: Phòng đặt một tiếng rưỡi, nhưng cứ về lúc nào cô cần nhé."}],"qs":[{"n":168,"q":"Why does Ms. Davis invite the writers to the afternoon meeting?","qvi":"Vì sao cô Davis mời các nhân viên viết bài đến cuộc họp chiều?","opts":[{"t":"To generate new ideas","vi":"Để nghĩ ra ý tưởng mới"},{"t":"To review a client survey","vi":"Để xem lại một khảo sát khách hàng"},{"t":"To discuss a work request","vi":"Để bàn về một yêu cầu công việc"},{"t":"To finalize the Alder presentation","vi":"Để hoàn thiện bài thuyết trình Alder"}],"ans":["A"],"key":"brainstorming meeting, bring your suggestions = generate new ideas","ex":"Lúc 9:40 cô viết: buổi họp **brainstorming** (động não, cùng nghĩ ý tưởng) lúc 1:30, \"hãy mang theo **góp ý** cho bài thuyết trình Alder.\" brainstorming / suggestions = generate new ideas. (C) bẫy: \"facilities work request\" là việc anh Chou muốn bàn riêng **sau** cuộc họp. (D) bẫy: họp để góp ý, chưa phải hoàn thiện."},{"n":169,"q":"What will Mr. Reynolds contribute to the afternoon meeting?","qvi":"Anh Reynolds sẽ đóng góp gì cho cuộc họp chiều?","opts":[{"t":"Scheduling information","vi":"Thông tin lịch trình"},{"t":"Conference projects","vi":"Các dự án hội nghị"},{"t":"Client strategies","vi":"Chiến lược với khách hàng"},{"t":"Marketing plans","vi":"Kế hoạch tiếp thị"}],"ans":["D"],"key":"advertising and promotional concepts = marketing plans","ex":"Lúc 9:43 anh Reynolds viết: \"Tôi có vài **ý tưởng quảng cáo và khuyến mãi** đã soạn, tôi sẽ mang đến.\" Quảng cáo + khuyến mãi = tiếp thị: advertising and promotional concepts = marketing plans. (C) bẫy: \"communicating with the new clients\" là ý tưởng của Patrick Martin, không phải của anh Reynolds."},{"n":170,"q":"At 9:44 A.M., what does Ms. Davis most likely mean when she writes, \"Done\"?","qvi":"Lúc 9:44 sáng, cô Davis có lẽ có ý gì khi viết \"Done\" (Xong rồi)?","opts":[{"t":"She has completed the Blackwood presentation.","vi":"Cô đã làm xong bài thuyết trình Blackwood."},{"t":"She has sent a meeting invitation to Mr. Martin.","vi":"Cô đã gửi lời mời họp cho anh Martin."},{"t":"She has freed up time for a meeting.","vi":"Cô đã sắp xếp được thời gian để họp."},{"t":"She has finished her work for the day.","vi":"Cô đã làm xong việc trong ngày."}],"ans":["B"],"key":"Can you include Patrick Martin? → Done = đã mời anh ấy","ex":"Lúc 9:42 cô Watson nhờ: \"Chị có thể **mời thêm Patrick Martin** vào cuộc họp không?\" Cô Davis đáp: \"Xong rồi. Ý hay đó, Tania.\" (\"Good idea, Tania\" cho thấy cô đang trả lời Tania.) Vậy \"Done\" = đã mời anh Martin. (A) bẫy Blackwood: đó là việc của cô Watson ở tin nhắn sau."},{"n":171,"q":"Why does Ms. Watson need to leave the afternoon meeting early?","qvi":"Vì sao cô Watson phải rời cuộc họp chiều sớm?","opts":[{"t":"She is leaving for a business trip.","vi":"Cô sắp đi công tác."},{"t":"She has to provide information to a colleague.","vi":"Cô phải báo cáo thông tin cho một đồng nghiệp."},{"t":"She must prepare for a presentation.","vi":"Cô phải chuẩn bị cho một bài thuyết trình."},{"t":"She is scheduled to greet new clients.","vi":"Cô có lịch đón khách hàng mới."}],"ans":["B"],"key":"brief Scott Kennedy = provide information to a colleague","ex":"Lúc 9:46 cô viết: \"Tôi phải **báo cáo cho Scott Kennedy** lúc 2:30 về kết quả bài thuyết trình Blackwood.\" Họp bắt đầu 1:30, kéo dài 1 tiếng rưỡi nên cô phải về sớm. brief someone = provide information. (C) bẫy presentation: bài thuyết trình Blackwood đã diễn ra rồi, cô chỉ báo lại kết quả."}]},{"title":"Câu 172–175 · Bài báo cuộc thi thiết kế","tag":"1 văn bản","imgs":["img/mk6/p10.webp"],"scriptLabel":"📜 Dịch ý chính","script":[{"sp":"","t":"(172) Gentle Art is a nonprofit organization and has been hosting **an international design contest** for the last 8 years.","vi":"Gentle Art là tổ chức phi lợi nhuận, đã tổ chức cuộc thi thiết kế quốc tế suốt 8 năm qua."},{"sp":"","t":"(173) This contest is to **encourage young designers** to be creative and to show their talent.","vi":"Cuộc thi nhằm khuyến khích các nhà thiết kế trẻ sáng tạo và thể hiện tài năng."},{"sp":"","t":"(174) This year, participants will **design a poster** that represents the concept: “We respect one another.”","vi":"Năm nay, người dự thi sẽ thiết kế một áp phích thể hiện ý \"Chúng ta tôn trọng lẫn nhau\"."},{"sp":"","t":"The top ten finalists will be awarded a certificate, and the winner will be awarded 10,000 dollars. The contest is open to all individuals and groups.","vi":"10 người vào chung kết nhận giấy chứng nhận, người thắng nhận 10.000 đô la. Cá nhân và nhóm đều được tham gia."},{"sp":"","t":"(175) Entries must be **submitted online**. Visit the official **website** at www.gentleart.com.","vi":"Bài dự thi phải nộp trên mạng. Hãy vào trang web chính thức www.gentleart.com."}],"qs":[{"n":172,"q":"What does this article discuss?","qvi":"Bài báo này nói về điều gì?","opts":[{"t":"An annual art exhibition","vi":"Một triển lãm nghệ thuật hằng năm"},{"t":"A new style of architecture","vi":"Một phong cách kiến trúc mới"},{"t":"An art competition","vi":"Một cuộc thi nghệ thuật"},{"t":"A business contract","vi":"Một hợp đồng kinh doanh"}],"ans":["C"],"key":"international design contest = an art competition","ex":"Tên bài là International Gentle Art **Award** (giải thưởng), câu đầu nói tổ chức này tổ chức **cuộc thi thiết kế quốc tế** (international design contest) suốt 8 năm. contest = competition. (A) bẫy: tổ chức hằng năm nhưng là cuộc thi, không phải triển lãm."},{"n":173,"q":"For whom is the article most likely intended?","qvi":"Bài báo có lẽ viết cho ai đọc?","opts":[{"t":"Art students","vi":"Sinh viên ngành nghệ thuật"},{"t":"Travel agencies","vi":"Công ty du lịch"},{"t":"Advertisers","vi":"Người làm quảng cáo"},{"t":"Gallery owners","vi":"Chủ phòng tranh"}],"ans":["A"],"key":"encourage young designers = art students","ex":"Bài viết: cuộc thi nhằm \"khuyến khích các **nhà thiết kế trẻ** sáng tạo và thể hiện tài năng\". Người trẻ học nghệ thuật, thiết kế là sinh viên nghệ thuật. Câu này cần suy luận, bài không ghi thẳng chữ students. (C) bẫy poster: thiết kế áp phích nhưng không dành riêng cho dân quảng cáo."},{"n":174,"q":"What will the participants design?","qvi":"Người dự thi sẽ thiết kế gì?","opts":[{"t":"A logo","vi":"Một biểu tượng (logo)"},{"t":"A poster","vi":"Một áp phích"},{"t":"A book cover","vi":"Một bìa sách"},{"t":"A stamp","vi":"Một con tem"}],"ans":["B"],"key":"participants will design a poster","ex":"Đoạn 2 ghi thẳng: \"This year, participants will **design a poster**\" (năm nay người dự thi sẽ thiết kế một áp phích) với chủ đề \"Chúng ta tôn trọng lẫn nhau\". Câu hỏi chi tiết: dò từ khóa \"design\" trong bài là thấy."},{"n":175,"q":"What should people do if they want to participate in the event?","qvi":"Muốn tham gia thì phải làm gì?","opts":[{"t":"Send an e-mail","vi":"Gửi email"},{"t":"Fax an application form","vi":"Gửi đơn bằng fax"},{"t":"Phone the organization","vi":"Gọi điện cho tổ chức"},{"t":"Register on the website","vi":"Đăng ký trên trang web"}],"ans":["D"],"key":"Entries must be submitted online. Visit the official website = register on the website","ex":"Cuối bài: \"Entries must be **submitted online**. Visit the official **website**\" (bài dự thi phải nộp trên mạng, hãy vào trang web chính thức). Nộp trên mạng qua trang web = đăng ký trên web. Bài không có email, số fax hay số điện thoại nên (A), (B), (C) sai."}]}],"recap":"<h2>Ghi nhớ: đáp án nói lại ý<\/h2><table><tbody><tr><td><b>Trong bài đọc<\/b><\/td><td><b>Trong đáp án<\/b><\/td><td><b>Câu<\/b><\/td><\/tr>\n<tr><td>work with chemicals<\/td><td>in a laboratory<\/td><td>147<\/td><\/tr>\n<tr><td>long sleeves, steel-toe shoes, safety gloves<\/td><td>workplace safety<\/td><td>148<\/td><\/tr>\n<tr><td>set up a service appointment<\/td><td>request a service appointment<\/td><td>149<\/td><\/tr>\n<tr><td>original receipt<\/td><td>proof of his purchase<\/td><td>150<\/td><\/tr>\n<tr><td>cannot physically attend the meeting<\/td><td>attendance at meetings<\/td><td>151<\/td><\/tr>\n<tr><td>check the Web site<\/td><td>by going online<\/td><td>152<\/td><\/tr>\n<tr><td>replenish the inventory<\/td><td>place an order for more boxes<\/td><td>153<\/td><\/tr>\n<tr><td>lost power, services are still down<\/td><td>a technology issue<\/td><td>155<\/td><\/tr>\n<tr><td>until this afternoon<\/td><td>until that time<\/td><td>157<\/td><\/tr>\n<tr><td>serving apartment complexes for fifteen years<\/td><td>details about his business<\/td><td>158<\/td><\/tr>\n<tr><td>enclosed … standard contract<\/td><td>a sample contract (sent with the letter)<\/td><td>160<\/td><\/tr>\n<tr><td>boost your social media presence<\/td><td>increase social media traffic<\/td><td>161<\/td><\/tr>\n<tr><td>chair, lamp, table, bookshelf, desk<\/td><td>furniture<\/td><td>162<\/td><\/tr>\n<tr><td>a link from an advertisement on another company's Web site<\/td><td>advertises on other Web sites<\/td><td>163<\/td><\/tr>\n<tr><td>announced the appointment … head of Digital Media<\/td><td>hiring of a media specialist<\/td><td>164<\/td><\/tr>\n<tr><td>a clear view of the building from my apartment<\/td><td>see the museum from her home<\/td><td>166<\/td><\/tr>\n<tr><td>brainstorming, bring your suggestions<\/td><td>generate new ideas<\/td><td>168<\/td><\/tr>\n<tr><td>advertising and promotional concepts<\/td><td>marketing plans<\/td><td>169<\/td><\/tr>\n<tr><td>brief Scott Kennedy<\/td><td>provide information to a colleague<\/td><td>171<\/td><\/tr>\n<tr><td>design contest<\/td><td>art competition<\/td><td>172<\/td><\/tr>\n<tr><td>young designers<\/td><td>art students<\/td><td>173<\/td><\/tr>\n<tr><td>submitted online, visit the website<\/td><td>register on the website<\/td><td>175<\/td><\/tr>\n<\/tbody><\/table><p><b>Các dạng câu cần nhớ:<\/b> câu hỏi ý định (\"what does … mean when…\": đọc câu ngay trước và sau, câu 153, 170) · câu NOT (dò từng đáp án, loại cái có trong bài, câu 159) · điền câu (tìm chữ chỉ lại ý trước như <i>that time<\/i>, <i>She replaces<\/i>, câu 157, 167) · câu suy luận (bài không ghi thẳng, câu 147, 162, 173).<\/p><p><b>Bẫy lặp từ:<\/b> cafeteria (147), chairperson / videoconference (152), gift / closet (154), voice mail / database (155), reference (158), bookshelf / gardens (162), United States / Canada / Kenya (165), Blackwood (170, 171). Thấy chữ giống trong bài chưa chắc là đáp án đúng: đọc kỹ động từ đi kèm (studied hay taught? cung cấp hay xin?).<\/p>\n<p><b>Bài tập về nhà gợi ý:<\/b> với mỗi câu, gạch dưới câu trong bài chứa đáp án và chép cặp \"trong bài → trong đáp án\" vào vở theo bảng trên.<\/p>","exam":"TOEIC-PRE-MOCK6","examSrc":"/pretoeicnew-mocktest/"};</script>
