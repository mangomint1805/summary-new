<script>window.MT={"n":1,"part":1,"partName":"Part 1","sub":"Photographs · Mô tả tranh · 6 câu (1–6)","intro":"Trang này chữa <b>Mock Test 1 (Part 1)<\/b>. Mỗi câu có tranh, nút nghe lại và 4 câu mô tả (giống đề thật, chữ của đáp án được ẩn đến khi bạn chọn). <b>Cách học:<\/b> nhìn tranh → nghe → tự chọn đáp án → đọc dịch và giải thích vì sao các câu kia sai.","stepsTitle":"Cách làm Part 1: 3 bước","steps":["<b>Nhìn tranh trước khi nghe.<\/b> Tự hỏi: có mấy người, ai <i>đứng<\/i> ai <i>ngồi<\/i>, họ đang <i>làm gì<\/i>, có <i>đồ vật<\/i> gì, ở <i>đâu<\/i> (văn phòng, phòng họp, ngoài trời).","<b>Nghe kỹ động từ.<\/b> Đa số câu có dạng <i>is/are + V-ing<\/i> (đang làm gì). Sai một động tác là loại: <i>painting<\/i> (đang sơn) ≠ <i>picking up<\/i> (nhặt lên), <i>standing<\/i> ≠ <i>sitting<\/i>.","<b>Loại trừ từng câu.<\/b> Nghe câu nào đánh dấu đúng / sai câu đó. Cẩn thận <b>bẫy<\/b>: câu nhắc đúng đồ vật có trong tranh (giấy, laptop, hồ sơ, cọ sơn) nhưng sai hành động, hoặc đúng hành động nhưng sai người (người ngồi là phụ nữ chứ không phải đàn ông)."],"hideOpts":true,"hideHint":"Nghe rồi chọn","groups":[{"title":"Câu 1","tag":"Cùng xem màn hình","audio":"../audio/mk1/c1.mp3","imgs":["img/mk1/p1.webp"],"qs":[{"n":1,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"A woman is sending a fax.","vi":"Một người phụ nữ đang gửi fax."},{"t":"They are looking at the monitor.","vi":"Họ đang nhìn vào màn hình máy tính."},{"t":"A man is sitting on a chair.","vi":"Một người đàn ông đang ngồi trên ghế."},{"t":"They are shaking hands with each other.","vi":"Họ đang bắt tay nhau."}],"ans":["B"],"key":"look at the monitor = nhìn vào màn hình","ex":"Tranh: cô gái ngồi, chàng trai đứng phía sau, cả hai cùng nhìn và chỉ vào màn hình máy tính. (A) sai: không có máy fax. (C) là bẫy: có người ngồi ghế nhưng đó là người phụ nữ, người đàn ông đang đứng. (D) sai: không ai bắt tay."}]},{"title":"Câu 2","tag":"Làm việc ở bàn","audio":"../audio/mk1/c2.mp3","imgs":["img/mk1/p2.webp"],"qs":[{"n":2,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"A woman is working at a desk.","vi":"Một người phụ nữ đang làm việc ở bàn."},{"t":"A woman is moving some chairs.","vi":"Một người phụ nữ đang di chuyển mấy cái ghế."},{"t":"A woman is stacking some folders.","vi":"Một người phụ nữ đang xếp chồng mấy tập hồ sơ."},{"t":"A woman is leaving the office.","vi":"Một người phụ nữ đang rời văn phòng."}],"ans":["A"],"key":"work at a desk = làm việc ở bàn","ex":"Tranh: người phụ nữ ngồi ở bàn, tay cầm chuột máy tính, đang làm việc. (B) sai: cô ấy ngồi yên, không kéo ghế. (C) là bẫy: trên kệ có hồ sơ, nhưng cô ấy không xếp. (D) sai: cô ấy đang ngồi, không đi ra ngoài."}]},{"title":"Câu 3","tag":"Họp nhóm","audio":"../audio/mk1/c3.mp3","imgs":["img/mk1/p3.webp"],"qs":[{"n":3,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"They are arranging some papers.","vi":"Họ đang sắp xếp giấy tờ."},{"t":"They are buying some office supplies.","vi":"Họ đang mua đồ dùng văn phòng."},{"t":"They are attending a meeting.","vi":"Họ đang dự một cuộc họp."},{"t":"They are taking some notes.","vi":"Họ đang ghi chép."}],"ans":["C"],"key":"attend a meeting = dự họp","ex":"Tranh: năm người ngồi quanh bàn tròn có laptop, giấy tờ, một người đang nói, những người khác lắng nghe: đó là một cuộc họp. (A) và (D) là bẫy: trên bàn có giấy, nhưng không ai đang sắp xếp hay viết. (B) sai: đây là phòng họp, không phải cửa hàng."}]},{"title":"Câu 4","tag":"Thuyết trình","audio":"../audio/mk1/c4.mp3","imgs":["img/mk1/p4.webp"],"qs":[{"n":4,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"A woman is typing on a keyboard.","vi":"Một người phụ nữ đang gõ bàn phím."},{"t":"A woman is making a presentation.","vi":"Một người phụ nữ đang thuyết trình."},{"t":"A man is making a copy.","vi":"Một người đàn ông đang photo tài liệu."},{"t":"A man is making an appointment.","vi":"Một người đàn ông đang đặt lịch hẹn."}],"ans":["B"],"key":"make a presentation = thuyết trình","ex":"Tranh: người phụ nữ đứng cạnh bảng giấy, tay chỉ vào biểu đồ, hai người đàn ông ngồi nghe: cô ấy đang thuyết trình. (A) là bẫy: có laptop trên bàn nhưng người phụ nữ không gõ phím. (C) sai: không có máy photo. (D) sai: không ai gọi điện hay đặt lịch hẹn."}]},{"title":"Câu 5","tag":"Đọc tài liệu","audio":"../audio/mk1/c5.mp3","imgs":["img/mk1/p5.webp"],"qs":[{"n":5,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"He is looking at some documents.","vi":"Anh ấy đang xem mấy tờ tài liệu."},{"t":"He is typing on a laptop.","vi":"Anh ấy đang gõ trên máy tính xách tay."},{"t":"He is using a printer.","vi":"Anh ấy đang dùng máy in."},{"t":"He is standing on a podium.","vi":"Anh ấy đang đứng trên bục."}],"ans":["A"],"key":"look at documents = xem tài liệu","ex":"Tranh: người đàn ông đứng cạnh cửa sổ, hai tay cầm mấy tờ giấy và cúi nhìn vào đó. (B) và (C) sai: không có laptop hay máy in. (D) là bẫy: anh ấy có đứng, nhưng đứng trên sàn cạnh cửa sổ, không phải trên bục (podium = bục phát biểu)."}]},{"title":"Câu 6","tag":"Sơn nhà","audio":"../audio/mk1/c6.mp3","imgs":["img/mk1/p6.webp"],"qs":[{"n":6,"q":"Chọn câu mô tả đúng nhất bức tranh.","qvi":"","opts":[{"t":"The man is putting on a hat.","vi":"Người đàn ông đang đội mũ."},{"t":"The man is picking up a brush.","vi":"Người đàn ông đang nhặt cây cọ lên."},{"t":"The man is painting a building.","vi":"Người đàn ông đang sơn một tòa nhà."},{"t":"The man has a business card.","vi":"Người đàn ông có một tấm danh thiếp."}],"ans":["C"],"key":"paint = sơn","ex":"Tranh: người đàn ông quỳ trên giàn giáo, cầm cọ sơn khung cửa sổ của tòa nhà, bên cạnh có thùng sơn. (B) là bẫy: anh ấy đã cầm cọ và đang sơn, không phải đang nhặt cọ lên (pick up = nhặt lên). (A) sai: anh ấy không đội mũ. (D) sai: không có danh thiếp."}]}],"recap":"<h2>Ghi nhớ: từ vựng tả tranh văn phòng<\/h2><table><tbody><tr><td><b>Cụm từ<\/b><\/td><td><b>Nghĩa<\/b><\/td><td><b>Câu<\/b><\/td><\/tr><tr><td>look at the monitor<\/td><td>nhìn màn hình máy tính<\/td><td>1<\/td><\/tr><tr><td>send a fax<\/td><td>gửi fax<\/td><td>1<\/td><\/tr><tr><td>shake hands<\/td><td>bắt tay<\/td><td>1<\/td><\/tr><tr><td>work at a desk<\/td><td>làm việc ở bàn<\/td><td>2<\/td><\/tr><tr><td>stack some folders<\/td><td>xếp chồng hồ sơ<\/td><td>2<\/td><\/tr><tr><td>leave the office<\/td><td>rời văn phòng<\/td><td>2<\/td><\/tr><tr><td>attend a meeting<\/td><td>dự họp<\/td><td>3<\/td><\/tr><tr><td>arrange some papers<\/td><td>sắp xếp giấy tờ<\/td><td>3<\/td><\/tr><tr><td>take notes<\/td><td>ghi chép<\/td><td>3<\/td><\/tr><tr><td>office supplies<\/td><td>đồ dùng văn phòng<\/td><td>3<\/td><\/tr><tr><td>make a presentation<\/td><td>thuyết trình<\/td><td>4<\/td><\/tr><tr><td>type on a keyboard<\/td><td>gõ bàn phím<\/td><td>4<\/td><\/tr><tr><td>make a copy<\/td><td>photo tài liệu<\/td><td>4<\/td><\/tr><tr><td>make an appointment<\/td><td>đặt lịch hẹn<\/td><td>4<\/td><\/tr><tr><td>look at some documents<\/td><td>xem tài liệu<\/td><td>5<\/td><\/tr><tr><td>stand on a podium<\/td><td>đứng trên bục<\/td><td>5<\/td><\/tr><tr><td>paint a building<\/td><td>sơn tòa nhà<\/td><td>6<\/td><\/tr><tr><td>pick up a brush<\/td><td>nhặt cọ lên<\/td><td>6<\/td><\/tr><tr><td>put on a hat<\/td><td>đội mũ (động tác)<\/td><td>6<\/td><\/tr><tr><td>business card<\/td><td>danh thiếp<\/td><td>6<\/td><\/tr><\/tbody><\/table><p><b>Các bẫy hay gặp:<\/b> đúng hành động nhưng sai người (câu 1: người ngồi là phụ nữ, đàn ông đang đứng); có đồ vật trong tranh nhưng không ai dùng (giấy ở câu 3, laptop ở câu 4, hồ sơ ở câu 2); đúng người nhưng sai động tác (câu 6: đang sơn chứ không phải nhặt cọ; câu 5: đứng cạnh cửa sổ chứ không đứng trên bục).<\/p><p><b>Bài tập về nhà gợi ý:<\/b> nghe lại từng câu, chép 4 câu mô tả vào vở, đánh dấu đúng/sai và ghi vì sao sai (người/vật không có, sai động tác, sai người). Sau đó tự tả mỗi tranh bằng 2 câu <i>is/are + V-ing<\/i>.<\/p>","exam":"TOEIC-PRE-MOCK1","examSrc":"/pretoeicnew-mocktest/"};</script>
