<script>window.MT={"n":5,"part":3,"partName":"Part 3","sub":"Short Conversations · Hội thoại ngắn · 39 câu (32–70)","intro":"Trang này chữa <b>Mock Test 5 (Part 3)<\/b>. Mỗi đoạn hội thoại có nút nghe lại, lời thoại kèm dịch và 3 câu hỏi. <b>Cách học:<\/b> nghe đoạn hội thoại → tự chọn đáp án → đọc giải thích → mở lời thoại xem đáp án nằm ở câu nào.","stepsTitle":"Cách làm Part 3: 3 bước","steps":["<b>Đọc trước câu hỏi.<\/b> Gạch từ khóa: who / where / when / what … next, và câu hỏi về <i>man<\/i> hay <i>woman<\/i>.","<b>Nghe theo thứ tự.<\/b> Đáp án xuất hiện lần lượt: câu đầu ở đầu bài, câu cuối ở cuối bài. Câu hỏi có <i>next<\/i>, <i>in the end<\/i> thường nằm ở câu cuối.","<b>Bắt paraphrase (cách nói lại).<\/b> Đáp án đúng thường nói lại ý bằng từ khác: <i>notepads and pens → office supplies<\/i>. Đáp án lặp lại đúng từ trong bài (office, carrot cake, manager…) thường là <b>bẫy<\/b>."],"groups":[{"title":"Hội thoại 32–34 · Đặt văn phòng phẩm","audio":"../audio/mk5/c32.mp3","script":[{"sp":"M","t":"Hello. (32) I would like to place an order for some **notepads and pens**.","vi":"Xin chào. Tôi muốn đặt mua một ít sổ ghi chép và bút."},{"sp":"W","t":"How many do you need?","vi":"Anh cần bao nhiêu ạ?"},{"sp":"M","t":"I need 50 of each. (33) And I want them **no later than next Thursday**.","vi":"Tôi cần mỗi loại 50 cái. Và tôi muốn nhận hàng chậm nhất là thứ Năm tuần sau."},{"sp":"W","t":"I can do that. (34) Do you want me to **have them delivered to your office**?","vi":"Tôi làm được. Anh có muốn tôi cho giao hàng đến văn phòng của anh không?"}],"qs":[{"n":32,"q":"What does the man want to order?","qvi":"Người đàn ông muốn đặt mua gì?","opts":[{"t":"Office supplies","vi":"Văn phòng phẩm (đồ dùng văn phòng)"},{"t":"Television","vi":"Ti vi"},{"t":"Flowers","vi":"Hoa"},{"t":"Suitcases","vi":"Va li"}],"ans":["A"],"key":"notepads and pens = office supplies","ex":"Sổ ghi chép (notepads) và bút (pens) đều là đồ dùng văn phòng: office supplies. Đáp án đúng nói lại ý bằng một từ chung hơn."},{"n":33,"q":"When does the man request that the order be available?","qvi":"Người đàn ông yêu cầu đơn hàng có sẵn khi nào?","opts":[{"t":"Next Tuesday","vi":"Thứ Ba tuần sau"},{"t":"Next Wednesday","vi":"Thứ Tư tuần sau"},{"t":"Next Thursday","vi":"Thứ Năm tuần sau"},{"t":"Next Friday","vi":"Thứ Sáu tuần sau"}],"ans":["C"],"key":"no later than next Thursday = chậm nhất thứ Năm tuần sau","ex":"Anh ấy nói \"no later than next Thursday\" (không muộn hơn thứ Năm tuần sau). Câu hỏi về ngày tháng: nghe kỹ tên thứ, đừng đoán."},{"n":34,"q":"What does the woman suggest?","qvi":"Người phụ nữ đề nghị điều gì?","opts":[{"t":"Making a payment","vi":"Thanh toán tiền"},{"t":"Getting a refund","vi":"Nhận lại tiền hoàn"},{"t":"Printing a receipt","vi":"In hóa đơn"},{"t":"Delivering them to the office","vi":"Giao hàng đến văn phòng"}],"ans":["D"],"key":"Do you want me to have them delivered…? = lời đề nghị","ex":"Câu \"Do you want me to…?\" (Anh có muốn tôi… không?) là cách đề nghị giúp. Cô ấy đề nghị giao hàng đến văn phòng: delivered to your office. Bài không nói gì về trả tiền hay hóa đơn."}]},{"title":"Hội thoại 35–37 · Gọi món ở nhà hàng","audio":"../audio/mk5/c35.mp3","script":[{"sp":"M","t":"Excuse me. (35) I would like to know more about **today's specials**.","vi":"Xin lỗi. Tôi muốn biết thêm về các món đặc biệt hôm nay."},{"sp":"W","t":"Today, we have grilled fish and roast chicken served with salad and chips.","vi":"Hôm nay chúng tôi có cá nướng và gà quay, ăn kèm salad và khoai tây chiên."},{"sp":"M","t":"(36) I think **I'll have the grilled fish**.","vi":"Tôi nghĩ tôi sẽ dùng món cá nướng."},{"sp":"W","t":"What would you like for your dessert?","vi":"Anh muốn dùng món tráng miệng gì ạ?"},{"sp":"M","t":"(37) I'll **look at the menu** for a bit and then call you later.","vi":"Tôi sẽ xem thực đơn một chút rồi gọi chị sau."}],"qs":[{"n":35,"q":"Where does the conversation most likely take place?","qvi":"Cuộc hội thoại có lẽ diễn ra ở đâu?","opts":[{"t":"At a grocery store","vi":"Ở cửa hàng tạp hóa"},{"t":"At a coffee shop","vi":"Ở quán cà phê"},{"t":"At a restaurant","vi":"Ở nhà hàng"},{"t":"At an airport","vi":"Ở sân bay"}],"ans":["C"],"key":"today's specials, grilled fish, dessert → nhà hàng","ex":"Các từ \"today's specials\" (món đặc biệt hôm nay), \"grilled fish\", \"dessert\" (tráng miệng) cho thấy đây là nhà hàng. Quán cà phê (B) thường không có cá nướng, gà quay."},{"n":36,"q":"What does the man order?","qvi":"Người đàn ông gọi món gì?","opts":[{"t":"Grilled fish","vi":"Cá nướng"},{"t":"A cup of tea","vi":"Một tách trà"},{"t":"A bottle of wine","vi":"Một chai rượu vang"},{"t":"Roast chicken","vi":"Gà quay"}],"ans":["A"],"key":"I'll have the grilled fish","ex":"Cô phục vụ kể hai món: cá nướng và gà quay. Anh ấy chọn \"the grilled fish\". Gà quay (D) là bẫy: có được nhắc đến nhưng anh ấy không chọn."},{"n":37,"q":"What will the man most likely do next?","qvi":"Người đàn ông có lẽ sẽ làm gì tiếp theo?","opts":[{"t":"Talk to his colleague","vi":"Nói chuyện với đồng nghiệp"},{"t":"Go to a hotel","vi":"Đến khách sạn"},{"t":"Make a telephone call","vi":"Gọi điện thoại"},{"t":"See the menu","vi":"Xem thực đơn"}],"ans":["D"],"key":"look at the menu = see the menu","ex":"Anh ấy nói sẽ xem thực đơn một chút: look at the menu = see the menu. (C) là bẫy: \"call you later\" ở đây là gọi cô phục vụ lại bàn, không phải gọi điện thoại."}]},{"title":"Hội thoại 38–40 · Món chính và đồ uống","audio":"../audio/mk5/c38.mp3","script":[{"sp":"M","t":"(38) **May I take your order?**","vi":"Tôi có thể ghi món cho chị được chưa ạ?"},{"sp":"W","t":"The pasta looks good. Can I have a piece of carrot cake with it?","vi":"Món mì Ý trông ngon đấy. Cho tôi một miếng bánh cà rốt ăn kèm được không?"},{"sp":"M","t":"Sorry, but the carrot cake only comes with the fish burger. (39) We serve **chips with tomato spaghetti**.","vi":"Xin lỗi, bánh cà rốt chỉ đi kèm bánh mì kẹp cá. Món mì Ý sốt cà chua thì chúng tôi phục vụ kèm khoai tây chiên."},{"sp":"W","t":"It's so difficult for me. Then I will just have the tomato spaghetti for my main course. (40) Can I have **a glass of wine**, please?","vi":"Khó chọn quá. Vậy tôi chỉ gọi mì Ý sốt cà chua làm món chính thôi. Cho tôi một ly rượu vang nhé?"}],"qs":[{"n":38,"q":"Who most likely is the man?","qvi":"Người đàn ông có lẽ là ai?","opts":[{"t":"A sales manager","vi":"Quản lý bán hàng"},{"t":"A waiter","vi":"Người phục vụ bàn"},{"t":"A car mechanic","vi":"Thợ sửa ô tô"},{"t":"An office cleaner","vi":"Nhân viên dọn dẹp văn phòng"}],"ans":["B"],"key":"May I take your order? = câu của người phục vụ","ex":"\"May I take your order?\" (Tôi ghi món được chưa?) là câu quen thuộc của người phục vụ ở nhà hàng: a waiter."},{"n":39,"q":"According to the man, what side is served with the tomato spaghetti?","qvi":"Theo người đàn ông, món ăn kèm nào được phục vụ cùng mì Ý sốt cà chua?","opts":[{"t":"Chips","vi":"Khoai tây chiên"},{"t":"Salad","vi":"Salad"},{"t":"Soup","vi":"Súp"},{"t":"Fish sauce","vi":"Nước mắm"}],"ans":["A"],"key":"We serve chips with tomato spaghetti","ex":"Anh ấy nói rõ: \"We serve chips with tomato spaghetti\". Chips là khoai tây chiên. Đừng nhầm với bánh cà rốt: món đó chỉ đi kèm bánh mì kẹp cá."},{"n":40,"q":"What does the woman order next after the main course?","qvi":"Sau món chính, người phụ nữ gọi thêm gì?","opts":[{"t":"Mineral water","vi":"Nước khoáng"},{"t":"Cheese","vi":"Phô mai"},{"t":"Cake","vi":"Bánh ngọt"},{"t":"Wine","vi":"Rượu vang"}],"ans":["D"],"key":"Can I have a glass of wine?","ex":"Sau khi chọn món chính, cô ấy gọi \"a glass of wine\" (một ly rượu vang). (C) Cake là bẫy: cô ấy muốn bánh cà rốt nhưng không được, nên không gọi."}]},{"title":"Hội thoại 41–43 · Kiểm tra đơn đặt đồ ăn","audio":"../audio/mk5/c41.mp3","script":[{"sp":"M","t":"Hello. (41) I would like to **check the order** I placed with your restaurant (42) for a **luncheon** next Wednesday.","vi":"Xin chào. Tôi muốn kiểm tra lại đơn hàng tôi đã đặt ở nhà hàng của chị cho một bữa tiệc trưa vào thứ Tư tuần sau."},{"sp":"W","t":"Can I have your name?","vi":"Cho tôi xin tên anh ạ?"},{"sp":"M","t":"It's Mark Spencer. I ordered sandwiches, beverages, and cakes for dessert.","vi":"Tôi là Mark Spencer. Tôi đã đặt bánh sandwich, đồ uống và bánh ngọt tráng miệng."},{"sp":"W","t":"Yes, I have your order right here. It is supposed to be delivered to your office around 11 A.M. on Wednesday.","vi":"Vâng, đơn của anh đây rồi. Đơn sẽ được giao đến văn phòng anh khoảng 11 giờ sáng thứ Tư."},{"sp":"M","t":"That is great. (43) By the way, could you deliver the lunch **to the lobby and not to my office**?","vi":"Tốt quá. Nhân tiện, chị có thể giao bữa trưa đến sảnh chứ đừng giao đến văn phòng tôi được không?"},{"sp":"W","t":"Okay, no problem.","vi":"Vâng, không vấn đề gì."}],"qs":[{"n":41,"q":"What is the purpose of the man's call?","qvi":"Mục đích cuộc gọi của người đàn ông là gì?","opts":[{"t":"To complain about the service","vi":"Để phàn nàn về dịch vụ"},{"t":"To confirm an order","vi":"Để xác nhận một đơn hàng"},{"t":"To cancel an order","vi":"Để hủy một đơn hàng"},{"t":"To reschedule a meeting","vi":"Để dời lịch một cuộc họp"}],"ans":["B"],"key":"check the order = confirm an order","ex":"Anh ấy gọi để kiểm tra lại đơn đã đặt: check the order = confirm an order (xác nhận đơn hàng). Anh ấy không hủy đơn, chỉ đổi chỗ giao."},{"n":42,"q":"Why does the man need food?","qvi":"Vì sao người đàn ông cần đồ ăn?","opts":[{"t":"For a company banquet","vi":"Cho tiệc lớn của công ty"},{"t":"For a luncheon","vi":"Cho một bữa tiệc trưa"},{"t":"For a retirement party","vi":"Cho tiệc nghỉ hưu"},{"t":"For a reception","vi":"Cho một buổi tiệc chiêu đãi"}],"ans":["B"],"key":"for a luncheon next Wednesday","ex":"Ngay câu đầu anh ấy nói \"for a luncheon\" (bữa tiệc trưa). Luncheon = lunch: tên gọi trang trọng của bữa trưa."},{"n":43,"q":"Where will the woman leave the food?","qvi":"Người phụ nữ sẽ để đồ ăn ở đâu?","opts":[{"t":"In a lobby","vi":"Ở sảnh"},{"t":"In an office","vi":"Ở văn phòng"},{"t":"In a meeting room","vi":"Ở phòng họp"},{"t":"In a conference room","vi":"Ở phòng hội nghị"}],"ans":["A"],"key":"to the lobby and not to my office","ex":"Ban đầu đơn giao đến văn phòng, nhưng anh ấy đổi: \"to the lobby and not to my office\". (B) Office là bẫy: từ \"office\" được nhắc nhiều lần nhưng đã bị đổi. Nghe đến cuối đoạn!"}]},{"title":"Hội thoại 44–46 · Máy in lại hỏng","audio":"../audio/mk5/c44.mp3","script":[{"sp":"W","t":"Oh, no. (45) This **printer is broken** again. It's the third time this month. (44) How should I print some documents for my **presentation** in the afternoon?","vi":"Ôi không. Cái máy in này lại hỏng rồi. Lần thứ ba trong tháng này. Làm sao tôi in tài liệu cho bài thuyết trình chiều nay đây?"},{"sp":"M","t":"If you are in a hurry, (46) you can **use the printer in the marketing Department**. That one is pretty new.","vi":"Nếu chị đang vội, chị có thể dùng máy in ở phòng Marketing. Cái đó khá mới."},{"sp":"W","t":"That's a good idea. I might as well go there. I have some documents to print.","vi":"Ý hay đấy. Chắc tôi qua đó luôn. Tôi có ít tài liệu cần in."}],"qs":[{"n":44,"q":"Where do the speakers work?","qvi":"Hai người nói chuyện làm việc ở đâu?","opts":[{"t":"At a clothing store","vi":"Ở cửa hàng quần áo"},{"t":"At an office","vi":"Ở văn phòng"},{"t":"At a fitness center","vi":"Ở trung tâm thể dục"},{"t":"At a restaurant","vi":"Ở nhà hàng"}],"ans":["B"],"key":"printer, documents, presentation, marketing department → văn phòng","ex":"Máy in, tài liệu, bài thuyết trình, phòng Marketing: đây là những thứ ở văn phòng công ty."},{"n":45,"q":"What problem does the woman mention?","qvi":"Người phụ nữ nói đến vấn đề gì?","opts":[{"t":"A printer cannot be used.","vi":"Một máy in không dùng được."},{"t":"A holiday is coming up.","vi":"Sắp đến kỳ nghỉ lễ."},{"t":"A team member left for another job.","vi":"Một thành viên trong nhóm đã nghỉ sang chỗ khác."},{"t":"Some equipment is unavailable.","vi":"Một số thiết bị không có sẵn."}],"ans":["A"],"key":"printer is broken = a printer cannot be used","ex":"\"This printer is broken\" (máy in hỏng) = a printer cannot be used (không dùng được). (D) nói chung chung về \"một số thiết bị\", còn (A) nói đúng vấn đề là cái máy in."},{"n":46,"q":"What does the man suggest to do?","qvi":"Người đàn ông gợi ý làm gì?","opts":[{"t":"Clean some equipment","vi":"Lau chùi thiết bị"},{"t":"Place a supply order","vi":"Đặt mua đồ dùng"},{"t":"Use a new one in another department","vi":"Dùng cái mới ở phòng ban khác"},{"t":"Call a technician","vi":"Gọi thợ sửa"}],"ans":["C"],"key":"the printer in the marketing Department… pretty new = a new one in another department","ex":"Anh ấy gợi ý dùng máy in ở phòng Marketing, cái đó khá mới: = use a new one in another department. Không ai nói đến chuyện gọi thợ sửa (D)."}]},{"title":"Hội thoại 47–49 · Chuyến công tác Mexico","audio":"../audio/mk5/c47.mp3","script":[{"sp":"M","t":"Hey, Ms. Jessica. I will be away for the next couple of days. You know that, right?","vi":"Này chị Jessica. Tôi sẽ đi vắng vài ngày tới. Chị biết rồi phải không?"},{"sp":"W","t":"Yes, (47) are you going on a **business trip**?","vi":"Vâng, anh đi công tác à?"},{"sp":"M","t":"Yeah, (48) I am leaving on Friday to spend a few days **in Mexico**. I am looking forward to it.","vi":"Ừ, tôi đi vào thứ Sáu, ở Mexico vài ngày. Tôi rất mong chờ chuyến đi."},{"sp":"W","t":"Sounds exciting. When are you coming back?","vi":"Nghe thú vị thật. Khi nào anh về?"},{"sp":"M","t":"I am coming back from Mexico on Monday. (49) But I will be **in the office on Tuesday**.","vi":"Tôi từ Mexico về vào thứ Hai. Nhưng thứ Ba tôi mới có mặt ở văn phòng."}],"qs":[{"n":47,"q":"What are the speakers talking about?","qvi":"Hai người đang nói về điều gì?","opts":[{"t":"Their plans for the weekend","vi":"Kế hoạch cuối tuần của họ"},{"t":"A holiday","vi":"Một kỳ nghỉ"},{"t":"A business trip","vi":"Một chuyến công tác"},{"t":"A restaurant","vi":"Một nhà hàng"}],"ans":["C"],"key":"business trip = chuyến công tác","ex":"Cô ấy hỏi \"are you going on a business trip?\" và anh ấy trả lời \"Yeah\". (A) là bẫy: anh ấy đi vào thứ Sáu và về thứ Hai, có qua cuối tuần, nhưng chủ đề là chuyến công tác."},{"n":48,"q":"Where will the man go?","qvi":"Người đàn ông sẽ đi đâu?","opts":[{"t":"In Mexico","vi":"Mexico"},{"t":"In New York","vi":"New York"},{"t":"In Australia","vi":"Úc"},{"t":"In Russia","vi":"Nga"}],"ans":["A"],"key":"spend a few days in Mexico","ex":"Anh ấy nói \"spend a few days in Mexico\". Tên địa điểm thường được nhắc thẳng, chỉ cần nghe đúng tên."},{"n":49,"q":"When is the man coming back to the office?","qvi":"Khi nào người đàn ông quay lại văn phòng?","opts":[{"t":"On Monday","vi":"Thứ Hai"},{"t":"On Tuesday","vi":"Thứ Ba"},{"t":"On Wednesday","vi":"Thứ Tư"},{"t":"On Thursday","vi":"Thứ Năm"}],"ans":["B"],"key":"back from Mexico on Monday ≠ in the office on Tuesday","ex":"Bẫy hay gặp: thứ Hai (A) là ngày anh ấy về từ Mexico, còn ngày đến văn phòng là thứ Ba: \"I will be in the office on Tuesday\". Đọc kỹ câu hỏi: \"back to the office\"."}]},{"title":"Hội thoại 50–52 · Nhờ thư ký lo chuyến đi","audio":"../audio/mk5/c50.mp3","script":[{"sp":"M","t":"I have to go away on business next week.","vi":"Tuần sau tôi phải đi công tác."},{"sp":"W","t":"What do you need me to do?","vi":"Anh cần tôi làm gì ạ?"},{"sp":"M","t":"(50) I need you to **organize the trip for me**. (51) I'm thinking of leaving for Italy next Thursday and **coming back on Sunday**.","vi":"Tôi cần cô sắp xếp chuyến đi cho tôi. Tôi định đi Ý vào thứ Năm tuần sau và về vào Chủ nhật."},{"sp":"W","t":"Is there a budget for your flight and accommodations?","vi":"Có ngân sách cho vé máy bay và chỗ ở của anh không ạ?"},{"sp":"M","t":"Yes. (52) You can **contact our travel agency**, and I think someone there will handle everything needed for my trip.","vi":"Có. Cô có thể liên hệ công ty du lịch của chúng ta, tôi nghĩ người bên đó sẽ lo mọi thứ cần cho chuyến đi."}],"qs":[{"n":50,"q":"Who most likely is the woman?","qvi":"Người phụ nữ có lẽ là ai?","opts":[{"t":"A travel agent","vi":"Nhân viên công ty du lịch"},{"t":"A secretary","vi":"Thư ký"},{"t":"A manager","vi":"Quản lý"},{"t":"A receptionist","vi":"Lễ tân"}],"ans":["B"],"key":"What do you need me to do? / organize the trip for me → thư ký","ex":"Cô ấy hỏi sếp cần mình làm gì, và được nhờ sắp xếp chuyến công tác: đó là việc của thư ký (secretary). (A) là bẫy: công ty du lịch (travel agency) là nơi cô ấy sẽ liên hệ, không phải cô ấy."},{"n":51,"q":"When is the man planning to come back?","qvi":"Người đàn ông định về khi nào?","opts":[{"t":"Tomorrow","vi":"Ngày mai"},{"t":"This Thursday","vi":"Thứ Năm này"},{"t":"This Saturday","vi":"Thứ Bảy này"},{"t":"Next Sunday","vi":"Chủ nhật tuần sau"}],"ans":["D"],"key":"leaving next Thursday and coming back on Sunday","ex":"Anh ấy đi vào thứ Năm tuần sau và về vào Chủ nhật (của chuyến đi tuần sau): next Sunday. (B) là bẫy: thứ Năm là ngày đi, không phải ngày về."},{"n":52,"q":"What will the woman do next?","qvi":"Người phụ nữ sẽ làm gì tiếp theo?","opts":[{"t":"Call a travel agency","vi":"Gọi cho công ty du lịch"},{"t":"Reserve an airline ticket","vi":"Đặt vé máy bay"},{"t":"Pack a suitcase","vi":"Xếp va li"},{"t":"Contact the marketing department","vi":"Liên hệ phòng Marketing"}],"ans":["A"],"key":"contact our travel agency = call a travel agency","ex":"Anh ấy bảo cô liên hệ công ty du lịch: contact = call. (B) là bẫy: vé máy bay sẽ do người bên công ty du lịch lo."}]},{"title":"Hội thoại 53–55 · Thực đơn bữa trưa","audio":"../audio/mk5/c53.mp3","script":[{"sp":"W","t":"Good evening. I am your server, Wendy. (53) Today, we have 3 lunch specials. You can see them on this menu.","vi":"Chào buổi tối. Tôi là Wendy, người phục vụ của anh. Hôm nay chúng tôi có 3 suất trưa đặc biệt. Anh có thể xem trong thực đơn này."},{"sp":"M","t":"Oh, the second one looks good. But can I have a green salad instead of mashed potatoes? I would like a beef steak, but I don't want to eat potatoes.","vi":"Ồ, suất thứ hai trông ngon đấy. Nhưng tôi đổi khoai tây nghiền lấy salad rau xanh được không? Tôi muốn bít tết bò nhưng không muốn ăn khoai tây."},{"sp":"W","t":"Sorry, sir. (54) **You cannot mix them up**.","vi":"Xin lỗi anh. Anh không thể trộn đổi các món được ạ."},{"sp":"M","t":"(55) Then I will just have **the one with spaghetti**.","vi":"Vậy tôi chỉ gọi suất có mì Ý thôi."}],"qs":[{"n":53,"q":"Who most likely is the man?","qvi":"Người đàn ông có lẽ là ai?","opts":[{"t":"A restaurant owner","vi":"Chủ nhà hàng"},{"t":"A cleaner","vi":"Nhân viên dọn dẹp"},{"t":"A customer","vi":"Khách hàng"},{"t":"A server","vi":"Người phục vụ"}],"ans":["C"],"key":"I am your server → người đàn ông là khách","ex":"Cô Wendy nói \"I am your server\" (tôi là người phục vụ của anh), nên anh ấy là khách đang gọi món. (D) Server là bẫy: đó là nghề của cô ấy, không phải anh ấy."},{"n":54,"q":"What does the woman mention about the lunch specials?","qvi":"Người phụ nữ nói gì về các suất trưa đặc biệt?","opts":[{"t":"They come with free drinks.","vi":"Có kèm đồ uống miễn phí."},{"t":"The type of food cannot be changed.","vi":"Không đổi được loại món ăn."},{"t":"More than two cannot be ordered.","vi":"Không được gọi hơn hai suất."},{"t":"They are available for free.","vi":"Được ăn miễn phí."}],"ans":["B"],"key":"You cannot mix them up = the type of food cannot be changed","ex":"Anh ấy muốn đổi khoai tây nghiền thành salad, cô ấy nói \"You cannot mix them up\" (không trộn đổi được) = món ăn không đổi được."},{"n":55,"q":"What does the customer decide to order in the end?","qvi":"Cuối cùng vị khách quyết định gọi gì?","opts":[{"t":"Spaghetti","vi":"Mì Ý"},{"t":"Cheeseburger","vi":"Bánh mì kẹp phô mai"},{"t":"Green salad","vi":"Salad rau xanh"},{"t":"Tomato soup","vi":"Súp cà chua"}],"ans":["A"],"key":"Then I will just have the one with spaghetti","ex":"Không đổi món được, anh ấy chốt \"the one with spaghetti\". (C) Green salad là bẫy: anh ấy muốn salad nhưng không được. Từ \"in the end\" (cuối cùng) nhắc ta nghe câu cuối."}]},{"title":"Hội thoại 56–58 · Mất điện thoại","audio":"../audio/mk5/c56.mp3","script":[{"sp":"W","t":"(56) I can't believe **I can't find Mary's mobile phone**!","vi":"Không thể tin được là tôi không tìm thấy điện thoại di động của Mary!"},{"sp":"M","t":"Not again. (57) **You need to be more organized**. Did you look in your desk drawer?","vi":"Lại nữa à. Chị cần ngăn nắp hơn đấy. Chị tìm trong ngăn kéo bàn chưa?"},{"sp":"W","t":"I've looked everywhere. I can't locate it!","vi":"Tôi tìm khắp nơi rồi. Không thấy nó đâu cả!"},{"sp":"M","t":"(58) You should **carry a notebook** to write important information in.","vi":"Chị nên mang theo một cuốn sổ để ghi những thông tin quan trọng."}],"qs":[{"n":56,"q":"Why is the woman upset?","qvi":"Vì sao người phụ nữ bực bội?","opts":[{"t":"She doesn’t like her colleague.","vi":"Cô ấy không thích đồng nghiệp."},{"t":"Her desk drawer is disorganized.","vi":"Ngăn kéo bàn của cô ấy lộn xộn."},{"t":"She has misplaced a mobile phone.","vi":"Cô ấy để lạc mất một chiếc điện thoại."},{"t":"She is late for her meeting.","vi":"Cô ấy trễ cuộc họp."}],"ans":["C"],"key":"can't find Mary's mobile phone = misplaced a mobile phone","ex":"Cô ấy không tìm thấy điện thoại của Mary: can't find = misplaced (để lạc, không nhớ để đâu). (B) là bẫy: \"desk drawer\" có trong bài nhưng chỉ là chỗ anh ấy gợi ý tìm."},{"n":57,"q":"What does the man think about the woman?","qvi":"Người đàn ông nghĩ gì về người phụ nữ?","opts":[{"t":"She is well organized.","vi":"Cô ấy rất ngăn nắp."},{"t":"She needs to be better organized.","vi":"Cô ấy cần ngăn nắp hơn."},{"t":"She has some good ideas.","vi":"Cô ấy có vài ý tưởng hay."},{"t":"She is a good manager.","vi":"Cô ấy là người quản lý giỏi."}],"ans":["B"],"key":"You need to be more organized = needs to be better organized","ex":"Anh ấy nói \"You need to be more organized\": more organized = better organized. (A) nghe giống từ nhưng nghĩa ngược lại."},{"n":58,"q":"What does the man suggest?","qvi":"Người đàn ông gợi ý điều gì?","opts":[{"t":"Keeping a notebook","vi":"Mang theo một cuốn sổ"},{"t":"Calling Mary","vi":"Gọi cho Mary"},{"t":"Going for lunch","vi":"Đi ăn trưa"},{"t":"Looking under her desk","vi":"Tìm dưới gầm bàn"}],"ans":["A"],"key":"carry a notebook = keeping a notebook","ex":"\"You should…\" là câu khuyên. Anh ấy khuyên mang theo sổ: carry a notebook = keeping a notebook. (D) sai vì anh ấy hỏi tìm trong ngăn kéo, không phải dưới gầm bàn."}]},{"title":"Hội thoại 59–61 · Nhờ in tài liệu","audio":"../audio/mk5/c59.mp3","script":[{"sp":"M","t":"(59) **Amy, could you use my copy machine to print some documents for me** this afternoon?","vi":"Amy, chiều nay cô dùng máy photo của tôi in giúp tôi ít tài liệu được không?"},{"sp":"W","t":"Yes, sir. What time do you need it?","vi":"Vâng thưa anh. Anh cần lúc mấy giờ ạ?"},{"sp":"M","t":"(60) I think **tomorrow morning**, before I attend a meeting would be fine.","vi":"Tôi nghĩ sáng mai, trước khi tôi đi họp là được."},{"sp":"W","t":"(61) I'll **order some office supplies**, then I'll do it.","vi":"Tôi sẽ đặt mua ít đồ dùng văn phòng, rồi tôi sẽ làm."}],"qs":[{"n":59,"q":"Who most likely is the woman?","qvi":"Người phụ nữ có lẽ là ai?","opts":[{"t":"A teacher","vi":"Giáo viên"},{"t":"A musician","vi":"Nhạc sĩ"},{"t":"A secretary","vi":"Thư ký"},{"t":"A waiter","vi":"Người phục vụ bàn"}],"ans":["C"],"key":"in tài liệu cho sếp, \"Yes, sir\" → thư ký","ex":"Cô Amy được sếp nhờ in tài liệu và trả lời \"Yes, sir\": đây là công việc của thư ký (secretary)."},{"n":60,"q":"When does the man need the report?","qvi":"Khi nào người đàn ông cần tài liệu?","opts":[{"t":"Tomorrow morning","vi":"Sáng mai"},{"t":"This afternoon","vi":"Chiều nay"},{"t":"In an hour","vi":"Trong một giờ nữa"},{"t":"Next week","vi":"Tuần sau"}],"ans":["A"],"key":"tomorrow morning, before I attend a meeting","ex":"Bẫy: anh ấy nhờ in \"this afternoon\" (chiều nay), nhưng khi được hỏi cần lúc nào thì nói \"tomorrow morning\" (sáng mai). Câu hỏi hỏi lúc CẦN, nên chọn (A). Câu hỏi gọi tài liệu là \"the report\"."},{"n":61,"q":"What will the woman do next?","qvi":"Người phụ nữ sẽ làm gì tiếp theo?","opts":[{"t":"Order some food","vi":"Đặt đồ ăn"},{"t":"Send a fax","vi":"Gửi fax"},{"t":"Make an appointment","vi":"Đặt lịch hẹn"},{"t":"Order office supplies","vi":"Đặt mua đồ dùng văn phòng"}],"ans":["D"],"key":"I'll order some office supplies, then I'll do it","ex":"Câu cuối cô ấy nói sẽ đặt đồ dùng văn phòng trước, rồi mới in. Việc làm TIẾP THEO là đặt đồ: order some office supplies. (A) cũng có \"order\" nhưng là đặt đồ ăn."}]},{"title":"Hội thoại 62–64 · Ở lại sau hội nghị","audio":"../audio/mk5/c62.mp3","script":[{"sp":"M","t":"(63) Do you think we should **come back from the conference a day early**?","vi":"Chị có nghĩ chúng ta nên về sớm một ngày sau hội nghị không?"},{"sp":"W","t":"What for? As long as we're there, we might as well **stay for the weekend**.","vi":"Để làm gì? Đã đến đó rồi thì mình ở lại hết cuối tuần luôn."},{"sp":"M","t":"You're right. Let's try to make the most of it. I've never been to New York before.","vi":"Chị nói đúng. Hãy tận dụng hết chuyến đi. Tôi chưa đến New York bao giờ."},{"sp":"W","t":"(62) (64) **After the conference**, we can **take a guided tour** of the city, too.","vi":"Sau hội nghị, chúng ta còn có thể đi một tour có hướng dẫn viên tham quan thành phố."}],"qs":[{"n":62,"q":"What are the man and woman discussing?","qvi":"Người đàn ông và người phụ nữ đang bàn về điều gì?","opts":[{"t":"Plans for after a conference","vi":"Kế hoạch sau một hội nghị"},{"t":"Their summer vacation","vi":"Kỳ nghỉ hè của họ"},{"t":"Tours","vi":"Các chuyến tham quan"},{"t":"Their manager","vi":"Người quản lý của họ"}],"ans":["A"],"key":"come back from the conference / after the conference","ex":"Cả đoạn bàn chuyện sau hội nghị nên về sớm hay ở lại, rồi đi tham quan: plans for after a conference. (C) Tours chỉ là một phần nhỏ của kế hoạch."},{"n":63,"q":"What does the man suggest at first?","qvi":"Lúc đầu người đàn ông gợi ý điều gì?","opts":[{"t":"Staying for an extra day","vi":"Ở lại thêm một ngày"},{"t":"Missing the conference","vi":"Bỏ không dự hội nghị"},{"t":"Leaving early","vi":"Về sớm"},{"t":"Taking a week’s vacation","vi":"Nghỉ phép một tuần"}],"ans":["A"],"key":"Đáp án theo key: (A)","ex":"Đáp án theo key của thầy là (A). Lưu ý: câu đầu anh ấy hỏi \"come back… a day early\" (về sớm một ngày), sau đó cô ấy gợi ý ở lại hết cuối tuần và anh ấy đồng ý. Câu này nên hỏi lại thầy trên lớp."},{"n":64,"q":"What will they do afterward?","qvi":"Sau đó họ sẽ làm gì?","opts":[{"t":"Go to a museum","vi":"Đi bảo tàng"},{"t":"Leave New York","vi":"Rời New York"},{"t":"Go to an art gallery","vi":"Đi phòng tranh"},{"t":"Take a tour","vi":"Đi tour tham quan"}],"ans":["D"],"key":"take a guided tour of the city = take a tour","ex":"Câu cuối: \"take a guided tour of the city\" = take a tour. Bảo tàng và phòng tranh (A, C) không được nhắc đến. (B) sai vì họ quyết định ở lại."}]},{"title":"Hội thoại 65–67 · Ở quầy kiểm tra hộ chiếu","audio":"../audio/mk5/c65.mp3","script":[{"sp":"W","t":"(65) **Welcome to Vancouver. May I see your passport**, please?","vi":"Chào mừng đến Vancouver. Cho tôi xem hộ chiếu của anh được không?"},{"sp":"M","t":"Yes, here it is.","vi":"Vâng, đây ạ."},{"sp":"W","t":"Are you visiting our country for business or for pleasure?","vi":"Anh đến nước chúng tôi để làm việc hay đi chơi?"},{"sp":"M","t":"(66) (67) I'll be **doing business for three days**, then I'll be sightseeing for another three.","vi":"Tôi sẽ làm việc ba ngày, sau đó đi tham quan thêm ba ngày nữa."}],"qs":[{"n":65,"q":"Where is this conversation taking place?","qvi":"Cuộc hội thoại này diễn ra ở đâu?","opts":[{"t":"On the bus","vi":"Trên xe buýt"},{"t":"At the airport","vi":"Ở sân bay"},{"t":"In the office","vi":"Ở văn phòng"},{"t":"At the restaurant","vi":"Ở nhà hàng"}],"ans":["B"],"key":"Welcome to Vancouver + passport → sân bay","ex":"\"Welcome to Vancouver\" và \"May I see your passport?\" (cho xem hộ chiếu) là câu ở quầy nhập cảnh sân bay."},{"n":66,"q":"Why is the man visiting Vancouver?","qvi":"Vì sao người đàn ông đến Vancouver?","opts":[{"t":"For a wedding","vi":"Dự đám cưới"},{"t":"For business","vi":"Để làm việc"},{"t":"For pleasure","vi":"Để đi chơi"},{"t":"For relaxing","vi":"Để nghỉ ngơi"}],"ans":["B"],"key":"doing business for three days","ex":"Anh ấy nói trước tiên là làm việc ba ngày: doing business = for business. Sau đó mới đi tham quan, nên đáp án là (B)."},{"n":67,"q":"How long will the man stay in Vancouver?","qvi":"Người đàn ông sẽ ở Vancouver bao lâu?","opts":[{"t":"One week","vi":"Một tuần"},{"t":"Three days","vi":"Ba ngày"},{"t":"Six days","vi":"Sáu ngày"},{"t":"One month","vi":"Một tháng"}],"ans":["B"],"key":"Đáp án theo key: (B)","ex":"Đáp án theo key của thầy là (B). Lưu ý: anh ấy làm việc ba ngày, rồi tham quan thêm ba ngày (another three), cộng lại là sáu ngày (C). Câu này nên hỏi lại thầy trên lớp."}]},{"title":"Hội thoại 68–70 · Tài liệu thuyết trình","audio":"../audio/mk5/c68.mp3","script":[{"sp":"M","t":"(69) The manager wants to know about our **promotional campaigns for next year**. When do you think the presentation materials will be ready?","vi":"Quản lý muốn biết về các chiến dịch quảng bá năm sau của chúng ta. Các chị nghĩ khi nào tài liệu thuyết trình sẽ xong?"},{"sp":"W1","t":"I can't say for sure. (68) **Jennifer and I are working together**, and I am not sure how much of her part she has completed.","vi":"Tôi không dám chắc. Tôi và Jennifer cùng làm, và tôi không rõ cô ấy đã làm xong phần mình được bao nhiêu."},{"sp":"W2","t":"I am almost done, so I can send it to you within 2 hours.","vi":"Tôi gần xong rồi, nên trong 2 tiếng nữa tôi có thể gửi cho chị."},{"sp":"M","t":"That's good. (70) When you are done, could you **send me a copy of everything**?","vi":"Tốt lắm. Khi xong, các chị gửi cho tôi một bản của tất cả được không?"},{"sp":"W1","t":"Sure. I have no problem with that. I think I can probably send it to you this Friday.","vi":"Chắc chắn rồi. Không vấn đề gì. Tôi nghĩ có lẽ thứ Sáu này tôi gửi cho anh được."},{"sp":"W2","t":"Okay, then I will send my part to Lauren as soon as I am finished.","vi":"Được, vậy xong là tôi gửi phần của tôi cho Lauren ngay."}],"qs":[{"n":68,"q":"Why does the woman say, \"I can't say for sure\"?","qvi":"Vì sao người phụ nữ nói \"I can't say for sure\"?","opts":[{"t":"She is not the only one working on the project.","vi":"Cô ấy không phải người duy nhất làm dự án này."},{"t":"She is not familiar with the promotional campaign.","vi":"Cô ấy không quen với chiến dịch quảng bá."},{"t":"She hasn't talked to Jennifer for weeks.","vi":"Cô ấy đã nhiều tuần không nói chuyện với Jennifer."},{"t":"She has no idea what is going on at the company.","vi":"Cô ấy không biết chuyện gì đang xảy ra ở công ty."}],"ans":["A"],"key":"Jennifer and I are working together = not the only one working on it","ex":"Ngay sau câu đó cô ấy giải thích: cô và Jennifer cùng làm, cô không rõ phần của Jennifer xong chưa. Tức là không chỉ mình cô làm: not the only one. Dạng câu hỏi ý định: nghe câu ngay sau câu được trích."},{"n":69,"q":"What is the woman's presentation about?","qvi":"Bài thuyết trình của người phụ nữ nói về gì?","opts":[{"t":"Sales plans for next year","vi":"Kế hoạch bán hàng năm sau"},{"t":"Next year's promotion plans","vi":"Kế hoạch quảng bá năm sau"},{"t":"Presentation skills","vi":"Kỹ năng thuyết trình"},{"t":"Management solutions","vi":"Giải pháp quản lý"}],"ans":["B"],"key":"promotional campaigns for next year = next year's promotion plans","ex":"promotional campaigns (chiến dịch quảng bá) = promotion plans. (A) là bẫy: cũng có \"next year\" nhưng là \"sales\" (bán hàng), không phải quảng bá."},{"n":70,"q":"What does the man want the woman to do?","qvi":"Người đàn ông muốn người phụ nữ làm gì?","opts":[{"t":"Send the materials to the manager","vi":"Gửi tài liệu cho quản lý"},{"t":"Copy the materials for the participants","vi":"Sao tài liệu cho người tham dự"},{"t":"Send the materials to him","vi":"Gửi tài liệu cho anh ấy"},{"t":"Finish the preparation as soon as possible","vi":"Chuẩn bị xong càng sớm càng tốt"}],"ans":["C"],"key":"send me a copy of everything = send the materials to him","ex":"Anh ấy nói \"could you send me a copy of everything?\": gửi cho ANH ẤY (me = him). (A) là bẫy: \"manager\" có trong câu đầu, nhưng anh ấy không bảo gửi cho quản lý. (B) bẫy từ \"copy\"."}]}],"recap":"<h2>Ghi nhớ: đáp án nói lại ý<\/h2><table><tbody><tr><td><b>Trong bài nghe<\/b><\/td><td><b>Trong đáp án<\/b><\/td><td><b>Câu<\/b><\/td><\/tr><tr><td>notepads and pens<\/td><td>office supplies<\/td><td>32<\/td><\/tr><tr><td>look at the menu<\/td><td>see the menu<\/td><td>37<\/td><\/tr><tr><td>check the order<\/td><td>confirm an order<\/td><td>41<\/td><\/tr><tr><td>the printer is broken<\/td><td>a printer cannot be used<\/td><td>45<\/td><\/tr><tr><td>the printer in the marketing Department… pretty new<\/td><td>a new one in another department<\/td><td>46<\/td><\/tr><tr><td>contact our travel agency<\/td><td>call a travel agency<\/td><td>52<\/td><\/tr><tr><td>You cannot mix them up<\/td><td>The type of food cannot be changed<\/td><td>54<\/td><\/tr><tr><td>can't find<\/td><td>misplaced<\/td><td>56<\/td><\/tr><tr><td>be more organized<\/td><td>be better organized<\/td><td>57<\/td><\/tr><tr><td>carry a notebook<\/td><td>keeping a notebook<\/td><td>58<\/td><\/tr><tr><td>take a guided tour<\/td><td>take a tour<\/td><td>64<\/td><\/tr><tr><td>promotional campaigns for next year<\/td><td>next year's promotion plans<\/td><td>69<\/td><\/tr><tr><td>send me a copy<\/td><td>send the materials to him<\/td><td>70<\/td><\/tr><\/tbody><\/table><p><b>Đoán nghề / nơi chốn qua câu quen thuộc:<\/b> <i>May I take your order?<\/i> → người phục vụ (38) · <i>I am your server<\/i> → người kia là khách (53) · <i>Welcome to… May I see your passport?<\/i> → sân bay (65) · được sếp nhờ in, sắp xếp chuyến đi → thư ký (50, 59).<\/p><p><b>Bẫy đổi ý / nghe chưa hết:<\/b> giao đến văn phòng → đổi sang sảnh (43) · về Mexico thứ Hai nhưng đến văn phòng thứ Ba (49) · nhờ in chiều nay nhưng cần sáng mai (60) · muốn salad nhưng cuối cùng gọi mì Ý (55). Nghe đến hết đoạn rồi mới chốt đáp án.<\/p><p><b>Bẫy lặp từ:<\/b> roast chicken (36), call you later → điện thoại (37), carrot cake (40), office (43), travel agency (50), desk drawer (56), manager (70). Nghe thấy từ quen chưa chắc là đáp án đúng.<\/p><p><b>Bài tập về nhà gợi ý:<\/b> nghe lại audio từng đoạn, với mỗi câu tìm câu gốc trong lời thoại và câu trả lời tương ứng (paraphrase), ghi vào vở theo bảng trên.<\/p>","exam":"TOEIC-PRE-MOCK5","examSrc":"/pretoeicnew-mocktest/"};</script>
