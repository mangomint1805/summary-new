<script>window.MT={"n":3,"part":6,"partName":"Part 6","sub":"Text Completion · Điền vào đoạn văn · 16 câu (131–146)","intro":"Trang này chữa <b>Mock Test 3 (Part 6)<\/b>. Có 4 đoạn văn, mỗi đoạn 4 chỗ trống: 3 chỗ điền từ / cụm từ và 1 chỗ điền cả câu. <b>Cách học:<\/b> đọc đoạn văn → tự chọn đáp án từng câu → đọc giải thích → mở phần dịch để hiểu cả đoạn.","stepsTitle":"Cách làm Part 6: 3 bước","steps":["<b>Nhìn 4 đáp án trước.<\/b> Nếu 4 đáp án là cùng một từ đổi đuôi (low / lowly / lowest, use / usage…) thì đó là câu <b>ngữ pháp<\/b>: chỉ cần đọc câu chứa chỗ trống. Nếu 4 đáp án khác nghĩa thì là câu <b>từ vựng<\/b>: phải đọc cả câu trước và câu sau.","<b>Câu đại từ (us, you, it…):<\/b> hỏi \"ai đang nói với ai, nói về cái gì?\". Trước động từ dùng đại từ chủ ngữ (<i>you<\/i>), sau động từ / giới từ dùng tân ngữ (<i>us<\/i>, <i>it<\/i>).","<b>Câu điền câu:<\/b> đọc kỹ câu <b>ngay trước và ngay sau<\/b> chỗ trống. Câu đúng thường lặp lại hoặc nói lại ý câu bên cạnh (<i>figure<\/i> = <i>that number<\/i>, <i>this new limit<\/i>). Đáp án lặp từ trong bài (<i>community center<\/i>, <i>vehicle<\/i>) nhưng sai ý thường là <b>bẫy<\/b>."],"hideOpts":false,"groups":[{"title":"Đoạn 131–134 · Thẻ hội viên Sky Air First Pass","tag":"Thông báo (notice)","passage":["Sky Air First Pass","Thank you for flying Sky Air First with ⟦131⟧. We hope you enjoy your flight.","You can take advantage of our best prices on future flights ⟦132⟧ purchasing a Sky Air First Pass. For a ⟦133⟧ annual fee, you will get special discounts, seat upgrades, and the use of our exclusive travelers' lounge. ⟦134⟧ Ask your flight attendant for more information and an application."],"scriptLabel":"📜 Dịch đoạn văn","script":[{"sp":"","t":"Sky Air First Pass","vi":"Thẻ Sky Air First Pass (thẻ hội viên của hãng hàng không Sky Air First)"},{"sp":"","t":"(131) Thank you for flying Sky Air First with **us**. We hope you enjoy your flight.","vi":"Cảm ơn quý khách đã bay cùng chúng tôi, hãng Sky Air First. Chúc quý khách có chuyến bay vui vẻ."},{"sp":"","t":"(132) You can take advantage of our best prices on future flights **by** purchasing a Sky Air First Pass.","vi":"Quý khách có thể tận dụng giá tốt nhất của chúng tôi cho các chuyến bay sau này bằng cách mua thẻ Sky Air First Pass."},{"sp":"","t":"(133) For a **low** annual fee, you will get special discounts, seat upgrades, and the use of our exclusive travelers' lounge.","vi":"Chỉ với một khoản phí hằng năm thấp, quý khách sẽ được giảm giá đặc biệt, nâng hạng ghế và được dùng phòng chờ riêng dành cho hành khách."},{"sp":"","t":"(134) **You will also get priority boarding.**","vi":"Quý khách cũng sẽ được ưu tiên lên máy bay trước."},{"sp":"","t":"Ask your flight attendant for more information and an application.","vi":"Hãy hỏi tiếp viên để biết thêm thông tin và nhận mẫu đơn đăng ký."}],"qs":[{"n":131,"q":"","qvi":"","opts":[{"t":"them","vi":"họ (tân ngữ)"},{"t":"theirs","vi":"của họ"},{"t":"us","vi":"chúng tôi (tân ngữ)"},{"t":"ours","vi":"của chúng tôi"}],"ans":["C"],"key":"Sau giới từ with cần đại từ tân ngữ: with us","ex":"Hãng bay đang nói với khách: \"cảm ơn quý khách đã bay cùng <b>chúng tôi<\/b>\". Sau giới từ <i>with<\/i> dùng đại từ tân ngữ <i>us<\/i>. (A) them (họ) sai người: hãng đang tự nói về mình. (B) theirs, (D) ours là đại từ sở hữu (của họ, của chúng tôi), phải thay cho một danh từ đã nói trước, ở đây không có."},{"n":132,"q":"","qvi":"","opts":[{"t":"at","vi":"tại, vào lúc"},{"t":"on","vi":"trên, vào (ngày)"},{"t":"by","vi":"bằng cách"},{"t":"to","vi":"đến, để"}],"ans":["C"],"key":"by + V-ing = bằng cách làm gì","ex":"Câu nói cách để có giá tốt: <b>bằng cách<\/b> mua thẻ. Cấu trúc <i>by + V-ing<\/i> (by purchasing) nghĩa là \"bằng cách làm gì\". (A) at, (B) on không có nghĩa này. (D) to thường đi với động từ nguyên mẫu (to purchase), không đi với purchasing."},{"n":133,"q":"","qvi":"","opts":[{"t":"lowers","vi":"hạ thấp (động từ)"},{"t":"low","vi":"thấp (tính từ)"},{"t":"lowly","vi":"khiêm tốn, thấp kém"},{"t":"lowest","vi":"thấp nhất"}],"ans":["B"],"key":"a + tính từ + danh từ: a low annual fee","ex":"Chỗ trống nằm giữa <i>a<\/i> và cụm danh từ <i>annual fee<\/i> (phí hằng năm), nên cần <b>tính từ<\/b>: a <b>low<\/b> annual fee = một khoản phí năm thấp. (A) lowers là động từ. (C) lowly nghĩa là \"khiêm tốn, hèn mọn\", không dùng cho giá tiền. (D) lowest (thấp nhất) là so sánh nhất, phải đi với <i>the<\/i>, không đi với <i>a<\/i>."},{"n":134,"q":"","qvi":"","opts":[{"t":"We hope you will fly Sky Air First again.","vi":"Chúng tôi mong quý khách sẽ lại bay cùng Sky Air First."},{"t":"You will also get priority boarding.","vi":"Quý khách cũng sẽ được ưu tiên lên máy bay trước."},{"t":"Please find your seat immediately.","vi":"Vui lòng tìm chỗ ngồi ngay."},{"t":"The flight delay will be minimal.","vi":"Chuyến bay sẽ chỉ bị trễ rất ít."}],"ans":["B"],"key":"Câu trước liệt kê quyền lợi → câu sau thêm quyền lợi (also)","ex":"Câu điền câu: câu ngay trước liệt kê quyền lợi của thẻ (giảm giá, nâng hạng ghế, phòng chờ). Câu (B) có chữ <i>also<\/i> (cũng) thêm một quyền lợi nữa: được lên máy bay trước. Câu sau mời hỏi tiếp viên để đăng ký, vẫn nối đúng ý. (A) nghe hợp với hãng bay nhưng là câu chào cuối chuyến, chen vào giữa phần giới thiệu thẻ thì lạc ý. (C), (D) không liên quan đến thẻ."}]},{"title":"Đoạn 135–138 · Hội chợ bán cây của câu lạc bộ làm vườn","tag":"Thông báo (announcement)","passage":["The Oakville Horticulture Club ⟦135⟧ a plant sale on Saturday, 9 September. The sale will be held from 9:00 A.M. to 4:00 P.M. at the Oakville Community Center at 478 Hill Avenue. There will be great deals on hanging baskets, grasses, and herbs. ⟦136⟧ We ⟦137⟧ have a delicious selection of fruits and vegetables available for purchase. Enjoy live talks and demonstrations ⟦138⟧ the day. For more information, visit the Oakville Horticulture Web site: www.oakvillehorticultureclub.co.uk/events."],"scriptLabel":"📜 Dịch đoạn văn","script":[{"sp":"","t":"(135) The Oakville Horticulture Club **is hosting** a plant sale on Saturday, 9 September.","vi":"Câu lạc bộ Làm vườn Oakville sẽ tổ chức một buổi bán cây vào thứ Bảy, ngày 9 tháng 9."},{"sp":"","t":"The sale will be held from 9:00 A.M. to 4:00 P.M. at the Oakville Community Center at 478 Hill Avenue.","vi":"Buổi bán diễn ra từ 9 giờ sáng đến 4 giờ chiều tại Nhà văn hóa cộng đồng Oakville, số 478 đường Hill."},{"sp":"","t":"There will be great deals on hanging baskets, grasses, and herbs.","vi":"Sẽ có nhiều món hời cho giỏ cây treo, các loại cỏ và rau thơm."},{"sp":"","t":"(136) **Come early to get the best selection.**","vi":"Hãy đến sớm để chọn được những cây đẹp nhất."},{"sp":"","t":"(137) We **also** have a delicious selection of fruits and vegetables available for purchase.","vi":"Chúng tôi cũng có nhiều loại trái cây và rau củ ngon để quý vị mua."},{"sp":"","t":"(138) Enjoy live talks and demonstrations **throughout** the day.","vi":"Hãy thưởng thức các buổi nói chuyện và trình diễn trực tiếp suốt cả ngày."},{"sp":"","t":"For more information, visit the Oakville Horticulture Web site: www.oakvillehorticultureclub.co.uk/events.","vi":"Để biết thêm thông tin, hãy vào trang web của câu lạc bộ: www.oakvillehorticultureclub.co.uk/events."}],"qs":[{"n":135,"q":"","qvi":"","opts":[{"t":"host","vi":"tổ chức (nguyên mẫu)"},{"t":"hosted","vi":"đã tổ chức"},{"t":"is hosting","vi":"đang / sắp tổ chức"},{"t":"has hosted","vi":"đã từng tổ chức"}],"ans":["C"],"key":"Kế hoạch tương lai đã định sẵn: is + V-ing","ex":"Buổi bán cây diễn ra vào thứ Bảy sắp tới (câu sau dùng <i>will be held<\/i>), nên là việc <b>sắp xảy ra<\/b> đã lên lịch. Hiện tại tiếp diễn <i>is hosting<\/i> dùng được cho kế hoạch tương lai. (A) host thiếu -s cho chủ ngữ số ít (The Club). (B) hosted và (D) has hosted nói chuyện đã xảy ra rồi, sai thời gian."},{"n":136,"q":"","qvi":"","opts":[{"t":"Come early to get the best selection.","vi":"Hãy đến sớm để chọn được hàng đẹp nhất."},{"t":"Plants help make your home beautiful.","vi":"Cây xanh giúp nhà bạn đẹp hơn."},{"t":"Join the club for a discount on local garden tours.","vi":"Hãy vào câu lạc bộ để được giảm giá các chuyến tham quan vườn ở địa phương."},{"t":"The community center was just renovated","vi":"Nhà văn hóa cộng đồng vừa được sửa sang lại."}],"ans":["A"],"key":"Câu trước: nhiều món hời → khuyên đến sớm để chọn","ex":"Câu điền câu: câu ngay trước nói có nhiều món hời (great deals) về cây. Câu (A) khuyên đến sớm để chọn được cây đẹp nhất: nối đúng ý mua bán. Câu sau dùng <i>also<\/i> để thêm một loại hàng nữa (trái cây, rau), vẫn hợp. (B) nói chung chung về cây, không gắn với buổi bán. (C) nói về chuyến tham quan vườn, bài không nhắc. (D) lặp từ <i>community center<\/i> trong bài nhưng lạc ý: bẫy lặp từ."},{"n":137,"q":"","qvi":"","opts":[{"t":"later","vi":"sau đó, lát nữa"},{"t":"also","vi":"cũng"},{"t":"nearly","vi":"gần như"},{"t":"merely","vi":"chỉ, đơn thuần"}],"ans":["B"],"key":"Thêm một loại hàng nữa: also (cũng)","ex":"Trước đó bài đã nói về cây (giỏ treo, cỏ, rau thơm). Câu này thêm một nhóm hàng khác: trái cây và rau củ. Thêm ý thì dùng <i>also<\/i>: We <b>also<\/b> have… (A) later (lát nữa) không hợp vì hàng bán cùng ngày. (C) nearly (gần như) và (D) merely (chỉ) làm câu vô nghĩa."},{"n":138,"q":"","qvi":"","opts":[{"t":"within","vi":"trong vòng (giới hạn)"},{"t":"forward","vi":"về phía trước"},{"t":"following","vi":"sau (khi)"},{"t":"throughout","vi":"suốt, khắp"}],"ans":["D"],"key":"throughout the day = suốt cả ngày","ex":"Các buổi nói chuyện, trình diễn diễn ra <b>suốt cả ngày<\/b> bán hàng: <i>throughout the day<\/i>. (A) within thường đi với khoảng thời gian giới hạn (within 2 hours = trong vòng 2 giờ), không nói within the day ở đây. (B) forward không phải giới từ chỉ thời gian. (C) following the day = sau ngày đó, sai vì trình diễn diễn ra ngay trong ngày bán."}]},{"title":"Đoạn 139–142 · E-mail về hợp đồng với khách hàng","tag":"E-mail","passage":["To: mfreeman@dominion.com","From: jwickizer@ewingtel.com","Subject: Contract","Date: August 21","Dear Mary,","I tried to call you earlier, but you were in a meeting. I wanted to tell you about the results of the client meeting. They agreed to all the ⟦139⟧ of the contract, but wanted to change the part about the amount of mileage they would be allowed per vehicle. ⟦140⟧, I will go back to the office and adjust that number. Could you look over the contract once more before I send it to them to sign? I’ll have it in your inbox by later this afternoon. Once ⟦141⟧ agree to it, I will send it to them immediately.","They promised to send ⟦142⟧ back within a few hours.","I’ll talk to you soon.","Janet Wickizer"],"scriptLabel":"📜 Dịch đoạn văn","script":[{"sp":"","t":"To: mfreeman@dominion.com. From: jwickizer@ewingtel.com. Subject: Contract. Date: August 21.","vi":"Gửi: mfreeman@dominion.com. Từ: jwickizer@ewingtel.com. Chủ đề: Hợp đồng. Ngày: 21 tháng 8."},{"sp":"","t":"Dear Mary, I tried to call you earlier, but you were in a meeting.","vi":"Chị Mary thân mến, lúc nãy em đã gọi cho chị nhưng chị đang họp."},{"sp":"","t":"I wanted to tell you about the results of the client meeting.","vi":"Em muốn báo chị kết quả buổi gặp khách hàng."},{"sp":"","t":"(139) They agreed to all the **terms** of the contract, but wanted to change the part about the amount of mileage they would be allowed per vehicle.","vi":"Họ đồng ý với tất cả các điều khoản của hợp đồng, nhưng muốn sửa phần số dặm (quãng đường) được phép chạy cho mỗi xe."},{"sp":"","t":"(140) **They said that the figure we gave them was a bit too low.**","vi":"Họ nói con số mình đưa ra hơi thấp quá."},{"sp":"","t":"I will go back to the office and adjust that number.","vi":"Em sẽ về văn phòng và sửa lại con số đó."},{"sp":"","t":"Could you look over the contract once more before I send it to them to sign? I'll have it in your inbox by later this afternoon.","vi":"Chị xem lại hợp đồng thêm một lần trước khi em gửi họ ký được không? Chiều nay em sẽ gửi vào hộp thư của chị."},{"sp":"","t":"(141) Once **you** agree to it, I will send it to them immediately.","vi":"Khi chị đồng ý, em sẽ gửi cho họ ngay."},{"sp":"","t":"(142) They promised to send **it** back within a few hours.","vi":"Họ hứa sẽ gửi lại hợp đồng trong vòng vài giờ."},{"sp":"","t":"I'll talk to you soon. Janet Wickizer","vi":"Em sẽ nói chuyện với chị sau. Janet Wickizer"}],"qs":[{"n":139,"q":"","qvi":"","opts":[{"t":"clauses","vi":"điều khoản (từng mục)"},{"t":"terms","vi":"điều khoản, điều kiện"},{"t":"notes","vi":"ghi chú"},{"t":"contributions","vi":"sự đóng góp"}],"ans":["B"],"key":"the terms of the contract = các điều khoản hợp đồng","ex":"<i>agree to the terms (of the contract)<\/i> = đồng ý với các điều khoản hợp đồng: cụm rất hay gặp trong TOEIC. (A) clauses cũng là \"điều khoản\" và nghe khá hợp, nhưng đáp án chính thức chọn <i>terms<\/i> vì đây là cụm cố định <i>agree to the terms<\/i>. (C) notes (ghi chú), (D) contributions (đóng góp) sai nghĩa."},{"n":140,"q":"","qvi":"","opts":[{"t":"I’m not sure they allow that.","vi":"Tôi không chắc họ cho phép việc đó."},{"t":"The vehicle will be ready by next week.","vi":"Chiếc xe sẽ sẵn sàng trước tuần sau."},{"t":"No one was there to meet me.","vi":"Không có ai ở đó gặp tôi."},{"t":"They said that the figure we gave them was a bit too low.","vi":"Họ nói con số mình đưa ra hơi thấp quá."}],"ans":["D"],"key":"figure (con số) ↔ that number (con số đó) ở câu sau","ex":"Câu điền câu: câu trước nói khách muốn sửa phần <i>số dặm<\/i> cho mỗi xe. Câu sau nói \"em sẽ sửa lại <b>con số đó<\/b> (that number)\". Câu (D) nói rõ khách chê con số (figure) hơi thấp, nối đúng hai bên: <i>figure<\/i> = <i>number<\/i>. (A) mâu thuẫn vì khách đã đồng ý hết. (B) lặp từ <i>vehicle<\/i> nhưng lạc ý: bẫy lặp từ. (C) sai vì buổi gặp đã diễn ra."},{"n":141,"q":"","qvi":"","opts":[{"t":"you","vi":"chị / bạn (chủ ngữ)"},{"t":"your","vi":"của chị / bạn"},{"t":"yourself","vi":"chính chị / bạn"},{"t":"she","vi":"cô ấy"}],"ans":["A"],"key":"Chủ ngữ trước động từ agree: you","ex":"Chỗ trống đứng trước động từ <i>agree<\/i>, nên cần <b>đại từ chủ ngữ<\/b>. Janet đang nhờ Mary xem lại hợp đồng, nên \"khi <b>chị<\/b> đồng ý\" là <i>you<\/i>. (B) your là tính từ sở hữu, phải đi với danh từ. (C) yourself không làm chủ ngữ. (D) she (cô ấy) là ngôi thứ ba, sai vì Janet đang viết trực tiếp cho Mary; she cũng phải đi với agrees."},{"n":142,"q":"","qvi":"","opts":[{"t":"itself","vi":"chính nó"},{"t":"it’s","vi":"nó là (= it is)"},{"t":"its","vi":"của nó"},{"t":"it","vi":"nó (tân ngữ)"}],"ans":["D"],"key":"send + tân ngữ + back: send it back","ex":"Sau động từ <i>send<\/i> cần <b>tân ngữ<\/b>: <i>send <b>it<\/b> back<\/i> = gửi nó (hợp đồng) lại. (A) itself dùng khi chủ ngữ và tân ngữ là một (họ ≠ hợp đồng). (B) it's = it is, không đứng sau động từ được. (C) its (của nó) phải đi kèm danh từ."}]},{"title":"Đoạn 143–146 · Thư báo tăng hạn mức thẻ tín dụng","tag":"Thư (letter)","passage":["Evergreen Credit Card Services","3434 Market Square","Upton, UT 84017","Dear Mr. McCartney,","Thank you for choosing to use Evergreen Credit Card Services. We ⟦143⟧ to let you know that after reviewing your account, we have approved you for an ⟦144⟧ in your credit limit. Your new limit is now $5,000. ⟦145⟧ We look at your payment history and overall credit card ⟦146⟧ to make this decision.","This will allow you to make purchases that you once thought might be impossible, such as a new refrigerator or a postponed house project. If you have any questions about what this means for you and your credit, give us a call at 555-2948. Once again, thank you for choosing us.","Esteban Domingo","Credit Services"],"scriptLabel":"📜 Dịch đoạn văn","script":[{"sp":"","t":"Evergreen Credit Card Services. 3434 Market Square, Upton, UT 84017.","vi":"Dịch vụ Thẻ tín dụng Evergreen. Số 3434 Market Square, Upton, UT 84017."},{"sp":"","t":"Dear Mr. McCartney, Thank you for choosing to use Evergreen Credit Card Services.","vi":"Kính gửi ông McCartney, cảm ơn ông đã chọn dùng Dịch vụ Thẻ tín dụng Evergreen."},{"sp":"","t":"(143)(144) We **are writing** to let you know that after reviewing your account, we have approved you for an **increase** in your credit limit.","vi":"Chúng tôi viết thư này để báo ông biết: sau khi xem xét tài khoản của ông, chúng tôi đã duyệt tăng hạn mức tín dụng cho ông."},{"sp":"","t":"Your new limit is now $5,000.","vi":"Hạn mức mới của ông bây giờ là 5.000 đô la."},{"sp":"","t":"(145) **This new limit will go into effect immediately.**","vi":"Hạn mức mới này có hiệu lực ngay lập tức."},{"sp":"","t":"(146) We look at your payment history and overall credit card **usage** to make this decision.","vi":"Chúng tôi xem lịch sử thanh toán và việc sử dụng thẻ tín dụng nói chung của ông để đưa ra quyết định này."},{"sp":"","t":"This will allow you to make purchases that you once thought might be impossible, such as a new refrigerator or a postponed house project.","vi":"Điều này giúp ông mua được những thứ trước đây tưởng là không thể, như một chiếc tủ lạnh mới hoặc một dự án sửa nhà bị hoãn lại."},{"sp":"","t":"If you have any questions about what this means for you and your credit, give us a call at 555-2948. Once again, thank you for choosing us.","vi":"Nếu ông có câu hỏi về ý nghĩa của việc này với ông và tín dụng của ông, hãy gọi cho chúng tôi theo số 555-2948. Một lần nữa, cảm ơn ông đã chọn chúng tôi."},{"sp":"","t":"Esteban Domingo, Credit Services","vi":"Esteban Domingo, Bộ phận Dịch vụ tín dụng"}],"qs":[{"n":143,"q":"","qvi":"","opts":[{"t":"written","vi":"được viết (V3)"},{"t":"are writing","vi":"đang viết"},{"t":"are written","vi":"được viết (bị động)"},{"t":"writing","vi":"viết (V-ing)"}],"ans":["B"],"key":"We are writing to let you know… (câu mở đầu thư)","ex":"<i>We <b>are writing<\/b> to let you know…<\/i> = Chúng tôi viết thư này để báo bạn biết: câu mở đầu thư rất quen thuộc. Chủ ngữ <i>We<\/i> tự viết thư, nên dùng chủ động. (A) written và (D) writing thiếu <i>are<\/i>, câu không có động từ chính. (C) are written là bị động (\"chúng tôi được viết\"), sai nghĩa."},{"n":144,"q":"","qvi":"","opts":[{"t":"increase","vi":"sự tăng lên"},{"t":"authorization","vi":"sự cho phép"},{"t":"enlargement","vi":"sự phóng to, mở rộng (kích thước)"},{"t":"interest","vi":"tiền lãi, sự quan tâm"}],"ans":["A"],"key":"an increase in + cái gì = sự tăng lên của…","ex":"Câu sau nói hạn mức mới là 5.000 đô la, tức là hạn mức đã <b>tăng<\/b>. <i>an increase in your credit limit<\/i> = tăng hạn mức tín dụng. (B) authorization (sự cho phép) không đi với <i>in your credit limit<\/i>. (C) enlargement dùng cho kích thước (phóng to ảnh, mở rộng nhà), không dùng cho con số. (D) interest (tiền lãi) liên quan đến thẻ nhưng sai ý: bẫy cùng chủ đề."},{"n":145,"q":"","qvi":"","opts":[{"t":"This new limit will go into effect immediately.","vi":"Hạn mức mới này có hiệu lực ngay lập tức."},{"t":"Payments will be credited the next business day.","vi":"Các khoản thanh toán sẽ được ghi nhận vào ngày làm việc tiếp theo."},{"t":"The card will be sent to the address listed in the account.","vi":"Thẻ sẽ được gửi đến địa chỉ ghi trong tài khoản."},{"t":"The design of the card can be changed online.","vi":"Có thể đổi mẫu thẻ trên mạng."}],"ans":["A"],"key":"Câu trước: hạn mức mới → nói tiếp về hạn mức mới (This new limit)","ex":"Câu điền câu: câu ngay trước nói \"hạn mức mới của ông là 5.000 đô la\". Câu (A) nói tiếp về <i>this new limit<\/i> (hạn mức mới này) có hiệu lực ngay: nối ý trực tiếp. (B) nói về khoản thanh toán, (C) nói về gửi thẻ, (D) nói về mẫu thẻ: đều là chuyện khác, thư không nhắc đến việc gửi thẻ mới hay đổi mẫu thẻ."},{"n":146,"q":"","qvi":"","opts":[{"t":"using","vi":"đang dùng (V-ing)"},{"t":"used","vi":"đã dùng (V2/V3)"},{"t":"uses","vi":"dùng (động từ, số ít)"},{"t":"usage","vi":"việc sử dụng (danh từ)"}],"ans":["D"],"key":"and nối hai danh từ: payment history and credit card usage","ex":"<i>and<\/i> nối hai thứ cùng loại: <i>payment history<\/i> (danh từ) and <i>overall credit card ___<\/i>. Sau tính từ <i>overall<\/i> và cụm <i>credit card<\/i> cần một <b>danh từ<\/b>: <i>usage<\/i> (việc sử dụng). (A) using, (B) used, (C) uses đều là dạng của động từ, không làm danh từ chính ở đây."}]}],"recap":"<h2>Ghi nhớ: các cấu trúc trong bài<\/h2><table><tbody><tr><td><b>Cấu trúc<\/b><\/td><td><b>Ví dụ trong bài<\/b><\/td><td><b>Câu<\/b><\/td><\/tr><tr><td>Giới từ + đại từ tân ngữ<\/td><td>flying … with <b>us<\/b><\/td><td>131<\/td><\/tr><tr><td>by + V-ing = bằng cách<\/td><td><b>by<\/b> purchasing a pass<\/td><td>132<\/td><\/tr><tr><td>a + tính từ + danh từ<\/td><td>a <b>low<\/b> annual fee<\/td><td>133<\/td><\/tr><tr><td>is + V-ing cho kế hoạch sắp tới<\/td><td>The club <b>is hosting<\/b> a plant sale on Saturday<\/td><td>135<\/td><\/tr><tr><td>also = cũng (thêm ý)<\/td><td>We <b>also<\/b> have…<\/td><td>137<\/td><\/tr><tr><td>throughout the day = suốt cả ngày<\/td><td>talks <b>throughout<\/b> the day<\/td><td>138<\/td><\/tr><tr><td>agree to the terms<\/td><td>agreed to all the <b>terms<\/b> of the contract<\/td><td>139<\/td><\/tr><tr><td>Đại từ chủ ngữ / tân ngữ<\/td><td>Once <b>you<\/b> agree… / send <b>it<\/b> back<\/td><td>141, 142<\/td><\/tr><tr><td>We are writing to let you know…<\/td><td>We <b>are writing<\/b> to let you know<\/td><td>143<\/td><\/tr><tr><td>an increase in + danh từ<\/td><td>an <b>increase<\/b> in your credit limit<\/td><td>144<\/td><\/tr><tr><td>and nối hai danh từ<\/td><td>payment history and credit card <b>usage<\/b><\/td><td>146<\/td><\/tr><\/tbody><\/table><p><b>Câu điền câu (134, 136, 140, 145):<\/b> luôn đọc câu ngay trước và ngay sau. Ví dụ câu 140: câu sau có <i>that number<\/i>, nên câu trống phải nhắc tới một con số (<i>the figure<\/i>).<\/p><p><b>Bẫy lặp từ / cùng chủ đề:<\/b> <i>community center<\/i> (136), <i>vehicle<\/i> (140), <i>interest<\/i> (144). Có từ giống trong bài chưa chắc là đúng ý.<\/p><p><b>Bài tập về nhà gợi ý:<\/b> chép các cấu trúc trong bảng trên vào vở, mỗi cấu trúc tự đặt thêm 1 câu ví dụ.<\/p>"};</script>
