<script>window.MT={"n":4,"part":2,"partName":"Part 2","sub":"Question-Response · Hỏi – đáp · 25 câu (7–31)","intro":"Trang này chữa <b>Mock Test 4 (Part 2)<\/b>. Mỗi câu có nút nghe lại, 3 câu trả lời và giải thích. Chữ của đáp án được ẩn cho giống đề thật (đề không in). <b>Cách học:<\/b> bấm nghe → chọn A, B hoặc C → đọc giải thích → mở <i>Câu hỏi + dịch<\/i> để xem lại câu hỏi.","stepsTitle":"Cách làm Part 2: 3 bước","steps":["<b>Nghe thật kỹ từ đầu tiên.<\/b> Who / Where / When / Why / How far / What time… quyết định kiểu trả lời: Where → nơi chốn, When → thời gian, Who → người, Why → lý do.","<b>Loại đáp án bẫy.<\/b> Đáp án lặp từ, lặp âm hoặc chỉ \"liên quan\" tới câu hỏi thường sai: <i>report → reporter, manager → management, left → left, plane → ticket<\/i>. Câu hỏi Wh- không trả lời bằng <i>Yes/No<\/i>.","<b>Chấp nhận trả lời gián tiếp.<\/b> Đáp án đúng có khi không trả lời thẳng: <i>\"I need a replacement\"<\/i> (máy hỏng hẳn rồi), <i>\"I am outside of the office\"<\/i> (nên không giúp được). Câu nhờ vả (<i>Can you help me…?<\/i>) thì đáp lại bằng đồng ý hoặc từ chối kèm lý do."],"hideOpts":true,"hideHint":"Nghe rồi chọn","groups":[{"title":"Câu 7","tag":"When","audio":"../audio/mk4/c7.mp3","script":[{"sp":"Q","t":"When are you taking a vacation this year?","vi":"Năm nay khi nào bạn đi nghỉ?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":7,"q":"","qvi":"","opts":[{"t":"In August, I think.","vi":"Tôi nghĩ là vào tháng Tám."},{"t":"To London.","vi":"Đến London."},{"t":"No, it was last year.","vi":"Không, đó là năm ngoái."}],"ans":["A"],"key":"When → thời gian (tháng, ngày, giờ)","ex":"When hỏi thời gian, nên chọn câu nói thời điểm: \"In August\" (vào tháng Tám). (B) nói nơi đến, hợp với câu hỏi Where. (C) bắt đầu bằng No: câu hỏi Wh- không trả lời bằng Yes/No."}]},{"title":"Câu 8","tag":"Đề nghị giúp đỡ","audio":"../audio/mk4/c8.mp3","script":[{"sp":"Q","t":"Can you help me with this project?","vi":"Bạn giúp tôi làm dự án này được không?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":8,"q":"","qvi":"","opts":[{"t":"I don't need any help, thanks.","vi":"Tôi không cần giúp đâu, cảm ơn."},{"t":"Not right now. I'm very busy.","vi":"Bây giờ thì không được. Tôi đang rất bận."},{"t":"This desk is big.","vi":"Cái bàn này to."}],"ans":["B"],"key":"Nhờ giúp → đồng ý / từ chối kèm lý do","ex":"Người hỏi nhờ mình giúp. (B) từ chối lịch sự và nêu lý do: đang rất bận. (A) là bẫy lặp từ help: câu này hợp khi người khác hỏi \"Bạn có cần giúp không?\", ở đây người hỏi mới là người cần giúp. (C) không liên quan."}]},{"title":"Câu 9","tag":"Yes/No","audio":"../audio/mk4/c9.mp3","script":[{"sp":"Q","t":"Have you booked your flight to New York?","vi":"Bạn đã đặt chuyến bay đi New York chưa?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":9,"q":"","qvi":"","opts":[{"t":"I do yoga every day.","vi":"Tôi tập yoga mỗi ngày."},{"t":"No, I haven't.","vi":"Chưa, tôi chưa đặt."},{"t":"It takes about 2 hours.","vi":"Mất khoảng 2 tiếng."}],"ans":["B"],"key":"Have you…? → No, I haven't","ex":"Câu hỏi Yes/No với Have you…? (đã… chưa?), trả lời ngắn \"No, I haven't\" (chưa) là đúng ngữ pháp. (C) nói thời gian bay, liên quan tới flight nhưng không trả lời việc đã đặt vé chưa. (A) không liên quan."}]},{"title":"Câu 10","tag":"Where","audio":"../audio/mk4/c10.mp3","script":[{"sp":"Q","t":"Where do you want to store these boxes of paper?","vi":"Bạn muốn cất mấy thùng giấy này ở đâu?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":10,"q":"","qvi":"","opts":[{"t":"Yes, it is.","vi":"Vâng, đúng vậy."},{"t":"By taxi.","vi":"Bằng taxi."},{"t":"In the reception area for now.","vi":"Tạm thời để ở khu lễ tân."}],"ans":["C"],"key":"Where → nơi chốn (in / on / at…)","ex":"Where hỏi nơi chốn, nên chọn \"In the reception area\" (ở khu lễ tân). (A) trả lời Yes: câu hỏi Wh- không trả lời bằng Yes/No. (B) nói phương tiện, hợp với câu hỏi How."}]},{"title":"Câu 11","tag":"When","audio":"../audio/mk4/c11.mp3","script":[{"sp":"Q","t":"When should I print some documents?","vi":"Khi nào tôi nên in mấy tài liệu?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":11,"q":"","qvi":"","opts":[{"t":"He will leave the office.","vi":"Anh ấy sẽ rời văn phòng."},{"t":"This afternoon.","vi":"Chiều nay."},{"t":"No problem, just pick it up.","vi":"Không sao, cứ lấy đi."}],"ans":["B"],"key":"When → thời gian: This afternoon","ex":"When hỏi thời gian, \"This afternoon\" (chiều nay) trả lời đúng. (A) nói về \"he\" trong khi câu hỏi về \"I\": sai người. (C) là câu đáp lời cảm ơn / nhờ vả, không nói thời gian."}]},{"title":"Câu 12","tag":"Why","audio":"../audio/mk4/c12.mp3","script":[{"sp":"Q","t":"Why can't our manager attend the meeting?","vi":"Tại sao quản lý của chúng ta không dự cuộc họp được?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":12,"q":"","qvi":"","opts":[{"t":"Because he's on vacation this week.","vi":"Vì tuần này anh ấy đi nghỉ."},{"t":"Conference room tour.","vi":"Chuyến tham quan phòng hội nghị."},{"t":"Thank you for the present.","vi":"Cảm ơn bạn vì món quà."}],"ans":["A"],"key":"Why → Because… (lý do)","ex":"Why hỏi lý do, đáp án bắt đầu bằng Because và nêu lý do: anh ấy đang đi nghỉ. (B) là bẫy liên tưởng: meeting → conference room, nhưng không nói lý do. (C) không liên quan."}]},{"title":"Câu 13","tag":"Yes/No","audio":"../audio/mk4/c13.mp3","script":[{"sp":"Q","t":"Are you training the new employees?","vi":"Bạn đang đào tạo nhân viên mới à?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":13,"q":"","qvi":"","opts":[{"t":"A one-way ticket.","vi":"Một vé một chiều."},{"t":"Not this time.","vi":"Lần này thì không."},{"t":"All right, thanks.","vi":"Được rồi, cảm ơn."}],"ans":["B"],"key":"Are you…? → Not this time (= No)","ex":"Câu hỏi Yes/No. \"Not this time\" (lần này thì không) là cách nói No gián tiếp. (A) là bẫy lặp âm: training nghe giống train (tàu hỏa) → ticket. (C) là câu đáp lại lời đề nghị, không trả lời câu hỏi."}]},{"title":"Câu 14","tag":"Yes/No","audio":"../audio/mk4/c14.mp3","script":[{"sp":"Q","t":"Have you ever been to Australia?","vi":"Bạn đã từng đến Úc chưa?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":14,"q":"","qvi":"","opts":[{"t":"Yes, I visited some tourist attractions.","vi":"Rồi, tôi đã đi thăm vài điểm du lịch."},{"t":"I'm filling out the form.","vi":"Tôi đang điền vào mẫu đơn."},{"t":"I'm a flight attendant.","vi":"Tôi là tiếp viên hàng không."}],"ans":["A"],"key":"Have you ever…? → Yes + kể thêm","ex":"Hỏi đã từng đến Úc chưa: \"Yes\" (rồi) và kể thêm đã đi thăm vài điểm du lịch. (C) là bẫy liên tưởng: đi Úc → máy bay → flight attendant. (B) không liên quan."}]},{"title":"Câu 15","tag":"Where","audio":"../audio/mk4/c15.mp3","script":[{"sp":"Q","t":"Where's the employee break room?","vi":"Phòng nghỉ của nhân viên ở đâu?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":15,"q":"","qvi":"","opts":[{"t":"On the fifth floor.","vi":"Ở tầng năm."},{"t":"Let's call the repair shop.","vi":"Gọi cho tiệm sửa chữa đi."},{"t":"Yes, it's fairly big.","vi":"Vâng, nó khá rộng."}],"ans":["A"],"key":"Where → On the fifth floor","ex":"Where hỏi vị trí, nên chọn \"On the fifth floor\" (ở tầng năm). (B) là bẫy lặp âm: break (giải lao) nghe giống break (hỏng) → gọi thợ sửa. (C) trả lời Yes: câu hỏi Wh- không trả lời bằng Yes/No."}]},{"title":"Câu 16","tag":"How","audio":"../audio/mk4/c16.mp3","script":[{"sp":"Q","t":"How was your trip?","vi":"Chuyến đi của bạn thế nào?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":16,"q":"","qvi":"","opts":[{"t":"Yes, I have.","vi":"Vâng, tôi có."},{"t":"It was exciting.","vi":"Nó rất thú vị."},{"t":"I'm booking a flight.","vi":"Tôi đang đặt vé máy bay."}],"ans":["B"],"key":"How was…? → nhận xét (It was…)","ex":"How was…? hỏi cảm nhận về chuyến đi đã qua, nên trả lời bằng nhận xét: \"It was exciting\" (rất thú vị). (A) trả lời Yes: câu hỏi Wh- không trả lời bằng Yes/No. (C) là bẫy liên tưởng trip → flight, và sai thì (chuyến đi đã xong)."}]},{"title":"Câu 17","tag":"Câu hỏi đuôi","audio":"../audio/mk4/c17.mp3","script":[{"sp":"Q","t":"You have a copy of the report, don't you?","vi":"Bạn có một bản của báo cáo, phải không?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":17,"q":"","qvi":"","opts":[{"t":"Yes, it's on my desk.","vi":"Có, nó ở trên bàn tôi."},{"t":"I'm sorry to hear that.","vi":"Tôi rất tiếc khi nghe điều đó."},{"t":"He's a reporter.","vi":"Anh ấy là phóng viên."}],"ans":["A"],"key":"…, don't you? → Yes + nói thêm","ex":"Câu hỏi đuôi (… don't you?) trả lời như câu Yes/No thường: \"Yes\" (có) và nói thêm báo cáo ở trên bàn. (C) là bẫy lặp âm: report → reporter. (B) dùng khi nghe tin buồn."}]},{"title":"Câu 18","tag":"How far","audio":"../audio/mk4/c18.mp3","script":[{"sp":"Q","t":"How far are we from the airport?","vi":"Chúng ta cách sân bay bao xa?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":18,"q":"","qvi":"","opts":[{"t":"I have three bus passes.","vi":"Tôi có ba vé xe buýt."},{"t":"About a mile, I think.","vi":"Tôi nghĩ là khoảng một dặm."},{"t":"Wasn't it yesterday?","vi":"Không phải là hôm qua sao?"}],"ans":["B"],"key":"How far → khoảng cách (a mile, 5 km…)","ex":"How far hỏi khoảng cách, nên chọn \"About a mile\" (khoảng một dặm, gần 1,6 km). (A) có số \"three\" nhưng là số vé: hợp với How many. (C) nói thời gian, hợp với When."}]},{"title":"Câu 19","tag":"Yes/No","audio":"../audio/mk4/c19.mp3","script":[{"sp":"Q","t":"Did you get a chance to read the document I sent you?","vi":"Bạn đã có dịp đọc tài liệu tôi gửi chưa?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":19,"q":"","qvi":"","opts":[{"t":"No, but I'll read it soon.","vi":"Chưa, nhưng tôi sẽ đọc sớm thôi."},{"t":"An additional fee.","vi":"Một khoản phí thêm."},{"t":"I prefer the library.","vi":"Tôi thích thư viện hơn."}],"ans":["A"],"key":"Did you…? → No, but I'll…","ex":"Câu hỏi Yes/No với Did you…? (đã… chưa?). \"No, but I'll read it soon\" (chưa, nhưng sẽ đọc sớm) trả lời đúng ý. (C) là bẫy liên tưởng: read → library. (B) không liên quan."}]},{"title":"Câu 20","tag":"When","audio":"../audio/mk4/c20.mp3","script":[{"sp":"Q","t":"When will Mary return from the conference?","vi":"Khi nào Mary trở về từ hội nghị?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":20,"q":"","qvi":"","opts":[{"t":"At the convention center.","vi":"Ở trung tâm hội nghị."},{"t":"I'll give it back tomorrow.","vi":"Mai tôi sẽ trả lại nó."},{"t":"Next week.","vi":"Tuần sau."}],"ans":["C"],"key":"When → thời gian: Next week","ex":"When hỏi thời gian, \"Next week\" (tuần sau) đúng. (A) là bẫy liên tưởng: conference → convention center, và nói nơi chốn (hợp với Where). (B) là bẫy nghĩa: return còn có nghĩa \"trả lại\" (give back), nhưng ở đây return là \"trở về\", và (B) nói về \"I\" chứ không phải Mary."}]},{"title":"Câu 21","tag":"Yes/No","audio":"../audio/mk4/c21.mp3","script":[{"sp":"Q","t":"Did you meet Mr. David this evening?","vi":"Tối nay bạn có gặp ông David không?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":21,"q":"","qvi":"","opts":[{"t":"I like reading a book.","vi":"Tôi thích đọc sách."},{"t":"I'll submit my report.","vi":"Tôi sẽ nộp báo cáo."},{"t":"No, he is on a business trip.","vi":"Không, ông ấy đang đi công tác."}],"ans":["C"],"key":"Did you…? → No + lý do","ex":"Câu hỏi Yes/No: \"No\" (không gặp) và nêu lý do: ông ấy đang đi công tác. (A) và (B) không liên quan tới việc gặp ông David."}]},{"title":"Câu 22","tag":"Câu hỏi phủ định","audio":"../audio/mk4/c22.mp3","script":[{"sp":"Q","t":"Haven't you had your computer fixed yet?","vi":"Bạn vẫn chưa cho sửa máy tính à?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":22,"q":"","qvi":"","opts":[{"t":"She often uses a computer.","vi":"Cô ấy hay dùng máy tính."},{"t":"An amazing book.","vi":"Một cuốn sách tuyệt vời."},{"t":"I need a replacement.","vi":"Tôi cần một cái mới thay thế."}],"ans":["C"],"key":"Trả lời gián tiếp: không sửa được → cần cái mới","ex":"Câu hỏi phủ định (Haven't you…?) hỏi đã sửa máy tính chưa. (C) trả lời gián tiếp: \"Tôi cần một cái mới thay thế\", nghĩa là máy không sửa được nữa. (A) là bẫy lặp từ computer và sai người (she). (B) không liên quan."}]},{"title":"Câu 23","tag":"What time","audio":"../audio/mk4/c23.mp3","script":[{"sp":"Q","t":"What time does the plane take off?","vi":"Mấy giờ máy bay cất cánh?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":23,"q":"","qvi":"","opts":[{"t":"At about 5 PM.","vi":"Vào khoảng 5 giờ chiều."},{"t":"The ticket is expensive.","vi":"Vé đắt quá."},{"t":"I'm going to leave the office.","vi":"Tôi sắp rời văn phòng."}],"ans":["A"],"key":"What time → giờ (At 5 PM)","ex":"What time hỏi giờ, nên chọn \"At about 5 PM\" (khoảng 5 giờ chiều). (B) là bẫy liên tưởng: plane → ticket. (C) có leave (rời đi) gần nghĩa take off, nhưng không nói giờ."}]},{"title":"Câu 24","tag":"Yes/No","audio":"../audio/mk4/c24.mp3","script":[{"sp":"Q","t":"Do you like the new office space?","vi":"Bạn có thích văn phòng mới không?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":24,"q":"","qvi":"","opts":[{"t":"In the city.","vi":"Ở trong thành phố."},{"t":"I am sending a fax.","vi":"Tôi đang gửi fax."},{"t":"Yes, we do have bigger windows.","vi":"Có, chúng tôi có cửa sổ to hơn."}],"ans":["C"],"key":"Do you like…? → Yes + lý do","ex":"Câu hỏi Yes/No: \"Yes\" (thích) và nêu lý do: cửa sổ to hơn. (A) nói nơi chốn, hợp với Where. (B) liên quan văn phòng (fax) nhưng không trả lời có thích hay không."}]},{"title":"Câu 25","tag":"Nhờ giúp","audio":"../audio/mk4/c25.mp3","script":[{"sp":"Q","t":"Can you help me send a fax?","vi":"Bạn giúp tôi gửi fax được không?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":25,"q":"","qvi":"","opts":[{"t":"I am outside of the office.","vi":"Tôi đang ở ngoài văn phòng."},{"t":"It's a new company.","vi":"Đó là một công ty mới."},{"t":"In a file cabinet.","vi":"Trong tủ hồ sơ."}],"ans":["A"],"key":"Trả lời gián tiếp: đang ở ngoài → không giúp được","ex":"Người hỏi nhờ gửi fax. (A) trả lời gián tiếp: \"Tôi đang ở ngoài văn phòng\", nghĩa là bây giờ không giúp được. (C) nói nơi chốn, hợp với Where. (B) không liên quan."}]},{"title":"Câu 26","tag":"Who","audio":"../audio/mk4/c26.mp3","script":[{"sp":"Q","t":"Who wants to make a presentation next meeting?","vi":"Ai muốn thuyết trình trong buổi họp tới?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":26,"q":"","qvi":"","opts":[{"t":"Min-Su would like to.","vi":"Min-Su muốn làm."},{"t":"Our phone number has changed.","vi":"Số điện thoại của chúng ta đã đổi."},{"t":"A conference room.","vi":"Một phòng hội nghị."}],"ans":["A"],"key":"Who → tên người","ex":"Who hỏi người, nên chọn câu có tên người: \"Min-Su would like to\" (Min-Su muốn làm). (C) là bẫy liên tưởng: meeting → conference room. (B) không liên quan."}]},{"title":"Câu 27","tag":"Why","audio":"../audio/mk4/c27.mp3","script":[{"sp":"Q","t":"Why didn't Tom go to the party yesterday?","vi":"Tại sao hôm qua Tom không đi dự tiệc?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":27,"q":"","qvi":"","opts":[{"t":"Yes, my new laptop.","vi":"Vâng, laptop mới của tôi."},{"t":"These are office supplies.","vi":"Đây là đồ dùng văn phòng."},{"t":"Because she went on a business trip.","vi":"Vì cô ấy đi công tác."}],"ans":["C"],"key":"Why → Because… (lý do)","ex":"Why hỏi lý do, đáp án bắt đầu bằng Because: vì đi công tác. (A) trả lời Yes: câu hỏi Wh- không trả lời bằng Yes/No. (B) không liên quan. Lưu ý: đáp án viết \"she\" dù Tom thường là tên nam, nhưng đây vẫn là câu duy nhất nêu lý do."}]},{"title":"Câu 28","tag":"Who","audio":"../audio/mk4/c28.mp3","script":[{"sp":"Q","t":"Who is responsible for buying office supplies?","vi":"Ai chịu trách nhiệm mua đồ dùng văn phòng?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":28,"q":"","qvi":"","opts":[{"t":"No, I haven't.","vi":"Không, tôi chưa."},{"t":"Lisa will do it.","vi":"Lisa sẽ làm việc đó."},{"t":"This is a new whiteboard.","vi":"Đây là một cái bảng trắng mới."}],"ans":["B"],"key":"Who → tên người: Lisa","ex":"Who hỏi người, nên chọn câu có tên người: \"Lisa will do it\" (Lisa sẽ làm). (A) trả lời No: câu hỏi Wh- không trả lời bằng Yes/No. (C) là bẫy liên tưởng: office supplies → whiteboard."}]},{"title":"Câu 29","tag":"Where","audio":"../audio/mk4/c29.mp3","script":[{"sp":"Q","t":"Where do you plan to spend your summer vacation?","vi":"Bạn định đi nghỉ hè ở đâu?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":29,"q":"","qvi":"","opts":[{"t":"In New York.","vi":"Ở New York."},{"t":"July and December.","vi":"Tháng Bảy và tháng Mười Hai."},{"t":"Go swimming.","vi":"Đi bơi."}],"ans":["A"],"key":"Where → nơi chốn: In New York","ex":"Where hỏi nơi chốn, \"In New York\" đúng. (B) nói thời gian, hợp với When. (C) là bẫy liên tưởng: summer → đi bơi, nhưng nói hoạt động chứ không nói nơi."}]},{"title":"Câu 30","tag":"Lựa chọn (A or B)","audio":"../audio/mk4/c30.mp3","script":[{"sp":"Q","t":"Is the office on the right or the left?","vi":"Văn phòng ở bên phải hay bên trái?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":30,"q":"","qvi":"","opts":[{"t":"I don't know, either.","vi":"Tôi cũng không biết."},{"t":"They have already left.","vi":"Họ đã đi rồi."},{"t":"You won't miss it.","vi":"Bạn sẽ không bỏ lỡ nó đâu."}],"ans":["A"],"key":"Câu hỏi lựa chọn → \"không biết\" cũng là câu trả lời","ex":"Câu hỏi lựa chọn (… right or left?). Đáp án là (A) \"Tôi cũng không biết\": thú nhận không biết là kiểu trả lời gián tiếp hay gặp. (B) là bẫy lặp âm: left (bên trái) → left (đã đi). Lưu ý: (C) \"Bạn sẽ thấy ngay thôi\" cũng hay dùng khi chỉ đường."}]},{"title":"Câu 31","tag":"Who","audio":"../audio/mk4/c31.mp3","script":[{"sp":"Q","t":"Who will be the new manager?","vi":"Ai sẽ là quản lý mới?"}],"scriptLabel":"📜 Câu hỏi + dịch","qs":[{"n":31,"q":"","qvi":"","opts":[{"t":"That's a good idea.","vi":"Ý hay đấy."},{"t":"Thomas is best, I think.","vi":"Tôi nghĩ Thomas là tốt nhất."},{"t":"Management is the key.","vi":"Quản lý là chìa khóa."}],"ans":["B"],"key":"Who → tên người: Thomas","ex":"Who hỏi người, nên chọn câu có tên người: \"Thomas is best, I think\" (tôi nghĩ Thomas là hợp nhất). (C) là bẫy lặp âm: manager → management. (A) dùng để đáp lại một lời đề nghị."}]}],"recap":"<h2>Ghi nhớ: dạng câu hỏi Part 2<\/h2><table><tbody><tr><td><b>Dạng câu hỏi<\/b><\/td><td><b>Trả lời đúng<\/b><\/td><td><b>Câu<\/b><\/td><\/tr><tr><td>When / What time…?<\/td><td>thời gian: In August, This afternoon, Next week, At about 5 PM<\/td><td>7, 11, 20, 23<\/td><\/tr><tr><td>Where…?<\/td><td>nơi chốn: In the reception area, On the fifth floor, In New York<\/td><td>10, 15, 29<\/td><\/tr><tr><td>Who…?<\/td><td>tên người: Min-Su would like to, Lisa will do it, Thomas is best<\/td><td>26, 28, 31<\/td><\/tr><tr><td>Why…?<\/td><td>lý do: Because…<\/td><td>12, 27<\/td><\/tr><tr><td>How was…? / How far…?<\/td><td>nhận xét (It was exciting) / khoảng cách (About a mile)<\/td><td>16, 18<\/td><\/tr><tr><td>Yes/No (Have you / Did you / Are you / Do you…?)<\/td><td>Yes/No + nói thêm, hoặc \"Not this time\"<\/td><td>9, 13, 14, 19, 21, 24<\/td><\/tr><tr><td>Câu hỏi đuôi / phủ định (…, don't you? / Haven't you…?)<\/td><td>trả lời như câu thường, hoặc trả lời gián tiếp<\/td><td>17, 22<\/td><\/tr><tr><td>Nhờ giúp (Can you help me…?)<\/td><td>đồng ý / từ chối kèm lý do<\/td><td>8, 25<\/td><\/tr><tr><td>A or B?<\/td><td>chọn 1, hoặc \"Tôi không biết\"<\/td><td>30<\/td><\/tr><\/tbody><\/table><p><b>Bẫy lặp từ / lặp âm:<\/b> help (8), training → train → ticket (13), break room → repair shop (15), report → reporter (17), return → give back (20), computer (22), left → left (30), manager → management (31). Nghe thấy từ giống câu hỏi chưa chắc là đáp án đúng.<\/p><p><b>Bẫy liên tưởng:<\/b> trip → flight (16), Australia → flight attendant (14), read → library (19), conference → convention center (20), meeting → conference room (12, 26), plane → ticket (23), office supplies → whiteboard (28).<\/p><p><b>Bẫy Yes/No:<\/b> câu hỏi Wh- mà đáp án mở đầu bằng Yes/No là sai ngay: câu 7, 10, 15, 16, 27, 28.<\/p><p><b>Bài tập về nhà gợi ý:<\/b> nghe lại từng câu, chép lại câu hỏi và đáp án đúng vào vở, ghi rõ dạng câu hỏi (Where, Why, Yes/No…) và bẫy của các đáp án sai.<\/p>","exam":"TOEIC-PRE-MOCK4","examSrc":"/pretoeicnew-mocktest/"};</script>
