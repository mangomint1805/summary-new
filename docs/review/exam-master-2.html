<script>window.MT={"n": "pem2", "part": 0, "partName": "Full test", "sub": "Đề tổng hợp 200 câu · Part 1–7", "intro": "Trang này có <b>file nghe</b> và <b>chữa bài</b> đề luyện buổi <b>Exam Master 2</b> (giáo trình trang 179–214), đủ 7 phần như đề thi thật. <b>Cách học:</b> câu nghe thì bấm nghe → tự chọn (chữ đáp án Part 1, 2 được ẩn giống đề thật) → mở lời thoại xem dịch. Câu đọc thì chọn đáp án rồi xem vì sao đúng. Câu nào sai nhớ ghi vào <b>Error Log</b> để ôn trước <b>Progress Test 2</b> nha.", "stepsTitle": "Nhắc lại chiến lược từng Part", "steps": ["<b>Part 1:</b> nhìn tranh trước khi nghe: ai, ở đâu, đang làm gì. Loại đáp án sai người, sai vật, sai hành động.", "<b>Part 2:</b> nghe thật kỹ từ để hỏi đầu câu. Câu Wh- không trả lời Yes/No; đáp án lặp lại từ trong câu hỏi thường là bẫy.", "<b>Part 3, 4:</b> đọc trước 3 câu hỏi, gạch từ khoá; đáp án thường xuất hiện theo thứ tự lời nói và hay được nói lại bằng từ khác.", "<b>Part 5, 6:</b> nhìn 4 đáp án để biết câu hỏi về từ loại, thì, giới từ hay từ vựng → tìm dấu hiệu trong câu. Câu điền câu ở Part 6: đọc câu trước và sau chỗ trống.", "<b>Part 7:</b> đọc câu hỏi trước, tìm từ khoá trong bài. Câu NOT: dò từng đáp án, loại cái có trong bài. Bài 2 văn bản: có câu phải ghép thông tin cả hai bài."], "groups": [{"title": "Part 1 · Câu 1", "tag": "Tả tranh", "audio": "../audio/pem2/q1.mp3", "imgs": ["img/pem2/p1-1.jpg"], "hideOpts": true, "qs": [{"n": 1, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "There is one hand.", "vi": "Có một bàn tay."}, {"t": "This is a keyboard.", "vi": "Đây là một bàn phím."}, {"t": "This is a hoard.", "vi": "Đây là một kho tích trữ (hoard nghe giống board)."}, {"t": "There are two computers.", "vi": "Có hai cái máy tính."}], "ans": ["B"], "ex": "Hai bàn tay đang gõ trên bàn phím → (B). (A) sai vì có hai tay; (C) \"hoard\" là bẫy âm giống \"keyboard\"."}]}, {"title": "Part 1 · Câu 2", "tag": "Tả tranh", "audio": "../audio/pem2/q2.mp3", "imgs": ["img/pem2/p1-2.jpg"], "hideOpts": true, "qs": [{"n": 2, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "The people are swimming.", "vi": "Mọi người đang bơi."}, {"t": "The people are standing.", "vi": "Mọi người đang đứng."}, {"t": "The people are watching a show.", "vi": "Mọi người đang xem một buổi biểu diễn."}, {"t": "The people are watching TV.", "vi": "Mọi người đang xem ti vi."}], "ans": ["C"], "ex": "Khán giả ngồi xem cá heo biểu diễn → watching a show. (D) xem TV sai vật."}]}, {"title": "Part 1 · Câu 3", "tag": "Tả tranh", "audio": "../audio/pem2/q3.mp3", "imgs": ["img/pem2/p1-3.jpg"], "hideOpts": true, "qs": [{"n": 3, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "This is a boat.", "vi": "Đây là một chiếc thuyền."}, {"t": "This is a market.", "vi": "Đây là một khu chợ."}, {"t": "This is a truck.", "vi": "Đây là một chiếc xe tải."}, {"t": "This is a fish.", "vi": "Đây là một con cá."}], "ans": ["B"], "ex": "Tranh nhiều sạp hàng, người mua bán → market (chợ)."}]}, {"title": "Part 1 · Câu 4", "tag": "Tả tranh", "audio": "../audio/pem2/q4.mp3", "imgs": ["img/pem2/p1-4.jpg"], "hideOpts": true, "qs": [{"n": 4, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "The women are singing.", "vi": "Những người phụ nữ đang hát."}, {"t": "The women are sitting.", "vi": "Những người phụ nữ đang ngồi."}, {"t": "The women are dancing.", "vi": "Những người phụ nữ đang nhảy múa."}, {"t": "The women are chatting.", "vi": "Những người phụ nữ đang trò chuyện."}], "ans": ["C"], "ex": "Các cô đang múa → dancing. Nhìn kỹ hành động chính của người trong tranh."}]}, {"title": "Part 1 · Câu 5", "tag": "Tả tranh", "audio": "../audio/pem2/q5.mp3", "imgs": ["img/pem2/p1-5.jpg"], "hideOpts": true, "qs": [{"n": 5, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "The woman is talking on the phone.", "vi": "Người phụ nữ đang nói chuyện điện thoại."}, {"t": "The woman is crying.", "vi": "Người phụ nữ đang khóc."}, {"t": "The woman is frowning.", "vi": "Người phụ nữ đang cau mày."}, {"t": "The woman is laughing.", "vi": "Người phụ nữ đang cười lớn."}], "ans": ["A"], "ex": "Cô ấy áp điện thoại lên tai → talking on the phone. Cô đang mỉm cười chứ không cười lớn (D)."}]}, {"title": "Part 1 · Câu 6", "tag": "Tả tranh", "audio": "../audio/pem2/q6.mp3", "imgs": ["img/pem2/p1-6.jpg"], "hideOpts": true, "qs": [{"n": 6, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "The car is for sale.", "vi": "Chiếc xe đang được rao bán."}, {"t": "The car is on top of the building.", "vi": "Chiếc xe ở trên nóc tòa nhà."}, {"t": "The car is inside the house.", "vi": "Chiếc xe ở bên trong ngôi nhà."}, {"t": "The car is in front of the house.", "vi": "Chiếc xe ở phía trước ngôi nhà."}], "ans": ["D"], "ex": "Câu vị trí: xe đỗ trước ngôi nhà → in front of the house. Không có biển \"for sale\" nên (A) sai."}]}, {"title": "Part 2 · Câu 7", "tag": "Hỏi – đáp", "audio": "../audio/pem2/q7.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "Where did you go on Saturday?", "vi": "Bạn đã đi đâu vào thứ Bảy?"}], "qs": [{"n": 7, "q": "", "opts": [{"t": "They went to the movies.", "vi": "Họ đã đi xem phim."}, {"t": "I went to a party.", "vi": "Tôi đã đi dự tiệc."}, {"t": "I enjoyed the party.", "vi": "Tôi rất thích bữa tiệc."}], "ans": ["B"], "ex": "Hỏi \"you\" thì trả lời \"I\" + nơi chốn → (B). (A) sai chủ ngữ \"They\"."}]}, {"title": "Part 2 · Câu 8", "tag": "Hỏi – đáp", "audio": "../audio/pem2/q8.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "Where is that new restaurant?", "vi": "Nhà hàng mới đó ở đâu?"}], "qs": [{"n": 8, "q": "", "opts": [{"t": "It's downtown.", "vi": "Nó ở trung tâm thành phố."}, {"t": "It's a new restaurant.", "vi": "Đó là một nhà hàng mới."}, {"t": "I went to it yesterday.", "vi": "Tôi đã đến đó hôm qua."}], "ans": ["A"], "ex": "Where → nơi chốn: downtown. (B) lặp từ \"new restaurant\"."}]}, {"title": "Part 2 · Câu 9", "tag": "Hỏi – đáp", "audio": "../audio/pem2/q9.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "Which bus do I take to the theater?", "vi": "Tôi đi xe buýt nào để đến nhà hát?"}], "qs": [{"n": 9, "q": "", "opts": [{"t": "You take it from here.", "vi": "Bạn bắt nó ở đây."}, {"t": "The bus will be here soon.", "vi": "Xe buýt sẽ đến sớm thôi."}, {"t": "You take the number ten.", "vi": "Bạn đi tuyến số 10."}], "ans": ["C"], "ex": "Which bus → tên/số tuyến: number ten. (A) trả lời \"ở đâu\", (B) trả lời \"khi nào\"."}]}, {"title": "Part 2 · Câu 10", "tag": "Hỏi – đáp", "audio": "../audio/pem2/q10.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "Could you please buy some milk at the store?", "vi": "Bạn mua giúp mình ít sữa ở cửa hàng được không?"}], "qs": [{"n": 10, "q": "", "opts": [{"t": "Sure.", "vi": "Được chứ."}, {"t": "I'm going to the store.", "vi": "Tôi đang đi đến cửa hàng."}, {"t": "I like milk.", "vi": "Tôi thích sữa."}], "ans": ["A"], "ex": "Câu nhờ vả \"Could you…?\" → đồng ý \"Sure\". (B), (C) lặp từ store, milk."}]}, {"title": "Part 2 · Câu 11", "tag": "Hỏi – đáp", "audio": "../audio/pem2/q11.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "The radio is too loud.", "vi": "Cái radio mở to quá."}], "qs": [{"n": 11, "q": "", "opts": [{"t": "I'm sorry, I'll turn it off.", "vi": "Xin lỗi, tôi sẽ tắt nó."}, {"t": "Thank you very much!", "vi": "Cảm ơn nhiều!"}, {"t": "You're welcome.", "vi": "Không có gì."}], "ans": ["A"], "ex": "Câu phàn nàn → xin lỗi và xử lý: turn it off."}]}, {"title": "Part 2 · Câu 12", "tag": "Hỏi – đáp", "audio": "../audio/pem2/q12.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "What's your phone number?", "vi": "Số điện thoại của bạn là gì?"}], "qs": [{"n": 12, "q": "", "opts": [{"t": "I'm twelve years old.", "vi": "Tôi 12 tuổi."}, {"t": "At six o'clock.", "vi": "Lúc 6 giờ."}, {"t": "555-3481.", "vi": "555-3481."}], "ans": ["C"], "ex": "Hỏi số điện thoại → đọc dãy số. (A) tuổi, (B) giờ."}]}, {"title": "Part 2 · Câu 13", "tag": "Hỏi – đáp", "audio": "../audio/pem2/q13.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "Would you like to dance?", "vi": "Bạn có muốn nhảy không?"}], "qs": [{"n": 13, "q": "", "opts": [{"t": "Yes, I'd like that.", "vi": "Có, tôi rất muốn."}, {"t": "Yes, I can.", "vi": "Có, tôi biết nhảy."}, {"t": "Yes, you like to dance.", "vi": "Có, bạn muốn nhảy."}], "ans": ["A"], "ex": "Would you like…? (lời mời) → \"Yes, I'd like that\". (B) trả lời câu \"Can you…?\"."}]}, {"title": "Part 2 · Câu 14", "tag": "Hỏi – đáp", "audio": "../audio/pem2/q14.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "What time did you wake up this morning?", "vi": "Sáng nay bạn thức dậy lúc mấy giờ?"}], "qs": [{"n": 14, "q": "", "opts": [{"t": "It's seven o'clock.", "vi": "Bây giờ là 7 giờ."}, {"t": "Seven hours.", "vi": "Bảy tiếng."}, {"t": "At seven o'clock.", "vi": "Lúc 7 giờ."}], "ans": ["C"], "ex": "What time did… → \"At + giờ\". (A) là giờ hiện tại, (B) là khoảng thời gian."}]}, {"title": "Part 2 · Câu 15", "tag": "Hỏi – đáp", "audio": "../audio/pem2/q15.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "Are you finished with that newspaper?", "vi": "Bạn đọc xong tờ báo đó chưa?"}], "qs": [{"n": 15, "q": "", "opts": [{"t": "Yes, you're welcome.", "vi": "Rồi, không có gì."}, {"t": "No, not yet.", "vi": "Chưa, chưa xong."}, {"t": "No, thank you.", "vi": "Không, cảm ơn."}], "ans": ["B"], "ex": "Are you finished…? → \"No, not yet\" (chưa xong)."}]}, {"title": "Part 2 · Câu 16", "tag": "Hỏi – đáp", "audio": "../audio/pem2/q16.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)" "n": 68, "q": "What did the man do yesterday?", "qvi": "Hôm qua anh đã làm gì?", "opts": [{"t": "He found a new job."}, {"t": "He quit his job."}, {"t": "He gave the woman a job."}, {"t": "He was fired by his boss."}], "ans": ["B"], "ex": "\"I quit my job yesterday.\""}, {"n": 69, "q": "How does the woman react?", "qvi": "Cô phản ứng thế nào?", "opts": [{"t": "She is nervous."}, {"t": "She is surprised."}, {"t": "She is angry."}, {"t": "She is happy."}], "ans": ["B"], "ex": "\"Really? Why did you do that?\" → ngạc nhiên."}, {"n": 70, "q": "Which of the following is probably true?", "qvi": "Điều nào có lẽ đúng?", "opts": [{"t": "The man is a good cook."}, {"t": "The man will take a vacation."}, {"t": "The man will quit his job."}, {"t": "The man will look for a new job."}], "ans": ["D"], "ex": "Cô gợi ý nộp đơn vào công ty mình → anh sẽ tìm việc mới. (C) anh đã nghỉ rồi."}]}, {"title": "Bài nói 71–73", "tag": "Part 4", "audio": "../audio/pem2/s71.mp3", "script": [{"sp": "", "t": "Attention, shoppers. For the next 50 minutes, we will have a sale on sweaters in the children's department. Every sweater will be 50% off. Yes, that's right. For just a quarter of an hour, you can buy any child's sweater at just half the original price. Now there is a bargain you can't afford to miss. Hurry now. The clock is ticking.", "vi": "Chú ý quý khách. Trong 50 phút tới (sau đó nói 15 phút), khu trẻ em giảm giá áo len. Mọi áo len giảm 50%. Đúng vậy, chỉ trong 15 phút, bạn mua áo len trẻ em với nửa giá gốc. Món hời không thể bỏ lỡ. Nhanh lên, thời gian đang trôi."}], "qs": [{"n": 71, "q": "Where is this announcement being made?", "qvi": "Thông báo này ở đâu?", "opts": [{"t": "At an airport"}, {"t": "In a department store"}, {"t": "In a children's hospital"}, {"t": "At a playground"}], "ans": ["B"], "ex": "\"Attention, shoppers… children's department\" → cửa hàng bách hóa."}, {"n": 72, "q": "How much will a $50 sweater cost now?", "qvi": "Áo len 50 đô giờ giá bao nhiêu?", "opts": [{"t": "$50"}, {"t": "$5"}, {"t": "$15"}, {"t": "$25"}], "ans": ["D"], "ex": "Giảm 50% → còn một nửa = 25 đô."}, {"n": 73, "q": "Who would be most interested in this announcement?", "qvi": "Ai quan tâm nhất?", "opts": [{"t": "Children"}, {"t": "Tourists"}, {"t": "Parents"}, {"t": "Doctors"}], "ans": ["C"], "ex": "Áo len trẻ em → phụ huynh mua cho con."}]}, {"title": "Bài nói 74–76", "tag": "Part 4", "audio": "../audio/pem2/s74.mp3", "script": [{"sp": "", "t": "The next stop is Main Street. The exit doors are on the left side. You can transfer to the white line, line number 4, to Seoul soccer stadium. Please be careful as you leave the train.", "vi": "Ga tiếp theo là Main Street. Cửa ra ở bên trái. Bạn có thể chuyển sang tuyến trắng, tuyến số 4, đến sân vận động bóng đá Seoul. Vui lòng cẩn thận khi xuống tàu."}], "qs": [{"n": 74, "q": "What is the next stop?", "qvi": "Ga tiếp theo là gì?", "opts": [{"t": "Main Road"}, {"t": "Main Station"}, {"t": "Main Street"}, {"t": "Main Row"}], "ans": ["C"], "ex": "\"The next stop is Main Street.\""}, {"n": 75, "q": "What line leads to Seoul soccer stadium?", "qvi": "Tuyến nào đến sân vận động Seoul?", "opts": [{"t": "The brown line"}, {"t": "The green line"}, {"t": "The white line"}, {"t": "The purple line"}], "ans": ["C"], "ex": "\"the white line… to Seoul soccer stadium\"."}, {"n": 76, "q": "What number is the white line?", "qvi": "Tuyến trắng là số mấy?", "opts": [{"t": "Number six"}, {"t": "Number four"}, {"t": "Number seven"}, {"t": "Number three"}], "ans": ["B"], "ex": "\"line number 4\"."}]}, {"title": "Bài nói 77–79", "tag": "Part 4", "audio": "../audio/pem2/s77.mp3", "script": [{"sp": "", "t": "A small dog was lost in the city center two days ago. It is brown with white paws and answers to the name Sam. It was wearing a brown collar. A reward of fifty dollars will be given for helping in finding him. Please contact Brian at 655-7951.", "vi": "Một chú chó nhỏ bị lạc ở trung tâm thành phố hai ngày trước. Chó màu nâu, chân trắng, tên là Sam, đeo vòng cổ nâu. Ai giúp tìm được sẽ được thưởng 50 đô. Liên hệ Brian số 655-7951."}], "qs": [{"n": 77, "q": "Where was the dog lost?", "qvi": "Chó bị lạc ở đâu?", "opts": [{"t": "Near the park"}, {"t": "Outside the city"}, {"t": "In the city center"}, {"t": "At the beach"}], "ans": ["C"], "ex": "\"in the city center\"."}, {"n": 78, "q": "What color is the dog?", "qvi": "Chó màu gì?", "opts": [{"t": "White with brown paws"}, {"t": "Brown with white paws"}, {"t": "Brown with black paws"}, {"t": "Black with brown paws"}], "ans": ["B"], "ex": "\"brown with white paws\"."}, {"n": 79, "q": "How much money will be given for help in finding the dog?", "qvi": "Tiền thưởng bao nhiêu?", "opts": [{"t": "Fifteen dollars"}, {"t": "Twenty dollars"}, {"t": "Thirty dollars"}, {"t": "Fifty dollars"}], "ans": ["D"], "ex": "\"A reward of fifty dollars\"."}]}, {"title": "Bài nói 80–82", "tag": "Part 4", "audio": "../audio/pem2/s80.mp3", "script": [{"sp": "", "t": "I usually ride my bicycle to work. It's much faster than taking the bus because I can take a shortcut through the park. It takes about twenty minutes in total. The subway is even slower because it is a fifteen-minute walk from my house to the subway station. Then the subway ride is another twenty minutes. In the winter, though, I have to take the bus because of the weather.", "vi": "Tôi thường đạp xe đi làm. Nhanh hơn xe buýt vì tôi đi tắt qua công viên, tổng cộng khoảng 20 phút. Tàu điện ngầm còn chậm hơn vì đi bộ từ nhà ra ga mất 15 phút, rồi đi tàu thêm 20 phút. Nhưng mùa đông thì tôi phải đi xe buýt vì thời tiết."}], "qs": [{"n": 80, "q": "Which of the following takes the longest time to get to the speaker's workplace?", "qvi": "Phương tiện nào mất nhiều thời gian nhất?", "opts": [{"t": "The subway"}, {"t": "The bus"}, {"t": "The bike"}, {"t": "The taxi"}], "ans": ["A"], "ex": "Xe đạp 20 phút; tàu điện ngầm 15 + 20 = 35 phút, \"even slower\" → subway."}, {"n": 81, "q": "How long does it take the speaker to walk to the subway station?", "qvi": "Đi bộ ra ga mất bao lâu?", "opts": [{"t": "Ten minutes"}, {"t": "Fifteen minutes"}, {"t": "Twenty minutes"}, {"t": "Fifty minutes"}], "ans": ["B"], "ex": "\"a fifteen-minute walk\"."}, {"n": 82, "q": "How does the speaker get to work in the winter?", "qvi": "Mùa đông người nói đi làm bằng gì?", "opts": [{"t": "By bus"}, {"t": "By train"}, {"t": "By taxi"}, {"t": "By bike"}], "ans": ["A"], "ex": "\"In the winter… take the bus\"."}]}, {"title": "Bài nói 83–85", "tag": "Part 4", "audio": "../audio/pem2/s83.mp3", "script": [{"sp": "", "t": "Monday will be warm in most areas, with some rain in the north of the country. Temperatures will reach up to 25 degrees in the south and around 20 degrees in the north. Tuesday will also have similar conditions, with slightly higher temperatures of about 23 degrees in the north.", "vi": "Thứ Hai trời ấm ở hầu hết các vùng, có mưa ở phía bắc. Nhiệt độ lên tới 25 độ ở phía nam và khoảng 20 độ ở phía bắc. Thứ Ba cũng tương tự, nhiệt độ hơi cao hơn, khoảng 23 độ ở phía bắc."}], "qs": [{"n": 83, "q": "According to the weather report, where will the rain be?", "qvi": "Mưa ở đâu?", "opts": [{"t": "In the south"}, {"t": "In the east"}, {"t": "In the north"}, {"t": "In the west"}], "ans": ["C"], "ex": "\"some rain in the north\"."}, {"n": 84, "q": "How high will the temperatures reach in the north?", "qvi": "Nhiệt độ phía bắc cao nhất bao nhiêu?", "opts": [{"t": "20 degrees"}, {"t": "23 degrees"}, {"t": "30 degrees"}, {"t": "25 degrees"}], "ans": ["B"], "ex": "Thứ Hai khoảng 20 độ, thứ Ba \"about 23 degrees in the north\" → 23."}, {"n": 85, "q": "What difference will be seen between Monday and Tuesday?", "qvi": "Thứ Hai và thứ Ba khác nhau thế nào?", "opts": [{"t": "Monday will be far hotter."}, {"t": "Tuesday will have more rain."}, {"t": "There will be some higher temperatures on Tuesday."}, {"t": "There will be some extra rain showers on Monday."}], "ans": ["C"], "ex": "Thứ Ba \"slightly higher temperatures\" → nhiệt độ cao hơn."}]}, {"title": "Bài nói 86–88", "tag": "Part 4", "audio": "../audio/pem2/s86.mp3", "script": [{"sp": "", "t": "Are you trying to improve your English? If so, come to Dave's English camp. We try to make learning English an enjoyable experience for you. We have classes from eight to twelve every morning. After, you can practice speaking with other English students from around the world.", "vi": "Bạn muốn giỏi tiếng Anh hơn? Hãy đến trại tiếng Anh của Dave. Chúng tôi làm cho việc học tiếng Anh thành trải nghiệm vui vẻ. Lớp học từ 8 đến 12 giờ mỗi sáng. Sau đó, bạn có thể luyện nói với học viên khắp thế giới."}], "qs": [{"n": 86, "q": "What does Dave's English camp try to do?", "qvi": "Trại tiếng Anh của Dave muốn làm gì?", "opts": [{"t": "To make English easy"}, {"t": "To make English fun"}, {"t": "To make English boring"}, {"t": "To help you write English"}], "ans": ["B"], "ex": "\"an enjoyable experience\" = vui (fun)."}, {"n": 87, "q": "What time are the classes?", "qvi": "Lớp học mấy giờ?", "opts": [{"t": "From 8-11"}, {"t": "From 9-12"}, {"t": "From 7-12"}, {"t": "From 8-12"}], "ans": ["D"], "ex": "\"from eight to twelve\"."}, {"n": 88, "q": "What can you do after class?", "qvi": "Sau giờ học có thể làm gì?", "opts": [{"t": "Practice wilting English"}, {"t": "Practice speaking English"}, {"t": "Watch English movies"}, {"t": "Do an English test"}], "ans": ["B"], "ex": "\"practice speaking with other English students\"."}]}, {"title": "Bài nói 89–91", "tag": "Part 4", "audio": "../audio/pem2/s89.mp3", "script": [{"sp": "", "t": "My cousin is a very good photographer. He has spent over three thousand dollars on his camera. He takes pictures of many different things like nature or movie stars. He then sells the pictures to newspapers. He seems to enjoy his job.", "vi": "Anh họ tôi là nhiếp ảnh gia rất giỏi. Anh ấy đã chi hơn 3.000 đô cho máy ảnh. Anh chụp nhiều thứ như thiên nhiên, ngôi sao điện ảnh rồi bán ảnh cho các tờ báo. Anh ấy có vẻ rất thích công việc này."}], "qs": [{"n": 89, "q": "What does the speaker's cousin do?", "qvi": "Anh họ làm nghề gì?", "opts": [{"t": "He takes pictures."}, {"t": "He sells cameras."}, {"t": "He is a movie star."}, {"t": "He doesn't have a job."}], "ans": ["A"], "ex": "\"a very good photographer\" → chụp ảnh."}, {"n": 90, "q": "How much has the speaker's cousin spent on his camera?", "qvi": "Anh chi bao nhiêu cho máy ảnh?", "opts": [{"t": "Over two thousand dollars"}, {"t": "Over four thousand dollars"}, {"t": "Over three thousand dollars"}, {"t": "Over four hundred dollars"}], "ans": ["C"], "ex": "\"over three thousand dollars\"."}, {"n": 91, "q": "Who does he sell the photographs to?", "qvi": "Anh bán ảnh cho ai?", "opts": [{"t": "Book publishers"}, {"t": "Magazines"}, {"t": "Newspapers"}, {"t": "The local news station"}], "ans": ["C"], "ex": "\"sells the pictures to newspapers\"."}]}, {"title": "Bài nói 92–94", "tag": "Part 4", "audio": "../audio/pem2/s92.mp3", "script": [{"sp": "", "t": "Last week, two hundred thousand people ran in the Chicago City Marathon. Over ten million dollars was collected for charity. Most of the money will be given to the city hospital. The winner of the marathon was Karl Muller from Germany, who finished in two and a half hours.", "vi": "Tuần trước, 200.000 người chạy marathon thành phố Chicago. Hơn 10 triệu đô được quyên góp từ thiện, phần lớn sẽ trao cho bệnh viện thành phố. Người thắng là Karl Muller đến từ Đức, về đích sau 2 tiếng rưỡi."}], "qs": [{"n": 92, "q": "How many people ran in the marathon?", "qvi": "Bao nhiêu người chạy?", "opts": [{"t": "20,000"}, {"t": "30,000"}, {"t": "200,000"}, {"t": "300,000"}], "ans": ["C"], "ex": "\"two hundred thousand\" = 200,000."}, {"n": 93, "q": "Where will the money go?", "qvi": "Tiền sẽ được đưa đi đâu?", "opts": [{"t": "To the city parks"}, {"t": "To the city schools"}, {"t": "To the government"}, {"t": "To the city hospital"}], "ans": ["D"], "ex": "\"given to the city hospital\"."}, {"n": 94, "q": "What time did the winner finish in?", "qvi": "Người thắng về đích sau bao lâu?", "opts": [{"t": "Two hours"}, {"t": "Two hours, thirty minutes"}, {"t": "Three horns"}, {"t": "Two hours, fifty minutes"}], "ans": ["B"], "ex": "\"two and a half hours\" = 2 tiếng 30 phút."}]}, {"title": "Bài nói 95–97", "tag": "Part 4", "audio": "../audio/pem2/s95.mp3", "script": [{"sp": "", "t": "Attention all students. Due to a burst in the gas pipes, as well as the extremely cold weather, today's classes will be canceled. The school buses will be arriving in twenty minutes to take everyone home. Tomorrow's classes will most likely be canceled, but the local radio station will make an announcement in the morning.", "vi": "Chú ý các em học sinh. Do vỡ ống dẫn khí đốt và trời rất lạnh, các lớp hôm nay bị hủy. Xe buýt trường sẽ đến sau 20 phút để đưa mọi người về. Lớp ngày mai có thể cũng bị hủy, đài phát thanh địa phương sẽ thông báo vào buổi sáng."}], "qs": [{"n": 95, "q": "Why are the students being sent home?", "qvi": "Vì sao học sinh được cho về?", "opts": [{"t": "It is a school holiday."}, {"t": "There is a problem with the heating system."}, {"t": "Some of the teachers are absent."}, {"t": "The water pipes burst."}], "ans": ["B"], "ex": "\"a burst in the gas pipes… extremely cold\" → hệ thống sưởi gặp sự cố. (D) bẫy: vỡ ống khí đốt, không phải ống nước."}, {"n": 96, "q": "When will the buses arrive?", "qvi": "Khi nào xe buýt đến?", "opts": [{"t": "In twenty minutes"}, {"t": "In thirty minutes"}, {"t": "In forty minutes"}, {"t": "In one hour"}], "ans": ["A"], "ex": "\"in twenty minutes\"."}, {"n": 97, "q": "How will the students know if the school is closed the following day?", "qvi": "Làm sao biết mai có nghỉ học?", "opts": [{"t": "Their parents will be called."}, {"t": "It will be announced on the local TV station."}, {"t": "They can find out on the Internet."}, {"t": "The local radio station will make an announcement."}], "ans": ["D"], "ex": "\"the local radio station will make an announcement\"."}]}, {"title": "Bài nói 98–100", "tag": "Part 4", "audio": "../audio/pem2/s98.mp3", "script": [{"sp": "", "t": "Ladies and Gentlemen, we are experiencing some bad weather, so all passengers must return to their seats and fasten their seatbelts. I would like to remind you that this is a non-smoking flight, so smoking will not be permitted. We should pass through the bad weather within thirty minutes, at which time lunch will be served.", "vi": "Thưa quý khách, chúng ta đang gặp thời tiết xấu, mọi hành khách vui lòng về chỗ và thắt dây an toàn. Xin nhắc đây là chuyến bay cấm hút thuốc. Chúng ta sẽ ra khỏi vùng thời tiết xấu trong 30 phút, lúc đó bữa trưa sẽ được phục vụ."}], "qs": [{"n": 98, "q": "Where is this announcement most likely being made?", "qvi": "Thông báo ở đâu?", "opts": [{"t": "On a train"}, {"t": "On the subway"}, {"t": "On an airplane"}, {"t": "On a boat cruise"}], "ans": ["C"], "ex": "\"fasten their seatbelts… non-smoking flight\" → trên máy bay."}, {"n": 99, "q": "Why do the passengers have to fasten their seatbelts?", "qvi": "Vì sao phải thắt dây an toàn?", "opts": [{"t": "They are landing."}, {"t": "Lunch is being served."}, {"t": "They are taking off."}, {"t": "They are passing through some rough weather."}], "ans": ["D"], "ex": "\"experiencing some bad weather\" → đi qua vùng thời tiết xấu."}, {"n": 100, "q": "What will happen in thirty minutes?", "qvi": "30 phút nữa chuyện gì xảy ra?", "opts": [{"t": "They will land."}, {"t": "Dinner will be served."}, {"t": "They will enter into some bad weather."}, {"t": "Lunch will be served."}], "ans": ["D"], "ex": "\"within thirty minutes, at which time lunch will be served\"."}]}, {"title": "Part 5 · Câu 101", "tag": "Điền từ", "qs": [{"n": 101, "q": "After upgrading to Pro Data Whiz, our clients began ___ problems with spreadsheets.", "opts": [{"t": "has"}, {"t": "had"}, {"t": "have"}, {"t": "having"}], "ans": ["D"], "ex": "begin + V-ing: began having problems (bắt đầu gặp vấn đề)."}]}, {"title": "Part 5 · Câu 102", "tag": "Điền từ", "qs": [{"n": 102, "q": "Requests for additional days off are ___ by Ms. Chung in HR.", "opts": [{"t": "approved"}, {"t": "dropped"}, {"t": "reached"}, {"t": "reminded"}], "ans": ["A"], "ex": "Nghĩa: yêu cầu nghỉ thêm được bà Chung DUYỆT → approved (bị động are + V3)."}]}, {"title": "Part 5 · Câu 103", "tag": "Điền từ", "qs": [{"n": 103, "q": "The programmers have a list of changes ___ the next software update.", "opts": [{"t": "between"}, {"t": "of"}, {"t": "for"}, {"t": "above"}], "ans": ["C"], "ex": "a list of changes FOR the next update = danh sách thay đổi DÀNH CHO bản cập nhật tới."}]}, {"title": "Part 5 · Câu 104", "tag": "Điền từ", "qs": [{"n": 104, "q": "Let Farida Banquet Service ___ professional catering for your important corporate events.", "opts": [{"t": "providing"}, {"t": "provide"}, {"t": "provides"}, {"t": "to provide"}], "ans": ["B"], "ex": "let + sb + V nguyên mẫu → provide."}]}, {"title": "Part 5 · Câu 105", "tag": "Điền từ", "qs": [{"n": 105, "q": "Using various innovative techniques, Boyd Industries has improved the ___ of its tiles.", "opts": [{"t": "closure"}, {"t": "product"}, {"t": "quality"}, {"t": "method"}], "ans": ["C"], "ex": "Nghĩa: cải thiện CHẤT LƯỢNG gạch → quality."}]}, {"title": "Part 5 · Câu 106", "tag": "Điền từ", "qs": [{"n": 106, "q": "___ of all cosmetics are final, and refunds will not be given under any circumstances.", "opts": [{"t": "Sale"}, {"t": "Sales"}, {"t": "Sells"}, {"t": "Selling"}], "ans": ["B"], "ex": "Chủ ngữ số nhiều (động từ \"are\") → Sales: hàng đã bán thì không đổi trả."}]}, {"title": "Part 5 · Câu 107", "tag": "Điền từ", "qs": [{"n": 107, "q": "If you have already submitted your response, no ___ action is required.", "opts": [{"t": "bright"}, {"t": "further"}, {"t": "previous"}, {"t": "average"}], "ans": ["B"], "ex": "no further action = không cần làm gì thêm."}]}, {"title": "Part 5 · Câu 108", "tag": "Điền từ", "qs": [{"n": 108, "q": "Ms. Sieglak stated that the app design was based on ___ own research.", "opts": [{"t": "she"}, {"t": "hers"}, {"t": "her"}, {"t": "herself"}], "ans": ["C"], "ex": "based on HER own research: sở hữu + own + danh từ."}]}, {"title": "Part 5 · Câu 109", "tag": "Điền từ", "qs": [{"n": 109, "q": "___ the organization has doubled its outreach efforts, it has yet to see an increase in new clients.", "opts": [{"t": "Until"}, {"t": "Because"}, {"t": "Although"}, {"t": "Therefore"}], "ans": ["C"], "ex": "Hai vế trái ngược (tăng nỗ lực nhưng chưa có thêm khách) → Although (mặc dù)."}]}, {"title": "Part 5 · Câu 110", "tag": "Điền từ", "qs": [{"n": 110, "q": "Starting on October 8, ___ board of education meetings will be streamed live on the school district’s Web site.", "opts": [{"t": "all"}, {"t": "so"}, {"t": "that"}, {"t": "to"}], "ans": ["A"], "ex": "all + danh từ số nhiều: all board meetings."}]}, {"title": "Part 5 · Câu 111", "tag": "Điền từ", "qs": [{"n": 111, "q": "The hairstylists at Urbanite Salon have ___ experience working with a variety of hair products.", "opts": [{"t": "considers"}, {"t": "considerable"}, {"t": "considerate"}, {"t": "considering"}], "ans": ["B"], "ex": "Trước danh từ experience cần tính từ → considerable (đáng kể)."}]}, {"title": "Part 5 · Câu 112", "tag": "Điền từ", "qs": [{"n": 112, "q": "Both candidates are ___ suitable for the assistant manager position.", "opts": [{"t": "permanently"}, {"t": "promptly"}, {"t": "equally"}, {"t": "gradually"}], "ans": ["C"], "ex": "equally suitable = phù hợp NHƯ NHAU (cả hai ứng viên)."}]}, {"title": "Part 5 · Câu 113", "tag": "Điền từ", "qs": [{"n": 113, "q": "With the acquisition of Bloom Circuit, Wellstrom Hardware has ___ expanded its offerings and services.", "opts": [{"t": "greater"}, {"t": "greatness"}, {"t": "great"}, {"t": "greatly"}], "ans": ["D"], "ex": "has ___ expanded: chen giữa trợ động từ và V3 là trạng từ → greatly."}]}, {"title": "Part 5 · Câu 114", "tag": "Điền từ", "qs": [{"n": 114, "q": "Please note is place is beautiful! I’m staying at a small hotel on the beach.", "It took about four hours to get here from the airport. I took a taxi after I got off the airplane, then a bus, and then I had a short boat ride. When I finally arrived, I was really tired. But, I’m glad I came. Wish you were here. See you next week.", "Janet"], "qs": [{"n": 155, "q": "Where is Janet staying?", "qvi": "Janet ở đâu?", "opts": [{"t": "In a taxi"}, {"t": "In an airplane"}, {"t": "In a hotel"}, {"t": "In a tent"}], "ans": ["C"], "ex": "\"staying at a small hotel on the beach\"."}, {"n": 156, "q": "How did she travel there?", "qvi": "Cô ấy đi đến đó bằng gì?", "opts": [{"t": "First by taxi, then by bus, then by airplane"}, {"t": "First by airplane, then by taxi, then by bus, then by boat"}, {"t": "First by airplane, then by boat"}, {"t": "First by boat, then by bus, then by taxi."}], "ans": ["B"], "ex": "Máy bay → taxi → xe buýt → thuyền (theo thứ tự trong thư)."}]}, {"title": "Part 7 · Câu 157–159", "tag": "1 văn bản", "passage": ["Always tired? No energy?", "Do you need a little extra strength to get through that tough workday?", "If you answered \"yes,\" then try Vitagetic, the new energy drink.", "Vitagetic has all the vitamins that your body needs to maintain a high level of energy all day long. It is an easy way to get all your vitamins. You don’t have to take lots of vitamin pills. It comes in three fantastic flavors: Lemon, Orange, and Apple, and tastes great.", "Have 1 bottle at breakfast and you will feel healthy and energetic until quitting time.", "You can find it at all good supermarkets."], "qs": [{"n": 157, "q": "Who should drink Vitagetic?", "qvi": "Ai nên uống Vitagetic?", "opts": [{"t": "People who are often tired"}, {"t": "People who have a lot of energy"}, {"t": "People who are bored"}, {"t": "People who can't sleep"}], "ans": ["A"], "ex": "\"Always tired? No energy?\" → người hay mệt."}, {"n": 158, "q": "Why is Vitagetic good for you?", "qvi": "Vì sao Vitagetic tốt?", "opts": [{"t": "Because it has oranges and apples"}, {"t": "Because it has vitamins"}, {"t": "Because it comes in a bottle"}, {"t": "Because you drink it at breakfast"}], "ans": ["B"], "ex": "\"has all the vitamins that your body needs\"."}, {"n": 159, "q": "Which of the following is NOT true?", "qvi": "Câu nào KHÔNG đúng?", "opts": [{"t": "You have to take vitamin pills with Vitagetic."}, {"t": "You can buy Vitagetic at supermarkets."}, {"t": "Vitagetic is a good breakfast drink."}, {"t": "Vitagetic is delicious."}], "ans": ["A"], "ex": "\"You don't have to take lots of vitamin pills\" → (A) sai."}]}, {"title": "Part 7 · Câu 160–162", "tag": "1 văn bản", "passage": ["Recycling Instructions", "Please separate your trash into the following bins.", "Glass and plastic go in the large blue bin. Paper and cardboard products go in the yellow bin. Aluminum cans go in the purple bin, but all other metals go in the red bin. Food waste should be put in the green bin.", "Thank you for your cooperation,", "Scherk Property Management"], "qs": [{"n": 160, "q": "Where should you put cola bottles?", "qvi": "Chai nước ngọt bỏ vào thùng nào?", "opts": [{"t": "In the blue bin"}, {"t": "In the yellow bin"}, {"t": "In the red bin"}, {"t": "In the green bin"}], "ans": ["A"], "ex": "Chai = glass/plastic → \"large blue bin\"."}, {"n": 161, "q": "Which of the following would you put in the yellow bin?", "qvi": "Thứ nào bỏ vào thùng vàng?", "opts": [{"t": "Old shoes"}, {"t": "Food"}, {"t": "Magazines"}, {"t": "A broken TV"}], "ans": ["C"], "ex": "Thùng vàng cho giấy, bìa → tạp chí (giấy)."}, {"n": 162, "q": "Which of the following can NOT be put in the green bin?", "qvi": "Thứ nào KHÔNG được bỏ vào thùng xanh lá?", "opts": [{"t": "Newspapers"}, {"t": "A leftover sandwich"}, {"t": "Orange peel"}, {"t": "Rice"}], "ans": ["A"], "ex": "Thùng xanh lá chỉ cho rác thức ăn → báo (giấy) thì không."}]}, {"title": "Part 7 · Câu 163–165", "tag": "1 văn bản", "passage": ["Ticket-King", "Do you need tickets for the big event? We’ve got all your ticket needs covered! We sell tickets for sporting events (football, hockey, baseball, even boxing), concerts (from Diana Krall to U2), and the theater.", "Special this week only: 10% discount on all concert tickets. That’s right, you can get your pass to the big Tragically Hip concert for just $45* after the discount.", "Buy yours today! Visit us at www.ticket-king.com", "*discount price does not include Ticket-King’s additional 70% service charge."], "qs": [{"n": 163, "q": "Where can you buy tickets?", "qvi": "Mua vé ở đâu?", "opts": [{"t": "In a department store"}, {"t": "In the newspaper"}, {"t": "On the Internet"}, {"t": "In the shopping mall"}], "ans": ["C"], "ex": "\"Visit us at www.ticket-king.com\" → trên Internet."}, {"n": 164, "q": "For which event can you get a 10% discount?", "qvi": "Sự kiện nào được giảm 10%?", "opts": [{"t": "A Michael Jackson concert"}, {"t": "A hockey game"}, {"t": "A boxing match"}, {"t": "A play"}], "ans": ["A"], "ex": "\"10% discount on all concert tickets\" → buổi hòa nhạc (Michael Jackson concert)."}, {"n": 165, "q": "How much does a ticket for the Tragically Hip concert normally cost?", "qvi": "Giá gốc vé Tragically Hip là bao nhiêu?", "opts": [{"t": "$40"}, {"t": "S45"}, {"t": "$50"}, {"t": "$55"}], "ans": ["C"], "ex": "Sau giảm 10% còn $45 → giá gốc $50 (45 = 50 × 90%)."}]}, {"title": "Part 7 · Câu 166–168", "tag": "1 văn bản", "passage": ["JADE LION", "Szechuan Style Chinese Restaurant", "Dimsum, Peking Duck, Ginger Beef,and all your mouth-watering favorites", "Try our $9.99 lunch buffet Monday through Friday,", "11:00 a.m. – 2:00 p.m.", "Planning a party? No problem, book one of our many rooms.", "56 West Sycamore Street (beside Eaton's Department Store)", "Call 476-5593 for group reservations.", "Call 476-5594 for takeout orders (pick-up or delivery)", "Hours: Monday – Friday 11:00 a.m. – 10:00 p.m.", "Saturday 12:00 p.m. – 11:00 p.m.", "No MSG available upon request"], "qs": [{"n": 166, "q": "What kind of food does the Jade Lion serve?", "qvi": "Jade Lion phục vụ món gì?", "opts": [{"t": "Korean food"}, {"t": "American food"}, {"t": "French food"}, {"t": "Chinese food"}], "ans": ["D"], "ex": "\"Szechuan Style Chinese Restaurant\" → món Trung Quốc."}, {"n": 167, "q": "Which day is the restaurant NOT open?", "qvi": "Nhà hàng KHÔNG mở ngày nào?", "opts": [{"t": "Monday"}, {"t": "Tuesday"}, {"t": "Saturday"}, {"t": "Sunday"}], "ans": ["D"], "ex": "Giờ mở chỉ ghi thứ Hai–thứ Sáu và thứ Bảy → nghỉ Chủ nhật."}, {"n": 168, "q": "What is the address of the restaurant?", "qvi": "Địa chỉ nhà hàng là gì?", "opts": [{"t": "Jade Lion"}, {"t": "11:00 a.m. - 9:00 p.m."}, {"t": "56 West Sycamore Street"}, {"t": "Beside Eaton's"}], "ans": ["C"], "ex": "\"56 West Sycamore Street\". (D) chỉ là mô tả vị trí, không phải địa chỉ."}]}, {"title": "Part 7 · Câu 169–172", "tag": "1 văn bản", "passage": ["TOUR SCHEDULE", "6:00 a.m.    Get on bus in front of the Fairmont Hotel", "7:15 a.m.    Arrive in the city center", "7:30 – 8:30   Eat a traditional local breakfast prepared specially for our tour group by Fairmont’s world famous chefs", "9:00 – 11:30  Morning sightseeing includes stops at the Sarantis Art Museum, Herrera Street Craft Shops, and the Carolyn Botanical Gardens", "12:00 – 1:00    Buffet lunch at La Galleria de Niso", "1:00 – 5:00    Afternoon sightseeing includes more shopping and a tour of local clay-making workshops", "5:15 p.m.    Return to the bus", "6:30 p.m.  Arrive back at the Fairmont Hotel parking lot"], "qs": [{"n": 169, "q": "How long is the bus ride to the city?", "qvi": "Đi xe buýt vào thành phố mất bao lâu?", "opts": [{"t": "One fifteen"}, {"t": "One hour and fifteen minutes"}, {"t": "Six o'clock"}, {"t": "Seven hours and fifteen minutes"}], "ans": ["B"], "ex": "Lên xe 6:00, đến 7:15 → 1 tiếng 15 phút."}, {"n": 170, "q": "Where will they eat breakfast?", "qvi": "Họ ăn sáng ở đâu?", "opts": [{"t": "In the morning"}, {"t": "On the bus"}, {"t": "In the city"}, {"t": "At a workshop"}], "ans": ["C"], "ex": "Đến trung tâm 7:15 rồi ăn sáng 7:30 → trong thành phố."}, {"n": 171, "q": "When will they go sightseeing?", "qvi": "Khi nào họ đi tham quan?", "opts": [{"t": "In the morning and in the afternoon"}, {"t": "In the afternoon and in the evening"}, {"t": "In the morning and at night"}, {"t": "In the afternoon and at night"}], "ans": ["A"], "ex": "\"Morning sightseeing\" và \"Afternoon sightseeing\" → sáng và chiều."}, {"n": 172, "q": "How long will this tour last?", "qvi": "Tour kéo dài bao lâu?", "opts": [{"t": "Two days"}, {"t": "Six hours"}, {"t": "6:30 p.m."}, {"t": "Twelve and a half hours"}], "ans": ["D"], "ex": "6:00 sáng đến 6:30 tối → 12 tiếng rưỡi."}]}, {"title": "Part 7 · Câu 173–176", "tag": "1 văn bản", "passage": ["April 10th,", "Dear Harry,", "Our new house is so nice. We have been living here for two months. We have such a big living room and dining room. Upstairs, there are three bedrooms and two bathrooms. Behind the house, we have trees, a swimming pool, and a garden for growing vegetables. In the front, we have a beautiful flower garden. I hope that you will come to visit someday.", "Best wishes, Jack"], "qs": [{"n": 173, "q": "What is Jack writing about?", "qvi": "Jack viết về gì?", "opts": [{"t": "His new house"}, {"t": "His family"}, {"t": "His dog"}, {"t": "His friend"}], "ans": ["A"], "ex": "\"Our new house is so nice.\""}, {"n": 174, "q": "What is upstairs?", "qvi": "Trên lầu có gì?", "opts": [{"t": "The living room"}, {"t": "The kitchen"}, {"t": "The swimming pool"}, {"t": "Three bedrooms"}], "ans": ["D"], "ex": "\"Upstairs, there are three bedrooms\"."}, {"n": 175, "q": "What is in front of the house?", "qvi": "Phía trước nhà có gì?", "opts": [{"t": "A vegetable garden"}, {"t": "A flower garden"}, {"t": "A swimming pool"}, {"t": "Three bathrooms"}], "ans": ["B"], "ex": "\"In the front, we have a beautiful flower garden.\""}, {"n": 176, "q": "When did Jack move to his new house?", "qvi": "Jack chuyển đến nhà mới khi nào?", "opts": [{"t": "In two months"}, {"t": "Recently"}, {"t": "In April"}, {"t": "In February"}], "ans": ["D"], "ex": "Thư viết 10/4, đã sống ở đó 2 tháng → chuyển đến khoảng tháng 2."}]}, {"title": "Part 7 · Câu 177–180", "tag": "1 văn bản", "passage": ["King’s Department Store", "Attention: Valued Customers", "We’re moving to our new, more luxurious downtown location next month! To avoid the high costs of moving our products, we’re having a SPECIAL SALE!", "5th Floor: All books and toys are 60% off.", "4th Floor: Furniture, tools, and hardware at up to 70% off.", "3rd Floor: Women’s and girls’ clothing at 40% off (excluding swimwear).", "2nd Floor: Men’s and boys’ clothing at 40% off (excluding swimwear).", "1st Floor: Up to 75% off all canned and dry goods in the supermarket."], "qs": [{"n": 177, "q": "Where can you buy a sofa?", "qvi": "Mua ghế sofa ở đâu?", "opts": [{"t": "On the fourth floor"}, {"t": "On the fifth floor"}, {"t": "On the first floor"}, {"t": "On the second floor"}], "ans": ["A"], "ex": "Sofa = furniture → tầng 4."}, {"n": 178, "q": "Where should Peter and his father go to buy new clothes?", "qvi": "Peter và bố mua quần áo ở đâu?", "opts": [{"t": "To the fifth floor"}, {"t": "To the fourth floor"}, {"t": "To the third floor"}, {"t": "To the second floor"}], "ans": ["D"], "ex": "\"Men's and boys' clothing\" → tầng 2."}, {"n": 179, "q": "Where should Jack go to buy a new dictionary for English class?", "qvi": "Jack mua từ điển ở đâu?", "opts": [{"t": "To the fifth floor"}, {"t": "To the fourth floor"}, {"t": "To the third floor"}, {"t": "To the second floor"}], "ans": ["A"], "ex": "Từ điển = sách → \"5th Floor: All books\" → tầng 5."}, {"n": 180, "q": "Why is the store having a special sale?", "qvi": "Vì sao cửa hàng giảm giá đặc biệt?", "opts": [{"t": "The floors were rearranged."}, {"t": "The store will be relocating."}, {"t": "The store rooms are full."}, {"t": "It is closing down."}], "ans": ["B"], "ex": "\"We're moving to our new… location\" → chuyển địa điểm (relocating)."}]}, {"title": "Part 7 · Câu 181–185", "tag": "1 văn bản", "passage": ["REPORT CARD – Mary Smith", "English 11: **B** – Mary’s writing continues to improve.", "Math 11: **A** – Excellent work, Mary!", "Science 11: **C** – Mary needs to work much harder.", "Music 11: **A+** – It’s a pleasure to have Mary in my class!", "Art 11: **B** – Please practice more with oil paints.", "History 11: **B-** – A large improvement. Keep working!", "Phys. Ed. 11: **A-** – One of our top volleyball players!", "Spanish 11: **B+** – Mary speaks quite well.", "———", "Report card for Mary Smith", "I confirm I have read the above report card.", "Signed: S. R. Smith", "Comments:", "We are very happy to see Mary received an A for Math. She has really improved. Last time, she received a C. However, her English and Science results are disappointing. Her grades have dropped in these subjects. Do you think she needs extra science classes? We are worried that she won’t get into a good university when she graduates high school. She has only one more year to prepare for graduation.", "Please advise us.", "From", "Mary’s parents"], "qs": [{"n": 181, "q": "In which class did Mary get the highest grade?", "qvi": "Mary được điểm cao nhất môn nào?", "opts": [{"t": "English 11"}, {"t": "Math 11"}, {"t": "Science 11"}, {"t": "Music 11"}], "ans": ["D"], "ex": "Bảng điểm: Music 11 = A+ → cao nhất."}, {"n": 182, "q": "In which class did Mary get the lowest grade?", "qvi": "Điểm thấp nhất môn nào?", "opts": [{"t": "English 11"}, {"t": "Math 11"}, {"t": "Science 11"}, {"t": "Music 11"}], "ans": ["C"], "ex": "Science 11 = C → thấp nhất."}, {"n": 183, "q": "In which classes did Mary get the same grade?", "qvi": "Hai môn nào bằng điểm nhau?", "opts": [{"t": "English 11 and Math 11"}, {"t": "Math 11 and Science 11"}, {"t": "Music 11 and Art 11"}, {"t": "English 11 and Art 11"}], "ans": ["D"], "ex": "English 11 = B và Art 11 = B."}, {"n": 184, "q": "What do Mary's parents think about her Math 11 grade?", "qvi": "Bố mẹ nghĩ gì về điểm Toán?", "opts": [{"t": "It could be better."}, {"t": "It was better last year."}, {"t": "It is much better than last year."}, {"t": "It is terrible as always."}], "ans": ["C"], "ex": "\"received an A for Math… Last time, she received a C\" → tốt hơn nhiều so với trước."}, {"n": 185, "q": "Why are Mary's parents worried?", "qvi": "Vì sao bố mẹ lo?", "opts": [{"t": "They think she will not be accepted by a good university."}, {"t": "Mary doesn't want to go to a good university."}, {"t": "They don't have enough money for a good university."}, {"t": "They don't think Mary's teachers are very good."}], "ans": ["A"], "ex": "\"worried that she won't get into a good university\"."}]}, {"title": "Part 7 · Câu 186–190", "tag": "2 văn bản", "passage": ["FOR SALE", "A used living room set (sofa and two armchairs) made of the finest Corinthian leather. Only one year old and in perfect condition (no scratches or stains).", "I’m selling them because I’m moving overseas and can’t take them with me. $100 for the sofa and $50 for each chair, or $150 for the 3-piece set.", "Call Michael Clemons at 555-3871 or send a message to sofa4sale@yahu.com.", "———", "To: sofasale@yahu.com From: amburton@mynet.com", "Subject: Furniture for sale", "Date: May 22nd", "I am very interested in buying the sofa you advertised in the Daily Times yesterday.", "I have my own truck, so I could pick it up very easily. Could I come to see the sofa tomorrow evening, at around 7:30 p.m.? I look forward to hearing from you,", "Alex Burton"], "qs": [{"n": 186, "q": "How much will it cost to buy the sofa and two chairs together?", "qvi": "Mua sofa và 2 ghế cùng lúc giá bao nhiêu?", "opts": [{"t": "50 dollars"}, {"t": "100 dollars"}, {"t": "150 dollars"}, {"t": "200 dollars"}], "ans": ["C"], "ex": "\"$150 for the 3-piece set\"."}, {"n": 187, "q": "How can you contact the seller?", "qvi": "Liên hệ người bán bằng cách nào?", "opts": [{"t": "Only by telephone"}, {"t": "Only by email"}, {"t": "By email and telephone"}, {"t": "By telephone and fax"}], "ans": ["C"], "ex": "\"Call… or send a message to sofa4sale@…\" → điện thoại và email."}, {"n": 188, "q": "Where did Michael Clemons place this advertisement?", "qvi": "Michael đăng quảng cáo ở đâu?", "opts": [{"t": "On the Internet"}, {"t": "In a daily newspaper"}, {"t": "In a weekly magazine"}, {"t": "On TV"}], "ans": ["B"], "ex": "Email của Alex: \"the sofa you advertised in the Daily Times\" → báo ngày (câu kết hợp 2 bài)."}, {"n": 189, "q": "What does Alex Burton want to buy?", "qvi": "Alex muốn mua gì?", "opts": [{"t": "All of the items"}, {"t": "One chair"}, {"t": "Two chairs"}, {"t": "Just the sofa"}], "ans": ["D"], "ex": "\"interested in buying the sofa\" → chỉ cái sofa."}, {"n": 190, "q": "How will Alex Burton get his furniture home?", "qvi": "Alex chở đồ về bằng gì?", "opts": [{"t": "Michael Clemons will deliver them."}, {"t": "He will use his truck."}, {"t": "He will use a delivery company."}, {"t": "He can't take them home, so he decides to buy nothing."}], "ans": ["B"], "ex": "\"I have my own truck\" → dùng xe tải của mình."}]}, {"title": "Part 7 · Câu 191–195", "tag": "2 văn bản", "passage": ["Date: Wed, 27 August, 18:41:50", "From: Brittany Clark brclark@abcmail.com", "Subject: English Class", "Jennifer,", "I couldn’t make it to English class yesterday because I had a very bad stomachache. I think I ate some bad food on Sunday! I’m feeling much better now, though. Could you please tell me what the homework for tomorrow is? I read the next three acts in Hamlet, but I’m not sure if Mrs. Smart gave us more work or not. Thanks!", "Your friend,", "Brittany", "———", "To: brclark@abcmail.com", "From: jennie@mailynet.com", "Re: English class", "Hi Brittany,", "I hope you are feeling better. We didn’t have any homework, so you don’t have to worry. We didn’t finish discussing the three acts last time. We are going to talk about them in the morning.", "See you tomorrow.", "Jennifer"], "qs": [{"n": 191, "q": "Why did Brittany miss English class yesterday?", "qvi": "Vì sao Brittany nghỉ học?", "opts": [{"t": "She was busy."}, {"t": "She was sick."}, {"t": "She forgot."}, {"t": "She didn't do her homework."}], "ans": ["B"], "ex": "\"had a very bad stomachache\" → bị ốm."}, {"n": 192, "q": "What will Brittany and Jennifer do in English class tomorrow?", "qvi": "Ngày mai họ làm gì trong lớp?", "opts": [{"t": "Homework"}, {"t": "Read a play"}, {"t": "Discuss a play"}, {"t": "Write an essay"}], "ans": ["C"], "ex": "\"We didn't finish discussing the three acts… talk about them\" → thảo luận vở kịch (Hamlet)."}, {"n": 193, "q": "Who is Jennifer?", "qvi": "Jennifer là ai?", "opts": [{"t": "A student in Brittany's English class"}, {"t": "Brittany's mother"}, {"t": "Brittany's sister"}, {"t": "Brittany's teacher"}], "ans": ["A"], "ex": "Brittany ký \"Your friend\" và hỏi bài tập lớp tiếng Anh → bạn cùng lớp."}, {"n": 194, "q": "Who is Mrs. Smart?", "qvi": "Mrs. Smart là ai?", "opts": [{"t": "Brittany's mother"}, {"t": "Jennifer's mother"}, {"t": "Brittany and Jennifer's homeroom teacher"}, {"t": "Brittany and Jennifer's English teacher"}], "ans": ["D"], "ex": "\"not sure if Mrs. Smart gave us more work\" (lớp tiếng Anh) → giáo viên tiếng Anh."}, {"n": 195, "q": "Which of the following is NOT true?", "qvi": "Câu nào KHÔNG đúng?", "opts": [{"t": "Brittany was absent yesterday."}, {"t": "Jennifer attended the English class yesterday."}, {"t": "There is a lot of homework for the next class."}, {"t": "Brittany ate something bad."}], "ans": ["C"], "ex": "Jennifer viết \"We didn't have any homework\" → (C) sai."}]}, {"title": "Part 7 · Câu 196–200", "tag": "2 văn bản", "passage": ["HELP WANTED", "Giorgio’s World Famous Pizza House is now hiring people for the following positions:", "• Cook (Two openings — experience required)", "• Waiter (Four openings — experience preferred)", "• Cashier (One opening — willing to train the right high school graduate)", "• Dishwasher (One opening — must be physically fit)", "Giorgio’s offers good salaries and a very nice benefits package.", "To apply, please bring your resume to the restaurant and ask to speak to the manager,", "Ms. Elissa Haggio.", "———", "Dear Ms. Haggio,", "I am very interested in your job advertisement. I am a cook with over ten years’", "experience. I worked at Sandro’s Spaghetti House for three years. I then worked at Pizza Amore for seven years. I am a very hardworking person and would like to work at Giorgio’s. I often visit your restaurant and am always impressed by the food there. I hope to hear from you.", "Sincerely,", "Mike Di Beni"], "qs": [{"n": 196, "q": "Who is this advertisement for?", "qvi": "Quảng cáo dành cho ai?", "opts": [{"t": "People who like Italian food"}, {"t": "People named Giorgio"}, {"t": "People who have worked in restaurants before"}, {"t": "People who have never worked in restaurants before"}], "ans": ["C"], "ex": "Bếp cần kinh nghiệm, phục vụ ưu tiên kinh nghiệm → người từng làm nhà hàng."}, {"n": 197, "q": "How many people does the restaurant want to hire?", "qvi": "Nhà hàng muốn tuyển mấy người?", "opts": [{"t": "Four"}, {"t": "Six"}, {"t": "Eight"}, {"t": "Ten"}], "ans": ["C"], "ex": "2 bếp + 4 phục vụ + 1 thu ngân + 1 rửa bát = 8."}, {"n": 198, "q": "For which position is the restaurant not hiring?", "qvi": "Nhà hàng KHÔNG tuyển vị trí nào?", "opts": [{"t": "Manager"}, {"t": "Cook"}, {"t": "Dishwasher"}, {"t": "Waiter"}], "ans": ["A"], "ex": "Manager (Ms. Haggio) là người nhận hồ sơ, không phải vị trí tuyển."}, {"n": 199, "q": "How long has Mike Di Beni worked as a cook?", "qvi": "Mike làm đầu bếp bao lâu?", "opts": [{"t": "Three years"}, {"t": "Seven years"}, {"t": "Ten years"}, {"t": "One week"}], "ans": ["C"], "ex": "\"a cook with over ten years' experience\" (3 + 7 năm)."}, {"n": 200, "q": "Which of the following is NOT true?", "qvi": "Câu nào KHÔNG đúng?", "opts": [{"t": "Mike Di Beni wants to work at Giorgio's Pizza House."}, {"t": "Mike used to work at Sandro's Spaghetti House."}, {"t": "Mike wants to be manager at Giorgio's Pizza House."}, {"t": "Pay is good at Giorgio's Pizza House."}], "ans": ["C"], "ex": "Mike ứng tuyển làm cook, không phải manager → (C) sai."}]}], "recap": "<h2>Ghi nhớ sau bài</h2><p>Làm lại các câu sai sau 2–3 ngày. Với Part 3, 4, 7: chép cặp \"câu trong bài → câu trong đáp án\" vào vở để quen cách đề nói lại ý bằng từ khác.</p>"};</script>
