er in person"}, {"t": "Attend the class on the first day"}], "ans": ["C"], "ex": "\"contact Bianca Mona… or stop by 128 Zankel Building\" → đến trung tâm trực tiếp. Liên hệ Bianca chứ không phải giáo viên (A)."}]}, {"title": "Part 7 · Câu 160–162", "tag": "1 văn bản", "passage": ["Ms. Carol Lambert Coby Electronics P.O. Box 2 Framingham, MA 01702 October 27, 2007", "Dear Ms. Lambert,", "On October 10, 2007, I purchased a Coby 135 MP3 player from your Helena, Montana dealership. After only two weeks of use, the device started to show significant problems with downloading music from the Internet. I made a complaint to the branch manager, but he told me to contact the manufacturer instead.", "According to my product warranty, however, the seller is fully responsible for any defects up to 60 days after the purchase of the item. It also states that a customer is eligible for a full refund or replacement with a new product in such a case. As I purchased the product at a Coby's branch, my contract was made with Coby Electronics, not with the manufacturer.", "On top of that, since the Helena branch manager was inappropriately impolite in dealing with my issues, I have no intention to get a replacement. Therefore, I am requesting a full refund of the purchase immediately. Additionally, please confirm that you have received this letter as soon as possible.", "Yours faithfully,", "Mike Hermanson"], "qs": [{"n": 160, "q": "What is the primary purpose of the letter?", "qvi": "Mục đích chính của thư là gì?", "opts": [{"t": "To request some repairs"}, {"t": "To renew a contract"}, {"t": "To ask for a refund"}, {"t": "To request a replacement"}], "ans": ["C"], "ex": "\"I am requesting a full refund\" → xin hoàn tiền. Anh nói rõ không muốn đổi sản phẩm (D)."}, {"n": 161, "q": "Where does Mike Hermanson insist he get a refund from?", "qvi": "Mike đòi hoàn tiền từ đâu?", "opts": [{"t": "Coby Electronics"}, {"t": "The shop manager"}, {"t": "Coby's Helena branch"}, {"t": "The manufacturer"}], "ans": ["A"], "ex": "\"my contract was made with Coby Electronics, not with the manufacturer\"."}, {"n": 162, "q": "According to the letter, where does Carol Lambert probably work?", "qvi": "Carol Lambert có lẽ làm ở đâu?", "opts": [{"t": "At Coby's Helena, Montana branch"}, {"t": "At the manufacturer of Coby products"}, {"t": "At a department store in Montana"}, {"t": "At the main office of Coby Electronics"}], "ans": ["D"], "ex": "Thư gửi Coby Electronics, P.O. Box ở Framingham, khiếu nại về chi nhánh Helena → văn phòng chính của Coby."}]}, {"title": "Part 7 · Câu 163–166", "tag": "1 văn bản", "passage": ["Dear Museum Colleagues;", "To celebrate Colorado Museum Month, we are devoting ourselves to promoting the unique services and programs that we provide for our communities and their residents in Colorado. The primary goal of this year's Colorado Museum Month is to raise public awareness of museums' roles to a community. We are seeking support especially from the media, and even from politicians in the state. Our museums, located throughout Colorado, attract an increasing number of visitors from all around the country each year by constantly paying attention to high-quality artistic works. In addition, we make available learning experiences for people all ages.", "In order to make this special event more effective, we ask for your support & participation.", "Please take the following two steps that will help bring favorable publicity to our communities in Colorado:", "• Invite more than one Colorado state official to your institution and ask for each person's", "opinion about how to better meet the needs of museum visitors.", "• Write a letter to a newspaper, television station, or a radio station in your community to", "promote your institution.", "Ready-made templates are also available on the Web. Please participate and make Colorado a more culturally rich place. With your support, we can make a difference."], "qs": [{"n": 163, "q": "What is the main purpose of the notice?", "qvi": "Mục đích chính của thông báo là gì?", "opts": [{"t": "To request donations"}, {"t": "To ask for assistance"}, {"t": "To announce a media release"}, {"t": "To communicate with legislators"}], "ans": ["B"], "ex": "\"we ask for your support & participation\" → nhờ hỗ trợ."}, {"n": 164, "q": "What is the primary focus of Colorado Museum Month?", "qvi": "Trọng tâm của Tháng Bảo tàng Colorado là gì?", "opts": [{"t": "To attract more visitors from all over the country"}, {"t": "To assist in collecting fund from Colorado residents"}, {"t": "To save time creating templates and resources"}, {"t": "To spread the value and importance of Colorado's museums"}], "ans": ["D"], "ex": "\"raise public awareness of museums' roles\" → lan tỏa giá trị của bảo tàng."}, {"n": 165, "q": "For whom is this notice most likely intended?", "qvi": "Thông báo gửi cho ai?", "opts": [{"t": "State politicians"}, {"t": "Museum visitors"}, {"t": "Museums in Colorado"}, {"t": "Newspaper editors"}], "ans": ["C"], "ex": "\"Dear Museum Colleagues\", \"invite… to your institution\" → các bảo tàng ở Colorado."}, {"n": 166, "q": "How many steps are suggested as a way to make the event successful?", "qvi": "Có bao nhiêu bước được đề xuất?", "opts": [{"t": "1"}, {"t": "2"}, {"t": "3"}, {"t": "4"}], "ans": ["B"], "ex": "\"take the following two steps\"."}]}, {"title": "Part 7 · Câu 167–169", "tag": "1 văn bản", "passage": ["Dear Valued Customer:", "As a token of our appreciation for being a dedicated customer of Party All, Inc., we would like to invite you to our Preferred Customer Spring Extravaganza this coming Sunday.", "Sunday's sales event is by invitation only. All of our stock, including pajamas and bedding, will be marked down 50-70%: Doors open at 10:00 AM sharp. Complimentary coffee and donuts will be served. Public admission will commence at noon. In addition, please accept the enclosed $20 gift certificate to use with your purchase of $80 or more.", "We look forward to seeing you at Party All on Sunday. Please bring this invitation with you and present it at the door.", "Sincerely,", "Monika Waring", "Store Manager", "*AII sales are final. No exchanges.", "Enclosure: Gift Certificate #2008-1022 (not redeemable for cash)"], "qs": [{"n": 167, "q": "What kind of business is Party All, Inc.?", "qvi": "Party All là loại hình kinh doanh gì?", "opts": [{"t": "A party planner"}, {"t": "A coffee shop"}, {"t": "A bedding store"}, {"t": "A donut store"}], "ans": ["C"], "ex": "\"All of our stock, including pajamas and bedding\" → cửa hàng chăn ga, đồ ngủ."}, {"n": 168, "q": "What is NOT mentioned about the event?", "qvi": "Điều nào KHÔNG được nhắc về sự kiện?", "opts": [{"t": "People without the invitation may come."}, {"t": "It will start at 10 on Sunday morning."}, {"t": "There will be free coffee and snacks."}, {"t": "Products are discounted up to 70%."}], "ans": ["A"], "ex": "\"by invitation only\" → người không có thiệp KHÔNG được vào (giờ sáng). Bài có nói 10 giờ, cà phê miễn phí, giảm đến 70%."}, {"n": 169, "q": "How much should a customer spend to receive an additional discount with the gift certificate?", "qvi": "Phải mua bao nhiêu để dùng phiếu quà tặng?", "opts": [{"t": "$20"}, {"t": "$50"}, {"t": "$70"}, {"t": "$80"}], "ans": ["D"], "ex": "\"$20 gift certificate to use with your purchase of $80 or more\"."}]}, {"title": "Part 7 · Câu 170–174", "tag": "1 văn bản", "passage": ["You are cordially invited to join an Ankel Job Fair!", "Familiarize yourself with Ankel Technology Development (ATD) by attending the upcoming job fair being held from February 10 to April 2, 2008, at Grand Central Suite, 3012 West Ave., San Francisco. Talk with Miguel Gonzalez, a senior programmer, concerning your future career.", "Headquartered in Brazil in South America, ATD was established by Ankel USA in conjunction with Brazil's local government in 2006. This was mainly motivated by the region's emerging market opportunities in the fields of information technology and software development. In recognition of ATD 's significant growth last year, we are currently seeking full-time employees for our Brazil headquarters in Itatim, BA.", "Headquartered in Brazil in South America, ATD was established by Ankel USA in conjunction with Brazil's local government in 2006. This was mainly motivated by the region's emerging market opportunities in the fields of information technology and software development. In recognition of ATD 's significant growth last year, we are currently seeking full-time employees for our Brazil headquarters in Itatim, BA.", "Candidates should possess a Master's or a higher degree with a specialization in Information Technology, Computer Science, or Computer Programming. English is the working language, but speaking Portuguese is a plus. Brazilian nationals are preferred, but any applicant who meets the academic qualifications is welcome.", "If you are interested in applying, you can submit your resume either electronically at", "www.ankeljobfair.com or in person at the upcoming Ankel Job Fair.", "We are looking forward to having many enthusiastic participants.", "Regards, Miguel Cilia Ankel Corporation"], "qs": [{"n": 170, "q": "Where will the job fair be held?", "qvi": "Hội chợ việc làm tổ chức ở đâu?", "opts": [{"t": "South America"}, {"t": "Brazil"}, {"t": "Itatim, BA"}, {"t": "San Francisco"}], "ans": ["D"], "ex": "\"at Grand Central Suite… San Francisco\". Brazil là nơi làm việc, không phải nơi tổ chức."}, {"n": 171, "q": "In which field is Ankel Technology Development offering jobs?", "qvi": "ATD tuyển việc trong lĩnh vực nào?", "opts": [{"t": "Sales"}, {"t": "Recruiting"}, {"t": "Computers"}, {"t": "Architecture"}], "ans": ["C"], "ex": "Information Technology, Computer Science, Programming → máy tính."}, {"n": 172, "q": "The word \"emerging\" in paragraph 2, line 2 is closest in meaning to", "qvi": "Từ \"emerging\" gần nghĩa nhất với", "opts": [{"t": "reliable"}, {"t": "promising"}, {"t": "declining"}, {"t": "accessible"}], "ans": ["B"], "ex": "emerging market = thị trường mới nổi, đầy tiềm năng → promising."}, {"n": 173, "q": "What is a requirement for this job?", "qvi": "Yêu cầu của công việc là gì?", "opts": [{"t": "A Master's degree"}, {"t": "Brazilian citizenship"}, {"t": "An aggressive personality"}, {"t": "Knowledge about South America"}], "ans": ["A"], "ex": "\"possess a Master's or a higher degree\". Người Brazil chỉ được ưu tiên (preferred), không bắt buộc."}, {"n": 174, "q": "How may one apply for the position?", "qvi": "Ứng tuyển bằng cách nào?", "opts": [{"t": "By mail"}, {"t": "By fax"}, {"t": "Online"}, {"t": "On the phone"}], "ans": ["C"], "ex": "\"submit your resume either electronically at www… or in person\" → online."}]}, {"title": "Part 7 · Câu 175–177", "tag": "1 văn bản", "passage": ["Hays Marketing, Inc. Merging with MarketingExperts, Inc.", "Hays Marketing, Inc. announced last week that its expertise in marketing data processing will be merged with marketing publications created by MarketingExperts, Inc. The two companies are among the most prosperous marketing research firms nationwide. Dr. Ethan McCaskey, vice president of Hays Marketing, states that the two firms will function independently but will be able to offer marketing professionals useful research data and practical training. He also adds that the merger will enable them to take advantage of the best employees from both companies. For the last few years, the two research firms have been separately devising innovative methods to enhance their services. Now that they share the same objective - to discover what works in marketing - they are hoping better to serve their clientele with the merger."], "qs": [{"n": 175, "q": "According to the article, why has Hays Marketing merged with MarketingExperts?", "qvi": "Vì sao Hays Marketing sáp nhập với MarketingExperts?", "opts": [{"t": "It will be able to provide better service to its customers."}, {"t": "80th companies have recently experienced lower sales."}, {"t": "Hays Marketing hopes to create some marketing publications."}, {"t": "The merger will result in more subscribers worldwide."}], "ans": ["A"], "ex": "\"hoping better to serve their clientele\" → phục vụ khách hàng tốt hơn."}, {"n": 176, "q": "What is true about MarketingExperts?", "qvi": "Điều nào đúng về MarketingExperts?", "opts": [{"t": "It conducts real-time marketing experiments."}, {"t": "It publishes studies and data in marketing."}, {"t": "It has recently separated from a research firm."}, {"t": "It has a different objective than Hays Marketing."}], "ans": ["B"], "ex": "\"marketing publications created by MarketingExperts\" → xuất bản nghiên cứu về marketing."}, {"n": 177, "q": "According to the vice president of Hays Marketing,what will the acquisition result in?", "qvi": "Theo phó chủ tịch, việc sáp nhập sẽ mang lại gì?", "opts": [{"t": "It will increase the number of subscribers up to 300,000."}, {"t": "It will provide data analysts with professional jobs."}, {"t": "It will establish another professional research company."}, {"t": "It will offer professionals useful data and training."}], "ans": ["D"], "ex": "\"offer marketing professionals useful research data and practical training\"."}]}, {"title": "Part 7 · Câu 178–180", "tag": "1 văn bản", "passage": ["Offering you the best in real estate services", "Thanks for visiting our website. Whether you are a buyer or a seller, you can take advantage of our comprehensive resources that will fulfill your real estate requirements. Our services include transaction tips, relocation assistance, and mortgage information. In a world of technology and the Internet, you can often get lost in an excessive amount of online resources, So you will need personalized help from our experts. Furthermore, effective communication is the key to our success in working with our valued customers. We provide all the information and services you need for your real estate transactions. We help you find the right apartment in the right community. We get you information on facilities and schools in the neighborhood of your choice. We even provide you with such small details as restaurants and grocers. The only concern we have is to make your buying and selling process a pleasant experience. Please click our \"Buying-Selling Guide\" section for more specific information."], "qs": [{"n": 178, "q": "For whom is the advertisement most likely intended?", "qvi": "Quảng cáo dành cho ai?", "opts": [{"t": "Expert movers"}, {"t": "Website managers"}, {"t": "Service attendants"}, {"t": "Prospective home owners"}], "ans": ["D"], "ex": "Dịch vụ mua bán nhà, tìm căn hộ → người sắp mua nhà."}, {"n": 179, "q": "What does the company NOT provide?", "qvi": "Công ty KHÔNG cung cấp gì?", "opts": [{"t": "Assistance in moving"}, {"t": "Information on bank loans"}, {"t": "Advice on home transactions"}, {"t": "Help on renovation processes"}], "ans": ["D"], "ex": "Có: mẹo giao dịch, hỗ trợ chuyển nhà, thông tin vay. Không nói đến sửa chữa nhà (renovation)."}, {"n": 180, "q": "What should one do to get details about the communities?", "qvi": "Muốn biết chi tiết về khu dân cư thì làm gì?", "opts": [{"t": "Access a specific link"}, {"t": "Visit the real estate agency"}, {"t": "Find some advanced technology"}, {"t": "Search for other websites"}], "ans": ["A"], "ex": "\"click our 'Buying-Selling Guide' section\" → bấm vào một mục/đường link."}]}, {"title": "Part 7 · Câu 181–185", "tag": "2 văn bản", "passage": ["E-MAIL", "To: Edmont Apartments", "From: Jean Chase", "Date: April 26, 2007", "Re: Apartment Rent", "To Edmont Apartments,", "I will be relocating to the Edmont area in Canada in July, and am now looking for a studio or one-bedroom apartment. I will be working at Sun Engineering in the Edmont downtown area and wish to get an apartment nearby. As I will not have a car and will rely on public transportation, I am interested in what is available in the vicinity. Could you please reply to me with the appropriate information? I am planning a visit to Edmont in May and would like to schedule an appointment for viewing some places. Please send me the relevant information via e-mail or fax at 208-447-3056.", "Sincerely, Jean", "———", "ADVERTISEMENT (trích)", "[…] Glenwood Court : Recently renovated studio. Perfect for those who need to stay close to Edmont's downtown area. Looking for a nice home on a budget? Then, this is for you! Rent is $650 a month. […]", "[…] Grand Washington", "Sparkling clean two-bedroom condominium. Close to bus stops! Near all amenities! Lovely Washington Square location! Professionally Managed! Pet friendly. Heat and water included. A perfect place for a starting family! Prices start at $1200 a month. […]", "[…] To learn more about how to post your Edrnont rental, please visit our website at", "www.Edmontapartments.com, call us at 337-309-4422, or fax your questions to 337-309 4423.[…]"], "qs": [{"n": 181, "q": "What is Ms. Chase most concerned about?", "qvi": "Cô Chase quan tâm nhất điều gì?", "opts": [{"t": "The price of the apartments"}, {"t": "The location of the apartments"}, {"t": "The size of the apartments"}, {"t": "The facilities in the apartments"}], "ans": ["B"], "ex": "Muốn ở gần nơi làm, không có xe, đi phương tiện công cộng → vị trí căn hộ."}, {"n": 182, "q": "Why is Ms. Chase moving?", "qvi": "Vì sao cô Chase chuyển đến?", "opts": [{"t": "She is starting a new job."}, {"t": "She will be a student at a university."}, {"t": "She plans to open a new business."}, {"t": "She wants to live near her family."}], "ans": ["A"], "ex": "\"I will be working at Sun Engineering\" → bắt đầu công việc mới."}, {"n": 183, "q": "What housing complex will Ms. Chase most likely be interested in?", "qvi": "Cô Chase có lẽ quan tâm khu nào?", "opts": [{"t": "Alberta Villas"}, {"t": "Parkview Lofts"}, {"t": "Glenwood Court"}, {"t": "Central Peak"}], "ans": ["C"], "ex": "Glenwood Court: studio, \"close to Edmont's downtown area\" → hợp nhu cầu (studio, gần trung tâm). (Câu kết hợp 2 bài.)"}, {"n": 184, "q": "What is NOT implied about the housing at Grand Washington?", "qvi": "Điều nào KHÔNG được ngụ ý về Grand Washington?", "opts": [{"t": "It is quiet."}, {"t": "It is convenient."}, {"t": "Pets are permitted."}, {"t": "Public transportation is available."}], "ans": ["A"], "ex": "Quảng cáo nói gần xe buýt, gần tiện ích, cho nuôi thú cưng. Không nói yên tĩnh (quiet)."}, {"n": 185, "q": "What is NOT mentioned as a method of contacting Edmont Apartments?", "qvi": "Cách nào KHÔNG được nêu để liên hệ Edmont Apartments?", "opts": [{"t": "Fax"}, {"t": "The Internet"}, {"t": "Telephone"}, {"t": "In person"}], "ans": ["D"], "ex": "Có website, điện thoại, fax. Không nói đến trực tiếp (in person)."}]}, {"title": "Part 7 · Câu 186–190", "tag": "2 văn bản", "passage": ["MEMO", "[…] Thank you for attending today’s meeting. This memo is to confirm our agreement on the media release scheduled to be made public at 10 AM tomorrow morning. The press release will basically announce the resignation of Richard Heather, our Chief Financial Officer, and the appointment of an interim CFO, Kelly Anderson. We reached a consensus over not mentioning Mr. Heather's reasons for resigning from his position. For further questions, contact Ms. Heidi Caldwell, Human Resources Manager. We appreciate your support and cooperation.", "Andrew Dias", "CEO, HealthyDiets.com", "———", "PRESS RELEASE (trích)", "HealthyDiets.com Announces Resignation of Richard Heather, Chief Financial Officer", "[…]", "CEO Andrew Dias said, \"We are sincerely grateful for Richard's outstanding contributions and genuine commitment to HealthyDiets.com over the past decade. Although we regret losing such a valuable asset as Richard, we wish him well in his future career.\" […]", "[…] HealthyDiets.com has appointed Kelly Anderson, who currently supervises the Accounting Department, as the provisional CFO until a final decision about the new CFO is made. Ms. Anderson, who started her career in accounting at Fortune Auditing, Inc. in 1995,joined HeaithyDiets.com in May 1999. […]", "[…]", "A brief history of Mr. Heather's work experience and achievements is provided on our website, www.HealthyDiets.com/heather.[…]"], "qs": [{"n": 186, "q": "What is the Andrew Dias' memorandum mainly about?", "qvi": "Bản ghi nhớ của Andrew Dias chủ yếu về gì?", "opts": [{"t": "To announce the appointment of an executive"}, {"t": "To inform employees of an upcoming press release"}, {"t": "To request that employees attend a meeting"}, {"t": "To elicit support and cooperation from employees"}], "ans": ["B"], "ex": "\"This memo is to confirm our agreement on the media release\" → báo cho nhân viên về thông cáo báo chí sắp đăng."}, {"n": 187, "q": "To whom should employees address follow-up questions?", "qvi": "Nhân viên hỏi thêm thì hỏi ai?", "opts": [{"t": "Andrew Olas"}, {"t": "Richard Heather"}, {"t": "Heidi Caldwell"}, {"t": "Kelly Anderson"}], "ans": ["C"], "ex": "\"For further questions, contact Ms. Heidi Caldwell\"."}, {"n": 188, "q": "What is NOT stated about Kelly Anderson?", "qvi": "Điều nào KHÔNG được nêu về Kelly Anderson?", "opts": [{"t": "She will resign this month."}, {"t": "She joined HealthyDiets.com in 1999."}, {"t": "She was last employed at Fortune Auditing, Inc."}, {"t": "She will be a temporary replacement for Mr. Heather."}], "ans": ["A"], "ex": "Người từ chức là Richard Heather, không phải Kelly → (A) sai. Kelly vào công ty 1999, từng làm ở Fortune Auditing, là CFO tạm thời."}, {"n": 189, "q": "In the press release, \"outstanding\" in paragraph 3, line 1 is closest in meaning to", "qvi": "Từ \"outstanding\" gần nghĩa nhất với", "opts": [{"t": "worthless"}, {"t": "reliable"}, {"t": "excellent"}, {"t": "irrelevant"}], "ans": ["C"], "ex": "outstanding contributions = đóng góp xuất sắc → excellent."}, {"n": 190, "q": "According to the press release, what can be found on the company's website?", "qvi": "Trên website công ty có gì?", "opts": [{"t": "News of future company projects"}, {"t": "Details of the latest financial market"}, {"t": "Reports on the company's profits"}, {"t": "Information about Richard Heather"}], "ans": ["D"], "ex": "\"A brief history of Mr. Heather's work experience… is provided on our website\"."}]}, {"title": "Part 7 · Câu 191–195", "tag": "2 văn bản", "passage": ["EMAIL 1", "[…]", "Hi all.", "First, let me apologize for the fact that the “Intro to Java\" course was cancelled. There were simply too few people signed up for the course. I also want to apologize for the manner in which the Continuing Education Department handled some of the logistics surrounding the course registration and refunds. The department is overwhelmed by work and continually short-staffed. Again, my apologies. Although the course has been cancelled, you can still learn Java. I propose that you participate in small group tutoring classes during the summer beginning next week.[…]", "[…] Details follow:", "• Number of sessions: 8 (8 weeks)", "• Time, 6:00-8:00 p.m.", "• Dates, Monday. June 18 - Monday. 13 August (We will skip the first week in August.)", "• Cost: $ 30 per session", "• Payment: $ 240 in cash check or money order payable on first day of class.", "———", "EMAIL 2", "Date: Tuesday, June 12, 2007, 15:22:00", "Subject: Re: \"Intro to Java\" cancellation and tutoring alternative", "From: Angela Wong", "To: Louis Vanegas", "Dear Mr. Vanegas, Thanks for the information. I would like to know if I could only attend the first four sessions since I have to be away for about a month. After I was notified of the cancellation this Monday. I made all my travel arrangements, including my flight ticket. Please let me know if you will allow me to do this. I would really appreciate your prompt reply. Thank you.", "Best. Angela Wong"], "qs": [{"n": 191, "q": "Why has the course been cancelled?", "qvi": "Vì sao khóa học bị hủy?", "opts": [{"t": "The department is overwhelmed and short-staffed."}, {"t": "There was an insufficient number of enrollees."}, {"t": "Mr. Vanegas does not want to teach a large group."}, {"t": "The Continuing Education Department lacks adequate space."}], "ans": ["B"], "ex": "\"There were simply too few people signed up\" → không đủ người đăng ký. (A) là lý do phòng ban xử lý chậm, không phải lý do hủy lớp."}, {"n": 192, "q": "For whom is Mr. Vanegas' e-mail intended?", "qvi": "Email của ông Vanegas gửi cho ai?", "opts": [{"t": "Members in the logistics team"}, {"t": "Continuing Education Department staff"}, {"t": "Building security staff members at Tisch School"}, {"t": "Those who enrolled in the Java course"}], "ans": ["D"], "ex": "Xin lỗi vì khóa \"Intro to Java\" bị hủy và chuyện hoàn tiền → những người đã đăng ký khóa Java."}, {"n": 193, "q": "What has Louis Vanegas suggested as an alternative to the course?", "qvi": "Ông Vanegas gợi ý gì thay cho khóa học?", "opts": [{"t": "Attend some small-group tutoring sessions"}, {"t": "Recommend another course"}, {"t": "Wait until the end of the summer"}, {"t": "Talk to the Continuing Education Department"}], "ans": ["A"], "ex": "\"participate in small group tutoring classes\"."}, {"n": 194, "q": "Why did Angela Wong write her e-mail?", "qvi": "Vì sao Angela Wong viết email?", "opts": [{"t": "To complain about the course cancellation"}, {"t": "To inquire about the course schedule"}, {"t": "To express her thanks for the course details"}, {"t": "To arrange her flight ticket"}], "ans": ["B"], "ex": "\"I would like to know if I could only attend the first four sessions\" → hỏi về lịch học."}, {"n": 195, "q": "How much will Ms. Wong pay for the course if Mr. Vanegas accepts her request?", "qvi": "Cô Wong trả bao nhiêu nếu được đồng ý?", "opts": [{"t": "$30"}, {"t": "$60"}, {"t": "$120"}, {"t": "$240"}], "ans": ["C"], "ex": "Học 4 buổi × $30/buổi = $120. (Câu kết hợp 2 email.)"}]}, {"title": "Part 7 · Câu 196–200", "tag": "2 văn bản", "passage": ["LETTER", "Dear Ms. Hopkins,", "On November 5-7, 2007, the Georgia Information Technology Committee will host the 21st annual Georgia Technology Conference (GTC) at the International Convention Center in Atlanta. Technology leaders will have a valuable opportunity to socialize and discuss various matters in a smaller forum and to participate in sessions designed to meet their needs. The following exhibits will provide technology leaders with the chance to broaden their knowledge of the latest trends in computer technology. Representatives from companies in the field of information technology are willing to answer questions, perform demonstrations. and assist participants in finding solutions tailored to their businesses. […] Mark your calendars and plan now for the 21st annual Georgia Technology Conference. […]", "[…] GTC 2007 is proud to have more than 150 presentations, ranging from nationally prominent speakers to workshops aimed at any of the concerns of technology leaders. The exhibit hall at GTC will include over 250 vendors who will display the most recent hardware and software products. […]", "———", "EMAIL", "[…] Dear Ms. Patrick,", "Thank you for your letter informing us of your upcoming conference. Before registering to attend the conference, I would like to ask a few questions regarding booking a spat to display our books and multimedia products.", "Please let me know if there is a deadline for reserving a display section as well as any procedures we should follow in order to participate in your conference.", "Thank you. We look forward to another great conference following last year's.", "Nancy Hopkins", "Inside Tech. Publishing"], "qs": [{"n": 196, "q": "Why did Ms. Patrick write to Ms. Hopkins?", "qvi": "Vì sao bà Patrick viết thư cho bà Hopkins?", "opts": [{"t": "To inform her about a company"}, {"t": "To promote a conference"}, {"t": "To introduce new technology"}, {"t": "To ask her to make a presentation"}], "ans": ["B"], "ex": "Thư giới thiệu hội nghị công nghệ GTC, \"Mark your calendars\" → quảng bá
