<script>window.MT={"n": "pem3", "part": 0, "partName": "Full test", "sub": "Đề tổng hợp 200 câu · Part 1–7", "intro": "Trang này có <b>file nghe</b> và <b>chữa bài</b> đề luyện buổi <b>Exam Master 3</b> (giáo trình trang 215–253), đủ 7 phần như đề thi thật. <b>Cách học:</b> câu nghe thì bấm nghe → tự chọn (chữ đáp án Part 1, 2 được ẩn giống đề thật) → mở lời thoại xem dịch. Câu đọc thì chọn đáp án rồi xem vì sao đúng. Lưu ý: file nghe của sách không có hội thoại 62–70, các câu này các em đọc lời thoại để làm nha. Câu nào sai nhớ ghi vào <b>Error Log</b> để ôn trước <b>Progress Test 2</b>.", "stepsTitle": "Nhắc lại chiến lược từng Part", "steps": ["<b>Part 1:</b> nhìn tranh trước khi nghe: ai, ở đâu, đang làm gì. Tranh không người: chú ý vị trí đồ vật; \"is being + V3\" chỉ đúng khi có người đang làm.", "<b>Part 2:</b> nghe thật kỹ từ để hỏi đầu câu. Cẩn thận bẫy âm giống nhau (projector / project, form / firm, vacant / vacation).", "<b>Part 3, 4:</b> đọc trước 3 câu hỏi, gạch từ khoá; đáp án thường theo thứ tự lời nói và được nói lại bằng từ khác (lobby = foyer, goggles = glasses).", "<b>Part 5, 6:</b> nhìn 4 đáp án để biết câu hỏi về từ loại, thì, đại từ hay từ vựng → tìm dấu hiệu trong câu (than, ago, next month…). Câu điền câu ở Part 6: đọc câu trước và sau chỗ trống.", "<b>Part 7:</b> đọc câu hỏi trước, tìm từ khoá trong bài. Câu NOT: dò từng đáp án. Bài 2 văn bản: có câu phải ghép thông tin cả hai bài (183, 195)."], "groups": [{"title": "Part 1 · Câu 1", "tag": "Tả tranh", "audio": "../audio/pem3/q1.mp3", "imgs": ["img/pem3/p1-1.jpg"], "hideOpts": true, "qs": [{"n": 1, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "The man is looking at the screen.", "vi": "Người đàn ông đang nhìn màn hình."}, {"t": "The man is standing in the room.", "vi": "Người đàn ông đang đứng trong phòng."}, {"t": "The man is pinning his nametag on.", "vi": "Người đàn ông đang gắn bảng tên."}, {"t": "The man is putting on his tie.", "vi": "Người đàn ông đang thắt cà vạt."}], "ans": ["B"], "ex": "Thầy giáo đứng cạnh bục giảng trong phòng → standing in the room. Không có màn hình; (D) \"putting on\" là hành động đang mặc vào, trong khi anh ấy đã đeo cà vạt sẵn."}]}, {"title": "Part 1 · Câu 2", "tag": "Tả tranh", "audio": "../audio/pem3/q2.mp3", "imgs": ["img/pem3/p1-2.jpg"], "hideOpts": true, "qs": [{"n": 2, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "He is setting up a fence.", "vi": "Anh ấy đang dựng hàng rào."}, {"t": "He is walking down the mountain.", "vi": "Anh ấy đang đi xuống núi."}, {"t": "He is looking at the scenery.", "vi": "Anh ấy đang ngắm phong cảnh."}, {"t": "He has reached the mountaintop.", "vi": "Anh ấy đã lên tới đỉnh núi."}], "ans": ["C"], "ex": "Người đàn ông ngồi trên hàng rào nhìn ra núi đồi → looking at the scenery. (A) bẫy: có hàng rào nhưng anh không dựng nó."}]}, {"title": "Part 1 · Câu 3", "tag": "Tả tranh", "audio": "../audio/pem3/q3.mp3", "imgs": ["img/pem3/p1-3.jpg"], "hideOpts": true, "qs": [{"n": 3, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "The books are being stocked.", "vi": "Sách đang được xếp lên kệ."}, {"t": "The librarian is helping the man.", "vi": "Thủ thư đang giúp người đàn ông."}, {"t": "The shelves are filled with books.", "vi": "Các kệ đầy sách."}, {"t": "The tables are occupied at the moment.", "vi": "Các bàn lúc này đều có người ngồi."}], "ans": ["C"], "ex": "Tranh thư viện, kệ chất đầy sách → shelves are filled with books. Bàn đang trống nên (D) sai; \"are being stocked\" cần có người đang xếp."}]}, {"title": "Part 1 · Câu 4", "tag": "Tả tranh", "audio": "../audio/pem3/q4.mp3", "imgs": ["img/pem3/p1-4.jpg"], "hideOpts": true, "qs": [{"n": 4, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "Trees surround the bench.", "vi": "Cây cối bao quanh băng ghế."}, {"t": "The bench is available at the moment.", "vi": "Băng ghế lúc này đang trống."}, {"t": "There is a pile of leaves on the bench.", "vi": "Có một đống lá trên băng ghế."}, {"t": "The trees in the park are being chopped down.", "vi": "Cây trong công viên đang bị chặt."}], "ans": ["B"], "ex": "Không ai ngồi trên ghế → available (còn trống, ngồi được). Cây chỉ ở phía sau, không bao quanh ghế (A)."}]}, {"title": "Part 1 · Câu 5", "tag": "Tả tranh", "audio": "../audio/pem3/q5.mp3", "imgs": ["img/pem3/p1-5.jpg"], "hideOpts": true, "qs": [{"n": 5, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "One man is talking to the other.", "vi": "Một người đang nói chuyện với người kia."}, {"t": "One man is holding a book.", "vi": "Một người đang cầm sách."}, {"t": "The men are taking memos.", "vi": "Hai người đang ghi chú."}, {"t": "The men are moving the chairs.", "vi": "Hai người đang di chuyển ghế."}], "ans": ["B"], "ex": "Người đeo kính cầm cuốn sổ/sách → (B). Chỉ một người cầm bút nên (C) sai."}]}, {"title": "Part 1 · Câu 6", "tag": "Tả tranh", "audio": "../audio/pem3/q6.mp3", "imgs": ["img/pem3/p1-6.jpg"], "hideOpts": true, "qs": [{"n": 6, "q": "Chọn câu mô tả đúng nhất bức tranh.", "opts": [{"t": "Some boats are docked next to the pier.", "vi": "Vài chiếc thuyền đang neo cạnh cầu tàu."}, {"t": "The water is very rough today.", "vi": "Mặt nước hôm nay rất dữ dội."}, {"t": "Some boats are drifting out to sea.", "vi": "Vài chiếc thuyền đang trôi ra biển."}, {"t": "There is a man fishing from the boat.", "vi": "Có một người đang câu cá trên thuyền."}], "ans": ["A"], "ex": "Hai thuyền đậu hai bên cầu tàu → docked next to the pier. Mặt nước phẳng lặng, không có người."}]}, {"title": "Part 2 · Câu 7", "tag": "Hỏi – đáp", "audio": "../audio/pem3/q7.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "Why can't I take College Street?", "vi": "Sao tôi không đi đường College được?"}], "qs": [{"n": 7, "q": "", "opts": [{"t": "It's blocked off.", "vi": "Nó bị chặn rồi."}, {"t": "By bus.", "vi": "Bằng xe buýt."}, {"t": "Five miles.", "vi": "5 dặm."}], "ans": ["A"], "ex": "Why → lý do: đường bị chặn (blocked off)."}]}, {"title": "Part 2 · Câu 8", "tag": "Hỏi – đáp", "audio": "../audio/pem3/q8.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "The projector is not working again.", "vi": "Máy chiếu lại hỏng nữa rồi."}], "qs": [{"n": 8, "q": "", "opts": [{"t": "The project is going very well.", "vi": "Dự án đang tiến triển tốt."}, {"t": "That's twice already this week.", "vi": "Tuần này hỏng hai lần rồi đấy."}, {"t": "Yes, we will work late tonight.", "vi": "Vâng, tối nay chúng ta sẽ làm muộn."}], "ans": ["B"], "ex": "Câu phàn nàn → đáp lại cùng ý: lần thứ hai trong tuần. (A) bẫy âm projector / project."}]}, {"title": "Part 2 · Câu 9", "tag": "Hỏi – đáp", "audio": "../audio/pem3/q9.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "We sent the client our pamphlet, didn't we?", "vi": "Chúng ta đã gửi tờ quảng cáo cho khách rồi, đúng không?"}], "qs": [{"n": 9, "q": "", "opts": [{"t": "No, we didn't receive anything.", "vi": "Không, chúng tôi chưa nhận được gì."}, {"t": "Yes, a couple of days ago.", "vi": "Rồi, cách đây vài ngày."}, {"t": "All of our products are listed.", "vi": "Tất cả sản phẩm của chúng tôi đều có trong danh sách."}], "ans": ["B"], "ex": "Câu hỏi đuôi \"didn't we?\" → xác nhận Yes + thời điểm. (A) sai vai: người gửi chứ không phải người nhận."}]}, {"title": "Part 2 · Câu 10", "tag": "Hỏi – đáp", "audio": "../audio/pem3/q10.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "Do you want a copy of the schedule now, or can you wait until the convention?", "vi": "Anh muốn lấy lịch trình bây giờ hay chờ đến hội nghị?"}], "qs": [{"n": 10, "q": "", "opts": [{"t": "I'd like it now, please.", "vi": "Cho tôi bây giờ."}, {"t": "No, we need 300 copies of it.", "vi": "Không, chúng tôi cần 300 bản."}, {"t": "Yes, in the main conference room.", "vi": "Vâng, ở phòng họp chính."}], "ans": ["A"], "ex": "Câu lựa chọn A hay B → chọn một: \"now\". (B), (C) bắt đầu bằng No/Yes – câu lựa chọn không trả lời Yes/No; (B) còn lặp từ copy."}]}, {"title": "Part 2 · Câu 11", "tag": "Hỏi – đáp", "audio": "../audio/pem3/q11.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "What is the new accountant like?", "vi": "Kế toán mới là người thế nào?"}], "qs": [{"n": 11, "q": "", "opts": [{"t": "He seemed very nice.", "vi": "Anh ấy có vẻ rất dễ mến."}, {"t": "I'll count it over again.", "vi": "Tôi sẽ đếm lại."}, {"t": "I'd like that very much.", "vi": "Tôi rất thích điều đó."}], "ans": ["A"], "ex": "What is … like? = người đó thế nào → tính cách: very nice. (B) bẫy âm accountant / count; (C) bẫy \"like\" (thích)."}]}, {"title": "Part 2 · Câu 12", "tag": "Hỏi – đáp", "audio": "../audio/pem3/q12.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "Is there bank near here?", "vi": "Gần đây có ngân hàng không?"}], "qs": [{"n": 12, "q": "", "opts": [{"t": "Roughly an hour ago.", "vi": "Khoảng một tiếng trước."}, {"t": "Yes, right around the corner.", "vi": "Có, ngay góc đường."}, {"t": "I didn't hear him well.", "vi": "Tôi nghe không rõ anh ấy nói."}], "ans": ["B"], "ex": "Is there…? → Yes + vị trí: right around the corner. (C) bẫy âm near / hear."}]}, {"title": "Part 2 · Câu 13", "tag": "Hỏi – đáp", "audio": "../audio/pem3/q13.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "When will you take off?", "vi": "Khi nào bạn cất cánh (khởi hành)?"}], "qs": [{"n": 13, "q": "", "opts": [{"t": "For a week.", "vi": "Trong một tuần."}, {"t": "To Tokyo.", "vi": "Đến Tokyo."}, {"t": "This afternoon.", "vi": "Chiều nay."}], "ans": ["C"], "ex": "When → thời điểm: this afternoon. (A) là thời lượng, (B) là nơi đến."}]}, {"title": "Part 2 · Câu 14", "tag": "Hỏi – đáp", "audio": "../audio/pem3/q14.mp3", "hideOpts": true, "scriptLabel": "📜 ning.", "vi": "Tôi sẽ xử lý vào buổi sáng."}, {"t": "It's from the direct sunlight.", "vi": "Là do nắng chiếu trực tiếp."}, {"t": "I could use a new heater here.", "vi": "Ở đây tôi cần một cái máy sưởi mới."}], "ans": ["B"], "ex": "Câu nhắc nhở → giải thích nguyên nhân: nắng chiếu thẳng vào. (C) sai ý (phòng nóng mà lại cần máy sưởi)."}]}, {"title": "Part 2 · Câu 31", "tag": "Hỏi – đáp", "audio": "../audio/pem3/q31.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch (mở sau khi đã nghe)", "script": [{"sp": "Q", "t": "How many employees are being transferred to the new branch?", "vi": "Bao nhiêu nhân viên được chuyển sang chi nhánh mới?"}], "qs": [{"n": 31, "q": "", "opts": [{"t": "Yes, for several years I believe.", "vi": "Vâng, tôi nghĩ vài năm."}, {"t": "The new branch will open next month.", "vi": "Chi nhánh mới mở tháng sau."}, {"t": "Around 20 people will be moved.", "vi": "Khoảng 20 người sẽ được chuyển."}], "ans": ["C"], "ex": "How many → con số: around 20 people. (B) lặp từ new branch."}]}, {"title": "Hội thoại 32–34", "tag": "Part 3", "script": [{"sp": "M", "t": "Did you have time to order the brochures we need for next week’s seminar?", "vi": "Anh đặt in tờ giới thiệu cho buổi hội thảo tuần sau chưa?"}, {"sp": "W", "t": "I talked to the printer this morning and he said he’d have them ready by Thursday.", "vi": "Sáng nay tôi đã nói chuyện với bên in, họ nói thứ Năm sẽ xong."}, {"sp": "M", "t": "That is good. Did you ask him to deliver them on Friday?", "vi": "Tốt. Chị có dặn họ giao vào thứ Sáu không?"}, {"sp": "W", "t": "Yes, I did. He said he’d have them here before lunch this Friday.", "vi": "Có. Họ nói sẽ giao đến đây trước giờ trưa thứ Sáu này."}], "qs": [{"n": 32, "q": "When will the seminar take place?", "qvi": "Khi nào hội thảo diễn ra?", "opts": [{"t": "Today"}, {"t": "This Friday"}, {"t": "Next week"}, {"t": "Next month"}], "ans": ["C"], "ex": "\"the brochures we need for next week's seminar\" → tuần sau. (B) thứ Sáu là ngày giao hàng."}, {"n": 33, "q": "When did the woman place the order?", "qvi": "Người phụ nữ đặt hàng khi nào?", "opts": [{"t": "This morning"}, {"t": "Yesterday"}, {"t": "Two days ago"}, {"t": "Last week"}], "ans": ["A"], "ex": "\"I talked to the printer this morning\"."}, {"n": 34, "q": "When will the delivery arrive?", "qvi": "Khi nào hàng được giao?", "opts": [{"t": "Today"}, {"t": "Tomorrow"}, {"t": "Friday"}, {"t": "Monday"}], "ans": ["C"], "ex": "\"have them here before lunch this Friday\"."}], "audio": "../audio/pem3/s32.mp3"}, {"title": "Hội thoại 35–37", "tag": "Part 3", "script": [{"sp": "W", "t": "Mr. Stone, this is Susan White from the Speedy Medical Center. I am calling to remind you that you have an appointment with Dr. Johnson tomorrow at 11.", "vi": "Ông Stone, tôi là Susan White ở trung tâm y tế Speedy. Tôi gọi để nhắc ông có hẹn với bác sĩ Johnson lúc 11 giờ ngày mai."}, {"sp": "M", "t": "Ah, yes, thank you for reminding me. You know, if you hadn't called, I would've completely forgotten all about it. I've been so busy lately.", "vi": "À vâng, cảm ơn đã nhắc. Nếu cô không gọi chắc tôi quên mất. Dạo này tôi bận quá."}, {"sp": "W", "t": "Well, we call all of our clients a day before their scheduled appointment. Anyway, please get here 10 minutes before your appointment since there are some forms that you have to fill out. Also, don't forget to bring your insurance information.", "vi": "Chúng tôi luôn gọi cho khách một ngày trước lịch hẹn. Ông nhớ đến sớm 10 phút vì cần điền vài mẫu đơn, và đừng quên mang thông tin bảo hiểm."}, {"sp": "M", "t": "Okay, I will remember to bring it with me. Thanks, and I will see you tomorrow then.", "vi": "Được, tôi sẽ nhớ mang theo. Cảm ơn, hẹn gặp ngày mai."}], "qs": [{"n": 35, "q": "Why is the woman calling?", "qvi": "Vì sao người phụ nữ gọi điện?", "opts": [{"t": "To make an appointment"}, {"t": "To speak with Dr. Johnson"}, {"t": "To confirm an appointment"}, {"t": "To receive some medical advice"}], "ans": ["C"], "ex": "\"I am calling to remind you that you have an appointment\" → xác nhận/nhắc lịch hẹn."}, {"n": 36, "q": "What does the woman ask the man to do?", "qvi": "Cô ấy nhờ người đàn ông làm gì?", "opts": [{"t": "Show up to his appointment a little early"}, {"t": "Get more medical insurance"}, {"t": "Wait 10 minutes in the waiting area"}, {"t": "Always arrange his appointments a day early"}], "ans": ["A"], "ex": "\"get here 10 minutes before your appointment\" → đến sớm một chút. (C) bẫy: 10 phút nhưng không phải chờ."}, {"n": 37, "q": "What will the man likely take to his appointment?", "qvi": "Người đàn ông có lẽ sẽ mang gì đến?", "opts": [{"t": "His past medical records"}, {"t": "Some insurance documents"}, {"t": "His appointment book"}, {"t": "An application form"}], "ans": ["B"], "ex": "\"don't forget to bring your insurance information\" → giấy tờ bảo hiểm."}], "audio": "../audio/pem3/s35.mp3"}, {"title": "Hội thoại 38–40", "tag": "Part 3", "script": [{"sp": "M", "t": "I just read an article in the paper about the medical conference being held in the city this weekend. I'm really looking forward to going there.", "vi": "Tôi vừa đọc bài báo về hội nghị y khoa tổ chức ở thành phố cuối tuần này. Tôi rất mong được đi."}, {"sp": "W", "t": "Really? I am thinking of going as well. I really want to listen to the talk on that study about soybeans. A lot of my patients have been mentioning it to me lately.", "vi": "Thật à? Tôi cũng định đi. Tôi muốn nghe bài nói về nghiên cứu đậu nành. Nhiều bệnh nhân của tôi nhắc đến nó."}, {"sp": "M", "t": "Yes, my patients have been asking me about it, too. Hey, do you want to go together this Saturday?", "vi": "Bệnh nhân của tôi cũng hỏi về nó. Thứ Bảy này mình đi cùng nhé?"}, {"sp": "W", "t": "All right. My in-laws are coming for a visit this Sunday, so Saturday will be perfect.", "vi": "Được. Chủ nhật bố mẹ chồng tôi đến chơi, nên thứ Bảy là hợp nhất."}], "qs": [{"n": 38, "q": "Who most likely are they?", "qvi": "Họ có lẽ là ai?", "opts": [{"t": "Journalists"}, {"t": "Physicians"}, {"t": "Lawyers"}, {"t": "Restaurant owners"}], "ans": ["B"], "ex": "Cả hai đều nhắc \"my patients\" và hội nghị y khoa → bác sĩ (physicians)."}, {"n": 39, "q": "Who has been mentioning the study to the woman?", "qvi": "Ai đã nhắc đến nghiên cứu với người phụ nữ?", "opts": [{"t": "Her patients"}, {"t": "Her mother-in-law"}, {"t": "Her doctor"}, {"t": "Her friends"}], "ans": ["A"], "ex": "\"A lot of my patients have been mentioning it\"."}, {"n": 40, "q": "When will they likely attend the conference?", "qvi": "Khi nào họ có thể sẽ đi hội nghị?", "opts": [{"t": "Today"}, {"t": "Friday"}, {"t": "Saturday"}, {"t": "Sunday"}], "ans": ["C"], "ex": "\"do you want to go together this Saturday?\" – \"Saturday will be perfect\"."}], "audio": "../audio/pem3/s38.mp3"}, {"title": "Hội thoại 41–43", "tag": "Part 3", "script": [{"sp": "W", "t": "Our copier has been acting strangely today. Could you come and take a look at it for us?", "vi": "Máy photo của chúng tôi hôm nay chạy lạ lắm. Anh qua xem giúp được không?"}, {"sp": "M", "t": "Okay, but did you check to see if any paper is jammed inside?", "vi": "Được, nhưng chị đã kiểm tra xem có kẹt giấy bên trong chưa?"}, {"sp": "W", "t": "Yes, I did, but that's not the problem. I think the problem may be more serious.", "vi": "Rồi, không phải do kẹt giấy. Tôi nghĩ hỏng nặng hơn."}, {"sp": "M", "t": "All right, but I have to run across town this morning to fix a machine there, so I don't think I can make it to your office until after lunch.", "vi": "Vâng, nhưng sáng nay tôi phải qua bên kia thành phố sửa một máy, nên chắc phải sau bữa trưa mới đến chỗ chị được."}], "qs": [{"n": 41, "q": "What is the problem?", "qvi": "Vấn đề là gì?", "opts": [{"t": "The woman does not know how to get to the man's office."}, {"t": "The copy machine is not working properly."}, {"t": "The man is late for his appointment."}, {"t": "The woman can't go to the office today."}], "ans": ["B"], "ex": "\"Our copier has been acting strangely\" → máy photo trục trặc."}, {"n": 42, "q": "Who most likely is the man?", "qvi": "Người đàn ông có lẽ là ai?", "opts": [{"t": "An auto mechanic"}, {"t": "A photocopier technician"}, {"t": "A new assistant"}, {"t": "A coffee shop owner"}], "ans": ["B"], "ex": "Anh hỏi kẹt giấy và đi \"fix a machine\" → thợ sửa máy photo."}, {"n": 43, "q": "When will the man most likely get to the woman's office?", "qvi": "Khi nào anh có thể đến văn phòng cô?", "opts": [{"t": "In the morning"}, {"t": "During lunch"}, {"t": "In the afternoon"}, {"t": "In the evening"}], "ans": ["C"], "ex": "\"until after lunch\" → buổi chiều."}], "audio": "../audio/pem3/s41.mp3"}, {"title": "Hội thoại 44–46", "tag": "Part 3", "script": [{"sp": "W", "t": "John, did you see all the pictures we took at the company party?", "vi": "John, anh xem hết ảnh chụp ở tiệc công ty chưa?"}, {"sp": "M", "t": "Yes, they were posted on the bulletin board, and I ordered a list of the pictures I liked. Did you already get them developed, Ellen?", "vi": "Rồi, ảnh dán trên bảng tin và tôi đã ghi danh sách ảnh tôi thích. Chị rửa ảnh rồi à, Ellen?"}, {"sp": "W", "t": "Yes, I picked up the pictures this morning and gave them to the receptionist. You should go and see her.", "vi": "Rồi, sáng nay tôi lấy ảnh và đưa cho lễ tân. Anh qua gặp cô ấy nhé."}, {"sp": "M", "t": "Thanks. I'm thinking of printing some in the company newsletter.", "vi": "Cảm ơn. Tôi định in vài tấm lên bản tin công ty."}], "qs": [{"n": 44, "q": "Who most likely are they?", "qvi": "Họ có lẽ là ai?", "opts": [{"t": "Journalists"}, {"t": "Photographers"}, {"t": "Office workers"}, {"t": "Party organizers"}], "ans": ["C"], "ex": "Nói về tiệc công ty, bảng tin, bản tin công ty → nhân viên văn phòng."}, {"n": 45, "q": "Who has the pictures now?", "qvi": "Ảnh hiện đang ở chỗ ai?", "opts": [{"t": "The receptionist"}, {"t": "The photographer"}, {"t": "Ellen"}, {"t": "John"}], "ans": ["A"], "ex": "\"gave them to the receptionist\"."}, {"n": 46, "q": "What will the man most likely do next?", "qvi": "Người đàn ông có lẽ sẽ làm gì tiếp theo?", "opts": [{"t": "Pick out the pictures he wants"}, {"t": "Take a walk to the photoshop"}, {"t": "Post the pictures on the bulletin board"}, {"t": "Go to see a co-worker"}], "ans": ["D"], "ex": "\"You should go and see her\" (lễ tân) → đi gặp đồng nghiệp."}], "audio": "../audio/pem3/s44.mp3"}, {"title": "Hội thoại 47–49", "tag": "Part 3", "script": [{"sp": "M", "t": "Did you find out when the plumber is going to be here to fix the broken pipe?", "vi": "Chị biết khi nào thợ sửa ống nước đến sửa ống vỡ chưa?"}, {"sp": "W", "t": "Yes, I called at 1 o'clock, and he said he was tied up in another building and would be here by 2.", "vi": "Rồi, tôi gọi lúc 1 giờ, anh ấy nói đang kẹt ở tòa nhà khác, sẽ đến trước 2 giờ."}, {"sp": "M", "t": "Okay, it's ten minutes to 2 right now. Could you do me a favor and make sure the work goes smoothly when he gets here? I have to step out of the office to meet a client but should be back by 4 o'clock.", "vi": "Giờ là 2 giờ kém 10. Chị giúp tôi trông cho việc sửa chữa suôn sẻ nhé? Tôi phải ra ngoài gặp khách, khoảng 4 giờ về."}, {"sp": "W", "t": "Okay, I will see you later.", "vi": "Được, gặp anh sau."}], "qs": [{"n": 47, "q": "Where most likely is the plumber now?", "qvi": "Thợ ống nước có lẽ đang ở đâu?", "opts": [{"t": "He is having lunch."}, {"t": "He is working somewhere else."}, {"t": "He is at home relaxing."}, {"t": "He is doing a favor for the man."}], "ans": ["B"], "ex": "\"tied up in another building\" → đang làm ở chỗ khác."}, {"n": 48, "q": "When is the plumber expected to arrive?", "qvi": "Thợ dự kiến đến lúc mấy giờ?", "opts": [{"t": "At one o'clock"}, {"t": "At two o'clock"}, {"t": "At three o'clock"}, {"t": "At four o'clock"}], "ans": ["B"], "ex": "\"would be here by 2\"."}, {"n": 49, "q": "Where is the man going?", "qvi": "Người đàn ông đi đâu?", "opts": [{"t": "To meet a client"}, {"t": "To talk to the plumber"}, {"t": "To fix the pipe"}, {"t": "To have lunch"}], "ans": ["A"], "ex": "\"step out of the office to meet a client\"."}], "audio": "../audio/pem3/s47.mp3"}, {"title": "Hội thoại 50–52", "tag": "Part 3", "script": [{"sp": "W", "t": "John, are you planning to go to Chicago to attend the big conference tomorrow? I heard it's going to be great.", "vi": "John, mai anh có định đi Chicago dự hội nghị lớn không? Nghe nói hay lắm."}, {"sp": "M", "t": "Well, I really want to, but I can't. I just came back from a business trip in Europe, so I have so much work piled up on my desk.", "vi": "Tôi rất muốn nhưng không được. Tôi vừa đi công tác châu Âu về, việc chất đống trên bàn."}, {"sp": "W", "t": "I'm sorry to hear that. Tell you what... I’II take my video camera with me, and I will film the speeches you'd like to see.", "vi": "Tiếc quá. Thế này nhé… tôi sẽ mang máy quay theo và quay lại các bài phát biểu anh muốn xem."}, {"sp": "M", "t": "Oh, that would be great. Thanks, Susan.", "vi": "Ồ, thế thì tuyệt. Cảm ơn Susan."}], "qs": [{"n": 50, "q": "When is the conference scheduled to take place?", "qvi": "Hội nghị diễn ra khi nào?", "opts": [{"t": "Today"}, {"t": "Tomorrow"}, {"t": "Next week"}, {"t": "Next month"}], "ans": ["B"], "ex": "\"attend the big conference tomorrow\"."}, {"n": 51, "q": "Why will John miss the conference?", "qvi": "Vì sao John không đi hội nghị?", "opts": [{"t": "He is going on a business trip."}, {"t": "He is taking a vacation in Europe."}, {"t": "He has too much work."}, {"t": "He has to review the videos."}], "ans": ["C"], "ex": "\"so much work piled up on my desk\" → quá nhiều việc. (A) chuyến công tác đã xong rồi."}, {"n": 52, "q": "Why is the man thanking the woman?", "qvi": "Vì sao người đàn ông cảm ơn?", "opts": [{"t": "She offered to give him a ride."}, {"t": "She will lend him her video recorder."}, {"t": "She will go to the seminar in his place."}, {"t": "She will record the sessions he wants to see."}], "ans": ["D"], "ex": "\"I will film the speeches you'd like to see\" → quay lại các phần anh muốn xem."}], "audio": "../audio/pem3/s50.mp3"}, {"title": "Hội thoại 53–55", "tag": "Part 3", "script": [{"sp": "W", "t": "Have you sent out the shipment of computers to the electronics shop yet? The owner just called and said he needs them within the hour.", "vi": "Anh đã gửi lô máy tính cho cửa hàng điện tử chưa? Chủ cửa hàng vừa gọi, nói cần trong vòng một tiếng."}, {"sp": "M", "t": "The truck left ten minutes ago, so it should arrive at the store in the next fifteen minutes. Do you want me to check to see where the driver is now?", "vi": "Xe tải đi được 10 phút rồi, khoảng 15 phút nữa sẽ tới. Chị có muốn tôi kiểm tra xem tài xế đang ở đâu không?"}, {"sp": "W", "t": "That's okay. So long as it has left, it'll be fine. Now could you do me a favor and get those boxes loaded onto the truck parked over there?", "vi": "Không cần. Miễn là xe đã đi là được. Giờ anh giúp tôi chất mấy thùng kia lên chiếc xe tải đậu đằng kia nhé?"}, {"sp": "M", "t": "Okay, I will take care of that right away.", "vi": "Vâng, tôi làm ngay."}], "qs": [{"n": 53, "q": "Where is the conversation most likely taking place?", "qvi": "Cuộc nói chuyện có lẽ ở đâu?", "opts": [{"t": "In a truck"}, {"t": "At a bus stop"}, {"t": "In a warehouse"}, {"t": "At an electronics store"}], "ans": ["C"], "ex": "Gửi hàng, xe tải, chất thùng lên xe → nhà kho."}, {"n": 54, "q": "When will the computers arrive at the store?", "qvi": "Khi nào máy tính đến cửa hàng?", "opts": [{"t": "In five minutes"}, {"t": "In fifteen minutes"}, {"t": "By this evening"}, {"t": "By tomorrow morning"}], "ans": ["B"], "ex": "\"arrive at the store in the next fifteen minutes\"."}, {"n": 55, "q": "What will the man do next?", "qvi": "Người đàn ông sẽ làm gì tiếp?", "opts": [{"t": "Call the electronics shop"}, {"t": "Talk to the truck driver"}, {"t": "Turn on the computer"}, {"t": "Lift some boxes"}], "ans": ["D"], "ex": "\"get those boxes loaded onto the truck\" → nâng/chất thùng."}], "audio": "../audio/pem3/s53.mp3"}, {"title": "Hội thoại 56–58", "tag": "Part 3", "script": [{"sp": "W", "t": "That was such a great movie. I am so glad that you asked me to see it.", "vi": "Phim hay quá. Cảm ơn anh đã rủ tôi đi xem."}, {"sp": "M", "t": "Well, I've been a real fan of Mark O'Reilly since he made his debut in the baseball movie that became a hit last year. Don't you think he's a great actor?", "vi": "Tôi là fan của Mark O'Reilly từ khi anh ấy ra mắt trong bộ phim bóng chày ăn khách năm ngoái. Chị thấy anh ấy diễn hay không?"}, {"sp": "W", "t": "Yes, he gave a wonderful performance in the leading role of this movie. I think he is definitely going to be nominated for an award this year.", "vi": "Có, anh ấy đóng vai chính rất xuất sắc. Chắc chắn năm nay anh ấy sẽ được đề cử giải thưởng."}, {"sp": "M", "t": "Yes, I wouldn't be a bit surprised if he won the best actor award.", "vi": "Ừ, anh ấy mà đoạt giải nam chính xuất sắc tôi cũng không ngạc nhiên."}], "qs": [{"n": 56, "q": "What are they talking about?", "qvi": "Họ đang nói về gì?", "opts": [{"t": "A baseball game they will attend this evening."}, {"t": "A movie they just saw."}, {"t": "A music concert they saw last year."}, {"t": "An award they have been nominated for."}], "ans": ["B"], "ex": "\"That was such a great movie\" → bộ phim vừa xem."}, {"n": 57, "q": "Who is Mark?", "qvi": "Mark là ai?", "opts": [{"t": "An actor"}, {"t": "A client"}, {"t": "A co-worker"}, {"t": "A baseball player"}], "ans": ["A"], "ex": "\"Don't you think he's a great actor?\" → diễn viên. (D) bẫy: anh đóng phim về bóng chày."}, {"n": 58, "q": "When did Mr. O'Reilly make his debut?", "qvi": "O'Reilly ra mắt khi nào?", "opts": [{"t": "This year"}, {"t": "One year ago"}, {"t": "Two years ago"}, {"t": "Three years ago"}], "ans": ["B"], "ex": "\"made his debut in the baseball movie… last year\" → một năm trước."}], "audio": "../audio/pem3/s56.mp3"}, {"title": "Hội thoại 59–61", "tag": "Part 3", "script": [{"sp": "W", "t": "Jack, did you get a chance to read today's newspaper? There is an article written about the project you're working on.", "vi": "Jack, anh đọc báo hôm nay chưa? Có bài viết về dự án anh đang làm đấy."}, {"sp": "M", "t": "Really? Could you bring a copy up to my office for me?", "vi": "Thật à? Chị mang giúp tôi một tờ lên văn phòng được không?"}, {"sp": "W", "t": "Actually, I am a bit busy right now. I have a couple of emails to send, and then I have tostep out of the office to meet a client. Tell you what. I'll get my secretary to scan a copy and e-mail it to you.", "vi": "Giờ tôi hơi bận. Tôi phải gửi vài email rồi ra ngoài gặp khách. Thế này nhé, tôi sẽ nhờ thư ký scan rồi gửi email cho anh."}, {"sp": "M", "t": "Okay, that will be fine. I'll take a look at it after I come back from lunch.", "vi": "Được, vậy cũng tốt. Ăn trưa về tôi sẽ đọc."}], "qs": [{"n": 59, "q": "What are they talking about?", "qvi": "Họ đang nói về gì?", "opts": [{"t": "The man's promotion"}, {"t": "A newspaper article"}, {"t": "The woman's secretary"}, {"t": "The man's computer"}], "ans": ["B"], "ex": "\"There is an article written about the project\" → bài báo."}, {"n": 60, "q": "What does the man ask the woman to do?", "qvi": "Người đàn ông nhờ cô làm gì?", "opts": [{"t": "Bring him a copy of the paper"}, {"t": "Come and fix his computer"}, {"t": "Conduct an interview in his place"}, {"t": "Talk to his client"}], "ans": ["A"], "ex": "\"Could you bring a copy up to my office?\" → mang cho anh một tờ báo."}, {"n": 61, "q": "How will Jack receive the article?", "qvi": "Jack sẽ nhận bài báo bằng cách nào?", "opts": [{"t": "By fax"}, {"t": "By mail"}, {"t": "By e-mail"}, {"t": "By a messenger"}], "ans": ["C"], "ex": "\"scan a copy and e-mail it to you\"."}], "audio": "../audio/pem3/s59.mp3"}, {"title": "Hội thoại 62–64", "tag": "Part 3 · giọng đọc máy", "script": [{"sp": "W", "t": "Mr. Sanchez, I'm sorry to tell you this, but I have some bad news.", "vi": "Anh Sanchez, tôi rất tiếc phải báo tin xấu."}, {"sp": "M", "t": "I hope it's not about the order I made. I really need the brochures by next week.", "vi": "Mong là không phải về đơn hàng của tôi. Tôi rất cần tờ giới thiệu trước tuần sau."}, {"sp": "W", "t": "Actually, we are running a bit behind schedule, so I'm afraid that it will be delayed by a few days. However, if it is urgent, we will make a special delivery on the weekend.", "vi": "Thật ra chúng tôi đang hơi chậm tiến độ nên e là đơn sẽ trễ vài ngày. Nhưng nếu gấp, chúng tôi sẽ giao đặc biệt vào cuối tuần."}, {"sp": "M", "t": "Yes, I really must have them on Monday to give them out to the seminar attendees", "vi": "Vâng, tôi nhất định phải có chúng vào thứ Hai để phát cho người dự hội thảo."}], "qs": [{"n": 62, "q": "What is the problem?", "qvi": "Vấn đề là gì?", "opts": [{"t": "Mr. Sanchez forgot to place an order."}, {"t": "A delivery will be late."}, {"t": "They are running late for a meeting."}, {"t": "The man made the wrong order."}], "ans": ["B"], "ex": "\"it will be delayed by a few days\" → giao hàng trễ."}, {"n": 63, "q": "When will the man use the brochures?", "qvi": "Khi nào anh dùng tờ giới thiệu?", "opts": [{"t": "This weekend"}, {"t": "Next Monday"}, {"t": "Today"}, {"t": "Tomorrow"}], "ans": ["B"], "ex": "\"I really must have them on Monday to give them out\" → thứ Hai tới."}, {"n": 64, "q": "What will the woman do for the man?", "qvi": "Cô sẽ làm gì cho anh?", "opts": [{"t": "Hand out the brochures to the seminar attendees"}, {"t": "Place an order for more brochures"}, {"t": "Make a speech at the seminar"}, {"t": "Arrange a special delivery on the weekend"}], "ans": ["D"], "ex": "\"we will make a special delivery on the weekend\"."}], "audio": "../audio/pem3/s62.mp3"}, {"title": "Hội thoại 65–67", "tag": "Part 3 · giọng đọc máy", "script": [{"sp": "M", "t": "You don't need to take a cab to the train station. There is an express bus that will take you there.", "vi": "Chị không cần đi taxi ra ga tàu đâu. Có xe buýt tốc hành đi thẳng đến đó."}, {"sp": "W", "t": "Oh really? Can you tell me where the bus stop is?", "vi": "Thật à? Anh chỉ giúp tôi trạm xe buýt ở đâu được không?"}, {"sp": "M", "t": "Of course. Just walk out of the building through the back door. Go across the parking lot, and there is one around the corner in front of the grocery store.", "vi": "Được chứ. Chị đi ra cửa sau tòa nhà, băng qua bãi đậu xe, trạm ở ngay góc đường trước cửa hàng tạp hóa."}, {"sp": "W", "t": "Thank you. Do you also know how often it runs?", "vi": "Cảm ơn. Anh có biết bao lâu thì có một chuyến không?"}], "qs": [{"n": 65, "q": "What does the man suggest the woman do?", "qvi": "Người đàn ông gợi ý cô làm gì?", "opts": [{"t": "Catch a taxi"}, {"t": "Shop at the grocery store"}, {"t": "Take a bus"}, {"t": "Park her car in the lot"}], "ans": ["C"], "ex": "\"There is an express bus\" → đi xe buýt thay vì taxi."}, {"n": 66, "q": "Where is this conversation most likely taking place?", "qvi": "Cuộc nói chuyện có lẽ ở đâu?", "opts": [{"t": "In a parking lot"}, {"t": "At a bus stop"}, {"t": "In an office building"}, {"t": "In a train station"}], "ans": ["C"], "ex": "\"walk out of the building through the back door\" → đang ở trong tòa nhà văn phòng."}, {"n": 67, "q": "What does the woman want to know?", "qvi": "Cô muốn biết gì?", "opts": [{"t": "How often the bus comes"}, {"t": "When the man will meet her at the train station"}, {"t": "How far the train station is"}, {"t": "Where to park her car"}], "ans": ["A"], "ex": "\"how often it runs\" → bao lâu có một chuyến."}], "audio": "../audio/pem3/s65.mp3"}, {"title": "Hội thoại 68–70", "tag": "Part 3 · giọng đọc máy", "script": [{"sp": "M", "t": "I'd like to remind you about the training session scheduled for two o'clock tomorrow.", "vi": "Tôi muốn nhắc chị buổi đào tạo lúc 2 giờ chiều mai."}, {"sp": "W", "t": "Yes, that's right. It's going to be held in the main conference room next to the executive lounge, right?", "vi": "Vâng. Nó tổ chức ở phòng họp chính cạnh phòng chờ lãnh đạo, đúng không?"}, {"sp": "M", "t": "Yes, but let's meet in my office first. I'd like to go over a couple of things over a cup of coffee before the training session starts.", "vi": "Đúng, nhưng mình gặp ở văn phòng tôi trước nhé. Tôi muốn trao đổi vài việc với chị bên ly cà phê trước khi buổi đào tạo bắt đầu."}, {"sp": "W", "t": "Sure, I'll be in your office right after lunch.", "vi": "Được, ăn trưa xong tôi qua văn phòng anh ngay."}], "qs": [{"n": 68, "q": "When will the training session take place?", "qvi": "Buổi đào tạo diễn ra khi nào?", "opts": [{"t": "During lunch today"}, {"t": "Tomorrow afternoon"}, {"t": "This evening"}, {"t": "Tomorrow morning"}], "ans": ["B"], "ex": "\"two o'clock tomorrow\" → chiều mai."}, {"n": 69, "q": "Where will the training be held?", "qvi": "Buổi đào tạo tổ chức ở đâu?", "opts": [{"t": "In the president's office"}, {"t": "In the executive lounge"}, {"t": "In a big meeting room"}, {"t": "In a coffee shop"}], "ans": ["C"], "ex": "\"the main conference room\" = phòng họp lớn. (B) bẫy: executive lounge chỉ ở bên cạnh."}, {"n": 70, "q": "What does the man want to do before the training session starts?", "qvi": "Anh muốn làm gì trước buổi đào tạo?", "opts": [{"t": "Have lunch with the woman"}, {"t": "Review some things with the woman"}, {"t": "Relax in the executive lounge"}, {"t": "Drink coffee with a client"}], "ans": ["B"], "ex": "\"go over a couple of things\" = xem lại vài việc với cô. (D) bẫy: uống cà phê với cô, không phải với khách."}], "audio": "../audio/pem3/s68.mp3"}, {"title": "Bài nói 71–73", "tag": "Part 4", "script": [{"sp": "", "t": "The weather outside at the moment is fantastic with sunny skies and mild temperatures throughout the city. However, by this evening, rain is expected to come our way. Tomorrow, we will have beautiful weather again. It is going to last throughout the weekend with temperatures rising to the mid-20s by Saturday afternoon.", "vi": "Thời tiết bên ngoài lúc này rất đẹp, trời nắng và ôn hòa khắp thành phố. Tuy nhiên, đến tối nay sẽ có mưa. Ngày mai trời lại đẹp và kéo dài suốt cuối tuần, nhiệt độ lên đến khoảng 25 độ vào chiều thứ Bảy."}], "qs": [{"n": 71, "q": "What is the current weather like outside?", "qvi": "Thời tiết bên ngoài lúc này thế nào?", "opts": [{"t": "Sunny"}, {"t": "Rainy"}, {"t": "Cloudy"}, {"t": "Muggy"}], "ans": ["A"], "ex": "\"fantastic with sunny skies\" → nắng."}, {"n": 72, "q": "When will it rain?", "qvi": "Khi nào trời mưa?", "opts": [{"t": "This afternoon"}, {"t": "This evening"}, {"t": "Tomorrow"}, {"t": "This weekend"}], "ans": ["B"], "ex": "\"by this evening, rain is expected\"."}, {"n": 73, "q": "What will the temperature be like on Saturday?", "qvi": "Nhiệt độ thứ Bảy thế nào?", "opts": [{"t": "20 degrees Celsius"}, {"t": "25 degrees Celsius"}, {"t": "28 degrees Celsius"}, {"t": "30 degrees Celsius"}], "ans": ["B"], "ex": "\"rising to the mid-20s\" = khoảng giữa 20–30 → 25 độ."}], "audio": "../audio/pem3/s71.mp3"}, {"title": "Bài nói 74–76", "tag": "Part 4", "script": [{"sp": "", "t": "Hello, everyone! We are going to have to cancel our trip to the beachside today because of the rain we are getting. However, we will stay here at the civic center and have lunch. There is a food court where you can enjoy food from all over the world on the first floor. You may also want to check out the gift shop and pick up some film and batteries. The bus is expected to arrive at 2 o'clock to pick us up.", "vi": "Chào mọi người! Hôm nay chúng ta phải hủy chuyến đi biển vì trời mưa. Thay vào đó, chúng ta sẽ ở lại trung tâm cộng đồng và ăn trưa. Tầng 1 có khu ẩm thực với món ăn khắp thế giới. Mọi người cũng có thể ghé cửa hàng quà tặng mua phim và pin. Xe buýt dự kiến đến đón lúc 2 giờ."}], "qs": [{"n": 74, "q": "Who most likely is talking?", "qvi": "Ai có lẽ đang nói?", "opts": [{"t": "A bus driver"}, {"t": "A tour guide"}, {"t": "A store clerk"}, {"t": "A waiter"}], "ans": ["B"], "ex": "Hủy chuyến đi biển, đưa đoàn đi ăn, xe buýt đến đón → hướng dẫn viên du lịch."}, {"n": 75, "q": "Why is the speaker talking?", "qvi": "Vì sao người nói phát biểu?", "opts": [{"t": "To ask the people to get back on the bus"}, {"t": "To let the people know of the change in schedule"}, {"t": "To warn the people of the bad weather expected today"}, {"t": "To provide some information about the civic center"}], "ans": ["B"], "ex": "\"cancel our trip… However, we will stay here\" → báo thay đổi lịch trình."}, {"n": 76, "q": "When will they most likely leave the civic center?", "qvi": "Khi nào họ rời trung tâm?", "opts": [{"t": "Right now"}, {"t": "At lunchtime"}, {"t": "After lunch"}, {"t": "In the evening"}], "ans": ["C"], "ex": "Ăn trưa ở đây, xe đến đón lúc 2 giờ → sau bữa trưa."}], "audio": "../audio/pem3/s74.mp3"}, {"title": "Bài nói 77–79", "tag": "Part 4", "script": [{"sp": "", "t": "May I have your attention, staff? We have been told that there is a shortage of blood at Memorial Hospital, so we have gladly agreed to hold a blood drive here at our company. This Friday, from 9 o'clock until 12, some of the nurses will be here collecting blood in the lobby. Those who give a pint of blood will be given a free lunch at the cafeteria. We hope many of you will show up.", "vi": "Xin mọi người chú ý. Bệnh viện Memorial đang thiếu máu, nên công ty chúng ta sẽ tổ chức hiến máu. Thứ Sáu này, từ 9 giờ đến 12 giờ, các y tá sẽ lấy máu ở sảnh. Ai hiến một đơn vị máu sẽ được ăn trưa miễn phí ở căng tin. Mong nhiều bạn tham gia."}], "qs": [{"n": 77, "q": "When will the blood drive take place?", "qvi": "Hiến máu diễn ra khi nào?", "opts": [{"t": "Today"}, {"t": "Monday"}, {"t": "Wednesday"}, {"t": "Friday"}], "ans": ["D"], "ex": "\"This Friday\"."}, {"n": 78, "q": "Where will the event take place?", "qvi": "Sự kiện ở đâu?", "opts": [{"t": "In the cafeteria"}, {"t": "In the foyer"}, {"t": "At the hospital"}, {"t": "In the conference room"}], "ans": ["B"], "ex": "\"in the lobby\" = foyer (sảnh). (A) căng tin chỉ là nơi ăn trưa miễn phí."}, {"n": 79, "q": "How long will the blood drive last?", "qvi": "Hiến máu kéo dài bao lâu?", "opts": [{"t": "1 hour"}, {"t": "2 hours"}, {"t": "3 hours"}, {"t": "4 hours"}], "ans": ["C"], "ex": "9 giờ đến 12 giờ → 3 tiếng."}], "audio": "../audio/pem3/s77.mp3"}, {"title": "Bài nói 80–82", "tag": "Part 4", "script": [{"sp": "", "t": "When you come onto the factory floor each morning, you are asked to look at the schedule to see which position you have been assigned to on the production line for that particular day. You must punch in your time to verify that you are present. Also, don't forget to check the notice board by the supervisor's office to make sure that there aren't any last - minute changes in the day's schedule. Now, before you enter the factory site, pick up a pair of safety goggles and gloves. Thank you.", "vi": "Mỗi sáng khi vào xưởng, các bạn xem lịch để biết hôm đó mình được phân vị trí nào trên dây chuyền. Các bạn phải bấm giờ để xác nhận có mặt. Đừng quên xem bảng thông báo cạnh phòng giám sát để biết lịch có thay đổi phút chót không. Trước khi vào khu sản xuất, hãy lấy kính bảo hộ và găng tay. Cảm ơn."}], "qs": [{"n": 80, "q": "Who is the intended audience of this talk?", "qvi": "Người nghe là ai?", "opts": [{"t": "Factory supervisors"}, {"t": "Safety inspectors"}, {"t": "Production managers"}, {"t": "Plant employees"}], "ans": ["D"], "ex": "Nói với người vào xưởng, đứng dây chuyền → công nhân nhà máy."}, {"n": 81, "q": "What should the listeners do first when they come to work?", "qvi": "Người nghe nên làm gì đầu tiên khi đến?", "opts": [{"t": "Put on their safety equipment"}, {"t": "Punch in their times"}, {"t": "Read the schedule"}, {"t": "Check the notice board"}], "ans": ["C"], "ex": "\"look at the schedule to see which position…\" là việc đầu tiên."}, {"n": 82, "q": "What are the listeners asked to put on before entering the worksite?", "qvi": "Phải đeo gì trước khi vào khu làm việc?", "opts": [{"t": "Safety glasses"}, {"t": "Long boots"}, {"t": "Hard hats"}, {"t": "Long pants"}], "ans": ["A"], "ex": "\"safety goggles\" = safety glasses."}], "audio": "../audio/pem3/s80.mp3"}, {"title": "Bài nói 83–85", "tag": "Part 4", "script": [{"sp": "", "t": "As your manager, I have been working hard to come up with a plan to make this sales campaign a success. And in order to do that, I have something very special to give to each team member here today. However, before I give them to you, I want all of you to meet someone first. Mr. John Lester is a leading salesperson at our branch office in the York region, and he is here to talk to us about his little secrets today. Would everyone kindly give a warm hand of applause for Mr. Lester?", "vi": "Là quản lý của các bạn, tôi đã nỗ lực lên kế hoạch để chiến dịch bán hàng này thành công. Hôm nay tôi có một món quà đặc biệt cho từng thành viên. Nhưng trước khi trao quà, tôi muốn mọi người gặp một người. Anh John Lester là nhân viên bán hàng hàng đầu ở chi nhánh vùng York, hôm nay anh đến chia sẻ bí quyết của mình. Mọi người cho anh Lester một tràng pháo tay nhé."}], "qs": [{"n": 83, "q": "Who most likely is giving the talk?", "qvi": "Ai có lẽ đang nói?", "opts": [{"t": "Mr. Lester"}, {"t": "A sales manager"}, {"t": "One of the sales reps"}, {"t": "A manager from the York regional office"}], "ans": ["B"], "ex": "\"As your manager… this sales campaign\" → quản lý bán hàng."}, {"n": 84, "q": "What will Mr. Lester talk about?", "qvi": "Anh Lester sẽ nói về gì?", "opts": [{"t": "The upcoming sales campaign"}, {"t": "The know-how of selling"}, {"t": "His new managerial position"}, {"t": "How to get to the York region"}], "ans": ["B"], "ex": "\"talk to us about his little secrets\" (người bán hàng giỏi) → bí quyết bán hàng."}, {"n": 85, "q": "What will happen next?", "qvi": "Chuyện gì xảy ra tiếp theo?", "opts": [{"t": "An award will be given out."}, {"t": "The manager will give everyone a gift."}, {"t": "The sales campaign will commence."}, {"t": "Mr. Lester will give a speech."}], "ans": ["D"], "ex": "Mời vỗ tay cho anh Lester → anh ấy sẽ phát biểu. (B) quà sẽ trao sau."}], "audio": "../audio/pem3/s83.mp3"}, {"title": "Bài nói 86–88", "tag": "Part 4", "script": [{"sp": "", "t": "The next thing on our agenda this evening is the presentation of awards for the hardest-working people in our company. Tonight is special because it has been a quarter of a century since we started giving out this award. The awards will be presented to ten of our best people who have worked at our company for more than ten years. The first person to get this prestigious award is Mary Carlson. Now, let's give a big round of applause for Mary.", "vi": "Tiếp theo trong chương trình tối nay là trao giải cho những người làm việc chăm chỉ nhất công ty. Tối nay đặc biệt vì đã tròn một phần tư thế kỷ (25 năm) kể từ khi giải này được trao. Giải dành cho 10 người xuất sắc đã làm ở công ty hơn 10 năm. Người đầu tiên nhận giải là Mary Carlson. Xin một tràng pháo tay cho Mary."}], "qs": [{"n": 86, "q": "What is the speech mainly about?", "qvi": "Bài nói chủ yếu về gì?", "opts": [{"t": "To thank Mary for making the biggest sale in the company's history"}, {"t": "To encourage employees to work harder in the coming days"}, {"t": "To show gratitude to those who have excelled at their jobs"}, {"t": "To welcome new employees to the company"}], "ans": ["C"], "ex": "Trao giải cho người làm việc chăm chỉ nhất → tri ân người làm việc xuất sắc."}, {"n": 87, "q": "How long has this award been given out?", "qvi": "Giải này đã được trao bao lâu?", "opts": [{"t": "5 years"}, {"t": "10 years"}, {"t": "20 years"}, {"t": "25 years"}], "ans": ["D"], "ex": "\"a quarter of a century\" = 1/4 thế kỷ = 25 năm."}, {"n": 88, "q": "What will Ms. Carlson most likely do next?", "qvi": "Cô Carlson có lẽ sẽ làm gì tiếp?", "opts": [{"t": "Accept an award"}, {"t": "Go back to work"}, {"t": "Introduce the next speaker"}, {"t": "Present the award"}], "ans": ["A"], "ex": "\"The first person to get this prestigious award is Mary Carlson\" → lên nhận giải."}], "audio": "../audio/pem3/s86.mp3"}, {"title": "Bài nói 89–91", "tag": "Part 4", "script": [{"sp": "", "t": "Come to Bargain City this week, and join us to celebrate our tenth year in business. From Tuesday to Friday, all nine stores throughout the city will be having sales of up to 25% off the regular prices on suits and casual clothes and 35% off the regular prices on sportswear. So, if you're looking for bargains, don't miss out on this sale of the century at the Bargain City store nearest you.", "vi": "Hãy đến Bargain City tuần này để mừng 10 năm kinh doanh của chúng tôi. Từ thứ Ba đến thứ Sáu, cả 9 cửa hàng trong thành phố giảm đến 25% vest và đồ thường ngày, 35% đồ thể thao. Nếu bạn tìm món hời, đừng bỏ lỡ đợt giảm giá này ở cửa hàng gần bạn nhất."}], "qs": [{"n": 89, "q": "How long has Bargain City been in business?", "qvi": "Bargain City kinh doanh bao lâu rồi?", "opts": [{"t": "For 1 year"}, {"t": "For 5 years"}, {"t": "For 10 years"}, {"t": "For 25 years"}], "ans": ["C"], "ex": "\"celebrate our tenth year in business\"."}, {"n": 90, "q": "What does Bargain City sell?", "qvi": "Bargain City bán gì?", "opts": [{"t": "Sports equipment"}, {"t": "Home appliances"}, {"t": "Stationery"}, {"t": "Clothing"}], "ans": ["D"], "ex": "suits, casual clothes, sportswear → quần áo. (A) bẫy: sportswear là đồ thể thao để mặc, không phải dụng cụ."}, {"n": 91, "q": "How long will the sale last?", "qvi": "Đợt giảm giá kéo dài bao lâu?", "opts": [{"t": "Two days"}, {"t": "Three days"}, {"t": "Four days"}, {"t": "Five days"}], "ans": ["C"], "ex": "Thứ Ba đến thứ Sáu → 4 ngày."}], "audio": "../audio/pem3/s89.mp3"}, {"title": "Bài nói 92–94", "tag": "Part 4", "script": [{"sp": "", "t": "May I have your attention, passengers! Bus number 4-A heading for Boston will be boarding in a few minutes. Please proceed to Gate 2 at this moment. The bus is scheduled to leave in fifteen minutes at 10:30. This is also a reminder to all passengers that bus 17 coming from Detroit is being delayed 30 minutes due to a terrible traffic jam on the highway. The heavy rainstorm is the reason. Thank you, and have a nice day.", "vi": "Xin hành khách chú ý! Xe buýt số 4-A đi Boston sắp lên xe. Vui lòng đến Cổng 2 ngay. Xe khởi hành sau 15 phút, lúc 10:30. Xin nhắc thêm, xe số 17 từ Detroit bị trễ 30 phút do kẹt xe nghiêm trọng trên cao tốc vì mưa bão lớn. Cảm ơn và chúc một ngày tốt lành."}], "qs": [{"n": 92, "q": "When will the bus for Boston depart?", "qvi": "Xe đi Boston khởi hành lúc mấy giờ?", "opts": [{"t": "At 10:00"}, {"t": "At 10:15"}, {"t": "At 10:30"}, {"t": "At 11:00"}], "ans": ["C"], "ex": "\"leave in fifteen minutes at 10:30\"."}, {"n": 93, "q": "What should those heading to Boston do now?", "qvi": "Người đi Boston nên làm gì bây giờ?", "opts": [{"t": "Sit in the waiting area"}, {"t": "Listen for an updated announcement"}, {"t": "Get a refund on their tickets"}, {"t": "Line up at the gate"}], "ans": ["D"], "ex": "\"Please proceed to Gate 2 at this moment\" → ra xếp hàng ở cổng."}, {"n": 94, "q": "What does the speaker mention about the bus from Detroit?", "qvi": "Người nói nói gì về xe từ Detroit?", "opts": [{"t": "It broke down on the highway."}, {"t": "It is caught in heavy traffic."}, {"t": "It runs every half hour."}, {"t": "It will begin boarding in fifteen minutes."}], "ans": ["B"], "ex": "\"delayed… due to a terrible traffic jam\" → kẹt xe."}], "audio": "../audio/pem3/s92.mp3"}, {"title": "Bài nói 95–97", "tag": "Part 4", "script": [{"sp": "", "t": "Thank you, John, for the weekend weather update. Now, for our traffic update around the city. The main highway leading into the downtown area is backed up for miles due to an accident involving a bus and two other vehicles. Fortunately, all the drivers escaped with only minor cuts. According to the police, the clean-up will take at least another hour. All motorists are asked to avoid Highway 31 until about 5 o'clock. We will be right back with the headline news right after the commercial break.", "vi": "Cảm ơn John về bản tin thời tiết cuối tuần. Giờ là tin giao thông. Đường cao tốc chính vào trung tâm bị ùn tắc hàng dặm do tai nạn giữa một xe buýt và hai xe khác. May là các tài xế chỉ bị trầy xước nhẹ. Theo cảnh sát, việc dọn dẹp mất ít nhất một tiếng nữa. Tài xế nên tránh Cao tốc 31 đến khoảng 5 giờ. Chúng tôi sẽ trở lại với tin chính sau phần quảng cáo."}], "qs": [{"n": 95, "q": "Who is John?", "qvi": "John là ai?", "opts": [{"t": "A reporter"}, {"t": "A policeman"}, {"t": "A bus driver"}, {"t": "An actor"}], "ans": ["A"], "ex": "\"Thank you, John, for the weekend weather update\" → phóng viên (bản tin thời tiết)."}, {"n": 96, "q": "How many vehicles were involved in the accident?", "qvi": "Bao nhiêu xe liên quan đến tai nạn?", "opts": [{"t": "One"}, {"t": "Two"}, {"t": "Three"}, {"t": "Four"}], "ans": ["C"], "ex": "\"a bus and two other vehicles\" → 3 xe."}, {"n": 97, "q": "What will be aired next?", "qvi": "Tiếp theo phát gì?", "opts": [{"t": "A weather update"}, {"t": "A traffic update"}, {"t": "Some advertisements"}, {"t": "The headline news"}], "ans": ["C"], "ex": "\"right after the commercial break\" → quảng cáo trước, rồi mới đến tin chính."}], "audio": "../audio/pem3/s95.mp3"}, {"title": "Bài nói 98–100", "tag": "Part 4", "script": [{"sp": "", "t": "I'd like to apologize for the noise the construction is making during the day. I know this can be somewhat disturbing, but we hope you will bear with it for a short while. As all of you know, we are expanding our office space to get ready for the expansion that is expected to happen early next year. The construction of the new offices will be completed by next week, so we are planning to interview candidates for the new project starting the Monday after next.", "vi": "Tôi xin lỗi vì tiếng ồn xây dựng ban ngày. Tôi biết điều này hơi phiền, mong mọi người chịu khó một thời gian ngắn. Như mọi người biết, chúng ta đang mở rộng văn phòng để chuẩn bị cho đợt mở rộng dự kiến đầu năm sau. Văn phòng mới sẽ xây xong vào tuần sau, nên chúng tôi dự định phỏng vấn ứng viên cho dự án mới từ thứ Hai tuần sau nữa."}], "qs": [{"n": 98, "q": "What is the talk mainly about?", "qvi": "Bài nói chủ yếu về gì?", "opts": [{"t": "An introduction of a new employee who has joined the company"}, {"t": "An award the company staff won"}, {"t": "A new building they will move into"}, {"t": "A plan for the company to hire more workers"}], "ans": ["D"], "ex": "Mở rộng văn phòng và sắp \"interview candidates\" → kế hoạch tuyển thêm người."}, {"n": 99, "q": "What will happen next week?", "qvi": "Tuần sau chuyện gì xảy ra?", "opts": [{"t": "The construction will come to an end."}, {"t": "The employees will move into a new building."}, {"t": "A new project will commence."}, {"t": "Some new office supplies will be delivered."}], "ans": ["A"], "ex": "\"will be completed by next week\" → việc xây dựng kết thúc."}, {"n": 100, "q": "When will they start looking for new workers?", "qvi": "Khi nào bắt đầu tìm người mới?", "opts": [{"t": "Next week"}, {"t": "In two weeks"}, {"t": "Next month"}, {"t": "Next year"}], "ans": ["B"], "ex": "\"starting the Monday after next\" = thứ Hai tuần sau nữa ≈ khoảng hai tuần nữa."}], "audio": "../audio/pem3/s98.mp3"}, {"title": "Part 5 · Câu 101", "tag": "Điền từ", "qs": [{"n": 101, "q": "Business owners should think about what ___ can do for the public.", "opts": [{"t": "he"}, {"t": "she"}, {"t": "they"}, {"t": "you"}], "ans": ["C"], "ex": "Chủ ngữ \"Business owners\" (số nhiều) → đại từ thay thế \"they\"."}]}, {"title": "Part 5 · Câu 102", "tag": "Điền từ", "qs": [{"n": 102, "q": "Please accept our ___ for last week's technical problems.", "opts": [{"t": "appreciation"}, {"t": "participation"}, {"t": "discussion"}, {"t": "apologies"}], "ans": ["D"], "ex": "accept our apologies = nhận lời xin lỗi (vì sự cố kỹ thuật)."}]}, {"title": "Part 5 · Câu 103", "tag": "Điền từ", "qs": [{"n": 103, "q": "All ___ in the meeting should register two weeks in advance.", "opts": [{"t": "participate"}, {"t": "participating"}, {"t": "participation"}, {"t": "participants"}], "ans": ["D"], "ex": "All + danh từ số nhiều (chỉ người): participants (người tham dự)."}]}, {"title": "Part 5 · Câu 104", "tag": "Điền từ", "qs": [{"n": 104, "q": "Complimentary airport shuttle services are ___ daily from 4:00 a.m. to 1:00 a.m.", "opts": [{"t": "approaching"}, {"t": "available"}, {"t": "expressed"}, {"t": "potential"}], "ans": ["B"], "ex": "be available = có sẵn (dịch vụ đưa đón có hằng ngày)."}]}, {"title": "Part 5 · Câu 105", "tag": "Điền từ", "qs": [{"n": 105, "q": "Monthly rents for the apartments ___ due by the 20th of each month.", "opts": [{"t": "is"}, {"t": "was"}, {"t": "are"}, {"t": "has"}], "ans": ["C"], "ex": "Chủ ngữ \"Monthly rents\" số nhiều → are (be due = đến hạn)."}]}, {"title": "Part 5 · Câu 106", "tag": "Điền từ", "qs": [{"n": 106, "q": "All the audience ___ to the speaker who addressed the influence of the recycling project.", "opts": [{"t": "listened"}, {"t": "told"}, {"t": "paid"}, {"t": "attended"}], "ans": ["A"], "ex": "listen TO sb: the audience listened to the speaker. (B) tell, (D) attend không đi với \"to\" ở đây."}]}, {"title": "Part 5 · Câu 107", "tag": "Điền từ", "qs": [{"n": 107, "q": "Mr. Chang, with ___ work experience and competence, deserves the promotion.", "opts": [{"t": "he"}, {"t": "his"}, {"t": "him"}, {"t": "himself"}], "ans": ["B"], "ex": "with + tính từ sở hữu + danh từ: with HIS work experience."}]}, {"title": "Part 5 · Câu 108", "tag": "Điền từ", "qs": [{"n": 108, "q": "Designing the bridge connecting the two regions was ___ than they had thought it would.", "opts": [{"t": "difficult"}, {"t": "difficulty"}, {"t": "more difficult"}, {"t": "much difficult"}], "ans": ["C"], "ex": "Có \"than\" → so sánh hơn: more difficult than."}]}, {"title": "Part 5 · Câu 109", "tag": "Điền từ", "qs": [{"n": 109, "q": "We are looking forward to ___ the possibility of working collaboratively.", "opts": [{"t": "discuss"}, {"t": "discussing"}, {"t": "discussed"}, {"t": "discussion"}], "ans": ["B"], "ex": "look forward to + V-ing: looking forward to discussing."}]}, {"title": "Part 5 · Câu 110", "tag": "Điền từ", "qs": [{"n": 110, "q": "We were ___ by Dr. Tyler's outstanding contribution to the development of the new vaccine.", "opts": [{"t": "impression"}, {"t": "impressed"}, {"t": "impressive"}, {"t": "impressing"}], "ans": ["B"], "ex": "Người bị tác động cảm xúc → V3/ed: We were impressed (chúng tôi ấn tượng)."}]}, {"title": "Part 5 · Câu 111", "tag": "Điền từ", "qs": [{"n": 111, "q": "Tickets to the Hannah Montana movie will ___ online starting next Friday.", "opts": [{"t": "have sold"}, {"t": "be selling"}, {"t": "be sold"}, {"t": "have been selling"}], "ans": ["C"], "ex": "Vé ĐƯỢC bán → bị động: will be sold."}]}, {"title": "Part 5 · Câu 112", "tag": "Điền từ", "qs": [{"n": 112, "q": "She ___ working at the company five years ago and is supposed to be promoted next month.", "opts": [{"t": "start"}, {"t": "is starting"}, {"t": "has started"}, {"t": "started"}], "ans": ["D"], "ex": "Có \"five years ago\" → quá khứ đơn: started."}]}, {"title": "Part 5 · Câu 113", "tag": "Điền từ", "qs": [{"n": 113, "q": "Peter who received an employee-of-the-month award has been a ___ colleague of mine since I joined the company.", "opts": [{"t": "close"}, {"t": "closely"}, {"t": "closest"}, {"t": "closeness"}], "ans": ["A"], "ex": "a ___ colleague: trước danh từ cần tính từ → close (đồng nghiệp thân)."}]}, {"title": "Part 5 · Câu 114", "tag": "Điền từ", "qs": [{"n": 114, "q": "The advertising companies promise that ___ automated ticketing service will provide more convenience.", "opts": [{"t": "they"}, {"t": "their"}, {"t": "them"}, {"t": "themselves"}], "ans": ["B"], "ex": "Trước cụm danh từ \"automated ticketing service\" cần tính từ sở hữu → their."}]}, {"title": "Part 5 · Câu 115", "tag": "Điền từ", "qs": [{"n": 115, "q": "Although oil prices have recently increased, the cost of raw materials has barely ___.", "opts": [{"t": "rise"}, {"t": "risen"}, {"t": "rising"}, {"t": "rose"}], "ans": ["B"], "ex": "has barely ___: hiện tại hoàn thành has + V3 → risen."}]}, {"title": "Part 5 · Câu 116", "tag": "Điền từ", "qs": [{"n": 116, "q": "___ the company's overall profits have declined, some of its products still sell quite well.", "opts": [{"t": "Despite"}, {"t": "However"}, {"t": "Until"}, {"t": "Although"}], "ans": ["D"], "ex": "Hai vế trái ngược (lợi nhuận giảm nhưng vài sản phẩm vẫn bán chạy), sau chỗ trống là mệnh đề → Although. Despite + danh từ."}]}, {"title": "Part 5 · Câu 117", "tag": "Điền từ", "qs": [{"n": 117, "q": "Please complete the evaluation form on the counter in front of you, and ----- it to us immediately.", "opts": [{"t": "replace"}, {"t": "rearrange"}, {"t": "rewrite"}, {"t": "return"}], "ans": ["D"], "ex": "Điền phiếu rồi NỘP LẠI cho chúng tôi → return."}]}, {"title": "Part 5 · Câu 118", "tag": "Điền từ", "qs": [{"n": 118, "q": "I heard that Mr. Roberts will ___ for the company for thirty years next month.", "opts": [{"t": "work"}, {"t": "has worked"}, {"t": "have been working"}, {"t": "working"}], "ans": ["A"], "ex": "Đáp án sách: (A) work. Lưu ý: có \"for thirty years next month\" nên đúng nhất về ngữ pháp là thì tương lai hoàn thành (will have worked / will have been working). Trong 4 lựa chọn chỉ có (A) đi được sau \"will\" mà không sai cấu trúc; (C) \"have been working\" thiếu \"have\" thì mới đúng."}]}, {"title": "Part 5 · Câu 119", "tag": "Điền từ", "qs": [{"n": 119, "q": "Hotel guests ----- request late check-out service should call the front desk.", "opts": [{"t": "who"}, {"t": "whose"}, {"t": "when"}, {"t": "what"}], "ans": ["A"], "ex": "Đại từ quan hệ chỉ người làm chủ ngữ: guests WHO request…"}]}, {"title": "Part 5 · Câu 120", "tag": "Điền từ", "qs": [{"n": 120, "q": "If he ___ his IT skills, he'd easily get a job.", "opts": [{"t": "improves"}, {"t": "will improve"}, {"t": "improved"}, {"t": "had improved"}], "ans": ["C"], "ex": "Câu điều kiện loại 2 (vế sau \"he'd get\") → If + quá khứ đơn: improved."}]}, {"title": "Part 5 · Câu 121", "tag": "Điền từ", "qs": [{"n": 121, "q": "For employees ___ stay with GSI for several months or years, their salaries will be transferred to a bank account they provide.", "opts": [{"t": "who"}, {"t": "whose"}, {"t": "when"}, {"t": "what"}], "ans": ["A"], "ex": "Chỉ người, làm chủ ngữ cho \"stay\" → who."}]}, {"title": "Part 5 · Câu 122", "tag": "Điền từ", "qs": [{"n": 122, "q": "Unlike ___ corporations, we are proud to offer the best company benefits to full-time employees.", "opts": [{"t": "much"}, {"t": "more"}, {"t": "many"}, {"t": "the most"}], "ans": ["C"], "ex": "Unlike + many + danh từ số nhiều: many corporations (nhiều công ty khác)."}]}, {"title": "Part 5 · Câu 123", "tag": "Điền từ", "qs": [{"n": 123, "q": "The shopping complex hired many security staff members in an effort to protect ___ customers.", "opts": [{"t": "they"}, {"t": "their"}, {"t": "theirs"}, {"t": "themselves"}], "ans": ["B"], "ex": "Trước danh từ customers → tính từ sở hữu their."}]}, {"title": "Part 5 · Câu 124", "tag": "Điền từ", "qs": [{"n": 124, "q": "The luxurious first-class hotel is ___ in the city, but it has easy access to the beach.", "opts": [{"t": "locating"}, {"t": "location"}, {"t": "located"}, {"t": "locate"}], "ans": ["C"], "ex": "be located in = nằm ở (khách sạn nằm trong thành phố)."}]}, {"title": "Part 5 · Câu 125", "tag": "Điền từ", "qs": [{"n": 125, "q": "If the ___ are not received within 5 days, please contact the head of the Shipping Department immediately.", "opts": [{"t": "shipping"}, {"t": "ship"}, {"t": "shipments"}, {"t": "shipped"}], "ans": ["C"], "ex": "the + danh từ, động từ \"are\" số nhiều → shipments (các lô hàng)."}]}, {"title": "Part 5 · Câu 126", "tag": "Điền từ", "qs": [{"n": 126, "q": "Neither the president ----- the sales manager spoke directly about the recent lay-offs.", "opts": [{"t": "or"}, {"t": "nor"}, {"t": "yet"}, {"t": "but"}], "ans": ["B"], "ex": "Cặp liên từ: Neither … nor."}]}, {"title": "Part 5 · Câu 127", "tag": "Điền từ", "qs": [{"n": 127, "q": "To remain competitive in today's business, executives should have expertise, experience, ___ insights into the global market.", "opts": [{"t": "and"}, {"t": "because"}, {"t": "after"}, {"t": "as"}], "ans": ["A"], "ex": "Liệt kê 3 thứ: expertise, experience, AND insights."}]}, {"title": "Part 5 · Câu 128", "tag": "Điền từ", "qs": [{"n": 128, "q": "The airline will reimburse passengers for damaged baggage when ___ are received.", "opts": [{"t": "complain"}, {"t": "complaining"}, {"t": "complains"}, {"t": "complaints"}], "ans": ["D"], "ex": "when ___ are received: cần danh từ số nhiều làm chủ ngữ → complaints."}]}, {"title": "Part 5 · Câu 129", "tag": "Điền từ", "qs": [{"n": 129, "q": "Last year's job fair in London was a remarkable ___, drawing over 200000 participants worldwide.", "opts": [{"t": "success"}, {"t": "successes"}, {"t": "succeed"}, {"t": "succeeding"}], "ans": ["A"], "ex": "a remarkable + danh từ số ít → success (một thành công)."}]}, {"title": "Part 5 · Câu 130", "tag": "Điền từ", "qs": [{"n": 130, "q": "The maintenance workers were informed of a wide ___ of problems with the electronic devices.", "opts": [{"t": "vary"}, {"t": "varies"}, {"t": "various"}, {"t": "variety"}], "ans": ["D"], "ex": "a wide variety of = rất nhiều loại."}]}, {"title": "Part 6 · Câu 131–134 · Thư hỏi đồ thất lạc", "tag": "Điền vào đoạn văn", "passage": ["Dear Lost and Found,", "I am writing this letter to ask you about my missing wallet.", "Last Friday, I ⟦131⟧ on your airline to go to Boston. I had my wallet when I boarded Flight No. 053 in Vancouver. After arriving in Boston, I took a taxi. When I tried to ⟦132⟧ for the taxi, I found my wallet was missing. I guess that I dropped my wallet on the plane. The wallet is brown leather, and there ⟦133⟧ several credit cards in my name in it. Could you kindly check if there is a missing wallet on the plane? ⟦134⟧.", "Regards,", "Luke Danes"], "qs": [{"n": 131, "q": "Chỗ trống (131)", "opts": [{"t": "flew"}, {"t": "rode"}, {"t": "boring"}, {"t": "useful"}], "ans": ["A"], "ex": "Kể chuyện đã đi máy bay (Last Friday, on your airline) → flew. Đi máy bay dùng fly, không dùng ride."}, {"n": 132, "q": "Chỗ trống (132)", "opts": [{"t": "fill"}, {"t": "pay"}, {"t": "enter"}, {"t": "make"}], "ans": ["B"], "ex": "pay for the taxi = trả tiền taxi (lúc đó mới thấy mất ví)."}, {"n": 133, "q": "Chỗ trống (133)", "opts": [{"t": "is"}, {"t": "are"}, {"t": "was"}, {"t": "were"}], "ans": ["B"], "ex": "\"several credit cards\" số nhiều → there are (ví vẫn đang chứa thẻ). Trong sách chọn (B) are."}, {"n": 134, "q": "Chỗ trống (134)", "opts": [{"t": "If you are interested, please contact us."}, {"t": "Thank you for informing us about the missing card."}, {"t": "We look forward to serving you in the future."}, {"t": "Thank you in advance."}], "ans": ["D"], "ex": "Cuối thư nhờ giúp → cảm ơn trước: Thank you in advance (D)."}]}, {"title": "Part 6 · Câu 135–138 · Thông báo đóng cửa căng tin", "tag": "Điền vào đoạn văn", "passage": ["We would like ⟦135⟧ you that the employee cafeteria on the second floor will be closed for renovations. These renovations will enable us to provide all of our employees with ⟦136⟧ service and food than now. The renovations will take ⟦137⟧ three days. The snack bar on the third floor will be open for drinks and snacks. ⟦138⟧ ."], "qs": [{"n": 135, "q": "Chỗ trống (135)", "opts": [{"t": "informing"}, {"t": "will inform"}, {"t": "information"}, {"t": "to inform"}], "ans": ["D"], "ex": "would like + to V: would like to inform you."}, {"n": 136, "q": "Chỗ trống (136)", "opts": [{"t": "good"}, {"t": "best"}, {"t": "better"}, {"t": "well"}], "ans": ["C"], "ex": "Có \"than now\" → so sánh hơn: better service."}, {"n": 137, "q": "Chỗ trống (137)", "opts": [{"t": "approximate"}, {"t": "approximations"}, {"t": "approximately"}, {"t": "more approximately"}], "ans": ["C"], "ex": "take approximately three days: trạng từ bổ nghĩa cho số lượng → approximately (khoảng)."}, {"n": 138, "q": "Chỗ trống (138)", "opts": [{"t": "Thank you for your cooperation."}, {"t": "I'm so sorry that we made a mistake while processing your order last week."}, {"t": "I hope to continue to do business with you for many years."}, {"t": "I understand this caused a terrible inconvenience for your business."}], "ans": ["A"], "ex": "Thông báo cho nhân viên về việc đóng căng tin → kết bằng \"Thank you for your cooperation\" (A). Các câu kia nói về đơn hàng, khách hàng."}]}, {"title": "Part 6 · Câu 139–142 · Thư nội bộ: Nhân viên của năm", "tag": "Điền vào đoạn văn", "passage": ["Subject: KOA Design Employee of the Year", "From: \"Eric Caron\" caron@koa.com", "Date: Thu, November 20, 2007 14:27:23 -0600", "Based on the committee's recommendations, I am pleased ⟦139⟧ the FY2007 KOA Design Employee of the Year. Mr. Pat Lockwood was chosen as the recipient of this prestigious award for his ⟦140⟧ to his project. He will receive a plaque along with a $3,000 cash award. Please extend your hearty congratulations to our FY2007 KOA Design Employee of the Year. KOA Design will host an Employee of the Year Award ceremony and reception at 3:00 p.m ⟦141⟧ December 11, 2007, at the KOA Design Headquarters in Silver Spring, Maryland. All KOA Design employees are invited. ⟦142⟧. Congratulations to all the nominated employees, and a special \"Thank You\" to all who were involved in the nomination process."], "qs": [{"n": 139, "q": "Chỗ trống (139)", "opts": [{"t": "announce"}, {"t": "to announce"}, {"t": "announcing"}, {"t": "to be announced"}], "ans": ["B"], "ex": "be pleased + to V: I am pleased to announce."}, {"n": 140, "q": "Chỗ trống (140)", "opts": [{"t": "contributions"}, {"t": "participants"}, {"t": "requests"}, {"t": "benefits"}], "ans": ["A"], "ex": "Được giải nhờ những ĐÓNG GÓP cho dự án → contributions."}, {"n": 141, "q": "Chỗ trống (141)", "opts": [{"t": "until"}, {"t": "on"}, {"t": "since"}, {"t": "through"}], "ans": ["B"], "ex": "on + ngày tháng cụ thể: on December 11."}, {"n": 142, "q": "Chỗ trống (142)", "opts": [{"t": "We hope to do more business with you soon."}, {"t": "We thank you for your order from Best Buy."}, {"t": "I encourage you to attend and celebrate this year's award."}, {"t": "You can use this on your next purchase."}], "ans": ["C"], "ex": "Câu trước \"All employees are invited\" → khuyến khích đến dự (C)."}]}, {"title": "Part 6 · Câu 143–146 · Quảng cáo nhà sách", "tag": "Điền vào đoạn văn", "passage": ["Booktopia Books & Music, Inc. is one of the most well-known book retailers in New York, ⟦143⟧ bookstores in all five boroughs under the brand names Booktopia, Blithe, Bliss, and Devours. Booktopia is also in business with an bookstore www.booktopiabooks.ny.com, which, in addition to books, carries a comprehensive online collection of recent music, movies, and stationery supplies. With its headquarter located in Manhattan, NY, Booklopia provides book lovers ⟦144⟧ stimulating and enjoyable experiences when shopping for books and other items that will enhance book lovers' knowledge as well as enrich their lives. Purchasing books through Booktopia's online bookshop ensures even more reliable services at more ⟦145⟧ prices. Visit our website at www.booktopiabooks.ny.com for more details on our company’s history and vision. ⟦146⟧ ."], "qs": [{"n": 143, "q": "Chỗ trống (143)", "opts": [{"t": "operating"}, {"t": "operate"}, {"t": "to operate"}, {"t": "is operating"}], "ans": ["A"], "ex": "Rút gọn mệnh đề chủ động: (which operates) → operating bookstores."}, {"n": 144, "q": "Chỗ trống (144)", "opts": [{"t": "to"}, {"t": "on"}, {"t": "into"}, {"t": "with"}], "ans": ["D"], "ex": "provide sb WITH sth = cung cấp cho ai cái gì."}, {"n": 145, "q": "Chỗ trống (145)", "opts": [{"t": "intelligent"}, {"t": "cheerful"}, {"t": "reasonable"}, {"t": "extended"}], "ans": ["C"], "ex": "reasonable prices = giá hợp lý."}, {"n": 146, "q": "Chỗ trống (146)", "opts": [{"t": "Your duties will be explained during the training session."}, {"t": "I am writing this letter to confirm that you will start working for Big Office Supplies on April 12."}, {"t": "Thank you for your support of this event."}, {"t": "You can also sign up for a membership to take advantage of member benefits and special offers."}], "ans": ["D"], "ex": "Cuối quảng cáo cửa hàng → mời đăng ký thành viên nhận ưu đãi (D)."}]}, {"title": "Part 7 · Câu 147–148", "tag": "1 văn bản", "passage": ["Marketing Director", "The Dooris Company is one of the best computer manufacturing companies in the world. We", "are now looking for an excellent marketing director.", "Responsibilities:", "Manage the marketing budget", "Develop effective marketing strategies", "Requirements:", "A minimum of 5 years of experience preferred", "Excellent written and oral communication skills", "Bilingual (English / Spanish) required", "Applicants should send a résumé and cover letter by March 1."], "qs": [{"n": 147, "q": "What is the purpose of this advertisement?", "qvi": "Mục đích của quảng cáo là gì?", "opts": [{"t": "To reduce the marketing budget"}, {"t": "To encourage employees to work harder"}, {"t": "To report on marketing strategies"}, {"t": "To hire an employee"}], "ans": ["D"], "ex": "\"We are now looking for an excellent marketing director\" → tuyển nhân viên."}, {"n": 148, "q": "What is NOT a requirement for the position?", "qvi": "Đâu KHÔNG phải yêu cầu của vị trí?", "opts": [{"t": "At least 5 years of experience"}, {"t": "Accounting experience"}, {"t": "Strong communication skills"}, {"t": "The ability to use English and Spanish"}], "ans": ["B"], "ex": "Yêu cầu: 5 năm kinh nghiệm, giao tiếp tốt, song ngữ Anh–Tây Ban Nha. Không có kinh nghiệm kế toán → (B)."}]}, {"title": "Part 7 · Câu 149–150", "tag": "1 văn bản", "passage": ["Distance Learning with Pacific International University", "Pacific International University (PIU) offers distance-learning degree programs for adult learners at the undergraduate and postgraduate levels. We provide you with self-paced programs taken online by correspondence or home study. PIU helps professional adults complete their educational goals. We allow adult students to finish college, to earn a degree, and to advance their careers. The University's online distance-learning degree programs are available throughout a wide range of majors and areas of study. For more information, you can request a brochure and visit our website at www.PlUdistance.edu."], "qs": [{"n": 149, "q": "What is the purpose of this advertisement?", "qvi": "Mục đích của quảng cáo là gì?", "opts": [{"t": "To provide scholarships for adults"}, {"t": "To inform adult learners of the importance of learning"}, {"t": "To talk about educational opportunities for adults"}, {"t": "To give tips on how to get a higher degree"}], "ans": ["C"], "ex": "Giới thiệu chương trình học từ xa cho người lớn → cơ hội học tập cho người lớn."}, {"n": 150, "q": "Where can one find further information on this education program?", "qvi": "Tìm thêm thông tin ở đâu?", "opts": [{"t": "In a newspaper"}, {"t": "On the Internet"}, {"t": "On a board"}, {"t": "In a magazine"}], "ans": ["B"], "ex": "\"visit our website\" → trên Internet."}]}, {"title": "Part 7 · Câu 151–152", "tag": "1 văn bản", "passage": ["Job Opportunity in Scope City", "Do you want to work for a chain of optics stores with plans for growth? Scope City is looking to hire a manager for its San Diego store. The current manager is retiring next month. Some experience in a managerial position is required. Applicants who are interested should submit their résumés by e-mail to Eddie Hursh: ehursh@scopecity.com or by mail to:", "E. Hursh", "Scope City", "730 Easy St. Simi Valley, CA 93065"], "qs": [{"n": 151, "q": "What is the purpose of this advertisement?", "qvi": "Mục đích của quảng cáo là gì?", "opts": [{"t": "To look for a manager"}, {"t": "To promote a new store in San Diego"}, {"t": "To hire a secretary"}, {"t": "To announce a manager's retirement"}], "ans": ["A"], "ex": "\"looking to hire a manager for its San Diego store\"."}, {"n": 152, "q": "Which of the following is NOT true about the advertisement?", "qvi": "Điều nào KHÔNG đúng?", "opts": [{"t": "Scope City is an optics store."}, {"t": "The manager's job is in San Diego."}, {"t": "One can apply for the job by visiting the store."}, {"t": "Managerial experience is necessary for the job."}], "ans": ["C"], "ex": "Nộp hồ sơ qua email hoặc gửi thư, không nói đến nộp trực tiếp ở cửa hàng → (C)."}]}, {"title": "Part 7 · Câu 153–154", "tag": "1 văn bản", "passage": ["Latino History Month Poetry and Music", "Time: 3:00-4:00 PM, Saturday, May 3, 2008", "Location: Highland Park Arts House located in mid-park on 65th Street", "Share the Latino-American experience with renowned poet German Roberto in Highland Park. This special event has been prepared to bring insights into Latino literary works. Not only can you enjoy popular modern poetry reading, but you can also interact with Mr. Roberto and the other participants in the event. Also, get ready for an exciting guitar performance by a live band and the following 5in9-a-lon9 session. This is a part of the Highland Park's Latino History Month programs. Admission's free. All ages are accepted. Free tickets are available at the Arts House, which is located in mid-park on 65th Street, starting at 2:00 PM on May 3. For more information, call 917-466 2767."], "qs": [{"n": 153, "q": "What is the notice mainly about?", "qvi": "Thông báo chủ yếu về gì?", "opts": [{"t": "To celebrate a Latino-American holiday"}, {"t": "To encourage families to attend a special event"}, {"t": "To sell poetry books and tickets for guitar performances"}, {"t": "To promote German Roberto's musical event"}], "ans": ["B"], "ex": "Giới thiệu một sự kiện đặc biệt (thơ và nhạc), miễn phí, mọi lứa tuổi → mời mọi người (gia đình) đến dự."}, {"n": 154, "q": "What is true about the performance?", "qvi": "Điều nào đúng về buổi biểu diễn?", "opts": [{"t": "There is an entrance fee."}, {"t": "Advance enrollment is required."}, {"t": "Children under 6 are not allowed to participate."}, {"t": "Additional details are available with a phone call."}], "ans": ["D"], "ex": "\"For more information, call 917-466-2767\" → gọi điện để biết thêm. Vào cửa miễn phí, mọi lứa tuổi nên (A), (C) sai."}]}, {"title": "Part 7 · Câu 155–157", "tag": "1 văn bản", "passage": ["From: Poturalic, Nerina (mailto:Nerina.Poturalic@Cartus.com)", "Sent: Thu 1124/2008 4:31 PM", "To: Our mailing list", "Subject: Speech Modification Private Tutoring", "Cartus, a leading provider of speech training, is urgently seeking a speech trainer to assist one of our customers who has recently moved to Manhattan. As a Cartus speech trainer, you should have at least two years' experience teaching private students. An advanced degree in Applied linguistics, MA TESOL, or a related field is preferred.", "If hired, you will work as an independent contractor on an as-needed basis and according to your availability. There is no minimum number of hours you must work, but we expect our trainers to work with the customer to accommodate his/her needs, both linguistically and logistically. You will be paid an hourly rate of $ 40-45 for teaching as well as be provided reimbursement for transportation and materials.", "We are willing to negotiate a schedule according to your availability. Please send a cover letter, resume, and your preferred work schedule to the e-mail address provided. Only successful candidates will be contacted."], "qs": [{"n": 155, "q": "What kind of job is offered in the advertisement?", "qvi": "Công việc được tuyển là gì?", "opts": [{"t": "A speech writer"}, {"t": "A moving expert"}, {"t": "A language trainer"}, {"t": "A school teacher"}], "ans": ["C"], "ex": "\"seeking a speech trainer\" → người dạy nói/ngôn ngữ."}, {"n": 156, "q": "What is NOT stated about the work if one is hired?", "qvi": "Điều nào KHÔNG được nêu?", "opts": [{"t": "The person may change his or her work schedule."}, {"t": "The person is expected to meet the customer's needs."}, {"t": "The person needs to work a minimum of 4-5 hours a day."}, {"t": "The person will work individually based on his or her availability."}], "ans": ["C"], "ex": "\"There is no minimum number of hours\" → (C) phải làm tối thiểu 4–5 tiếng là sai."}, {"n": 157, "q": "What does the compensation NOT include?", "qvi": "Khoản chi trả KHÔNG gồm gì?", "opts": [{"t": "Accommodations"}, {"t": "Free transportation"}, {"t": "Teaching materials"}, {"t": "Hourly rates"}], "ans": ["A"], "ex": "Được trả theo giờ, hoàn tiền đi lại và tài liệu. Không nhắc chỗ ở (accommodations)."}]}, {"title": "Part 7 · Câu 158–159", "tag": "1 văn bản", "passage": ["Knitting Class Series: Spring 2008", "Instructor: Bobbie Purnell", "First Session: February II, 25, March 3, 10 12-2 PM", "Second Session: March 17, 24, April 7, 14 12-2 PM", "Room: To be determined", "This is a wonderful opportunity for beginners to learn about the art of knitting and for", "experienced knitters to perfect their skills. Experienced and advanced-level knitters are also welcome.", "Fee: $15 for knitting materials. Fee will be waived if you bring your own materials. (Cash only)", "Capacity: 15 beginner-level students and up to 5 advanced-level students.", "Register: Please contact Bianca Mona, New Haven Diversity & Community Center at ws_divcomm@knitting.com or stop by 128 Zankel Building."], "qs": [{"n": 158, "q": "What has NOT been decided yet?", "qvi": "Điều gì CHƯA được quyết định?", "opts": [{"t": "The trainer of the class"}, {"t": "The number of classes"}, {"t": "The place of the class"}, {"t": "The payment method"}], "ans": ["C"], "ex": "\"Room: To be determined\" → địa điểm lớp học."}, {"n": 159, "q": "What should one do to enroll in the program?", "qvi": "Muốn đăng ký phải làm gì?", "opts": [{"t": "Contact the instructor"}, {"t": "Make a phone call"}, {"t": "Visit the cent
