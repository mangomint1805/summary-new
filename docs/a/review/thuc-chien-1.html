<script>window.MT={"vocab": [["Variety", "n", "/vəˈraɪ.ə.t̬i/", "Sự đa dạng", "The hotel restaurant offers a wide variety of dishes."], ["Fulfill", "v", "/fʊlˈfɪl/", "Đáp ứng, thực hiện", "Our staff work hard to fulfill your needs."], ["Reservation", "n", "/ˌrez.ɚˈveɪ.ʃən/", "Sự đặt chỗ, đặt phòng", "You can easily make a reservation online."], ["Suitcase", "n", "/ˈsuːt.keɪs/", "Va li", "A traveler is pulling a suitcase across the lobby."], ["Hand (over)", "v", "/hænd ˈoʊ.vɚ/", "Trao, đưa (cho ai)", "The receptionist hands over the room key."], ["Acclaimed", "adj", "/əˈkleɪmd/", "Được ca ngợi, nổi tiếng", "Our restaurant is led by an internationally acclaimed chef."], ["Critic", "n", "/ˈkrɪt̬.ɪk/", "Nhà phê bình", "A famous food critic gave our restaurant an excellent review."], ["Dining", "n", "/ˈdaɪ.nɪŋ/", "Việc ăn uống, dùng bữa", "Guests can enjoy an unforgettable dining experience."], ["Exotic", "adj", "/ɪɡˈzɑː.t̬ɪk/", "Lạ, đến từ nước ngoài", "The menu has both traditional and exotic dishes."], ["Vegetarian", "adj / n", "/ˌvedʒ.əˈter.i.ən/", "Ăn chay; người ăn chay", "We provide many options for vegetarian customers."], ["Substitute", "n", "/ˈsʌb.stə.tuːt/", "Vật / món thay thế", "The restaurant offers healthy meat substitutes."], ["Budget", "n", "/ˈbʌdʒ.ɪt/", "Ngân sách", "All of our services are offered within your budget."], ["Satisfied", "adj", "/ˈsæt̬.ɪs.faɪd/", "Hài lòng", "Most customers are satisfied with the hotel’s services."]], "n": "atc1", "part": 0, "partName": "Part 1 · Part 5, 6", "sub": "Accommodation & Restaurant · Nghe điền từ · Part 1 (6 câu) · Part 5 (20 câu) · Part 6 (4 câu)", "intro": "Trang này có <b>file nghe</b> và <b>chữa bài</b> phần luyện tập trên lớp của buổi <b>Unit 1 · Lesson 3 · Thực chiến đề thi (1)</b> (Giáo trình trang 22–27). <b>Cách học:</b> câu nghe thì bấm nghe → tự chọn (chữ đáp án được ẩn giống đề thật) → đọc dịch và giải thích. Câu đọc thì chọn đáp án rồi xem vì sao đúng, vì sao sai.", "stepsTitle": "Nhắc lại chiến lược", "steps": ["<b>Part 1 – S.E.A:</b> nhìn tranh trước khi nghe: Setting (ở đâu), Entity (ai, cái gì), Activity (đang làm gì). Câu <i>is/are being + V3</i> chỉ đúng khi có người đang làm việc đó.", "<b>Part 5, 6 – C.E.P:</b> nhìn 4 đáp án để phân loại (từ loại, thì, câu điều kiện, từ vựng) → loại đáp án sai → dự đoán từ dấu hiệu trong câu."], "groups": [{"title": "Nghe và điền từ (Track 01)", "tag": "Từ vựng", "audio": "../../audio/atc1/track01.mp3", "passage": ["At our hotel, guests can enjoy a wide **(1) variety** of services designed to **(2) fulfill** your needs. You can easily make a **(3) reservation** online before your trip. Once you arrive, you may see a traveler pull a **(4) suitcase** across the lobby while the receptionist politely **(5) hands** over the room key. Our restaurant is led by an internationally **(6) acclaimed** chef and has received excellent reviews from a famous food **(7) critic**. Guests can experience an unforgettable **(8) dining** experience with both traditional meals and **(9) exotic** dishes. We also provide options for **(10) vegetarian** customers, including healthy meat **(11) substitutes**. Before dinner, the staff carefully sets the table to create a welcoming atmosphere. All services are offered within **(12) budget**, so guests can fully enjoy their stay and be **(13) satisfied** with every aspect of their visit."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "At our hotel, guests can enjoy a wide (1) variety of services designed to (2) fulfill your needs. You can easily make a (3) reservation online before your trip. Once you arrive, you may see a traveler pull a (4) suitcase across the lobby while the receptionist politely (5) hands over the room key. Our restaurant is led by an internationally (6) acclaimed chef and has received excellent reviews from a famous food (7) critic. Guests can experience an unforgettable (8) dining experience with both traditional meals and (9) exotic dishes. We also provide options for (10) vegetarian customers, including healthy meat (11) substitutes. Before dinner, the staff carefully sets the table to create a welcoming atmosphere. All services are offered within (12) budget, so guests can fully enjoy their stay and be (13) satisfied with every aspect of their visit.", "vi": "Tại khách sạn của chúng tôi, khách có thể tận hưởng nhiều dịch vụ đa dạng nhằm đáp ứng nhu cầu của bạn. Bạn có thể dễ dàng đặt phòng trực tuyến trước chuyến đi. Khi đến nơi, bạn có thể thấy một du khách kéo va li ngang qua sảnh trong khi lễ tân lịch sự trao chìa khoá phòng. Nhà hàng của chúng tôi do một đầu bếp nổi tiếng quốc tế phụ trách và được một nhà phê bình ẩm thực nổi tiếng đánh giá rất cao. Khách sẽ có trải nghiệm ăn uống khó quên với cả món truyền thống lẫn món lạ. Chúng tôi cũng có lựa chọn cho khách ăn chay, gồm cả các món thay thế thịt tốt cho sức khoẻ. Trước bữa tối, nhân viên bày bàn cẩn thận để tạo không khí ấm cúng. Mọi dịch vụ đều nằm trong ngân sách, để khách tận hưởng trọn vẹn kỳ nghỉ và hài lòng với mọi điều."}], "qs": []}, {"title": "Part 1 · Câu 1", "tag": "Nhà hàng · bày bàn", "audio": "../../audio/atc1/p1-c1.mp3", "imgs": ["img/tc1/p1.webp"], "hideOpts": true, "qs": [{"n": 1, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "A man is rolling up some blinds.", "vi": "Một người đàn ông đang cuộn rèm lên."}, {"t": "A woman is setting the table.", "vi": "Một người phụ nữ đang bày bàn ăn."}, {"t": "A man is lighting some candles.", "vi": "Một người đàn ông đang thắp nến."}, {"t": "A woman is moving a chair.", "vi": "Một người phụ nữ đang di chuyển một chiếc ghế."}], "ans": ["B"], "key": "set the table = bày bàn ăn (đặt ly, dao nĩa, khăn)", "ex": "Tranh: một nữ phục vụ đang đặt đồ lên bàn có ly rượu → (B). (A), (C) nói về người đàn ông nhưng tranh không có đàn ông. (D) cô ấy không di chuyển ghế.", "label": "1"}]}, {"title": "Part 1 · Câu 2", "tag": "Sảnh khách sạn", "audio": "../../audio/atc1/p1-c2.mp3", "imgs": ["img/tc1/p2.webp"], "hideOpts": true, "qs": [{"n": 2, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "A flower pot is sitting on the floor.", "vi": "Một chậu hoa đang đặt trên sàn."}, {"t": "A man is behind a counter.", "vi": "Một người đàn ông đang đứng sau quầy."}, {"t": "Some lamps are built into a counter.", "vi": "Vài chiếc đèn được gắn trong quầy."}, {"t": "A woman is pulling a suitcase.", "vi": "Một người phụ nữ đang kéo va li."}], "ans": ["D"], "key": "pull a suitcase = kéo va li", "ex": "Tranh: một người phụ nữ đi về phía quầy lễ tân, tay kéo va li → (D). (A) không thấy chậu hoa dưới sàn. (B) sau quầy không có ai. (C) đèn treo trên trần, không gắn trong quầy.", "label": "2"}]}, {"title": "Part 1 · Câu 3", "tag": "Nhà hàng · phục vụ", "audio": "../../audio/atc1/p1-c3.mp3", "imgs": ["img/tc1/p3.webp"], "hideOpts": true, "qs": [{"n": 3, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "One of the men is serving food.", "vi": "Một trong những người đàn ông đang phục vụ đồ ăn."}, {"t": "A tray of food is placed on the table.", "vi": "Một khay đồ ăn được đặt trên bàn."}, {"t": "People are waiting in the lobby.", "vi": "Mọi người đang chờ ở sảnh."}, {"t": "People are sitting on sofas near the reception desk.", "vi": "Mọi người đang ngồi sofa gần quầy lễ tân."}], "ans": ["A"], "key": "serve food = phục vụ đồ ăn", "ex": "Tranh: người phục vụ đang bưng khay đồ ăn đến bàn khách → (A). (B) khay còn trên tay anh ấy, chưa đặt lên bàn. (C), (D) đây là nhà hàng, không phải sảnh hay quầy lễ tân.", "label": "3"}]}, {"title": "Part 1 · Câu 4", "tag": "Quầy lễ tân", "audio": "../../audio/atc1/p1-c4.mp3", "imgs": ["img/tc1/p4.webp"], "hideOpts": true, "qs": [{"n": 4, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "One of the women is handing over a key card.", "vi": "Một trong những người phụ nữ đang đưa thẻ chìa khoá phòng."}, {"t": "A man is sitting on the sofa.", "vi": "Một người đàn ông đang ngồi trên ghế sofa."}, {"t": "A woman is answering a phone call.", "vi": "Một người phụ nữ đang nghe điện thoại."}, {"t": "A woman is cleaning the floor.", "vi": "Một người phụ nữ đang lau sàn."}], "ans": ["A"], "key": "hand over a key card = đưa thẻ khoá phòng", "ex": "Tranh: lễ tân đưa thẻ phòng cho cặp khách đứng trước quầy → (A). (B) người đàn ông đang đứng. (C), (D) không ai nghe điện thoại hay lau sàn.", "label": "4"}]}, {"title": "Part 1 · Câu 5", "tag": "Nhà bếp", "audio": "../../audio/atc1/p1-c5.mp3", "imgs": ["img/tc1/p5.webp"], "hideOpts": true, "qs": [{"n": 5, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "One of the men is grabbing a plate of salad.", "vi": "Một trong những người đàn ông đang cầm lấy đĩa salad."}, {"t": "One of the men is stirring a pot of soup.", "vi": "Một trong những người đàn ông đang khuấy nồi súp."}, {"t": "One of the men is washing a plate.", "vi": "Một trong những người đàn ông đang rửa đĩa."}, {"t": "One of the men is speaking to a colleague.", "vi": "Một trong những người đàn ông đang nói chuyện với đồng nghiệp."}], "ans": ["A"], "key": "grab a plate = cầm/lấy một cái đĩa", "ex": "Tranh: đầu bếp cầm đĩa salad trên quầy → (A). (B) không có nồi súp. (C) không ai rửa đĩa. (D) các đầu bếp đang làm việc, không nói chuyện với nhau.", "label": "5"}]}, {"title": "Part 1 · Câu 6", "tag": "Tranh không có người", "audio": "../../audio/atc1/p1-c6.mp3", "imgs": ["img/tc1/p6.webp"], "hideOpts": true, "qs": [{"n": 6, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "Windows overlooking a garden have been opened.", "vi": "Các cửa sổ nhìn ra vườn đã được mở."}, {"t": "Tables have been set up in a large room.", "vi": "Bàn đã được sắp đặt trong một căn phòng lớn."}, {"t": "Plates are being placed on each table.", "vi": "Đĩa đang được đặt lên từng bàn."}, {"t": "Chairs are being pushed into a table.", "vi": "Ghế đang được đẩy vào bàn."}], "ans": ["B"], "key": "have been set up = đã được sắp đặt (trạng thái)", "ex": "Phòng ăn trống, bàn ghế đã xếp sẵn → (B). (A) cửa sổ đang đóng. (C), (D) dạng <i>is/are being + V3</i> (đang được làm) chỉ đúng khi có người đang làm, mà tranh không có ai.", "label": "6"}]}, {"title": "Part 5 · Câu 1", "tag": "Cụm cố định", "qs": [{"n": 7, "q": "The restaurant offers a variety ___ international dishes for its guests.", "qvi": "Nhà hàng có nhiều món ăn quốc tế cho khách.", "opts": [{"t": "of"}, {"t": "in"}, {"t": "for"}, {"t": "with"}], "ans": ["A"], "key": "", "ex": "a variety of + N = nhiều loại …", "label": "1"}]}, {"title": "Part 5 · Câu 2", "tag": "Từ loại", "qs": [{"n": 8, "q": "The chef is internationally ___ for his creative menu.", "qvi": "Đầu bếp nổi tiếng quốc tế nhờ thực đơn sáng tạo.", "opts": [{"t": "acclaim"}, {"t": "acclaimed"}, {"t": "acclaiming"}, {"t": "acclaims"}], "ans": ["B"], "key": "", "ex": "Sau be + trạng từ (internationally) cần tính từ: be acclaimed for = được ca ngợi vì.", "label": "2"}]}, {"title": "Part 5 · Câu 3", "tag": "Cụm động từ", "qs": [{"n": 9, "q": "The receptionist will ___ over your room key at check-in.", "qvi": "Lễ tân sẽ trao chìa khoá phòng cho bạn khi nhận phòng.", "opts": [{"t": "food"}, {"t": "fulfill"}, {"t": "hand"}, {"t": "pull"}], "ans": ["C"], "key": "", "ex": "hand over = trao, đưa. Sau will cần V nguyên mẫu; \"food\" là danh từ.", "label": "3"}]}, {"title": "Part 5 · Câu 4", "tag": "Từ vựng", "qs": [{"n": 10, "q": "The menu includes several ___ for customers who do not eat meat.", "qvi": "Thực đơn có vài món thay thế thịt cho khách không ăn thịt.", "opts": [{"t": "banquet"}, {"t": "exquisite"}, {"t": "meat substitutes"}, {"t": "napkin"}], "ans": ["C"], "key": "", "ex": "several + danh từ số nhiều; \"không ăn thịt\" → meat substitutes (món thay thế thịt).", "label": "4"}]}, {"title": "Part 5 · Câu 5", "tag": "Từ loại", "qs": [{"n": 11, "q": "Tourists often visit the restaurant to try its ___ dishes.", "qvi": "Du khách thường đến nhà hàng để thử các món lạ.", "opts": [{"t": "exotically"}, {"t": "exotic"}, {"t": "critic"}, {"t": "needs"}], "ans": ["B"], "key": "", "ex": "Trước danh từ (dishes) cần tính từ: exotic (lạ, ngoại lai). exotically là trạng từ.", "label": "5"}]}, {"title": "Part 5 · Câu 6", "tag": "Cụm cố định", "qs": [{"n": 12, "q": "Most customers are ___ with the hotel's services.", "qvi": "Hầu hết khách hàng hài lòng với dịch vụ của khách sạn.", "opts": [{"t": "satisfied"}, {"t": "set"}, {"t": "ingredients"}, {"t": "patrons"}], "ans": ["A"], "key": "", "ex": "be satisfied with = hài lòng với.", "label": "6"}]}, {"title": "Part 5 · Câu 7", "tag": "Từ loại", "qs": [{"n": 13, "q": "A famous food ___ recently reviewed the hotel restaurant.", "qvi": "Một nhà phê bình ẩm thực nổi tiếng vừa đánh giá nhà hàng của khách sạn.", "opts": [{"t": "critic"}, {"t": "criticize"}, {"t": "criticizes"}, {"t": "criticizing"}], "ans": ["A"], "key": "", "ex": "Sau a famous food cần danh từ chỉ người làm chủ ngữ: food critic (nhà phê bình ẩm thực).", "label": "7"}]}, {"title": "Part 5 · Câu 8", "tag": "Từ loại", "qs": [{"n": 14, "q": "The hotel provides special meals for ___ guests.", "qvi": "Khách sạn có bữa ăn đặc biệt cho khách ăn chay.", "opts": [{"t": "vegetable"}, {"t": "vegetarian"}, {"t": "vegetarians"}, {"t": "vegetate"}], "ans": ["B"], "key": "", "ex": "Trước danh từ guests cần tính từ: vegetarian guests (khách ăn chay). vegetarians là danh từ số nhiều.", "label": "8"}]}, {"title": "Part 5 · Câu 9", "tag": "Cụm cố định", "qs": [{"n": 15, "q": "Our staff will fulfill your needs and keep everything ___.", "qvi": "Nhân viên sẽ đáp ứng nhu cầu và giữ mọi thứ trong ngân sách.", "opts": [{"t": "within budget"}, {"t": "in budget"}, {"t": "on budget"}, {"t": "budget"}], "ans": ["A"], "key": "", "ex": "within budget = trong phạm vi ngân sách.", "label": "9"}]}, {"title": "Part 5 · Câu 10", "tag": "To + V", "qs": [{"n": 16, "q": "I can't figure out which ingredients the chef used to ___ this dish.", "qvi": "Tôi không đoán ra đầu bếp dùng nguyên liệu gì để nêm món này.", "opts": [{"t": "flavored"}, {"t": "flavorful"}, {"t": "flavors"}, {"t": "flavor"}], "ans": ["D"], "key": "", "ex": "used to + V nguyên mẫu (dùng để …): to flavor = tạo hương vị, nêm nếm.", "label": "10"}]}, {"title": "Part 5 · Câu 11", "tag": "Động từ khuyết thiếu", "qs": [{"n": 17, "q": "The restaurant can easily ___ up to 200 guests for a special event.", "qvi": "Nhà hàng có thể dễ dàng phục vụ tới 200 khách cho sự kiện đặc biệt.", "opts": [{"t": "accommodated"}, {"t": "accumulating"}, {"t": "accommodate"}, {"t": "accommodating"}], "ans": ["C"], "key": "", "ex": "can + V nguyên mẫu → accommodate (đủ chỗ cho).", "label": "11"}]}, {"title": "Part 5 · Câu 12", "tag": "Từ loại + nghĩa", "qs": [{"n": 18, "q": "The chef prepared an ___ dish that impressed all the guests.", "qvi": "Đầu bếp làm một món tinh tế khiến mọi khách đều ấn tượng.", "opts": [{"t": "exotic"}, {"t": "exotically"}, {"t": "exquisitely"}, {"t": "exquisite"}], "ans": ["D"], "key": "", "ex": "Trước danh từ cần tính từ (exotic / exquisite). \"impressed all the guests\" → exquisite (tinh tế, tuyệt hảo) hợp nghĩa nhất. Theo đáp án sách: (D).", "label": "12"}]}, {"title": "Part 5 · Câu 13", "tag": "Từ loại", "qs": [{"n": 19, "q": "The menu features a variety of ___ dishes, including vegan options.", "qvi": "Thực đơn có nhiều món chay, gồm cả lựa chọn thuần chay.", "opts": [{"t": "vegetarian"}, {"t": "vegetate"}, {"t": "vegetarians"}, {"t": "vegetated"}], "ans": ["A"], "key": "", "ex": "Trước danh từ dishes cần tính từ: vegetarian dishes.", "label": "13"}]}, {"title": "Part 5 · Câu 14", "tag": "Từ vựng", "qs": [{"n": 20, "q": "The hotel provides free Wi-Fi and other ___ for all guests.", "qvi": "Khách sạn có Wi-Fi miễn phí và các tiện nghi khác cho mọi khách.", "opts": [{"t": "amenities"}, {"t": "ingredients"}, {"t": "entrees"}, {"t": "patrons"}], "ans": ["A"], "key": "", "ex": "Wi-Fi and other amenities = các tiện nghi khác.", "label": "14"}]}, {"title": "Part 5 · Câu 15", "tag": "Từ vựng", "qs": [{"n": 21, "q": "Th  about your room availability."}, {"t": "The hotel is located far from the city center."}, {"t": "I have already canceled my trip."}], "ans": ["B"], "key": "Điền câu", "ex": "Thư đang hỏi đặt phòng và câu sau nói về thời gian đi → (B) muốn biết thêm phòng trống. (A), (D) trái ý (không đi / đã huỷ). (C) không liên quan.", "label": "3"}, {"n": 30, "q": "Chỗ trống (4)", "qvi": "", "opts": [{"t": "appreciate"}, {"t": "appreciation"}, {"t": "appreciated"}, {"t": "appreciating"}], "ans": ["C"], "key": "Bị động", "ex": "would be (greatly) + V3 → bị động: An early reply would be greatly appreciated = Rất mong được hồi âm sớm.", "label": "4"}]}], "recap": "<h2>Ghi nhớ sau bài</h2><p>Làm lại các câu sai sau 2–3 ngày. Ôn từ vựng của buổi bằng nút <b>🃏 Flashcard</b> ở cuối trang.</p>", "qviAfter": true};</script>
