<script>window.MT={"vocab": [["employee dispute", "n", "/ɪmˈplɔɪiː dɪˈspjuːt/", "tranh chấp giữa nhân viên", "An employee dispute has affected communication."], ["scheduling conflict", "n", "/ˈskedʒuːlɪŋ ˈkɑːnflɪkt/", "trùng lịch", "A scheduling conflict occurred last week."], ["reporting procedure", "n", "/rɪˈpɔːrtɪŋ prəˈsiːdʒər/", "quy trình báo cáo", "Managers reviewed the reporting procedure."], ["workload", "n", "/ˈwɜːrkloʊd/", "khối lượng công việc", "The new staff will reduce the workload."], ["staff shortage", "n", "/stæf ˈʃɔːrtɪdʒ/", "thiếu nhân sự", "Many companies face a staff shortage."], ["technical issue", "n", "/ˈteknɪkl ˈɪʃuː/", "sự cố kỹ thuật", "Due to a technical issue, employees could not log in."]], "n": "atc6", "part": 0, "partName": "Part 4 · Part 5, 6 · Part 7", "sub": "Work Issues · Nghe điền từ · Part 4 (9 câu) · Part 5 (20 câu) · Part 6 (4 câu) · Part 7 (9 câu)", "intro": "Trang này có <b>file nghe</b> và <b>chữa bài</b> phần luyện tập trên lớp của buổi <b>Unit 6 · Lesson 3 · Thực chiến đề thi (6)</b> (Giáo trình trang 170–179). <b>Cách học:</b> câu nghe thì bấm nghe → tự chọn → mở lời thoại và dịch. Câu đọc thì chọn đáp án rồi xem vì sao đúng, vì sao sai.", "stepsTitle": "Nhắc lại chiến lược", "steps": ["<b>Part 4:</b> đọc trước 3 câu hỏi; mục đích/ý chính nghe 1–2 câu đầu, chi tiết (ngày, số) nghe đúng chỗ có từ khoá, yêu cầu/việc tiếp theo nghe cuối bài.", "<b>Part 5, 6 – C.E.P:</b> nhìn 4 đáp án để phân loại (từ loại, thì, to V/V-ing, đại từ quan hệ, từ vựng) → loại đáp án sai → chọn theo dấu hiệu trong câu.", "<b>Part 7:</b> đọc câu hỏi trước, tìm từ khoá trong bài; đáp án đúng thường là cách nói khác (paraphrase) của câu trong bài. Câu hỏi đoạn kép cần ghép thông tin 2 đoạn."], "groups": [{"title": "Nghe và điền từ (Track 1)", "tag": "Từ vựng", "audio": "../../audio/atc6/track1.mp3", "passage": ["Good morning, everyone. Recently, an employee **(1) dispute** between two members of the sales team has affected communication within the department. Because of this situation, a scheduling **(2) conflict** occurred during the preparation of a client presentation. Managers met with both employees yesterday and reviewed the reporting **(3) procedure** to ensure that future concerns are handled correctly. We believe these steps will prevent similar problems and reduce the **(4) workload** on other team members who have been covering additional responsibilities. Thank you for your cooperation."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "Good morning, everyone. Recently, an employee (1) dispute between two members of the sales team has affected communication within the department. Because of this situation, a scheduling (2) conflict occurred during the preparation of a client presentation. Managers met with both employees yesterday and reviewed the reporting (3) procedure to ensure that future concerns are handled correctly. We believe these steps will prevent similar problems and reduce the (4) workload on other team members who have been covering additional responsibilities. Thank you for your cooperation.", "vi": "Chào buổi sáng mọi người. Gần đây, một tranh chấp giữa hai nhân viên nhóm bán hàng đã ảnh hưởng tới việc trao đổi trong phòng. Vì vậy đã xảy ra trùng lịch khi chuẩn bị bài thuyết trình cho khách hàng. Hôm qua quản lý đã gặp cả hai và xem lại quy trình báo cáo để sau này các vấn đề được xử lý đúng. Chúng tôi tin các bước này sẽ ngăn chuyện tương tự và giảm khối lượng công việc cho những người đang phải gánh thêm việc. Cảm ơn mọi người đã hợp tác."}], "qs": []}, {"title": "Part 4 · Câu 1–3", "tag": "Thông báo · máy in hỏng", "audio": "../../audio/atc6/p4-c1.mp3", "scriptLabel": "📜 Lời thoại + dịch (mở sau khi đã nghe)", "script": [{"sp": "", "t": "Good morning, everyone. We are having a problem with the office printer on the second floor. Because of this issue, employees cannot print documents at the moment.", "vi": "Chào mọi người. Máy in văn phòng ở tầng hai đang gặp sự cố. Vì vậy hiện tại nhân viên không in tài liệu được."}, {"sp": "", "t": "The IT team is working on the problem and expects to fix it by noon. Until then, please use the printer on the third floor.", "vi": "Đội IT đang xử lý và dự kiến sửa xong trước trưa. Trong lúc chờ, vui lòng dùng máy in tầng ba."}, {"sp": "", "t": "We apologize for any inconvenience and appreciate your patience while the repairs are being completed.", "vi": "Xin lỗi vì sự bất tiện và cảm ơn mọi người đã kiên nhẫn trong lúc sửa chữa."}], "qs": [{"n": 1, "q": "What problem is mentioned?", "qvi": "Vấn đề nào được nhắc tới?", "opts": [{"t": "A scheduling conflict"}, {"t": "A printer problem"}, {"t": "A staff shortage"}, {"t": "A customer complaint"}], "ans": ["B"], "key": "Câu hỏi ý chính", "ex": "\"We are having a problem with the office printer\" → (B).", "label": "1"}, {"n": 2, "q": "Who is working on the issue?", "qvi": "Ai đang xử lý sự cố?", "opts": [{"t": "The IT team"}, {"t": "Customers"}, {"t": "Department managers"}, {"t": "New employees"}], "ans": ["A"], "key": "Câu hỏi chi tiết", "ex": "\"The IT team is working on the problem\" → (A).", "label": "2"}, {"n": 3, "q": "What are employees asked to do?", "qvi": "Nhân viên được yêu cầu làm gì?", "opts": [{"t": "Work from home"}, {"t": "Wait until tomorrow"}, {"t": "Use another printer"}, {"t": "Attend a meeting"}], "ans": ["C"], "key": "Câu hỏi yêu cầu", "ex": "\"please use the printer on the third floor\" → dùng máy in khác (C). (B) bẫy: sửa xong trước trưa nay, không phải ngày mai.", "label": "3"}]}, {"title": "Part 4 · Câu 4–6", "tag": "Tin nhắn điện thoại", "audio": "../../audio/atc6/p4-c2.mp3", "scriptLabel": "📜 Lời thoại + dịch (mở sau khi đã nghe)", "script": [{"sp": "", "t": "Hello, Ms. Green. This is Alex Brown from Human Resources. I'm calling about your request for additional staff.", "vi": "Chào chị Green. Tôi là Alex Brown phòng Nhân sự. Tôi gọi về yêu cầu bổ sung nhân sự của chị."}, {"sp": "", "t": "Because the sales department has been very busy this month, management has approved one temporary employee to help your team. The new employee will start work next Monday.", "vi": "Vì tháng này phòng kinh doanh rất bận, ban giám đốc đã duyệt một nhân viên tạm thời hỗ trợ nhóm chị. Nhân viên mới sẽ bắt đầu làm từ thứ Hai tới."}, {"sp": "", "t": "We hope this additional support will help your department manage the workload more efficiently.", "vi": "Hy vọng sự hỗ trợ này giúp phòng chị xử lý khối lượng công việc hiệu quả hơn."}], "qs": [{"n": 4, "q": "Why is the speaker calling?", "qvi": "Vì sao người nói gọi điện?", "opts": [{"t": "To discuss a customer order"}, {"t": "To give an update on a staffing request"}, {"t": "To schedule a meeting"}, {"t": "To explain a company policy"}], "ans": ["B"], "key": "Câu hỏi mục đích", "ex": "\"I'm calling about your request for additional staff\" + đã được duyệt → cập nhật yêu cầu nhân sự (B).", "label": "4"}, {"n": 5, "q": "Why does the sales department need help?", "qvi": "Vì sao phòng kinh doanh cần hỗ trợ?", "opts": [{"t": "It is very busy."}, {"t": "It lost some customers."}, {"t": "It moved to a new office."}, {"t": "It hired new employees."}], "ans": ["A"], "key": "Câu hỏi lý do", "ex": "\"Because the sales department has been very busy this month\" → (A).", "label": "5"}, {"n": 6, "q": "When will the new employee start work?", "qvi": "Khi nào nhân viên mới bắt đầu làm?", "opts": [{"t": "Tomorrow"}, {"t": "This Friday"}, {"t": "Next Monday"}, {"t": "Next month"}], "ans": ["C"], "key": "Câu hỏi chi tiết · thời gian", "ex": "\"The new employee will start work next Monday\" → (C).", "label": "6"}]}, {"title": "Part 4 · Câu 7–9", "tag": "Bài nói · cuối buổi họp", "audio": "../../audio/atc6/p4-c3.mp3", "scriptLabel": "📜 Lời thoại + dịch (mở sau khi đã nghe)", "script": [{"sp": "", "t": "Before we finish today's meeting, I'd like to talk about a common problem. Several employees have submitted reports after the deadline.", "vi": "Trước khi kết thúc buổi họp hôm nay, tôi muốn nói về một vấn đề hay gặp. Một số nhân viên đã nộp báo cáo trễ hạn."}, {"sp": "", "t": "Please make sure all reports are completed on time. Starting next week, managers will send reminder e-mails two days before each deadline.", "vi": "Mọi người hãy đảm bảo hoàn thành báo cáo đúng hạn. Từ tuần sau, quản lý sẽ gửi e-mail nhắc trước mỗi hạn chót hai ngày."}, {"sp": "", "t": "Thank you for your cooperation and for helping us improve our work efficiency together.", "vi": "Cảm ơn mọi người đã hợp tác để cùng nâng cao hiệu quả công việc."}], "qs": [{"n": 7, "q": "What problem does the speaker mention?", "qvi": "Người nói nhắc tới vấn đề gì?", "opts": [{"t": "Missing equipment"}, {"t": "Late reports"}, {"t": "Employee disputes"}, {"t": "Technical issues"}], "ans": ["B"], "key": "Câu hỏi ý chính", "ex": "\"Several employees have submitted reports after the deadline\" → báo cáo trễ (B).", "label": "7"}, {"n": 8, "q": "What should employees do?", "qvi": "Nhân viên nên làm gì?", "opts": [{"t": "Attend training sessions"}, {"t": "Submit reports on time"}, {"t": "Work overtime"}, {"t": "Contact customers"}], "ans": ["B"], "key": "Câu hỏi yêu cầu", "ex": "\"Please make sure all reports are completed on time\" → (B).", "label": "8"}, {"n": 9, "q": "What will managers do starting next week?", "qvi": "Từ tuần sau quản lý sẽ làm gì?", "opts": [{"t": "Hire new employees"}, {"t": "Review salaries"}, {"t": "Send reminder e-mails"}, {"t": "Hold daily meetings"}], "ans": ["C"], "key": "Câu hỏi chi tiết", "ex": "\"Starting next week, managers will send reminder e-mails\" → (C).", "label": "9"}]}, {"title": "Part 5 · Câu 1", "tag": "To V", "qs": [{"n": 10, "q": "Employees are encouraged ___ safety procedures at all times.", "qvi": "Nhân viên được khuyến khích luôn tuân thủ quy trình an toàn.", "opts": [{"t": "following"}, {"t": "follow"}, {"t": "to follow"}, {"t": "followed"}], "ans": ["C"], "key": "", "ex": "be encouraged + to V → to follow.", "label": "1"}]}, {"title": "Part 5 · Câu 2", "tag": "Từ vựng", "qs": [{"n": 11, "q": "Several departments are struggling with an increased ___ due to a rise in customer orders.", "qvi": "Nhiều phòng ban đang vất vả vì khối lượng công việc tăng do đơn hàng tăng.", "opts": [{"t": "workload"}, {"t": "dispute"}, {"t": "shortage"}, {"t": "policy"}], "ans": ["A"], "key": "", "ex": "Đơn hàng tăng → increased workload (khối lượng công việc tăng).", "label": "2"}]}, {"title": "Part 5 · Câu 3", "tag": "To V", "qs": [{"n": 12, "q": "The manager plans ___ additional staff before the busy season begins.", "qvi": "Quản lý dự định tuyển thêm nhân viên trước mùa cao điểm.", "opts": [{"t": "hiring"}, {"t": "hire"}, {"t": "to hire"}, {"t": "hired"}], "ans": ["C"], "key": "", "ex": "plan + to V → to hire.", "label": "3"}]}, {"title": "Part 5 · Câu 4", "tag": "Từ vựng", "qs": [{"n": 13, "q": "Many companies face a serious ___ of skilled workers in rural areas.", "qvi": "Nhiều công ty thiếu trầm trọng lao động có tay nghề ở nông thôn.", "opts": [{"t": "workload"}, {"t": "shortage"}, {"t": "conflict"}, {"t": "deadline"}], "ans": ["B"], "key": "", "ex": "a shortage of + N = sự thiếu hụt …", "label": "4"}]}, {"title": "Part 5 · Câu 5", "tag": "V-ing", "qs": [{"n": 14, "q": "We appreciate ___ informed about the changes to the project schedule.", "qvi": "Chúng tôi cảm ơn vì được thông báo về thay đổi lịch dự án.", "opts": [{"t": "being"}, {"t": "be"}, {"t": "to be"}, {"t": "been"}], "ans": ["A"], "key": "", "ex": "appreciate + V-ing; được thông báo (bị động) → being informed.", "label": "5"}]}, {"title": "Part 5 · Câu 6", "tag": "Từ vựng", "qs": [{"n": 15, "q": "The Human Resources department is trying to resolve several employee ___.", "qvi": "Phòng nhân sự đang cố giải quyết vài tranh chấp giữa nhân viên.", "opts": [{"t": "disputes"}, {"t": "workloads"}, {"t": "deadlines"}, {"t": "forecasts"}], "ans": ["A"], "key": "", "ex": "resolve disputes = giải quyết tranh chấp; several + số nhiều.", "label": "6"}]}, {"title": "Part 5 · Câu 7", "tag": "To V", "qs": [{"n": 16, "q": "The director instructed all employees ___ the updated reporting form.", "qvi": "Giám đốc yêu cầu mọi nhân viên hoàn thành mẫu báo cáo mới.", "opts": [{"t": "complete"}, {"t": "completed"}, {"t": "completing"}, {"t": "to complete"}], "ans": ["D"], "key": "", "ex": "instruct sb + to V → to complete.", "label": "7"}]}, {"title": "Part 5 · Câu 8", "tag": "Từ vựng", "qs": [{"n": 17, "q": "Due to a technical ___, employees were unable to access the company network.", "qvi": "Do sự cố kỹ thuật, nhân viên không vào được mạng công ty.", "opts": [{"t": "workload"}, {"t": "shortage"}, {"t": "issue"}, {"t": "dispute"}], "ans": ["C"], "key": "", "ex": "technical issue = sự cố kỹ thuật.", "label": "8"}]}, {"title": "Part 5 · Câu 9", "tag": "V-ing sau giới từ", "qs": [{"n": 18, "q": "Before ___ the report, please double-check all financial figures.", "qvi": "Trước khi nộp báo cáo, hãy kiểm tra lại mọi số liệu tài chính.", "opts": [{"t": "submit"}, {"t": "submitting"}, {"t": "submitted"}, {"t": "to submit"}], "ans": ["B"], "key": "", "ex": "Sau giới từ (before) → V-ing: submitting.", "label": "9"}]}, {"title": "Part 5 · Câu 10", "tag": "Từ vựng", "qs": [{"n": 19, "q": "Managers are concerned that frequent project ___ may increase costs.", "qvi": "Quản lý lo rằng dự án thường xuyên chậm trễ có thể làm tăng chi phí.", "opts": [{"t": "delays"}, {"t": "disputes"}, {"t": "shortages"}, {"t": "policies"}], "ans": ["A"], "key": "", "ex": "project delays = sự chậm trễ dự án → tăng chi phí.", "label": "10"}]}, {"title": "Part 5 · Câu 11", "tag": "To V", "qs": [{"n": 20, "q": "The company hopes ___ productivity by introducing new software.", "qvi": "Công ty hy vọng tăng năng suất nhờ dùng phần mềm mới.", "opts": [{"t": "increasing"}, {"t": "increase"}, {"t": "to increase"}, {"t": "increased"}], "ans": ["C"], "key": "", "ex": "hope + to V → to increase.", "label": "11"}]}, {"title": "Part 5 · Câu 12", "tag": "Từ vựng", "qs": [{"n": 21, "q": "Several employees remained ___ about the new office procedures.", "qvi": "Vài nhân viên vẫn còn bối rối về quy trình văn phòng mới.", "opts": [{"t": "flexible"}, {"t": "confused"}, {"t": "adequate"}, {"t": "accountable"}], "ans": ["B"], "key": "", "ex": "remain + tính từ; be confused about = bối rối về.", "label": "12"}]}, {"title": "Part 5 · Câu 13", "tag": "V-ing", "qs": [{"n": 22, "q": "Staff members should avoid ___ confidential information with outsiders.", "qvi": "Nhân viên nên tránh chia sẻ thông tin mật với người ngoài.", "opts": [{"t": "share"}, {"t": "shared"}, {"t": "to share"}, {"t": "sharing"}], "ans": ["D"], "key": "", "ex": "avoid + V-ing → sharing.", "label": "13"}]}, {"title": "Part 5 · Câu 14", "tag": "V-ing", "qs": [{"n": 23, "q": "The supervisor had difficulty ___ qualified technicians for the project.", "qvi": "Người giám sát gặp khó khăn khi tìm kỹ thuật viên đủ trình độ.", "opts": [{"t": "finding"}, {"t": "find"}, {"t": "found"}, {"t": "to find"}], "ans": ["A"], "key": "", "ex": "have difficulty + V-ing → finding.", "label": "14"}]}, {"title": "Part 5 · Câu 15", "tag": "Từ vựng", "qs": [{"n": 24, "q": "Local businesses are facing unfavorable economic ___ this year.", "qvi": "Năm nay doanh nghiệp địa phương đang đối mặt điều kiện kinh tế bất lợi.", "opts": [{"t": "conditions"}, {"t": "disputes"}, {"t": "deadlines"}, {"t": "workloads"}], "ans": ["A"], "key": "", "ex": "economic conditions = điều kiện kinh tế.", "label": "15"}]}, {"title": "Part 5 · Câu 16", "tag": "To V", "qs": [{"n": 25, "q": "It is important ___ customer complaints promptly.", "qvi": "Xử lý khiếu nại của khách nhanh chóng là rất quan trọng.", "opts": [{"t": "handling"}, {"t": "handle"}, {"t": "to handle"}, {"t": "handled"}], "ans": ["C"], "key": "", "ex": "It is + adj + to V → to handle.", "label": "16"}]}, {"title": "Part 5 · Câu 17", "tag": "Từ vựng", "qs": [{"n": 26, "q": "Because of several scheduling ___, the meeting has been moved to Friday.", "qvi": "Vì vài lịch bị trùng, cuộc họp đã dời sang thứ Sáu.", "opts": [{"t": "conflicts"}, {"t": "shortages"}, {"t": "conditions"}, {"t": "requests"}], "ans": ["A"], "key": "", "ex": "scheduling conflict = trùng lịch → phải dời họp.", "label": "17"}]}, {"title": "Part 5 · Câu 18", "tag": "V-ing", "qs": [{"n": 27, "q": "The accounting department finished ___ the quarterly budget report yesterday.", "qvi": "Hôm qua phòng kế toán đã làm xong báo cáo ngân sách quý.", "opts": [{"t": "prepare"}, {"t": "prepared"}, {"t": "preparing"}, {"t": "to prepare"}], "ans": ["C"], "key": "", "ex": "finish + V-ing → preparing.", "label": "18"}]}, {"title": "Part 5 · Câu 19", "tag": "Từ vựng", "qs": [{"n": 28, "q": "Employees must obtain an access ___ before entering the secure area.", "qvi": "Nhân viên phải có mã truy cập trước khi vào khu vực bảo mật.", "opts": [{"t": "conflict"}, {"t": "code"}, {"t": "workload"}, {"t": "shortage"}], "ans": ["B"], "key": "", "ex": "access code = mã truy cập.", "label": "19"}]}, {"title": "Part 5 · Câu 20", "tag": "V-ing", "qs": [{"n": 29, "q": "The team considered ___ the deadline because of unexpected delays.", "qvi": "Nhóm cân nhắc gia hạn thời hạn vì những chậm trễ bất ngờ.", "opts": [{"t": "extend"}, {"t": "extending"}, {"t": "extended"}, {"t": "to extend"}], "ans": ["B"], "key": "", "ex": "consider + V-ing → extending.", "label": "20"}]}, {"title": "Part 6 · Câu 1–4 · E-mail cập nhật khối lượng công việc", "tag": "E-mail", "passage": ["To: Department Staff · From: Karen Mitchell · Subject: Workload Update", "Hello Everyone, Our department has experienced a significant increase in workload over the past month. To help manage the situation, management has decided ⟦1⟧ two temporary employees for the next six weeks.", "The additional staff should help reduce the ⟦2⟧ currently faced by many team members and allow projects to be completed on time.", "Several projects were delayed last month because reports were submitted late. ⟦3⟧, supervisors will continue to monitor project deadlines closely.", "We appreciate your hard work during this busy period. ⟦4⟧"], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Chào mọi người, tháng qua khối lượng công việc của phòng tăng mạnh. Để xử lý, ban giám đốc quyết định thuê hai nhân viên tạm thời trong sáu tuần tới. Nhân sự bổ sung sẽ giúp giảm khối lượng công việc mà nhiều người đang gánh và giúp dự án xong đúng hạn. Tháng trước vài dự án bị chậm vì báo cáo nộp trễ. Vì vậy, giám sát viên sẽ tiếp tục theo dõi sát hạn chót. Cảm ơn sự chăm chỉ của mọi người trong thời gian bận rộn này. Hy vọng những thay đổi này giúp công việc của mọi người dễ dàng hơn."}], "qs": [{"n": 30, "q": "Chỗ trống (1)", "qvi": "", "opts": [{"t": "hiring"}, {"t": "hired"}, {"t": "to hire"}, {"t": "hire"}], "ans": ["C"], "key": "To V", "ex": "decide + to V → has decided to hire.", "label": "1"}, {"n": 31, "q": "Chỗ trống (2)", "qvi": "", "opts": [{"t": "workload"}, {"t": "itinerary"}, {"t": "dividend"}, {"t": "accommodation"}], "ans": ["A"], "key": "Từ vựng", "ex": "reduce the workload = giảm khối lượng công việc; câu đầu thư cũng nói \"increase in workload\".", "label": "2"}, {"n": 32, "q": "Chỗ trống (3)", "qvi": "", "opts": [{"t": "As a result"}, {"t": "Otherwise"}, {"t": "Nevertheless"}, {"t": "For example"}], "ans": ["A"], "key": "Trạng từ liên kết", "ex": "Câu trước: dự án chậm vì nộp báo cáo trễ → câu sau là kết quả: sẽ theo dõi sát hạn chót → As a result.", "label": "3"}, {"n": 33, "q": "Chỗ trống (4)", "qvi": "", "opts": [{"t": "We hope these changes will make everyone's work easier."}, {"t": "The company cafeteria serves breakfast from 7 a.m."}, {"t": "Several investors attended the annual meeting yesterday."}, {"t": "Hotel reservations should be made in advance."}], "ans": ["A"], "key": "Điền câu", "ex": "Câu kết thư, nối với \"these changes\" (thuê thêm người, theo dõi hạn chót) → (A).", "label": "4"}]}, {"title": "Part 7 · Câu 1–4 · Tin nhắn nhóm", "tag": "Text chain", "passage": ["<b>Lina Ortega (2:15 P.M.)</b> Hi Marcus and Omar. Can either of you tell me where the laptop that is normally kept in Meeting Room C is? It isn't on the cart with the projector.", "<b>Marcus Reed (2:17 P.M.)</b> I used it for my presentation last Tuesday, but I left it in the meeting room afterward.", "<b>Omar Khalid (2:18 P.M.)</b> I think Kevin Rosales was planning to ask someone in the IT department to check it because it wasn't working correctly.", "<b>Lina Ortega (2:20 P.M.)</b> I see. Do you know if a service ticket was submitted?", "<b>Omar Khalid (2:21 P.M.)</b> I'm not sure Kevin is familiar with all the IT procedures yet. He's only been with the company for a few days.", "<b>Lina Ortega (2:23 P.M.)</b> Good point. We should make sure that information is included in the new employee training materials.", "<b>Marcus Reed (2:27 P.M.)</b> I don't see a ticket in the IT system. I'll contact the IT department and take care of that now."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Lina: Chào Marcus và Omar. Có ai biết chiếc laptop thường để ở phòng họp C đang ở đâu không? Nó không có trên xe đẩy cùng máy chiếu. — Marcus: Thứ Ba trước tôi dùng để thuyết trình, xong tôi để lại trong phòng họp. — Omar: Hình như Kevin Rosales định nhờ phòng IT kiểm tra vì nó chạy không ổn. — Lina: Tôi hiểu rồi. Có ai biết đã gửi phiếu yêu cầu sửa chưa? — Omar: Không chắc Kevin đã nắm hết quy trình IT, anh ấy mới vào công ty được vài ngày. — Lina: Đúng đấy. Nên đưa thông tin đó vào tài liệu đào tạo nhân viên mới. — Marcus: Tôi không thấy phiếu nào trong hệ thống IT. Để tôi liên hệ phòng IT xử lý luôn."}], "qs": [{"n": 34, "q": "Why does Ms. Ortega send a message to her coworkers?", "qvi": "Vì sao chị Ortega nhắn tin cho đồng nghiệp?", "opts": [{"t": "To inform them that a projector is not working"}, {"t": "To ask where a laptop has been placed"}, {"t": "To get assistance with a presentation"}, {"t": "To check if a meeting room is free"}], "ans": ["B"], "key": "Câu hỏi mục đích", "ex": "\"Can either of you tell me where the laptop … is?\" → hỏi laptop để đâu (B). (A) bẫy: máy chiếu chỉ được nhắc tới.", "label": "1"}, {"n": 35, "q": "At 2:20 P.M., what does Ms. Ortega most likely mean when she writes, \"I see\"?", "qvi": "Lúc 2:20, chị Ortega có ý gì khi viết \"I see\"?", "opts": [{"t": "She found the service ticket."}, {"t": "She was able to access the IT system."}, {"t": "She understands the situation."}, {"t": "She knows what procedure to follow."}], "ans": ["C"], "key": "Câu hỏi hàm ý", "ex": "\"I see\" đáp lại lời Omar giải thích laptop đã đưa IT kiểm tra → chị đã hiểu tình hình (C).", "label": "2"}, {"n": 36, "q": "What is suggested about Mr. Rosales?", "qvi": "Có thể suy ra gì về anh Rosales?", "opts": [{"t": "He recently joined the company."}, {"t": "He supervises Mr. Khalid."}, {"t": "He works as the head of the IT department."}, {"t": "He gave a presentation last Tuesday."}], "ans": ["A"], "key": "Câu hỏi suy luận", "ex": "\"He's only been with the company for a few days\" → mới vào công ty (A). (D) bẫy: Marcus mới là người thuyết trình thứ Ba.", "label": "3"}, {"n": 37, "q": "What will Mr. Reed most likely do next?", "qvi": "Tiếp theo anh Reed có lẽ sẽ làm gì?", "opts": [{"t": "Update a company policy"}, {"t": "Fix the laptop himself"}, {"t": "Contact the IT department"}, {"t": "Revise the employee training materials"}], "ans": ["C"], "key": "Câu hỏi việc làm tiếp theo", "ex": "\"I'll contact the IT department and take care of that now\" → (C).", "label": "4"}]}, {"title": "Part 7 · Câu 5–9 · E-mail + khảo sát + báo cáo", "tag": "Đoạn ba", "passage": ["<b>E-MAIL</b> · To: Selected Employees · From: n.singh@primecarpets.co.nz · Date: 8 August · Subject: Efficiency improvement survey", "Dear Team Members, At Prime Carpets, we are searching for practical ways to lower daily operating expenses while maintaining product standards, customer satisfaction, and employee well-being. As part of this effort, we are inviting selected employees from different departments to complete an online survey available at www.feedbackhub.co.nz/563714. All employees chosen for this survey have worked at Prime Carpets for at least twelve years and are highly familiar with our business procedures.", "Please complete the survey by 15 August. This survey is intended only for the recipients of this message. Do not forward this e-mail or share the survey link with anyone else.", "In addition, we intend to bring in external advisors to examine our operations and prepare a report. We recognize that some staff members are not supportive of this decision. Nevertheless, we believe that an independent review will be a valuable investment and may help reduce costs over time. Kind regards, Nikhil Singh, Director of Operational Development", "<b>SURVEY</b> · Prime Carpets Efficiency Survey · Date: 14 August · Name and role: Clara Benson, customer service manager", "I have observed that some employees take a fresh set of disposable sleeve covers whenever they return from lunch or another break. Instead, they could continue using the same set throughout their shift. Restricting usage to one set per day could save the company a significant amount of money each year. It would also help reduce unnecessary waste. This change could be introduced immediately by sending a company-wide notice explaining the updated policy for protective equipment.", "<b>REPORT</b> · Takeda Advisory Group · Prime Carpets Report Overview", "Thank you for giving us the opportunity to review your operations over the past month. Below are our primary recommendations. (1) Employees do not always use dyes and other production materials efficiently. Additional training could help improve this. (2) Employees should pay closer attention to energy consumption, such as switching off equipment and lights when they are not needed. (3) Several telecommunications providers are currently offering discounted rates. Changing providers could lead to substantial long-term savings. (4) Greater efforts should be made to reuse workplace supplies. For example, certain types of basic protective equipment could be used more than once."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "E-mail (8/8): Prime Carpets đang tìm cách giảm chi phí vận hành mà vẫn giữ chất lượng, sự hài lòng của khách và phúc lợi nhân viên. Công ty mời một số nhân viên đã làm ít nhất 12 năm làm khảo sát trực tuyến trước 15/8. Khảo sát chỉ dành cho người nhận thư – không chuyển tiếp hay chia sẻ đường link. Công ty cũng sẽ mời cố vấn bên ngoài đánh giá hoạt động; một số nhân viên không ủng hộ quyết định này, nhưng công ty tin đây là khoản đầu tư đáng giá. — Khảo sát (14/8, Clara Benson, quản lý chăm sóc khách hàng): nhân viên lấy bộ bao tay áo dùng một lần mới mỗi lần nghỉ xong; nếu giới hạn một bộ mỗi ngày sẽ tiết kiệm nhiều tiền và giảm rác. Có thể áp dụng ngay bằng thông báo toàn công ty. — Báo cáo Takeda: (1) dùng thuốc nhuộm, vật liệu chưa hiệu quả → đào tạo thêm; (2) chú ý tiết kiệm điện; (3) đổi nhà mạng để được giá rẻ; (4) tái sử dụng vật dụng, ví dụ đồ bảo hộ cơ bản có thể dùng nhiều lần."}], "qs": [{"n": 38, "q": "In his e-mail, what does Mr. Singh mention about the survey?", "qvi": "Trong e-mail, ông Singh nói gì về khảo sát?", "opts": [{"t": "It has no closing date."}, {"t": "Participants need a password to access it."}, {"t": "It is available in printed form."}, {"t": "It must not be distributed to other people."}], "ans": ["D"], "key": "Câu hỏi chi tiết", "ex": "\"Do not forward this e-mail or share the survey link with anyone else\" → không được phát cho người khác (D). (A) sai vì hạn là 15/8.", "label": "5"}, {"n": 39, "q": "According to the e-mail, what are some Prime Carpets employees opposed to?", "qvi": "Theo e-mail, một số nhân viên phản đối điều gì?", "opts": [{"t": "Bringing in outside advisors"}, {"t": "The format of the survey"}, {"t": "The presentation of a financial report"}, {"t": "The groups selected to give opinions"}], "ans": ["A"], "key": "Câu hỏi chi tiết · paraphrase", "ex": "\"bring in external advisors … some staff members are not supportive of this decision\" → (A). external = outside.", "label": "6"}, {"n": 40, "q": "What is indicated about Ms. Benson?", "qvi": "Có thông tin gì về chị Benson?", "opts": [{"t": "She often submits suggestions for improvement."}, {"t": "She has been employed at Prime Carpets for a long time."}, {"t": "She will assist with gathering survey responses."}, {"t": "She works on the manufacturing floor."}], "ans": ["B"], "key": "Câu hỏi kết hợp 2 đoạn", "ex": "Kết hợp 2 đoạn: chị làm khảo sát, mà e-mail nói người được chọn \"have worked at Prime Carpets for at least twelve years\" → chị làm lâu năm (B). (D) sai: chị là quản lý chăm sóc khách hàng.", "label": "7"}, {"n": 41, "q": "In her survey response, what does Ms. Benson say about her proposal?", "qvi": "Trong bài khảo sát, chị Benson nói gì về đề xuất của mình?", "opts": [{"t": "It may require purchasing additional equipment."}, {"t": "It has been successful at similar businesses."}, {"t": "It could be put into effect immediately."}, {"t": "It has already been presented to company leaders."}], "ans": ["C"], "key": "Câu hỏi chi tiết · paraphrase", "ex": "\"This change could be introduced immediately\" → có thể áp dụng ngay (C). introduce = put into effect.", "label": "8"}, {"n": 42, "q": "Which recommendation from Takeda Advisory Group is most similar to Ms. Benson's proposal?", "qvi": "Đề xuất nào của Takeda giống ý chị Benson nhất?", "opts": [{"t": "Recommendation 1"}, {"t": "Recommendation 2"}, {"t": "Recommendation 3"}, {"t": "Recommendation 4"}], "ans": ["D"], "key": "Câu hỏi kết hợp 2 đoạn", "ex": "Chị Benson: dùng lại bao tay áo bảo hộ cả ngày. Đề xuất (4): \"basic protective equipment could be used more than once\" → (D).", "label": "9"}]}], "recap": "<h2>Ghi nhớ sau bài</h2><p>Làm lại các câu sai sau 2–3 ngày. Ôn từ vựng của buổi bằng nút <b>🃏 Flashcard</b> ở cuối trang.</p>", "qviAfter": true};</script>
