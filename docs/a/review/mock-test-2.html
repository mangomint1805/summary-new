<script>window.MT={"vocab":[["make an appointment","phr","/meɪk ən əˈpɔɪntmənt/","đặt lịch hẹn","Have you made an appointment with your dentist yet?"],["open for business","phr","/ˈoʊpən fər ˈbɪznəs/","mở cửa kinh doanh","When is your restaurant going to open for business?"],["turn on","phr.v","/tɜːrn ɑːn/","bật (máy)","The lights turn on automatically."],["renovation","n","/ˌrenəˈveɪʃn/","sự cải tạo, sửa sang","Do you like the renovations we did to the office?"],["spacious","adj","/ˈspeɪʃəs/","rộng rãi","Yes, it's very spacious now."],["accountant","n","/əˈkaʊntənt/","kế toán viên","Which conference room is the accountant using?"],["IT department","np","/ˌaɪ ˈtiː dɪˈpɑːrtmənt/","phòng IT","We should call the IT department."],["be on sale","phr","/bi ɑːn seɪl/","được bày bán","The concert tickets are on sale now, aren't they?"],["feedback","n","/ˈfiːdbæk/","nhận xét, góp ý","Do you have any feedback about Yumiko's performance?"],["performance","n","/pərˈfɔːrməns/","kết quả làm việc","Do you have any feedback about Yumiko's performance?"],["reassign","v","/ˌriːəˈsaɪn/","phân công lại","Why don't we reassign Sylvia to the evening shift in the stock room?"],["shift","n","/ʃɪft/","ca làm việc","Why don't we reassign Sylvia to the evening shift in the stock room?"],["seasonal","adj","/ˈsiːzənl/","theo mùa","How can we find extra seasonal help?"],["job listing","np","/dʒɑːb ˈlɪstɪŋ/","tin tuyển dụng","Let's post some job listings on our website."],["shuttle","n","/ˈʃʌtl/","xe đưa đón","The hotel has a free shuttle."],["replace","v","/rɪˈpleɪs/","thay thế","How often should I replace the water filter?"],["manual","n","/ˈmænjuəl/","sách hướng dẫn","Does the rental vehicle have automatic or manual transmission?"],["committee","n","/kəˈmɪti/","ủy ban, ban","Aren't you still on the event planning committee?"],["off-site","adv","/ˌɔːf ˈsaɪt/","ở bên ngoài (không ở văn phòng)","I've been working off-site for a few weeks."],["building inspector","np","/ˈbɪldɪŋ ɪnˈspektər/","thanh tra xây dựng","I hope the building inspector will arrive soon."],["rental vehicle","np","/ˈrentl ˈviːəkl/","xe thuê","Does the rental vehicle have automatic or manual transmission?"],["alter","v","/ˈɔːltər/","sửa (quần áo)","I'd like to have some jackets altered."],["unload","v","/ʌnˈloʊd/","dỡ hàng","Where should we unload the kitchen tiles?"],["release","v","/rɪˈliːs/","phát hành","Are you using the older version of the software or the one that was just released?"],["technician","n","/tekˈnɪʃn/","kỹ thuật viên","Several technicians are working late tonight."],["access","v","/ˈækses/","truy cập","Could you help me access my e-mail account before you leave?"]],"n": "a2", "part": 2, "partName": "Part 2", "sub": "Question-Response · Hỏi – đáp · 25 câu (7–31)", "intro": "Trang này chữa <b>Mock Test 2 (Part 2)<\/b> của lớp TOEIC A. Mỗi câu có nút nghe lại, 3 câu trả lời và giải thích. Chữ của đáp án được ẩn cho giống đề thật (đề không in). <b>Cách học:<\/b> bấm nghe → chọn A, B hoặc C → đọc giải thích → mở <i>Câu hỏi + dịch<\/i> để xem lại câu hỏi.", "stepsTitle": "Cách làm Part 2: chiến lược 3U", "steps": ["<b>Nghe thật kỹ 3–4 từ đầu tiên.<\/b> When → thời gian, Where → nơi chốn, Who → người, Why → lý do, How often → tần suất. Câu hỏi Wh- không trả lời bằng <i>Yes/No<\/i>.", "<b>Loại đáp án bẫy.<\/b> Lặp từ hoặc lặp âm (<i>appointment → apartment, season → seasonal, assign → assignment<\/i>), hoặc chỉ \"liên quan\" tới chủ đề (<i>airport → pilot, restaurant → rest area<\/i>) thường là sai.", "<b>Chấp nhận trả lời gián tiếp.<\/b> Đáp án đúng nhiều khi không trả lời thẳng: hỏi \"dỡ gạch ở đâu?\" đáp \"khách chưa có nhà\" (nên chưa dỡ được); mời uống trà đáp \"tôi có cuộc họp sau 10 phút\" (từ chối kèm lý do)."], "groups": [{"title": "Câu 7", "tag": "Yes/No", "audio": "../../audio/amk2/c7.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Have you made an appointment with your dentist yet?", "vi": "Bạn đã đặt lịch hẹn với nha sĩ chưa?"}], "qs": [{"n": 7, "q": "", "qvi": "", "opts": [{"t": "I'll put it upstairs for now.", "vi": "Giờ tôi sẽ để nó trên lầu."}, {"t": "Yes, last week.", "vi": "Rồi, tuần trước."}, {"t": "A new supply order.", "vi": "Một đơn đặt hàng vật tư mới."}], "ans": ["B"], "key": "Have you … yet? → Yes/No + thông tin", "ex": "Câu hỏi Yes/No \"đã … chưa?\" → (B) \"Rồi, tuần trước\" trả lời thẳng. (A) nói chỗ để đồ, không liên quan. (C) \"order\" (đơn hàng) là bẫy liên tưởng với \"appointment\" (cuộc hẹn)."}]}, {"title": "Câu 8", "tag": "Câu hỏi lựa chọn", "audio": "../../audio/amk2/c8.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Do you want to buy the blue sofa or the yellow one?", "vi": "Bạn muốn mua ghế sofa màu xanh hay màu vàng?"}], "qs": [{"n": 8, "q": "", "qvi": "", "opts": [{"t": "A three-bedroom apartment.", "vi": "Một căn hộ ba phòng ngủ."}, {"t": "I like the yellow one.", "vi": "Tôi thích cái màu vàng."}, {"t": "I've already been there.", "vi": "Tôi đến đó rồi."}], "ans": ["B"], "key": "A or B? → chọn một trong hai", "ex": "Câu hỏi lựa chọn (… or …) → chọn một: (B) \"cái màu vàng\". (A) căn hộ là bẫy liên tưởng (sofa → nhà). (C) không trả lời được câu hỏi."}]}, {"title": "Câu 9", "tag": "When", "audio": "../../audio/amk2/c9.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "When is your restaurant going to open for business?", "vi": "Khi nào nhà hàng của bạn bắt đầu mở cửa kinh doanh?"}], "qs": [{"n": 9, "q": "", "qvi": "", "opts": [{"t": "These are new clothes.", "vi": "Đây là quần áo mới."}, {"t": "By the end of the month.", "vi": "Trước cuối tháng này."}, {"t": "Yes, it's a large rest area.", "vi": "Vâng, đó là một khu nghỉ lớn."}], "ans": ["B"], "key": "When → thời gian", "ex": "When hỏi thời gian → (B) \"trước cuối tháng\". (A) \"clothes\" lặp âm với \"close/open\". (C) bắt đầu bằng Yes (câu Wh- không trả lời Yes/No) và \"rest area\" lặp âm với \"restaurant\"."}]}, {"title": "Câu 10", "tag": "Why", "audio": "../../audio/amk2/c10.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Why won't my computer turn on?", "vi": "Sao máy tính của tôi không bật lên được?"}], "qs": [{"n": 10, "q": "", "qvi": "", "opts": [{"t": "No, it's a small font.", "vi": "Không, đó là cỡ chữ nhỏ."}, {"t": "Turn right at the corner.", "vi": "Rẽ phải ở góc đường."}, {"t": "Because the battery is old.", "vi": "Vì pin đã cũ."}], "ans": ["C"], "key": "Why → Because + lý do", "ex": "Why hỏi lý do → (C) \"Vì pin đã cũ\". (A) No sai dạng câu hỏi, \"font\" liên tưởng máy tính. (B) \"turn right\" lặp từ \"turn\" (turn on)."}]}, {"title": "Câu 11", "tag": "Hỏi ý kiến", "audio": "../../audio/amk2/c11.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Do you like the renovations we did to the office?", "vi": "Bạn có thích việc sửa sang văn phòng của chúng ta không?"}], "qs": [{"n": 11, "q": "", "qvi": "", "opts": [{"t": "The construction company down the street.", "vi": "Công ty xây dựng cuối phố."}, {"t": "He's in the cafeteria.", "vi": "Anh ấy đang ở căng tin."}, {"t": "Yes, it's very spacious now.", "vi": "Có, giờ văn phòng rất rộng rãi."}], "ans": ["C"], "key": "Do you like …? → Yes + nhận xét", "ex": "(C) đồng ý và nêu nhận xét: \"rộng rãi\" (spacious). (A) \"construction company\" là bẫy liên tưởng với renovations. (B) \"He\" không biết là ai."}]}, {"title": "Câu 12", "tag": "Which", "audio": "../../audio/amk2/c12.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Which conference room is the accountant using?", "vi": "Kế toán đang dùng phòng họp nào?"}], "qs": [{"n": 12, "q": "", "qvi": "", "opts": [{"t": "The one on the first floor.", "vi": "Phòng ở tầng một."}, {"t": "It went well, thanks.", "vi": "Mọi việc ổn, cảm ơn."}, {"t": "That was a lot of money.", "vi": "Số tiền đó lớn thật."}], "ans": ["A"], "key": "Which + N → the one …", "ex": "Which hỏi cái nào → (A) \"the one on the first floor\" (one = room). (B) trả lời cho câu \"How did … go?\". (C) \"money\" liên tưởng tới accountant (kế toán)."}]}, {"title": "Câu 13", "tag": "Câu trần thuật", "audio": "../../audio/amk2/c13.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "The Internet isn't working.", "vi": "Mạng Internet không hoạt động."}], "qs": [{"n": 13, "q": "", "qvi": "", "opts": [{"t": "There's the cleaning crew's checklist.", "vi": "Kia là danh sách việc của đội vệ sinh."}, {"t": "We should call the IT department.", "vi": "Chúng ta nên gọi phòng IT."}, {"t": "Several copies, please.", "vi": "Cho tôi vài bản sao."}], "ans": ["B"], "key": "Báo sự cố → đề xuất cách giải quyết", "ex": "Câu nêu vấn đề → đáp án thường là giải pháp: (B) gọi phòng IT. (A), (C) không liên quan."}]}, {"title": "Câu 14", "tag": "Câu hỏi lựa chọn", "audio": "../../audio/amk2/c14.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Would you like to present first, or should I?", "vi": "Bạn muốn trình bày trước hay để tôi?"}], "qs": [{"n": 14, "q": "", "qvi": "", "opts": [{"t": "About twenty dollars each.", "vi": "Khoảng 20 đô mỗi cái."}, {"t": "No, it's the second train.", "vi": "Không, đó là chuyến tàu thứ hai."}, {"t": "I'm ready to start.", "vi": "Tôi sẵn sàng bắt đầu rồi."}], "ans": ["C"], "key": "A or B? → trả lời gián tiếp", "ex": "(C) \"Tôi sẵn sàng bắt đầu\" = tôi sẽ trình bày trước. (A) nói giá tiền. (B) \"second\" là bẫy liên tưởng với \"first\"."}]}, {"title": "Câu 15", "tag": "Câu hỏi đuôi", "audio": "../../audio/amk2/c15.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "The concert tickets are on sale now, aren't they?", "vi": "Vé buổi hòa nhạc đang được bán rồi, phải không?"}], "qs": [{"n": 15, "q": "", "qvi": "", "opts": [{"t": "The new director of marketing.", "vi": "Giám đốc marketing mới."}, {"t": "Yes, and they're selling fast.", "vi": "Đúng, và vé đang bán rất chạy."}, {"t": "One of my favorite bands.", "vi": "Một trong những ban nhạc tôi thích."}], "ans": ["B"], "key": "Câu hỏi đuôi → trả lời như Yes/No", "ex": "(B) xác nhận \"đúng\" và thêm thông tin \"bán rất chạy\". (C) \"band\" là bẫy liên tưởng với concert. (A) không liên quan."}]}, {"title": "Câu 16", "tag": "Yes/No", "audio": "../../audio/amk2/c16.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Do you have any feedback about Yumiko's performance?", "vi": "Bạn có nhận xét gì về kết quả làm việc của Yumiko không?"}], "qs": [{"n": 16, "q": "", "qvi": "", "opts": [{"t": "Yes, her work is excellent.", "vi": "Có, cô ấy làm việc rất xuất sắc."}, {"t": "Near the back of the room.", "vi": "Gần cuối phòng."}, {"t": "It's nice to meet you.", "vi": "Rất vui được gặp bạn."}], "ans": ["A"], "key": "feedback = nhận xét; performance = kết quả làm việc", "ex": "(A) đưa ra nhận xét về Yumiko. (B) trả lời cho Where. (C) là câu chào khi mới gặp. Chú ý: performance ở đây là kết quả làm việc, không phải buổi biểu diễn."}]}, {"title": "Câu 17", "tag": "Đề nghị", "audio": "../../audio/amk2/c17.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Why don't we reassign Sylvia to the evening shift in the stock room?", "vi": "Sao chúng ta không chuyển Sylvia sang ca tối ở kho nhỉ?"}], "qs": [{"n": 17, "q": "", "qvi": "", "opts": [{"t": "Sure, I expect she'll be okay with that.", "vi": "Được, tôi nghĩ cô ấy sẽ đồng ý."}, {"t": "I sent my assignment to the instructor.", "vi": "Tôi đã gửi bài tập cho giảng viên."}, {"t": "The new office furniture is comfortable.", "vi": "Bàn ghế văn phòng mới rất thoải mái."}], "ans": ["A"], "key": "Why don't we …? = đề nghị, không phải hỏi lý do", "ex": "\"Why don't we…?\" là lời đề nghị → đồng ý/từ chối. (A) \"Được\" đồng ý. (B) \"assignment\" lặp âm với \"reassign\". (C) không liên quan."}]}, {"title": "Câu 18", "tag": "How", "audio": "../../audio/amk2/c18.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "How can we find extra seasonal help?", "vi": "Làm sao để tìm thêm nhân viên thời vụ?"}], "qs": [{"n": 18, "q": "", "qvi": "", "opts": [{"t": "Spring is my favorite season.", "vi": "Mùa xuân là mùa tôi thích nhất."}, {"t": "Let's post some job listings on our website.", "vi": "Hãy đăng tin tuyển dụng lên website."}, {"t": "Because he left early today.", "vi": "Vì hôm nay anh ấy về sớm."}], "ans": ["B"], "key": "How → cách làm", "ex": "How hỏi cách làm → (B) đăng tin tuyển dụng. (A) \"season\" lặp âm với \"seasonal\". (C) Because trả lời cho Why."}]}, {"title": "Câu 19", "tag": "Yes/No gián tiếp", "audio": "../../audio/amk2/c19.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Do you know if there's a bus from here to New York City?", "vi": "Bạn có biết có xe buýt từ đây đi New York không?"}], "qs": [{"n": 19, "q": "", "qvi": "", "opts": [{"t": "That's a great idea.", "vi": "Ý hay đấy."}, {"t": "No, he studied in London.", "vi": "Không, anh ấy học ở London."}, {"t": "Yes, there's one every day around nine o'clock.", "vi": "Có, mỗi ngày có một chuyến lúc khoảng 9 giờ."}], "ans": ["C"], "key": "Do you know if …? → Yes/No + thông tin", "ex": "(C) \"Có, mỗi ngày một chuyến\" (one = a bus). (A) trả lời cho lời đề nghị. (B) \"London\" liên tưởng thành phố, \"he\" không rõ là ai."}]}, {"title": "Câu 20", "tag": "Who", "audio": "../../audio/amk2/c20.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Who's driving you to the airport?", "vi": "Ai chở bạn ra sân bay?"}], "qs": [{"n": 20, "q": "", "qvi": "", "opts": [{"t": "The hotel has a free shuttle.", "vi": "Khách sạn có xe đưa đón miễn phí."}, {"t": "She just received her pilot's license.", "vi": "Cô ấy vừa nhận bằng phi công."}, {"t": "About twenty minutes late.", "vi": "Trễ khoảng 20 phút."}], "ans": ["A"], "key": "Who → trả lời gián tiếp", "ex": "Không ai chở cả: (A) \"khách sạn có xe đưa đón miễn phí\" nên tôi đi xe đó. (B) \"pilot\" là bẫy liên tưởng với airport. (C) nói thời gian."}]}, {"title": "Câu 21", "tag": "How often", "audio": "../../audio/amk2/c21.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "How often should I replace the water filter?", "vi": "Bao lâu tôi nên thay lõi lọc nước một lần?"}], "qs": [{"n": 21, "q": "", "qvi": "", "opts": [{"t": "A new coffee maker.", "vi": "Một máy pha cà phê mới."}, {"t": "Can I have more ice, please?", "vi": "Cho tôi thêm đá nhé?"}, {"t": "There's a manual in the cabinet.", "vi": "Có sách hướng dẫn trong tủ."}], "ans": ["C"], "key": "Không biết → chỉ chỗ tìm thông tin", "ex": "Trả lời gián tiếp: (C) \"có sách hướng dẫn trong tủ\" (xem trong đó sẽ biết). (A) \"coffee maker\", (B) \"ice\" là bẫy liên tưởng với water."}]}, {"title": "Câu 22", "tag": "Câu hỏi phủ định", "audio": "../../audio/amk2/c22.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Aren't you still on the event planning committee?", "vi": "Chẳng phải bạn vẫn đang ở trong ban tổ chức sự kiện sao?"}], "qs": [{"n": 22, "q": "", "qvi": "", "opts": [{"t": "There's an orange sign at the entrance.", "vi": "Có biển màu cam ở lối vào."}, {"t": "Check the bookshelf by the window.", "vi": "Xem trên kệ sách cạnh cửa sổ."}, {"t": "Members are replaced every year.", "vi": "Thành viên được thay mỗi năm."}], "ans": ["C"], "key": "Câu phủ định → trả lời như Yes/No", "ex": "Câu hỏi \"chẳng phải bạn vẫn ở trong ban…?\" → (C) trả lời gián tiếp: thành viên được thay hằng năm (nên giờ tôi không còn trong ban). (A), (B) chỉ đường, chỉ chỗ đồ vật, không liên quan."}]}, {"title": "Câu 23", "tag": "Lời mời", "audio": "../../audio/amk2/c23.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Would you like to join us for tea now in the cafeteria?", "vi": "Bạn có muốn uống trà với chúng tôi ở căng tin bây giờ không?"}], "qs": [{"n": 23, "q": "", "qvi": "", "opts": [{"t": "I have a client meeting in ten minutes.", "vi": "Tôi có cuộc họp với khách sau 10 phút nữa."}, {"t": "Actually, I joined a different gym.", "vi": "Thật ra tôi tham gia phòng gym khác rồi."}, {"t": "Some tables and chairs.", "vi": "Vài cái bàn và ghế."}], "ans": ["A"], "key": "Lời mời → từ chối kèm lý do", "ex": "(A) từ chối khéo: sắp có cuộc họp. (B) \"joined\" lặp từ \"join\". (C) \"tables and chairs\" liên tưởng căng tin."}]}, {"title": "Câu 24", "tag": "How", "audio": "../../audio/amk2/c24.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "How do you think the new robotics technician is doing?", "vi": "Bạn thấy kỹ thuật viên robot mới làm việc thế nào?"}], "qs": [{"n": 24, "q": "", "qvi": "", "opts": [{"t": "I've been working off-site for a few weeks.", "vi": "Mấy tuần nay tôi làm việc ở ngoài văn phòng."}, {"t": "The tools are on my desk.", "vi": "Dụng cụ ở trên bàn tôi."}, {"t": "Because the team won first place.", "vi": "Vì đội đã giành giải nhất."}], "ans": ["A"], "key": "Không biết → nêu lý do không biết", "ex": "(A) gián tiếp: mấy tuần nay tôi không ở văn phòng (nên không biết anh ấy làm thế nào). (B) \"tools\" liên tưởng technician. (C) Because trả lời cho Why."}]}, {"title": "Câu 25", "tag": "Câu trần thuật", "audio": "../../audio/amk2/c25.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "I hope the building inspector will arrive soon.", "vi": "Tôi mong thanh tra công trình sẽ đến sớm."}], "qs": [{"n": 25, "q": "", "qvi": "", "opts": [{"t": "No, not as much as we expected.", "vi": "Không, không nhiều như ta nghĩ."}, {"t": "Traffic is heavy on Highway 90.", "vi": "Đường cao tốc 90 đang kẹt xe."}, {"t": "A multi-level apartment complex.", "vi": "Một khu chung cư nhiều tầng."}], "ans": ["B"], "key": "Đáp lại bằng lý do liên quan", "ex": "(B) kẹt xe trên đường cao tốc → giải thích vì sao thanh tra có thể đến muộn. (A) \"not as much\" không hợp. (C) \"apartment complex\" liên tưởng tới building."}]}, {"title": "Câu 26", "tag": "Đề xuất", "audio": "../../audio/amk2/c26.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "We should order a cake for the company picnic.", "vi": "Chúng ta nên đặt một cái bánh kem cho buổi dã ngoại của công ty."}], "qs": [{"n": 26, "q": "", "qvi": "", "opts": [{"t": "Some of the staff don't eat sweets.", "vi": "Một số nhân viên không ăn đồ ngọt."}, {"t": "The bank is on 12th Street.", "vi": "Ngân hàng ở đường số 12."}, {"t": "About five kilometers.", "vi": "Khoảng 5 km."}], "ans": ["A"], "key": "Đề xuất → phản đối kèm lý do", "ex": "(A) phản đối nhẹ nhàng: có người không ăn đồ ngọt. (B) trả lời Where. (C) trả lời How far."}]}, {"title": "Câu 27", "tag": "Câu hỏi lựa chọn", "audio": "../../audio/amk2/c27.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Does the rental vehicle have automatic or manual transmission?", "vi": "Xe thuê là số tự động hay số sàn?"}], "qs": [{"n": 27, "q": "", "qvi": "", "opts": [{"t": "It's on the shelf in the office.", "vi": "Nó ở trên kệ trong văn phòng."}, {"t": "Bradley will be driving the vehicle.", "vi": "Bradley sẽ là người lái xe."}, {"t": "The lights turn on automatically.", "vi": "Đèn tự động bật."}], "ans": ["B"], "key": "A or B? → gián tiếp: hỏi người biết", "ex": "(B) gián tiếp: Bradley lái nên hỏi anh ấy (tôi không cần biết). (A) chỉ chỗ đồ vật. (C) \"automatically\" lặp âm với \"automatic\"."}]}, {"title": "Câu 28", "tag": "Yêu cầu", "audio": "../../audio/amk2/c28.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "I'd like to have some jackets altered.", "vi": "Tôi muốn sửa lại vài cái áo khoác."}], "qs": [{"n": 28, "q": "", "qvi": "", "opts": [{"t": "I prefer a hundred percent cotton.", "vi": "Tôi thích loại 100% cotton hơn."}, {"t": "When would you like to pick them up?", "vi": "Khi nào anh muốn lấy?"}, {"t": "Yes, it's a much shorter trip.", "vi": "Đúng, chuyến đi ngắn hơn nhiều."}], "ans": ["B"], "key": "Yêu cầu dịch vụ → hỏi lại chi tiết", "ex": "Khách muốn sửa áo → nhân viên hỏi (B) \"khi nào lấy?\". (A) \"cotton\" liên tưởng quần áo. (C) \"shorter\" liên tưởng sửa ngắn nhưng nói về chuyến đi."}]}, {"title": "Câu 29", "tag": "Where", "audio": "../../audio/amk2/c29.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Where should we unload the kitchen tiles?", "vi": "Chúng ta nên dỡ gạch ốp bếp ở đâu?"}], "qs": [{"n": 29, "q": "", "qvi": "", "opts": [{"t": "The client isn't at home right now.", "vi": "Khách hàng hiện không có nhà."}, {"t": "Not long ago.", "vi": "Cách đây không lâu."}, {"t": "Sorry, I spilled the water.", "vi": "Xin lỗi, tôi làm đổ nước."}], "ans": ["A"], "key": "Where → trả lời gián tiếp", "ex": "(A) gián tiếp: khách không có nhà nên chưa dỡ được (chưa biết để đâu). (B) trả lời When. (C) \"water\" liên tưởng tới bếp."}]}, {"title": "Câu 30", "tag": "Câu hỏi lựa chọn", "audio": "../../audio/amk2/c30.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Are you using the older version of the software or the one that was just released?", "vi": "Bạn đang dùng bản phần mềm cũ hay bản vừa mới ra?"}], "qs": [{"n": 30, "q": "", "qvi": "", "opts": [{"t": "I'm using brass hardware in the kitchen.", "vi": "Tôi dùng đồ kim khí bằng đồng trong bếp."}, {"t": "Were we supposed to update the program?", "vi": "Chúng ta phải cập nhật chương trình à?"}, {"t": "Yes, he has a used computer.", "vi": "Đúng, anh ấy có máy tính cũ."}], "ans": ["B"], "key": "Hỏi lại = trả lời gián tiếp", "ex": "(B) hỏi ngược lại \"phải cập nhật à?\" → nghĩa là tôi vẫn đang dùng bản cũ. (A) \"using\" lặp từ, \"hardware\" lặp âm với software. (C) \"used computer\" lặp âm."}]}, {"title": "Câu 31", "tag": "Nhờ giúp", "audio": "../../audio/amk2/c31.mp3", "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Could you help me access my e-mail account before you leave?", "vi": "Bạn giúp tôi vào tài khoản e-mail trước khi về được không?"}], "qs": [{"n": 31, "q": "", "qvi": "", "opts": [{"t": "On the top shelf.", "vi": "Trên kệ trên cùng."}, {"t": "Did you check the storage closet?", "vi": "Bạn đã xem tủ kho chưa?"}, {"t": "Several technicians are working late tonight.", "vi": "Tối nay có vài kỹ thuật viên làm muộn."}], "ans": ["C"], "key": "Nhờ giúp → gợi ý người khác giúp", "ex": "(C) gián tiếp: có kỹ thuật viên ở lại muộn, họ giúp được bạn. (A), (B) chỉ chỗ để đồ, hợp với câu hỏi tìm đồ vật."}]}], "recap": "<h2>Ghi nhớ sau bài<\/h2><p><b>Trả lời gián tiếp (rất hay gặp):<\/b> câu 20 (có xe đưa đón), 21 (xem sách hướng dẫn), 22, 24, 27 (hỏi Bradley), 29 (khách không có nhà), 30 (hỏi ngược lại), 31 (nhờ người khác).<\/p><p><b>Bẫy lặp âm:<\/b> restaurant → rest area (9), turn on → turn right (10), reassign → assignment (17), seasonal → season (18), automatic → automatically (27), software → hardware (30).<\/p><p><b>Bẫy Yes/No:<\/b> câu hỏi Wh- mà đáp án mở đầu bằng Yes/No là sai ngay: câu 9, 10.<\/p>", "exam": "TOEIC-A-MOCK2", "examSrc": "/toeica-mocktest/", "hideOpts": true, "hideHint": "Nghe rồi chọn"};</script>
