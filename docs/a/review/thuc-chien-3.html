<script>window.MT={"vocab": [["executive", "n", "/ɪɡˈzekjətɪv/", "giám đốc, lãnh đạo cấp cao", "The company's senior executives are flying to Europe on Sunday."], ["itinerary", "n", "/aɪˈtɪnəreri/", "lịch trình chuyến đi", "Please send me your travel itinerary before the trip."], ["aisle seat", "n", "/aɪl siːt/", "ghế cạnh lối đi", "I prefer an aisle seat because I can stretch my legs."], ["business dinner", "n", "/ˈbɪznəs ˈdɪnər/", "bữa tối công việc (với đối tác)", "Should I wear a jacket to the business dinner?"], ["receipt", "n", "/rɪˈsiːt/", "hoá đơn, biên lai", "Keep all your receipts to get your money back."], ["reimburse", "v", "/ˌriːɪmˈbɜːrs/", "hoàn trả (tiền đã chi)", "The company will reimburse all travel expenses."], ["terminal lounge", "n", "/ˈtɜːrmɪnl laʊndʒ/", "phòng chờ ở nhà ga sân bay", "The men are waiting in an airport terminal lounge."], ["blueprint", "n", "/ˈbluːprɪnt/", "bản vẽ thiết kế", "The men are reviewing blueprints."]], "n": "atc3", "part": 0, "partName": "Part 1 · Part 2 · Part 5, 6", "sub": "Business Trip · Part 1 (6 câu) · Part 2 (10 câu) · Part 5 (15 câu) · Part 6 (4 câu)", "intro": "Trang này có <b>file nghe</b> và <b>chữa bài</b> phần luyện tập trên lớp của buổi <b>Unit 3 · Lesson 3 · Thực chiến đề thi (3)</b> (Giáo trình trang 68–74). <b>Cách học:</b> câu nghe thì bấm nghe → tự chọn (chữ đáp án được ẩn giống đề thật) → đọc dịch và giải thích. Câu đọc thì chọn đáp án rồi xem vì sao đúng, vì sao sai.", "stepsTitle": "Nhắc lại chiến lược", "steps": ["<b>Part 1 – S.E.A:</b> nhìn tranh trước khi nghe: Setting (ở đâu), Entity (ai, cái gì), Activity (đang làm gì). Câu <i>is/are being + V3</i> chỉ đúng khi có người đang làm việc đó.", "<b>Part 2 – U.U.U:</b> nghe thật kỹ 3–4 từ đầu (Who, Where, Why, How long…). Câu hỏi Wh- không trả lời bằng Yes/No; đáp án lặp từ hoặc lặp âm thường là bẫy; trả lời gián tiếp (\"để tôi kiểm tra\") thường đúng.", "<b>Part 5, 6 – C.E.P:</b> nhìn 4 đáp án để phân loại (từ loại, thì, câu điều kiện, từ vựng) → loại đáp án sai → dự đoán từ dấu hiệu trong câu."], "groups": [{"title": "Part 1 · Câu 1", "tag": "Hội trường", "audio": "../../audio/atc3/p1-c1.mp3", "imgs": ["img/tc3/p1.webp"], "hideOpts": true, "qs": [{"n": 1, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "Some people are listening to a presentation.", "vi": "Một số người đang nghe thuyết trình."}, {"t": "A whiteboard is being written on.", "vi": "Có người đang viết lên bảng trắng."}, {"t": "Chairs and tables are being set up.", "vi": "Bàn ghế đang được sắp xếp."}, {"t": "Some people are cleaning a light fixture.", "vi": "Một số người đang lau đèn."}], "ans": ["A"], "key": "listen to a presentation = nghe thuyết trình", "ex": "Khán giả ngồi nhìn lên màn chiếu → (A). (B), (C) dạng <i>is/are being + V3</i> nhưng không ai đang viết hay đang xếp bàn ghế. (D) không ai lau đèn.", "label": "1"}]}, {"title": "Part 1 · Câu 2", "tag": "Công trường", "audio": "../../audio/atc3/p1-c2.mp3", "imgs": ["img/tc3/p2.webp"], "hideOpts": true, "qs": [{"n": 2, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "The men are having a heated argument.", "vi": "Hai người đàn ông đang cãi nhau gay gắt."}, {"t": "The men are making changes to a document.", "vi": "Hai người đàn ông đang sửa một tài liệu."}, {"t": "The men are reviewing blueprints.", "vi": "Hai người đàn ông đang xem bản vẽ."}, {"t": "The men are putting on helmets.", "vi": "Hai người đàn ông đang đội mũ bảo hộ."}], "ans": ["C"], "key": "review blueprints = xem bản vẽ", "ex": "Hai người cầm và xem bản vẽ → (C). (D) bẫy: <i>putting on</i> là hành động đang đội, còn tranh là mũ đã đội sẵn (wearing). (A) không cãi nhau.", "label": "2"}]}, {"title": "Part 1 · Câu 3", "tag": "Họp nhóm", "audio": "../../audio/atc3/p1-c3.mp3", "imgs": ["img/tc3/p3.webp"], "hideOpts": true, "qs": [{"n": 3, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "One man is gesturing with his hand.", "vi": "Một người đàn ông đang ra hiệu bằng tay."}, {"t": "The older man is talking to everyone.", "vi": "Người đàn ông lớn tuổi đang nói với mọi người."}, {"t": "The woman is talking on a cell phone.", "vi": "Người phụ nữ đang nói điện thoại."}, {"t": "The people are looking at a computer screen.", "vi": "Mọi người đang nhìn màn hình máy tính."}], "ans": ["A"], "key": "gesture with one's hand = ra hiệu bằng tay", "ex": "Người đàn ông ở giữa đang đưa tay ra hiệu khi nói → (A). (B) \"everyone\" quá rộng, ông ấy chỉ nói với người bên cạnh. (C), (D) không có điện thoại hay màn hình.", "label": "3"}]}, {"title": "Part 1 · Câu 4", "tag": "Văn phòng", "audio": "../../audio/atc3/p1-c4.mp3", "imgs": ["img/tc3/p4.webp"], "hideOpts": true, "qs": [{"n": 4, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "The woman is sending a fax.", "vi": "Người phụ nữ đang gửi fax."}, {"t": "The woman is making a call.", "vi": "Người phụ nữ đang gọi điện."}, {"t": "The woman is copying a letter.", "vi": "Người phụ nữ đang photo một lá thư."}, {"t": "The woman is cleaning her desk.", "vi": "Người phụ nữ đang dọn bàn."}], "ans": ["A"], "key": "send a fax = gửi fax", "ex": "Cô ấy đang đưa giấy vào máy fax → (A). (B) không cầm điện thoại. (C) máy fax khác máy photo. (D) không dọn bàn.", "label": "4"}]}, {"title": "Part 1 · Câu 5", "tag": "Quầy lễ tân", "audio": "../../audio/atc3/p1-c5.mp3", "imgs": ["img/tc3/p5.webp"], "hideOpts": true, "qs": [{"n": 5, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "A flower pot is sitting on the floor.", "vi": "Một chậu hoa đang đặt trên sàn."}, {"t": "One of the women is behind a counter.", "vi": "Một trong hai người phụ nữ đứng sau quầy."}, {"t": "Some lamps are built into a counter.", "vi": "Vài chiếc đèn được gắn trong quầy."}, {"t": "One of the women is pulling a suitcase.", "vi": "Một trong hai người phụ nữ đang kéo va li."}], "ans": ["B"], "key": "behind a counter = sau quầy", "ex": "Nhân viên lễ tân đứng sau quầy → (B). (D) bẫy: có va li nhưng đặt dưới đất, không ai kéo. (A) hoa đặt trên quầy. (C) đèn treo trên trần.", "label": "5"}]}, {"title": "Part 1 · Câu 6", "tag": "Sân bay", "audio": "../../audio/atc3/p1-c6.mp3", "imgs": ["img/tc3/p6.webp"], "hideOpts": true, "qs": [{"n": 6, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "A man is weighing his bag.", "vi": "Một người đàn ông đang cân túi."}, {"t": "Some people are gathered around a desk.", "vi": "Một số người đang tụ tập quanh một quầy."}, {"t": "A man is picking up a plastic bag.", "vi": "Một người đàn ông đang nhặt túi nhựa."}, {"t": "Some people are opening their luggage.", "vi": "Một số người đang mở hành lý."}], "ans": ["B"], "key": "be gathered around = tụ tập quanh", "ex": "Hành khách đứng quanh quầy làm thủ tục → (B). (A), (C), (D) nhắc tới túi, hành lý có trong tranh nhưng sai hành động.", "label": "6"}]}, {"title": "Part 2 · Câu 1", "tag": "Why", "audio": "../../audio/atc3/p2-c1.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Why are the executives flying to Europe on Sunday?", "vi": "Vì sao các giám đốc bay sang châu Âu vào Chủ nhật?"}], "qs": [{"n": 7, "q": "", "qvi": "", "opts": [{"t": "No, it's on Wednesday.", "vi": "Không, nó vào thứ Tư."}, {"t": "We ordered the flyers already.", "vi": "Chúng tôi đã đặt in tờ rơi rồi."}, {"t": "They've got a sales meeting.", "vi": "Họ có một cuộc họp bán hàng."}], "ans": ["C"], "key": "Why → lý do", "ex": "Why → (C) họ có cuộc họp bán hàng. (A) câu hỏi Wh- không trả lời bằng No. (B) flyers lặp âm với flying.", "label": "1"}]}, {"title": "Part 2 · Câu 2", "tag": "Who", "audio": "../../audio/atc3/p2-c2.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Who did you meet in Turkey?", "vi": "Bạn đã gặp ai ở Thổ Nhĩ Kỳ?"}], "qs": [{"n": 8, "q": "", "qvi": "", "opts": [{"t": "I'll meet you there at 2 p.m.", "vi": "Tôi sẽ gặp bạn ở đó lúc 2 giờ chiều."}, {"t": "The marketing manager.", "vi": "Trưởng phòng marketing."}, {"t": "We didn't have time.", "vi": "Chúng tôi không có thời gian."}], "ans": ["B"], "key": "Who → người / chức danh", "ex": "Who → (B) chức danh. (A) lặp từ meet và sai thì (tương lai).", "label": "2"}]}, {"title": "Part 2 · Câu 3", "tag": "When", "audio": "../../audio/atc3/p2-c3.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "When is the best time to call you?", "vi": "Lúc nào gọi cho bạn là tiện nhất?"}], "qs": [{"n": 9, "q": "", "qvi": "", "opts": [{"t": "Unfortunately not.", "vi": "Tiếc là không."}, {"t": "To my office phone.", "vi": "Vào số điện thoại văn phòng."}, {"t": "Before 4 p.m.", "vi": "Trước 4 giờ chiều."}], "ans": ["C"], "key": "When → thời gian", "ex": "When → (C) trước 4 giờ chiều. (B) liên tưởng tới \"call\" nhưng trả lời gọi vào đâu.", "label": "3"}]}, {"title": "Part 2 · Câu 4", "tag": "How long", "audio": "../../audio/atc3/p2-c4.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "How long will it take to get to the hotel from the airport?", "vi": "Từ sân bay đến khách sạn mất bao lâu?"}], "qs": [{"n": 10, "q": "", "qvi": "", "opts": [{"t": "Should I shorten our stay?", "vi": "Tôi có nên rút ngắn chuyến đi không?"}, {"t": "Let me call a cab.", "vi": "Để tôi gọi taxi."}, {"t": "Twenty minutes by subway.", "vi": "Hai mươi phút bằng tàu điện ngầm."}], "ans": ["C"], "key": "How long → khoảng thời gian", "ex": "How long → (C) 20 phút. (A) liên quan chuyến đi, (B) liên quan đi lại, nhưng không trả lời \"bao lâu\".", "label": "4"}]}, {"title": "Part 2 · Câu 5", "tag": "Who", "audio": "../../audio/atc3/p2-c5.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Who has the market research results?", "vi": "Ai đang giữ kết quả nghiên cứu thị trường?"}], "qs": [{"n": 11, "q": "", "qvi": "", "opts": [{"t": "It might be Jessica.", "vi": "Có thể là Jessica."}, {"t": "The desk on the right.", "vi": "Cái bàn bên phải."}, {"t": "I'm going to the market soon.", "vi": "Tôi sắp đi chợ."}], "ans": ["A"], "key": "Who → tên người", "ex": "Who → (A) Jessica. (C) lặp từ market (nghĩa khác: chợ).", "label": "5"}]}, {"title": "Part 2 · Câu 6", "tag": "Yes/No · từ chối khéo", "audio": "../../audio/atc3/p2-c6.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Will you come to the client dinner tonight?", "vi": "Tối nay bạn có đến bữa tối với khách hàng không?"}], "qs": [{"n": 12, "q": "", "qvi": "", "opts": [{"t": "I doubt I can find the time.", "vi": "Tôi e là không sắp xếp được thời gian."}, {"t": "At the end of the week.", "vi": "Vào cuối tuần."}, {"t": "I didn't bring anything.", "vi": "Tôi không mang gì theo."}], "ans": ["A"], "key": "Từ chối gián tiếp: \"I doubt I can…\"", "ex": "Câu Yes/No có thể trả lời gián tiếp → (A) ý là không đi được. (B) trả lời When.", "label": "6"}]}, {"title": "Part 2 · Câu 7", "tag": "Lời mời", "audio": "../../audio/atc3/p2-c7.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Would you like to sit by the window on the plane?", "vi": "Bạn có muốn ngồi cạnh cửa sổ trên máy bay không?"}], "qs": [{"n": 13, "q": "", "qvi": "", "opts": [{"t": "Sure, either flight time is fine.", "vi": "Được, giờ bay nào cũng được."}, {"t": "Fine, I'll bring you a coffee.", "vi": "Được, tôi sẽ mang cà phê cho bạn."}, {"t": "Actually, I'd prefer an aisle seat.", "vi": "Thật ra tôi thích ghế cạnh lối đi hơn."}], "ans": ["C"], "key": "Would you like …? → đồng ý / từ chối kèm lựa chọn khác", "ex": "(C) từ chối khéo, chọn ghế lối đi. (A), (B) mở đầu đồng ý nhưng nội dung không liên quan.", "label": "7"}]}, {"title": "Part 2 · Câu 8", "tag": "Xin lời khuyên", "audio": "../../audio/atc3/p2-c8.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Should I wear a jacket to the business dinner?", "vi": "Tôi có nên mặc áo khoác đến bữa tối công việc không?"}], "qs": [{"n": 14, "q": "", "qvi": "", "opts": [{"t": "Yes, it's going to be a formal event.", "vi": "Có, đó là sự kiện trang trọng."}, {"t": "Sure, I'll be coming after dinner.", "vi": "Được, tôi sẽ đến sau bữa tối."}, {"t": "That's too bad. I've just lost my jacket.", "vi": "Tiếc quá. Tôi vừa làm mất áo khoác."}], "ans": ["A"], "key": "Should I …? → Yes/No + lý do", "ex": "(A) Có, vì là sự kiện trang trọng. (C) lặp từ jacket.", "label": "8"}]}, {"title": "Part 2 · Câu 9", "tag": "Yes/No", "audio": "../../audio/atc3/p2-c9.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Has the client's flight been delayed?", "vi": "Chuyến bay của khách hàng bị hoãn à?"}], "qs": [{"n": 15, "q": "", "qvi": "", "opts": [{"t": "Yes, it's on your desk.", "vi": "Vâng, nó ở trên bàn bạn."}, {"t": "No, not that I know of.", "vi": "Không, theo tôi biết thì không."}, {"t": "It's up there.", "vi": "Nó ở trên đó."}], "ans": ["B"], "key": "not that I know of = theo tôi biết thì không", "ex": "(B) trả lời đúng. (A) mở đầu Yes nhưng nội dung không liên quan.", "label": "9"}]}, {"title": "Part 2 · Câu 10", "tag": "Câu hỏi phủ định", "audio": "../../audio/atc3/p2-c10.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Doesn't the company reimburse all travel expenses?", "vi": "Công ty không hoàn trả mọi chi phí đi lại sao?"}], "qs": [{"n": 16, "q": "", "qvi": "", "opts": [{"t": "No, I've never traveled before.", "vi": "Không, tôi chưa đi du lịch bao giờ."}, {"t": "Yes, but by plane.", "vi": "Có, nhưng bằng máy bay."}, {"t": "Let me check with the finance department.", "vi": "Để tôi hỏi phòng tài chính."}], "ans": ["C"], "key": "\"Để tôi kiểm tra / hỏi…\" là đáp án an toàn", "ex": "(C) để tôi hỏi phòng tài chính. (A) lặp từ travel. (B) không hợp lý.", "label": "10"}]}, {"title": "Part 5 · Câu 1", "tag": "Từ loại · số nhiều", "qs": [{"n": 17, "q": "The company's senior ___ are required to attend the international summit in Tokyo next month.", "qvi": "Các lãnh đạo cấp cao của công ty phải dự hội nghị thượng đỉnh ở Tokyo tháng tới.", "opts": [{"t": "executives"}, {"t": "executions"}, {"t": "executive"}, {"t": "executively"}], "ans": ["A"], "key": "", "ex": "senior + danh từ chỉ người số nhiều (động từ \"are\") → executives.", "label": "1"}]}, {"title": "Part 5 · Câu 2", "tag": "Từ vựng", "qs": [{"n": 18, "q": "Please remember to save all your original ___ if you want to get your money back for hotel expenses.", "qvi": "Hãy nhớ giữ mọi hoá đơn gốc nếu muốn được hoàn tiền khách sạn.", "opts": [{"t": "receipts"}, {"t": "recipes"}, {"t": "receptions"}, {"t": "recipients"}], "ans": ["A"], "key": "", "ex": "Giữ hoá đơn để được hoàn tiền → receipts. recipes (công thức), receptions (tiệc), recipients (người nhận) là bẫy giống âm.", "label": "2"}]}, {"title": "Part 5 · Câu 3", "tag": "Đại từ quan hệ", "qs": [{"n": 19, "q": "Mr. Tanaka, ___ has to board a plane to Seoul tonight, forgot his passport at the office.", "qvi": "Ông Tanaka, người tối nay phải bay đi Seoul, đã để quên hộ chiếu ở văn phòng.", "opts": [{"t": "which"}, {"t": "whom"}, {"t": "who"}, {"t": "whose"}], "ans": ["C"], "key": "", "ex": "Thay cho người (Mr. Tanaka) và làm chủ ngữ của \"has to board\" → who.", "label": "3"}]}, {"title": "Part 5 · Câu 4", "tag": "Danh từ ghép", "qs": [{"n": 20, "q": "Employees must submit a detailed report to the ___ within five business days after returning from a trip.", "qvi": "Nhân viên phải nộp báo cáo chi tiết cho phòng tài chính trong 5 ngày làm việc sau chuyến công tác.", "opts": [{"t": "finance department"}, {"t": "financial departmental"}, {"t": "financially department"}, {"t": "finances department"}], "ans": ["A"], "key": "", "ex": "Tên phòng ban: finance department.", "label": "4"}]}, {"title": "Part 5 · Câu 5", "tag": "Câu điều kiện loại 1", "qs": [{"n": 21, "q": "If the flight is delayed for more than four hours, the airline ___ for the passengers' meals.", "qvi": "Nếu chuyến bay trễ hơn 4 tiếng, hãng sẽ hoàn tiền bữa ăn cho hành khách.", "opts": [{"t": "will reimburse"}, {"t": "would reimburse"}, {"t": "had reimbursed"}, {"t": "reimbursed"}], "ans": ["A"], "key": "", "ex": "If + hiện tại (is delayed) → will + V: will reimburse.", "label": "5"}]}, {"title": "Part 5 · Câu 6", "tag": "have to + V", "qs": [{"n": 22, "q": "Due to an urgent family emergency back home, Mr. Smith had to ___ and fly back to Chicago immediately.", "qvi": "Vì việc gia đình khẩn cấp, ông Smith phải rút ngắn chuyến đi và bay ngay về Chicago.", "opts": [{"t": "lengthen his stay"}, {"t": "broaden his stay"}, {"t": "shorten his stay"}, {"t": "cancel his stay"}], "ans": ["C"], "key": "", "ex": "Về gấp → shorten his stay (rút ngắn thời gian lưu trú). lengthen (kéo dài), broaden (mở rộng) trái nghĩa; cancel his stay không phải cụm tự nhiên.", "label": "6"}]}, {"title": "Part 5 · Câu 7", "tag": "Cụm từ", "qs": [{"n": 23, "q": "Before you leave for the airport, make sure you properly ___ with all necessary business documents and attire.", "qvi": "Trước khi ra sân bay, hãy xếp va li đầy đủ giấy tờ công việc và trang phục.", "opts": [{"t": "pack a suitcase"}, {"t": "pack a bag"}, {"t": "packing a suitcase"}, {"t": "packs a suitcase"}], "ans": ["A"], "key": "", "ex": "make sure you + V nguyên mẫu; đáp án sách: pack a suitcase.", "label": "7"}]}, {"title": "Part 5 · Câu 8", "tag": "Trạng từ quan hệ", "qs": [{"n": 24, "q": "The hotel ___ the business dinner was held last night offers excellent catering services.", "qvi": "Khách sạn nơi tổ chức bữa tối công việc tối qua có dịch vụ ăn uống rất tốt.", "opts": [{"t": "which"}, {"t": "where"}, {"t": "when"}, {"t": "whose"}], "ans": ["B"], "key": "", "ex": "Nơi chốn (the hotel) + mệnh đề đầy đủ (the dinner was held) → where.", "label": "8"}]}, {"title": "Part 5 · Câu 9", "tag": "Cụm từ", "qs": [{"n": 25, "q": "Since it was raining heavily outside the convention center, the secretary decided to ___ for the clients.", "qvi": "Vì trời mưa to, thư ký quyết định gọi taxi cho khách.", "opts": [{"t": "call a cab"}, {"t": "call a phone"}, {"t": "drive a cab"}, {"t": "ride a cab"}], "ans": ["A"], "key": "", "ex": "call a cab = gọi taxi (cho người khác).", "label": "9"}]}, {"title": "Part 5 · Câu 10", "tag": "Câu điều kiện loại 3", "qs": [{"n": 26, "q": "If Mr. Jones ___ a formal event to attend tonight, he would not have rented such an expensive tuxedo.", "qvi": "Nếu tối nay ông Jones không có sự kiện trang trọng phải dự, ông đã không thuê bộ lễ phục đắt như vậy.", "opts": [{"t": "didn't have"}, {"t": "hasn't had"}, {"t": "hadn't had"}, {"t": "doesn't have"}], "ans": ["C"], "key": "", "ex": "Mệnh đề chính would not have rented (việc đã làm trong quá khứ) → If + had (not) + V3: hadn't had.", "label": "10"}]}, {"title": "Part 5 · Câu 11", "tag": "Từ vựng", "qs": [{"n": 27, "q": "The client prefers to sit in an ___ because he likes to stretch his legs during long-haul flights.", "qvi": "Khách thích ngồi ghế lối đi vì muốn duỗi chân trên chuyến bay dài.", "opts": [{"t": "window seat"}, {"t": "aisle seat"}, {"t": "middle seat"}, {"t": "front seat"}], "ans": ["B"], "key": "", "ex": "an + nguyên âm, duỗi chân → aisle seat.", "label": "11"}]}, {"title": "Part 5 · Câu 12", "tag": "Đại từ quan hệ", "qs": [{"n": 28, "q": "The travel expense report ___ you submitted yesterday contains several calculation errors.", "qvi": "Bản báo cáo chi phí bạn nộp hôm qua có vài lỗi tính toán.", "opts": [{"t": "who"}, {"t": "whom"}, {"t": "whose"}, {"t": "which"}], "ans": ["D"], "key": "", "ex": "Thay cho vật (report), làm tân ngữ của \"you submitted\" → which.", "label": "12"}]}, {"title": "Part 5 · Câu 13", "tag": "Cụm từ", "qs": [{"n": 29, "q": "Mr. Green was still talking on his ___ when the taxi arrived to take him to the airport.", "qvi": "Ông Green vẫn đang nói điện thoại bàn khi taxi đến đón ra sân bay.", "opts": [{"t": "office phone"}, {"t": "office desk"}, {"t": "office chair"}, {"t": "office work"}], "ans": ["A"], "key": "", "ex": "talk on the phone → talking on his office phone.", "label": "13"}]}, {"title": "Part 5 · Câu 14", "tag": "Câu điều kiện loại 2", "qs": [{"n": 30, "q": "If the company ___ all travel expenses, more employees would volunteer to visit overseas clients.", "qvi": "Nếu công ty hoàn trả mọi chi phí đi lại, nhiều nhân viên hơn sẽ tình nguyện đi gặp khách hàng nước ngoài.", "opts": [{"t": "reimburses"}, {"t": "reimbursed"}, {"t": "had reimbursed"}, {"t": "will reimburse"}], "ans": ["B"], "key": "", "ex": "would volunteer → loại 2: If + quá khứ đơn: reimbursed.", "label": "14"}]}, {"title": "Part 5 · Câu 15", "tag": "Danh từ ghép", "qs": [{"n": 31, "q": "All meals and transportation costs incurred during the business trip are considered a legitimate ___.", "qvi": "Mọi chi phí ăn uống và di chuyển trong chuyến công tác được coi là chi phí đi lại hợp lệ.", "opts": [{"t": "travel expense"}, {"t": "travel expensive"}, {"t": "traveling expensively"}, {"t": "travel expending"}], "ans": ["A"], "key": "", "ex": "a legitimate + danh từ → travel expense.", "label": "15"}]}, {"title": "Part 6 · Email chính sách công tác", "tag": "E-mail", "passage": ["TO: All Staff · FROM: Human Resources Department · DATE: October 12 · SUBJECT: New Corporate Travel Policy", "Starting next month, our company will implement an updated policy for all official business trips. Company ⟦1⟧ who travel for international conferences must book their flights at least two weeks in advance.", "If an employee needs to adjust their travel itinerary due to unexpected scheduling conflicts, they ⟦2⟧ the HR department immediately. ⟦3⟧. Please note that if you have to ⟦4⟧ and return early, the company will still cover the cancellation fees."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Từ tháng sau, công ty sẽ áp dụng chính sách mới cho mọi chuyến công tác. Lãnh đạo công ty đi dự hội nghị quốc tế phải đặt vé máy bay trước ít nhất hai tuần. Nếu nhân viên cần đổi lịch trình vì trùng lịch bất ngờ, họ phải báo ngay cho phòng nhân sự. Việc này giúp chúng tôi điều chỉnh đặt phòng khách sạn kịp thời. Lưu ý: nếu bạn phải huỷ và về sớm, công ty vẫn chi trả phí huỷ."}], "qs": [{"n": 32, "q": "Chỗ trống (1)", "qvi": "", "opts": [{"t": "executing"}, {"t": "executive"}, {"t": "executives"}, {"t": "execution"}], "ans": ["C"], "key": "Từ loại · số nhiều", "ex": "Company + danh từ chỉ người số nhiều (đi với \"who travel\", \"their flights\") → executives.", "label": "1"}, {"n": 33, "q": "Chỗ trống (2)", "qvi": "", "opts": [{"t": "must notify"}, {"t": "would notify"}, {"t": "notified"}, {"t": "had notified"}], "ans": ["A"], "key": "Động từ khuyết thiếu", "ex": "Đây là quy định bắt buộc trong chính sách → must notify (phải báo).", "label": "2"}, {"n": 34, "q": "Chỗ trống (3)", "qvi": "", "opts": [{"t": "The finance department is currently hiring new accountants."}, {"t": "This allows us to make necessary adjustments to your hotel bookings."}, {"t": "Luggage restrictions vary depending on the airline you choose."}, {"t": "Most business dinners are scheduled to start at 7:00 PM."}], "ans": ["B"], "key": "Điền câu", "ex": "Câu trước: báo ngay cho HR → (B) \"Việc này giúp chúng tôi điều chỉnh đặt phòng\". This thay cho việc báo HR.", "label": "3"}, {"n": 35, "q": "Chỗ trống (4)", "qvi": "", "opts": [{"t": "cancel"}, {"t": "cancellation"}, {"t": "cancelled"}, {"t": "cancelling"}], "ans": ["A"], "key": "have to + V", "ex": "have to + V nguyên mẫu, song song với \"and return early\" → cancel. (Đáp án in trong sách ghi (C) là chưa đúng ngữ pháp.)", "label": "4"}]}], "recap": "<h2>Ghi nhớ sau bài</h2><p>Làm lại các câu sai sau 2–3 ngày. Ôn từ vựng của buổi bằng nút <b>🃏 Flashcard</b> ở cuối trang.</p>", "qviAfter": true};</script>
