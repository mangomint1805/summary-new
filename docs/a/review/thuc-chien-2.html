thật) → đọc dịch và giải thích. Câu đọc thì chọn đáp án rồi xem vì sao đúng, vì sao sai.", "stepsTitle": "Nhắc lại chiến lược", "steps": ["<b>Part 2 – U.U.U:</b> nghe thật kỹ 3–4 từ đầu (Who, Where, Why, How long…). Câu hỏi Wh- không trả lời bằng Yes/No; đáp án lặp từ hoặc lặp âm thường là bẫy; trả lời gián tiếp (\"để tôi kiểm tra\") thường đúng.", "<b>Part 5, 6 – C.E.P:</b> nhìn 4 đáp án để phân loại (từ loại, thì, câu điều kiện, từ vựng) → loại đáp án sai → dự đoán từ dấu hiệu trong câu."], "groups": [{"title": "Nghe và điền từ – đoạn a (Track 01)", "tag": "Từ vựng", "audio": "../../audio/atc2/track01.mp3", "passage": ["Our company has an important schedule next week. First, all managers must **(1) submit** a proposal today. We will discuss it at the board **(2) meeting** on Monday. Next, we need to **(3) book** a venue for our new international seminar. This big event will help us **(4) earn** high profit. Finally, Ms. Patel will facilitate the **(5) meeting** to train our staff on Friday."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "Our company has an important schedule next week. First, all managers must (1) submit a proposal today. We will discuss it at the board (2) meeting on Monday. Next, we need to (3) book a venue for our new international seminar. This big event will help us (4) earn high profit. Finally, Ms. Patel will facilitate the (5) meeting to train our staff on Friday.", "vi": "Tuần tới công ty có lịch quan trọng. Trước hết, mọi quản lý phải nộp bản đề xuất ngay hôm nay. Chúng ta sẽ bàn về nó tại cuộc họp ban lãnh đạo vào thứ Hai. Tiếp theo, cần đặt địa điểm cho hội thảo quốc tế mới. Sự kiện lớn này sẽ giúp ta thu lợi nhuận cao. Cuối cùng, chị Patel sẽ điều phối cuộc họp đào tạo nhân viên vào thứ Sáu."}], "qs": []}, {"title": "Nghe và điền từ – đoạn b (Track 02)", "tag": "Từ vựng", "audio": "../../audio/atc2/track02.mp3", "passage": ["We are preparing for a very busy month. Our directors will travel soon to host a large international **(6) seminar** for global clients. During this trip, they will also negotiate the **(7) contract** with new partners. Finally, for the staff at home, HR will organize a virtual **(8) training** session online this Thursday."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "We are preparing for a very busy month. Our directors will travel soon to host a large international (6) seminar for global clients. During this trip, they will also negotiate the (7) contract with new partners. Finally, for the staff at home, HR will organize a virtual (8) training session online this Thursday.", "vi": "Chúng ta đang chuẩn bị cho một tháng rất bận. Các giám đốc sắp đi công tác để tổ chức một hội thảo quốc tế lớn cho khách hàng toàn cầu. Trong chuyến đi này, họ cũng sẽ đàm phán hợp đồng với đối tác mới. Còn với nhân viên ở nhà, phòng nhân sự sẽ tổ chức buổi đào tạo trực tuyến vào thứ Năm này."}], "qs": []}, {"title": "Part 2 · Câu 1", "tag": "Where", "audio": "../../audio/atc2/p2-c1.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Where can I find the laptop?", "vi": "Tôi có thể tìm chiếc laptop ở đâu?"}], "qs": [{"n": 1, "q": "", "qvi": "", "opts": [{"t": "In the meeting room, I think.", "vi": "Trong phòng họp, tôi nghĩ vậy."}, {"t": "At 6 o'clock, I guess.", "vi": "Lúc 6 giờ, tôi đoán thế."}, {"t": "What does the screen say?", "vi": "Màn hình ghi gì?"}], "ans": ["A"], "key": "Where → nơi chốn: in the meeting room", "ex": "Where hỏi nơi chốn → (A) trong phòng họp. (B) trả lời thời gian (When). (C) \"screen\" liên tưởng tới laptop, không trả lời câu hỏi.", "label": "1"}]}, {"title": "Part 2 · Câu 2", "tag": "What time", "audio": "../../audio/atc2/p2-c2.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "What time is the meeting?", "vi": "Cuộc họp lúc mấy giờ?"}], "qs": [{"n": 2, "q": "", "qvi": "", "opts": [{"t": "At the office downtown.", "vi": "Ở văn phòng trung tâm."}, {"t": "On the same day.", "vi": "Cùng ngày."}, {"t": "In half an hour.", "vi": "Nửa tiếng nữa."}], "ans": ["C"], "key": "What time → thời điểm: in half an hour", "ex": "What time hỏi giờ → (C) nửa tiếng nữa. (A) nơi chốn. (B) \"cùng ngày\" không nói mấy giờ.", "label": "2"}]}, {"title": "Part 2 · Câu 3", "tag": "Lời đề nghị", "audio": "../../audio/atc2/p2-c3.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Why don't we check whether the projector works?", "vi": "Sao chúng ta không kiểm tra xem máy chiếu có chạy không?"}], "qs": [{"n": 3, "q": "", "qvi": "", "opts": [{"t": "They'll arrive in the morning.", "vi": "Họ sẽ đến vào buổi sáng."}, {"t": "That's an excellent idea.", "vi": "Ý hay đấy."}, {"t": "They said it would rain later.", "vi": "Họ nói lát nữa trời sẽ mưa."}], "ans": ["B"], "key": "Why don't we …? = lời đề nghị → đồng ý / từ chối", "ex": "\"Why don't we…\" không hỏi lý do mà là lời đề nghị → (B) đồng ý. (A), (C) không liên quan.", "label": "3"}]}, {"title": "Part 2 · Câu 4", "tag": "What", "audio": "../../audio/atc2/p2-c4.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "What should we wear to the conference?", "vi": "Chúng ta nên mặc gì đến hội nghị?"}], "qs": [{"n": 4, "q": "", "qvi": "", "opts": [{"t": "A business suit would be appropriate.", "vi": "Một bộ vest công sở sẽ phù hợp."}, {"t": "Let's get there early and save seats.", "vi": "Mình đến sớm và giữ chỗ đi."}, {"t": "I went to the conference last year, too.", "vi": "Năm ngoái tôi cũng dự hội nghị đó."}], "ans": ["A"], "key": "wear → trả lời trang phục", "ex": "Hỏi mặc gì → (A) bộ vest công sở. (C) lặp từ \"conference\" – bẫy lặp từ.", "label": "4"}]}, {"title": "Part 2 · Câu 5", "tag": "Who · trả lời gián tiếp", "audio": "../../audio/atc2/p2-c5.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Who is attending the president's luncheon?", "vi": "Ai sẽ dự bữa trưa với chủ tịch?"}], "qs": [{"n": 5, "q": "", "qvi": "", "opts": [{"t": "He'll choose the day.", "vi": "Ông ấy sẽ chọn ngày."}, {"t": "I'll check the guest list.", "vi": "Để tôi xem danh sách khách mời."}, {"t": "The lunchroom, I think.", "vi": "Phòng ăn trưa, tôi nghĩ vậy."}], "ans": ["B"], "key": "Trả lời gián tiếp: \"để tôi kiểm tra\"", "ex": "Who hỏi người. (B) \"để tôi xem danh sách khách\" là trả lời gián tiếp rất hay gặp. (C) lunchroom lặp âm với luncheon.", "label": "5"}]}, {"title": "Part 2 · Câu 6", "tag": "Where", "audio": "../../audio/atc2/p2-c6.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Where did you put that budget report?", "vi": "Bạn để bản báo cáo ngân sách ở đâu?"}], "qs": [{"n": 6, "q": "", "qvi": "", "opts": [{"t": "Report to the lobby.", "vi": "Hãy có mặt ở sảnh."}, {"t": "Next Wednesday.", "vi": "Thứ Tư tới."}, {"t": "On your desk.", "vi": "Trên bàn của bạn."}], "ans": ["C"], "key": "Where → nơi chốn: on your desk", "ex": "Where → (C) trên bàn. (A) lặp từ \"report\" (nghĩa khác: trình diện). (B) thời gian.", "label": "6"}]}, {"title": "Part 2 · Câu 7", "tag": "Where · going", "audio": "../../audio/atc2/p2-c7.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Where is Jennifer going now?", "vi": "Bây giờ Jennifer đang đi đâu?"}], "qs": [{"n": 7, "q": "", "qvi": "", "opts": [{"t": "To a budget meeting.", "vi": "Đến một cuộc họp ngân sách."}, {"t": "At the train station.", "vi": "Ở nhà ga."}, {"t": "I thought it was yesterday.", "vi": "Tôi tưởng là hôm qua."}], "ans": ["A"], "key": "going (to) → đi đến đâu: To + nơi/sự kiện", "ex": "\"going\" → đi đến đâu: (A) To a budget meeting. (B) \"At\" chỉ vị trí đang ở, không khớp với \"going\". (C) thời gian.", "label": "7"}]}, {"title": "Part 2 · Câu 8", "tag": "Why", "audio": "../../audio/atc2/p2-c8.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Why was the meeting postponed?", "vi": "Vì sao cuộc họp bị hoãn?"}], "qs": [{"n": 8, "q": "", "qvi": "", "opts": [{"t": "I posted it yesterday.", "vi": "Tôi đã đăng nó hôm qua."}, {"t": "The client had another appointment.", "vi": "Khách hàng có cuộc hẹn khác."}, {"t": "To next Thursday.", "vi": "Sang thứ Năm tới."}], "ans": ["B"], "key": "Why → lý do (có thể không có \"because\")", "ex": "Why hỏi lý do → (B) khách có hẹn khác. (A) posted lặp âm với postponed. (C) trả lời hoãn đến khi nào.", "label": "8"}]}, {"title": "Part 2 · Câu 9", "tag": "Who · trả lời gián tiếp", "audio": "../../audio/atc2/p2-c9.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Who extended our phone contract?", "vi": "Ai đã gia hạn hợp đồng điện thoại của chúng ta?"}], "qs": [{"n": 9, "q": "", "qvi": "", "opts": [{"t": "Check the name on the form.", "vi": "Xem tên trên mẫu đơn đi."}, {"t": "For six months, I think.", "vi": "Sáu tháng, tôi nghĩ vậy."}, {"t": "I'll phone you later.", "vi": "Lát tôi gọi cho bạn."}], "ans": ["A"], "key": "Trả lời gián tiếp: chỉ chỗ tìm thông tin", "ex": "(A) bảo xem tên trên đơn → gián tiếp trả lời \"ai\". (B) trả lời gia hạn bao lâu. (C) lặp từ phone.", "label": "9"}]}, {"title": "Part 2 · Câu 10", "tag": "Who · trả lời \"chưa biết\"", "audio": "../../audio/atc2/p2-c10.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Who is the new marketing manager?", "vi": "Ai là trưởng phòng marketing mới?"}], "qs": [{"n": 10, "q": "", "qvi": "", "opts": [{"t": "I haven't heard yet.", "vi": "Tôi chưa nghe nói."}, {"t": "The new campaign.", "vi": "Chiến dịch mới."}, {"t": "Just a few people.", "vi": "Chỉ vài người thôi."}], "ans": ["A"], "key": "\"I haven't heard yet / I'm not sure\" luôn có thể là đáp án", "ex": "(A) \"tôi chưa nghe\" – kiểu trả lời \"không biết\" là đáp án hợp lệ. (B) lặp từ new. (C) trả lời số lượng.", "label": "10"}]}, {"title": "Part 5 · Câu 1", "tag": "Câu điều kiện loại 1", "qs": [{"n": 11, "q": "If the marketing team ___ the budget proposal by 3 PM, the director will review it before the board meeting.", "qvi": "Nếu nhóm marketing nộp đề xuất ngân sách trước 3 giờ chiều, giám đốc sẽ xem nó trước cuộc họp ban lãnh đạo.", "opts": [{"t": "submits"}, {"t": "submitted"}, {"t": "will submit"}, {"t": "had submitted"}], "ans": ["A"], "key": "", "ex": "Mệnh đề chính will review → loại 1: If + hiện tại đơn (submits).", "label": "1"}]}, {"title": "Part 5 · Câu 2", "tag": "Câu điều kiện loại 0 + bị động", "qs": [{"n": 12, "q": "The technical assistant always checks the microphones if the conference room ___ for an international seminar.", "qvi": "Trợ lý kỹ thuật luôn kiểm tra micro nếu phòng hội nghị được dùng cho hội thảo quốc tế.", "opts": [{"t": "used"}, {"t": "is used"}, {"t": "will be used"}, {"t": "would be used"}], "ans": ["B"], "key": "", "ex": "always checks (thói quen) → loại 0: If + hiện tại đơn. Phòng \"được dùng\" → bị động is used.", "label": "2"}]}, {"title": "Part 5 · Câu 3", "tag": "Từ vựng", "qs": [{"n": 13, "q": "The manager needs to ___ the budget proposal to the director before the Friday deadline.", "qvi": "Quản lý cần nộp đề xuất ngân sách cho giám đốc trước hạn thứ Sáu.", "opts": [{"t": "demand"}, {"t": "refund"}, {"t": "submit"}, {"t": "reserve"}], "ans": ["C"], "key": "", "ex": "submit sth to sb = nộp cái gì cho ai.", "label": "3"}]}, {"title": "Part 5 · Câu 4", "tag": "Từ vựng", "qs": [{"n": 14, "q": "All leaders are required to attend the ___ meeting tomorrow to discuss the new strategy.", "qvi": "Mọi lãnh đạo phải dự cuộc họp ban lãnh đạo ngày mai để bàn chiến lược mới.", "opts": [{"t": "board"}, {"t": "border"}, {"t": "abroad"}, {"t": "broad"}], "ans": ["A"], "key": "", "ex": "board meeting = cuộc họp ban lãnh đạo. border (biên giới), abroad (ở nước ngoài), broad (rộng) là bẫy giống âm.", "label": "4"}]}, {"title": "Part 5 · Câu 5", "tag": "Từ loại + nghĩa", "qs": [{"n": 15, "q": "Companies from over ten countries will present their projects at the ___ seminar next month.", "qvi": "Công ty từ hơn mười quốc gia sẽ trình bày dự án tại hội thảo quốc tế tháng tới.", "opts": [{"t": "international"}, {"t": "internally"}, {"t": "internal"}, {"t": "internationalize"}], "ans": ["A"], "key": "", "ex": "Trước danh từ cần tính từ; \"hơn mười quốc gia\" → international (quốc tế), không phải internal (nội bộ).", "label": "5"}]}, {"title": "Part 5 · Câu 6", "tag": "Cụm từ", "qs": [{"n": 16, "q": "Since the annual gala expects more than 500 guests, the event planner must ___ a larger venue as soon as possible.", "qvi": "Vì buổi dạ tiệc dự kiến hơn 500 khách, người tổ chức phải đặt địa điểm lớn hơn càng sớm càng tốt.", "opts": [{"t": "hire"}, {"t": "book"}, {"t": "catch"}, {"t": "register"}], "ans": ["B"], "key": "", "ex": "book a venue = đặt địa điểm.", "label": "6"}]}, {"title": "Part 5 · Câu 7", "tag": "Câu điều kiện loại 2", "qs": [{"n": 17, "q": "If I ___ in charge of organizing the annual general meeting, I would book a larger venue.", "qvi": "Nếu tôi phụ trách tổ chức đại hội thường niên, tôi sẽ đặt địa điểm lớn hơn.", "opts": [{"t": "am"}, {"t": "was"}, {"t": "were"}, {"t": "had been"}], "ans": ["C"], "key": "", "ex": "would book → loại 2: If + quá khứ đơn; với be dùng were cho mọi ngôi.", "label": "7"}]}, {"title": "Part 5 · Câu 8", "tag": "Câu điều kiện loại 3", "qs": [{"n": 18, "q": "The company ___ a higher profit last quarter if the sales representatives had negotiated the contract more effectively.", "qvi": "Công ty đã có thể thu lợi nhuận cao hơn quý trước nếu nhân viên bán hàng đàm phán hợp đồng hiệu quả hơn.", "opts": [{"t": "would earn"}, {"t": "will earn"}, {"t": "earned"}, {"t": "would have earned"}], "ans": ["D"], "key": "", "ex": "had negotiated + last quarter (quá khứ) → loại 3: would have + V3.", "label": "8"}]}, {"title": "Part 5 · Câu 9", "tag": "Cụm từ", "qs": [{"n": 19, "q": "Thanks to the success of the new smartphone line, the corporation managed to earn a higher ___ this quarter.", "qvi": "Nhờ dòng điện thoại mới thành công, tập đoàn đạt lợi nhuận cao hơn quý này.", "opts": [{"t": "benefit"}, {"t": "cost"}, {"t": "profit"}, {"t": "expense"}], "ans": ["C"], "key": "", "ex": "earn a profit = thu lợi nhuận.", "label": "9"}]}, {"title": "Part 5 · Câu 10", "tag": "Câu điều kiện loại 1", "qs": [{"n": 20, "q": "Clients can gain access to the secure video if they ___ the correct password.", "qvi": "Khách hàng có thể xem video bảo mật nếu nhập đúng mật khẩu.", "opts": [{"t": "enter"}, {"t": "entered"}, {"t": "will enter"}, {"t": "are entering"}], "ans": ["A"], "key": "", "ex": "Mệnh đề chính can gain (hiện tại) → If + hiện tại đơn: enter.", "label": "10"}]}, {"title": "Part 5 · Câu 11", "tag": "Câu điều kiện loại 2", "qs": [{"n": 21, "q": "If the office internet connection ___ stronger, we could host the virtual training session without any interruptions.", "qvi": "Nếu mạng văn phòng mạnh hơn, chúng ta đã có thể tổ chức buổi đào tạo trực tuyến không bị gián đoạn.", "opts": [{"t": "is"}, {"t": "were"}, {"t": "will be"}, {"t": "had been"}], "ans": ["B"], "key": "", "ex": "could host → loại 2: If + were.", "label": "11"}]}, {"title": "Part 5 · Câu 12", "tag": "Câu điều kiện loại 3", "qs": [{"n": 22, "q": "If the project manager ___ the feedback yesterday, the team would have modified the presentation slides.", "qvi": "Nếu hôm qua quản lý dự án nhận được góp ý, nhóm đã sửa slide thuyết trình rồi.", "opts": [{"t": "receives"}, {"t": "received"}, {"t": "had received"}, {"t": "would receive"}], "ans": ["C"], "key": "", "ex": "would have modified + yesterday → loại 3: If + had + V3.", "label": "12"}]}, {"title": "Part 5 · Câu 13", "tag": "Câu điều kiện loại 1", "qs": [{"n": 23, "q": "Ms. Ramirez will facilitate the brainstorming session if the department head ___ to attend.", "qvi": "Chị Ramirez sẽ điều phối buổi động não nếu trưởng phòng không thể tham dự.", "opts": [{"t": "is unable"}, {"t": "was unable"}, {"t": "will be unable"}, {"t": "had been unable"}], "ans": ["A"], "key": "", "ex": "will facilitate → loại 1: If + hiện tại đơn (is unable). Không dùng will sau if.", "label": "13"}]}, {"title": "Part 5 · Câu 14", "tag": "Từ vựng", "qs": [{"n": 24, "q": "The director wants to ___ the new contract before signing it.", "qvi": "Giám đốc muốn đàm phán hợp đồng mới trước khi ký.", "opts": [{"t": "evaluate"}, {"t": "broadcast"}, {"t": "negotiate"}, {"t": "advertise"}], "ans": ["C"], "key": "", "ex": "negotiate a contract = đàm phán hợp đồng. Theo đáp án sách: (C).", "label": "14"}]}, {"title": "Part 5 · Câu 15", "tag": "Từ vựng", "qs": [{"n": 25, "q": "Because the regional teams are working remotely, the HR department will host a ___ training session via Zoom.", "qvi": "Vì các nhóm khu vực làm việc từ xa, phòng nhân sự sẽ tổ chức buổi đào tạo trực tuyến qua Zoom.", "opts": [{"t": "virtual"}, {"t": "visual"}, {"t": "visible"}, {"t": "vital"}], "ans": ["A"], "key": "", "ex": "via Zoom → virtual (trực tuyến). visual/visible/vital là bẫy giống âm.", "label": "15"}]}, {"title": "Part 5 · Câu 16", "tag": "Từ loại", "qs": [{"n": 26, "q": "Ms. Davis was selected to ___ the meeting because she is excellent at guiding group discussions.", "qvi": "Chị Davis được chọn điều phối cuộc họp vì chị rất giỏi dẫn dắt thảo luận nhóm.", "opts": [{"t": "facility"}, {"t": "facilitate"}, {"t": "facilitation"}, {"t": "facilitator"}], "ans": ["B"], "key": "", "ex": "to + V nguyên mẫu → facilitate (điều phối).", "label": "16"}]}, {"title": "Part 5 · Câu 17", "tag": "Cụm từ", "qs": [{"n": 27, "q": "Before the purchasing department can buy any new office equipment, they must submit a detailed budget ___ for approval.", "qvi": "Trước khi phòng mua hàng mua thiết bị mới, họ phải nộp đề xuất ngân sách chi tiết để duyệt.", "opts": [{"t": "revision"}, {"t": "permission"}, {"t": "proposal"}, {"t": "committee"}], "ans": ["C"], "key": "", "ex": "budget proposal = đề xuất ngân sách; \"for approval\" (để được duyệt).", "label": "17"}]}, {"title": "Part 5 · Câu 18", "tag": "Từ vựng", "qs": [{"n": 28, "q": "Mr. Tanaka has extensive experience in international relations, so he was asked to help negotiate the ___ with the overseas distributors.", "qvi": "Ông Tanaka giàu kinh nghiệm quan hệ quốc tế nên được nhờ giúp đàm phán hợp đồng với nhà phân phối nước ngoài.", "opts": [{"t": "contract"}, {"t": "contact"}, {"t": "connection"}, {"t": "contest"}], "ans": ["A"], "key": "", "ex": "negotiate the contract = đàm phán hợp đồng. contact (liên lạc), contest (cuộc thi) là bẫy giống âm.", "label": "18"}]}, {"title": "Part 5 · Câu 19", "tag": "Câu điều kiện loại 3", "qs": [{"n": 29, "q": "We could have booked a larger venue for the seminar if the coordinator ___ the contract earlier.", "qvi": "Chúng ta đã có thể đặt địa điểm lớn hơn nếu người điều phối giành được hợp đồng sớm hơn.", "opts": [{"t": "earned"}, {"t": "will earn"}, {"t": "would earn"}, {"t": "had earned"}], "ans": ["D"], "key": "", "ex": "could have booked → loại 3: If + had + V3 (had earned).", "label": "19"}]}, {"title": "Part 5 · Câu 20", "tag": "Câu điều kiện loại 1", "qs": [{"n": 30, "q": "If the consultant arrives on time, she ___ the afternoon meeting.", "qvi": "Nếu chuyên gia tư vấn đến đúng giờ, cô ấy sẽ điều phối cuộc họp buổi chiều.", "opts": [{"t": "facilitated"}, {"t": "will facilitate"}, {"t": "would facilitate"}, {"t": "had facilitated"}], "ans": ["B"], "key": "", "ex": "If + hiện tại (arrives) → mệnh đề chính will + V.", "label": "20"}]}, {"title": "Part 6 · Email thông báo sự kiện", "tag": "E-mail", "passage": ["To: All Staff · From: Management · Subject: Important Events", "All department heads must submit a budget proposal by Friday. If the financial team does not review these numbers early, we ⟦1⟧ to approve the funding during the board meeting next month.", "Meanwhile, we are finalizing the international seminar. If we ⟦2⟧ a larger venue earlier, we would have accommodated more global partners. However, we will make do with our ⟦3⟧ space.", "Mr. Davis is away to negotiate the contract, which will help us earn high profits. In his absence, Ms. Patel will facilitate the meeting regarding the new software. Finally, HR will host a virtual training session on Thursday. ⟦4⟧"], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Mọi trưởng phòng phải nộp đề xuất ngân sách trước thứ Sáu. Nếu nhóm tài chính không xem sớm các số liệu này, chúng ta sẽ không thể duyệt kinh phí trong cuộc họp ban lãnh đạo tháng tới. Trong khi đó, chúng ta đang hoàn tất hội thảo quốc tế. Nếu đặt địa điểm lớn hơn sớm hơn, chúng ta đã có thể đón thêm đối tác. Tuy vậy, chúng ta sẽ tạm dùng không gian hiện có. Ông Davis đang đi đàm phán hợp đồng giúp ta có lợi nhuận cao. Khi ông vắng mặt, chị Patel sẽ điều phối cuộc họp về phần mềm mới. Cuối cùng, phòng nhân sự sẽ tổ chức buổi đào tạo trực tuyến vào thứ Năm. Tất cả trưởng nhóm bắt buộc phải tham dự."}], "qs": [{"n": 31, "q": "Chỗ trống (1)", "qvi": "", "opts": [{"t": "will not be able"}, {"t": "would not be able"}, {"t": "had not been able"}, {"t": "are not able"}], "ans": ["A"], "key": "Câu điều kiện loại 1", "ex": "If + hiện tại (does not review) + next month → will not be able.", "label": "1"}, {"n": 32, "q": "Chỗ trống (2)", "qvi": "", "opts": [{"t": "book"}, {"t": "have booked"}, {"t": "had booked"}, {"t": "would book"}], "ans": ["C"], "key": "Câu điều kiện loại 3", "ex": "would have accommodated → loại 3: If + had + V3 (had booked).", "label": "2"}, {"n": 33, "q": "Chỗ trống (3)", "qvi": "", "opts": [{"t": "convenient"}, {"t": "current"}, {"t": "initial"}, {"t": "maximum"}], "ans": ["B"], "key": "Từ vựng", "ex": "make do with our current space = tạm dùng không gian hiện có (vì không đặt được chỗ lớn hơn).", "label": "3"}, {"n": 34, "q": "Chỗ trống (4)", "qvi": "", "opts": [{"t": "Therefore, please submit your feedback by tomorrow."}, {"t": "Attendance is mandatory for all team leaders."}, {"t": "The contract has already been signed by both parties."}, {"t": "This seminar will be postponed until further notice."}], "ans": ["B"], "key": "Điền câu", "ex": "Câu trước nói về buổi đào tạo trực tuyến → (B) mọi trưởng nhóm bắt buộc tham dự. (C) trái ý (ông Davis vẫn đang đàm phán). (D) không khớp.", "label": "4"}]}], "recap": "<h2>Ghi nhớ sau bài</h2><p>Làm lại các câu sai sau 2–3 ngày. Ôn từ vựng của buổi bằng nút <b>🃏 Flashcard</b> ở cuối trang.</p>", "qviAfter": true};</script>
