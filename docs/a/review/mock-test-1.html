<script>window.MT={"n": "a1", "part": 1, "partName": "Part 1", "sub": "Photographs · Mô tả tranh · 10 câu (1–10)", "intro": "Trang này chữa <b>Mock Test 1 (Part 1)<\/b> của lớp TOEIC A. Mỗi câu có tranh, nút nghe lại và 4 câu mô tả (chữ được ẩn đến khi bạn chọn, giống đề thật). <b>Cách học:<\/b> nhìn tranh → nghe → tự chọn → đọc dịch và giải thích vì sao các câu kia sai.", "stepsTitle": "Cách làm Part 1: 3 bước", "steps": ["<b>Nhìn tranh trước khi nghe.<\/b> Tranh có người hay chỉ có đồ vật? Có mấy người, họ đang <i>làm gì<\/i>, ở <i>đâu<\/i> (nhà hàng, bếp, kho hàng, bãi xe)?", "<b>Nghe kỹ động từ và danh từ.<\/b> Tranh có người: nghe <i>is/are + V-ing<\/i> (đang làm gì). Tranh đồ vật: nghe trạng thái <i>is filled with, is empty, are parked<\/i>. Sai một từ là loại.", "<b>Loại trừ bẫy.<\/b> Câu nhắc đúng đồ vật có trong tranh nhưng sai hành động (có ly nước nhưng không ai <i>gấp khăn<\/i>), hoặc nói về thứ không có trong tranh (cái ô, xe buýt). Câu bị động tiếp diễn <i>is being + V3<\/i> chỉ đúng khi có người đang làm việc đó."], "groups": [{"title": "Câu 1", "tag": "Nhà hàng · gọi món", "audio": "../../audio/amk1/c1.mp3", "imgs": ["img/amk1/p1.webp"], "qs": [{"n": 1, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "The woman is carrying some food.", "vi": "Người phụ nữ đang mang đồ ăn."}, {"t": "The woman is wiping off a table.", "vi": "Người phụ nữ đang lau bàn."}, {"t": "The man is talking to a server.", "vi": "Người đàn ông đang nói chuyện với người phục vụ."}, {"t": "The man is picking up some silverware.", "vi": "Người đàn ông đang cầm dao nĩa lên."}], "ans": ["C"], "key": "talk to a server = nói chuyện với người phục vụ", "ex": "Tranh: hai vị khách ngồi cầm menu, người đàn ông ngẩng lên nói với anh phục vụ đang ghi món. (A) sai: người phụ nữ đang ngồi cầm menu, không mang đồ ăn. (B) sai: không ai lau bàn. (D) sai: anh ấy cầm menu chứ không cầm dao nĩa (silverware)."}]}, {"title": "Câu 2", "tag": "Rót đồ uống", "audio": "../../audio/amk1/c2.mp3", "imgs": ["img/amk1/p2.webp"], "qs": [{"n": 2, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "A beverage is being poured into a glass.", "vi": "Đồ uống đang được rót vào ly."}, {"t": "Some flowers are being arranged in a vase.", "vi": "Hoa đang được cắm vào bình."}, {"t": "A woman is folding a napkin.", "vi": "Một người phụ nữ đang gấp khăn ăn."}, {"t": "A woman is wiping off a table.", "vi": "Một người phụ nữ đang lau bàn."}], "ans": ["A"], "key": "is being poured = đang được rót (bị động tiếp diễn)", "ex": "Anh phục vụ đang rót đồ uống vào ly của người phụ nữ → câu bị động <i>is being poured<\/i> đúng vì có người đang làm hành động đó. (B) không ai cắm hoa. (C), (D) người phụ nữ ngồi chống cằm, không gấp khăn cũng không lau bàn."}]}, {"title": "Câu 3", "tag": "Cùng xem điện thoại", "audio": "../../audio/amk1/c3.mp3", "imgs": ["img/amk1/p3.webp"], "qs": [{"n": 3, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "They are having coffee inside a café.", "vi": "Họ đang uống cà phê trong quán."}, {"t": "They are looking at the screen of a mobile device.", "vi": "Họ đang nhìn vào màn hình điện thoại."}, {"t": "One of the men is reaching for something on the table.", "vi": "Một trong những người đàn ông đang với lấy thứ gì đó trên bàn."}, {"t": "One of the men is adjusting some sliding windows.", "vi": "Một trong những người đàn ông đang chỉnh cửa sổ trượt."}], "ans": ["B"], "key": "look at the screen of a mobile device = nhìn màn hình điện thoại", "ex": "Cặp đôi cùng nhìn vào chiếc điện thoại anh kia đang cầm. (A) bẫy: trên bàn là đĩa thức ăn và ly rượu, không phải cà phê. (C), (D) trong tranh chỉ có một người đàn ông, và anh ấy không với đồ hay chỉnh cửa sổ."}]}, {"title": "Câu 4", "tag": "Nâng ly", "audio": "../../audio/amk1/c4.mp3", "imgs": ["img/amk1/p4.webp"], "qs": [{"n": 4, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "One of the women is wearing a scarf.", "vi": "Một người phụ nữ đang quàng khăn."}, {"t": "The women are talking to each other.", "vi": "Những người phụ nữ đang nói chuyện với nhau."}, {"t": "The man is pouring coffee into a cup.", "vi": "Người đàn ông đang rót cà phê vào tách."}, {"t": "The people are closing their menus.", "vi": "Mọi người đang gấp menu lại."}], "ans": ["B"], "key": "talk to each other = nói chuyện với nhau", "ex": "Nhóm bạn ngồi quanh bàn, nâng ly và cười nói với nhau. (A) không ai quàng khăn. (C) không ai rót cà phê, họ đang cầm ly rượu. (D) trong tranh không có menu."}]}, {"title": "Câu 5", "tag": "Công trường", "audio": "../../audio/amk1/c5.mp3", "imgs": ["img/amk1/p5.webp"], "qs": [{"n": 5, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "The man is building a house.", "vi": "Người đàn ông đang xây nhà."}, {"t": "The man is developing software.", "vi": "Người đàn ông đang phát triển phần mềm."}, {"t": "The man is making tools.", "vi": "Người đàn ông đang làm dụng cụ."}, {"t": "The man is adjusting the wires.", "vi": "Người đàn ông đang chỉnh dây điện."}], "ans": ["A"], "key": "build a house = xây nhà", "ex": "Người thợ đội mũ bảo hộ, mặc áo phản quang, đang dựng khung gỗ của ngôi nhà. (B) phần mềm cần máy tính. (C) anh ấy không làm dụng cụ. (D) bẫy: tranh có khung gỗ, không có dây điện (wires)."}]}, {"title": "Câu 6", "tag": "Trong bếp", "audio": "../../audio/amk1/c6.mp3", "imgs": ["img/amk1/p6.webp"], "qs": [{"n": 6, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "A woman is cutting a vegetable.", "vi": "Một người phụ nữ đang cắt rau củ."}, {"t": "A man is turning on a cooker.", "vi": "Một người đàn ông đang bật bếp."}, {"t": "A woman is eating a pepper.", "vi": "Một người phụ nữ đang ăn quả ớt chuông."}, {"t": "A man is washing a pot.", "vi": "Một người đàn ông đang rửa nồi."}], "ans": ["A"], "key": "cut a vegetable = cắt rau củ", "ex": "Người phụ nữ cầm dao cắt rau củ trên thớt. (B) người đàn ông đứng nấu ở bếp, không phải đang bật bếp. (C) bẫy: có quả ớt chuông (pepper) trên bàn nhưng không ai ăn. (D) anh ấy không rửa nồi."}]}, {"title": "Câu 7", "tag": "Bãi đỗ xe trống", "audio": "../../audio/amk1/c7.mp3", "imgs": ["img/amk1/p7.webp"], "qs": [{"n": 7, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "The garage is filled with cars.", "vi": "Nhà để xe đầy ô tô."}, {"t": "The parking lot is completely empty.", "vi": "Bãi đỗ xe hoàn toàn trống."}, {"t": "The vehicles are buses and trucks.", "vi": "Các xe là xe buýt và xe tải."}, {"t": "The cars are parked at angles.", "vi": "Các ô tô đỗ chéo."}], "ans": ["B"], "key": "completely empty = hoàn toàn trống", "ex": "Tranh chỉ có vạch kẻ và hàng cây, không có chiếc xe nào. (A), (C), (D) đều nói có xe (cars, buses, trucks) nên sai. Tranh không người: nghe kỹ từ chỉ trạng thái như <i>empty<\/i>."}]}, {"title": "Câu 8", "tag": "Bữa tối gia đình", "audio": "../../audio/amk1/c8.mp3", "imgs": ["img/amk1/p8.webp"], "qs": [{"n": 8, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "Statues are being displayed.", "vi": "Các bức tượng đang được trưng bày."}, {"t": "Paintings are being hung up.", "vi": "Các bức tranh đang được treo lên."}, {"t": "The people are in a gallery.", "vi": "Mọi người đang ở phòng tranh."}, {"t": "The people are having dinner.", "vi": "Mọi người đang ăn tối."}], "ans": ["D"], "key": "have dinner = ăn tối", "ex": "Cả gia đình ngồi quanh bàn đầy thức ăn, có đèn dây trang trí → đang ăn tối. (A), (B), (C) nói về tượng, tranh, phòng tranh: không có trong ảnh."}]}, {"title": "Câu 9", "tag": "Kho hàng", "audio": "../../audio/amk1/c9.mp3", "imgs": ["img/amk1/p9.webp"], "qs": [{"n": 9, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "The shelves are loaded with goods.", "vi": "Các kệ chất đầy hàng hóa."}, {"t": "The forklift is undergoing repairs.", "vi": "Xe nâng đang được sửa chữa."}, {"t": "One man is pointing to the ground.", "vi": "Một người đàn ông đang chỉ xuống đất."}, {"t": "One man is stacking boxes by hand.", "vi": "Một người đàn ông đang xếp thùng bằng tay."}], "ans": ["A"], "key": "be loaded with goods = chất đầy hàng", "ex": "Kho hàng có kệ cao chất đầy thùng hàng. (B) xe nâng đang chạy chở hàng, không phải đang sửa. (C) bẫy ngược: người đàn ông chỉ <b>lên trên<\/b>, không chỉ xuống đất. (D) hàng được xe nâng nâng lên, không ai xếp bằng tay."}]}, {"title": "Câu 10", "tag": "Phố ăn uống ngoài trời", "audio": "../../audio/amk1/c10.mp3", "imgs": ["img/amk1/p10.webp"], "qs": [{"n": 10, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "Some people are seated outside.", "vi": "Một số người đang ngồi ở ngoài trời."}, {"t": "A man is opening an umbrella.", "vi": "Một người đàn ông đang mở ô."}, {"t": "A man is setting up chairs and tables.", "vi": "Một người đàn ông đang kê bàn ghế."}, {"t": "Some people are waiting in line.", "vi": "Một số người đang xếp hàng chờ."}], "ans": ["A"], "key": "be seated outside = ngồi ngoài trời", "ex": "Rất nhiều người ngồi ở các bàn ngoài phố. (B) không ai mở ô. (C) bàn ghế đã kê sẵn và có người ngồi, không ai đang kê. (D) mọi người đang ngồi, không xếp hàng."}]}], "recap": "<h2>Ghi nhớ sau bài<\/h2><p><b>Động từ hay gặp:<\/b> talk to a server, pour (rót), cut (cắt), build (xây), point to (chỉ vào), be seated (ngồi).<\/p><p><b>Tranh đồ vật:<\/b> be filled with / be loaded with (đầy), empty (trống), be parked (được đỗ).<\/p><p><b>Bẫy:<\/b> đồ vật có trong tranh nhưng sai hành động (câu 6: có ớt nhưng không ai ăn; câu 9: chỉ lên chứ không chỉ xuống), và từ chỉ thứ không có trong tranh (câu 3, 7, 8).<\/p>", "exam": "TOEIC-A-MOCK1", "examSrc": "/toeica-mocktest/", "hideOpts": true, "hideHint": "Nghe rồi chọn"};</script>
