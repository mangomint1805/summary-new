c4/track1.mp3", "passage": ["The Greenfield Community Center recently made an important **(1) announcement** regarding its upcoming activities. Due to building repairs, the center will be **(2) relocated** to a temporary location across the street for the next two months. Several facilities are currently **(3) under maintenance**, so visitors may experience some inconvenience. To help improve local services, the center is organizing a charity **(4) fundraiser** next Saturday. Community members are encouraged to attend and support the event. In addition, volunteers will lead an environmental workshop where residents will learn how to **(5) sort garbage** properly. Participants will also have the opportunity to **(6) exchange** ideas and suggestions for future community projects."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "The Greenfield Community Center recently made an important (1) announcement regarding its upcoming activities. Due to building repairs, the center will be (2) relocated to a temporary location across the street for the next two months. Several facilities are currently (3) under maintenance, so visitors may experience some inconvenience. To help improve local services, the center is organizing a charity (4) fundraiser next Saturday. Community members are encouraged to attend and support the event. In addition, volunteers will lead an environmental workshop where residents will learn how to (5) sort garbage properly. Participants will also have the opportunity to (6) exchange ideas and suggestions for future community projects.", "vi": "Trung tâm Cộng đồng Greenfield vừa đưa ra một thông báo quan trọng về các hoạt động sắp tới. Do sửa chữa toà nhà, trung tâm sẽ được chuyển tạm sang một địa điểm bên kia đường trong hai tháng tới. Một số cơ sở đang được bảo trì nên khách có thể gặp chút bất tiện. Để cải thiện dịch vụ địa phương, trung tâm tổ chức buổi gây quỹ từ thiện vào thứ Bảy tới. Mọi người được khuyến khích tham dự và ủng hộ. Ngoài ra, tình nguyện viên sẽ dẫn một buổi workshop về môi trường, nơi cư dân học cách phân loại rác đúng cách. Người tham gia cũng có dịp trao đổi ý tưởng và góp ý cho các dự án cộng đồng sau này."}], "qs": []}, {"title": "Part 3 · Câu 1–3", "tag": "Hội thoại · thư viện đóng cửa", "audio": "../../audio/atc4/p3-c1.mp3", "scriptLabel": "📜 Lời thoại + dịch (mở sau khi đã nghe)", "script": [{"sp": "M", "t": "Hi Sarah, did you see the announcement on the bulletin board? The community library will be closed starting next Monday.", "vi": "Chào Sarah, bạn thấy thông báo trên bảng tin chưa? Thư viện cộng đồng sẽ đóng cửa từ thứ Hai tới."}, {"sp": "W", "t": "Oh, really? Why is that? I need to return some books next week.", "vi": "Ồ, thật à? Sao vậy? Tuần sau mình cần trả mấy cuốn sách."}, {"sp": "M", "t": "The whole building will be under maintenance for roof repairs. It will take about a month to fix the problem.", "vi": "Cả toà nhà sẽ được bảo trì để sửa mái. Mất khoảng một tháng mới sửa xong."}, {"sp": "W", "t": "That's a long time. Will they relocate the services to another place during the repairs?", "vi": "Lâu thật. Trong lúc sửa họ có chuyển dịch vụ sang chỗ khác không?"}, {"sp": "M", "t": "Yes, they will move to a temporary office near the park. They will hold a meeting tomorrow to share more details.", "vi": "Có, họ sẽ chuyển sang văn phòng tạm gần công viên. Ngày mai họ tổ chức buổi họp để nói thêm chi tiết."}], "qs": [{"n": 1, "q": "Why will the library be closed?", "qvi": "Vì sao thư viện sẽ đóng cửa?", "opts": [{"t": "It is moving to a new city."}, {"t": "It is undergoing maintenance."}, {"t": "It does not have enough staff."}, {"t": "The building was sold."}], "ans": ["B"], "key": "Câu hỏi lý do", "ex": "\"The whole building will be under maintenance\" → (B). undergo maintenance = under maintenance (paraphrase). (A) chuyển sang văn phòng gần công viên, không phải thành phố mới.", "label": "1"}, {"n": 2, "q": "What will happen next Monday?", "qvi": "Chuyện gì sẽ xảy ra vào thứ Hai tới?", "opts": [{"t": "A meeting will be held."}, {"t": "A new park will open."}, {"t": "The library will close."}, {"t": "Books must be returned."}], "ans": ["C"], "key": "Câu hỏi chi tiết · thời gian", "ex": "\"The community library will be closed starting next Monday\" → (C). (A) cuộc họp là \"tomorrow\". (D) bẫy: người phụ nữ cần trả sách \"next week\".", "label": "2"}, {"n": 3, "q": "What will the speakers probably do tomorrow?", "qvi": "Ngày mai hai người có lẽ sẽ làm gì?", "opts": [{"t": "Repair a roof"}, {"t": "Buy some books"}, {"t": "Visit a temporary office"}, {"t": "Attend a meeting"}], "ans": ["D"], "key": "Câu hỏi việc làm tiếp theo", "ex": "\"They will hold a meeting tomorrow\" → (D). (A) bẫy: roof repairs do thợ làm. (C) văn phòng tạm được nhắc tới nhưng không nói ngày mai tới đó.", "label": "3"}]}, {"title": "Part 3 · Câu 4–6", "tag": "Hội thoại · buổi gây quỹ", "audio": "../../audio/atc4/p3-c2.mp3", "scriptLabel": "📜 Lời thoại + dịch (mở sau khi đã nghe)", "script": [{"sp": "W", "t": "Mark, how is the preparation for our weekend fundraiser going? We still need more clothes and books for the event.", "vi": "Mark ơi, chuẩn bị cho buổi gây quỹ cuối tuần tới đâu rồi? Mình vẫn cần thêm quần áo và sách."}, {"sp": "M", "t": "It's going well. Many local residents promised to make a donation by Friday.", "vi": "Ổn lắm. Nhiều cư dân hứa sẽ quyên góp trước thứ Sáu."}, {"sp": "W", "t": "That's great. Don't forget we are also organizing a book exchange corner where people can swap their old books.", "vi": "Tuyệt. Đừng quên mình còn làm góc trao đổi sách để mọi người đổi sách cũ."}, {"sp": "M", "t": "I know, but we don't have enough staff to manage that area. We need to recruit volunteers to help us.", "vi": "Mình biết, nhưng không đủ người trông khu đó. Mình cần tuyển tình nguyện viên."}, {"sp": "W", "t": "Good idea. Let's post a notice online to look for five more helpers today.", "vi": "Ý hay. Hôm nay mình đăng thông báo trên mạng tìm thêm năm người nhé."}], "qs": [{"n": 4, "q": "What is the main topic of the conversation?", "qvi": "Chủ đề chính của cuộc hội thoại là gì?", "opts": [{"t": "Recruiting full-time staff"}, {"t": "Preparing for a fundraiser"}, {"t": "Opening a new bookstore"}, {"t": "Sorting household waste"}], "ans": ["B"], "key": "Câu hỏi ý chính", "ex": "Câu đầu: \"how is the preparation for our weekend fundraiser going?\" → (B). (A) bẫy: họ tuyển tình nguyện viên, không phải nhân viên toàn thời gian.", "label": "4"}, {"n": 5, "q": "What can people do at the book exchange corner?", "qvi": "Mọi người có thể làm gì ở góc trao đổi sách?", "opts": [{"t": "Swap their old books"}, {"t": "Buy new clothes"}, {"t": "Meet local writers"}, {"t": "Donate money"}], "ans": ["A"], "key": "Câu hỏi chi tiết", "ex": "\"where people can swap their old books\" → (A). swap = exchange (đổi).", "label": "5"}, {"n": 6, "q": "What does the woman suggest doing today?", "qvi": "Người phụ nữ đề nghị làm gì hôm nay?", "opts": [{"t": "Hanging a poster in the park"}, {"t": "Posting a notice online"}, {"t": "Collecting money from residents"}, {"t": "Buying five more boxes"}], "ans": ["B"], "key": "Câu hỏi đề nghị", "ex": "\"Let's post a notice online … today\" → (B). (D) bẫy số \"five\" (năm người giúp, không phải năm cái hộp).", "label": "6"}]}, {"title": "Part 5 · Câu 1", "tag": "Câu điều kiện loại 1", "qs": [{"n": 7, "q": "If enough volunteers ___ for the event, the community center will be able to serve more residents.", "qvi": "Nếu có đủ tình nguyện viên đăng ký, trung tâm sẽ phục vụ được nhiều cư dân hơn.", "opts": [{"t": "register"}, {"t": "registered"}, {"t": "will register"}, {"t": "registering"}], "ans": ["A"], "key": "", "ex": "Mệnh đề chính will be able → câu điều kiện loại 1: If + hiện tại đơn. Chủ ngữ số nhiều (volunteers) → register.", "label": "1"}]}, {"title": "Part 5 · Câu 2", "tag": "Bị động", "qs": [{"n": 8, "q": "The annual fundraiser ___ by local businesses and nonprofit organizations every year.", "qvi": "Buổi gây quỹ thường niên được các doanh nghiệp và tổ chức phi lợi nhuận tài trợ mỗi năm.", "opts": [{"t": "sponsors"}, {"t": "sponsored"}, {"t": "is sponsored"}, {"t": "sponsoring"}], "ans": ["C"], "key": "", "ex": "Có \"by + người làm\" → bị động; \"every year\" → hiện tại đơn: is sponsored.", "label": "2"}]}, {"title": "Part 5 · Câu 3", "tag": "Thì hiện tại hoàn thành", "qs": [{"n": 9, "q": "Since January, community leaders ___ feedback from residents through surveys and public meetings.", "qvi": "Từ tháng Một, lãnh đạo cộng đồng đã thu thập ý kiến cư dân qua khảo sát và họp công khai.", "opts": [{"t": "gathered"}, {"t": "have gathered"}, {"t": "gather"}, {"t": "gathering"}], "ans": ["B"], "key": "", "ex": "\"Since + mốc thời gian\" → hiện tại hoàn thành: have gathered.", "label": "3"}]}, {"title": "Part 5 · Câu 4", "tag": "Thì tương lai hoàn thành", "qs": [{"n": 10, "q": "By the time the meeting begins, the committee ___ an important announcement to all participants.", "qvi": "Trước khi cuộc họp bắt đầu, ủy ban sẽ đã gửi một thông báo quan trọng tới mọi người tham dự.", "opts": [{"t": "sends"}, {"t": "sent"}, {"t": "will send"}, {"t": "will have sent"}], "ans": ["D"], "key": "", "ex": "\"By the time + hiện tại đơn\" (việc tương lai) → tương lai hoàn thành: will have sent.", "label": "4"}]}, {"title": "Part 5 · Câu 5", "tag": "Câu điều kiện", "qs": [{"n": 11, "q": "Residents are encouraged to sort garbage properly if they ___ to improve environmental conditions in the neighborhood.", "qvi": "Cư dân được khuyến khích phân loại rác đúng cách nếu muốn cải thiện môi trường khu phố.", "opts": [{"t": "want"}, {"t": "wanted"}, {"t": "will want"}, {"t": "are wanting"}], "ans": ["A"], "key": "", "ex": "Mệnh đề If nói điều kiện chung ở hiện tại → hiện tại đơn: want. Không dùng will sau If; want không chia tiếp diễn.", "label": "5"}]}, {"title": "Part 5 · Câu 6", "tag": "Bị động · quá khứ", "qs": [{"n": 12, "q": "The community garden project ___ last month after receiving financial support from local donors.", "qvi": "Dự án vườn cộng đồng được khởi động tháng trước sau khi nhận hỗ trợ tài chính từ các nhà tài trợ.", "opts": [{"t": "launched"}, {"t": "was launched"}, {"t": "has launched"}, {"t": "launching"}], "ans": ["B"], "key": "", "ex": "Dự án ĐƯỢC khởi động (bị động) + \"last month\" → quá khứ đơn bị động: was launched.", "label": "6"}]}, {"title": "Part 6 · Câu 1–4 · Thông báo lễ hội", "tag": "Announcement", "passage": ["Annual Community Festival", "SEATTLE (August 12)—The annual Green Valley festival is currently taking place in the central park. This week, local residents ⟦1⟧ in large groups to participate in various outdoor activities.", "The community center successfully launched a campaign to support local families. If you visit the main square today, you ⟦2⟧ a wide variety of items on display at the charity market. ⟦3⟧. All the money from this event will help address community needs.", "Furthermore, volunteers ⟦4⟧ to help clean up the park after the event ends. If you want to join, please sign up at the information desk."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Lễ hội cộng đồng thường niên. SEATTLE (12/8) – Lễ hội Green Valley thường niên đang diễn ra ở công viên trung tâm. Tuần này, cư dân đang tụ tập thành từng nhóm lớn để tham gia nhiều hoạt động ngoài trời. Trung tâm cộng đồng đã phát động thành công chiến dịch hỗ trợ các gia đình địa phương. Nếu hôm nay bạn ghé quảng trường chính, bạn sẽ thấy rất nhiều món đồ được bày bán ở chợ từ thiện. Khách có thể quyên góp hoặc đổi sách cũ ở đây. Toàn bộ tiền từ sự kiện sẽ dùng cho nhu cầu của cộng đồng. Ngoài ra, cần tình nguyện viên giúp dọn dẹp công viên sau khi sự kiện kết thúc. Nếu muốn tham gia, hãy đăng ký ở bàn thông tin."}], "qs": [{"n": 13, "q": "Chỗ trống (1)", "qvi": "", "opts": [{"t": "gather"}, {"t": "gathered"}, {"t": "are gathering"}, {"t": "have gathered"}], "ans": ["C"], "key": "Thì hiện tại tiếp diễn", "ex": "\"is currently taking place\" + \"This week\" → việc đang diễn ra: hiện tại tiếp diễn are gathering.", "label": "1"}, {"n": 14, "q": "Chỗ trống (2)", "qvi": "", "opts": [{"t": "see"}, {"t": "will see"}, {"t": "saw"}, {"t": "would see"}], "ans": ["B"], "key": "Câu điều kiện loại 1", "ex": "If + hiện tại (visit) → câu điều kiện loại 1: will see.", "label": "2"}, {"n": 15, "q": "Chỗ trống (3)", "qvi": "", "opts": [{"t": "Commuters are currently waiting in line at the bus station."}, {"t": "Heavy construction equipment will completely block the intersection."}, {"t": "Visitors can make a donation or exchange their old books here."}, {"t": "The public swimming pool is under maintenance until next week."}], "ans": ["C"], "key": "Điền câu", "ex": "Câu trước nói về chợ từ thiện, câu sau \"All the money from this event\" → (C) khách quyên góp/đổi sách ở đây. Các câu còn lại không liên quan.", "label": "3"}, {"n": 16, "q": "Chỗ trống (4)", "qvi": "", "opts": [{"t": "need"}, {"t": "are needed"}, {"t": "needing"}, {"t": "will need"}], "ans": ["B"], "key": "Bị động", "ex": "Tình nguyện viên ĐƯỢC cần (bị động) để dọn công viên → are needed.", "label": "4"}]}, {"title": "Part 7 · Câu 5–7 · Thông báo + e-mail", "tag": "Đoạn kép", "passage": ["<b>NOTICE</b> · Date: June 15 · Subject: Annual Neighborhood Fundraiser", "This Saturday, the association will launch a community campaign to support local families in need. The event will take place in the central park from 9:00 A.M. to 4:00 P.M. Visitors can enjoy a wide variety of activities, including a book exchange corner and a charity market. To protect the environment, we kindly ask everyone to sort garbage into the designated recycling bins placed near the park entrance.", "We are still recruiting volunteers to help set up the tables. If you want to participate, please sign up on the bulletin board at the community center by Friday.", "<b>E-MAIL</b> · To: management@greenvalley.org · From: jsmith@email.com · Date: June 16 · Subject: Volunteer Request and Facility Maintenance", "Dear Manager, I read the announcement about the weekend fundraiser and would like to volunteer for the event. I am available to help set up the tables on Saturday morning.", "However, I want to voice a concern regarding the location. I noticed that the main path in the central park is currently under maintenance for sidewalk repairs. Since the area is blocked, it might be difficult for residents to access the book exchange corner.", "Could you please relocate that specific activity to the covered pavilion near the parking lot instead? I think this change will better address community needs. Sincerely, John Smith, Local Resident"], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "THÔNG BÁO: Thứ Bảy này hội sẽ phát động chiến dịch hỗ trợ các gia đình khó khăn, ở công viên trung tâm từ 9 giờ sáng đến 4 giờ chiều, có góc đổi sách và chợ từ thiện. Mọi người vui lòng phân loại rác vào thùng tái chế gần cổng. Hội vẫn đang tuyển tình nguyện viên kê bàn; đăng ký trên bảng tin ở trung tâm trước thứ Sáu. — E-MAIL: Tôi đọc thông báo về buổi gây quỹ và muốn làm tình nguyện viên. Sáng thứ Bảy tôi có thể giúp kê bàn. Tuy nhiên tôi muốn nêu một lo ngại về địa điểm: lối đi chính trong công viên đang được bảo trì để sửa vỉa hè, khu đó bị chắn nên cư dân khó tới góc đổi sách. Có thể chuyển hoạt động đó sang nhà mái che gần bãi đỗ xe không? Tôi nghĩ như vậy sẽ đáp ứng nhu cầu cộng đồng tốt hơn."}], "qs": [{"n": 17, "q": "What is the main purpose of the notice?", "qvi": "Mục đích chính của thông báo là gì?", "opts": [{"t": "To close a public park"}, {"t": "To announce a fundraiser event"}, {"t": "To hire full-time staff"}, {"t": "To change a trash collection schedule"}], "ans": ["B"], "key": "Câu hỏi mục đích", "ex": "Tiêu đề \"Annual Neighborhood Fundraiser\" + câu đầu \"will launch a community campaign\" → (B). (C) bẫy: tuyển tình nguyện viên, không phải nhân viên toàn thời gian.", "label": "5"}, {"n": 18, "q": "What is John Smi
