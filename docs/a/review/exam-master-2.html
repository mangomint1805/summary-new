<script>window.MT={"vocab": [["operate", "v", "/ˈɑːpəreɪt/", "vận hành (máy)", "He's operating a machine."], ["paddle", "v", "/ˈpædl/", "chèo (thuyền)", "They're paddling a canoe."], ["lean against", "v", "/liːn əˈɡenst/", "dựa vào", "One of the people is leaning against a wall."], ["set out", "v", "/set aʊt/", "bày ra", "Some products have been set out under tents."], ["provide shade", "v phr", "/prəˈvaɪd ʃeɪd/", "che bóng mát", "Some trees are providing shade for a picnic area."], ["reschedule", "v", "/ˌriːˈskedʒuːl/", "dời lịch", "We should reschedule the picnic."], ["candidate", "n", "/ˈkændɪdət/", "ứng viên", "Who are the candidates for new branch manager?"], ["contingent on", "adj", "/kənˈtɪndʒənt ɑːn/", "phụ thuộc vào", "The promotion is contingent on approval by the board."], ["delicate", "adj", "/ˈdelɪkət/", "mỏng manh, dễ hư", "Please note that this garment is delicate."], ["referral program", "n", "/rɪˈfɜːrəl ˈproʊɡræm/", "chương trình giới thiệu khách", "Do you know about our referral program?"]], "n": "aem2", "part": 0, "partName": "Part 1 · Part 2 · Part 5, 6", "sub": "Đề luyện thi · Part 1 (6 câu) · Part 2 (25 câu) · Part 5 (30 câu) · Part 6 (16 câu)", "intro": "Trang này có <b>file nghe</b> và <b>chữa bài</b> đề luyện trên lớp buổi <b>Exam Master 2</b> (giáo trình trang 87–98) – đúng 4 phần của bài thi giữa kỳ. <b>Cách học:</b> câu nghe thì bấm nghe → tự chọn (chữ đáp án được ẩn giống đề thật) → xem dịch và giải thích. Câu đọc thì chọn đáp án rồi xem vì sao đúng, vì sao sai. Câu nào sai nhớ ghi vào <b>Error Log</b> nha.", "stepsTitle": "Nhắc lại chiến lược", "steps": ["<b>Part 1 – S.E.A:</b> nhìn tranh trước khi nghe: Setting (ở đâu), Entity (ai, cái gì), Activity (đang làm gì). Tranh không người → hay dùng <i>has been + V3</i>; <i>is being + V3</i> chỉ đúng khi có người đang làm việc đó.", "<b>Part 2 – U.U.U:</b> nghe thật kỹ 3–4 từ đầu. Wh- không trả lời Yes/No; đáp án lặp từ / giống âm thường là bẫy; trả lời gián tiếp (\"hỏi quản lý\", \"tôi có cuốn khác\") thường đúng.", "<b>Part 5, 6 – C.E.P:</b> nhìn 4 đáp án để phân loại (từ loại, thì, liên từ, từ vựng) → tìm dấu hiệu trong câu → chọn. Part 6 câu điền câu: đọc câu trước và câu sau chỗ trống.", "<b>TOEIC Error Log:</b> câu nào sai thì ghi vào sổ 4 cột: <i>Câu – Dạng câu – Vì sao mình sai – Ghi nhớ</i>. Buổi sau là <b>bài thi giữa kỳ</b> (Part 1, 2, 5, 6) – nhớ xem lại sổ trước khi thi."], "groups": [{"title": "Part 1 · Câu 1", "tag": "Tranh 1 người · hành động", "audio": "../../audio/aem2/p1-1.mp3", "imgs": ["img/em2/p1.webp"], "hideOpts": true, "qs": [{"n": 1, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "She's writing on a document.", "vi": "Cô ấy đang viết lên một tài liệu."}, {"t": "She's looking at some framed artwork.", "vi": "Cô ấy đang xem tranh đóng khung."}, {"t": "She's opening a folder.", "vi": "Cô ấy đang mở bìa hồ sơ."}, {"t": "She's organizing a desk drawer.", "vi": "Cô ấy đang sắp xếp ngăn kéo bàn."}], "ans": ["A"], "key": "writing on a document", "ex": "Cô ấy cầm bút viết lên giấy tờ → (A). (B) có tranh treo trên tường nhưng cô ấy không nhìn tranh. (C), (D) không mở bìa hồ sơ, không đụng ngăn kéo.", "label": "1"}]}, {"title": "Part 1 · Câu 2", "tag": "Tranh 1 người · hành động", "audio": "../../audio/aem2/p1-2.mp3", "imgs": ["img/em2/p2.webp"], "hideOpts": true, "qs": [{"n": 2, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "He's driving a van.", "vi": "Anh ấy đang lái xe van."}, {"t": "He's cutting some shrubs.", "vi": "Anh ấy đang cắt bụi cây."}, {"t": "He's moving some garden stones.", "vi": "Anh ấy đang di chuyển đá trang trí sân vườn."}, {"t": "He's operating a machine.", "vi": "Anh ấy đang vận hành một cái máy."}], "ans": ["D"], "key": "operating a machine", "ex": "Anh ấy ngồi lái máy cắt cỏ → \"operating a machine\" (D). (A) đây không phải xe van. (B) không cắt bụi cây. (C) đá đã nằm sẵn, không ai di chuyển.", "label": "2"}]}, {"title": "Part 1 · Câu 3", "tag": "Tranh nhiều người · hành động", "audio": "../../audio/aem2/p1-3.mp3", "imgs": ["img/em2/p3.webp"], "hideOpts": true, "qs": [{"n": 3, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "They're swimming in the water.", "vi": "Họ đang bơi dưới nước."}, {"t": "They're catching fish from a lake.", "vi": "Họ đang câu cá trên hồ."}, {"t": "They're waiting at a boat dock.", "vi": "Họ đang đợi ở bến thuyền."}, {"t": "They're paddling a canoe.", "vi": "Họ đang chèo xuồng."}], "ans": ["D"], "key": "paddling a canoe", "ex": "Hai người ngồi trên xuồng cầm mái chèo → (D). (A) bẫy liên tưởng \"water\" nhưng họ không bơi. (B) không câu cá. (C) không đứng ở bến.", "label": "3"}]}, {"title": "Part 1 · Câu 4", "tag": "Tranh nhiều người · \"One of the…\"", "audio": "../../audio/aem2/p1-4.mp3", "imgs": ["img/em2/p4.webp"], "hideOpts": true, "qs": [{"n": 4, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "A walkway is being swept clean.", "vi": "Lối đi đang được quét sạch."}, {"t": "Some people are walking through an intersection.", "vi": "Vài người đang đi qua ngã tư."}, {"t": "One of the people is leaning against a wall.", "vi": "Một người đang dựa vào tường."}, {"t": "One of the people is fixing a bicycle tire.", "vi": "Một người đang sửa lốp xe đạp."}], "ans": ["C"], "key": "leaning against a wall", "ex": "Người mặc đồ đen đứng dựa lưng vào tường → (C). (A) is being swept: không ai đang quét. (B) không có ngã tư. (D) có xe đạp nhưng không ai sửa lốp.", "label": "4"}]}, {"title": "Part 1 · Câu 5", "tag": "Tranh có người + đồ vật", "audio": "../../audio/aem2/p1-5.mp3", "imgs": ["img/em2/p5.webp"], "hideOpts": true, "qs": [{"n": 5, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "A customer is loading items into a shopping bag.", "vi": "Một khách hàng đang cho đồ vào túi."}, {"t": "Some products have been set out under tents.", "vi": "Hàng hoá được bày ra dưới các mái lều."}, {"t": "A bowl has been filled with water.", "vi": "Một cái bát được đổ đầy nước."}, {"t": "Some baskets are hanging from a post.", "vi": "Vài cái giỏ đang treo trên cột."}], "ans": ["B"], "key": "have been set out under tents", "ex": "Chợ nông sản: rau củ được bày dưới mái lều → (B). (A) không ai cho đồ vào túi. (C) giỏ đựng tỏi, không có nước. (D) giỏ đặt trên bàn, không treo trên cột.", "label": "5"}]}, {"title": "Part 1 · Câu 6", "tag": "Tranh không người · cảnh vật", "audio": "../../audio/aem2/p1-6.mp3", "imgs": ["img/em2/p6.webp"], "hideOpts": true, "qs": [{"n": 6, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "There's a campfire underneath some shade trees.", "vi": "Có lửa trại dưới tán cây."}, {"t": "Some trees are providing shade for a picnic area.", "vi": "Cây đang che bóng cho khu picnic."}, {"t": "A flower bed has been planted near a park bench.", "vi": "Một bồn hoa được trồng gần ghế đá công viên."}, {"t": "Fallen branches are stacked next to a brick pathway.", "vi": "Cành cây gãy được chất cạnh lối đi lát gạch."}], "ans": ["B"], "key": "providing shade for a picnic area", "ex": "Hàng cây lớn che bóng cho dãy bàn picnic → (B). (A) không có lửa trại. (C) không có bồn hoa / ghế đá. (D) không có cành cây chất đống.", "label": "6"}]}, {"title": "Part 2 · Câu 7", "tag": "When", "audio": "../../audio/aem2/p2-7.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "When does your bus leave?", "vi": "Xe buýt của bạn khởi hành lúc mấy giờ?"}], "qs": [{"n": 7, "q": "", "qvi": "", "opts": [{"t": "The station is on Liberty Avenue.", "vi": "Bến xe ở đại lộ Liberty."}, {"t": "A seat in the back.", "vi": "Một chỗ ngồi phía sau."}, {"t": "At eight o'clock.", "vi": "Lúc tám giờ."}], "ans": ["C"], "key": "", "ex": "When → thời gian: \"At eight o'clock\" (C). (A) trả lời Where; (B) liên tưởng bus/seat.", "label": "7"}]}, {"title": "Part 2 · Câu 8", "tag": "Who", "audio": "../../audio/aem2/p2-8.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Who made the cake for the party?", "vi": "Ai làm bánh cho bữa tiệc vậy?"}], "qs": [{"n": 8, "q": "", "qvi": "", "opts": [{"t": "Just a cup of apple juice.", "vi": "Chỉ một cốc nước táo thôi."}, {"t": "I already ate.", "vi": "Tôi ăn rồi."}, {"t": "The baker on Second Street.", "vi": "Tiệm bánh trên đường Second."}], "ans": ["C"], "key": "", "ex": "Who → người / nơi làm: \"The baker on Second Street\" (C). (A), (B) liên tưởng ăn uống.", "label": "8"}]}, {"title": "Part 2 · Câu 9", "tag": "Why", "audio": "../../audio/aem2/p2-9.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Why are you taking French classes?", "vi": "Sao bạn học lớp tiếng Pháp vậy?"}], "qs": [{"n": 9, "q": "", "qvi": "", "opts": [{"t": "Do you have a reservation?", "vi": "Bạn có đặt chỗ trước không?"}, {"t": "Because I'm transferring to the Paris office.", "vi": "Vì tôi sắp chuyển sang văn phòng ở Paris."}, {"t": "Two days a week.", "vi": "Hai ngày một tuần."}], "ans": ["B"], "key": "", "ex": "Why → lý do \"Because…\" (B). (C) trả lời How often.", "label": "9"}]}, {"title": "Part 2 · Câu 10", "tag": "What", "audio": "../../audio/aem2/p2-10.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "What material is this shirt made of?", "vi": "Áo sơ mi này làm bằng chất liệu gì?"}], "qs": [{"n": 10, "q": "", "qvi": "", "opts": [{"t": "It's a light cotton fabric.", "vi": "Vải cotton mỏng nhẹ."}, {"t": "No, I don't need any more supplies.", "vi": "Không, tôi không cần thêm đồ dùng."}, {"t": "In small, medium, and large sizes.", "vi": "Có cỡ nhỏ, vừa và lớn."}], "ans": ["A"], "key": "", "ex": "What material → chất liệu: cotton (A). (B) Wh- không trả lời No. (C) liên tưởng áo → size.", "label": "10"}]}, {"title": "Part 2 · Câu 11", "tag": "How much", "audio": "../../audio/aem2/p2-11.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "How much will the jazz concert cost?", "vi": "Buổi hoà nhạc jazz giá bao nhiêu?"}], "qs": [{"n": 11, "q": "", "qvi": "", "opts": [{"t": "Leaving from platform six.", "vi": "Khởi hành từ sân ga số 6."}, {"t": "The ticket's 50 dollars.", "vi": "Vé 50 đô."}, {"t": "A seat on the aisle, please.", "vi": "Cho tôi ghế cạnh lối đi."}], "ans": ["B"], "key": "", "ex": "How much → giá tiền (B). (C) liên tưởng concert → seat.", "label": "11"}]}, {"title": "Part 2 · Câu 12", "tag": "Where", "audio": "../../audio/aem2/p2-12.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Where's the robotics conference going to be held?", "vi": "Hội nghị robot sẽ tổ chức ở đâu?"}], "qs": [{"n": 12, "q": "", "qvi": "", "opts": [{"t": "I'll print your first chapter.", "vi": "Tôi sẽ in chương đầu của bạn."}, {"t": "At the end of June.", "vi": "Vào cuối tháng Sáu."}, {"t": "It's in Boston.", "vi": "Ở Boston."}], "ans": ["C"], "key": "", "ex": "Where → nơi chốn \"in Boston\" (C). (B) trả lời When – bẫy hay gặp.", "label": "12"}]}, {"title": "Part 2 · Câu 13", "tag": "Lời đề nghị", "audio": "../../audio/aem2/p2-13.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Would you like me to turn on the air conditioner?", "vi": "Bạn có muốn tôi bật điều hoà không?"}], "qs": [{"n": 13, "q": "", "qvi": "", "opts": [{"t": "I bought shampoo and conditioner.", "vi": "Tôi mua dầu gội và dầu xả rồi."}, {"t": "He did an excellent job!", "vi": "Anh ấy làm rất tốt!"}, {"t": "No—let's open the windows.", "vi": "Không, mình mở cửa sổ đi."}], "ans": ["C"], "key": "", "ex": "Từ chối + đưa cách khác: mở cửa sổ (C). (A) bẫy âm air conditioner / conditioner.", "label": "13"}]}, {"title": "Part 2 · Câu 14", "tag": "When", "audio": "../../audio/aem2/p2-14.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "When do you need a copy of the contract?", "vi": "Khi nào bạn cần bản sao hợp đồng?"}], "qs": [{"n": 14, "q": "", "qvi": "", "opts": [{"t": "As soon as possible.", "vi": "Càng sớm càng tốt mệnh đề = nhẹ nhõm khi…", "label": "128"}]}, {"title": "Part 5 · Câu 129", "tag": "", "qs": [{"n": 60, "q": "___ two floors of offices, the building offers several retail spaces.", "qvi": "", "opts": [{"t": "In addition to"}, {"t": "Fortunately"}, {"t": "In order that"}, {"t": "Especially"}], "ans": ["A"], "key": "", "ex": "In addition to + danh từ = ngoài … ra còn.", "label": "129"}]}, {"title": "Part 5 · Câu 130", "tag": "", "qs": [{"n": 61, "q": "___ regarding construction noise and traffic delays should be directed to Mr. Jasdi, the project manager.", "qvi": "", "opts": [{"t": "Materials"}, {"t": "Concerns"}, {"t": "Expansions"}, {"t": "Selections"}], "ans": ["B"], "key": "", "ex": "Concerns regarding … = những lo ngại về (tiếng ồn, kẹt xe).", "label": "130"}]}, {"title": "Part 6 · Câu 131–134 · Thông tin tuyển dụng", "tag": "Tuyển dụng", "passage": ["JOIN THE RGBS AUTOMOTIVE TEAM", "RGBS Automotive is ⟦131⟧ hiring full-time and part-time workers. Apply today! ⟦132⟧ could become part of our manufacturing team! We make high-tech products ⟦133⟧ found in cars and trucks of all kinds.", "RGBS Automotive pays well, and we provide ongoing training plus opportunities for promotion. ⟦134⟧. Go to www.rgbsautomotive.com for more details and to fill out an application."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "GIA NHẬP ĐỘI NGŨ RGBS AUTOMOTIVE. RGBS Automotive hiện đang tuyển nhân viên toàn thời gian và bán thời gian. Ứng tuyển ngay hôm nay! Bạn có thể trở thành một phần của đội sản xuất của chúng tôi! Chúng tôi làm các sản phẩm công nghệ cao có trong ô tô và xe tải các loại. RGBS Automotive trả lương tốt, đào tạo liên tục và có cơ hội thăng tiến. Chúng tôi còn có nhiều ngày nghỉ phép. Vào www.rgbsautomotive.com để xem chi tiết và điền đơn ứng tuyển."}], "qs": [{"n": 62, "q": "Chỗ trống (131)", "qvi": "", "opts": [{"t": "now"}, {"t": "likewise"}, {"t": "there"}, {"t": "instead"}], "ans": ["A"], "key": "Trạng từ", "ex": "\"is now hiring\" = hiện đang tuyển (hiện tại tiếp diễn + now).", "label": "131"}, {"n": 63, "q": "Chỗ trống (132)", "qvi": "", "opts": [{"t": "It"}, {"t": "You"}, {"t": "They"}, {"t": "Everyone"}], "ans": ["B"], "key": "Đại từ", "ex": "Quảng cáo nói trực tiếp với người đọc: \"Apply today! You could become part of our team!\"", "label": "132"}, {"n": 64, "q": "Chỗ trống (133)", "qvi": "", "opts": [{"t": "can be"}, {"t": "that are"}, {"t": "and being"}, {"t": "that had been"}], "ans": ["B"], "key": "Mệnh đề quan hệ", "ex": "products THAT ARE found in cars = sản phẩm được dùng trong ô tô (mệnh đề quan hệ, hiện tại).", "label": "133"}, {"n": 65, "q": "Chỗ trống (134)", "qvi": "", "opts": [{"t": "Ours is a highly competitive industry."}, {"t": "RGBS Automotive began doing business 45 years ago."}, {"t": "We also offer a generous number of vacation days."}, {"t": "RGBS Automotive sells a wide selection of merchandise."}], "ans": ["C"], "key": "Điền câu", "ex": "Câu trước liệt kê quyền lợi (lương, đào tạo, thăng tiến) → thêm một quyền lợi nữa: ngày nghỉ phép (C, có \"also\").", "label": "134"}]}, {"title": "Part 6 · Câu 135–138 · Bản ghi nhớ", "tag": "Memo", "passage": ["MEMO", "To: Marketing Team", "From: Alyssa Jacobs, Project Manager", "Date: 27 September", "Subject: Meeting wrap-up", "Thank you again to all of you for your fine work on the upcoming marketing campaign for the Turbo Omega 2 smartphone. As ⟦135⟧ during yesterday's meeting, our goal is to launch the television, radio, and social media advertisements on 1 November. The phone itself will be in stores by 1 December. ⟦136⟧.", "⟦137⟧, Gary Carollo will draft the press release and post it on our shared drive, where all of you will be able to read it. Please e-mail any ⟦138⟧ for changes to Gary within one week. He will present his final draft at our next regular meeting. We will also tie up any loose ends at that time."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Cảm ơn mọi người lần nữa vì đã làm tốt chiến dịch marketing sắp tới cho điện thoại Turbo Omega 2. Như đã quyết định trong cuộc họp hôm qua, mục tiêu là tung quảng cáo trên TV, radio và mạng xã hội vào 1/11. Điện thoại sẽ bán ở cửa hàng từ 1/12. Như vậy mình có một tháng để tạo sự hào hứng cho khách hàng. Sắp tới, Gary Carollo sẽ soạn thông cáo báo chí và đăng lên ổ chung để mọi người đọc. Có góp ý chỉnh sửa gì thì e-mail cho Gary trong vòng một tuần. Anh ấy sẽ trình bày bản cuối ở cuộc họp định kỳ tới, và mình sẽ giải quyết nốt các việc còn lại lúc đó."}], "qs": [{"n": 66, "q": "Chỗ trống (135)", "qvi": "", "opts": [{"t": "taken"}, {"t": "driven"}, {"t": "earned"}, {"t": "decided"}], "ans": ["D"], "key": "Từ vựng", "ex": "As decided during yesterday's meeting = như đã quyết định trong cuộc họp hôm qua.", "label": "135"}, {"n": 67, "q": "Chỗ trống (136)", "qvi": "", "opts": [{"t": "Remember to turn off your phone at the end of the workday."}, {"t": "This gives us one month to generate consumer excitement."}, {"t": "The wholesale price can also be adjusted if necessary."}, {"t": "These new features will surely increase Turbo Omega 2 sales."}], "ans": ["B"], "key": "Điền câu", "ex": "Quảng cáo ra 1/11, điện thoại bán 1/12 → \"có một tháng để tạo sự hào hứng\" (B).", "label": "136"}, {"n": 68, "q": "Chỗ trống (137)", "qvi": "", "opts": [{"t": "Rather"}, {"t": "Soon"}, {"t": "After all"}, {"t": "That is"}], "ans": ["B"], "key": "Trạng từ liên kết", "ex": "Soon = sắp tới: kể bước tiếp theo của dự án (Gary sẽ soạn thông cáo).", "label": "137"}, {"n": 69, "q": "Chỗ trống (138)", "qvi": "", "opts": [{"t": "suggesting"}, {"t": "suggested"}, {"t": "suggestions"}, {"t": "suggests"}], "ans": ["C"], "key": "Từ loại", "ex": "any + danh từ → suggestions (góp ý) for changes.", "label": "138"}]}, {"title": "Part 6 · Câu 139–142 · Mô tả sản phẩm", "tag": "Mô tả sản phẩm", "passage": ["Handmade Silk Blouse by Coreopsis Textiles, Size Medium, £45", "Coreopsis Textiles' silk blouses are created from vintage fabrics and other recycled components that we sew together in a patchwork fashion. Because all ⟦139⟧ garments are handcrafted, each is one of a kind. ⟦140⟧. Unique variations within each piece are part of the charm of Coreopsis Textiles' products. The blouse you receive will be similar in style but not identical to the one pictured.", "Please note that this garment is ⟦141⟧. It is recommended that you either hand-wash it or wash it in cold water on the gentle cycle in a mesh bag. While the item has been prewashed, dryer heat may cause it to shrink. ⟦142⟧, it is important that it be hung to air dry."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Áo lụa thủ công của Coreopsis Textiles, cỡ M, 45 bảng. Áo lụa của Coreopsis Textiles được làm từ vải cổ điển và các vật liệu tái chế khác mà chúng tôi may ghép lại kiểu chắp vá. Vì tất cả sản phẩm của chúng tôi đều làm thủ công nên mỗi chiếc là duy nhất. Không thể làm ra hai chiếc giống hệt nhau. Những khác biệt riêng ở mỗi chiếc chính là nét duyên của sản phẩm. Áo bạn nhận được sẽ giống kiểu nhưng không giống hệt ảnh. Lưu ý: áo này rất mỏng manh. Nên giặt tay hoặc giặt nước lạnh ở chế độ nhẹ, cho vào túi lưới. Dù áo đã được giặt trước, hơi nóng máy sấy vẫn có thể làm co áo. Vì vậy, cần phơi khô tự nhiên."}], "qs": [{"n": 70, "q": "Chỗ trống (139)", "qvi": "", "opts": [{"t": "its"}, {"t": "our"}, {"t": "your"}, {"t": "their"}], "ans": ["B"], "key": "Đại từ", "ex": "Công ty viết về sản phẩm của mình (\"that we sew together\") → our garments.", "label": "139"}, {"n": 71, "q": "Chỗ trống (140)", "qvi": "", "opts": [{"t": "This is a hassle-free return policy."}, {"t": "Always check your receipt."}, {"t": "They cannot be exactly replicated."}, {"t": "Extra shipping charges may apply."}], "ans": ["C"], "key": "Điền câu", "ex": "Câu trước \"each is one of a kind\", câu sau \"unique variations\" → không thể làm giống hệt (C).", "label": "140"}, {"n": 72, "q": "Chỗ trống (141)", "qvi": "", "opts": [{"t": "popular"}, {"t": "delicate"}, {"t": "mild"}, {"t": "unavailable"}], "ans": ["B"], "key": "Từ vựng", "ex": "Cần giặt tay, nước lạnh, chế độ nhẹ → vải mỏng manh: delicate.", "label": "141"}, {"n": 73, "q": "Chỗ trống (142)", "qvi": "", "opts": [{"t": "If not"}, {"t": "Likewise"}, {"t": "Therefore"}, {"t": "On the contrary"}], "ans": ["C"], "key": "Trạng từ liên kết", "ex": "Sấy có thể làm co áo → VÌ VẬY phải phơi khô tự nhiên: Therefore.", "label": "142"}]}, {"title": "Part 6 · Câu 143–146 · E-mail", "tag": "E-mail", "passage": ["To: Shu Jiang <sjiang@rowanatech.ca>", "From: Maxwell Baschet <mbaschet@mapleroadstorage.ca>", "Date: 4 April", "Subject: Your contract", "Attachment: Jiang contract", "Dear Ms. Jiang,", "We are pleased you ⟦143⟧ Maple Road Storage for your storage needs. I have attached a copy of your signed contract. ⟦144⟧.", "Do you know about our referral program? You will receive one free month of storage if someone you recommend signs a contract with us. The new tenant will receive a free month ⟦145⟧. You can find more information about this program and all our special ⟦146⟧ on our Web site at www.mapleroadstorage.ca.", "Sincerely,", "Maxwell Baschet, Site Manager"], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Chào chị Jiang, chúng tôi rất vui vì chị đã chọn Maple Road Storage cho nhu cầu lưu kho của mình. Tôi gửi kèm bản sao hợp đồng chị đã ký. Nếu thông tin liên lạc của chị thay đổi, vui lòng báo cho chúng tôi. Chị có biết chương trình giới thiệu của chúng tôi không? Chị sẽ được miễn phí một tháng lưu kho nếu người chị giới thiệu ký hợp đồng với chúng tôi. Người thuê mới cũng được miễn phí một tháng. Chị có thể xem thêm về chương trình này và tất cả ưu đãi đặc biệt trên website. Trân trọng, Maxwell Baschet, quản lý."}], "qs": [{"n": 74, "q": "Chỗ trống (143)", "qvi": "", "opts": [{"t": "chooses"}, {"t": "will choose"}, {"t": "chosen"}, {"t": "have chosen"}], "ans": ["D"], "key": "Thì động từ", "ex": "Khách vừa chọn công ty (đã ký hợp đồng) → h
