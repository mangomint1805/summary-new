<script>window.MT={"n": "a6", "part": 7, "partName": "Part 7", "sub": "Reading Comprehension · Đọc hiểu · 54 câu (147–200)", "intro": "Trang này chữa <b>Mock Test 6 (Part 7)<\/b> của lớp TOEIC A. Mỗi nhóm câu có ảnh văn bản (bấm vào ảnh để phóng to), phần <i>Câu then chốt + dịch<\/i> và giải thích từng câu. Số <b>(147)<\/b> đánh dấu câu chứa đáp án.", "stepsTitle": "Cách làm Part 7: 4 bước", "steps": ["<b>Đọc câu hỏi trước, gạch từ khóa<\/b> (tên người, ngày, con số, từ đặc biệt). Biết mình cần tìm gì rồi mới đọc bài.", "<b>5 dạng câu hỏi:<\/b> ý chính (<i>Why was … written? What is … about?<\/i>) → đọc đầu bài; chi tiết (<i>What / When / Where…<\/i>) → dò từ khóa; suy luận (<i>suggested / most likely / indicated<\/i>) → tìm bằng chứng rồi suy ra; từ đồng nghĩa (<i>closest in meaning<\/i>) → thay từng đáp án vào câu; điền câu [1]–[4] → tìm từ nối, đại từ.", "<b>Câu NOT:<\/b> tìm 3 đáp án CÓ trong bài, loại dần, đáp án còn lại là đúng.", "<b>Bài nhiều văn bản (176–200):<\/b> thường có 1–2 câu phải ghép thông tin của 2 văn bản (VD: e-mail nói \"giá thuê tối đa\", danh sách nêu giá từng nơi, bài báo cho biết địa chỉ mới)."], "groups": [{"title": "Câu 147–148 · Mô tả sản phẩm", "tag": "1 văn bản", "imgs": ["img/amk6/p1.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(147) It can wash a full load in as little as one hour—no more waiting for **clean dishes**!", "vi": "Máy có thể rửa đầy một mẻ chỉ trong một giờ, khỏi phải chờ bát đĩa sạch!"}, {"sp": "", "t": "(148) Even large dishes such as serving platters can be cleaned with ease thanks to the Kemper 25's **removable top rack**.", "vi": "Ngay cả đĩa lớn như đĩa bày thức ăn cũng rửa dễ dàng nhờ giá trên cùng tháo rời được của Kemper 25."}], "qs": [{"n": 147, "q": "What is the product description about?", "qvi": "Bài mô tả sản phẩm gì?", "opts": [{"t": "An item of clothing", "vi": "Quần áo"}, {"t": "A kitchen appliance", "vi": "Thiết bị nhà bếp"}, {"t": "A vacuum cleaner", "vi": "Máy hút bụi"}, {"t": "A fitness machine", "vi": "Máy tập thể dục"}], "ans": ["B"], "key": "wash, clean dishes, pots and pans → máy rửa bát = kitchen appliance", "ex": "Máy \"rửa\" (wash) bát đĩa (dishes), xoong nồi (pots and pans) → máy rửa bát, là thiết bị nhà bếp. Đề không nói thẳng \"dishwasher\", phải suy ra."}, {"n": 148, "q": "What is indicated about the product?", "qvi": "Điều gì được nói về sản phẩm?", "opts": [{"t": "It is easy to keep clean.", "vi": "Dễ giữ sạch."}, {"t": "It uses energy efficiently.", "vi": "Tiết kiệm năng lượng."}, {"t": "It has multiple noise settings.", "vi": "Có nhiều chế độ độ ồn."}, {"t": "It has an adjustable structure.", "vi": "Có cấu trúc điều chỉnh được."}], "ans": ["D"], "key": "removable top rack → adjustable structure", "ex": "Giá trên cùng tháo ra được (removable) để rửa đĩa lớn → cấu trúc điều chỉnh được. (B) bẫy: bài nói \"high water efficiency\" (tiết kiệm NƯỚC), không phải năng lượng. (C) các chế độ là chế độ rửa, không phải độ ồn."}]}, {"title": "Câu 149–150 · Hướng dẫn hoàn tiền", "tag": "1 văn bản", "imgs": ["img/amk6/p2.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(149) Have **your manager sign** the form and sign it yourself as well. Unsigned requests will not be processed.", "vi": "Nhờ quản lý ký vào mẫu đơn và bạn cũng tự ký. Đơn không có chữ ký sẽ không được xử lý."}, {"sp": "", "t": "(150) If you make frequent purchases, you may be eligible to receive a **credit card** under Bennett Mobile's account. **Speak to the finance team** to request approval.", "vi": "Nếu bạn hay phải mua đồ, bạn có thể được cấp thẻ tín dụng đứng tên tài khoản Bennett Mobile. Hãy nói với nhóm tài chính để xin duyệt."}], "qs": [{"n": 149, "q": "According to the instructions, what must be included on the form?", "qvi": "Theo hướng dẫn, mẫu đơn phải có gì?", "opts": [{"t": "The employee's phone number", "vi": "Số điện thoại nhân viên"}, {"t": "The signature of a supervisor", "vi": "Chữ ký của cấp trên"}, {"t": "A department number", "vi": "Mã số phòng ban"}, {"t": "A copy of an ID card", "vi": "Bản sao thẻ căn cước"}], "ans": ["B"], "key": "manager sign → signature of a supervisor", "ex": "Bước 4: \"Have your manager sign the form\" → manager = supervisor (cấp trên). (A) bẫy: bước 1 ghi \"employee number\" (mã nhân viên), không phải số điện thoại."}, {"n": 150, "q": "What is indicated about the finance team members?", "qvi": "Điều gì được nói về nhóm tài chính?", "opts": [{"t": "They can issue company credit cards.", "vi": "Họ có thể cấp thẻ tín dụng công ty."}, {"t": "They need the form by the 25th of every month.", "vi": "Họ cần đơn trước ngày 25 hằng tháng."}, {"t": "They must approve all purchases in advance.", "vi": "Họ phải duyệt trước mọi khoản mua."}, {"t": "They have recently changed a policy.", "vi": "Họ vừa đổi một quy định."}], "ans": ["A"], "key": "credit card … speak to the finance team", "ex": "Muốn có thẻ tín dụng công ty thì nói với nhóm tài chính để xin duyệt → họ cấp thẻ. (B) bẫy: ngày 25 là ngày nhận lương, hạn nộp đơn là ngày 15."}]}, {"title": "Câu 151–152 · Phiếu nhận tiền mặt", "tag": "1 văn bản", "imgs": ["img/amk6/p3.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "Amount Dispensed: $150. (152) Description: Meal allowance for a business trip to Atlanta (151) to **perform the inspection of the Cayce Building**.", "vi": "Số tiền đã chi: 150 đô. Nội dung: tiền ăn cho chuyến công tác Atlanta để kiểm tra tòa nhà Cayce."}, {"sp": "", "t": "(152) I agree that the above details are correct and that **I have received the specified amount**.", "vi": "Tôi xác nhận thông tin trên là đúng và tôi đã nhận số tiền nêu trên."}], "qs": [{"n": 151, "q": "What does Ms. Lemke plan to do in Atlanta?", "qvi": "Cô Lemke định làm gì ở Atlanta?", "opts": [{"t": "Inspect a building", "vi": "Kiểm tra một tòa nhà"}, {"t": "Negotiate a contract", "vi": "Đàm phán hợp đồng"}, {"t": "Apply for a loan", "vi": "Xin vay tiền"}, {"t": "Demonstrate a product", "vi": "Giới thiệu sản phẩm"}], "ans": ["A"], "key": "perform the inspection of the Cayce Building", "ex": "\"to perform the inspection of the Cayce Building\" (kiểm tra tòa nhà Cayce) → inspect a building."}, {"n": 152, "q": "What does the receipt confirm?", "qvi": "Phiếu này xác nhận điều gì?", "opts": [{"t": "Ms. Lemke's enrollment in an association", "vi": "Cô Lemke gia nhập hiệp hội"}, {"t": "Issuance of funds to Ms. Lemke", "vi": "Cô Lemke đã được cấp tiền"}, {"t": "Ms. Lemke's purchase of travel tickets", "vi": "Cô Lemke đã mua vé đi lại"}, {"t": "The loaning of equipment to Ms. Lemke", "vi": "Cô Lemke mượn thiết bị"}], "ans": ["B"], "key": "Receipt of Cash, I have received the amount → issuance of funds", "ex": "Đây là \"Receipt of Cash\" (phiếu nhận tiền mặt), cô ký xác nhận đã nhận 150 đô → công ty đã cấp tiền (issuance of funds)."}]}, {"title": "Câu 153–154 · Chuỗi tin nhắn", "tag": "1 văn bản", "imgs": ["img/amk6/p4.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(153) She doesn't have time to sit down with everyone who passed the phone screen… So she wants to **meet with them all at once**.", "vi": "Cô ấy không có thời gian ngồi gặp từng người qua vòng phỏng vấn điện thoại… Nên cô ấy muốn gặp tất cả cùng một lúc."}, {"sp": "", "t": "Nina: It would be better to **put the process on hold** for that week. — Anthony: (154) **That's true.**", "vi": "Nina: Tốt hơn là tạm dừng quy trình tuần đó. — Anthony: Đúng vậy."}], "qs": [{"n": 153, "q": "What does Ms. Gracey want to do?", "qvi": "Cô Gracey muốn làm gì?", "opts": [{"t": "Hold a group interview", "vi": "Phỏng vấn nhóm"}, {"t": "Postpone her business trip", "vi": "Hoãn chuyến công tác"}, {"t": "Hire a temporary worker", "vi": "Thuê nhân viên tạm thời"}, {"t": "Take a marketing course", "vi": "Học khóa marketing"}], "ans": ["A"], "key": "meet with them all at once → group interview", "ex": "Gặp tất cả ứng viên một lúc = phỏng vấn nhóm. (B) sai: cô vẫn đi công tác."}, {"n": 154, "q": "At 9:40 A.M., what does Mr. Winslow most likely mean when he writes, \"That's true\"?", "qvi": "Lúc 9:40, khi viết \"That's true\", anh Winslow có ý gì?", "opts": [{"t": "He knows that a decision is not up to him.", "vi": "Anh biết quyết định không phải do anh."}, {"t": "He agrees that Ms. Gracey has a busy schedule.", "vi": "Anh đồng ý cô Gracey rất bận."}, {"t": "He shares Ms. Simpson's opinion of a job candidate.", "vi": "Anh cùng ý kiến với cô Simpson về một ứng viên."}, {"t": "He thinks a hiring process should be paused.", "vi": "Anh nghĩ nên tạm dừng quy trình tuyển dụng."}], "ans": ["D"], "key": "\"That's true\" đồng ý với câu ngay trước: put the process on hold", "ex": "Câu ngay trước của Nina: \"tốt hơn là tạm dừng quy trình tuần đó\" → \"That's true\" = đồng ý nên tạm dừng (put on hold = pause)."}]}, {"title": "Câu 155–157 · Tờ giới thiệu trang trại", "tag": "1 văn bản", "imgs": ["img/amk6/p5.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(155) We **grow** delicious, organic produce… vegetable patches and **fruit orchards**.", "vi": "Chúng tôi trồng nông sản hữu cơ ngon… có vườn rau và vườn cây ăn quả."}, {"sp": "", "t": "(156) **New owner-operator** Ernesto Stewart welcomes you to Vandivia!", "vi": "Chủ mới kiêm người điều hành Ernesto Stewart chào mừng bạn đến Vandivia!"}, {"sp": "", "t": "The entrance fee is $20 per person and covers all the activities listed above… (157) we offer a **$5 round-trip shuttle** service from Wadena Station.", "vi": "Vé vào cửa 20 đô/người, gồm mọi hoạt động trên… chúng tôi có xe đưa đón khứ hồi giá 5 đô từ ga Wadena."}], "qs": [{"n": 155, "q": "What most likely is Vandivia?", "qvi": "Vandivia có lẽ là gì?", "opts": [{"t": "A farm", "vi": "Trang trại"}, {"t": "A restaurant", "vi": "Nhà hàng"}, {"t": "A beach resort", "vi": "Khu nghỉ dưỡng biển"}, {"t": "A national park", "vi": "Vườn quốc gia"}], "ans": ["A"], "key": "grow produce, vegetable patches, orchards → farm", "ex": "Trồng nông sản, có vườn rau, vườn cây ăn quả, kho thóc đỏ (red barn) → trang trại. (B) bẫy: họ bán cho nhà hàng, ông chủ là đầu bếp."}, {"n": 156, "q": "What is indicated about Vandivia?", "qvi": "Điều gì được nói về Vandivia?", "opts": [{"t": "It has increased the charge for entry.", "vi": "Đã tăng giá vé."}, {"t": "It has been nominated for an award.", "vi": "Được đề cử giải thưởng."}, {"t": "It rents satellite navigation systems.", "vi": "Cho thuê máy định vị."}, {"t": "It is under new management.", "vi": "Có người quản lý mới."}], "ans": ["D"], "key": "new owner-operator → under new management", "ex": "\"New owner-operator\" (chủ mới) → đổi người quản lý. (B) bẫy: ông Stewart là đầu bếp từng đoạt giải, không phải trang trại được đề cử."}, {"n": 157, "q": "What is available for an additional fee?", "qvi": "Dịch vụ nào phải trả thêm tiền?", "opts": [{"t": "Transportation to a site", "vi": "Xe đưa đón đến nơi"}, {"t": "Product samples", "vi": "Hàng ăn thử"}, {"t": "Bicycle tours", "vi": "Tour xe đạp"}, {"t": "Educational workshops", "vi": "Lớp học"}], "ans": ["A"], "key": "$5 shuttle → transportation", "ex": "Vé 20 đô đã gồm mọi hoạt động (ăn thử, tour xe đạp, lớp học). Riêng xe đưa đón (shuttle) phải trả thêm 5 đô."}]}, {"title": "Câu 158–160 · Bản ghi nhớ quán cà phê", "tag": "1 văn bản", "imgs": ["img/amk6/p6.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(158) Please help with this project by… trying to **come up with a delicious and unique coffee drink**. If you succeed, send me an e-mail outlining the ingredients and how to make it.", "vi": "Hãy giúp dự án này bằng cách… nghĩ ra một món cà phê ngon và độc đáo. Nếu được, gửi tôi e-mail nêu nguyên liệu và cách pha."}, {"sp": "", "t": "(159) You will receive a $50 gift certificate to Eva Department Store, so you can shop **right across the street**.", "vi": "Bạn sẽ nhận phiếu quà tặng 50 đô của cửa hàng bách hóa Eva, để mua sắm ngay bên kia đường."}, {"sp": "", "t": "(160) The drinks should not use too many costly ingredients… include suggestions for substitutions… our staff must be able to make each drink quickly.", "vi": "Đồ uống không nên dùng nhiều nguyên liệu đắt… (nếu có chất gây dị ứng) thì gợi ý nguyên liệu thay thế… nhân viên phải pha được nhanh."}], "qs": [{"n": 158, "q": "Why was the memo written?", "qvi": "Bản ghi nhớ được viết để làm gì?", "opts": [{"t": "To describe changes to a drinks menu", "vi": "Mô tả thay đổi thực đơn"}, {"t": "To request recipe ideas from staff", "vi": "Xin ý tưởng công thức từ nhân viên"}, {"t": "To ask for referrals for temporary workers", "vi": "Nhờ giới thiệu nhân viên tạm thời"}, {"t": "To announce a holiday party", "vi": "Thông báo tiệc ngày lễ"}], "ans": ["B"], "key": "come up with a drink, send ingredients and how to make it → recipe ideas", "ex": "Nhờ nhân viên nghĩ món mới, gửi nguyên liệu và cách pha → xin ý tưởng công thức (recipe)."}, {"n": 159, "q": "What is indicated about Eva Department Store?", "qvi": "Điều gì được nói về cửa hàng Eva?", "opts": [{"t": "It is within walking distance of Coffee Max.", "vi": "Đi bộ được từ Coffee Max."}, {"t": "It is holding a sales event.", "vi": "Đang có đợt giảm giá."}, {"t": "It gives discounts to Coffee Max employees.", "vi": "Giảm giá cho nhân viên Coffee Max."}, {"t": "It will open its own coffee shop.", "vi": "Sẽ mở quán cà phê riêng."}], "ans": ["A"], "key": "right across the street → within walking distance", "ex": "\"right across the street\" (ngay bên kia đường) → đi bộ tới được (within walking distance)."}, {"n": 160, "q": "What is NOT mentioned as a characteristic of some drinks?", "qvi": "Điều gì KHÔNG được nhắc là đặc điểm của đồ uống?", "opts": [{"t": "They can be prepared in a short time.", "vi": "Pha nhanh."}, {"t": "They are inexpensive to make.", "vi": "Rẻ."}, {"t": "They do not include allergens.", "vi": "Không chứa chất gây dị ứng."}, {"t": "They share a seasonal theme.", "vi": "Theo chủ đề mùa lễ."}], "ans": ["C"], "key": "NOT: allergens chỉ cần gợi ý thay thế", "ex": "Có nhắc: pha nhanh (A), không dùng nhiều nguyên liệu đắt (B), chủ đề mùa lễ (D: holiday-themed). Về dị ứng, bài chỉ yêu cầu <b>gợi ý nguyên liệu thay thế<\/b>, không nói đồ uống không được chứa chất gây dị ứng → (C)."}]}, {"title": "Câu 161–163 · Bản ghi nhớ sửa sàn", "tag": "Điền câu", "imgs": ["img/amk6/p7.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "A crew from Trevino Contractors will visit our office this weekend to **renovate the main hallway**. — [1] —", "vi": "Đội thợ của Trevino Contractors sẽ đến văn phòng cuối tuần này để sửa sang hành lang chính. — [1] —"}, {"sp": "", "t": "(161) please see David Rogowski in the IT department to **request the use of a company laptop**.", "vi": "hãy gặp David Rogowski ở phòng IT để xin dùng máy tính xách tay của công ty."}, {"sp": "", "t": "(162) please let the security team know if your car is by the Boyd Street entrance. The crew needs **the first row of the lot** clear…", "vi": "hãy báo đội bảo vệ nếu xe của bạn đỗ cạnh lối vào phố Boyd. Đội thợ cần hàng đầu tiên của bãi xe để trống…"}], "qs": [{"n": 161, "q": "What should employees speak to Mr. Rogowski about?", "qvi": "Nhân viên nên nói với anh Rogowski về việc gì?", "opts": [{"t": "Storing some personal items", "vi": "Cất đồ cá nhân"}, {"t": "Getting a software upgrade", "vi": "Nâng cấp phần mềm"}, {"t": "Moving to a new office", "vi": "Chuyển văn phòng"}, {"t": "Borrowing some equipment", "vi": "Mượn thiết bị"}], "ans": ["D"], "key": "request the use of a company laptop → borrow equipment", "ex": "Xin dùng laptop công ty = mượn thiết bị. (B) bẫy: có nhắc \"specialized software\" nhưng không nâng cấp phần mềm."}, {"n": 162, "q": "What is suggested about the Boyd Street entrance?", "qvi": "Có thể suy ra gì về lối vào phố Boyd?", "opts": [{"t": "It will be locked by the security team.", "vi": "Sẽ bị bảo vệ khóa."}, {"t": "It faces heavy traffic.", "vi": "Đông xe qua lại."}, {"t": "It is near a parking area.", "vi": "Gần bãi đỗ xe."}, {"t": "It has the building's largest doors.", "vi": "Có cửa lớn nhất tòa nhà."}], "ans": ["C"], "key": "car by the entrance + first row of the lot → near a parking area", "ex": "Xe đỗ cạnh lối vào Boyd Street, và câu sau nói \"hàng đầu của bãi xe\" → lối vào này gần bãi đỗ xe."}, {"n": 163, "q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"The flooring will be replaced, and the walls will be repainted.\"", "qvi": "Câu \"Sàn sẽ được thay, tường sẽ được sơn lại\" hợp nhất ở vị trí nào?", "opts": [{"t": "[1]", "vi": "[1]"}, {"t": "[2]", "vi": "[2]"}, {"t": "[3]", "vi": "[3]"}, {"t": "[4]", "vi": "[4]"}], "ans": ["A"], "key": "renovate the main hallway → [1] nói rõ sửa gì", "ex": "Câu trước [1] nói đội thợ đến \"sửa sang hành lang chính\". Câu cần điền giải thích cụ thể sửa gì (thay sàn, sơn tường) → đặt ngay sau, ở [1]. Tiêu đề memo cũng là \"Flooring\" (sàn nhà)."}]}, {"title": "Câu 164–167 · Thông báo trình diễn thời trang", "tag": "1 văn bản", "imgs": ["img/amk6/p8.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(164) Springdale Connects… is holding a **fashion show** to raise project funds. You can help by **designing and sewing a special outfit** for the event.", "vi": "Springdale Connects… tổ chức buổi trình diễn thời trang để gây quỹ. Bạn có thể giúp bằng cách thiết kế và may một bộ trang phục cho sự kiện."}, {"sp": "", "t": "(165) The proceeds… will be used to **purchase guitars, keyboards, trumpets**, and more to be given to elderly people… to form the town's first-ever senior citizen band.", "vi": "Tiền thu được… sẽ dùng mua đàn guitar, đàn phím, kèn trumpet… tặng người cao tuổi để lập ban nhạc người cao tuổi đầu tiên của thị trấn."}, {"sp": "", "t": "(166) visit our Web site… to find out the **required submission date**, the **suggested clothing size**, and a list of the **accessories** we can provide.", "vi": "vào website… để biết hạn nộp, cỡ quần áo đề nghị và danh sách phụ kiện chúng tôi có thể cung cấp."}, {"sp": "", "t": "(167) a brief biography… will be printed on **the flyer** that will be distributed to audience members.", "vi": "một đoạn tiểu sử ngắn… sẽ được in trên tờ rơi phát cho khán giả."}], "qs": [{"n": 164, "q": "What does the notice ask people to do?", "qvi": "Thông báo đề nghị mọi người làm gì?", "opts": [{"t": "Provide items for a fundraising event", "vi": "Cung cấp đồ cho sự kiện gây quỹ"}, {"t": "Become a member of a charity", "vi": "Làm thành viên tổ chức từ thiện"}, {"t": "Volunteer to set up a venue", "vi": "Tình nguyện dựng sân khấu"}, {"t": "Donate money to an organization", "vi": "Quyên góp tiền"}], "ans": ["A"], "key": "design and sew an outfit for a fundraising show", "ex": "Nhà thiết kế may trang phục (= items) cho buổi diễn gây quỹ (raise funds) → cung cấp đồ cho sự kiện gây quỹ."}, {"n": 165, "q": "What does Springdale Connects aim to do?", "qvi": "Springdale Connects muốn làm gì?", "opts": [{"t": "Host free fashion design courses", "vi": "Mở khóa học thiết kế miễn phí"}, {"t": "Help to restore a historic theater", "vi": "Giúp tu sửa nhà hát cổ"}, {"t": "Prepare and serve meals to elderly residents", "vi": "Nấu ăn cho người cao tuổi"}, {"t": "Provide musical instruments to community members", "vi": "Tặng nhạc cụ cho người dân"}], "ans": ["D"], "key": "purchase guitars, keyboards… given to elderly people", "ex": "Tiền dùng mua nhạc cụ (guitar, keyboard, trumpet) tặng người cao tuổi → musical instruments. (B) bẫy: nhà hát cổ chỉ là nơi tổ chức."}, {"n": 166, "q": "What is NOT indicated as information provided on the Web site?", "qvi": "Thông tin nào KHÔNG có trên website?", "opts": [{"t": "A photo gallery", "vi": "Thư viện ảnh"}, {"t": "A deadline", "vi": "Hạn chót"}, {"t": "Details on available accessories", "vi": "Thông tin phụ kiện"}, {"t": "Sizing recommendations", "vi": "Gợi ý cỡ áo"}], "ans": ["A"], "key": "NOT: website có submission date, size, accessories", "ex": "Website có: hạn nộp (B: deadline), cỡ áo (D), danh sách phụ kiện (C). Không nhắc thư viện ảnh → (A)."}, {"n": 167, "q": "According to the notice, where will participants' biographies be seen?", "qvi": "Tiểu sử của người tham gia sẽ xuất hiện ở đâu?", "opts": [{"t": "In an online newsletter", "vi": "Bản tin online"}, {"t": "On a handout", "vi": "Tờ phát tay"}, {"t": "On a Web site", "vi": "Website"}, {"t": "On a notice in the lobby", "vi": "Thông báo ở sảnh"}], "ans": ["B"], "key": "flyer distributed → handout", "ex": "In trên \"flyer\" phát cho khán giả → handout (tờ phát tay). (C) bẫy: tiểu sử được NỘP qua website, nhưng in ra tờ rơi."}]}, {"title": "Câu 168–171 · Trò chuyện online", "tag": "1 văn bản", "imgs": ["img/amk6/p9.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(168) We don't have enough **cooks and servers** to do both.", "vi": "Chúng ta không đủ đầu bếp và người phục vụ để làm cả hai."}, {"sp": "", "t": "Charles: Do we have **another phone number** for him? — Natasha: I've never needed one before. (169) **I'll look into that.**", "vi": "Charles: Có số điện thoại khác của anh ấy không? — Natasha: Trước giờ tôi chưa cần. Để tôi tìm xem."}, {"sp": "", "t": "(170) Mr. Garrett said they've decided to use a different company instead. **While he liked our menu suggestions, they wanted to use a company that specializes in vegetarian dishes.**", "vi": "Ông Garrett nói họ quyết định dùng công ty khác. Dù ông thích thực đơn ta gợi ý, họ muốn công ty chuyên món chay."}, {"sp": "", "t": "(171) we'll have to get the **pricing estimate** ready right away… Heather, I'd like you to do that… Heather, can you send me a finished file by 3 p.m.? — Yes.", "vi": "ta sẽ phải chuẩn bị ngay bảng báo giá… Heather, tôi muốn chị làm việc đó… Heather, chị gửi tôi file hoàn chỉnh trước 3 giờ được không? — Được."}], "qs": [{"n": 168, "q": "Where most likely do the writers work?", "qvi": "Những người viết có lẽ làm ở đâu?", "opts": [{"t": "At a catering company", "vi": "Công ty dịch vụ ăn uống"}, {"t": "At a graphic design firm", "vi": "Công ty thiết kế đồ họa"}, {"t": "At a technology firm", "vi": "Công ty công nghệ"}, {"t": "At a clothing manufacturer", "vi": "Công ty may mặc"}], "ans": ["A"], "key": "cooks and servers, menu → catering company", "ex": "Có đầu bếp, người phục vụ, gợi ý thực đơn → công ty nấu tiệc (catering). (C), (D) bẫy: Hogan Tech, Nico Apparel là khách hàng."}, {"n": 169, "q": "At 1:28 P.M., what does Ms. Kopp mean when she writes, \"I'll look into that\"?", "qvi": "Lúc 1:28, cô Kopp có ý gì khi viết \"I'll look into that\"?", "opts": [{"t": "She will try to schedule a client visit.", "vi": "Cô sẽ hẹn khách đến thăm."}, {"t": "She will check a meeting space's availability.", "vi": "Cô sẽ kiểm tra phòng họp còn trống không."}, {"t": "She will search for some contact information.", "vi": "Cô sẽ tìm thông tin liên lạc."}, {"t": "She will inquire about a fee.", "vi": "Cô sẽ hỏi về một khoản phí."}], "ans": ["C"], "key": "another phone number → search for contact information", "ex": "Câu trước hỏi \"có số điện thoại khác không?\" → cô sẽ đi tìm số điện thoại = thông tin liên lạc."}, {"n": 170, "q": "What does Mr. Vaughn tell the other writers about?", "qvi": "Ông Vaughn cho mọi người biết điều gì?", "opts": [{"t": "When to arrive for an event", "vi": "Khi nào đến sự kiện"}, {"t": "Why a decision was made", "vi": "Vì sao một quyết định được đưa ra"}, {"t": "Who is representing Nico Apparel", "vi": "Ai đại diện Nico Apparel"}, {"t": "Where to file a report", "vi": "Nộp báo cáo ở đâu"}], "ans": ["B"], "key": "they wanted a company that specializes in vegetarian dishes → why", "ex": "Ông giải thích lý do Hogan Tech chọn công ty khác: họ muốn công ty chuyên món chay → vì sao có quyết định đó."}, {"n": 171, "q": "What will Ms. Dengler most likely do next?", "qvi": "Cô Dengler có lẽ sẽ làm gì tiếp theo?", "opts": [{"t": "Update a Web site", "vi": "Cập nhật website"}, {"t": "Prepare an estimate", "vi": "Chuẩn bị bảng báo giá"}, {"t": "Find a new supplier", "vi": "Tìm nhà cung cấp mới"}, {"t": "Speak to Mr. Garrett", "vi": "Nói chuyện với ông Garrett"}], "ans": ["B"], "key": "pricing estimate … Heather, I'd like you to do that", "ex": "Ông Vaughn giao cho Heather (Dengler) làm bảng báo giá (pricing estimate), sau đó hỏi gửi file trước 3 giờ, cô đáp \"Yes… if I start now\"."}]}, {"title": "Câu 172–175 · Bài báo dự án cống", "tag": "Điền câu", "imgs": ["img/amk6/p10.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(172) The covered waterways… will **stop excess sewage from spilling into the river**.", "vi": "Các kênh có nắp… sẽ ngăn nước thải tràn ra sông."}, {"sp": "", "t": "— [1] —. (175) The smooth completion of the phase is remarkable given the complex feats of engineering that were involved.", "vi": "— [1] —. Việc hoàn thành suôn sẻ giai đoạn này thật đáng chú ý vì có nhiều công đoạn kỹ thuật phức tạp."}, {"sp": "", "t": "(173) \"**We had successfully used tidewater** to move structures in other Clearway projects,\" Bauright chief engineer Nancy Majors explained.", "vi": "\"Chúng tôi đã từng dùng nước thủy triều để di chuyển các kết cấu trong những dự án Clearway khác thành công,\" kỹ sư trưởng Nancy Majors của Bauright giải thích."}, {"sp": "", "t": "(174) the simpler second phase… will be handled by Perriott, LLC… Perriott will add **a walking path, benches, and greenery to the public land**.", "vi": "giai đoạn 2 đơn giản hơn… do Perriott đảm nhận… Perriott sẽ làm đường đi bộ, ghế đá và cây xanh trên khu đất công cộng."}], "qs": [{"n": 172, "q": "What problem is the Lundgate Shore project most likely intended to address?", "qvi": "Dự án Lundgate Shore có lẽ nhằm giải quyết vấn đề gì?", "opts": [{"t": "Pollution of a river by wastewater", "vi": "Nước thải làm ô nhiễm sông"}, {"t": "Excessive traffic on a highway", "vi": "Kẹt xe trên đường cao tốc"}, {"t": "The deterioration of an old bridge", "vi": "Cây cầu cũ xuống cấp"}, {"t": "A lack of sewer service to some homes", "vi": "Một số nhà không có cống"}], "ans": ["A"], "key": "stop sewage from spilling into the river → pollution of a river by wastewater", "ex": "Ngăn nước thải (sewage = wastewater) tràn ra sông → chống ô nhiễm sông. (B) bẫy: \"sewage highway\" chỉ là cách gọi đường cống lớn."}, {"n": 173, "q": "What is suggested by Ms. Majors?", "qvi": "Có thể suy ra gì từ lời bà Majors?", "opts": [{"t": "She often works on oceanfront structures.", "vi": "Bà hay làm công trình ven biển."}, {"t": "She was promoted due to her contributions to Clearway's construction.", "vi": "Bà được thăng chức nhờ dự án Clearway."}, {"t": "The Lundgate Shore is the largest project she has overseen.", "vi": "Đây là dự án lớn nhất bà phụ trách."}, {"t": "She based a decision about the Lundgate Shore on past experiences.", "vi": "Bà dựa vào kinh nghiệm cũ để ra quyết định."}], "ans": ["D"], "key": "had successfully used tidewater in other projects → past experiences", "ex": "Bà nói đã từng dùng thủy triều thành công ở dự án khác → quyết định dùng thủy triều lần này dựa trên kinh nghiệm cũ."}, {"n": 174, "q": "What is indicated about Perriot, LLC?", "qvi": "Điều gì được nói về Perriott, LLC?", "opts": [{"t": "It is owned by Bauright Group.", "vi": "Thuộc sở hữu của Bauright."}, {"t": "It will create a public leisure area.", "vi": "Sẽ làm khu vui chơi công cộng."}, {"t": "It is running behind schedule.", "vi": "Đang chậm tiến độ."}, {"t": "It submitted a bid to carry out Phase 1.", "vi": "Đã đấu thầu giai đoạn 1."}], "ans": ["B"], "key": "walking path, benches, greenery to the public land → public leisure area", "ex": "Perriott làm đường đi bộ, ghế, cây xanh trên đất công cộng → khu thư giãn công cộng (public leisure area)."}, {"n": 175, "q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Phase 1 finished on time and within budget.\"", "qvi": "Câu \"Giai đoạn 1 xong đúng hạn và trong ngân sách\" hợp ở vị trí nào?", "opts": [{"t": "[1]", "vi": "[1]"}, {"t": "[2]", "vi": "[2]"}, {"t": "[3]", "vi": "[3]"}, {"t": "[4]", "vi": "[4]"}], "ans": ["A"], "key": "câu sau [1]: \"The smooth completion…\"", "ex": "Sau [1] là \"Việc hoàn thành suôn sẻ (smooth completion) giai đoạn này thật đáng chú ý\" → câu cần điền (xong đúng hạn, trong ngân sách) đứng ngay trước, ở [1]."}]}, {"title": "Câu 176–180 · Tờ giới thiệu + E-mail", "tag": "2 văn bản", "imgs": ["img/amk6/p11.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(176) Make a great outdoor space your family can enjoy or **update the appearance** of your commercial site.", "vi": "Tạo không gian ngoài trời cho gia đình hoặc làm mới diện mạo khu kinh doanh của bạn."}, {"sp": "", "t": "(177) All of our staff members must pass a rigorous **safety course**… regular visits throughout the **entire year**… No garden is **too big or too small** for us.", "vi": "Mọi nhân viên phải qua khóa an toàn nghiêm ngặt… đến định kỳ quanh năm… Không khu vườn nào quá lớn hay quá nhỏ với chúng tôi."}, {"sp": "", "t": "(178) RENTAL: we allow customers to rent our garden equipment **without having one of our employees hired to use it**.", "vi": "CHO THUÊ: khách được thuê dụng cụ làm vườn mà không cần thuê thêm nhân viên của chúng tôi để vận hành."}, {"sp": "", "t": "(179) RESET: Book a **one-time visit** to tackle a neglected garden. — E-mail: It hasn't had any care in several years, so I'd like to have your crew **visit once**.", "vi": "RESET: đặt một lần đến để xử lý khu vườn bị bỏ bê. — E-mail: Vườn mấy năm nay không ai chăm, nên tôi muốn đội của anh đến một lần."}, {"sp": "", "t": "(180) Alex Brooks, used your services at his home and **recommended you highly**.", "vi": "Alex Brooks đã dùng dịch vụ của anh ở nhà mình và hết lời giới thiệu."}], "qs": [{"n": 176, "q": "In the brochure, the word \"update\" in paragraph 1, line 2, is closest in meaning to", "qvi": "Từ \"update\" gần nghĩa nhất với", "opts": [{"t": "modernize", "vi": "làm mới, hiện đại hóa"}, {"t": "inform", "vi": "thông báo"}, {"t": "highlight", "vi": "làm nổi bật"}, {"t": "invest", "vi": "đầu tư"}], "ans": ["A"], "key": "update the appearance = modernize", "ex": "\"update the appearance\" = làm mới diện mạo → modernize. (B) inform là nghĩa \"cập nhật thông tin cho ai\", không hợp với appearance."}, {"n": 177, "q": "What is NOT indicated about Alpha Landscaping Services?", "qvi": "Điều gì KHÔNG được nói về Alpha Landscaping?", "opts": [{"t": "It operates year-round.", "vi": "Làm việc quanh năm."}, {"t": "It works on gardens of any size.", "vi": "Nhận vườn mọi kích cỡ."}, {"t": "It is committed to safety.", "vi": "Coi trọng an toàn."}, {"t": "It is a family-owned business.", "vi": "Là doanh nghiệp gia đình."}], "ans": ["D"], "key": "NOT: family-owned không có", "ex": "Có: quanh năm (entire year), vườn to nhỏ đều nhận, khóa an toàn nghiêm ngặt. Bài có chữ \"family\" (gia đình bạn tận hưởng) nhưng không nói công ty do gia đình sở hữu → (D)."}, {"n": 178, "q": "According to the brochure, what is unique about the equipment in the Rental service?", "qvi": "Điều gì đặc biệt ở dụng cụ của dịch vụ Rental?", "opts": [{"t": "It can be delivered for no additional fee.", "vi": "Giao miễn phí."}, {"t": "It does not require a company employee to use it.", "vi": "Không cần nhân viên công ty đi kèm để dùng."}, {"t": "It is discounted for longer rental periods.", "vi": "Thuê lâu được giảm giá."}, {"t": "It includes a training session on how to operate it.", "vi": "Có buổi hướng dẫn sử dụng."}], "ans": ["B"], "key": "Unlike other businesses … without having one of our employees hired", "ex": "\"Unlike other businesses\" (khác các nơi khác) = điểm đặc biệt: không cần thuê nhân viên đi kèm. (D) bẫy: chỉ có sách hướng dẫn (user manual), không có buổi học."}, {"n": 179, "q": "What service will Ms. Roth probably use?", "qvi": "Cô Roth có lẽ sẽ dùng dịch vụ nào?", "opts": [{"t": "Maintenance", "vi": "Bảo dưỡng"}, {"t": "Reset", "vi": "Reset (làm lại vườn)"}, {"t": "Design", "vi": "Thiết kế"}, {"t": "Rental", "vi": "Cho thuê"}], "ans": ["B"], "key": "visit once + neglected garden → Reset", "ex": "Ghép 2 văn bản: cô muốn đội đến MỘT lần để dọn khu vườn lâu không chăm → dịch vụ Reset (one-time visit, neglected garden). Cô đã có dụng cụ nên không cần Rental."}, {"n": 180, "q": "What is suggested about Mr. Brooks?", "qvi": "Có thể suy ra gì về anh Brooks?", "opts": [{"t": "He currently lives in the Longmont neighborhood.", "vi": "Đang sống ở khu Longmont."}, {"t": "He is the former owner of Ms. Roth's property.", "vi": "Là chủ cũ căn nhà của cô Roth."}, {"t": "He is satisfied with Alpha Landscaping Services' work.", "vi": "Hài lòng với dịch vụ của Alpha."}, {"t": "He used to work as a professional gardener.", "vi": "Từng làm thợ làm vườn."}], "ans": ["C"], "key": "recommended you highly → satisfied", "ex": "Anh đã dùng dịch vụ và \"recommended you highly\" → anh hài lòng."}]}, {"title": "Câu 181–185 · Bài báo + Thư gửi tòa soạn", "tag": "2 văn bản", "imgs": ["img/amk6/p12.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(181) Background music or nature sounds should be played **at a low volume**… Restrict posters with medical information… Use shades of blue or green to create a **calming** atmosphere… Taller chairs are easy to get in and out of.", "vi": "Nhạc nền hoặc âm thanh thiên nhiên nên mở nhỏ… Hạn chế áp phích thông tin y tế… Dùng tông xanh dương hoặc xanh lá để tạo không khí dịu nhẹ… Ghế cao dễ ngồi xuống và đứng lên."}, {"sp": "", "t": "(182) Use modular seating that can be moved…, as some people may visit **alone**… while others may come **with family members**.", "vi": "Dùng ghế ghép di chuyển được…, vì có người đến một mình… có người đi cùng gia đình."}, {"sp": "", "t": "(183) Valued readers… **What would you like to learn about in future issues?**", "vi": "Độc giả thân mến… Các bạn muốn tìm hiểu về chủ đề gì trong các số sau?"}, {"sp": "", "t": "(184) I would like to offer a correction to some information you provided about creating calming waiting rooms… (185) vinyl… can be **wiped down quickly and easily** to remove dirt and germs. …furniture made by my company, Free-Form Inc., uses vinyl.", "vi": "Tôi muốn đính chính thông tin quý báo đưa về phòng chờ dễ chịu… vinyl… lau sạch nhanh và dễ để loại bụi bẩn, vi trùng. …nội thất của công ty tôi, Free-Form, dùng vinyl."}], "qs": [{"n": 181, "q": "What is NOT a suggestion made in the article?", "qvi": "Điều gì KHÔNG phải gợi ý trong bài báo?", "opts": [{"t": "Keeping audio levels low", "vi": "Để âm lượng nhỏ"}, {"t": "Improving mobility through chairs with wheels", "vi": "Dùng ghế có bánh xe để dễ di chuyển"}, {"t": "Minimizing the use of medical posters", "vi": "Hạn chế áp phích y tế"}, {"t": "Including colors that have a relaxing effect", "vi": "Dùng màu giúp thư giãn"}], "ans": ["B"], "key": "NOT: chairs with wheels không có", "ex": "Có: âm lượng nhỏ (A), hạn chế áp phích (C), màu xanh dịu (D). Bài nói ghế CAO giúp người khó đi lại, không nói ghế có bánh xe → (B)."}, {"n": 182, "q": "Why is movable furniture mentioned?", "qvi": "Vì sao nhắc đến ghế di chuyển được?", "opts": [{"t": "Because more empty floor space may be needed on some days", "vi": "Vì có hôm cần nhiều chỗ trống"}, {"t": "Because the floor under the furniture should be cleaned daily", "vi": "Vì phải lau sàn dưới ghế hằng ngày"}, {"t": "Because changing the layout periodically gives a fresh appearance", "vi": "Vì đổi bố cục tạo cảm giác mới"}, {"t": "Because visitors may be in groups of different sizes", "vi": "Vì khách đến theo nhóm to nhỏ khác nhau"}], "ans": ["D"], "key": "alone … with family members → groups of different sizes", "ex": "Có người đến một mình, có người đi cùng gia đình → nhóm khách có số người khác nhau."}, {"n": 183, "q": "What is indicated about Medical World Magazine?", "qvi": "Điều gì được nói về tạp chí Medical World?", "opts": [{"t": "It is provided to hospitals at no charge.", "vi": "Phát miễn phí cho bệnh viện."}, {"t": "Its editors want topic suggestions from readers.", "vi": "Biên tập viên muốn độc giả gợi ý chủ đề."}, {"t": "It sells some of the products mentioned in its publications.", "vi": "Bán sản phẩm được nhắc trong bài."}, {"t": "Its owner is seeking new freelance writers.", "vi": "Chủ tạp chí đang tìm cây bút tự do."}], "ans": ["B"], "key": "What would you like to learn about in future issues?", "ex": "Cuối bài hỏi độc giả muốn đọc về gì trong các số sau → muốn độc giả gợi ý chủ đề."}, {"n": 184, "q": "What is most likely true about Mr. McAlister?", "qvi": "Điều gì có lẽ đúng về ông McAlister?", "opts": [{"t": "He previously worked at a medical clinic.", "vi": "Từng làm ở phòng khám."}, {"t": "He read the July edition of Medical World Magazine.", "vi": "Đã đọc số tháng 7 của Medical World."}, {"t": "He invented a new kind of textile.", "vi": "Phát minh loại vải mới."}, {"t": "He spends a lot of time in waiting rooms.", "vi": "Hay ngồi phòng chờ."}], "ans": ["B"], "key": "offer a correction to information you provided → read the July issue", "ex": "Ghép 2 văn bản: ông viết thư đính chính bài về phòng chờ, mà bài đó ở số July Issue → ông đã đọc số tháng 7."}, {"n": 185, "q": "What is suggested about products from Free-Form Inc.?", "qvi": "Có thể suy ra gì về sản phẩm của Free-Form?", "opts": [{"t": "They can be delivered quickly.", "vi": "Giao nhanh."}, {"t": "They are made from recycled materials.", "vi": "Làm từ vật liệu tái chế."}, {"t": "They come with a ten-year warranty.", "vi": "Bảo hành 10 năm."}, {"t": "They are easy to clean.", "vi": "Dễ lau chùi."}], "ans": ["D"], "key": "vinyl can be wiped down quickly and easily → easy to clean", "ex": "Sản phẩm dùng vinyl, lau nhanh và dễ → dễ làm sạch. (C) bẫy: \"lasting over ten years\" là độ bền, không phải bảo hành."}]}, {"title": "Câu 186–190 · 2 E-mail + Bài báo", "tag": "3 văn bản", "imgs": ["img/amk6/p13.webp", "img/amk6/p14.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "E-mail 1 (Emery): I am looking for a new location for my luggage store… on-site parking for customers would be a bonus. **The maximum I prefer to spend on rent per month is $5,500.** (187) I would like to have the business open at the new location **by November 20**, as that would allow our store to participate in **the launch of Mizara's new Eco-Max luggage line**.", "vi": "E-mail 1: Tôi đang tìm địa điểm mới cho cửa hàng vali… có bãi đỗ xe cho khách thì càng tốt. Tiền thuê tối đa tôi muốn trả là 5.500 đô/tháng. Tôi muốn mở cửa ở chỗ mới trước 20/11 để kịp tham gia đợt ra mắt dòng vali Eco-Max của Mizara."}, {"sp": "", "t": "(186) E-mail 2 (Willis): I have done some research on **retail units**… let me know if there are any that you would like to visit. 2. 908 Braxton Avenue, $5,000. (188) Notes: The building owner **requires the rental of the adjoining parking lot** in a separate lease at $450 per month.", "vi": "E-mail 2: Tôi đã tìm hiểu các mặt bằng bán lẻ… anh muốn đi xem chỗ nào thì báo tôi. 2. 908 Braxton, 5.000 đô. Ghi chú: chủ nhà bắt buộc thuê kèm bãi đỗ xe bên cạnh theo hợp đồng riêng, 450 đô/tháng."}, {"sp": "", "t": "Article (November 10): Wonder Luggage… held its grand re-opening yesterday… at **908 Braxton Avenue**. (189) the store will continue to sell high-quality luggage that can **endure rough handling**. (190) the new location has **large windows, so it isn't as dark** as the mall unit.", "vi": "Bài báo (10/11): Wonder Luggage… khai trương lại hôm qua… ở 908 Braxton. Cửa hàng tiếp tục bán vali chất lượng chịu được va đập mạnh. Chỗ mới có cửa sổ lớn nên không tối như ở trung tâm thương mại."}], "qs": [{"n": 186, "q": "Where most likely does Ms. Willis work?", "qvi": "Cô Willis có lẽ làm ở đâu?", "opts": [{"t": "At a luggage store", "vi": "Cửa hàng vali"}, {"t": "At a manufacturing facility", "vi": "Nhà máy"}, {"t": "At a financial institution", "vi": "Tổ chức tài chính"}, {"t": "At a real estate firm", "vi": "Công ty bất động sản"}], "ans": ["D"], "key": "research on retail units, visit in person → real estate", "ex": "Cô tìm mặt bằng cho thuê, gửi danh sách địa chỉ, giá thuê, mời đi xem → nhân viên bất động sản."}, {"n": 187, "q": "What is indicated about Wonder Luggage?", "qvi": "Điều gì được nói về Wonder Luggage?", "opts": [{"t": "It pays a monthly rental fee of six thousand dollars.", "vi": "Trả tiền thuê 6.000 đô/tháng."}, {"t": "It has a one-year lease at its new site.", "vi": "Có hợp đồng thuê một năm ở chỗ mới."}, {"t": "It is the largest luggage store in the area.", "vi": "Là cửa hàng vali lớn nhất vùng."}, {"t": "It reopened in time for a product launch.", "vi": "Mở lại kịp đợt ra mắt sản phẩm."}], "ans": ["D"], "key": "open by Nov 20 for the launch + reopened Nov 9 → in time", "ex": "Ghép 2 văn bản: anh Emery muốn mở trước 20/11 để kịp đợt ra mắt Eco-Max. Bài báo ngày 10/11 nói cửa hàng khai trương lại \"hôm qua\" (9/11) → kịp. (A) sai: 908 Braxton giá 5.000 đô."}, {"n": 188, "q": "What is suggested about Mr. Emery?", "qvi": "Có thể suy ra gì về anh Emery?", "opts": [{"t": "He is also renting a parking area.", "vi": "Anh cũng thuê một bãi đỗ xe."}, {"t": "He plans to open another branch.", "vi": "Anh định mở chi nhánh khác."}, {"t": "He did not renovate a display area.", "vi": "Anh không sửa khu trưng bày."}, {"t": "He is benefitting from heavy foot traffic.", "vi": "Anh hưởng lợi nhờ đông người qua lại."}], "ans": ["A"], "key": "908 Braxton → bắt buộc thuê bãi đỗ xe", "ex": "Ghép 2 văn bản: cửa hàng chuyển đến 908 Braxton (bài báo), và chỗ này chủ nhà bắt buộc thuê kèm bãi đỗ xe (e-mail 2) → anh cũng thuê bãi đỗ xe. (D) bẫy: đông người qua lại là ở 446 Cabell."}, {"n": 189, "q": "In the article, the word \"endure\" in paragraph 2, line 5, is closest in meaning to", "qvi": "Từ \"endure\" gần nghĩa nhất với", "opts": [{"t": "withstand", "vi": "chịu được"}, {"t": "meet", "vi": "gặp"}, {"t": "permit", "vi": "cho phép"}, {"t": "continue", "vi": "tiếp tục"}], "ans": ["A"], "key": "endure rough handling = withstand", "ex": "Vali \"endure rough handling\" = chịu được va đập mạnh → withstand."}, {"n": 190, "q": "How is the new store different from the old store?", "qvi": "Cửa hàng mới khác cửa hàng cũ thế nào?", "opts": [{"t": "It has a more convenient location.", "vi": "Vị trí thuận tiện hơn."}, {"t": "It has a brighter interior.", "vi": "Bên trong sáng hơn."}, {"t": "It has longer opening hours.", "vi": "Mở cửa lâu hơn."}, {"t": "It has a larger display space.", "vi": "Khu trưng bày rộng hơn."}], "ans": ["B"], "key": "large windows, not as dark → brighter interior", "ex": "\"large windows, so it isn't as dark as the mall unit\" → sáng hơn. Bài báo không so sánh vị trí, giờ mở cửa hay khu trưng bày."}]}, {"title": "Câu 191–195 · Thông báo + Trang web + Hóa đơn", "tag": "3 văn bản", "imgs": ["img/amk6/p15.webp", "img/amk6/p16.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(191) Flight follows the migration of **Canadian geese**… Pushed Out explores… the habitats of **wolves**… (192) he made this film to emphasize how **tough** it is for these creatures to adapt… Two Little Cubs centers on a **polar bear**.", "vi": "Phim Flight theo chân cuộc di cư của ngỗng Canada… Pushed Out tìm hiểu… môi trường sống của chó sói… ông làm phim để nhấn mạnh việc thích nghi khó khăn thế nào với các loài này… Two Little Cubs kể về một con gấu Bắc Cực."}, {"sp": "", "t": "(194) Admission includes a four-course dinner followed by **entertainment featuring Josefina Adams**. — Web page: the event… includes **an after-dinner performance from a live band**.", "vi": "Vé gồm bữa tối 4 món và chương trình biểu diễn của Josefina Adams. — Trang web: sự kiện… có tiết mục biểu diễn của ban nhạc sống sau bữa tối."}, {"sp": "", "t": "(193) Attendees… who **stay for two nights or more** can get 30% off… (195) extended checkout time of noon for an additional $8.99. This fee is **waived for members of the Irving Rewards Program**.", "vi": "Khách dự sự kiện ở từ hai đêm trở lên được giảm 30%… trả phòng muộn đến 12 giờ trưa thêm 8,99 đô. Phí này được miễn cho hội viên chương trình Irving Rewards."}, {"sp": "", "t": "(195) Receipt: Check-out: 22 July, **11:55 a.m.** — Extended checkout: **$0.00**", "vi": "Hóa đơn: Trả phòng 22/7 lúc 11:55 sáng — Phí trả phòng muộn: 0 đô."}], "qs": [{"n": 191, "q": "What do all of Mr. Chadda's listed films have in common?", "qvi": "Các phim của ông Chadda có điểm chung gì?", "opts": [{"t": "They were filmed only in Canada.", "vi": "Chỉ quay ở Canada."}, {"t": "They have a wildlife theme.", "vi": "Có chủ đề động vật hoang dã."}, {"t": "They received funding from the FCA.", "vi": "Được FCA tài trợ."}, {"t": "They feature interviews with professors.", "vi": "Có phỏng vấn giáo sư."}], "ans": ["B"], "key": "geese, wolves, polar bear → wildlife", "ex": "Ngỗng, chó sói, gấu Bắc Cực → đều về động vật hoang dã. (A) sai: Flight quay tới tận New Mexico (Mỹ). (D) chỉ một phim có phỏng vấn giáo sư."}, {"n": 192, "q": "In the announcement, the word \"tough\" in paragraph 2, line 6, is closest in meaning to", "qvi": "Từ \"tough\" gần nghĩa nhất với", "opts": [{"t": "powerful", "vi": "mạnh mẽ"}, {"t": "stern", "vi": "nghiêm khắc"}, {"t": "challenging", "vi": "khó khăn"}, {"t": "determined", "vi": "quyết tâm"}], "ans": ["C"], "key": "how tough it is to adapt = how challenging", "ex": "\"how tough it is… to adapt\" = việc thích nghi khó khăn thế nào → challenging."}, {"n": 193, "q": "What is indicated about customers receiving Irving Hotel's special rate?", "qvi": "Điều gì được nói về khách hưởng giá đặc biệt?", "opts": [{"t": "They will be offered a free breakfast.", "vi": "Được ăn sáng miễn phí."}, {"t": "They must check in on July 16.", "vi": "Phải nhận phòng ngày 16/7."}, {"t": "They will occupy rooms on a certain floor.", "vi": "Ở phòng tầng nhất định."}, {"t": "They must stay for a minimum of two nights.", "vi": "Phải ở ít nhất hai đêm."}], "ans": ["D"], "key": "stay for two nights or more", "ex": "\"stay for two nights or more can get 30% off\" → phải ở tối thiểu 2 đêm. (A) bẫy: bữa sáng miễn phí dành cho người đăng ký bản tin FCA."}, {"n": 194, "q": "Who most likely is Josefina Adams?", "qvi": "Josefina Adams có lẽ là ai?", "opts": [{"t": "An event planner", "vi": "Người tổ chức sự kiện"}, {"t": "A comedian", "vi": "Diễn viên hài"}, {"t": "A musician", "vi": "Nhạc sĩ, ca sĩ"}, {"t": "The FCA President", "vi": "Chủ tịch FCA"}], "ans": ["C"], "key": "entertainment featuring Josefina Adams + live band → musician", "ex": "Ghép 2 văn bản: thông báo nói sau bữa tối có tiết mục của Josefina Adams; trang web nói sau bữa tối có ban nhạc sống biểu diễn → cô là nhạc sĩ/ca sĩ."}, {"n": 195, "q": "What is suggested about Mr. Frazer?", "qvi": "Có thể suy ra gì về anh Frazer?", "opts": [{"t": "He is a member of a rewards program.", "vi": "Anh là hội viên chương trình khách hàng thân thiết."}, {"t": "He signed up for a newsletter.", "vi": "Anh đăng ký nhận bản tin."}, {"t": "He received a free room upgrade.", "vi": "Anh được nâng hạng phòng miễn phí."}, {"t": "He attended the event last year.", "vi": "Năm ngoái anh dự sự kiện."}], "ans": ["A"], "key": "checked out 11:55 (sau 11h) + extended checkout $0 → rewards member", "ex": "Ghép 2 văn bản: giờ trả phòng chuẩn là 11h, anh trả lúc 11:55 (trả muộn) nhưng phí trả muộn 0 đô. Phí này chỉ được miễn cho hội viên Irving Rewards → anh là hội viên."}]}, {"title": "Câu 196–200 · Trang web + E-mail + Phiếu khảo sát", "tag": "3 văn bản", "imgs": ["img/amk6/p17.webp", "img/amk6/p18.webp"], "scriptLabel": "📜 Câu then chốt + dịch", "script": [{"sp": "", "t": "(196) Registration for **BBB members opens on March 3** and for the **general public on March 10**.", "vi": "Hội viên BBB đăng ký từ 3/3, người ngoài đăng ký từ 10/3."}, {"sp": "", "t": "Web page: We'll also have workshops by Claire Ladner, Isaac Tineo, and Mei Han. Those will be followed by **the last session**, in which you'll learn about conflict resolution through **role-playing**.", "vi": "Trang web: Còn có các buổi của Claire Ladner, Isaac Tineo và Mei Han. Sau đó là buổi cuối, học giải quyết mâu thuẫn qua đóng vai."}, {"sp": "", "t": "(197) E-mail: Dear Mr. Tineo… **I've attached a survey response for your reference.** Many other students had similar remarks about **your session on how to manage work-related stress**. (198) As young professionals **make up the majority** of our participants…", "vi": "E-mail: Gửi anh Tineo… Tôi gửi kèm một phiếu khảo sát để anh tham khảo. Nhiều học viên khác cũng nhận xét tương tự về buổi học của anh về cách kiểm soát căng thẳng trong công việc. Vì người trẻ đi làm chiếm phần lớn học viên…"}, {"sp": "", "t": "Survey: (199) I had to **miss the last session** due to being called away on an urgent work matter. (200) I thought **the workshop on managing stress related to work was the most helpful** one.", "vi": "Phiếu khảo sát: Tôi phải bỏ buổi cuối vì có việc gấp ở công ty. Tôi thấy buổi về kiểm soát căng thẳng trong công việc là hữu ích nhất."}], "qs": [{"n": 196, "q": "What is indicated about the workshop series?", "qvi": "Điều gì được nói về chuỗi hội thảo?", "opts": [{"t": "Some people can register earlier than others.", "vi": "Một số người được đăng ký sớm hơn."}, {"t": "BBB members are eligible for a discount.", "vi": "Hội viên BBB được giảm giá."}, {"t": "It will take place over several days.", "vi": "Diễn ra trong nhiều ngày."}, {"t": "Its fee includes the cost of two meals.", "vi": "Phí gồm hai bữa ăn."}], "ans": ["A"], "key": "members March 3, public March 10", "ex": "Hội viên đăng ký từ 3/3, người ngoài từ 10/3 → có người đăng ký sớm hơn. (C) sai: \"a full day\" (một ngày). (D) chỉ có bữa trưa."}, {"n": 197, "q": "Why did Ms. Mendoza send the e-mail?", "qvi": "Vì sao cô Mendoza gửi e-mail?", "opts": [{"t": "To ask for a survey to be completed", "vi": "Nhờ điền phiếu khảo sát"}, {"t": "To provide an instructor with feedback", "vi": "Gửi phản hồi cho giảng viên"}, {"t": "To confirm the date of the next session", "vi": "Xác nhận ngày buổi học tới"}, {"t": "To suggest a new topic for instruction", "vi": "Gợi ý chủ đề mới"}], "ans": ["B"], "key": "attached a survey response for your reference → provide feedback", "ex": "Cô gửi anh Tineo (giảng viên) phiếu khảo sát của học viên và nhận xét của mọi người → gửi phản hồi. (A) bẫy: phiếu đã được điền rồi."}, {"n": 198, "q": "In the e-mail, the phrase \"make up\" in paragraph 1, line 4, is closest in meaning to", "qvi": "Cụm \"make up\" gần nghĩa nhất với", "opts": [{"t": "fill", "vi": "lấp đầy"}, {"t": "prepare", "vi": "chuẩn bị"}, {"t": "invent", "vi": "bịa ra"}, {"t": "comprise", "vi": "chiếm, tạo thành"}], "ans": ["D"], "key": "make up the majority = comprise the majority", "ex": "\"young professionals make up the majority of our participants\" = người trẻ chiếm phần lớn học viên → comprise."}, {"n": 199, "q": "What is suggested about Mr. Roland?", "qvi": "Có thể suy ra gì về anh Roland (người điền phiếu)?", "opts": [{"t": "He thought some noise was distracting.", "vi": "Anh thấy tiếng ồn gây mất tập trung."}, {"t": "He has recommended the workshops to others.", "vi": "Anh đã giới thiệu hội thảo cho người khác."}, {"t": "He did not participate in a role-play activity.", "vi": "Anh không tham gia hoạt động đóng vai."}, {"t": "He gave the handouts the top rating.", "vi": "Anh chấm tài liệu điểm cao nhất."}], "ans": ["C"], "key": "missed the last session + last session = role-playing", "ex": "Ghép 2 văn bản: anh bỏ lỡ buổi cuối (phiếu khảo sát), mà buổi cuối là học qua đóng vai (trang web) → anh không tham gia đóng vai. (A) bẫy: anh phàn nàn phòng NÓNG, không phải ồn."}, {"n": 200, "q": "Which instructor's session did Mr. Roland find most helpful?", "qvi": "Anh Roland thấy buổi của giảng viên nào hữu ích nhất?", "opts": [{"t": "Hubert Wong", "vi": "Hubert Wong"}, {"t": "Claire Ladner", "vi": "Claire Ladner"}, {"t": "Isaac Tineo", "vi": "Isaac Tineo"}, {"t": "Mei Han", "vi": "Mei Han"}], "ans": ["C"], "key": "managing stress = buổi của Mr. Tineo (e-mail)", "ex": "Ghép 2 văn bản: phiếu nói buổi về kiểm soát căng thẳng hữu ích nhất; e-mail gửi anh Tineo nói \"your session on how to manage work-related stress\" → Isaac Tineo."}]}], "recap": "<h2>Ghi nhớ sau bài<\/h2><p><b>Câu ghép 2–3 văn bản:<\/b> 179 (visit once → Reset), 184, 187 (mở trước 20/11 kịp ra mắt), 188 (908 Braxton → phải thuê bãi xe), 194 (Josefina → live band), 195 (trả phòng 11:55 nhưng phí 0 đô → hội viên), 199, 200.<\/p><p><b>Câu NOT:<\/b> 160, 166, 177, 181: tìm 3 ý có trong bài rồi loại.<\/p><p><b>Từ đồng nghĩa:<\/b> update = modernize, endure = withstand, tough = challenging, make up = comprise.<\/p><p><b>Câu ý định trong tin nhắn:<\/b> 154 (\"That's true\" đồng ý câu ngay trước), 169 (\"I'll look into that\" = sẽ tìm số điện thoại).<\/p>", "exam": "TOEIC-A-MOCK6", "examSrc": "/toeica-mocktest/"};</script>
