<script>window.MT={"n": "a3", "part": 5, "partName": "Part 5, 6", "sub": "Incomplete Sentences & Text Completion · 46 câu (101–146)", "intro": "Trang này chữa <b>Mock Test 3 (Part 5, 6)<\/b> của lớp TOEIC A. Chọn đáp án → xem đúng/sai, dịch câu và giải thích. Mỗi câu có nhãn chủ điểm ngữ pháp để bạn biết mình hay sai phần nào.", "stepsTitle": "Cách làm Part 5, 6: nhìn đáp án trước", "steps": ["<b>Nhìn 4 đáp án trước khi đọc câu.<\/b> Cùng gốc khác đuôi (<i>strict / strictly<\/i>) → câu hỏi <b>từ loại<\/b>: xét vị trí chỗ trống. Cùng động từ khác thì (<i>hosts / hosted / will host<\/i>) → tìm <b>dấu hiệu thời gian<\/b>. Khác nghĩa hoàn toàn → câu <b>từ vựng<\/b>: đọc cả câu.", "<b>Vị trí → từ loại:<\/b> trước danh từ là tính từ; sau a/the/his/its là danh từ; bổ nghĩa động từ, tính từ (be ___ accessible, ___ enforced) là trạng từ; sau to là động từ nguyên mẫu.", "<b>Liên từ hay giới từ?<\/b> Sau chỗ trống là cụm danh từ → giới từ (during, within, in addition to). Sau chỗ trống là mệnh đề S + V → liên từ (when, because).", "<b>Part 6 điền câu:<\/b> đọc câu ngay <b>trước<\/b> và ngay <b>sau<\/b> chỗ trống, chọn câu nối ý tự nhiên, có từ nối hoặc đại từ (this, they) chỉ về ý phía trước."], "groups": [{"title": "Câu 101", "tag": "To V chỉ mục đích", "qs": [{"n": 101, "q": "Aberdeen Bank offers a range of financial services ___ the needs of its customers.", "qvi": "Ngân hàng Aberdeen cung cấp nhiều dịch vụ tài chính để đáp ứng nhu cầu của khách hàng.", "opts": [{"t": "meet", "vi": "đáp ứng (V nguyên mẫu)"}, {"t": "to meet", "vi": "để đáp ứng"}, {"t": "is meeting", "vi": "đang đáp ứng"}, {"t": "meetings", "vi": "các cuộc họp"}], "ans": ["B"], "key": "Câu đã có động từ offers → chỗ trống dùng to V (để làm gì)", "ex": "Câu đã có động từ chính <b>offers<\/b>, không thể thêm động từ chia nữa (loại meet, is meeting). Cần <b>to V<\/b> chỉ mục đích: offers services <b>to meet<\/b> the needs (để đáp ứng nhu cầu). meetings là danh từ, sai nghĩa."}]}, {"title": "Câu 102", "tag": "Từ chỉ số lượng", "qs": [{"n": 102, "q": "___ Staff are asked to provide a backup cell phone number and e-mail address.", "qvi": "Tất cả nhân viên được yêu cầu cung cấp một số điện thoại và địa chỉ e-mail dự phòng.", "opts": [{"t": "Every", "vi": "mỗi (+ N số ít)"}, {"t": "All", "vi": "tất cả (+ N số nhiều)"}, {"t": "Each", "vi": "mỗi (+ N số ít)"}, {"t": "Any", "vi": "bất kỳ"}], "ans": ["B"], "key": "Staff + are (số nhiều) → All", "ex": "Động từ là <b>are<\/b> (số nhiều) → cần <b>All<\/b> + danh từ số nhiều. Every, Each đi với danh từ số ít và động từ số ít (Every staff member is…). Any thường dùng trong câu phủ định/câu hỏi."}]}, {"title": "Câu 103", "tag": "Tính từ sở hữu", "qs": [{"n": 103, "q": "Today, Mr. Rahn will present ___ ideas to improve the company's accounting software.", "qvi": "Hôm nay ông Rahn sẽ trình bày ý tưởng của mình để cải thiện phần mềm kế toán của công ty.", "opts": [{"t": "he", "vi": "anh ấy (chủ ngữ)"}, {"t": "him", "vi": "anh ấy (tân ngữ)"}, {"t": "his", "vi": "của anh ấy"}, {"t": "himself", "vi": "chính anh ấy"}], "ans": ["C"], "key": "Trước danh từ ideas → tính từ sở hữu his", "ex": "Sau chỗ trống là danh từ <b>ideas<\/b> → cần tính từ sở hữu <b>his<\/b> (ý tưởng của ông ấy). he là chủ ngữ, him là tân ngữ, himself là phản thân."}]}, {"title": "Câu 104", "tag": "Từ vựng · trạng từ", "qs": [{"n": 104, "q": "The firm's one-hour lunch policy is ___ enforced, so do not return late.", "qvi": "Quy định nghỉ trưa một tiếng của công ty được áp dụng nghiêm ngặt, nên đừng quay lại muộn.", "opts": [{"t": "strictly", "vi": "nghiêm ngặt"}, {"t": "hungrily", "vi": "một cách đói bụng"}, {"t": "punctually", "vi": "đúng giờ"}, {"t": "bravely", "vi": "dũng cảm"}], "ans": ["A"], "key": "strictly enforced = được áp dụng nghiêm ngặt", "ex": "4 đáp án đều là trạng từ → chọn theo nghĩa. Quy định \"được áp dụng <b>nghiêm ngặt<\/b>\" nên đừng về muộn → strictly. Cụm hay gặp: strictly enforced / strictly prohibited."}]}, {"title": "Câu 105", "tag": "Giới từ đi kèm", "qs": [{"n": 105, "q": "Ms. Martinova's promotion to chief financial officer is contingent ___ approval by our board of executives.", "qvi": "Việc thăng chức giám đốc tài chính của cô Martinova phụ thuộc vào sự chấp thuận của ban điều hành.", "opts": [{"t": "within", "vi": "trong vòng"}, {"t": "on", "vi": "vào, dựa vào"}, {"t": "around", "vi": "xung quanh"}, {"t": "beside", "vi": "bên cạnh"}], "ans": ["B"], "key": "be contingent on = phụ thuộc vào", "ex": "Cụm cố định: <b>contingent on/upon<\/b> = phụ thuộc vào (giống depend on). Các giới từ khác không đi với contingent."}]}, {"title": "Câu 106", "tag": "Trạng từ bổ nghĩa tính từ", "qs": [{"n": 106, "q": "The peninsula's southernmost portion is rarely visited because it is not ___ accessible to travelers.", "qvi": "Phần cực nam của bán đảo hiếm khi có người đến vì du khách không dễ dàng tiếp cận.", "opts": [{"t": "easy", "vi": "dễ (tính từ)"}, {"t": "easily", "vi": "một cách dễ dàng"}, {"t": "easier", "vi": "dễ hơn"}, {"t": "easiest", "vi": "dễ nhất"}], "ans": ["B"], "key": "not ___ accessible → trạng từ bổ nghĩa tính từ", "ex": "Chỗ trống đứng trước tính từ <b>accessible<\/b> → cần <b>trạng từ<\/b> bổ nghĩa cho tính từ: easily accessible (dễ dàng tiếp cận)."}]}, {"title": "Câu 107", "tag": "Từ vựng · động từ", "qs": [{"n": 107, "q": "The Vaknis Group ___ all clients a flat consultation fee, to be paid in advance.", "qvi": "Tập đoàn Vaknis tính cho mọi khách hàng một mức phí tư vấn cố định, trả trước.", "opts": [{"t": "informs", "vi": "thông báo"}, {"t": "considers", "vi": "xem xét"}, {"t": "charges", "vi": "tính phí"}, {"t": "suggests", "vi": "gợi ý"}], "ans": ["C"], "key": "charge sb a fee = tính phí ai", "ex": "Cấu trúc <b>charge + người + số tiền/phí<\/b> = tính phí. informs, considers, suggests không đi với \"khách hàng + phí\"."}]}, {"title": "Câu 108", "tag": "Liên từ", "qs": [{"n": 108, "q": "On August 19, employees will not be able to access their e-mail account ___ time sheet.", "qvi": "Ngày 19/8, nhân viên sẽ không thể truy cập tài khoản e-mail hoặc bảng chấm công.", "opts": [{"t": "like", "vi": "giống như"}, {"t": "so", "vi": "vì vậy"}, {"t": "or", "vi": "hoặc"}, {"t": "first", "vi": "đầu tiên"}], "ans": ["C"], "key": "not … A or B = không … A cũng không B", "ex": "Nối hai danh từ cùng loại (e-mail account, time sheet) trong câu phủ định → <b>or<\/b>. so nối hai mệnh đề, like là giới từ \"giống như\"."}]}, {"title": "Câu 109", "tag": "Từ vựng · trạng từ", "qs": [{"n": 109, "q": "Walk-in clients are ___ a reliable source of business for the Auburn Hair Salon.", "qvi": "Khách vãng lai thường là nguồn khách đáng tin cậy của tiệm tóc Auburn.", "opts": [{"t": "typically", "vi": "thường, thông thường"}, {"t": "fairly", "vi": "khá"}, {"t": "sharply", "vi": "mạnh, đột ngột"}, {"t": "evenly", "vi": "đều nhau"}], "ans": ["A"], "key": "typically = thường thường", "ex": "Câu nói về thói quen chung: khách vãng lai <b>thường<\/b> là nguồn khách ổn định → typically. sharply (tăng/giảm mạnh) và evenly (đều) không hợp nghĩa."}]}, {"title": "Câu 110", "tag": "Từ vựng · trạng từ", "qs": [{"n": 110, "q": "By the end of the year, all packaging used for Schaefer's food products will be ___ recyclable.", "qvi": "Đến cuối năm, toàn bộ bao bì dùng cho sản phẩm thực phẩm của Schaefer sẽ tái chế được hoàn toàn.", "opts": [{"t": "critically", "vi": "nghiêm trọng"}, {"t": "initially", "vi": "ban đầu"}, {"t": "freshly", "vi": "tươi"}, {"t": "fully", "vi": "hoàn toàn"}], "ans": ["D"], "key": "fully recyclable = tái chế được hoàn toàn", "ex": "Bổ nghĩa cho tính từ recyclable → trạng từ, chọn theo nghĩa: <b>fully<\/b> (hoàn toàn). Có \"all packaging\" phía trước hợp với \"hoàn toàn\"."}]}, {"title": "Câu 111", "tag": "Từ loại · danh từ", "qs": [{"n": 111, "q": "Highbrook Hotel staff are trained to provide each guest with an exceptional ___.", "qvi": "Nhân viên khách sạn Highbrook được đào tạo để mang đến cho mỗi vị khách một trải nghiệm tuyệt vời.", "opts": [{"t": "experiencing", "vi": "đang trải nghiệm"}, {"t": "is experienced", "vi": "có kinh nghiệm"}, {"t": "experience", "vi": "trải nghiệm (danh từ)"}, {"t": "to experience", "vi": "để trải nghiệm"}], "ans": ["C"], "key": "an + tính từ + ___ → danh từ", "ex": "Sau <b>an exceptional<\/b> (mạo từ + tính từ) cần <b>danh từ<\/b> → experience (sự trải nghiệm)."}]}, {"title": "Câu 112", "tag": "Từ loại · danh từ", "qs": [{"n": 112, "q": "In ___ for their help, volunteers at the library's book sale were given personalized tea mugs.", "qvi": "Để cảm ơn sự giúp đỡ, các tình nguyện viên ở hội chợ sách của thư viện được tặng cốc trà khắc tên.", "opts": [{"t": "appreciate", "vi": "cảm kích (động từ)"}, {"t": "appreciative", "vi": "biết ơn (tính từ)"}, {"t": "appreciation", "vi": "sự cảm kích (danh từ)"}, {"t": "appreciates", "vi": "cảm kích (động từ số ít)"}], "ans": ["C"], "key": "in appreciation for = để cảm ơn vì", "ex": "Sau giới từ <b>in<\/b> cần danh từ → appreciation. Cụm cố định: in appreciation for something (để bày tỏ lòng biết ơn vì…)."}]}, {"title": "Câu 113", "tag": "Giới từ thời gian", "qs": [{"n": 113, "q": "Because employees must learn to use the new software, several training sessions will take place ___ the next two weeks.", "qvi": "Vì nhân viên phải học dùng phần mềm mới, nhiều buổi đào tạo sẽ diễn ra trong hai tuần tới.", "opts": [{"t": "by", "vi": "trước (hạn)"}, {"t": "over", "vi": "trong suốt"}, {"t": "against", "vi": "chống lại"}, {"t": "at", "vi": "vào lúc"}], "ans": ["B"], "key": "over the next two weeks = trong hai tuần tới", "ex": "<b>over + khoảng thời gian<\/b> = trong suốt khoảng đó (over the next two weeks). by + mốc = trước hạn; at + giờ."}]}, {"title": "Câu 114", "tag": "Trạng từ bổ nghĩa động từ", "qs": [{"n": 114, "q": "Flight attendants asked passengers to take their seats ___ upon boarding the plane.", "qvi": "Tiếp viên yêu cầu hành khách nhanh chóng ngồi vào chỗ khi lên máy bay.", "opts": [{"t": "quicken", "vi": "làm nhanh hơn (động từ)"}, {"t": "quickened", "vi": "đã làm nhanh"}, {"t": "quickly", "vi": "một cách nhanh chóng"}, {"t": "quickest", "vi": "nhanh nhất"}], "ans": ["C"], "key": "take their seats ___ → trạng từ", "ex": "Cụm \"take their seats\" đã đủ (động từ + tân ngữ) → chỗ trống bổ nghĩa cho động từ → <b>trạng từ quickly<\/b>."}]}, {"title": "Câu 115", "tag": "Thì quá khứ đơn", "qs": [{"n": 115, "q": "Last July, Rojas Rieper LLC ___ a grand opening celebration.", "qvi": "Tháng Bảy năm ngoái, công ty Rojas Rieper đã tổ chức lễ khai trương.", "opts": [{"t": "hosts", "vi": "tổ chức (hiện tại)"}, {"t": "hosted", "vi": "đã tổ chức"}, {"t": "will host", "vi": "sẽ tổ chức"}, {"t": "is hosting", "vi": "đang tổ chức"}], "ans": ["B"], "key": "Last July → quá khứ đơn", "ex": "Dấu hiệu <b>Last July<\/b> (tháng Bảy năm ngoái) → thì quá khứ đơn: hosted."}]}, {"title": "Câu 116", "tag": "Giới từ", "qs": [{"n": 116, "q": "Mr. Kim was one ___ three people who received the firm's Competitive Edge award.", "qvi": "Ông Kim là một trong ba người nhận giải Competitive Edge của công ty.", "opts": [{"t": "by", "vi": "bởi"}, {"t": "of", "vi": "trong số"}, {"t": "for", "vi": "cho"}, {"t": "to", "vi": "đến"}], "ans": ["B"], "key": "one of + số nhiều = một trong số", "ex": "Cụm cố định <b>one of + danh từ số nhiều<\/b> = một trong số."}]}, {"title": "Câu 117", "tag": "Từ vựng · danh từ ghép", "qs": [{"n": 117, "q": "Interviews begin today for the production manager ___ at Zhu Pharmaceuticals.", "qvi": "Hôm nay bắt đầu phỏng vấn cho vị trí quản lý sản xuất tại Zhu Pharmaceuticals.", "opts": [{"t": "participation", "vi": "sự tham gia"}, {"t": "outline", "vi": "dàn ý"}, {"t": "arrangement", "vi": "sự sắp xếp"}, {"t": "position", "vi": "vị trí công việc"}], "ans": ["D"], "key": "production manager position = vị trí quản lý sản xuất", "ex": "Phỏng vấn cho một <b>vị trí<\/b> (position) công việc. Các từ còn lại không đi với \"interviews for\"."}]}, {"title": "Câu 118", "tag": "Giới từ thời gian", "qs": [{"n": 118, "q": "Tours of the historic courthouse are offered twice a week ___ the summer.", "qvi": "Các chuyến tham quan tòa án cổ được tổ chức hai lần một tuần trong suốt mùa hè.", "opts": [{"t": "onto", "vi": "lên trên"}, {"t": "during", "vi": "trong suốt"}, {"t": "about", "vi": "về"}, {"t": "at", "vi": "tại"}], "ans": ["B"], "key": "during + khoảng thời gian (the summer)", "ex": "<b>during the summer<\/b> = trong suốt mùa hè. during + danh từ chỉ khoảng thời gian."}]}, {"title": "Câu 119", "tag": "Giới từ thời gian", "qs": [{"n": 119, "q": "___ the next few months, Abundi Ltd. will open its fourth pharmaceutical laboratory in New Zealand.", "qvi": "Trong vòng vài tháng tới, công ty Abundi sẽ mở phòng thí nghiệm dược thứ tư ở New Zealand.", "opts": [{"t": "Within", "vi": "trong vòng"}, {"t": "Soon", "vi": "sớm"}, {"t": "Even", "vi": "thậm chí"}, {"t": "When", "vi": "khi"}], "ans": ["A"], "key": "Within + khoảng thời gian (the next few months)", "ex": "Sau chỗ trống là cụm danh từ \"the next few months\" → cần <b>giới từ<\/b>: Within (trong vòng). When là liên từ cần S + V; Soon, Even là trạng từ."}]}, {"title": "Câu 120", "tag": "Từ loại · danh từ chỉ người", "qs": [{"n": 120, "q": "The ___ at Yohanan Company organizes the delivery of supplies to all conference locations.", "qvi": "Điều phối viên của công ty Yohanan sắp xếp việc giao vật tư đến mọi địa điểm hội nghị.", "opts": [{"t": "coordinating", "vi": "điều phối (V-ing)"}, {"t": "coordinates", "vi": "điều phối (động từ)"}, {"t": "coordinated", "vi": "được điều phối"}, {"t": "coordinator", "vi": "người điều phối"}], "ans": ["D"], "key": "The ___ + organizes → danh từ chỉ người", "ex": "Sau <b>The<\/b> và làm chủ ngữ của organizes → danh từ. Người làm việc tổ chức → <b>coordinator<\/b> (điều phối viên)."}]}, {"title": "Câu 121", "tag": "Động từ chính", "qs": [{"n": 121, "q": "The owners of Rowecroft Porcelain ___ to begin production of casual dinnerware sets next month.", "qvi": "Chủ của Rowecroft Porcelain dự định bắt đầu sản xuất bộ đồ ăn thường ngày vào tháng tới. pment", "vi": "thiết bị"}], "ans": ["B"], "key": "come equipped with = được trang bị sẵn", "ex": "Cụm <b>come equipped with<\/b> = được trang bị sẵn. Xe \"được\" trang bị → V3 equipped (nghĩa bị động)."}]}, {"title": "Câu 125", "tag": "Đại từ thay thế", "qs": [{"n": 125, "q": "The components of the CT640 dishwasher are largely the same as ___ of earlier models.", "qvi": "Các bộ phận của máy rửa bát CT640 phần lớn giống với các bộ phận của những mẫu trước.", "opts": [{"t": "they", "vi": "chúng (chủ ngữ)"}, {"t": "them", "vi": "chúng (tân ngữ)"}, {"t": "those", "vi": "những cái đó"}, {"t": "themselves", "vi": "chính chúng"}], "ans": ["C"], "key": "those of = những cái (đã nói) của", "ex": "So sánh hai thứ cùng loại: the components of CT640 … the same as <b>those of<\/b> earlier models (those = the components, tránh lặp lại)."}]}, {"title": "Câu 126", "tag": "Từ loại · danh từ", "qs": [{"n": 126, "q": "The Nakato Group has won several industry awards for its innovative marketing ___.", "qvi": "Tập đoàn Nakato đã đoạt nhiều giải thưởng trong ngành nhờ các chiến lược marketing sáng tạo.", "opts": [{"t": "strategize", "vi": "lập chiến lược"}, {"t": "strategic", "vi": "mang tính chiến lược"}, {"t": "strategically", "vi": "một cách chiến lược"}, {"t": "strategies", "vi": "các chiến lược"}], "ans": ["D"], "key": "its innovative marketing ___ → danh từ", "ex": "Sau <b>its innovative marketing<\/b> (tính từ sở hữu + tính từ + danh từ bổ nghĩa) cần danh từ chính → strategies."}]}, {"title": "Câu 127", "tag": "Từ vựng · phân từ", "qs": [{"n": 127, "q": "Krit Pinthong's new mystery novel is the most widely ___ book of the year.", "qvi": "Cuốn tiểu thuyết trinh thám mới của Krit Pinthong là cuốn sách được mong đợi nhiều nhất năm.", "opts": [{"t": "estimated", "vi": "được ước tính"}, {"t": "anticipated", "vi": "được mong đợi"}, {"t": "assumed", "vi": "được cho là"}, {"t": "predicted", "vi": "được dự đoán"}], "ans": ["B"], "key": "widely anticipated = được mong chờ rộng rãi", "ex": "Sách mới được nhiều người <b>mong chờ<\/b> → anticipated. Cụm hay gặp: the most anticipated book/movie."}]}, {"title": "Câu 128", "tag": "Liên từ", "qs": [{"n": 128, "q": "The leadership team was quite relieved ___ the Tovyar building project was completed under budget.", "qvi": "Ban lãnh đạo khá nhẹ nhõm khi dự án tòa nhà Tovyar hoàn thành dưới mức ngân sách.", "opts": [{"t": "especially", "vi": "đặc biệt"}, {"t": "following", "vi": "sau (giới từ)"}, {"t": "when", "vi": "khi"}, {"t": "than", "vi": "hơn"}], "ans": ["C"], "key": "Sau chỗ trống là mệnh đề → liên từ when", "ex": "Sau chỗ trống là mệnh đề đầy đủ (the project <b>was completed<\/b>) → cần <b>liên từ<\/b>: when. following là giới từ, especially là trạng từ, than dùng trong so sánh."}]}, {"title": "Câu 129", "tag": "Giới từ", "qs": [{"n": 129, "q": "___ two floors of offices, the building offers several retail spaces.", "qvi": "Ngoài hai tầng văn phòng, tòa nhà còn có vài mặt bằng bán lẻ.", "opts": [{"t": "In addition to", "vi": "ngoài … ra"}, {"t": "Fortunately", "vi": "may mắn là"}, {"t": "In order that", "vi": "để mà"}, {"t": "Especially", "vi": "đặc biệt là"}], "ans": ["A"], "key": "In addition to + cụm danh từ = ngoài … ra", "ex": "Sau chỗ trống là cụm danh từ \"two floors of offices\" → cần giới từ: <b>In addition to<\/b>. In order that là liên từ (+ S + V)."}]}, {"title": "Câu 130", "tag": "Từ vựng · danh từ", "qs": [{"n": 130, "q": "___ regarding construction noise and traffic delays should be directed to Mr. Jasdi, the project manager.", "qvi": "Mọi phản ánh về tiếng ồn xây dựng và kẹt xe xin gửi tới ông Jasdi, quản lý dự án.", "opts": [{"t": "Materials", "vi": "vật liệu"}, {"t": "Concerns", "vi": "mối lo ngại, phản ánh"}, {"t": "Expansions", "vi": "sự mở rộng"}, {"t": "Selections", "vi": "sự lựa chọn"}], "ans": ["B"], "key": "concerns regarding … = những phản ánh về…", "ex": "Tiếng ồn và kẹt xe là những điều người dân <b>lo ngại<\/b> → Concerns, gửi cho quản lý dự án giải quyết."}]}, {"title": "Đoạn 131–134 · Quảng cáo tuyển dụng", "tag": "Advertisement", "passage": ["JOIN THE RGBS AUTOMOTIVE TEAM", "RGBS Automotive is ⟦131⟧ hiring full-time and part-time workers. Apply today! ⟦132⟧ could become part of our manufacturing team! We make high-tech products ⟦133⟧ found in cars and trucks of all kinds.", "RGBS Automotive pays well, and we provide ongoing training plus opportunities for promotion. ⟦134⟧ Go to www.rgbsautomotive.com for more details and to fill out an application."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "JOIN THE RGBS AUTOMOTIVE TEAM", "vi": "HÃY GIA NHẬP ĐỘI NGŨ RGBS AUTOMOTIVE"}, {"sp": "", "t": "RGBS Automotive is (131) now hiring full-time and part-time workers. Apply today! (132) You could become part of our manufacturing team! We make high-tech products (133) that are found in cars and trucks of all kinds.", "vi": "RGBS Automotive hiện đang tuyển nhân viên toàn thời gian và bán thời gian. Hãy ứng tuyển ngay hôm nay! Bạn có thể trở thành thành viên đội sản xuất của chúng tôi! Chúng tôi làm các sản phẩm công nghệ cao có trong đủ loại ô tô và xe tải."}, {"sp": "", "t": "RGBS Automotive pays well, and we provide ongoing training plus opportunities for promotion. (134) We also offer a generous number of vacation days. Go to www.rgbsautomotive.com for more details and to fill out an application.", "vi": "RGBS Automotive trả lương tốt, có đào tạo liên tục và cơ hội thăng tiến. Chúng tôi còn cho nhiều ngày nghỉ phép. Vào www.rgbsautomotive.com để biết thêm và điền đơn ứng tuyển."}], "qs": [{"n": 131, "q": "", "qvi": "", "opts": [{"t": "now", "vi": "bây giờ, hiện đang"}, {"t": "likewise", "vi": "tương tự"}, {"t": "there", "vi": "ở đó"}, {"t": "instead", "vi": "thay vào đó"}], "ans": ["A"], "key": "is now hiring = hiện đang tuyển", "ex": "Thì hiện tại tiếp diễn \"is hiring\" + <b>now<\/b> (bây giờ) là tự nhiên nhất. likewise, instead cần ý phía trước để so sánh/thay thế; there không hợp."}, {"n": 132, "q": "", "qvi": "", "opts": [{"t": "It", "vi": "Nó"}, {"t": "You", "vi": "Bạn"}, {"t": "They", "vi": "Họ"}, {"t": "Everyone", "vi": "Mọi người"}], "ans": ["B"], "key": "Quảng cáo nói với người đọc → You", "ex": "Câu trước \"Apply today!\" nói trực tiếp với người đọc → \"<b>You<\/b> could become part of our team\" (bạn có thể trở thành…)."}, {"n": 133, "q": "", "qvi": "", "opts": [{"t": "can be", "vi": "có thể là"}, {"t": "that are", "vi": "mà được (that are)"}, {"t": "and being", "vi": "và đang là"}, {"t": "that had been", "vi": "mà đã từng được"}], "ans": ["B"], "key": "products that are found = sản phẩm được tìm thấy", "ex": "Cần mệnh đề quan hệ bổ nghĩa cho products: products <b>that are<\/b> found in cars (sản phẩm có trong ô tô). Thì hiện tại hợp với cả đoạn; \"that had been\" là quá khứ hoàn thành, sai thì."}, {"n": 134, "q": "", "qvi": "", "opts": [{"t": "Ours is a highly competitive industry.", "vi": "Ngành của chúng tôi cạnh tranh rất cao."}, {"t": "RGBS Automotive began doing business 45 years ago.", "vi": "RGBS bắt đầu kinh doanh 45 năm trước."}, {"t": "We also offer a generous number of vacation days.", "vi": "Chúng tôi còn cho nhiều ngày nghỉ phép."}, {"t": "RGBS Automotive sells a wide selection of merchandise.", "vi": "RGBS bán rất nhiều loại hàng hóa."}], "ans": ["C"], "key": "Câu trước liệt kê quyền lợi → also offer…", "ex": "Câu trước liệt kê quyền lợi (lương tốt, đào tạo, thăng tiến) → câu tiếp theo dùng <b>also<\/b> để thêm một quyền lợi nữa: nhiều ngày nghỉ phép. (D) sai: công ty sản xuất, không phải bán hàng."}]}, {"title": "Đoạn 135–138 · Bản ghi nhớ sau cuộc họp", "tag": "Memo", "passage": ["MEMO", "To: Marketing Team", "From: Alyssa Jacobs, Project Manager", "Date: 27 September", "Subject: Meeting wrap-up", "Thank you again to all of you for your fine work on the upcoming marketing campaign for the Turbo Omega 2 smartphone. As ⟦135⟧ during yesterday's meeting, our goal is to launch the television, radio, and social media advertisements on 1 November. The phone itself will be in stores by 1 December. ⟦136⟧", "⟦137⟧, Gary Carollo will draft the press release and post it on our shared drive, where all of you will be able to read it. Please e-mail any ⟦138⟧ for changes to Gary within one week. He will present his final draft at our next regular meeting. We will also tie up any loose ends at that time."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "Thank you again to all of you for your fine work on the upcoming marketing campaign for the Turbo Omega 2 smartphone. As (135) decided during yesterday's meeting, our goal is to launch the television, radio, and social media advertisements on 1 November. The phone itself will be in stores by 1 December. (136) This gives us one month to generate consumer excitement.", "vi": "Một lần nữa cảm ơn mọi người đã làm tốt chiến dịch marketing sắp tới cho điện thoại Turbo Omega 2. Như đã quyết định ở cuộc họp hôm qua, mục tiêu của chúng ta là tung quảng cáo trên TV, radio và mạng xã hội vào ngày 1/11. Điện thoại sẽ có mặt ở cửa hàng trước ngày 1/12. Như vậy chúng ta có một tháng để tạo sự háo hức cho người tiêu dùng."}, {"sp": "", "t": "(137) Soon, Gary Carollo will draft the press release and post it on our shared drive, where all of you will be able to read it. Please e-mail any (138) suggestions for changes to Gary within one week. He will present his final draft at our next regular meeting.", "vi": "Sắp tới, Gary Carollo sẽ soạn thông cáo báo chí và đăng lên ổ chung để mọi người đọc. Hãy gửi e-mail góp ý chỉnh sửa cho Gary trong vòng một tuần. Anh ấy sẽ trình bày bản cuối ở cuộc họp định kỳ tới."}], "qs": [{"n": 135, "q": "", "qvi": "", "opts": [{"t": "taken", "vi": "được lấy"}, {"t": "driven", "vi": "được lái"}, {"t": "earned", "vi": "kiếm được"}, {"t": "decided", "vi": "được quyết định"}], "ans": ["D"], "key": "As decided during the meeting = như đã quyết định trong cuộc họp", "ex": "Mục tiêu (ngày tung quảng cáo) là điều được <b>quyết định<\/b> trong cuộc họp → As decided. Cụm hay gặp: as discussed / as decided / as mentioned."}, {"n": 136, "q": "", "qvi": "", "opts": [{"t": "Remember to turn off your phone at the end of the workday.", "vi": "Nhớ tắt điện thoại cuối ngày làm việc."}, {"t": "This gives us one month to generate consumer excitement.", "vi": "Như vậy chúng ta có một tháng để tạo sự háo hức cho khách hàng."}, {"t": "The wholesale price can also be adjusted if necessary.", "vi": "Giá bán sỉ cũng có thể điều chỉnh nếu cần."}, {"t": "These new features will surely increase Turbo Omega 2 sales.", "vi": "Các tính năng mới chắc chắn sẽ tăng doanh số."}], "ans": ["B"], "key": "This = khoảng cách 1/11 → 1/12", "ex": "Câu trước nêu hai mốc: quảng cáo 1/11, điện thoại lên kệ 1/12 → \"<b>This<\/b> gives us one month\" (khoảng này cho ta một tháng). (D) bẫy: đoạn văn không nhắc tính năng mới nào."}, {"n": 137, "q": "", "qvi": "", "opts": [{"t": "Rather", "vi": "Đúng hơn là"}, {"t": "Soon", "vi": "Sắp tới, chẳng bao lâu"}, {"t": "After all", "vi": "Rốt cuộc"}, {"t": "That is", "vi": "Tức là"}], "ans": ["B"], "key": "Soon + will draft = sắp tới sẽ soạn", "ex": "Câu sau dùng tương lai \"will draft\" → <b>Soon<\/b> (sắp tới) hợp nghĩa. Rather (đúng hơn), After all (rốt cuộc), That is (tức là) cần ý phía trước để sửa/giải thích."}, {"n": 138, "q": "", "qvi": "", "opts": [{"t": "suggesting", "vi": "đang gợi ý"}, {"t": "suggested", "vi": "được gợi ý"}, {"t": "suggestions", "vi": "những góp ý (danh từ)"}, {"t": "suggests", "vi": "gợi ý (động từ)"}], "ans": ["C"], "key": "any + ___ + for → danh từ", "ex": "Sau <b>any<\/b> và trước giới từ <b>for<\/b> cần danh từ → suggestions for changes (góp ý chỉnh sửa)."}]}, {"title": "Đoạn 139–142 · Thông tin sản phẩm", "tag": "Product information", "passage": ["Handmade Silk Blouse by Coreopsis Textiles, Size Medium, £45", "Coreopsis Textiles' silk blouses are created from vintage fabrics and other recycled components that we sew together in a patchwork fashion. Because all ⟦139⟧ garments are handcrafted, each is one of a kind. ⟦140⟧ Unique variations within each piece are part of the charm of Coreopsis Textiles' products. The blouse you receive will be similar in style but not identical to the one pictured.", "Please note that this garment is ⟦141⟧. It is recommended that you either hand-wash it or wash it in cold water on the gentle cycle in a mesh bag. While the item has been prewashed, dryer heat may cause it to shrink. ⟦142⟧, it is important that it be hung to air dry."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "Coreopsis Textiles' silk blouses are created from vintage fabrics and other recycled components that we sew together in a patchwork fashion. Because all (139) our garments are handcrafted, each is one of a kind. (140) They cannot be exactly replicated. Unique variations within each piece are part of the charm of Coreopsis Textiles' products.", "vi": "Áo lụa của Coreopsis Textiles được làm từ vải cổ điển và các phần tái chế khác mà chúng tôi may ghép lại kiểu chắp vá. Vì mọi sản phẩm của chúng tôi đều làm thủ công, mỗi chiếc là độc nhất. Không thể làm lại y hệt. Những khác biệt riêng của từng chiếc là nét duyên của sản phẩm Coreopsis."}, {"sp": "", "t": "Please note that this garment is (141) delicate. It is recommended that you either hand-wash it or wash it in cold water on the gentle cycle in a mesh bag. While the item has been prewashed, dryer heat may cause it to shrink. (142) Therefore, it is important that it be hung to air dry.", "vi": "Lưu ý áo này dễ hỏng (mỏng manh). Nên giặt tay hoặc giặt nước lạnh, chế độ nhẹ, cho vào túi lưới. Dù áo đã được giặt trước, nhiệt máy sấy có thể làm áo co lại. Vì vậy, cần phơi áo cho khô tự nhiên."}], "qs": [{"n": 139, "q": "", "qvi": "", "opts": [{"t": "its", "vi": "của nó"}, {"t": "our", "vi": "của chúng tôi"}, {"t": "your", "vi": "của bạn"}, {"t": "their", "vi": "của họ"}], "ans": ["B"], "key": "Công ty tự nói về mình → our", "ex": "Đoạn văn do công ty viết, câu trước có \"<b>we<\/b> sew together\" → our garments (sản phẩm của chúng tôi)."}, {"n": 140, "q": "", "qvi": "", "opts": [{"t": "This is a hassle-free return policy.", "vi": "Đây là chính sách đổi trả dễ dàng."}, {"t": "Always check your receipt.", "vi": "Luôn kiểm tra hóa đơn."}, {"t": "They cannot be exactly replicated.", "vi": "Chúng không thể được làm lại y hệt."}, {"t": "Extra shipping charges may apply.", "vi": "Có thể tính thêm phí vận chuyển."}], "ans": ["C"], "key": "one of a kind → cannot be exactly replicated", "ex": "Câu trước: mỗi chiếc là độc nhất (one of a kind) → câu sau giải thích thêm: \"<b>They<\/b> cannot be exactly replicated\" (They = các sản phẩm). Câu sau nữa nói về sự khác biệt riêng, rất khớp."}, {"n": 141, "q": "", "qvi": "", "opts": [{"t": "popular", "vi": "được ưa chuộng"}, {"t": "delicate", "vi": "mỏng manh, dễ hỏng"}, {"t": "mild", "vi": "nhẹ, ôn hòa"}, {"t": "unavailable", "vi": "không có sẵn"}], "ans": ["B"], "key": "delicate = mỏng manh → phải giặt nhẹ", "ex": "Các câu sau dặn giặt tay, giặt nhẹ, không sấy → áo <b>mỏng manh<\/b> (delicate)."}, {"n": 142, "q": "", "qvi": "", "opts": [{"t": "If not", "vi": "Nếu không"}, {"t": "Likewise", "vi": "Tương tự"}, {"t": "Therefore", "vi": "Vì vậy"}, {"t": "On the contrary", "vi": "Ngược lại"}], "ans": ["C"], "key": "nguyên nhân (sấy làm co) → kết quả (phơi khô)", "ex": "Câu trước: nhiệt máy sấy làm áo co → câu sau: cần phơi khô tự nhiên. Quan hệ nguyên nhân → kết quả → <b>Therefore<\/b>."}]}, {"title": "Đoạn 143–146 · E-mail gửi khách hàng", "tag": "E-mail", "passage": ["To: Shu Jiang <sjiang@rowanatech.ca>", "From: Maxwell Baschet <mbaschet@mapleroadstorage.ca>", "Date: 4 April", "Subject: Your contract", "Attachment: Jiang contract", "Dear Ms. Jiang,", "We are pleased you ⟦143⟧ Maple Road Storage for your storage needs. I have attached a copy of your signed contract. ⟦144⟧", "Do you know about our referral program? You will receive one free month of storage if someone you recommend signs a contract with us. The new tenant will receive a free month ⟦145⟧. You can find more information about this program and all our special ⟦146⟧ on our Web site at www.mapleroadstorage.ca.", "Sincerely,", "Maxwell Baschet, Site Manager"], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "We are pleased you (143) have chosen Maple Road Storage for your storage needs. I have attached a copy of your signed contract. (144) If your contact information changes, please let us know.", "vi": "Chúng tôi rất vui vì chị đã chọn Maple Road Storage cho nhu cầu lưu kho của mình. Tôi gửi kèm bản hợp đồng chị đã ký. Nếu thông tin liên lạc của chị thay đổi, vui lòng báo cho chúng tôi."}, {"sp": "", "t": "Do you know about our referral program? You will receive one free month of storage if someone you recommend signs a contract with us. The new tenant will receive a free month (145) as well. You can find more information about this program and all our special (146) offers on our Web site.", "vi": "Chị có biết chương trình giới thiệu của chúng tôi không? Chị sẽ được miễn phí một tháng lưu kho nếu người chị giới thiệu ký hợp đồng với chúng tôi. Người thuê mới cũng được miễn phí một tháng. Chị có thể xem thêm về chương trình này và mọi ưu đãi đặc biệt trên website."}], "qs": [{"n": 143, "q": "", "qvi": "", "opts": [{"t": "chooses", "vi": "chọn (hiện tại)"}, {"t": "will choose", "vi": "sẽ chọn"}, {"t": "chosen", "vi": "được chọn (V3)"}, {"t": "have chosen", "vi": "đã chọn"}], "ans": ["D"], "key": "Đã ký hợp đồng → việc đã xảy ra: have chosen", "ex": "Khách đã ký hợp đồng rồi (signed contract) → việc chọn đã xảy ra, kết quả còn ở hiện tại → <b>have chosen<\/b>. chooses thiếu nghĩa đã xảy ra, chosen đứng một mình không làm động từ chính."}, {"n": 144, "q": "", "qvi": "", "opts": [{"t": "If your contact information changes, please let us know.", "vi": "Nếu thông tin liên lạc của chị thay đổi, vui lòng báo cho chúng tôi."}, {"t": "We hope you will enjoy working here.", "vi": "Hy vọng chị sẽ thích làm việc ở đây."}, {"t": "We will reply as soon as possible.", "vi": "Chúng tôi sẽ trả lời sớm nhất có thể."}, {"t": "However, business contracts can be difficult to understand.", "vi": "Tuy nhiên, hợp đồng kinh doanh có thể khó hiểu."}], "ans": ["A"], "key": "Sau khi gửi hợp đồng → dặn cập nhật thông tin", "ex": "Vừa gửi hợp đồng đã ký → dặn khách báo khi đổi thông tin liên lạc là tự nhiên. (B) sai: khách thuê kho, không làm việc ở đây. (C) sai: khách chưa hỏi gì để trả lời."}, {"n": 145, "q": "", "qvi": "", "opts": [{"t": "after all", "vi": "rốt cuộc"}, {"t": "again", "vi": "lại lần nữa"}, {"t": "as well", "vi": "cũng vậy"}, {"t": "since", "vi": "kể từ"}], "ans": ["C"], "key": "as well = cũng (đứng cuối câu)", "ex": "Người giới thiệu được miễn phí một tháng, người thuê mới <b>cũng<\/b> được → as well (= too, đặt cuối câu)."}, {"n": 146, "q": "", "qvi": "", "opts": [{"t": "offers", "vi": "ưu đãi"}, {"t": "schedules", "vi": "lịch trình"}, {"t": "classes", "vi": "lớp học"}, {"t": "amounts", "vi": "số lượng"}], "ans": ["A"], "key": "special offers = ưu đãi đặc biệt", "ex": "Chương trình giới thiệu là một ưu đãi → \"all our special <b>offers<\/b>\" (mọi ưu đãi đặc biệt). Cụm rất hay gặp trong TOEIC."}]}], "recap": "<h2>Ghi nhớ sau bài<\/h2><p><b>Từ loại theo vị trí:<\/b> trạng từ trước tính từ (106 easily accessible), sau động từ + tân ngữ (114 quickly), giữa S và V (123 mistakenly); danh từ sau a/an + adj (111), sau giới từ (112), sau its + adj (126); danh từ chỉ người làm chủ ngữ (120 coordinator).<\/p><p><b>Giới từ hay liên từ:<\/b> Within / during / over / In addition to + cụm danh từ (113, 118, 119, 129); when + mệnh đề (128).<\/p><p><b>Cụm cố định:<\/b> contingent on, charge sb a fee, one of + N số nhiều, come equipped with, those of, in appreciation for, special offers, as decided.<\/p><p><b>Part 6 điền câu:<\/b> tìm từ chỉ về ý trước: also (134), This (136), They (140).<\/p>", "exam": "TOEIC-A-MOCK3", "examSrc": "/toeica-mocktest/", "qviAfter": true};</script>
