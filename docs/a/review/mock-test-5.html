<script>window.MT={"vocab":[["jewelry","n","/ˈdʒuːəlri/","trang sức","It's a case for your jewelry."],["loyal customer","np","/ˈlɔɪəl ˈkʌstəmər/","khách hàng thân thiết","Because you've been a customer for over 10 years, I've also included a special gift in the package for you."],["feedback","n","/ˈfiːdbæk/","ý kiến phản hồi","To give feedback"],["frame","v","/freɪm/","đóng khung","We received your voicemail about wanting to frame a wedding picture."],["complete the order","phr","/kəmˈpliːt ði ˈɔːrdər/","hoàn tất đơn hàng","So to answer your question, you can complete the whole order online."],["guarantee","v","/ˌɡærənˈtiː/","bảo đảm","And for a small extra cost, we'll guarantee to replace your frame in case of damage."],["physical therapy","np","/ˈfɪzɪkl ˈθerəpi/","vật lý trị liệu","Our physical therapy center is known for the excellent care we provide to our patients, and that's because of you, our staff."],["recruit","v","/rɪˈkruːt/","tuyển dụng","To recruit employees"],["flexible","adj","/ˈfleksəbl/","linh hoạt","With Hoffman, drivers enjoy flexible scheduling."],["determine","v","/dɪˈtɜːrmɪn/","tự quyết định, xác định","In fact, we're the only company in the region that allows employees to determine their own work hours."],["filming","n","/ˈfɪlmɪŋ/","việc quay phim","Filming for a television show"],["festival","n","/ˈfestɪvl/","lễ hội","And just as a reminder, I'm still planning to be out of town next week for the Springdale Pastry and Dessert Festival."],["opposition","n","/ˌɑːpəˈzɪʃn/","sự phản đối","At a recent well attended public comment meeting, residents had a chance to voice any opposition to the project."],["adjustable","adj","/əˈdʒʌstəbl/","điều chỉnh được","Best of all, the organizer adjusts to any size space you may have on your desk."],["organizer","n","/ˈɔːrɡənaɪzər/","hộp sắp xếp đồ","If so, the Optimum Space Organizer is the perfect product for you."],["ingredient","n","/ɪnˈɡriːdiənt/","nguyên liệu","To showcase individual ingredients"],["pre-order","v","/ˌpriː ˈɔːrdər/","đặt trước","It'll be released in November, but it's available for pre-order right now."],["launch","v","/lɔːntʃ/","ra mắt, khai trương","She launched a culinary training course."],["apologize for","phr","/əˈpɑːlədʒaɪz fɔːr/","xin lỗi vì","To apologize to the listeners for a product shortage"],["inconvenience","n","/ˌɪnkənˈviːniəns/","sự bất tiện","We apologize for the inconvenience the construction noise may cause."],["baggage","n","/ˈbæɡɪdʒ/","hành lý","If you need assistance handling your baggage, please speak to a ticket agent immediately."],["press conference","np","/pres ˈkɑːnfərəns/","họp báo","I'm Carmen Salazar, the Airport Operations Director, and I wanted to thank you for attending this press conference."],["renovation","n","/ˌrenəˈveɪʃn/","sự cải tạo","Renovation work to upgrade and modernize our train station is underway."],["prototype","n","/ˈproʊtətaɪp/","mẫu thử","A prototype electric vehicle"]],"n": "a5", "part": 4, "partName": "Part 4", "sub": "Talks · Bài nói ngắn · 30 câu (71–100)", "intro": "Trang này chữa <b>Mock Test 5 (Part 4)<\/b> của lớp TOEIC A. Mỗi bài nói có nút nghe lại, lời thoại kèm dịch (mở sau khi đã nghe) và 3 câu hỏi. Số <b>(71)<\/b> trong lời thoại đánh dấu câu chứa đáp án.", "stepsTitle": "Cách làm Part 4: 3 bước", "steps": ["<b>Đọc trước câu hỏi, đoán loại bài.<\/b> Đề ghi sẵn <i>telephone message, advertisement, broadcast, announcement<\/i>. Tin nhắn thoại: ai gọi, gọi để làm gì, muốn người nghe làm gì. Quảng cáo: bán gì, điểm đặc biệt, cách được giảm giá.", "<b>Câu hỏi chung (Who is the speaker / What is the purpose) nằm ở 1–2 câu đầu.<\/b> Câu \"người nghe được yêu cầu làm gì\" thường nằm ở cuối bài: <i>please call me back, visit our website, check out our website<\/i>.", "<b>Câu ý định (\"What does the speaker imply…\"):<\/b> đừng dịch từng chữ, hãy xem câu nói đứng ở đâu, ngay trước và sau nó nói gì. VD: \"I must leave at noon\" + \"Next week we'll try out more\" → hôm nay không làm hết được."], "groups": [{"title": "Bài nói 71–73 · Tin nhắn thoại · Tiệm trang sức", "audio": "../../audio/amk5/c71.mp3", "script": [{"sp": "", "t": "Hi Amina, this is Sabine calling from Blue Drop Creations. (71) I just put the **earrings and necklaces that you ordered from me** in the mail.", "vi": "Chào Amina, mình là Sabine gọi từ Blue Drop Creations. Mình vừa gửi bưu điện đôi bông tai và dây chuyền bạn đặt mua của mình."}, {"sp": "", "t": "(72) Because you've been a **customer for over 10 years**, I've also included a special gift in the package for you. It's a case for your jewelry.", "vi": "Vì bạn đã là khách hàng hơn 10 năm, mình có tặng kèm một món quà đặc biệt trong gói hàng: một hộp đựng trang sức."}, {"sp": "", "t": "This is a new product that I'm starting to offer, so please call me back after you receive it. (73) **I'd really like to hear your thoughts on it.**", "vi": "Đây là sản phẩm mới mình bắt đầu bán, nên nhận được rồi thì gọi lại cho mình nhé. Mình rất muốn nghe ý kiến của bạn."}], "qs": [{"n": 71, "q": "Who most likely is the speaker?", "qvi": "Người nói có lẽ là ai?", "opts": [{"t": "An art gallery owner", "vi": "Chủ phòng tranh"}, {"t": "A hairstylist", "vi": "Thợ làm tóc"}, {"t": "A clothing designer", "vi": "Nhà thiết kế quần áo"}, {"t": "A jewelry maker", "vi": "Thợ làm trang sức"}], "ans": ["D"], "key": "earrings and necklaces you ordered from me → jewelry maker", "ex": "Khách đặt bông tai và dây chuyền \"from me\" (từ chính người nói), lại tặng hộp đựng trang sức → người làm trang sức."}, {"n": 72, "q": "Why did the speaker include a special gift?", "qvi": "Vì sao người nói tặng kèm quà?", "opts": [{"t": "Because the listener is a new customer", "vi": "Vì người nghe là khách mới"}, {"t": "Because the listener is celebrating a special occasion", "vi": "Vì người nghe đang có dịp đặc biệt"}, {"t": "Because the listener is a loyal customer", "vi": "Vì người nghe là khách hàng thân thiết"}, {"t": "Because the listener placed a large order", "vi": "Vì người nghe đặt đơn lớn"}], "ans": ["C"], "key": "customer for over 10 years → loyal customer", "ex": "Khách hàng hơn 10 năm = khách hàng thân thiết (loyal customer). (A) ngược nghĩa."}, {"n": 73, "q": "Why is the listener asked to return a phone call?", "qvi": "Vì sao người nghe được đề nghị gọi lại?", "opts": [{"t": "To give feedback", "vi": "Để góp ý"}, {"t": "To confirm receipt of an order", "vi": "Để xác nhận đã nhận hàng"}, {"t": "To update a payment method", "vi": "Để cập nhật cách thanh toán"}, {"t": "To provide an address", "vi": "Để cho địa chỉ"}], "ans": ["A"], "key": "hear your thoughts → give feedback", "ex": "\"I'd really like to hear your thoughts on it\" (muốn nghe ý kiến của bạn) → để góp ý (feedback). (B) bẫy: \"after you receive it\" chỉ là thời điểm gọi, không phải mục đích."}]}, {"title": "Bài nói 74–76 · Tin nhắn thoại · Cửa hàng khung ảnh", "audio": "../../audio/amk5/c74.mp3", "script": [{"sp": "", "t": "Good morning, this is Brandon from Dakota Framing Company, returning your call. (74) We received your voicemail about wanting to **frame a wedding picture**.", "vi": "Chào buổi sáng, tôi là Brandon từ Công ty Khung ảnh Dakota, gọi lại cho chị. Chúng tôi đã nhận tin nhắn thoại chị muốn đóng khung một tấm ảnh cưới."}, {"sp": "", "t": "There is no need to print the photo yourself, we prefer that you e-mail us a digital copy. So to answer your question, (75) you can **complete the whole order online**. Just visit our website, where you'll fill in your choices for photo size and the frame, and upload your photo.", "vi": "Chị không cần tự in ảnh, chúng tôi muốn chị gửi e-mail bản ảnh kỹ thuật số. Vậy để trả lời câu hỏi của chị: chị có thể đặt hàng toàn bộ trên mạng. Chỉ cần vào website, chọn cỡ ảnh, kiểu khung và tải ảnh lên."}, {"sp": "", "t": "And (76) for a small extra cost, we'll **guarantee to replace your frame in case of damage**. Please be sure to check that box when you order.", "vi": "Và với một khoản phí nhỏ, chúng tôi bảo đảm thay khung mới nếu bị hỏng. Nhớ đánh dấu ô đó khi đặt hàng nhé."}], "qs": [{"n": 74, "q": "What does the listener want to do?", "qvi": "Người nghe muốn làm gì?", "opts": [{"t": "Hire a caterer", "vi": "Thuê dịch vụ nấu tiệc"}, {"t": "Purchase a painting", "vi": "Mua một bức tranh"}, {"t": "Have a printer repaired", "vi": "Sửa máy in"}, {"t": "Have a photograph framed", "vi": "Đóng khung một tấm ảnh"}], "ans": ["D"], "key": "frame a wedding picture → have a photograph framed", "ex": "Khách muốn \"frame a wedding picture\" (đóng khung ảnh cưới). (C) bẫy: có nhắc \"print\" (in) nhưng không ai sửa máy in."}, {"n": 75, "q": "What does the speaker expect the listener to do on a Web site?", "qvi": "Người nói muốn người nghe làm gì trên website?", "opts": [{"t": "View a list of prices", "vi": "Xem bảng giá"}, {"t": "Place an order", "vi": "Đặt hàng"}, {"t": "Schedule a time to meet", "vi": "Hẹn lịch gặp"}, {"t": "Read customer reviews", "vi": "Đọc đánh giá của khách"}], "ans": ["B"], "key": "complete the whole order online → place an order", "ex": "Vào website để chọn cỡ ảnh, khung và tải ảnh lên = đặt hàng."}, {"n": 76, "q": "What is included for an extra fee?", "qvi": "Trả thêm tiền thì được gì?", "opts": [{"t": "Shipping", "vi": "Giao hàng"}, {"t": "An artist's signature", "vi": "Chữ ký của họa sĩ"}, {"t": "A newsletter", "vi": "Bản tin"}, {"t": "A warranty", "vi": "Bảo hành"}], "ans": ["D"], "key": "guarantee to replace in case of damage → a warranty", "ex": "Phí nhỏ để \"bảo đảm thay khung nếu bị hỏng\" = bảo hành (warranty)."}]}, {"title": "Bài nói 77–79 · Buổi đào tạo nhân viên", "audio": "../../audio/amk5/c77.mp3", "script": [{"sp": "", "t": "Welcome all to this week's training in our series of patient care programs. (77) Our **physical therapy center** is known for the excellent care we provide to our patients, and that's because of you, our staff.", "vi": "Chào mừng mọi người đến buổi đào tạo tuần này trong chuỗi chương trình chăm sóc bệnh nhân. Trung tâm vật lý trị liệu của chúng ta nổi tiếng chăm sóc bệnh nhân rất tốt, và đó là nhờ các bạn, đội ngũ nhân viên."}, {"sp": "", "t": "The training today will be about ways to engage the patients who reside in our facility through playing games. (78) **I've prepared different types of activities** for us to try out, including some games that involve mental stimulation as well as physical exercises.", "vi": "Buổi hôm nay nói về cách thu hút bệnh nhân nội trú tham gia qua các trò chơi. Tôi đã chuẩn bị nhiều loại hoạt động để ta thử, gồm các trò chơi rèn trí não và cả bài tập thể chất."}, {"sp": "", "t": "But I have to let you know that today (79) **I must leave at noon**. Next week we'll try out more of the games.", "vi": "Nhưng tôi phải báo trước là hôm nay tôi phải về lúc 12 giờ trưa. Tuần sau chúng ta sẽ thử thêm các trò chơi."}], "qs": [{"n": 77, "q": "Who are the listeners?", "qvi": "Người nghe là ai?", "opts": [{"t": "Hotel receptionists", "vi": "Lễ tân khách sạn"}, {"t": "Health-care staff", "vi": "Nhân viên y tế"}, {"t": "Customer-service representatives", "vi": "Nhân viên chăm sóc khách hàng"}, {"t": "Fitness trainers", "vi": "Huấn luyện viên thể hình"}], "ans": ["B"], "key": "patient care, physical therapy center, our staff → health-care staff", "ex": "Người nghe là \"our staff\" của trung tâm vật lý trị liệu, chăm sóc bệnh nhân → nhân viên y tế. (D) bẫy: \"physical exercises\" liên tưởng tới thể hình."}, {"n": 78, "q": "What has the speaker prepared?", "qvi": "Người nói đã chuẩn bị gì?", "opts": [{"t": "Activities", "vi": "Các hoạt động"}, {"t": "Food", "vi": "Đồ ăn"}, {"t": "Certificates", "vi": "Giấy chứng nhận"}, {"t": "A video", "vi": "Một video"}], "ans": ["A"], "key": "I've prepared different types of activities", "ex": "Nghe thẳng: \"I've prepared different types of activities\"."}, {"n": 79, "q": "What does the speaker imply when he says, \"l must leave at noon\"?", "qvi": "Người nói ngụ ý gì khi nói \"Tôi phải về lúc trưa\"?", "opts": [{"t": "He would like permission to leave.", "vi": "Anh muốn xin phép về."}, {"t": "He cannot join a luncheon.", "vi": "Anh không dự bữa trưa được."}, {"t": "A colleague will fill in for him.", "vi": "Một đồng nghiệp sẽ thay anh."}, {"t": "Some material Will not be covered today.", "vi": "Hôm nay sẽ không làm hết nội dung."}], "ans": ["D"], "key": "leave at noon + next week we'll try more → some material will not be covered today", "ex": "Ngay sau đó anh nói \"tuần sau sẽ thử thêm các trò chơi\" → hôm nay không kịp làm hết."}]}, {"title": "Bài nói 80–82 · Quảng cáo tuyển tài xế", "audio": "../../audio/amk5/c80.mp3", "script": [{"sp": "", "t": "Are you a certified commercial truck driver? (80) Hoffman Oversized Haulers is currently **looking for experienced truck drivers to join our team**. As our name suggests, we transport oversized cargo throughout the region.", "vi": "Bạn là tài xế xe tải thương mại có bằng? Công ty vận tải hàng quá khổ Hoffman đang tìm tài xế xe tải có kinh nghiệm gia nhập đội ngũ. Đúng như tên gọi, chúng tôi chở hàng quá khổ khắp khu vực."}, {"sp": "", "t": "With Hoffman, drivers enjoy flexible scheduling. In fact, (81) we're the **only company in the region** that allows employees to **determine their own work hours**.", "vi": "Ở Hoffman, tài xế được sắp xếp giờ làm linh hoạt. Thực tế, chúng tôi là công ty duy nhất trong khu vực cho nhân viên tự chọn giờ làm."}, {"sp": "", "t": "If you don't have experience working with oversized loads, training is available. (82) Please **check out our website to learn more** about our open positions. We can't wait to work with you.", "vi": "Nếu bạn chưa có kinh nghiệm chở hàng quá khổ, chúng tôi có đào tạo. Hãy xem website để biết thêm về các vị trí đang tuyển. Rất mong được làm việc cùng bạn."}], "qs": [{"n": 80, "q": "What is the purpose of the advertisement?", "qvi": "Mục đích của quảng cáo là gì?", "opts": [{"t": "To announce a contest", "vi": "Thông báo cuộc thi"}, {"t": "To promote an upcoming sale", "vi": "Quảng bá đợt giảm giá"}, {"t": "To introduce new services", "vi": "Giới thiệu dịch vụ mới"}, {"t": "To recruit employees", "vi": "Tuyển nhân viên"}], "ans": ["D"], "key": "looking for drivers to join our team → recruit employees", "ex": "\"looking for experienced truck drivers to join our team\" → tuyển dụng (recruit)."}, {"n": 81, "q": "How is the speaker's company different from its competitors?", "qvi": "Công ty khác các đối thủ ở điểm nào?", "opts": [{"t": "It is dependable.", "vi": "Đáng tin cậy."}, {"t": "It produces innovative products.", "vi": "Sản phẩm sáng tạo."}, {"t": "It offers flexible schedules.", "vi": "Giờ làm linh hoạt."}, {"t": "It pays employees well.", "vi": "Trả lương cao."}], "ans": ["C"], "key": "the only company … determine their own work hours → flexible schedules", "ex": "\"the only company in the region\" = điểm khác đối thủ; \"tự chọn giờ làm\" = flexible schedules."}, {"n": 82, "q": "What does the speaker encourage the listeners to do?", "qvi": "Người nói khuyến khích người nghe làm gì?", "opts": [{"t": "Complete a survey", "vi": "Làm khảo sát"}, {"t": "Fill out an application", "vi": "Điền đơn ứng tuyển"}, {"t": "Place an order", "vi": "Đặt hàng"}, {"t": "Get more information", "vi": "Tìm hiểu thêm thông tin"}], "ans": ["D"], "key": "check out our website to learn more → get more information", "ex": "\"check out our website to learn more\" → tìm hiểu thêm. (B) bẫy hợp ngữ cảnh tuyển dụng nhưng bài không nói điền đơn."}]}, {"title": "Bài nói 83–85 · Tin nhắn thoại · Nhà hàng lên TV", "audio": "../../audio/amk5/c83.mp3", "script": [{"sp": "", "t": "Hi, Jinyu. I have some exciting news. (83) The Farmer's Table **television program wants to feature our restaurant** in an upcoming episode. They'll be coming on Wednesday to film everyone at work in the kitchen during our dinner service.", "vi": "Chào Jinyu. Tôi có tin vui. Chương trình truyền hình The Farmer's Table muốn giới thiệu nhà hàng mình trong một tập sắp tới. Thứ Tư họ sẽ đến quay mọi người làm việc trong bếp giờ phục vụ bữa tối."}, {"sp": "", "t": "Since you're the executive chef, (84) I'll need you to **come in earlier than usual** to get everything prepped and set up.", "vi": "Vì anh là bếp trưởng, tôi cần anh đến sớm hơn mọi khi để chuẩn bị và sắp xếp mọi thứ."}, {"sp": "", "t": "And just as a reminder, (85) I'm still planning to be out of town next week for the **Springdale Pastry and Dessert Festival**. Thanks.", "vi": "Và nhắc lại là tuần sau tôi vẫn định đi vắng để dự Lễ hội Bánh ngọt và Tráng miệng Springdale. Cảm ơn."}], "qs": [{"n": 83, "q": "What is the message mainly about?", "qvi": "Tin nhắn chủ yếu nói về điều gì?", "opts": [{"t": "Revising a restaurant menu", "vi": "Sửa thực đơn"}, {"t": "Filming for a television show", "vi": "Quay phim cho chương trình TV"}, {"t": "Launching an advertising campaign", "vi": "Mở chiến dịch quảng cáo"}, {"t": "Renovating a kitchen", "vi": "Sửa sang nhà bếp"}], "ans": ["B"], "key": "television program, film → filming for a television show", "ex": "Chương trình TV muốn giới thiệu nhà hàng và sẽ đến quay (film) → quay phim cho chương trình TV."}, {"n": 84, "q": "What does the speaker ask the listener to do on Wednesday?", "qvi": "Người nói nhờ người nghe làm gì vào thứ Tư?", "opts": [{"t": "Come to work early", "vi": "Đi làm sớm"}, {"t": "Experiment with new ingredients", "vi": "Thử nguyên liệu mới"}, {"t": "Train an employee", "vi": "Đào tạo nhân viên"}, {"t": "Prepare for a safety inspection", "vi": "Chuẩn bị kiểm tra an toàn"}], "ans": ["A"], "key": "come in earlier than usual → come to work early", "ex": "\"come in earlier than usual\" = đi làm sớm."}, {"n": 85, "q": "Where will the speaker go next week?", "qvi": "Tuần sau người nói sẽ đi đâu?", "opts": [{"t": "To a food festival", "vi": "Lễ hội ẩm thực"}, {"t": "To a cooking class", "vi": "Lớp nấu ăn"}, {"t": "To a farmers market", "vi": "Chợ nông sản"}, {"t": "To a bakery opening", "vi": "Khai trương tiệm bánh"}], "ans": ["A"], "key": "Pastry and Dessert Festival → a food festival", "ex": "Lễ hội bánh ngọt và tráng miệng là một lễ hội ẩm thực. (C) bẫy: tên chương trình \"Farmer's Table\" có chữ farmer."}]}, {"title": "Bài nói 86–88 · Bản tin · Nhà máy pin xe điện", "audio": "../../audio/amk5/c86.mp3", "script": [{"sp": "", "t": "Good evening and thank you for watching Channel 4 News. I'm here in Rockville, a suburb in the metropolitan area. (86) Rockville was recently chosen as the site of a multi-million dollar **electric vehicle battery factory**.", "vi": "Chào buổi tối, cảm ơn quý vị đã theo dõi Bản tin Kênh 4. Tôi đang ở Rockville, một vùng ngoại ô của thành phố. Rockville vừa được chọn làm nơi xây nhà máy pin xe điện trị giá hàng triệu đô."}, {"sp": "", "t": "This project promises to bring thousands of jobs, both directly and indirectly, to the surrounding community. At a recent well attended public comment meeting, residents had a chance to voice any opposition to the project. (87) **No one made any comments.**", "vi": "Dự án hứa hẹn mang lại hàng nghìn việc làm trực tiếp và gián tiếp cho cộng đồng xung quanh. Tại buổi họp lấy ý kiến người dân gần đây, rất đông người dự, người dân có cơ hội nêu ý kiến phản đối dự án. Không ai lên tiếng cả."}, {"sp": "", "t": "To learn more about this exciting development, (88) **artist-rendered images** of the project are on display at the City Hall Building.", "vi": "Để tìm hiểu thêm về dự án thú vị này, các hình ảnh phối cảnh do họa sĩ vẽ đang được trưng bày ở Tòa thị chính."}], "qs": [{"n": 86, "q": "What is the speaker mainly discussing?", "qvi": "Người nói chủ yếu nói về điều gì?", "opts": [{"t": "A job fair", "vi": "Hội chợ việc làm"}, {"t": "A factory", "vi": "Một nhà máy"}, {"t": "Some traffic patterns", "vi": "Tình hình giao thông"}, {"t": "A prototype electric vehicle", "vi": "Mẫu xe điện thử nghiệm"}], "ans": ["B"], "key": "battery factory → a factory", "ex": "Chủ đề: nhà máy pin xe điện. (A) bẫy: có nhắc \"jobs\". (D) bẫy: có \"electric vehicle\" nhưng nói về nhà máy pin, không phải mẫu xe."}, {"n": 87, "q": "What does the speaker imply when he says, \"No one made any comments\"?", "qvi": "Người nói ngụ ý gì khi nói \"Không ai nêu ý kiến\"?", "opts": [{"t": "Few people were in attendance.", "vi": "Ít người tham dự."}, {"t": "Another meeting will be scheduled.", "vi": "Sẽ có một cuộc họp khác."}, {"t": "A project has community support.", "vi": "Dự án được cộng đồng ủng hộ."}, {"t": "A public comment period has ended.", "vi": "Thời gian lấy ý kiến đã kết thúc."}], "ans": ["C"], "key": "chance to voice opposition + no one commented → community support", "ex": "Người dân được mời nêu ý kiến PHẢN ĐỐI nhưng không ai lên tiếng → không ai phản đối = ủng hộ. (A) sai: buổi họp \"well attended\" (đông người dự)."}, {"n": 88, "q": "What can the public view at the city hall building?", "qvi": "Công chúng có thể xem gì ở Tòa thị chính?", "opts": [{"t": "An official contract", "vi": "Hợp đồng chính thức"}, {"t": "Some images", "vi": "Một số hình ảnh"}, {"t": "A list of companies", "vi": "Danh sách công ty"}, {"t": "Some facts about local politicians", "vi": "Thông tin về chính trị gia"}], "ans": ["B"], "key": "artist-rendered images → some images", "ex": "\"artist-rendered images … are on display at the City Hall\" → hình ảnh."}]}, {"title": "Bài nói 89–91 · Quảng cáo · Khay sắp xếp bàn làm việc", "audio": "../../audio/amk5/c89.mp3", "script": [{"sp": "", "t": "Tired of losing things on your desk because it's too cluttered? If so, (89) the Optimum Space **Organizer** is the perfect product for you. Designed with office employees like you in mind, this product can make even the messiest of desks look neat again.", "vi": "Bạn mệt vì hay thất lạc đồ trên bàn vì quá bừa bộn? Nếu vậy, khay sắp xếp Optimum Space là sản phẩm hoàn hảo cho bạn. Được thiết kế dành cho dân văn phòng như bạn, sản phẩm có thể làm cái bàn bừa bộn nhất trở nên gọn gàng."}, {"sp": "", "t": "Best of all, (90) the organizer **adjusts to any size space** you may have on your desk. It can be as narrow or as wide as you need it to be, within seconds.", "vi": "Tuyệt nhất là khay có thể điều chỉnh vừa mọi khoảng trống trên bàn. Nó có thể hẹp hoặc rộng tùy bạn cần, chỉ trong vài giây."}, {"sp": "", "t": "(91) **If you call in the next 10 minutes**, you'll receive a 30% discount.", "vi": "Nếu bạn gọi trong 10 phút tới, bạn sẽ được giảm 30%."}], "qs": [{"n": 89, "q": "What type of product is being advertised?", "qvi": "Sản phẩm nào đang được quảng cáo?", "opts": [{"t": "A floor lamp", "vi": "Đèn cây"}, {"t": "A bookshelf", "vi": "Kệ sách"}, {"t": "An office chair", "vi": "Ghế văn phòng"}, {"t": "A desk organizer", "vi": "Khay sắp xếp đồ trên bàn"}], "ans": ["D"], "key": "desk + organizer → a desk organizer", "ex": "Sản phẩm là \"Organizer\" giúp bàn làm việc gọn gàng → desk organizer."}, {"n": 90, "q": "What special feature does the speaker emphasize?", "qvi": "Người nói nhấn mạnh tính năng đặc biệt nào?", "opts": [{"t": "It is durable.", "vi": "Bền."}, {"t": "It is adjustable.", "vi": "Điều chỉnh được."}, {"t": "It is easy to assemble.", "vi": "Dễ lắp ráp."}, {"t": "It is available in many colors.", "vi": "Có nhiều màu."}], "ans": ["B"], "key": "adjusts to any size → adjustable", "ex": "\"Best of all\" báo hiệu điểm nổi bật: \"adjusts to any size\" → adjustable (điều chỉnh được)."}, {"n": 91, "q": "How can the listeners receive a discount?", "qvi": "Người nghe được giảm giá bằng cách nào?", "opts": [{"t": "By calling within a time limit", "vi": "Gọi điện trong thời gian giới hạn"}, {"t": "By entering an e-mail address", "vi": "Nhập địa chỉ e-mail"}, {"t": "By referring a product to a friend", "vi": "Giới thiệu cho bạn bè"}, {"t": "By using a mobile phone application", "vi": "Dùng ứng dụng điện thoại"}], "ans": ["A"], "key": "call in the next 10 minutes → calling within a time limit", "ex": "\"If you call in the next 10 minutes\" → gọi trong thời gian giới hạn."}]}, {"title": "Bài nói 92–94 · Podcast nấu ăn", "audio": "../../audio/amk5/c92.mp3", "script": [{"sp": "", "t": "Thanks for listening to this episode of Fabulous Foods. (92) **Every week we discuss a different vegetable** and ways to cook with it to maximize flavor.", "vi": "Cảm ơn bạn đã nghe tập Fabulous Foods này. Mỗi tuần chúng tôi bàn về một loại rau củ khác nhau và cách nấu để món ăn ngon nhất."}, {"sp": "", "t": "Now, before we get started, I'm excited to announce that I've been collaborating with Cartwell Kitchen Supplies to develop a new line of cookware. It'll be released in November, but **it's available for pre-order right now**. Keep in mind, (93) **this product line will not be available for long**.", "vi": "Trước khi bắt đầu, tôi rất vui thông báo tôi đã hợp tác với Cartwell Kitchen Supplies làm một dòng dụng cụ nấu ăn mới. Tháng 11 sẽ ra mắt, nhưng giờ đã đặt trước được rồi. Nhớ nhé, dòng sản phẩm này sẽ không bán lâu đâu."}, {"sp": "", "t": "Okay, let's move on to our program. With us today is renowned chef Rebecca Murray, to talk about this week's vegetable, eggplant. (94) Rebecca recently **launched a vegetarian restaurant** in New York that is getting rave reviews so far.", "vi": "Giờ vào chương trình. Hôm nay có đầu bếp nổi tiếng Rebecca Murray nói về loại rau tuần này: cà tím. Rebecca vừa mở một nhà hàng chay ở New York đang được khen hết lời."}], "qs": [{"n": 92, "q": "According to the speaker, what is the purpose of the podcast?", "qvi": "Theo người nói, mục đích của podcast là gì?", "opts": [{"t": "To discuss the restaurant industry", "vi": "Bàn về ngành nhà hàng"}, {"t": "To review new cooking equipment", "vi": "Đánh giá dụng cụ nấu ăn mới"}, {"t": "To share information about nutrition", "vi": "Chia sẻ thông tin dinh dưỡng"}, {"t": "To showcase individual ingredients", "vi": "Giới thiệu từng loại nguyên liệu"}], "ans": ["D"], "key": "every week a different vegetable → showcase individual ingredients", "ex": "Mỗi tuần giới thiệu một loại rau củ → giới thiệu từng nguyên liệu (ingredient). (B) bẫy: có nhắc cookware nhưng đó là quảng cáo xen giữa."}, {"n": 93, "q": "Why does the speaker say, \"this product line will not be available for long\"?", "qvi": "Vì sao người nói nói \"dòng sản phẩm này sẽ không bán lâu\"?", "opts": [{"t": "To encourage the listeners to place an order", "vi": "Để khuyến khích người nghe đặt hàng"}, {"t": "To apologize to the listeners for a product shortage", "vi": "Để xin lỗi vì thiếu hàng"}, {"t": "To justify a high price", "vi": "Để giải thích giá cao"}, {"t": "To criticize a business decision", "vi": "Để chê một quyết định kinh doanh"}], "ans": ["A"], "key": "available for pre-order now + not for long → encourage to order", "ex": "Ngay trước đó: \"đặt trước được rồi\". Nói \"không bán lâu\" là để giục người nghe đặt hàng sớm."}, {"n": 94, "q": "According to the speaker, what did Rebecca Murray recently do?", "qvi": "Theo người nói, gần đây Rebecca Murray đã làm gì?", "opts": [{"t": "She published a cookbook.", "vi": "Xuất bản sách nấu ăn"}, {"t": "She launched a culinary training course.", "vi": "Mở khóa học nấu ăn"}, {"t": "She opened a restaurant.", "vi": "Mở một nhà hàng"}, {"t": "She traveled abroad.", "vi": "Đi du lịch nước ngoài"}], "ans": ["C"], "key": "launched a restaurant → opened a restaurant", "ex": "launched = opened (mở)."}]}, {"title": "Bài nói 95–97 · Thông báo ở ga tàu · Bảng giờ", "audio": "../../audio/amk5/c95.mp3", "imgs": ["img/amk5/g95.webp"], "script": [{"sp": "", "t": "Attention passengers. (95) Renovation work to upgrade and modernize our train station is underway. We **apologize for the inconvenience the construction noise** may cause. Please note that regional train schedules are not affected.", "vi": "Hành khách chú ý. Công trình nâng cấp, hiện đại hóa nhà ga đang được thi công. Chúng tôi xin lỗi vì tiếng ồn xây dựng có thể gây phiền. Lưu ý lịch tàu khu vực không bị ảnh hưởng."}, {"sp": "", "t": "Train 133 with service to Washington, D.C. will be arriving shortly. All passengers to Washington please proceed to track 26B. (96) If you **need assistance handling your baggage**, please speak to a ticket agent immediately.", "vi": "Tàu 133 đi Washington D.C. sắp vào ga. Hành khách đi Washington vui lòng ra đường ray 26B. Nếu cần hỗ trợ mang hành lý, vui lòng gặp nhân viên bán vé ngay."}, {"sp": "", "t": "(97) Train 133's **next stop will be Wilmington**, followed by Baltimore, and then Washington, D.C.", "vi": "Ga tiếp theo của tàu 133 là Wilmington, sau đó là Baltimore rồi Washington D.C."}], "qs": [{"n": 95, "q": "Why does the speaker apologize?", "qvi": "Vì sao người nói xin lỗi?", "opts": [{"t": "There is construction noise at the station.", "vi": "Nhà ga có tiếng ồn xây dựng."}, {"t": "There are no more seats available on a train.", "vi": "Tàu hết ghế."}, {"t": "A printed schedule has incorrect information.", "vi": "Lịch in bị sai."}, {"t": "A train service has been delayed.", "vi": "Tàu bị trễ."}], "ans": ["A"], "key": "apologize for the construction noise", "ex": "Nghe thẳng: \"apologize for the inconvenience the construction noise may cause\". (D) sai: lịch tàu không bị ảnh hưởng."}, {"n": 96, "q": "According to the speaker, why may some listeners need to see an agent?", "qvi": "Theo người nói, vì sao một số người cần gặp nhân viên?", "opts": [{"t": "To ask for a refund", "vi": "Để xin hoàn tiền"}, {"t": "To request baggage service", "vi": "Để yêu cầu dịch vụ hành lý"}, {"t": "To purchase a monthly pass", "vi": "Để mua vé tháng"}, {"t": "To arrange a transfer", "vi": "Để sắp xếp chuyển tàu"}], "ans": ["B"], "key": "assistance handling your baggage → baggage service", "ex": "Ai \"cần hỗ trợ mang hành lý\" thì gặp nhân viên → dịch vụ hành lý."}, {"n": 97, "q": "Look at the graphic. When is Train 133 scheduled to arrive at its next stop?", "qvi": "Nhìn bảng. Tàu 133 đến ga tiếp theo lúc mấy giờ?", "opts": [{"t": "At 10:45 A.M.", "vi": "10:45 sáng"}, {"t": "At 12:05 P.M.", "vi": "12:05 trưa"}, {"t": "At 1:00 PM.", "vi": "1:00 chiều"}, {"t": "At 1:30 P.M.", "vi": "1:30 chiều"}], "ans": ["B"], "key": "next stop Wilmington → 12:05 P.M.", "ex": "Ga tiếp theo là Wilmington. Trong bảng, Wilmington = 12:05 P.M. (C) 1:00 là giờ đến Baltimore, ga sau nữa."}]}, {"title": "Bài nói 98–100 · Họp báo sân bay · Bản đồ", "audio": "../../audio/amk5/c98.mp3", "imgs": ["img/amk5/g98.webp"], "script": [{"sp": "", "t": "Hello, everyone. I'm Carmen Salazar, the Airport Operations Director, and (98) I wanted to thank you for attending this **press conference**.", "vi": "Xin chào mọi người. Tôi là Carmen Salazar, Giám đốc Điều hành Sân bay, cảm ơn các bạn đã đến dự buổi họp báo này."}, {"sp": "", "t": "As of this week, construction on the new regional airport is proceeding on schedule for two of the three terminals. (99) Minor design adjustments to **Terminal A** have put the project slightly behind schedule, and we anticipate about two months will be added to the construction timeframe as a result.", "vi": "Tính đến tuần này, việc xây sân bay khu vực mới đang đúng tiến độ ở hai trong ba nhà ga. Một vài điều chỉnh thiết kế nhỏ ở Nhà ga A làm dự án hơi chậm, và chúng tôi dự kiến thời gian xây sẽ kéo dài thêm khoảng hai tháng."}, {"sp": "", "t": "I'd also like to mention that (100) we now have a **3D printed model** of this project. Please feel free to visit our website so you can view it.", "vi": "Tôi cũng muốn nói là giờ chúng tôi có mô hình in 3D của dự án. Mời các bạn vào website để xem."}], "qs": [{"n": 98, "q": "Who most likely are the listeners?", "qvi": "Người nghe có lẽ là ai?", "opts": [{"t": "Civil engineers", "vi": "Kỹ sư xây dựng"}, {"t": "Urban planners", "vi": "Nhà quy hoạch đô thị"}, {"t": "News reporters", "vi": "Phóng viên"}, {"t": "Safety inspectors", "vi": "Thanh tra an toàn"}], "ans": ["C"], "key": "press conference → news reporters", "ex": "Họp báo (press conference) → người dự là phóng viên. (A), (B) bẫy liên tưởng tới xây dựng."}, {"n": 99, "q": "Look at the graphic. Which of the following companies will be affected by a delay?", "qvi": "Nhìn bản đồ. Hãng nào sẽ bị ảnh hưởng do chậm tiến độ?", "opts": [{"t": "Selca Air", "vi": "Selca Air"}, {"t": "Trilco Airlines", "vi": "Trilco Airlines"}, {"t": "Heathson Airways", "vi": "Heathson Airways"}, {"t": "Bluxtin Airlines", "vi": "Bluxtin Airlines"}], "ans": ["A"], "key": "Terminal A → Gristar Airlines, Selca Air", "ex": "Nhà ga A bị chậm. Trên bản đồ, Terminal A có Gristar Airlines và Selca Air → chọn Selca Air."}, {"n": 100, "q": "What does the speaker invite the listeners to do?", "qvi": "Người nói mời người nghe làm gì?", "opts": [{"t": "Download some designs", "vi": "Tải bản thiết kế"}, {"t": "Look at a model", "vi": "Xem mô hình"}, {"t": "Take a site tour", "vi": "Tham quan công trường"}, {"t": "View a Webcam", "vi": "Xem webcam"}], "ans": ["B"], "key": "3D printed model … view it → look at a model", "ex": "Mời vào website để xem mô hình in 3D → look at a model. (A), (D) có liên quan website nhưng sai thứ để xem."}]}], "recap": "<h2>Ghi nhớ sau bài<\/h2><p><b>Paraphrase:<\/b> customer for over 10 years → loyal customer (72), hear your thoughts → give feedback (73), guarantee to replace → warranty (76), looking for drivers → recruit (80), determine own hours → flexible schedules (81), learn more → get more information (82), launched → opened (94), press conference → reporters (98).<\/p><p><b>Câu ý định:<\/b> 79 (phải về trưa → hôm nay không làm hết), 87 (không ai phản đối → được ủng hộ), 93 (không bán lâu → mau đặt hàng).<\/p><p><b>Look at the graphic:<\/b> 97 (next stop Wilmington → 12:05), 99 (Terminal A → Selca Air).<\/p>", "exam": "TOEIC-A-MOCK5", "examSrc": "/toeica-mocktest/"};</script>
