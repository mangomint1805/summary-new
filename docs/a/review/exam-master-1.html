<script>window.MT={"vocab": [["apron", "n", "/ˈeɪprən/", "tạp dề", "He's wearing a cloth apron."], ["bulletin board", "n", "/ˈbʊlətɪn bɔːrd/", "bảng tin", "She is looking at a post on a bulletin board."], ["prop open", "v", "/prɑːp ˈoʊpən/", "chống (cửa) mở", "A door has been propped open."], ["take an order", "v phr", "/teɪk ən ˈɔːrdər/", "ghi món, nhận đơn", "A server is taking an order."], ["lean against", "v", "/liːn əˈɡenst/", "dựa vào, tựa vào", "Some equipment is leaning against a truck."], ["shipment", "n", "/ˈʃɪpmənt/", "lô hàng", "How many shipments are we sending out every day?"], ["invoice", "n", "/ˈɪnvɔɪs/", "hoá đơn", "The invoice will be ready this afternoon."], ["doorstep", "n", "/ˈdɔːrstep/", "bậc cửa, tận cửa nhà", "We deliver meals to your doorstep."], ["paperless billing", "n", "/ˈpeɪpərləs ˈbɪlɪŋ/", "hoá đơn điện tử", "Thank you for selecting paperless billing."], ["merger", "n", "/ˈmɜːrdʒər/", "sự sáp nhập", "The meeting will focus on the upcoming merger."]], "n": "aem1", "part": 0, "partName": "Part 1 · Part 2 · Part 5, 6", "sub": "Đề luyện thi · Part 1 (6 câu) · Part 2 (25 câu) · Part 5 (30 câu) · Part 6 (16 câu)", "intro": "Trang này có <b>file nghe</b> và <b>chữa bài</b> đề luyện trên lớp buổi <b>Exam Master 1</b> (giáo trình trang 75–86) – đúng 4 phần của bài thi giữa kỳ. <b>Cách học:</b> câu nghe thì bấm nghe → tự chọn (chữ đáp án được ẩn giống đề thật) → xem dịch và giải thích. Câu đọc thì chọn đáp án rồi xem vì sao đúng, vì sao sai. Câu nào sai nhớ ghi vào <b>Error Log</b> nha.", "stepsTitle": "Nhắc lại chiến lược", "steps": ["<b>Part 1 – S.E.A:</b> nhìn tranh trước khi nghe: Setting (ở đâu), Entity (ai, cái gì), Activity (đang làm gì). Tranh không người → hay dùng <i>has been + V3</i>; <i>is being + V3</i> chỉ đúng khi có người đang làm việc đó.", "<b>Part 2 – U.U.U:</b> nghe thật kỹ 3–4 từ đầu. Wh- không trả lời Yes/No; đáp án lặp từ / giống âm thường là bẫy; trả lời gián tiếp (\"hỏi quản lý\", \"tôi có cuốn khác\") thường đúng.", "<b>Part 5, 6 – C.E.P:</b> nhìn 4 đáp án để phân loại (từ loại, thì, liên từ, từ vựng) → tìm dấu hiệu trong câu → chọn. Part 6 câu điền câu: đọc câu trước và câu sau chỗ trống.", "<b>TOEIC Error Log:</b> câu nào sai thì ghi vào sổ 4 cột: <i>Câu – Dạng câu – Vì sao mình sai – Ghi nhớ</i>. Xem lại sổ trước buổi Exam Master 2 và bài giữa kỳ."], "groups": [{"title": "Part 1 · Câu 1", "tag": "Tranh 1 người · hành động", "audio": "../../audio/aem1/p1-1.mp3", "imgs": ["img/em1/p1.webp"], "hideOpts": true, "qs": [{"n": 1, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "He's untying a cloth apron.", "vi": "Anh ấy đang cởi tạp dề vải."}, {"t": "He's setting a plastic bin on a shelf.", "vi": "Anh ấy đang đặt thùng nhựa lên kệ."}, {"t": "He's using a knife to slice some food.", "vi": "Anh ấy đang dùng dao cắt đồ ăn."}, {"t": "He's putting some groceries in a drawer.", "vi": "Anh ấy đang cất đồ tạp hoá vào ngăn kéo."}], "ans": ["C"], "key": "using a knife to slice", "ex": "Anh ấy đeo tạp dề và đang cầm dao cắt đồ ăn → (C). (A) bẫy: có tạp dề nhưng anh ấy không cởi (untying). (B), (D) không có thùng nhựa / ngăn kéo.", "label": "1"}]}, {"title": "Part 1 · Câu 2", "tag": "Tranh 1 người · hành động", "audio": "../../audio/aem1/p1-2.mp3", "imgs": ["img/em1/p2.webp"], "hideOpts": true, "qs": [{"n": 2, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "She's fixing her sunglasses.", "vi": "Cô ấy đang chỉnh kính râm."}, {"t": "She's resting her hand on a bench.", "vi": "Cô ấy đang đặt tay lên ghế băng."}, {"t": "She's reaching into a handbag.", "vi": "Cô ấy đang thò tay vào túi xách."}, {"t": "She's talking on the phone.", "vi": "Cô ấy đang nói chuyện điện thoại."}], "ans": ["D"], "key": "talking on the phone", "ex": "Cô ấy ngồi ghế đá, cầm điện thoại áp tai → (D). (A) đang đeo kính chứ không chỉnh (fixing). (B) tay cầm điện thoại, không đặt trên ghế.", "label": "2"}]}, {"title": "Part 1 · Câu 3", "tag": "Tranh nhiều người · \"One of the…\"", "audio": "../../audio/aem1/p1-3.mp3", "imgs": ["img/em1/p3.webp"], "hideOpts": true, "qs": [{"n": 3, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "One of the women is leaning over a trash can.", "vi": "Một người phụ nữ đang cúi người trên thùng rác."}, {"t": "One of the women is looking at a post on a bulletin board.", "vi": "Một người phụ nữ đang xem tờ giấy trên bảng tin."}, {"t": "One of the women is standing next to an entrance.", "vi": "Một người phụ nữ đang đứng cạnh lối vào."}, {"t": "One of the women is counting money from a machine.", "vi": "Một người phụ nữ đang đếm tiền từ máy."}], "ans": ["B"], "key": "looking at a post on a bulletin board", "ex": "Người phụ nữ phía sau đang nhìn tờ giấy dán trên bảng tin → (B). (A) bẫy: người phía trước cúi người nhưng là vào máy photocopy, không phải thùng rác. (D) có máy nhưng không phải máy tiền.", "label": "3"}]}, {"title": "Part 1 · Câu 4", "tag": "Tranh không người · has been + V3", "audio": "../../audio/aem1/p1-4.mp3", "imgs": ["img/em1/p4.webp"], "hideOpts": true, "qs": [{"n": 4, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "A car has been parked beside a building.", "vi": "Một chiếc xe hơi được đỗ cạnh toà nhà."}, {"t": "A door has been propped open.", "vi": "Một cánh cửa được chống mở ra."}, {"t": "There's a sign posted on a fence.", "vi": "Có một tấm biển dán trên hàng rào."}, {"t": "Some plants have been arranged in a row.", "vi": "Vài chậu cây được xếp thành hàng."}], "ans": ["A"], "key": "has been parked beside a building", "ex": "Bên trái có chiếc xe đỗ cạnh toà nhà → (A). (B) bẫy: cánh cửa đang đóng, không bị chống mở. (C) biển ở trên tường cạnh cửa, không ở hàng rào. (D) chỉ có một bụi cây.", "label": "4"}]}, {"title": "Part 1 · Câu 5", "tag": "Tranh nhiều người · hành động", "audio": "../../audio/aem1/p1-5.mp3", "imgs": ["img/em1/p5.webp"], "hideOpts": true, "qs": [{"n": 5, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "Some light fixtures are being installed.", "vi": "Đèn đang được lắp đặt."}, {"t": "A display case is being wiped.", "vi": "Tủ trưng bày đang được lau."}, {"t": "A server is distributing menus.", "vi": "Người phục vụ đang phát thực đơn."}, {"t": "A server is taking an order.", "vi": "Người phục vụ đang ghi món."}], "ans": ["D"], "key": "taking an order", "ex": "Người phục vụ đứng cầm sổ và bút ghi món cho khách → (D). (C) bẫy: khách đang cầm thực đơn, nhưng phục vụ không phát thực đơn. (A), (B) is being + V3 cần có người đang làm việc đó.", "label": "5"}]}, {"title": "Part 1 · Câu 6", "tag": "Tranh 1 người + đồ vật", "audio": "../../audio/aem1/p1-6.mp3", "imgs": ["img/em1/p6.webp"], "hideOpts": true, "qs": [{"n": 6, "q": "Chọn câu mô tả đúng nhất bức tranh.", "qvi": "", "opts": [{"t": "A vehicle is covered in snow.", "vi": "Chiếc xe bị tuyết phủ kín."}, {"t": "Some equipment is leaning against a truck.", "vi": "Vài dụng cụ đang dựng tựa vào xe tải."}, {"t": "He's driving a vehicle through some snow.", "vi": "Anh ấy đang lái xe qua tuyết."}, {"t": "He's closing the back of a truck.", "vi": "Anh ấy đang đóng thùng sau xe tải."}], "ans": ["B"], "key": "leaning against a truck", "ex": "Ván trượt và gậy trượt tuyết dựng tựa vào xe bán tải → (B). (A) có tuyết dưới đất nhưng xe không bị phủ. (C) anh ấy đứng, không lái xe. (D) không đóng thùng xe.", "label": "6"}]}, {"title": "Part 2 · Câu 7", "tag": "Why", "audio": "../../audio/aem1/p2-7.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Why is this restaurant so popular?", "vi": "Sao nhà hàng này đông khách vậy?"}], "qs": [{"n": 7, "q": "", "qvi": "", "opts": [{"t": "A table for five, please.", "vi": "Cho một bàn năm người."}, {"t": "On the corner of Fourth and Main.", "vi": "Ở góc đường số 4 và đường Main."}, {"t": "Because they hired a new chef.", "vi": "Vì họ mới thuê đầu bếp mới."}], "ans": ["C"], "key": "", "ex": "Why → lý do: \"Because…\" (C). (A) liên tưởng nhà hàng; (B) trả lời Where.", "label": "7"}]}, {"title": "Part 2 · Câu 8", "tag": "When", "audio": "../../audio/aem1/p2-8.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "When does the park close?", "vi": "Công viên đóng cửa lúc mấy giờ?"}], "qs": [{"n": 8, "q": "", "qvi": "", "opts": [{"t": "I parked over there.", "vi": "Tôi đỗ xe ở đằng kia."}, {"t": "The bank's already closed.", "vi": "Ngân hàng đóng cửa rồi."}, {"t": "Every night at eight.", "vi": "Mỗi tối lúc tám giờ."}], "ans": ["C"], "key": "", "ex": "When → thời gian (C). (A) bẫy âm park/parked; (B) lặp từ closed.", "label": "8"}]}, {"title": "Part 2 · Câu 9", "tag": "Which", "audio": "../../audio/aem1/p2-9.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Which house did Ms. Lopez move into?", "vi": "Cô Lopez dọn vào căn nhà nào?"}], "qs": [{"n": 9, "q": "", "qvi": "", "opts": [{"t": "A real estate agent.", "vi": "Một người môi giới nhà đất."}, {"t": "Leave the box at the door, please.", "vi": "Để cái thùng ở cửa giúp tôi."}, {"t": "The yellow one down the street.", "vi": "Căn màu vàng cuối đường."}], "ans": ["C"], "key": "", "ex": "Which house → chỉ ra căn nào: \"the yellow one\" (C). (A), (B) liên tưởng chuyển nhà.", "label": "9"}]}, {"title": "Part 2 · Câu 10", "tag": "How · trả lời gián tiếp", "audio": "../../audio/aem1/p2-10.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Excuse me, how do I get to platform six?", "vi": "Xin lỗi, đi tới sân ga số 6 thế nào ạ?"}], "qs": [{"n": 10, "q": "", "qvi": "", "opts": [{"t": "There's a map over there on the wall.", "vi": "Có bản đồ trên tường đằng kia."}, {"t": "Because it's only 50 cents.", "vi": "Vì nó chỉ 50 xu."}, {"t": "An office downtown.", "vi": "Một văn phòng ở trung tâm."}], "ans": ["A"], "key": "", "ex": "Hỏi đường → chỉ chỗ có bản đồ (gián tiếp) (A). (B) trả lời Why.", "label": "10"}]}, {"title": "Part 2 · Câu 11", "tag": "Who", "audio": "../../audio/aem1/p2-11.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Who's responsible for ordering equipment?", "vi": "Ai phụ trách đặt mua thiết bị?"}], "qs": [{"n": 11, "q": "", "qvi": "", "opts": [{"t": "A long time ago.", "vi": "Lâu rồi."}, {"t": "In the storage closet.", "vi": "Trong tủ kho."}, {"t": "That's Robert's job.", "vi": "Đó là việc của Robert."}], "ans": ["C"], "key": "", "ex": "Who → người: Robert (C). (A) trả lời When; (B) trả lời Where.", "label": "11"}]}, {"title": "Part 2 · Câu 12", "tag": "What · trả lời gián tiếp", "audio": "../../audio/aem1/p2-12.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "What was wrong with the refrigerator?", "vi": "Cái tủ lạnh bị gì vậy?"}], "qs": [{"n": 12, "q": "", "qvi": "", "opts": [{"t": "On the right side of the road.", "vi": "Ở bên phải đường."}, {"t": "The technician left a report.", "vi": "Thợ kỹ thuật có để lại báo cáo."}, {"t": "Yeah, it's a good recipe!", "vi": "Ừ, công thức ngon đấy!"}], "ans": ["B"], "key": "", "ex": "Không nói thẳng lỗi gì mà bảo xem báo cáo của thợ (B). (A) bẫy right/wrong; (C) Wh- không trả lời Yeah.", "label": "12"}]}, {"title": "Part 2 · Câu 13", "tag": "Câu trần thuật · nhờ vả", "audio": "../../audio/aem1/p2-13.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "This document needs a signature before it's sent out.", "vi": "Tài liệu này cần chữ ký trước khi gửi đi."}], "qs": [{"n": 13, "q": "", "qvi": "", "opts": [{"t": "A total of fifteen pages.", "vi": "Tổng cộng mười lăm trang."}, {"t": "OK, I'll do that now.", "vi": "Được, tôi làm ngay."}, {"t": "A book of stamps.", "vi": "Một tập tem."}], "ans": ["B"], "key": "", "ex": "Câu trần thuật ngụ ý nhờ ký → đồng ý làm ngay (B). (A), (C) liên tưởng tài liệu / gửi thư.", "label": "13"}]}, {"title": "Part 2 · Câu 14", "tag": "Why", "audio": "../../audio/aem1/p2-14.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Why do you have so much luggage?", "vi": "Sao bạn mang nhiều hành lý vậy?"}], "qs": [{"n": 14, "q": "", "qvi": "", "opts": [{"t": "Here are your tickets.", "vi": "Vé của bạn đây."}, {"t": "Because I'll be travelling for six months.", "vi": "Vì tôi sẽ đi xa sáu tháng."}, {"t": "When the taxi gets here.", "vi": "Khi taxi tới."}], "ans": ["B"], "key": "", "ex": "Why → Because (B). (A), (C) liên tưởng đi du lịch.", "label": "14"}]}, {"title": "Part 2 · Câu 15", "tag": "Câu hỏi đuôi xác nhận", "audio": "../../audio/aem1/p2-15.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "You must be the new sales director, right?", "vi": "Chắc anh là giám đốc kinh doanh mới, phải không?"}], "qs": [{"n": 15, "q": "", "qvi": "", "opts": [{"t": "Yes, it's nice to meet you.", "vi": "Vâng, rất vui được gặp chị."}, {"t": "Sorry, I don't have the directions.", "vi": "Xin lỗi, tôi không có chỉ dẫn đường."}, {"t": "It's our year-end sale.", "vi": "Đó là đợt giảm giá cuối năm."}], "ans": ["A"], "key": "", "ex": "Câu xác nhận → Yes + chào hỏi (A). (B) bẫy âm director/directions; (C) bẫy sales/sale.", "label": "15"}]}, {"title": "Part 2 · Câu 16", "tag": "Câu hỏi lựa chọn", "audio": "../../audio/aem1/p2-16.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Are you running the workshop in the morning or in the afternoon?", "vi": "Bạn tổ chức hội thảo vào buổi sáng hay buổi chiều?"}], "qs": [{"n": 16, "q": "", "qvi": "", "opts": [{"t": "That was a long race.", "vi": "Đó là một cuộc đua dài."}, {"t": "Attendees are arriving after lunch.", "vi": "Người tham dự sẽ đến sau bữa trưa."}, {"t": "Yes, I actually enjoy shopping.", "vi": "Vâng, tôi khá thích mua sắm."}], "ans": ["B"], "key": "", "ex": "Chọn A hay B → \"after lunch\" = buổi chiều, trả lời gián tiếp (B). (A) bẫy running/race; (C) câu lựa chọn không trả lời Yes.", "label": "16"}]}, {"title": "Part 2 · Câu 17", "tag": "When · trả lời gián tiếp", "audio": "../../audio/aem1/p2-17.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "When should I return your book?", "vi": "Khi nào tôi nên trả sách cho bạn?"}], "qs": [{"n": 17, "q": "", "qvi": "", "opts": [{"t": "Actually, I have another copy.", "vi": "Thật ra tôi có cuốn khác rồi."}, {"t": "On page 25.", "vi": "Ở trang 25."}, {"t": "This is a beautiful library.", "vi": "Thư viện này đẹp quá."}], "ans": ["A"], "key": "", "ex": "Không nói thời điểm mà ý \"không cần trả gấp, tôi có cuốn khác\" (A). (B), (C) liên tưởng sách.", "label": "17"}]}, {"title": "Part 2 · Câu 18", "tag": "Where", "audio": "../../audio/aem1/p2-18.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Where can I find the event schedule?", "vi": "Tôi xem lịch sự kiện ở đâu?"}], "qs": [{"n": 18, "q": "", "qvi": "", "opts": [{"t": "Yeah, that's right.", "vi": "Ừ, đúng rồi."}, {"t": "Yesterday afternoon.", "vi": "Chiều hôm qua."}, {"t": "On the conference Web site.", "vi": "Trên trang web của hội nghị."}], "ans": ["C"], "key": "", "ex": "Where → nơi chốn (C). (A) Wh- không trả lời Yeah; (B) trả lời When.", "label": "18"}]}, {"title": "Part 2 · Câu 19", "tag": "Câu trần thuật · đề nghị giúp", "audio": "../../audio/aem1/p2-19.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "I'll be late to the luncheon if I take the eleven o'clock bus.", "vi": "Tôi sẽ trễ bữa tiệc trưa nếu đi xe buýt chuyến 11 giờ."}], "qs": [{"n": 19, "q": "", "qvi": "", "opts": [{"t": "I have room in my car.", "vi": "Xe tôi còn chỗ đấy."}, {"t": "Sure, Heidi can make some now.", "vi": "Được, Heidi có thể làm ít bây giờ."}, {"t": "That'll be five dollars, please.", "vi": "Hết năm đô ạ."}], "ans": ["A"], "key": "", "ex": "Lo bị trễ → đề nghị cho đi nhờ xe (A). (C) liên tưởng tiền vé xe buýt.", "label": "19"}]}, {"title": "Part 2 · Câu 20", "tag": "How many", "audio": "../../audio/aem1/p2-20.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "  "t": "Hasn't Alan seen the doctor yet?", "vi": "Alan vẫn chưa đi khám bác sĩ à?"}], "qs": [{"n": 23, "q": "", "qvi": "", "opts": [{"t": "It's in the medical building.", "vi": "Nó ở trong toà nhà y tế."}, {"t": "He hasn't had any time.", "vi": "Anh ấy chưa có thời gian."}, {"t": "No, we didn't see it.", "vi": "Không, chúng tôi không thấy nó."}], "ans": ["B"], "key": "", "ex": "Chưa khám vì không có thời gian (B). (A) liên tưởng doctor/medical; (C) lặp từ see.", "label": "23"}]}, {"title": "Part 2 · Câu 24", "tag": "Yes/No", "audio": "../../audio/aem1/p2-24.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Did you correct the error in the spreadsheet?", "vi": "Bạn sửa lỗi trong bảng tính chưa?"}], "qs": [{"n": 24, "q": "", "qvi": "", "opts": [{"t": "The bank on Fourteenth Street.", "vi": "Ngân hàng trên đường số 14."}, {"t": "Actually, I fixed a few things.", "vi": "Thật ra tôi đã sửa vài chỗ."}, {"t": "Everyone should get a copy.", "vi": "Mọi người nên có một bản."}], "ans": ["B"], "key": "", "ex": "correct = fix → \"I fixed a few things\" (B).", "label": "24"}]}, {"title": "Part 2 · Câu 25", "tag": "Lời mời · từ chối gián tiếp", "audio": "../../audio/aem1/p2-25.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Don't you want to come with us to the art gallery opening tonight?", "vi": "Tối nay bạn không muốn đi khai trương phòng tranh với tụi mình à?"}], "qs": [{"n": 25, "q": "", "qvi": "", "opts": [{"t": "I have a presentation tomorrow morning.", "vi": "Sáng mai tôi có bài thuyết trình."}, {"t": "The prices are marked on the frames.", "vi": "Giá ghi trên khung tranh."}, {"t": "Leave it closed, please.", "vi": "Cứ để đóng giúp tôi."}], "ans": ["A"], "key": "", "ex": "Từ chối gián tiếp: mai có thuyết trình (A). (B) liên tưởng gallery; (C) bẫy opening/closed.", "label": "25"}]}, {"title": "Part 2 · Câu 26", "tag": "Câu hỏi lựa chọn", "audio": "../../audio/aem1/p2-26.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Does your restaurant buy vegetables from wholesalers or local farmers?", "vi": "Nhà hàng bạn mua rau từ nhà bán sỉ hay nông dân địa phương?"}], "qs": [{"n": 26, "q": "", "qvi": "", "opts": [{"t": "The carrots were overcooked.", "vi": "Cà rốt bị nấu chín quá."}, {"t": "This table seats five people comfortably.", "vi": "Bàn này ngồi thoải mái năm người."}, {"t": "Only from local farmers.", "vi": "Chỉ từ nông dân địa phương."}], "ans": ["C"], "key": "", "ex": "Chọn 1 trong 2 → local farmers (C). (A), (B) liên tưởng nhà hàng / rau.", "label": "26"}]}, {"title": "Part 2 · Câu 27", "tag": "Who · trả lời gián tiếp", "audio": "../../audio/aem1/p2-27.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Who supplies your copy paper?", "vi": "Ai cung cấp giấy photo cho bên bạn?"}], "qs": [{"n": 27, "q": "", "qvi": "", "opts": [{"t": "Under the printer.", "vi": "Dưới máy in."}, {"t": "Check with the office manager.", "vi": "Hỏi chị quản lý văn phòng nhé."}, {"t": "No, I don't have an extra copy.", "vi": "Không, tôi không có bản dư."}], "ans": ["B"], "key": "", "ex": "\"Hỏi quản lý văn phòng\" – không biết nên chỉ người khác (B). (C) lặp từ copy và Wh- không trả lời No.", "label": "27"}]}, {"title": "Part 2 · Câu 28", "tag": "Nhờ vả · đồng ý gián tiếp", "audio": "../../audio/aem1/p2-28.mp3", "hideOpts": true, "scriptLabel": "📜 Câu hỏi + dịch", "script": [{"sp": "Q", "t": "Could you take a look at my article before I submit it?", "vi": "Bạn xem giúp bài viết của tôi trước khi tôi nộp được không?"}], "qs": [{"n": 28, "q": "", "qvi": "", "opts": [{"t": "A magazine subscription.", "vi": "Gói đặt mua tạp chí."}, {"t": "He submitted a payment online.", "vi": "Anh ấy đã thanh toán trực tuyến."}, {"t": "I do have some editing experience.", "vi": "Tôi cũng có chút kinh nghiệm biên tập."}], "ans": ["C"], "key": "", "ex": "Đồng ý gián tiếp: tôi có kinh nghiệm biên tập (C). (B) lặp từ submit.", " ể thưởng thức món ăn yêu thích ngay trong sự thoải mái của ngôi nhà mình, hãy thử Dining-Ticket ngay hôm nay!"}], "qs": [{"n": 62, "q": "Chỗ trống (131)", "qvi": "", "opts": [{"t": "doorstep"}, {"t": "station"}, {"t": "program"}, {"t": "market"}], "ans": ["A"], "key": "Từ vựng", "ex": "deliver … to your doorstep = giao tận cửa nhà.", "label": "131"}, {"n": 63, "q": "Chỗ trống (132)", "qvi": "", "opts": [{"t": "usage"}, {"t": "using"}, {"t": "usable"}, {"t": "users"}], "ans": ["B"], "key": "V-ing", "ex": "start + V-ing; sau chỗ trống có tân ngữ Dining-Ticket nên cần động từ → using.", "label": "132"}, {"n": 64, "q": "Chỗ trống (133)", "qvi": "", "opts": [{"t": "Additional delivery staff are being recruited now."}, {"t": "Your order will be ready for in-store pickup within one hour."}, {"t": "Our training is thorough and fast."}, {"t": "It's as easy as that."}], "ans": ["D"], "key": "Điền câu", "ex": "Ngay sau 3 bước hướng dẫn (enter → filter → track) → \"Chỉ đơn giản vậy thôi\" (D). (B) sai vì dịch vụ giao tận nhà, không phải tới cửa hàng lấy.", "label": "133"}, {"n": 65, "q": "Chỗ trống (134)", "qvi": "", "opts": [{"t": "comforted"}, {"t": "comforting"}, {"t": "comfortable"}, {"t": "comfort"}], "ans": ["D"], "key": "Từ loại", "ex": "Sau \"the\" và trước \"of\" cần danh từ → comfort. Cụm: from the comfort of your own home.", "label": "134"}]}, {"title": "Part 6 · Câu 135–138 · E-mail hoá đơn điện tử", "tag": "E-mail", "passage": ["To: Rashida Willis · From: Customer Accounts · Date: August 4 · Subject: Paperless billing", "Dear Ms. Willis, Thank you for selecting the paperless billing ⟦135⟧ for your Staunton Natural Gas account.", "⟦136⟧ on August 20, you will receive your monthly statement electronically. To ensure receipt of your bill, please add our e-mail address to your list of contacts.", "At any time you may ⟦137⟧ to traditional paper billing by selecting it in your account settings. ⟦138⟧. Your bill will still be due on the first of each month.", "Sincerely, Staunton Natural Gas"], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Kính gửi chị Willis, cảm ơn chị đã chọn hình thức hoá đơn điện tử cho tài khoản Staunton Natural Gas. Bắt đầu từ ngày 20/8, chị sẽ nhận bảng kê hằng tháng qua e-mail. Để chắc chắn nhận được hoá đơn, vui lòng thêm địa chỉ e-mail của chúng tôi vào danh bạ. Bất cứ lúc nào chị cũng có thể quay lại hoá đơn giấy bằng cách chọn trong phần cài đặt tài khoản. Mọi thứ khác trong quy trình thanh toán không thay đổi. Hạn thanh toán vẫn là ngày 1 mỗi tháng."}], "qs": [{"n": 66, "q": "Chỗ trống (135)", "qvi": "", "opts": [{"t": "value"}, {"t": "degree"}, {"t": "project"}, {"t": "option"}], "ans": ["D"], "key": "Từ vựng", "ex": "selecting the paperless billing option = chọn lựa chọn/hình thức hoá đơn điện tử.", "label": "135"}, {"n": 67, "q": "Chỗ trống (136)", "qvi": "", "opts": [{"t": "Until"}, {"t": "Only"}, {"t": "Beginning"}, {"t": "Even"}], "ans": ["C"], "key": "Từ vựng · giới từ thời gian", "ex": "Beginning on August 20 = bắt đầu từ 20/8 (từ đó trở đi nhận hoá đơn điện tử). Until = cho đến khi – sai nghĩa.", "label": "136"}, {"n": 68, "q": "Chỗ trống (137)", "qvi": "", "opts": [{"t": "return"}, {"t": "returnable"}, {"t": "to return"}, {"t": "returning"}], "ans": ["A"], "key": "Động từ khuyết thiếu", "ex": "Sau động từ khuyết thiếu may + V nguyên mẫu → return.", "label": "137"}, {"n": 69, "q": "Chỗ trống (138)", "qvi": "", "opts": [{"t": "The account balance is now overdue."}, {"t": "Nothing else about your billing process has changed."}, {"t": "A company representative will contact you soon."}, {"t": "The account will be closed on the final day of the month."}], "ans": ["B"], "key": "Điền câu", "ex": "Câu sau \"Your bill will STILL be due on the first of each month\" → mọi thứ khác vẫn như cũ (B).", "label": "138"}]}, {"title": "Part 6 · Câu 139–142 · Bản ghi nhớ nội bộ", "tag": "Memo", "passage": ["To: Red Division Sales Team Members · From: Matias Gama, Director · Subject: Information · Date: 22 November · Attachment: Third-quarter results", "Let me commend all of you on your outstanding work this past quarter! See for yourselves in the attached report, which provides all the details. ⟦139⟧, there's always room for growth. That's why we're launching a new ⟦140⟧ program. It will be provided by an outside agency that has carefully ⟦141⟧ our needs.", "Although the learning modules will be offered across the organization, they are scheduled to begin in our division. ⟦142⟧. In the meantime, please carry on with your good work."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Tôi muốn khen ngợi mọi người vì thành tích xuất sắc trong quý vừa qua! Hãy xem báo cáo đính kèm để biết chi tiết. Tuy vậy, luôn còn chỗ để phát triển. Vì thế chúng ta sẽ triển khai một chương trình đào tạo mới, do một đơn vị bên ngoài đã phân tích kỹ nhu cầu của chúng ta cung cấp. Dù các học phần sẽ được áp dụng cho toàn công ty, chúng sẽ bắt đầu ở bộ phận của chúng ta trước. Tôi sẽ sớm báo ngày cụ thể. Trong lúc chờ, mọi người cứ tiếp tục làm tốt nhé."}], "qs": [{"n": 70, "q": "Chỗ trống (139)", "qvi": "", "opts": [{"t": "Similarly"}, {"t": "In that case"}, {"t": "Nevertheless"}, {"t": "Even if"}], "ans": ["C"], "key": "Trạng từ liên kết", "ex": "Câu trước khen kết quả tốt, câu sau \"vẫn còn chỗ để phát triển\" → tương phản: Nevertheless. Even if là liên từ, phải nối mệnh đề.", "label": "139"}, {"n": 71, "q": "Chỗ trống (140)", "qvi": "", "opts": [{"t": "radio"}, {"t": "exercise"}, {"t": "training"}, {"t": "benefits"}], "ans": ["C"], "key": "Từ vựng", "ex": "training program = chương trình đào tạo; câu sau nhắc \"learning modules\".", "label": "140"}, {"n": 72, "q": "Chỗ trống (141)", "qvi": "", "opts": [{"t": "analyzed"}, {"t": "analyzing"}, {"t": "to analyze"}, {"t": "been analyzed"}], "ans": ["A"], "key": "Thì hiện tại hoàn thành", "ex": "has (carefully) + V3 → analyzed. (D) been analyzed là bị động, nhưng sau chỗ trống có tân ngữ our needs.", "label": "141"}, {"n": 73, "q": "Chỗ trống (142)", "qvi": "", "opts": [{"t": "This was our best quarter ever!"}, {"t": "I will let you know the dates soon."}, {"t": "Our clients are very pleased as well."}, {"t": "Registration is now full."}], "ans": ["B"], "key": "Điền câu", "ex": "Câu trước: các học phần \"are scheduled to begin in our division\" → sẽ báo ngày sau (B).", "label": "142"}]}, {"title": "Part 6 · Câu 143–146 · E-mail mời họp", "tag": "E-mail", "passage": ["From: Joanna Markian · To: All management staff · Subject: Meeting with Adacorp leadership · Date: 11 January", "Dear Credulux colleagues, Please be advised that our Wednesday Board of Directors meeting will focus on the ⟦143⟧ company merger with Adacorp Ltd. We will be joined by Adacorp's CEO and several managers as well as members of both companies' legal teams. ⟦144⟧.", "The purpose of this meeting is to clarify the timeline of the merger process. ⟦145⟧ with questions for our Board of Directors will be given ample time to ask them. ⟦146⟧, I would like to request that all nonurgent agenda items be saved for our management team meeting in early February.", "Sincerely, Joanna Markian"], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Kính gửi các đồng nghiệp Credulux, cuộc họp Hội đồng quản trị thứ Tư sẽ tập trung vào việc sáp nhập sắp tới với Adacorp. Tham dự có CEO và một số quản lý của Adacorp, cùng đội pháp lý hai công ty. Mọi người vui lòng sắp xếp dự họp trực tiếp. Mục đích cuộc họp là làm rõ lộ trình sáp nhập. Ai có câu hỏi cho Hội đồng quản trị sẽ có đủ thời gian để hỏi. Vì lý do này, tôi đề nghị mọi nội dung không gấp để dành cho cuộc họp quản lý đầu tháng Hai."}], "qs": [{"n": 74, "q": "Chỗ trống (143)", "qvi": "", "opts": [{"t": "selected"}, {"t": "upcoming"}, {"t": "occasional"}, {"t": "assorted"}], "ans": ["B"], "key": "Từ vựng", "ex": "the upcoming merger = vụ sáp nhập sắp diễn ra.", "label": "143"}, {"n": 75, "q": "Chỗ trống (144)", "qvi": "", "opts": [{"t": "Please plan to attend this meeting in person."}, {"t": "Interns will report on their experience at Adacorp."}, {"t": "Instead, we will extend the meeting by one hour."}, {"t": "You will soon be notified of the new law."}], "ans": ["A"], "key": "Điền câu", "ex": "E-mail gửi quản lý thông báo cuộc họp quan trọng có khách → đề nghị dự trực tiếp (A).", "label": "144"}, {"n": 76, "q": "Chỗ trống (145)", "qvi": "", "opts": [{"t": "Each other"}, {"t": "Yours"}, {"t": "Anyone"}, {"t": "Whoever"}], "ans": ["C"], "key": "Đại từ", "ex": "Anyone with questions = bất kỳ ai có câu hỏi (làm chủ ngữ của will be given). Whoever phải đi với động từ (whoever has questions).", "label": "145"}, {"n": 77, "q": "Chỗ trống (146)", "qvi": "", "opts": [{"t": "On the contrary"}, {"t": "For this reason"}, {"t": "Soon after"}, {"t": "For example"}], "ans": ["B"], "key": "Trạng từ liên kết", "ex": "Vì cuộc họp dành cho lộ trình sáp nhập và hỏi đáp → vì lý do này, dời việc không gấp: For this reason.", "label": "146"}]}], "recap": "<h2>Ghi nhớ sau bài</h2><p>Làm lại các câu sai sau 2–3 ngày, ghi lý do sai vào Error Log. Ôn từ vựng bằng nút <b>🃏 Flashcard</b> ở cuối trang.</p>", "qviAfter": true};</script>
