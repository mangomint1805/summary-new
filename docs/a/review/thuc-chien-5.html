<script>window.MT={"vocab": [["financial risk", "n", "/faɪˈnænʃl rɪsk/", "rủi ro tài chính", "All investments involve some financial risk."], ["market forecast", "n", "/ˈmɑːrkɪt ˈfɔːrkæst/", "dự báo thị trường", "According to the latest market forecast, several industries will grow."], ["investment performance", "n", "/ɪnˈvestmənt pərˈfɔːrməns/", "hiệu quả đầu tư", "We are pleased with the recent investment performance."], ["dividend payment", "n", "/ˈdɪvɪdend ˈpeɪmənt/", "chi trả cổ tức", "The board has approved a dividend payment."], ["diversified portfolio", "n", "/daɪˈvɜːrsɪfaɪd pɔːrtˈfoʊlioʊ/", "danh mục đầu tư đa dạng", "Our advisors created a diversified portfolio."], ["investment fund", "n", "/ɪnˈvestmənt fʌnd/", "quỹ đầu tư", "We will introduce a new investment fund."], ["shareholder", "n", "/ˈʃerhoʊldər/", "cổ đông", "Each shareholder is entitled to vote."], ["bond", "n", "/bɑːnd/", "trái phiếu", "Investors often purchase government bonds."]], "n": "atc5", "part": 0, "partName": "Part 4 · Part 5, 6 · Part 7", "sub": "Investment · Nghe điền từ · Part 4 (9 câu) · Part 5 (20 câu) · Part 6 (4 câu) · Part 7 (7 câu)", "intro": "Trang này có <b>file nghe</b> và <b>chữa bài</b> phần luyện tập trên lớp của buổi <b>Unit 5 · Lesson 3 · Thực chiến đề thi (5)</b> (Giáo trình trang 146–152). <b>Cách học:</b> câu nghe thì bấm nghe → tự chọn → mở lời thoại và dịch. Câu đọc thì chọn đáp án rồi xem vì sao đúng, vì sao sai.", "stepsTitle": "Nhắc lại chiến lược", "steps": ["<b>Part 4:</b> đọc trước 3 câu hỏi; mục đích/ý chính nghe 1–2 câu đầu, chi tiết (ngày, số) nghe đúng chỗ có từ khoá, yêu cầu/việc tiếp theo nghe cuối bài.", "<b>Part 5, 6 – C.E.P:</b> nhìn 4 đáp án để phân loại (từ loại, thì, to V/V-ing, đại từ quan hệ, từ vựng) → loại đáp án sai → chọn theo dấu hiệu trong câu.", "<b>Part 7:</b> đọc câu hỏi trước, tìm từ khoá trong bài; đáp án đúng thường là cách nói khác (paraphrase) của câu trong bài. Câu hỏi đoạn kép cần ghép thông tin 2 đoạn."], "groups": [{"title": "Nghe và điền từ (Track 1)", "tag": "Từ vựng", "audio": "../../audio/atc5/track1.mp3", "passage": ["Good morning, everyone. Today, we will introduce a new investment fund for clients who are interested in long-term growth. Although all investments involve some **(1) financial risk**, our advisors have selected a variety of assets to create a diversified portfolio. According to the latest market **(2) forecast**, several industries are expected to grow steadily over the next year. We are also pleased with the recent investment **(3) performance** of our balanced fund. Finally, shareholders will receive their next dividend **(4) payment** in August."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "Good morning, everyone. Today, we will introduce a new investment fund for clients who are interested in long-term growth. Although all investments involve some (1) financial risk, our advisors have selected a variety of assets to create a diversified portfolio. According to the latest market (2) forecast, several industries are expected to grow steadily over the next year. We are also pleased with the recent investment (3) performance of our balanced fund. Finally, shareholders will receive their next dividend (4) payment in August.", "vi": "Chào buổi sáng mọi người. Hôm nay chúng tôi giới thiệu một quỹ đầu tư mới cho khách hàng quan tâm tới tăng trưởng dài hạn. Dù mọi khoản đầu tư đều có rủi ro tài chính, các cố vấn đã chọn nhiều loại tài sản để tạo danh mục đầu tư đa dạng. Theo dự báo thị trường mới nhất, nhiều ngành sẽ tăng trưởng ổn định trong năm tới. Chúng tôi cũng hài lòng với hiệu quả đầu tư gần đây của quỹ cân bằng. Cuối cùng, cổ đông sẽ nhận khoản chi trả cổ tức kỳ tới vào tháng Tám."}], "qs": []}, {"title": "Part 4 · Câu 1–3", "tag": "Tin nhắn điện thoại", "audio": "../../audio/atc5/p4-c1.mp3", "scriptLabel": "📜 Lời thoại + dịch (mở sau khi đã nghe)", "script": [{"sp": "", "t": "Hello, Ms. Carter. This is Daniel Hughes from Summit Financial Services. I'm calling regarding the investment portfolio review we discussed last month.", "vi": "Chào chị Carter. Tôi là Daniel Hughes từ Summit Financial Services. Tôi gọi về việc rà soát danh mục đầu tư mà chúng ta đã bàn tháng trước."}, {"sp": "", "t": "After analyzing your account, I've identified two funds that have consistently performed below expectations. I recommend replacing them with lower-risk options.", "vi": "Sau khi phân tích tài khoản của chị, tôi thấy có hai quỹ liên tục hoạt động dưới kỳ vọng. Tôi đề nghị thay bằng các lựa chọn ít rủi ro hơn."}, {"sp": "", "t": "I've prepared a report and sent it to your e-mail this morning. Please review it before our meeting on Thursday.", "vi": "Tôi đã soạn báo cáo và gửi vào e-mail của chị sáng nay. Chị vui lòng xem trước buổi gặp thứ Năm."}], "qs": [{"n": 1, "q": "Why is the speaker calling?", "qvi": "Vì sao người nói gọi điện?", "opts": [{"t": "To confirm a payment"}, {"t": "To discuss investment performance"}, {"t": "To announce a new fund"}, {"t": "To schedule a training session"}], "ans": ["B"], "key": "Câu hỏi mục đích", "ex": "\"I'm calling regarding the investment portfolio review … two funds that have performed below expectations\" → bàn về hiệu quả đầu tư (B).", "label": "1"}, {"n": 2, "q": "What has the speaker done?", "qvi": "Người nói đã làm gì?", "opts": [{"t": "Opened a new account"}, {"t": "Sold some investments"}, {"t": "Sent a report"}, {"t": "Contacted a bank"}], "ans": ["C"], "key": "Câu hỏi chi tiết", "ex": "\"I've prepared a report and sent it to your e-mail\" → (C). (B) mới chỉ đề nghị thay quỹ, chưa bán.", "label": "2"}, {"n": 3, "q": "What does the speaker ask the listener to do?", "qvi": "Người nói yêu cầu người nghe làm gì?", "opts": [{"t": "Review a document"}, {"t": "Attend a seminar"}, {"t": "Update personal information"}, {"t": "Transfer funds"}], "ans": ["A"], "key": "Câu hỏi yêu cầu", "ex": "\"Please review it (the report) before our meeting\" → (A). report = document.", "label": "3"}]}, {"title": "Part 4 · Câu 4–6", "tag": "Bài nói · họp cổ đông", "audio": "../../audio/atc5/p4-c2.mp3", "scriptLabel": "📜 Lời thoại + dịch (mở sau khi đã nghe)", "script": [{"sp": "", "t": "Thank you for attending today's shareholders' meeting. I'm pleased to announce that the company achieved stronger-than-expected financial results this quarter.", "vi": "Cảm ơn quý vị đã dự cuộc họp cổ đông hôm nay. Tôi vui mừng thông báo công ty đạt kết quả tài chính tốt hơn dự kiến trong quý này."}, {"sp": "", "t": "As a result, the board has approved a dividend payment for shareholders. Payments will be issued on August 15.", "vi": "Vì vậy, hội đồng quản trị đã duyệt chi trả cổ tức cho cổ đông. Khoản tiền sẽ được chi vào ngày 15/8."}, {"sp": "", "t": "Shareholders who recently changed banks should update their payment information by July 30.", "vi": "Cổ đông nào mới đổi ngân hàng nên cập nhật thông tin nhận tiền trước ngày 30/7."}], "qs": [{"n": 4, "q": "What is being announced?", "qvi": "Điều gì đang được thông báo?", "opts": [{"t": "A merger"}, {"t": "A dividend payment"}, {"t": "A stock split"}, {"t": "A new product launch"}], "ans": ["B"], "key": "Câu hỏi ý chính", "ex": "\"the board has approved a dividend payment\" → (B).", "label": "4"}, {"n": 5, "q": "When will payments be issued?", "qvi": "Khi nào tiền sẽ được chi trả?", "opts": [{"t": "July 15"}, {"t": "July 30"}, {"t": "August 15"}, {"t": "August 30"}], "ans": ["C"], "key": "Câu hỏi chi tiết · ngày tháng", "ex": "\"Payments will be issued on August 15\" → (C). (B) July 30 là hạn cập nhật thông tin – bẫy con số.", "label": "5"}, {"n": 6, "q": "Who should update information?", "qvi": "Ai nên cập nhật thông tin?", "opts": [{"t": "New employees"}, {"t": "Department managers"}, {"t": "Shareholders with new bank accounts"}, {"t": "Financial advisors"}], "ans": ["C"], "key": "Câu hỏi chi tiết", "ex": "\"Shareholders who recently changed banks should update…\" → (C) cổ đông có tài khoản ngân hàng mới (paraphrase).", "label": "6"}]}, {"title": "Part 4 · Câu 7–9", "tag": "Thông báo · ứng dụng đầu tư", "audio": "../../audio/atc5/p4-c3.mp3", "scriptLabel": "📜 Lời thoại + dịch (mở sau khi đã nghe)", "script": [{"sp": "", "t": "Welcome to the GreenStone Investment App. We are excited to announce a new feature that allows users to compare the performance of multiple funds at the same time.", "vi": "Chào mừng bạn đến với ứng dụng GreenStone Investment. Chúng tôi vui mừng giới thiệu tính năng mới cho phép so sánh hiệu quả của nhiều quỹ cùng lúc."}, {"sp": "", "t": "The feature became available yesterday and can be accessed from the dashboard menu.", "vi": "Tính năng có từ hôm qua và mở được trong menu bảng điều khiển."}, {"sp": "", "t": "Users who activate the feature this week will receive a free market analysis report.", "vi": "Người dùng kích hoạt tính năng trong tuần này sẽ nhận miễn phí một báo cáo phân tích thị trường."}], "qs": [{"n": 7, "q": "What product is mentioned?", "qvi": "Sản phẩm nào được nhắc tới?", "opts": [{"t": "A mobile application"}, {"t": "A retirement plan"}, {"t": "A credit card"}, {"t": "A savings account"}], "ans": ["A"], "key": "Câu hỏi chi tiết", "ex": "\"Welcome to the GreenStone Investment App\" → app = mobile application (A).", "label": "7"}, {"n": 8, "q": "What became available yesterday?", "qvi": "Cái gì có từ hôm qua?", "opts": [{"t": "A new investment fund"}, {"t": "A comparison feature"}, {"t": "A customer survey"}, {"t": "A training program"}], "ans": ["B"], "key": "Câu hỏi chi tiết", "ex": "\"a new feature that allows users to compare … The feature became available yesterday\" → (B). (A) bẫy: so sánh các quỹ, không phải ra quỹ mới.", "label": "8"}, {"n": 9, "q": "What is offered this week?", "qvi": "Tuần này có ưu đãi gì?", "opts": [{"t": "A discount coupon"}, {"t": "A free consultation"}, {"t": "A market analysis report"}, {"t": "A software update"}], "ans": ["C"], "key": "Câu hỏi chi tiết", "ex": "\"Users who activate the feature this week will receive a free market analysis report\" → (C).", "label": "9"}]}, {"title": "Part 5 · Câu 1", "tag": "Đại từ quan hệ", "qs": [{"n": 10, "q": "The employee ___ submitted the proposal will present it at tomorrow's meeting.", "qvi": "Nhân viên đã nộp đề xuất sẽ trình bày nó ở cuộc họp ngày mai.", "opts": [{"t": "who"}, {"t": "whom"}, {"t": "whose"}, {"t": "where"}], "ans": ["A"], "key": "", "ex": "Thay cho người (employee), sau chỗ trống là động từ (submitted) → làm chủ ngữ: who.", "label": "1"}]}, {"title": "Part 5 · Câu 2", "tag": "Từ vựng", "qs": [{"n": 11, "q": "Investors should diversify their ___ to reduce financial risk.", "qvi": "Nhà đầu tư nên đa dạng hoá danh mục đầu tư để giảm rủi ro tài chính.", "opts": [{"t": "dividend"}, {"t": "portfolio"}, {"t": "shareholder"}, {"t": "forecast"}], "ans": ["B"], "key": "", "ex": "diversify a portfolio = đa dạng hoá danh mục đầu tư (collocation).", "label": "2"}]}, {"title": "Part 5 · Câu 3", "tag": "Rút gọn MĐQH (bị động)", "qs": [{"n": 12, "q": "The products ___ in our newest catalog are available at a discounted price.", "qvi": "Các sản phẩm được giới thiệu trong catalog mới nhất đang được giảm giá.", "opts": [{"t": "featuring"}, {"t": "featured"}, {"t": "feature"}, {"t": "features"}], "ans": ["B"], "key": "", "ex": "Câu đã có động từ chính (are) → cần mệnh đề rút gọn. Sản phẩm ĐƯỢC giới thiệu (bị động) → V3: featured.", "label": "3"}]}, {"title": "Part 5 · Câu 4", "tag": "Từ vựng", "qs": [{"n": 13, "q": "Each ___ is entitled to vote at the company's annual meeting.", "qvi": "Mỗi cổ đông đều có quyền biểu quyết tại đại hội thường niên.", "opts": [{"t": "portfolio"}, {"t": "dividend"}, {"t": "shareholder"}, {"t": "forecast"}], "ans": ["C"], "key": "", "ex": "Người có quyền bỏ phiếu → shareholder (cổ đông).", "label": "4"}]}, {"title": "Part 5 · Câu 5", "tag": "Đại từ quan hệ", "qs": [{"n": 14, "q": "The consultant ___ recommendations improved the company's efficiency received an award.", "qvi": "Chuyên gia tư vấn có các đề xuất g a new mutual ___ for young professionals.", "qvi": "Công ty đầu tư vừa ra mắt một quỹ tương hỗ mới cho người trẻ đi làm.", "opts": [{"t": "forecast"}, {"t": "market"}, {"t": "shareholder"}, {"t": "fund"}], "ans": ["D"], "key": "", "ex": "mutual fund = quỹ tương hỗ (cụm cố định).", "label": "10"}]}, {"title": "Part 5 · Câu 11", "tag": "Đại từ quan hệ", "qs": [{"n": 20, "q": "The office ___ overlooks the river is reserved for senior executives.", "qvi": "Văn phòng nhìn ra sông được dành cho lãnh đạo cấp cao.", "opts": [{"t": "who"}, {"t": "whose"}, {"t": "where"}, {"t": "that"}], "ans": ["D"], "key": "", "ex": "Thay cho vật (office), làm chủ ngữ của overlooks → that/which. (C) where cần mệnh đề đủ chủ ngữ.", "label": "11"}]}, {"title": "Part 5 · Câu 12", "tag": "Từ vựng", "qs": [{"n": 21, "q": "Analysts revised their economic ___ after reviewing the latest sales data.", "qvi": "Các nhà phân tích điều chỉnh dự báo kinh tế sau khi xem số liệu bán hàng mới nhất.", "opts": [{"t": "forecasts"}, {"t": "portfolios"}, {"t": "dividends"}, {"t": "shareholders"}], "ans": ["A"], "key": "", "ex": "economic forecast = dự báo kinh tế; \"revised\" (điều chỉnh) hợp với dự báo.", "label": "12"}]}, {"title": "Part 5 · Câu 13", "tag": "Rút gọn MĐQH (bị động)", "qs": [{"n": 22, "q": "The documents ___ on the conference table contain confidential information.", "qvi": "Tài liệu đặt trên bàn hội nghị có thông tin mật.", "opts": [{"t": "placing"}, {"t": "placed"}, {"t": "place"}, {"t": "places"}], "ans": ["B"], "key": "", "ex": "Đã có động từ chính (contain); tài liệu ĐƯỢC đặt → V3: placed.", "label": "13"}]}, {"title": "Part 5 · Câu 14", "tag": "Từ vựng", "qs": [{"n": 23, "q": "Many retirees rely on investment ___ as a source of regular income.", "qvi": "Nhiều người nghỉ hưu dựa vào cổ tức đầu tư như nguồn thu nhập đều đặn.", "opts": [{"t": "markets"}, {"t": "portfolios"}, {"t": "dividends"}, {"t": "shareholders"}], "ans": ["C"], "key": "", "ex": "\"source of regular income\" (nguồn thu nhập đều) → dividends (cổ tức).", "label": "14"}]}, {"title": "Part 5 · Câu 15", "tag": "Đại từ quan hệ", "qs": [{"n": 24, "q": "The manager ___ team completed the project ahead of schedule received recognition from the CEO.", "qvi": "Người quản lý có nhóm hoàn thành dự án trước hạn được CEO khen ngợi.", "opts": [{"t": "who"}, {"t": "whose"}, {"t": "whom"}, {"t": "where"}], "ans": ["B"], "key": "", "ex": "Sau chỗ trống là danh từ (team) của manager → whose.", "label": "15"}]}, {"title": "Part 5 · Câu 16", "tag": "Rút gọn MĐQH (bị động)", "qs": [{"n": 25, "q": "The software ___ to employees last month has significantly improved productivity.", "qvi": "Phần mềm được giới thiệu cho nhân viên tháng trước đã cải thiện năng suất đáng kể.", "opts": [{"t": "introducing"}, {"t": "introduced"}, {"t": "introduce"}, {"t": "introduces"}], "ans": ["B"], "key": "", "ex": "Động từ chính là has improved; phần mềm ĐƯỢC giới thiệu → introduced.", "label": "16"}]}, {"title": "Part 5 · Câu 17", "tag": "Từ vựng", "qs": [{"n": 26, "q": "Investors often purchase government ___ because they are considered relatively safe.", "qvi": "Nhà đầu tư thường mua trái phiếu chính phủ vì chúng được xem là khá an toàn.", "opts": [{"t": "stocks"}, {"t": "bonds"}, {"t": "dividends"}, {"t": "forecasts"}], "ans": ["B"], "key": "", "ex": "government bonds = trái phiếu chính phủ (an toàn). stocks (cổ phiếu) rủi ro hơn.", "label": "17"}]}, {"title": "Part 5 · Câu 18", "tag": "Đại từ quan hệ", "qs": [{"n": 27, "q": "Customers ___ orders exceed $500 qualify for free shipping.", "qvi": "Khách hàng có đơn hàng trên 500 đô được miễn phí vận chuyển.", "opts": [{"t": "who"}, {"t": "whom"}, {"t": "whose"}, {"t": "which"}], "ans": ["C"], "key": "", "ex": "Sau chỗ trống là danh từ (orders) của customers → whose.", "label": "18"}]}, {"title": "Part 5 · Câu 19", "tag": "Rút gọn MĐQH (bị động)", "qs": [{"n": 28, "q": "The conference ___ next month will focus on sustainable investing.", "qvi": "Hội nghị được tổ chức tháng tới sẽ tập trung vào đầu tư bền vững.", "opts": [{"t": "holding"}, {"t": "held"}, {"t": "hold"}, {"t": "holds"}], "ans": ["B"], "key": "", "ex": "Động từ chính là will focus; hội nghị ĐƯỢC tổ chức → held.", "label": "19"}]}, {"title": "Part 5 · Câu 20", "tag": "Từ vựng", "qs": [{"n": 29, "q": "The company's total ___ increased significantly after acquiring several new properties.", "qvi": "Tổng tài sản của công ty tăng mạnh sau khi mua thêm vài bất động sản.", "opts": [{"t": "assets"}, {"t": "dividends"}, {"t": "shareholders"}, {"t": "forecasts"}], "ans": ["A"], "key": "", "ex": "Mua thêm bất động sản → tổng tài sản (total assets) tăng.", "label": "20"}]}, {"title": "Part 6 · Câu 1–4 · E-mail quỹ đầu tư mới", "tag": "E-mail", "passage": ["To: All Clients · From: GreenStone Investments · Subject: New Investment Fund", "Dear Clients, We are pleased to announce the launch of a new investment fund ⟦1⟧ for individuals who are seeking long-term growth with moderate risk.", "The fund focuses on a diversified mix of stocks and bonds and will be managed by a team of experienced financial advisors. Clients interested in learning more about the fund are invited to attend a free online seminar next Thursday.", "During the seminar, our advisors will explain investment strategies and answer questions. ⟦2⟧ all participants will receive a market ⟦3⟧ for the coming year.", "To register for the seminar, please complete the online form by Friday. ⟦4⟧"], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Kính gửi quý khách, chúng tôi vui mừng ra mắt quỹ đầu tư mới được thiết kế cho người muốn tăng trưởng dài hạn với rủi ro vừa phải. Quỹ đầu tư đa dạng vào cổ phiếu và trái phiếu, do đội cố vấn tài chính giàu kinh nghiệm quản lý. Khách muốn tìm hiểu thêm được mời dự hội thảo trực tuyến miễn phí vào thứ Năm tới. Trong hội thảo, cố vấn sẽ giải thích chiến lược đầu tư và trả lời câu hỏi. Ngoài ra, mọi người tham dự sẽ nhận bản dự báo thị trường cho năm tới. Để đăng ký, vui lòng điền mẫu trực tuyến trước thứ Sáu. Nếu cần, tháng sau sẽ có thêm các buổi hướng dẫn."}], "qs": [{"n": 30, "q": "Chỗ trống (1)", "qvi": "", "opts": [{"t": "designed"}, {"t": "designing"}, {"t": "design"}, {"t": "designs"}], "ans": ["A"], "key": "Rút gọn MĐQH (bị động)", "ex": "Quỹ ĐƯỢC thiết kế cho … → rút gọn bị động bằng V3: designed (= which is designed).", "label": "1"}, {"n": 31, "q": "Chỗ trống (2)", "qvi": "", "opts": [{"t": "In addition,"}, {"t": "However,"}, {"t": "Therefore,"}, {"t": "Otherwise,"}], "ans": ["A"], "key": "Trạng từ liên kết", "ex": "Câu trước: giải thích chiến lược; câu sau: còn được nhận thêm bản dự báo → bổ sung thông tin: In addition.", "label": "2"}, {"n": 32, "q": "Chỗ trống (3)", "qvi": "", "opts": [{"t": "workload"}, {"t": "itinerary"}, {"t": "dividend"}, {"t": "forecast"}], "ans": ["D"], "key": "Từ vựng", "ex": "market forecast = dự báo thị trường \"for the coming year\". (Slide trên lớp in nhầm phương án (D); đáp án đúng là forecast.)", "label": "3"}, {"n": 33, "q": "Chỗ trống (4)", "qvi": "", "opts": [{"t": "Additional training sessions will be offered next month if needed."}, {"t": "The company cafeteria serves breakfast from 7 a.m."}, {"t": "Several investors attended the annual meeting yesterday."}, {"t": "Hotel reservations should be made in advance."}], "ans": ["A"], "key": "Điền câu", "ex": "Câu cuối nối tiếp việc đăng ký hội thảo → (A) sẽ có thêm buổi nếu cần. (B), (C), (D) không liên quan.", "label": "4"}]}, {"title": "Part 7 · Câu 1–3 · Bài báo", "tag": "Article", "passage": ["SINGAPORE (14 August)—Global Enterprise News has introduced a new category to its well-known international business awards this year. The Future Growth Award is given to a company that creates effective plans to support its long-term success.", "This year's award went to Nexora Technologies, a leading company in the consumer electronics industry. Led by CEO Daniel Ortiz, Nexora Technologies improved from serious financial difficulties to strong profits in only three years.", "\"Receiving this award is a great honor for our entire organization,\" Mr. Ortiz said during the award ceremony. \"Our employees have worked very hard to improve the company's performance. The long-term plan we adopted has created excellent value for our investors.\""], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "SINGAPORE (14/8) – Global Enterprise News năm nay thêm một hạng mục mới vào giải thưởng kinh doanh quốc tế nổi tiếng của mình. Giải Tăng trưởng Tương lai trao cho công ty có kế hoạch hiệu quả giúp thành công lâu dài. Giải năm nay thuộc về Nexora Technologies, công ty hàng đầu ngành điện tử tiêu dùng. Dưới sự dẫn dắt của CEO Daniel Ortiz, Nexora đã đi từ khó khăn tài chính nghiêm trọng đến lợi nhuận cao chỉ trong ba năm. \"Nhận giải này là vinh dự lớn cho cả tổ chức,\" ông Ortiz phát biểu. \"Nhân viên đã làm việc rất vất vả để cải thiện kết quả của công ty. Chiến lược dài hạn chúng tôi áp dụng đã tạo ra giá trị lớn cho nhà đầu tư.\""}], "qs": [{"n": 34, "q": "What is the main purpose of the article?", "qvi": "Mục đích chính của bài báo là gì?", "opts": [{"t": "To introduce a recently established company"}, {"t": "To examine developments in the electronics market"}, {"t": "To recognize a company's accomplishment"}, {"t": "To explain revisions to a staff agreement"}], "ans": ["C"], "key": "Câu hỏi mục đích", "ex": "Bài báo nói về việc Nexora nhận giải thưởng → ghi nhận thành tích của một công ty (C). (A) Nexora không phải công ty mới thành lập.", "label": "1"}, {"n": 35, "q": "What can be learned about Nexora Technologies?", "qvi": "Có thể biết gì về Nexora Technologies?", "opts": [{"t": "It has stopped producing electronic products."}, {"t": "It previously faced financial problems."}, {"t": "It has struggled to gain new customers."}, {"t": "It plans to appoint a new CEO."}], "ans": ["B"], "key": "Câu hỏi chi tiết", "ex": "\"improved from serious financial difficulties to strong profits\" → trước đây gặp khó khăn tài chính (B).", "label": "2"}, {"n": 36, "q": "The word \"plan\" in paragraph 3, line 4, is closest in meaning to", "qvi": "Từ \"plan\" ở đoạn 3 gần nghĩa nhất với", "opts": [{"t": "schedule"}, {"t": "strategy"}, {"t": "report"}, {"t": "opinion"}], "ans": ["B"], "key": "Câu hỏi từ đồng nghĩa", "ex": "\"The long-term plan we adopted\" = kế hoạch/chiến lược dài hạn → strategy (B). schedule là lịch trình, không hợp ngữ cảnh.", "label": "3"}]}, {"title": "Part 7 · Câu 4–7 · Tờ giới thiệu dịch vụ", "tag": "Brochure", "passage": ["<b>Summit Property Group (SPG)</b>", "Owning rental property can be a great way to earn extra income, but it also comes with many responsibilities. — [1] —. With a skilled team from SPG supporting you, you can feel confident that your property is in good hands. Buying houses or apartments in Seattle for rental purposes can be challenging and may involve financial risks. — [2] —.", "<b>Tenant Screening</b> — Before renting out your property, it is important to learn as much as possible about potential tenants. Our office staff conducts detailed screening checks on every applicant. These reports can help identify concerns related to employment history, unpaid debts, and other issues. By using our screening service, you can make informed decisions before signing a lease.", "<b>Legal Assistance</b> — Proper contracts and lease agreements are essential for protecting your property. Our legal team will guide you throughout the entire process. Besides handling common rental matters, they can also offer advice in unusual situations, such as when extensive renovations force tenants to leave temporarily. — [3] —.", "<b>Tenant Issues</b> — Even when careful planning is involved, disagreements between landlords and tenants can still happen. Our dispute-resolution specialists are trained to help both sides reach a fair agreement. We always have at least two team members available twenty-four hours a day, seven days a week to provide immediate support when necessary. — [4] —."], "scriptLabel": "📜 Dịch đoạn văn", "script": [{"sp": "", "t": "", "vi": "Sở hữu nhà cho thuê là cách hay để kiếm thêm thu nhập nhưng cũng kéo theo nhiều trách nhiệm. Có đội ngũ SPG hỗ trợ, bạn yên tâm tài sản được chăm sóc tốt. Mua nhà ở Seattle để cho thuê có thể khó khăn và có rủi ro tài chính. [2] Hãy đọc thông tin dưới đây để biết chúng tôi giúp bạn tránh sai lầm tốn kém thế nào. — Sàng lọc người thuê: nhân viên kiểm tra kỹ từng người đăng ký (lịch sử việc làm, nợ chưa trả…) để bạn quyết định trước khi ký hợp đồng. — Hỗ trợ pháp lý: đội luật hướng dẫn suốt quá trình, kể cả tình huống đặc biệt như người thuê phải tạm dọn đi vì sửa chữa lớn. — Tranh chấp: chuyên viên hoà giải giúp hai bên đạt thoả thuận công bằng; luôn có ít nhất hai người trực 24/7."}], "qs": [{"n": 37, "q": "Who would most likely be interested in this brochure?", "qvi": "Ai có lẽ sẽ quan tâm tới tờ giới thiệu này?", "opts": [{"t": "Individuals who own rental properties"}, {"t": "People looking for a place to live"}, {"t": "Building maintenance workers"}, {"t": "Students studying law"}], "ans": ["A"], "key": "Câu hỏi suy luận", "ex": "Câu đầu: \"Owning rental property can be a great way to earn extra income\" + các dịch vụ cho chủ nhà → (A). (B) bẫy: người đi thuê nhà là đối tượng được sàng lọc.", "label": "4"}, {"n": 38, "q": "According to the brochure, what can SPG legal specialists help clients with?", "qvi": "Theo tờ giới thiệu, chuyên viên pháp lý SPG giúp khách việc gì?", "opts": [{"t": "Determining how long legal records should be stored"}, {"t": "Dealing with damage that occurs during relocation"}, {"t": "Managing situations in which tenants must move unexpectedly"}, {"t": "Understanding regulations that affect construction plans"}], "ans": ["C"], "key": "Câu hỏi chi tiết · paraphrase", "ex": "\"when extensive renovations force tenants to leave temporarily\" → người thuê phải dọn đi bất ngờ (C).", "label": "5"}, {"n": 39, "q": "Which group of SPG employees can be contacted at any time?", "qvi": "Nhóm nhân viên nào của SPG có thể liên hệ bất cứ lúc nào?", "opts": [{"t": "Experienced attorneys"}, {"t": "Property sales representatives"}, {"t": "Dispute-resolution specialists"}, {"t": "Administrative personnel"}], "ans": ["C"], "key": "Câu hỏi chi tiết", "ex": "Mục Tenant Issues: \"dispute-resolution specialists … available twenty-four hours a day, seven days a week\" → (C).", "label": "6"}, {"n": 40, "q": "Where should the following sentence be inserted? \"Read the information below to learn how we can help you avoid costly mistakes.\"", "qvi": "Câu sau nên chèn vào đâu? \"Hãy đọc thông tin bên dưới để biết chúng tôi giúp bạn tránh sai lầm tốn kém thế nào.\"", "opts": [{"t": "[1]"}, {"t": "[2]"}, {"t": "[3]"}, {"t": "[4]"}], "ans": ["B"], "key": "Câu hỏi chèn câu", "ex": "\"the information below\" → câu phải đứng ngay trước các mục dịch vụ; câu trước [2] nói về \"financial risks\" (sai lầm tốn kém) → [2] (B).", "label": "7"}]}], "recap": "<h2>Ghi nhớ sau bài</h2><p>Làm lại các câu sai sau 2–3 ngày. Ôn từ vựng của buổi bằng nút <b>🃏 Flashcard</b> ở cuối trang.</p>", "qviAfter": true};</script>
