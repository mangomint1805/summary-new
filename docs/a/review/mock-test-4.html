<script>window.MT={"n": "a4", "part": 3, "partName": "Part 3", "sub": "Conversations · Hội thoại ngắn · 39 câu (32–70)", "intro": "Trang này chữa <b>Mock Test 4 (Part 3)<\/b> của lớp TOEIC A. Mỗi đoạn hội thoại có nút nghe lại, lời thoại kèm dịch (mở sau khi đã nghe) và 3 câu hỏi. Chỗ có số <b>(32)<\/b> trong lời thoại là câu chứa đáp án của câu đó.", "stepsTitle": "Cách làm Part 3: Top-Down Attack", "steps": ["<b>Đọc trước 3 câu hỏi<\/b> trong lúc audio đọc hướng dẫn. Gạch từ khóa: <i>Where / Who / What problem / What will … do next<\/i>, và ai được hỏi (the man hay the woman).", "<b>Nghe theo thứ tự.<\/b> Câu hỏi 1 thường nằm ở đầu bài, câu 2 ở giữa, câu 3 ở cuối. Câu \"do next\" thường nằm ở 1–2 câu cuối cùng.", "<b>Đáp án thường nói lại ý (paraphrase).<\/b> <i>docking at the port → on a boat; storm → the weather was bad; show you around → provide a tour<\/i>. Đừng chọn đáp án chỉ vì nghe thấy một từ giống.", "<b>Câu có bảng/biểu đồ (Look at the graphic):<\/b> nhìn bảng trước khi nghe. Đáp án trên phiếu là cột A, bài nói thường nhắc cột B (VD: nghe \"electric cars\" → tìm ra Area 2)."], "groups": [{"title": "Hội thoại 32–34 · Trên tàu biển", "audio": "../../audio/amk4/c32.mp3", "script": [{"sp": "M", "t": "Good morning, Captain. (32) We'll be **docking at the port** in Kolkata this evening, right?", "vi": "Chào thuyền trưởng. Tối nay chúng ta sẽ cập cảng Kolkata đúng không ạ?"}, {"sp": "W", "t": "Actually, (33) we had to change course overnight **to avoid a storm**, so we're running behind schedule. But we should arrive early tomorrow.", "vi": "Thật ra đêm qua chúng ta phải đổi hướng để tránh một cơn bão, nên đang bị trễ lịch. Nhưng sáng sớm mai chắc sẽ đến."}, {"sp": "M", "t": "Well, that's not too bad.", "vi": "Vậy cũng không tệ lắm."}, {"sp": "W", "t": "Oh, Hector has the day off today, so (34) I'll need you to do the morning rounds, starting with **checking the machinery** in the engine room.", "vi": "À, hôm nay Hector nghỉ, nên tôi cần anh đi kiểm tra buổi sáng, bắt đầu bằng việc kiểm tra máy móc ở phòng máy."}, {"sp": "M", "t": "Of course, I'll head there now.", "vi": "Vâng, tôi đi ngay đây."}], "qs": [{"n": 32, "q": "Where does the conversation most likely take place?", "qvi": "Cuộc hội thoại có lẽ diễn ra ở đâu?", "opts": [{"t": "On a train", "vi": "Trên tàu hỏa"}, {"t": "On a boat", "vi": "Trên tàu thủy"}, {"t": "At a factory", "vi": "Ở nhà máy"}, {"t": "At an airport", "vi": "Ở sân bay"}], "ans": ["B"], "key": "Captain, docking at the port → on a boat", "ex": "Người nói gọi \"Captain\" (thuyền trưởng) và nói \"dock at the port\" (cập cảng) → đang ở trên tàu thủy. (D) sân bay cũng có captain (cơ trưởng) nhưng máy bay không \"cập cảng\"."}, {"n": 33, "q": "What caused a delay?", "qvi": "Điều gì gây ra sự chậm trễ?", "opts": [{"t": "An electrical failure occurred.", "vi": "Bị sự cố điện."}, {"t": "A worker was unavailable.", "vi": "Một nhân viên không có mặt."}, {"t": "Some information was incorrect.", "vi": "Thông tin bị sai."}, {"t": "The weather was bad.", "vi": "Thời tiết xấu."}], "ans": ["D"], "key": "avoid a storm → the weather was bad", "ex": "Tàu phải đổi hướng \"để tránh bão\" nên trễ lịch → thời tiết xấu. (B) là bẫy: Hector nghỉ làm thật, nhưng đó không phải lý do tàu trễ."}, {"n": 34, "q": "What will the man do next?", "qvi": "Người đàn ông sẽ làm gì tiếp theo?", "opts": [{"t": "Confirm a schedule", "vi": "Xác nhận lịch trình"}, {"t": "Speak to a coworker", "vi": "Nói chuyện với đồng nghiệp"}, {"t": "Check some machinery", "vi": "Kiểm tra máy móc"}, {"t": "Clean a storage room", "vi": "Dọn phòng kho"}], "ans": ["C"], "key": "checking the machinery → check some machinery", "ex": "Nữ thuyền trưởng nhờ anh kiểm tra máy móc ở phòng máy (checking the machinery), anh đáp \"tôi đi ngay đây\". Câu \"do next\" nằm ở cuối bài."}]}, {"title": "Hội thoại 35–37 · Phòng tập gym", "audio": "../../audio/amk4/c35.mp3", "script": [{"sp": "M", "t": "Hi. I'm here to schedule some (35) **personal training sessions**.", "vi": "Chào chị. Tôi đến để đặt lịch vài buổi tập với huấn luyện viên riêng."}, {"sp": "W", "t": "Okay, what are your fitness goals?", "vi": "Vâng, mục tiêu tập luyện của anh là gì?"}, {"sp": "M", "t": "I'd like to lift weights and build strength.", "vi": "Tôi muốn tập tạ và tăng sức mạnh."}, {"sp": "W", "t": "I can work with you on that. Are you currently a member here?", "vi": "Tôi có thể tập cùng anh. Anh đang là hội viên ở đây chưa?"}, {"sp": "M", "t": "No, I'll also need to sign up for a membership. (36) I saw online that you're running a special for new members, **50% off** the first month's membership. Can I sign up for that?", "vi": "Chưa, tôi cũng cần đăng ký hội viên. Tôi thấy trên mạng chỗ chị đang có ưu đãi cho hội viên mới, giảm 50% tháng đầu. Tôi đăng ký được không?"}, {"sp": "W", "t": "Absolutely. But before I get you signed up, (37) **let me show you around** our facility.", "vi": "Được chứ. Nhưng trước khi đăng ký, để tôi dẫn anh đi xem quanh phòng tập nhé."}], "qs": [{"n": 35, "q": "Where does the woman most likely work?", "qvi": "Người phụ nữ có lẽ làm việc ở đâu?", "opts": [{"t": "At a sports stadium", "vi": "Sân vận động"}, {"t": "At a fitness center", "vi": "Trung tâm thể hình"}, {"t": "At a doctor's office", "vi": "Phòng khám bác sĩ"}, {"t": "At a library", "vi": "Thư viện"}], "ans": ["B"], "key": "personal training, lift weights, membership → fitness center", "ex": "Các từ \"personal training sessions\", \"fitness goals\", \"lift weights\" (tập tạ) → trung tâm thể hình (gym). (A) sân vận động là bẫy liên tưởng thể thao."}, {"n": 36, "q": "What does the man ask about?", "qvi": "Người đàn ông hỏi về điều gì?", "opts": [{"t": "A discount", "vi": "Một ưu đãi giảm giá"}, {"t": "A form", "vi": "Một mẫu đơn"}, {"t": "A business location", "vi": "Địa điểm cửa hàng"}, {"t": "A parking policy", "vi": "Quy định đỗ xe"}], "ans": ["A"], "key": "a special, 50% off → a discount", "ex": "Anh hỏi về ưu đãi \"giảm 50% tháng đầu\" → discount (giảm giá). special (ưu đãi) = discount."}, {"n": 37, "q": "What will the woman do next?", "qvi": "Người phụ nữ sẽ làm gì tiếp theo?", "opts": [{"t": "Post a sign", "vi": "Dán thông báo"}, {"t": "Confirm an account number", "vi": "Xác nhận số tài khoản"}, {"t": "Provide a tour", "vi": "Dẫn đi tham quan"}, {"t": "Look at a schedule", "vi": "Xem lịch"}], "ans": ["C"], "key": "show you around → provide a tour", "ex": "\"Let me show you around our facility\" = để tôi dẫn anh đi xem → provide a tour (dẫn đi tham quan). Câu \"do next\" nằm ở cuối bài."}]}, {"title": "Hội thoại 38–40 · Phục chế tranh", "audio": "../../audio/amk4/c38.mp3", "script": [{"sp": "M", "t": "As you can see, this Renaissance landscape painting we acquired is in bad condition. We can't display it yet.", "vi": "Như cô thấy đấy, bức tranh phong cảnh thời Phục Hưng mà ta mua về đang ở tình trạng tệ. Chưa thể trưng bày được."}, {"sp": "W", "t": "Hmm, yes. (38) This painting will need **significant restoration work**. (39) I'll begin by **investigating** the artist's color palette and style to see how we should repair the damaged areas.", "vi": "Ừm, đúng vậy. Bức tranh cần phục chế nhiều. Tôi sẽ bắt đầu bằng việc tìm hiểu bảng màu và phong cách của họa sĩ để xem nên sửa các chỗ hỏng thế nào."}, {"sp": "M", "t": "You know, (40) this would be a stunning piece to unveil at our **anniversary dinner in June**. And since it's a big project to finish by then, we should get started right away.", "vi": "Cô biết không, đây sẽ là tác phẩm tuyệt đẹp để ra mắt ở bữa tiệc kỷ niệm vào tháng Sáu. Vì đây là việc lớn phải xong trước lúc đó, ta nên bắt đầu ngay."}], "qs": [{"n": 38, "q": "Who most likely are the speakers?", "qvi": "Những người nói có lẽ là ai?", "opts": [{"t": "Art restorers", "vi": "Người phục chế tranh"}, {"t": "Event planners", "vi": "Người tổ chức sự kiện"}, {"t": "Photographers", "vi": "Nhiếp ảnh gia"}, {"t": "Interior designers", "vi": "Nhà thiết kế nội thất"}], "ans": ["A"], "key": "restoration work, repair the damaged areas → art restorers", "ex": "Họ bàn việc phục chế (restoration) và sửa các chỗ hỏng của bức tranh → người phục chế tranh. (B) bẫy: có nhắc bữa tiệc kỷ niệm nhưng họ không tổ chức tiệc."}, {"n": 39, "q": "What does the woman say she will do?", "qvi": "Người phụ nữ nói cô sẽ làm gì?", "opts": [{"t": "Hire an intern", "vi": "Thuê thực tập sinh"}, {"t": "Review a contract", "vi": "Xem lại hợp đồng"}, {"t": "Take some measurements", "vi": "Đo kích thước"}, {"t": "Investigate a problem", "vi": "Tìm hiểu một vấn đề"}], "ans": ["D"], "key": "investigating → investigate a problem", "ex": "Cô nói \"I'll begin by investigating…\" (tìm hiểu bảng màu, phong cách) để biết cách sửa chỗ hỏng → tìm hiểu vấn đề."}, {"n": 40, "q": "Why does the man suggest beginning a project quickly?", "qvi": "Vì sao người đàn ông đề nghị bắt đầu sớm?", "opts": [{"t": "Payment has already been made.", "vi": "Đã thanh toán rồi."}, {"t": "Staff will be on vacation.", "vi": "Nhân viên sẽ đi nghỉ."}, {"t": "An important event is approaching.", "vi": "Sắp đến một sự kiện quan trọng."}, {"t": "A client is in town for a limited time.", "vi": "Khách hàng chỉ ở thành phố một thời gian ngắn."}], "ans": ["C"], "key": "anniversary dinner in June → an important event is approaching", "ex": "Anh muốn ra mắt bức tranh ở tiệc kỷ niệm tháng Sáu, phải làm xong trước đó → sự kiện quan trọng sắp đến."}]}, {"title": "Hội thoại 41–43 · Ba người nói · Chuẩn bị cuộc họp", "audio": "../../audio/amk4/c41.mp3", "script": [{"sp": "W", "t": "Hi Ozan. (41) Do you have time to review some **slides I'm presenting** at a meeting on Thursday?", "vi": "Chào Ozan. Anh có thời gian xem giúp mấy slide tôi sẽ trình bày ở cuộc họp thứ Năm không?"}, {"sp": "M1", "t": "Oh, is that the meeting with Smith Incorporated?", "vi": "À, cuộc họp với công ty Smith phải không?"}, {"sp": "W", "t": "Yes. I'm presenting them with our updated marketing plan for (42) their **chain of bookstores**.", "vi": "Đúng. Tôi sẽ trình bày kế hoạch marketing mới cho chuỗi hiệu sách của họ."}, {"sp": "M1", "t": "You know, (43) Smith Incorporated prefers **informal meetings**. I think just a handout highlighting how our marketing plan will positively impact their book sales would be enough.", "vi": "Cô biết đấy, công ty Smith thích các cuộc họp thân mật. Tôi nghĩ chỉ cần một tờ tài liệu nêu kế hoạch giúp tăng doanh số sách của họ thế nào là đủ."}, {"sp": "W", "t": "Really? Thelo, you've worked with this client before. What do you think?", "vi": "Thật sao? Thelo, anh từng làm với khách này rồi. Anh nghĩ sao?"}, {"sp": "M2", "t": "Ozan is right. (43) I think they'd prefer a meeting that was **more of a conversation** than a presentation.", "vi": "Ozan nói đúng. Tôi nghĩ họ thích một buổi trò chuyện hơn là một bài thuyết trình."}], "qs": [{"n": 41, "q": "What is the woman preparing?", "qvi": "Người phụ nữ đang chuẩn bị gì?", "opts": [{"t": "A slide presentation", "vi": "Bài trình bày bằng slide"}, {"t": "A travel itinerary", "vi": "Lịch trình chuyến đi"}, {"t": "A guest list", "vi": "Danh sách khách mời"}, {"t": "A sales contract", "vi": "Hợp đồng bán hàng"}], "ans": ["A"], "key": "slides I'm presenting → a slide presentation", "ex": "Cô nhờ xem \"slides I'm presenting\" → đang chuẩn bị bài trình bày slide."}, {"n": 42, "q": "What kind of business is Smith Incorporated?", "qvi": "Smith Incorporated là loại công ty gì?", "opts": [{"t": "A law firm", "vi": "Công ty luật"}, {"t": "A construction company", "vi": "Công ty xây dựng"}, {"t": "A pharmaceutical manufacturer", "vi": "Hãng dược phẩm"}, {"t": "A bookstore chain", "vi": "Chuỗi hiệu sách"}], "ans": ["D"], "key": "chain of bookstores", "ex": "Cô nói kế hoạch marketing cho \"their chain of bookstores\" (chuỗi hiệu sách của họ), sau đó còn nhắc \"book sales\"."}, {"n": 43, "q": "What do the men agree about?", "qvi": "Hai người đàn ông đồng ý về điều gì?", "opts": [{"t": "A subscription should be canceled.", "vi": "Nên hủy gói đăng ký."}, {"t": "An advertising campaign should be delayed.", "vi": "Nên hoãn chiến dịch quảng cáo."}, {"t": "A training session should be mandatory.", "vi": "Buổi đào tạo nên bắt buộc."}, {"t": "A meeting should be casual.", "vi": "Cuộc họp nên thân mật, thoải mái."}], "ans": ["D"], "key": "informal, more of a conversation → casual", "ex": "Ozan nói khách thích họp \"informal\" (thân mật), Thelo đồng ý \"Ozan is right…, more of a conversation\" → cuộc họp nên thoải mái (casual)."}]}, {"title": "Hội thoại 44–46 · Kết quả thí nghiệm", "audio": "../../audio/amk4/c44.mp3", "script": [{"sp": "W", "t": "(44) I heard that the **results of your experiment were better** than you expected. Congratulations!", "vi": "Tôi nghe nói kết quả thí nghiệm của anh tốt hơn anh mong đợi. Chúc mừng nhé!"}, {"sp": "M", "t": "Thanks. I thought we'd have to run that reaction ten times before we got a positive result. But we got it on the third try.", "vi": "Cảm ơn. Tôi tưởng phải làm phản ứng đó mười lần mới có kết quả tốt, vậy mà lần thứ ba đã được."}, {"sp": "W", "t": "You'll have to write up your results and submit them to the research director. That's Esra, right?", "vi": "Anh sẽ phải viết báo cáo kết quả và nộp cho giám đốc nghiên cứu. Là chị Esra đúng không?"}, {"sp": "M", "t": "(45) Oh, **Esra's leaving the company next week**.", "vi": "À, chị Esra sẽ nghỉ việc ở công ty vào tuần sau."}, {"sp": "W", "t": "Oh, I didn't know that. I wonder if you'll be promoted to fill her position.", "vi": "Ồ, tôi không biết. Không biết anh có được thăng chức vào vị trí của chị ấy không."}, {"sp": "M", "t": "I don't think so. I've never managed an entire research group. (46) I hope to **get some experience doing that** next quarter.", "vi": "Chắc không đâu. Tôi chưa từng quản lý cả một nhóm nghiên cứu. Tôi mong quý tới sẽ có chút kinh nghiệm làm việc đó."}], "qs": [{"n": 44, "q": "Why does the woman congratulate the man?", "qvi": "Vì sao người phụ nữ chúc mừng người đàn ông?", "opts": [{"t": "He finished a road race.", "vi": "Anh hoàn thành cuộc đua chạy bộ."}, {"t": "He won a publishing award.", "vi": "Anh đoạt giải xuất bản."}, {"t": "His experiment was successful.", "vi": "Thí nghiệm của anh thành công."}, {"t": "His research funding was extended.", "vi": "Quỹ nghiên cứu của anh được gia hạn."}], "ans": ["C"], "key": "results … better than expected → experiment was successful", "ex": "Kết quả thí nghiệm tốt hơn mong đợi → thí nghiệm thành công."}, {"n": 45, "q": "What does the man imply when he says, \"Esra's leaving the company next week\"?", "qvi": "Người đàn ông ngụ ý gì khi nói \"Esra sẽ nghỉ việc tuần sau\"?", "opts": [{"t": "He needs assistance planning a party for Esra.", "vi": "Anh cần giúp tổ chức tiệc cho Esra."}, {"t": "He will not submit a report to Esra.", "vi": "Anh sẽ không nộp báo cáo cho Esra."}, {"t": "He will apply for a new position.", "vi": "Anh sẽ ứng tuyển vị trí mới."}, {"t": "A larger office has become available.", "vi": "Có một văn phòng lớn hơn còn trống."}], "ans": ["B"], "key": "Câu hỏi ý định: xem câu ngay trước", "ex": "Người phụ nữ bảo nộp báo cáo cho Esra. Anh đáp Esra sắp nghỉ → nghĩa là anh sẽ không nộp cho Esra (phải nộp cho người khác). (C) sai: anh nói \"I don't think so\" khi được hỏi về thăng chức."}, {"n": 46, "q": "What does the man hope to do next quarter?", "qvi": "Người đàn ông mong làm gì vào quý tới?", "opts": [{"t": "Receive a research grant", "vi": "Nhận tài trợ nghiên cứu"}, {"t": "Publish a book", "vi": "Xuất bản sách"}, {"t": "Replace some furniture", "vi": "Thay bàn ghế"}, {"t": "Gain management experience", "vi": "Có kinh nghiệm quản lý"}], "ans": ["D"], "key": "managed a group → gain management experience", "ex": "\"I've never managed… I hope to get some experience doing that\" (doing that = quản lý nhóm) → có kinh nghiệm quản lý."}]}, {"title": "Hội thoại 47–49 · Phỏng vấn trên TV", "audio": "../../audio/amk4/c47.mp3", "script": [{"sp": "W", "t": "Now we'll move on to a special segment of (47) our **news program** where we highlight new local businesses for our viewers. Today I'm talking with Dhruv Bahaj, a personal trainer and gym owner. Thanks for coming into the **studio** today, Dhruv.", "vi": "Bây giờ là phần đặc biệt của chương trình thời sự, giới thiệu các doanh nghiệp mới ở địa phương tới khán giả. Hôm nay tôi trò chuyện với Dhruv Bahaj, huấn luyện viên cá nhân và chủ phòng gym. Cảm ơn anh đã đến trường quay."}, {"sp": "M", "t": "Thanks for having me. (48) I'm excited to tell you about **the gym I just opened** last month. It has state-of-the-art equipment and my trainers can work with clients at any stage in their fitness journey.", "vi": "Cảm ơn chị đã mời. Tôi rất vui được kể về phòng gym tôi vừa mở tháng trước. Phòng có thiết bị hiện đại nhất và huấn luyện viên có thể làm việc với khách ở mọi giai đoạn tập luyện."}, {"sp": "W", "t": "Sounds great! (49) **How did you get started** in this line of work?", "vi": "Nghe hay quá! Anh bắt đầu làm nghề này như thế nào?"}, {"sp": "M", "t": "Well, I was an athlete in school, and when I stopped competing, I wanted to continue doing something fitness-related, so I started working as a trainer.", "vi": "À, hồi đi học tôi là vận động viên, khi thôi thi đấu, tôi muốn tiếp tục làm gì đó liên quan tới thể hình nên bắt đầu làm huấn luyện viên."}], "qs": [{"n": 47, "q": "Where most likely are the speakers?", "qvi": "Những người nói có lẽ đang ở đâu?", "opts": [{"t": "At a sporting goods store", "vi": "Cửa hàng đồ thể thao"}, {"t": "At a television studio", "vi": "Trường quay truyền hình"}, {"t": "At a sports arena", "vi": "Sân thi đấu"}, {"t": "At a gym", "vi": "Phòng gym"}], "ans": ["B"], "key": "news program, studio, viewers → television studio", "ex": "Có các từ \"news program\", \"viewers\" (khán giả), \"coming into the studio\" → trường quay truyền hình. (D) là bẫy: anh ấy nói về phòng gym của mình nhưng họ không ở đó."}, {"n": 48, "q": "What does the man say he recently did?", "qvi": "Người đàn ông nói gần đây anh đã làm gì?", "opts": [{"t": "He retired from his job.", "vi": "Anh nghỉ hưu."}, {"t": "He designed a Web site.", "vi": "Anh thiết kế một website."}, {"t": "He opened a new facility.", "vi": "Anh mở một cơ sở mới."}, {"t": "He competed in a sports event.", "vi": "Anh thi đấu một giải thể thao."}], "ans": ["C"], "key": "the gym I just opened → opened a new facility", "ex": "\"the gym I just opened last month\" → mở cơ sở mới (facility = cơ sở, nơi). (D) bẫy: anh từng thi đấu hồi đi học, không phải gần đây."}, {"n": 49, "q": "What does the woman ask the man to talk about?", "qvi": "Người phụ nữ đề nghị anh nói về điều gì?", "opts": [{"t": "His career path", "vi": "Con đường sự nghiệp"}, {"t": "His mentors", "vi": "Những người hướng dẫn anh"}, {"t": "His future goals", "vi": "Mục tiêu tương lai"}, {"t": "His hobbies", "vi": "Sở thích"}], "ans": ["A"], "key": "how did you get started in this line of work → career path", "ex": "Cô hỏi \"anh bắt đầu nghề này thế nào?\" → con đường sự nghiệp (career path)."}]}, {"title": "Hội thoại 50–52 · Ba người nói · Viện hải dương", "audio": "../../audio/amk4/c50.mp3", "script": [{"sp": "W1", "t": "As Director, I'm delighted to welcome you to the Redmond Aquatic Institute. (50) We're happy you'll be **producing content for our website**.", "vi": "Với tư cách giám đốc, tôi rất vui chào đón cô đến Viện Thủy sinh Redmond. Chúng tôi rất vui vì cô sẽ viết nội dung cho website của viện."}, {"sp": "W2", "t": "I'm looking forward to (50) **writing about** Redmond's initiatives in marine biology.", "vi": "Tôi rất mong được viết về các dự án sinh vật biển của Redmond."}, {"sp": "W1", "t": "Yes, the more articles the public can read about threats to aquatic ecosystems, the better. Public awareness will help us get funding to meet (51) our aim of **preserving these ecosystems**. This is Roberto. He's working on our mangrove research project, which is the first one you'll cover.", "vi": "Đúng vậy, công chúng càng đọc nhiều bài về các mối đe dọa với hệ sinh thái nước càng tốt. Nhận thức của công chúng giúp chúng tôi có kinh phí để đạt mục tiêu bảo tồn các hệ sinh thái này. Đây là Roberto. Anh ấy làm dự án nghiên cứu rừng ngập mặn, dự án đầu tiên cô sẽ viết."}, {"sp": "M", "t": "It's an interesting project. And (52) what's exciting is that we've started **using drones** to photograph the area with the mangroves. So we have some great images you could use.", "vi": "Dự án thú vị lắm. Điều hào hứng là chúng tôi đã bắt đầu dùng máy bay không người lái (drone) để chụp ảnh khu rừng ngập mặn. Nên có nhiều ảnh đẹp cho cô dùng."}], "qs": [{"n": 50, "q": "What has the woman been hired to do?", "qvi": "Người phụ nữ được thuê để làm gì?", "opts": [{"t": "Write articles", "vi": "Viết bài"}, {"t": "Update some software", "vi": "Cập nhật phần mềm"}, {"t": "Organize a fund-raiser", "vi": "Tổ chức gây quỹ"}, {"t": "Manage office staff", "vi": "Quản lý nhân viên văn phòng"}], "ans": ["A"], "key": "producing content, writing about → write articles", "ex": "Cô sẽ \"producing content for our website\" và \"writing about…\" → viết bài. (C) bẫy: có nhắc \"funding\" (kinh phí) nhưng cô không tổ chức gây quỹ."}, {"n": 51, "q": "According to the director, what is the organization's goal?", "qvi": "Theo giám đốc, mục tiêu của tổ chức là gì?", "opts": [{"t": "To hire professionals in the field", "vi": "Thuê chuyên gia trong ngành"}, {"t": "To create educational programs", "vi": "Tạo chương trình giáo dục"}, {"t": "To collect data from other scientific institutes", "vi": "Thu thập dữ liệu từ các viện khác"}, {"t": "To protect aquatic environments", "vi": "Bảo vệ môi trường dưới nước"}], "ans": ["D"], "key": "preserving these ecosystems → protect aquatic environments", "ex": "\"our aim of preserving these ecosystems\" (aim = goal; preserve = protect; aquatic ecosystems = aquatic environments)."}, {"n": 52, "q": "What does Roberto say is exciting?", "qvi": "Roberto nói điều gì thú vị?", "opts": [{"t": "The use of some equipment", "vi": "Việc dùng một thiết bị"}, {"t": "The results of a survey", "vi": "Kết quả khảo sát"}, {"t": "The public response to a project", "vi": "Phản hồi của công chúng"}, {"t": "A recent donation to the institute", "vi": "Khoản quyên góp mới"}], "ans": ["A"], "key": "using drones → the use of some equipment", "ex": "\"what's exciting is that we've started using drones\" → drone là một loại thiết bị (equipment)."}]}, {"title": "Hội thoại 53–55 · Cuộc họp ngân sách", "audio": "../../audio/amk4/c53.mp3", "script": [{"sp": "W", "t": "Matthew, you're not planning to cancel Wednesday's budget meeting, are you?", "vi": "Matthew, anh không định hủy cuộc họp ngân sách hôm thứ Tư chứ?"}, {"sp": "M", "t": "I haven't sent out the cancellation yet, but (53) our research partners in China are **off this week for a national holiday**, so there's no point in meeting. Why?", "vi": "Tôi chưa gửi thông báo hủy, nhưng đối tác nghiên cứu ở Trung Quốc nghỉ lễ quốc gia tuần này, nên họp cũng chẳng để làm gì. Sao vậy?"}, {"sp": "W", "t": "Well, I've been looking at the draft budget, and (54) **we didn't allocate funds for a project leader**.", "vi": "À, tôi đang xem bản dự thảo ngân sách, và chúng ta chưa phân bổ tiền cho trưởng dự án."}, {"sp": "M", "t": "Uh-oh. I wonder how that happened. You're right. We need to discuss how to fix that.", "vi": "Ôi. Không biết sao lại vậy. Cô nói đúng. Chúng ta cần bàn cách sửa."}, {"sp": "W", "t": "You know, we allocated money for a trip to Singapore to present our preliminary findings. (55) **We don't really need to do that.**", "vi": "Anh biết không, ta có phân bổ tiền cho chuyến đi Singapore để trình bày kết quả sơ bộ. Thật ra mình không cần làm việc đó."}], "qs": [{"n": 53, "q": "What does the man say about some contacts in China?", "qvi": "Người đàn ông nói gì về các đối tác ở Trung Quốc?", "opts": [{"t": "They submitted some preliminary results.", "vi": "Họ đã nộp kết quả sơ bộ."}, {"t": "They requested help with a presentation.", "vi": "Họ nhờ giúp bài thuyết trình."}, {"t": "They are celebrating a holiday.", "vi": "Họ đang nghỉ lễ."}, {"t": "They are coming to visit soon.", "vi": "Họ sắp đến thăm."}], "ans": ["C"], "key": "off for a national holiday → celebrating a holiday", "ex": "\"off this week for a national holiday\" → đang nghỉ lễ."}, {"n": 54, "q": "What does the woman imply when she says, \"we didn't allocate funds for a project leader\"?", "qvi": "Người phụ nữ ngụ ý gì khi nói \"chúng ta chưa phân bổ tiền cho trưởng dự án\"?", "opts": [{"t": "She thinks a project deadline should be extended.", "vi": "Nên lùi hạn dự án."}, {"t": "She is surprised by a suggestion.", "vi": "Cô ngạc nhiên vì một đề nghị."}, {"t": "A scheduled meeting should take place.", "vi": "Cuộc họp đã lên lịch vẫn nên diễn ra."}, {"t": "A project leader will not be hired.", "vi": "Sẽ không thuê trưởng dự án."}], "ans": ["C"], "key": "Câu ý định: hiểu theo ngữ cảnh", "ex": "Anh định hủy cuộc họp, cô nêu ra một lỗi trong ngân sách cần bàn → ý là cuộc họp vẫn nên diễn ra. Anh cũng đáp \"We need to discuss how to fix that\"."}, {"n": 55, "q": "What does the woman say about some travel expenses?", "qvi": "Người phụ nữ nói gì về chi phí đi lại?", "opts": [{"t": "They are unnecessary.", "vi": "Chúng không cần thiết."}, {"t": "They have been refunded.", "vi": "Đã được hoàn tiền."}, {"t": "They require receipts.", "vi": "Cần hóa đơn."}, {"t": "They were charged to the company credit card.", "vi": "Đã tính vào thẻ tín dụng công ty."}], "ans": ["A"], "key": "don't really need → unnecessary", "ex": "Tiền cho chuyến đi Singapore: \"We don't really need to do that\" → không cần thiết (unnecessary)."}]}, {"title": "Hội thoại 56–58 · Gọi hỗ trợ kỹ thuật", "audio": "../../audio/amk4/c56.mp3", "script": [{"sp": "M", "t": "Hello, you've reached tech support.", "vi": "Xin chào, đây là bộ phận hỗ trợ kỹ thuật."}, {"sp": "W", "t": "(56) I'm calling from **Rubin Restaurant Equipment**. I recently purchased your software (57) to **keep track of my warehouse inventory**, and I have a question about setting alerts.", "vi": "Tôi gọi từ công ty Thiết bị Nhà hàng Rubin. Tôi vừa mua phần mềm của anh để theo dõi hàng tồn kho, và tôi có câu hỏi về cài đặt cảnh báo."}, {"sp": "M", "t": "Sure, how can I help?", "vi": "Vâng, tôi giúp gì được ạ?"}, {"sp": "W", "t": "Well, we've been getting an alert whenever the inventory for our deep fryers drops below 10, but we usually don't stock many of those because restaurants don't often need to replace them. So, can I lower the alert level for just those items?", "vi": "Chúng tôi cứ nhận cảnh báo mỗi khi số nồi chiên trong kho xuống dưới 10, nhưng thường chúng tôi không trữ nhiều loại này vì nhà hàng ít khi thay. Tôi có thể hạ mức cảnh báo cho riêng mặt hàng đó không?"}, {"sp": "M", "t": "Yes. (58) In the system, if you click on that product, you'll see a link that says **set custom alert**, and you can set it to any number from there.", "vi": "Được. Trong hệ thống, chị bấm vào sản phẩm đó sẽ thấy đường link \"set custom alert\" (đặt cảnh báo riêng), rồi chị đặt số bất kỳ."}, {"sp": "W", "t": "I see it. Thanks for your help.", "vi": "Tôi thấy rồi. Cảm ơn anh."}], "qs": [{"n": 56, "q": "Where is the woman calling from?", "qvi": "Người phụ nữ gọi từ đâu?", "opts": [{"t": "A clothing store", "vi": "Cửa hàng quần áo"}, {"t": "A furniture store", "vi": "Cửa hàng nội thất"}, {"t": "A restaurant supply company", "vi": "Công ty cung cấp đồ nhà hàng"}, {"t": "A graphic design firm", "vi": "Công ty thiết kế đồ họa"}], "ans": ["C"], "key": "Restaurant Equipment → restaurant supply company", "ex": "Cô gọi từ \"Rubin Restaurant Equipment\" (thiết bị nhà hàng) và nói về nồi chiên (deep fryers) bán cho nhà hàng."}, {"n": 57, "q": "What is some software being used for?", "qvi": "Phần mềm được dùng để làm gì?", "opts": [{"t": "Inventory management", "vi": "Quản lý hàng tồn kho"}, {"t": "Employee performance reviews", "vi": "Đánh giá nhân viên"}, {"t": "Sales forecasting", "vi": "Dự báo doanh số"}, {"t": "Web site design", "vi": "Thiết kế website"}], "ans": ["A"], "key": "keep track of inventory → inventory management", "ex": "\"to keep track of my warehouse inventory\" (theo dõi hàng tồn kho) = quản lý hàng tồn kho."}, {"n": 58, "q": "What does the man help the woman do?", "qvi": "Người đàn ông giúp người phụ nữ làm gì?", "opts": [{"t": "Return a purchase", "vi": "Trả hàng"}, {"t": "Customize a setting", "vi": "Chỉnh một cài đặt theo ý mình"}, {"t": "Repair an engine", "vi": "Sửa động cơ"}, {"t": "Inspect a shipment", "vi": "Kiểm tra lô hàng"}], "ans": ["B"], "key": "set custom alert → customize a setting", "ex": "Anh chỉ cô cách \"set custom alert\" để đổi mức cảnh báo → tùy chỉnh cài đặt (custom → customize)."}]}, {"title": "Hội thoại 59–61 · Vườn thực vật", "audio": "../../audio/amk4/c59.mp3", "script": [{"sp": "W", "t": "I just spoke to (59) the **garden director**. (60) He wants us to **install an irrigation system** in the Rose Garden, as well as the Magnolia Grove. He wants to be sure the flowers get plenty of water during the hot summer months.", "vi": "Tôi vừa nói chuyện với giám đốc khu vườn. Ông ấy muốn chúng ta lắp hệ thống tưới nước ở Vườn Hồng và cả rừng Mộc Lan, để chắc chắn hoa được tưới đủ nước trong những tháng hè nóng."}, {"sp": "M", "t": "Okay, let's walk over there now and take some measurements. Then we can figure out what materials we'll need. (61) We have some extra parts left over from when we worked on the cherry trees. **I'll check what we have left** after we finish measuring the Rose Garden.", "vi": "Được, mình qua đó đo đạc luôn. Rồi tính xem cần vật liệu gì. Mình còn dư ít phụ tùng từ lần làm khu cây anh đào. Đo xong Vườn Hồng tôi sẽ kiểm tra xem còn những gì."}], "qs": [{"n": 59, "q": "Where are the speakers most likely working?", "qvi": "Những người nói có lẽ đang làm việc ở đâu?", "opts": [{"t": "At a flower shop", "vi": "Cửa hàng hoa"}, {"t": "At a botanical garden", "vi": "Vườn bách thảo"}, {"t": "At a fruit orchard", "vi": "Vườn cây ăn quả"}, {"t": "At a hardware store", "vi": "Cửa hàng đồ kim khí"}], "ans": ["B"], "key": "garden director, Rose Garden, Magnolia Grove → botanical garden", "ex": "Có \"garden director\", nhiều khu vườn (Rose Garden, Magnolia Grove, cherry trees) → vườn bách thảo. (A) bẫy liên tưởng tới hoa."}, {"n": 60, "q": "What have the speakers been asked to do?", "qvi": "Những người nói được yêu cầu làm gì?", "opts": [{"t": "Arrange some flowers", "vi": "Cắm hoa"}, {"t": "Deliver some tools", "vi": "Giao dụng cụ"}, {"t": "Install a watering system", "vi": "Lắp hệ thống tưới nước"}, {"t": "Repair a lawn mower", "vi": "Sửa máy cắt cỏ"}], "ans": ["C"], "key": "irrigation system → watering system", "ex": "\"install an irrigation system\" (hệ thống tưới tiêu) = watering system."}, {"n": 61, "q": "What does the man offer to do?", "qvi": "Người đàn ông đề nghị làm gì?", "opts": [{"t": "Look for some materials", "vi": "Tìm vật liệu"}, {"t": "Train an assistant", "vi": "Đào tạo trợ lý"}, {"t": "Transplant some trees", "vi": "Trồng lại cây"}, {"t": "Work extra hours", "vi": "Làm thêm giờ"}], "ans": ["A"], "key": "check what we have left → look for some materials", "ex": "Anh nói còn dư phụ tùng và \"I'll check what we have left\" → đi tìm/kiểm tra vật liệu."}]}, {"title": "Hội thoại 62–64 · Công ty cho thuê xe · Bản đồ", "audio": "../../audio/amk4/c62.mp3", "imgs": ["img/amk4/g62.webp"], "script": [{"sp": "M", "t": "Good morning, Ms. Aljohani. (62) **Sorry I'm a little late.** Traffic was terrible.", "vi": "Chào chị Aljohani. Xin lỗi tôi đến hơi muộn. Kẹt xe kinh khủng."}, {"sp": "W", "t": "That's okay, but our rental office will be very busy this morning. (63) There's a big **education convention** in town starting today, and a lot of attendees from out of town have reserved cars to get to the conference center.", "vi": "Không sao, nhưng sáng nay văn phòng cho thuê sẽ rất bận. Hôm nay bắt đầu một hội nghị giáo dục lớn trong thành phố, nhiều người từ nơi khác đã đặt xe để đến trung tâm hội nghị."}, {"sp": "M", "t": "Right. What do you want me to do first?", "vi": "Vâng. Chị muốn tôi làm gì trước?"}, {"sp": "W", "t": "(64) I'd like you to start by checking the batteries in our **electric cars**. We want to be sure they're all fully charged.", "vi": "Tôi muốn anh bắt đầu bằng việc kiểm tra pin của các xe ô tô điện. Phải chắc chắn tất cả đều sạc đầy."}], "qs": [{"n": 62, "q": "Why does the man apologize?", "qvi": "Vì sao người đàn ông xin lỗi?", "opts": [{"t": "He lost a key.", "vi": "Anh làm mất chìa khóa."}, {"t": "He arrived late.", "vi": "Anh đến muộn."}, {"t": "He turned off some equipment.", "vi": "Anh tắt một thiết bị."}, {"t": "He forgot an instruction manual.", "vi": "Anh quên sách hướng dẫn."}], "ans": ["B"], "key": "Sorry I'm a little late → arrived late", "ex": "\"Sorry I'm a little late\" → đến muộn (vì kẹt xe)."}, {"n": 63, "q": "According to the woman, why will the speakers be very busy today?", "qvi": "Theo người phụ nữ, vì sao hôm nay họ sẽ rất bận?", "opts": [{"t": "The agency is offering a discount.", "vi": "Công ty đang giảm giá."}, {"t": "A new rental office is opening.", "vi": "Một văn phòng mới khai trương."}, {"t": "There is a conference in town.", "vi": "Có một hội nghị trong thành phố."}, {"t": "A sporting event will take place.", "vi": "Sẽ có một sự kiện thể thao."}], "ans": ["C"], "key": "education convention → a conference", "ex": "convention = conference (hội nghị). Nhiều người đến dự đã đặt thuê xe."}, {"n": 64, "q": "Look at the graphic. Where will the man go first?", "qvi": "Nhìn bản đồ. Người đàn ông sẽ đến khu nào trước?", "opts": [{"t": "Area 1", "vi": "Khu 1"}, {"t": "Area 2", "vi": "Khu 2"}, {"t": "Area 3", "vi": "Khu 3"}, {"t": "Area 4", "vi": "Khu 4"}], "ans": ["B"], "key": "electric cars → Area 2", "ex": "Anh phải kiểm tra pin \"electric cars\" trước. Trên bản đồ, Electric cars nằm ở Area 2. (A) Area 1 là bẫy: cũng có chữ \"Electric\" nhưng là xe máy điện (electric scooters)."}]}, {"title": "Hội thoại 65–67 · Dự án trồng cây · Bảng", "audio": "../../audio/amk4/c65.mp3", "imgs": ["img/amk4/g65.webp"], "script": [{"sp": "M", "t": "I've been on vacation so I missed our department's meeting. Can you give me an update?", "vi": "Tôi đi nghỉ nên lỡ cuộc họp của phòng. Chị cập nhật giúp tôi nhé?"}, {"sp": "W", "t": "Well, (65) all our **public programs and community events** are on schedule.", "vi": "À, mọi chương trình công cộng và sự kiện cộng đồng của chúng ta đều đúng tiến độ."}, {"sp": "M", "t": "Great! How about the Janus Park project? We're still planning on planting trees best suited for residential areas, right?", "vi": "Tuyệt! Còn dự án công viên Janus? Ta vẫn định trồng loại cây hợp với khu dân cư nhất đúng không?"}, {"sp": "W", "t": "That's right. I'm working on the public education part now. (66) There'll be a **children's poster competition** next month, which the (65) **city mayor** will judge.", "vi": "Đúng vậy. Tôi đang làm phần giáo dục cộng đồng. Tháng sau sẽ có cuộc thi vẽ tranh cổ động cho trẻ em, thị trưởng thành phố sẽ chấm."}, {"sp": "M", "t": "Interesting. Is there a prize?", "vi": "Hay đấy. Có giải thưởng không?"}, {"sp": "W", "t": "The winner will get a ribbon. But all participants will get a seedling to plant at home. (67) We'll be giving away **the tallest** of these four varieties, since it was the most popular in a survey of our residents.", "vi": "Người thắng được một dải ruy băng. Nhưng mọi người tham gia đều được một cây giống mang về trồng. Chúng ta sẽ tặng loại cao nhất trong bốn loại này, vì nó được người dân thích nhất trong khảo sát."}], "qs": [{"n": 65, "q": "Where do the speakers most likely work?", "qvi": "Những người nói có lẽ làm việc ở đâu?", "opts": [{"t": "At a landscaping company", "vi": "Công ty cảnh quan"}, {"t": "At a local government office", "vi": "Cơ quan chính quyền địa phương"}, {"t": "At a garden store", "vi": "Cửa hàng làm vườn"}, {"t": "At a lumber yard", "vi": "Xưởng gỗ"}], "ans": ["B"], "key": "public programs, community events, city mayor, residents → local government", "ex": "Họ lo \"public programs\", \"community events\", công viên, khảo sát người dân, có thị trưởng chấm thi → làm ở cơ quan chính quyền địa phương."}, {"n": 66, "q": "What does the woman say will take place next month?", "qvi": "Người phụ nữ nói tháng sau sẽ có gì?", "opts": [{"t": "A seasonal promotion", "vi": "Khuyến mãi theo mùa"}, {"t": "A product demonstration", "vi": "Buổi giới thiệu sản phẩm"}, {"t": "A poster contest", "vi": "Cuộc thi vẽ tranh cổ động"}, {"t": "A lecture series", "vi": "Chuỗi bài giảng"}], "ans": ["C"], "key": "poster competition → poster contest", "ex": "competition = contest (cuộc thi)."}, {"n": 67, "q": "Look at the graphic. What kind of seedlings will be given away?", "qvi": "Nhìn bảng. Loại cây giống nào sẽ được tặng?", "opts": [{"t": "Eastern redbud", "vi": "Cây hồng tử kinh (Eastern redbud)"}, {"t": "Japanese maple", "vi": "Cây phong Nhật"}, {"t": "White fringe tree", "vi": "Cây hoa tua trắng"}, {"t": "Panicle hydrangea", "vi": "Cẩm tú cầu"}], "ans": ["A"], "key": "the tallest → 9 meters → Eastern redbud", "ex": "Họ tặng loại \"cao nhất\". Trong bảng, cao nhất là 9 m → Eastern redbud."}]}, {"title": "Hội thoại 68–70 · Quán cà phê · Biển ưu đãi", "audio": "../../audio/amk4/c68.mp3", "imgs": ["img/amk4/g68.webp"], "script": [{"sp": "M", "t": "Hi. (68) I'd like a **large black coffee** and an egg-and-cheese croissant, please.", "vi": "Chào chị. Cho tôi một ly cà phê đen lớn và một bánh sừng bò trứng phô mai."}, {"sp": "W", "t": "Sure. That'll be eight dollars. Are you a Shelby's preferred customer?", "vi": "Vâng. Của anh 8 đô. Anh có phải khách hàng thân thiết của Shelby's không?"}, {"sp": "M", "t": "No, I'm not. (69) But I do have an **EZ-Cash card**.", "vi": "Không phải. Nhưng tôi có thẻ EZ-Cash."}, {"sp": "W", "t": "Great. Let me bring that up for you.", "vi": "Tốt quá. Để tôi xử lý cho anh."}, {"sp": "M", "t": "By the way, I'd like to order breakfast for my team tomorrow morning. Can I place that order ahead of time?", "vi": "À, tôi muốn đặt bữa sáng cho cả nhóm vào sáng mai. Tôi đặt trước được không?"}, {"sp": "W", "t": "Sure. Would you like to do that now?", "vi": "Được ạ. Anh muốn đặt luôn bây giờ không?"}, {"sp": "M", "t": "No. (70) **I'll call you later today** when I know what everyone wants. Thanks for the information.", "vi": "Không. Chiều nay tôi sẽ gọi cho chị khi biết mọi người muốn ăn gì. Cảm ơn chị."}], "qs": [{"n": 68, "q": "Where does the conversation most likely take place?", "qvi": "Cuộc hội thoại có lẽ diễn ra ở đâu?", "opts": [{"t": "At a café", "vi": "Ở quán cà phê"}, {"t": "At an electronics shop", "vi": "Ở cửa hàng điện tử"}, {"t": "At a stationery store", "vi": "Ở cửa hàng văn phòng phẩm"}, {"t": "At a clothing store", "vi": "Ở cửa hàng quần áo"}], "ans": ["A"], "key": "black coffee, croissant → café", "ex": "Khách gọi cà phê và bánh sừng bò → quán cà phê."}, {"n": 69, "q": "Look at the graphic. How much will the man save on his purchase?", "qvi": "Nhìn biển. Người đàn ông sẽ được giảm bao nhiêu?", "opts": [{"t": "5%", "vi": "5%"}, {"t": "3%", "vi": "3%"}, {"t": "7%", "vi": "7%"}, {"t": "2%", "vi": "2%"}], "ans": ["D"], "key": "EZ-Cash card → Save 2%", "ex": "Anh không phải khách thân thiết (không được 7%) nhưng có thẻ EZ-Cash. Trên biển: \"Pay with EZ-Cash card → Save 2%\". (C) 7% là bẫy dành cho preferred customer."}, {"n": 70, "q": "What does the man say he will do later today?", "qvi": "Người đàn ông nói chiều nay anh sẽ làm gì?", "opts": [{"t": "Call a business", "vi": "Gọi điện cho cửa hàng"}, {"t": "Return some merchandise", "vi": "Trả lại hàng"}, {"t": "Fill out an online survey", "vi": "Làm khảo sát online"}, {"t": "Hang up some posters", "vi": "Treo áp phích"}], "ans": ["A"], "key": "I'll call you later today → call a business", "ex": "\"I'll call you later today\" (gọi cho quán) → call a business (business = cửa hàng, doanh nghiệp)."}]}], "recap": "<h2>Ghi nhớ sau bài<\/h2><p><b>Cặp từ nói lại ý (paraphrase):<\/b> storm → bad weather (33), special 50% off → discount (36), show you around → provide a tour (37), informal → casual (43), preserve → protect (51), drones → equipment (52), off for a holiday → celebrating a holiday (53), keep track of inventory → inventory management (57), irrigation → watering (60), convention → conference (63), competition → contest (66).<\/p><p><b>Câu hỏi nơi chốn / nghề nghiệp:<\/b> nghe các từ đặc trưng: Captain + port → boat, lift weights → gym, studio + viewers → TV studio, mayor + residents → local government.<\/p><p><b>Câu Look at the graphic:<\/b> 64 (electric cars → Area 2, cẩn thận electric scooters), 67 (the tallest → 9 m), 69 (EZ-Cash → 2%).<\/p>", "exam": "TOEIC-A-MOCK4", "examSrc": "/toeica-mocktest/"};</script>
